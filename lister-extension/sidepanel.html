<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<!-- Catalog thumbnails come from store CDNs; some of them refuse a chrome-extension:// referrer. -->
<meta name="referrer" content="no-referrer">
<title>Sweet Shelves Lister</title>
<link rel="stylesheet" href="sidepanel.css">
</head>
<body>
<!-- One header row: which store you are working, whether the server is there, and settings. -->
<header class="top">
  <div class="stores" role="tablist">
    <button id="storeEbay" class="store ebay" type="button" role="tab" aria-selected="true">eBay <span id="countEbay" class="n"></span></button>
    <button id="storeAmazon" class="store amazon" type="button" role="tab" aria-selected="false">Amazon <span id="countAmazon" class="n"></span></button>
    <button id="storeFb" class="store fb" type="button" role="tab" aria-selected="false" title="Facebook Marketplace: review, then one workbook for Facebook's bulk upload">FB <span id="countFb" class="n"></span></button>
    <button id="storeNew" class="store new" type="button" role="tab" aria-selected="false" title="Describe an item that is on no BOL yet">+ NEW</button>
  </div>
  <div class="sys">
    <button id="listedBtn" class="listedpill" type="button" title="Listed today through the Lister: open the record">&#x2713; <span id="countListedToday">0</span> today</button>
    <button id="connStatus" class="conn" type="button" title="Connection" aria-label="Connection"></button>
    <button id="themeBtn" class="icon" type="button" title="Day / night theme" aria-label="Toggle theme">🌙</button>
    <button id="settingsBtn" class="icon" type="button" title="Settings" aria-label="Settings">⚙</button>
  </div>
</header>

<!-- The way back out of an item, and the only place that says you are on a listing form. -->
<div id="crumb" class="crumb" hidden>
  <button id="backToQueue" class="back" type="button"><span aria-hidden="true">←</span> Back</button>
  <span id="crumbNow" class="now"></span>
  <span id="crumbLock" class="lockmark" hidden>● on the form</span>
</div>

<!-- Always in the layout, invisible until something runs, so its row never pushes the panel about. -->
<div id="busy" class="busy"><div class="bar"><i></i></div><span id="busyLabel"></span></div>

<section id="settings" class="card" hidden>
  <h2>Settings</h2>
  <label>Sweet Shelves server<input id="setServer" type="url" placeholder="https://pi.nexuscentralhq.org"></label>
  <label>Your name (shown on the ledger)<input id="setActor" type="text" placeholder="e.g. Dan"></label>
  <label class="check"><input id="setAutoFill" type="checkbox"> Fill automatically when a listing form opens</label>
  <label class="check"><input id="setAutoGuide" type="checkbox"> Highlight fields that still need a value after filling</label>
  <label class="check"><input id="setAutoLink" type="checkbox"> Record the listing automatically when the store confirms it (with Undo)</label>
  <label class="check"><input id="setAutoPrepare" type="checkbox"> Prepare title, price, specifics and description in the background</label>
  <label class="check"><input id="setFollowPlus" type="checkbox"> On Items to List, "+" adds to the store list open here only (eBay or Amazon)</label>
  <div id="autoBox"></div>
  <div class="row">
    <button id="saveSettings" class="primary" type="button">Save</button>
    <button id="openServer" type="button">Items to List</button>
    <button id="openLedger" type="button">Ledger</button>
    <button id="openUpdates" type="button">Update extension</button>
  </div>
  <p class="muted" id="versionLine"></p>
</section>

<section id="signin" class="card warn" hidden>
  <strong>Sign in to Sweet Shelves</strong>
  <p>The server needs your Cloudflare sign-in. Open it once in this browser, then come back.</p>
  <button id="signinBtn" class="primary" type="button">Open sign-in page</button>
</section>

<aside id="listedDrawer" class="drawer" hidden aria-label="Listed through the Lister">
  <div class="drawer-head">
    <strong class="grow">✓ Listed through the Lister</strong>
    <button id="listedReload" class="icon" type="button" title="Reload" aria-label="Reload">↻</button>
    <button id="listedClose" class="icon" type="button" title="Close" aria-label="Close">×</button>
  </div>
  <div class="drawer-filters">
    <div class="seg small" role="tablist" title="When">
      <button class="seg-btn active" data-range="today" type="button">Today</button>
      <button class="seg-btn" data-range="yesterday" type="button">Yesterday</button>
      <button class="seg-btn" data-range="7" type="button">7 days</button>
      <button class="seg-btn" data-range="30" type="button">30 days</button>
      <button class="seg-btn" data-range="all" type="button">All</button>
    </div>
    <div class="seg small" role="tablist" title="Store">
      <button class="seg-btn active" data-store="all" type="button">Both</button>
      <button class="seg-btn" data-store="ebay" type="button">eBay</button>
      <button class="seg-btn" data-store="amazon" type="button">Amazon</button>
    </div>
  </div>
  <div id="listedSummary" class="drawer-summary"></div>
  <div id="listedList" class="list"></div>
</aside>

<!-- Only what is being decided or has gone wrong; where you are is the action bar's job. -->
<section id="pageCard" class="notice" hidden></section>

<section id="pickCard" class="card pick" hidden></section>

<section id="listCard" class="queue">
  <!-- Listings left half done: one click back onto the form they were left on. -->
  <div id="sessionCard" class="resume" hidden></div>
  <div id="preloadBar" class="preloadbar" hidden></div>
  <div class="listacts">
    <button id="addItems" class="addbtn" type="button" title="Opens Items to List in a new tab. Press + there and the item shows up here right away."><span class="addplus" aria-hidden="true">+</span><span class="addtxt"><b>Add items</b><small>from Items to List &#x2197;</small></span></button>
    <div class="lstack">
      <button id="preloadAll" class="lact go" type="button" title="Prepare every queued item in the background: listing values plus the AI title, description and photos that are switched on">&#x26a1; Preload all</button>
      <button id="statusBlocked" class="lact danger" type="button" aria-pressed="false" hidden title="Amazon will not take these from us: show only them">Blocked <span class="n"></span></button>
      <button id="clearAll" class="lact danger" type="button" title="Take every queued item off this store's list">Clear all</button>
    </div>
  </div>
  <div id="itemList" class="list"></div>
</section>

<!-- "+ NEW": three numbered steps in one card. The barcode is done here; the name, the details
     and the photos come from the phone, which the blue Phone pill messages. Each step keeps its
     own container so a photo arriving never rebuilds the field somebody is typing in. -->
<section id="newCard" class="newitem" hidden>
  <div id="newEmpty" class="card" hidden></div>
  <div id="newSteps" class="card steps" hidden>
    <div id="newHead"></div>
    <div id="newFields"></div>
    <div id="newPhotos"></div>
  </div>
</section>

<div id="editor" class="editor" hidden></div>

<section id="detail" class="detail" hidden></section>

<!-- FB: Facebook Marketplace has no listing API. Items are reviewed here and go into Facebook's own
     bulk-upload workbook, which is uploaded on Facebook (sidepanel-fb.js). -->
<section id="fbCard" class="fbview" hidden></section>

<section id="confirm" class="confirm" hidden></section>

<div id="modal" class="modal" hidden></div>

<div id="toastWrap" class="toastwrap" hidden><span id="toast" role="status"></span><button id="toastAction" class="link" type="button" hidden></button></div>

<!-- The one next thing to do, always in the same place. -->
<footer class="actionbar">
  <button id="goBtn" class="go" type="button">Start</button>
  <button id="moreBtn" class="more" type="button" title="Other things you can do here" aria-label="Other actions">⋯</button>
</footer>

<script src="matcher.js"></script>
<script src="sidepanel-fb.js"></script>
<script src="sidepanel.js"></script>
</body>
</html>
