<!DOCTYPE html>
<html lang="en">
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Input Barcode</title>
    <style>
        body {
            font-family: sans-serif;
            max-width: 600px;
            margin: auto;
            padding: 10px;
        }

        #reader {
            width: 100%;
            margin-top: 20px;
            height: 300px;
            background: #222;
            border-radius: 8px;
            position: relative;
            overflow: hidden;
        }

        input[type="text"] {
            width: 100%;
            font-size: 1.2em;
            padding: 10px;
            margin-top: 20px;
        }

        button {
            font-size: 18px;
            padding: 10px 20px;
            margin-top: 10px;
        }

        #scanner-overlay {
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            pointer-events: none;
            z-index: 2;
        }

        .scanner-line {
            position: absolute;
            left: 0;
            width: 100%;
            height: 3px;
            background: red;
            animation: scan-move 2s linear infinite;
            opacity: 0.8;
        }

        @keyframes scan-move {
            0% { top: 0; }
            100% { top: 100%; }
        }
    </style>
</head>
<body>
    <h1>Set BARCODE </h1>

    <div id="reader" style="position: relative; width: 100%; height: 300px; background: #222; border-radius: 8px; overflow: hidden;">
        <div id="scanner-overlay">
            <div class="scanner-line"></div>
        </div>
    </div>

    <form type="text" id="scan_form" action="/submitbarcode" method="POST">
        <input name="scanned_result" type="text" id="scanned_result" placeholder="Scanned code will appear here">

    </form>



    <button onclick="restartScanner()">Restart Scanner</button>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/quagga/0.12.1/quagga.min.js"></script>
<script>
    let scannerActive = false;

    function startScanner() {
        if (scannerActive) return;
        scannerActive = true;
        Quagga.init({
            inputStream: {
                name: "Live",
                type: "LiveStream",
                target: document.querySelector('#reader'),
                constraints: {
                    facingMode: "environment"
                },
            },
            decoder: {
                readers: ["code_128_reader", "ean_reader", "ean_8_reader", "code_39_reader", "code_39_vin_reader", "codabar_reader", "upc_reader", "upc_e_reader", "i2of5_reader", "2of5_reader", "code_93_reader"]
            },
            locate: true
        }, function (err) {
            if (err) {
                console.error(err);
                scannerActive = false;
                return;
            }
            Quagga.start();
        });

        Quagga.onDetected(function (result) {
            if (result && result.codeResult && result.codeResult.code) {
                const code = result.codeResult.code;
                document.getElementById("scanned_result").value = code;


                Quagga.stop();
                scannerActive = false;

                document.getElementById("scan_form").submit();  // ← submit form to Flask
            }
        });

    }
    function restartScanner() {
        if (scannerActive) {
            Quagga.stop();
            scannerActive = false;
        }
        startScanner();
    }

    window.addEventListener('load', startScanner);
</script>

</body>
</html>
