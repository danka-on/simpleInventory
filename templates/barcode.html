<!DOCTYPE html>
<html lang="en">
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Scanner</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <style>
        body {
            font-family: sans-serif;
            max-width: 600px;
            margin: auto;
            padding: 10px;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            background-color: #E0F7FA; /* Light teal background */
        }
        #reader {
            width: 100%;
            max-width: 300px;
            margin-top: 20px;
            aspect-ratio: 1/1;
            background: #222;
            border-radius: 8px;
            position: relative;
            overflow: hidden;
        }
        
        /* Scanning line animation */
        .scanning-line {
            position: absolute;
            left: 0;
            right: 0;
            height: 4px;
            background: linear-gradient(90deg, rgba(0, 255, 0, 0), rgba(0, 255, 0, 0.8), rgba(0, 255, 0, 0));
            animation: scan 2s linear infinite;
            z-index: 10;
            box-shadow: 0 0 10px rgba(0, 255, 0, 0.5);
            border-radius: 2px;
        }
        
        @keyframes scan {
            0% { top: 0; opacity: 0.8; }
            50% { opacity: 1; }
            100% { top: 100%; opacity: 0.8; }
        }
        #reader video {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        input[type="text"] {
            width: 100%;
            font-size: 1.2em;
            padding: 10px;
            margin-top: 20px;
        }
        button {
            font-size: 18px;
            padding: 10px 20px;
            margin-top: 10px;
            cursor: pointer;
        }
        #loadingMessage {
            color: black;
            text-align: center;
            padding: 20px;
            position: absolute;
            top: 50%;
            left: 0;
            right: 0;
            transform: translateY(-50%);
            z-index: 1;
        }
        #upload-spinner {
            display: none;
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            z-index: 1000;
            text-align: center;
        }
    </style>
    <!-- Barcode font removed as per request -->
</head>
<body>
    <div class="barcode-icon" style="display: flex; justify-content: center; align-items: center; width: 100%; margin-bottom: 10px;">
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 170" width="90%" height="60">
            <rect x="10" y="10" width="8" height="150" fill="#000"/>
            <rect x="24" y="10" width="2" height="150" fill="#000"/>
            <rect x="32" y="10" width="8" height="150" fill="#000"/>
            <rect x="46" y="10" width="16" height="150" fill="#000"/>
            <rect x="68" y="10" width="4" height="150" fill="#000"/>
            <rect x="78" y="10" width="12" height="150" fill="#000"/>
            <rect x="96" y="10" width="8" height="150" fill="#000"/>
            <rect x="110" y="10" width="16" height="150" fill="#000"/>
            <rect x="132" y="10" width="4" height="150" fill="#000"/>
            <rect x="142" y="10" width="2" height="150" fill="#000"/>
            <rect x="150" y="10" width="8" height="150" fill="#000"/>
            <rect x="164" y="10" width="6" height="150" fill="#000"/>

            <rect x="226" y="10" width="8" height="150" fill="#000"/>
            <rect x="240" y="10" width="2" height="150" fill="#000"/>
            <rect x="248" y="10" width="6" height="150" fill="#000"/>
            <rect x="260" y="10" width="14" height="150" fill="#000"/>
            <rect x="280" y="10" width="4" height="150" fill="#000"/>
            <rect x="290" y="10" width="12" height="150" fill="#000"/>
            <rect x="308" y="10" width="6" height="150" fill="#000"/>
            <rect x="320" y="10" width="8" height="150" fill="#000"/>
            <rect x="334" y="10" width="14" height="150" fill="#000"/>
            <rect x="354" y="10" width="6" height="150" fill="#000"/>
            <rect x="366" y="10" width="2" height="150" fill="#000"/>
            <rect x="374" y="10" width="8" height="150" fill="#000"/>
            <rect x="388" y="10" width="12" height="150" fill="#000"/>
            <rect x="406" y="10" width="4" height="150" fill="#000"/>
            <rect x="416" y="10" width="4" height="150" fill="#000"/>
            <rect x="426" y="10" width="16" height="150" fill="#000"/>
            <rect x="448" y="10" width="8" height="150" fill="#000"/>
            <rect x="462" y="10" width="4" height="150" fill="#000"/>
            <rect x="472" y="10" width="6" height="150" fill="#000"/>
            <rect x="484" y="10" width="12" height="150" fill="#000"/>
        </svg>
    </div>
    <div id="reader">
        <video id="video" playsinline="true" style="width: 100%; height: 100%; object-fit: cover;"></video>
        <div id="loadingMessage" style="color: white;">⌛ Loading video...</div>
        <div id="scanningLine" class="scanning-line" style="display: none;"></div>
    </div>
    <form id="scan_form" action="/submitbarcode" method="POST">
        <input name="scanned_result" type="text" id="scanned_result" placeholder="BARCODE will appear here" style="font-weight: bold;" readonly>
    </form>

    <div style="margin: 20px 0; display: flex; flex-direction: column; gap: 15px; width: 100%; max-width: 300px;">
        <button onclick="restartScanner()" style="background-color: #2196F3; color: white; border: none; padding: 12px; border-radius: 6px; cursor: pointer; font-size: 1.1em; display: flex; align-items: center; justify-content: center; gap: 8px;">
            <i class="fas fa-sync-alt"></i> Restart Scanner
        </button>
    </div>
    <!-- ZXing Library -->
    <script src="https://unpkg.com/@zxing/library@0.19.1/umd/index.min.js"></script>
    
    <script>
        // DOM Elements
        const video = document.getElementById('video');
        const loadingMessage = document.getElementById('loadingMessage');
        const scannedResultInput = document.getElementById('scanned_result');
        
        // ZXing variables
        let codeReader = null;
        let isScanning = false;
        let stream = null;
        let audioCtx = null;
        let audioUnlocked = false;

        // Macy barcode filtering
        let allowedUPCs = [];
        let upcListLoaded = false;

        // Web Audio API beep logic
        function unlockAudio() {
            if (!audioUnlocked) {
                audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                let buffer = audioCtx.createBuffer(1, 1, 22050);
                let source = audioCtx.createBufferSource();
                source.buffer = buffer;
                source.connect(audioCtx.destination);
                source.start(0);
                audioUnlocked = true;
            }
        }

        function playBeep() {
            if (!audioCtx) return;
            const duration = 0.1;
            const oscillator = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            oscillator.type = 'sine';
            oscillator.frequency.value = 880;
            gain.gain.value = 0.2;
            oscillator.connect(gain);
            gain.connect(audioCtx.destination);
            oscillator.start();
            oscillator.stop(audioCtx.currentTime + duration);
            oscillator.onended = () => {
                oscillator.disconnect();
                gain.disconnect();
            };
        }
        
        // Initialize the barcode scanner
        async function initScanner() {
            try {
                console.log('Initializing ZXing barcode scanner...');
                
                // Create code reader with only the allowed formats
                codeReader = new ZXing.BrowserMultiFormatReader();
                
                // Set optimized hints for better performance
                const hints = new Map();
                hints.set(ZXing.DecodeHintType.TRY_HARDER, false);  // Disable for faster scanning
                hints.set(ZXing.DecodeHintType.POSSIBLE_FORMATS, [
                    ZXing.BarcodeFormat.EAN_13,
                    ZXing.BarcodeFormat.UPC_A,
                    //ZXing.BarcodeFormat.CODE_128,
                    ZXing.BarcodeFormat.UPC_A,
                    ZXing.BarcodeFormat.UPC_E
                ]);
                codeReader.hints = hints;
                
                console.log('ZXing code reader created');
                
                // Skip device listing as it's causing issues
                console.log('Skipping device listing for better performance');
                
                // Start decoding with default camera
                console.log('Starting barcode scanner with default camera...');
                
                // Reset the video element
                if (video.srcObject) {
                    video.srcObject.getTracks().forEach(track => track.stop());
                }
                video.srcObject = null;
                
                // Restrict formats to EAN_13, UPC_A, and UPC_E only
                await codeReader.decodeFromVideoDevice(
                    undefined, // Let the browser choose the default camera
                    'video',
                    (result, error) => {
                        if (result) {
                            const code = result.getText().trim();
                            // Only accept allowed formats
                            const allowedFormats = [
                                ZXing.BarcodeFormat.EAN_13,
                                ZXing.BarcodeFormat.UPC_A,
                                ZXing.BarcodeFormat.UPC_E
                            ];
                            if (!allowedFormats.includes(result.getBarcodeFormat())) {
                                // Ignore QR codes and other types
                                return;
                            }
                            // If code is in allowedUPCs, proceed as normal
                            // If not, still proceed (no alert, no block)
                            // (Optional: you could add a console.log or visual indicator for unknown barcodes)
                            scannedResultInput.value = code;
                            // Set sessionStorage for additem checklist
                            sessionStorage.setItem('barcode', code);
                            playBeep();
                            const scanBox = document.querySelector('.scan-box');
                            if (scanBox) {
                                scanBox.style.borderColor = '#4CAF50';
                                scanBox.style.boxShadow = '0 0 20px #4CAF50';
                                setTimeout(() => {
                                    scanBox.style.borderColor = 'white';
                                    scanBox.style.boxShadow = '0 0 0 100vmax rgba(0, 0, 0, 0.5)';
                                }, 1000);
                            }
                            if (!window.__barcodeSubmitted) {
                                window.__barcodeSubmitted = true;
                                scannedResultInput.readOnly = true;
                                const restartBtn = document.querySelector('button[onclick="restartScanner()"]');
                                if (restartBtn) restartBtn.disabled = true;
                                if (codeReader) codeReader.reset();
                                setTimeout(() => {
                                    const form = document.getElementById('scan_form');
                                    if (form) {
                                        form.submit();
                                    } else {
                                        console.error('Form element not found');
                                    }
                                }, 200);
                            }
                        }
                        if (error && !(error instanceof ZXing.NotFoundException)) {
                            console.error('Scan error:', error);
                        }
                    },
                    {
                        delayBetweenScanAttempts: 100,
                        delayBetweenScanSuccess: 100,
                        tryPlayVideoTimeout: 2000,
                        formats: [
                            ZXing.BarcodeFormat.EAN_13,
                            ZXing.BarcodeFormat.UPC_A,
                            ZXing.BarcodeFormat.UPC_E
                        ]
                    }
                );
                
                console.log('Barcode scanner started successfully');
                loadingMessage.style.display = 'none';
                
            } catch (error) {
                console.error('Error initializing scanner:', error);
                showCameraError('Error initializing barcode scanner: ' + (error.message || 'Unknown error'));
                
                // Try to restart the scanner after an error
                setTimeout(() => {
                    console.log('Attempting to restart scanner...');
                    initScanner();
                }, 2000);
            }
        }
        
        // Stop the scanner and release resources
        async function stopScanner() {
            // Hide scanning line when stopping
            document.getElementById('scanningLine').style.display = 'none';
            
            if (codeReader) {
                try { await codeReader.reset(); } catch (e) { console.warn('Error resetting codeReader:', e); }
                codeReader = null;
            }
            if (stream) {
                try { stream.getTracks().forEach(track => track.stop()); } catch (e) { console.warn('Error stopping stream:', e); }
                stream = null;
            }
            video.srcObject = null;
        }

        // Restart scanner function
        async function restartScanner() {
            await stopScanner();
            scannedResultInput.value = '';
            scannedResultInput.readOnly = false;
            window.__barcodeSubmitted = false;
            const restartBtn = document.querySelector('button[onclick="restartScanner()"]');
            if (restartBtn) restartBtn.disabled = false;
            loadingMessage.style.display = '';
            loadingMessage.textContent = 'Restarting camera...';
            setTimeout(() => {
                initializeCamera();
            }, 300);
        }
        
        // Check if the browser supports mediaDevices
        function hasGetUserMedia() {
            return !!(navigator.mediaDevices && navigator.mediaDevices.getUserMedia);
        }

        // Check if the browser supports the permissions API
        async function checkCameraPermission() {
            if (!navigator.permissions) return null;
            try {
                const permissionStatus = await navigator.permissions.query({ name: 'camera' });
                return permissionStatus.state;
            } catch (e) {
                console.warn('Permissions API not supported:', e);
                return null;
            }
        }

        // Show a user-friendly error message
        function showCameraError(message) {
            console.error('Camera Error:', message);
            loadingMessage.textContent = message;
            loadingMessage.style.color = '#ff4444';
            
            // Add a retry button
            const retryButton = document.createElement('button');
            retryButton.textContent = 'Retry';
            retryButton.style.marginTop = '10px';
            retryButton.style.padding = '8px 16px';
            retryButton.onclick = initializeCamera;
            
            // Clear previous content and add new message with retry button
            loadingMessage.innerHTML = '';
            loadingMessage.appendChild(document.createTextNode(message));
            loadingMessage.appendChild(document.createElement('br'));
            loadingMessage.appendChild(retryButton);
        }

        // Debug function to log camera capabilities
        async function logCameraCapabilities(track) {
            if (!track || !track.getCapabilities) return;
            
            try {
                const capabilities = track.getCapabilities();
                const settings = track.getSettings();
                console.log('Camera Capabilities:', capabilities);
                console.log('Camera Settings:', settings);
                
                // Log supported constraints
                const supportedConstraints = navigator.mediaDevices.getSupportedConstraints();
                console.log('Supported Constraints:', supportedConstraints);
                
            } catch (e) {
                console.warn('Could not get camera capabilities:', e);
            }
        }

        // Initialize camera with appropriate constraints
        async function initializeCamera() {
            console.log('Starting camera initialization...');
            loadingMessage.textContent = 'Initializing camera...';
            loadingMessage.style.color = 'white';
            
            if (!hasGetUserMedia()) {
                const errorMsg = 'Your browser does not support camera access. Please try a modern browser like Chrome or Firefox.';
                console.error(errorMsg);
                showCameraError(errorMsg);
                return;
            }

            // Reset any existing stream
            if (stream) {
                stream.getTracks().forEach(track => track.stop());
                stream = null;
            }

            try {
                console.log('Requesting camera access...');
                
                // First try with basic constraints
                const constraints = {
                    video: {
                        width: { ideal: 1280 },
                        height: { ideal: 720 },
                        facingMode: 'environment'
                    },
                    audio: false
                };

                console.log('Trying with constraints:', JSON.stringify(constraints));
                
                // Request camera access
                const mediaStream = await navigator.mediaDevices.getUserMedia(constraints)
                    .catch(async (err) => {
                        console.warn('Error with ideal constraints, trying more permissive...', err);
                        // Try with minimal constraints
                        return navigator.mediaDevices.getUserMedia({
                            video: true,
                            audio: false
                        });
                    });

                console.log('Got media stream:', mediaStream);
                
                // Check if we got a video track
                const videoTracks = mediaStream.getVideoTracks();
                if (videoTracks.length === 0) {
                    throw new Error('No video track found in the stream');
                }

                // Log camera capabilities
                logCameraCapabilities(videoTracks[0]);
                
                // Set up the video element
                stream = mediaStream;
                video.srcObject = stream;
                
                // Handle video play promise
                console.log('Attempting to play video...');
                try {
                    await video.play();
                    console.log('Video is playing');
                    // Show scanning line when video starts playing
                    document.getElementById('scanningLine').style.display = 'block';
                } catch (playError) {
                    console.error('Error playing video:', playError);
                    // Try again with autoplay attribute
                    video.setAttribute('autoplay', '');
                    video.setAttribute('muted', '');
                    video.setAttribute('playsinline', '');
                    try {
                        await video.play();
                        console.log('Video is playing after retry');
                        // Show scanning line when video starts playing after retry
                        document.getElementById('scanningLine').style.display = 'block';
                    } catch (retryError) {
                        console.error('Still could not play video:', retryError);
                        throw new Error('Could not start the camera feed: ' + (retryError.message || 'Unknown error'));
                    }
                }

                // Show that camera is ready
                console.log('Camera is ready, initializing scanner...');
                loadingMessage.textContent = 'Ready to scan...';
                
                // Small delay before initializing scanner to ensure video is displayed
                setTimeout(async () => {
                    try {
                        await initScanner();
                        loadingMessage.style.display = 'none';
                    } catch (scannerError) {
                        console.error('Scanner initialization failed:', scannerError);
                        showCameraError('Scanner error: ' + (scannerError.message || 'Unknown error'));
                    }
                }, 500);
                
            } catch (err) {
                console.error('Camera initialization failed:', err);
                let errorMessage = 'Failed to access the camera. ';
                
                if (err.name === 'NotAllowedError') {
                    errorMessage = 'Camera access was denied. Please allow camera access in your browser settings and refresh the page.';
                } else if (err.name === 'NotFoundError' || err.name === 'DevicesNotFoundError') {
                    errorMessage = 'No camera found on this device.';
                } else if (err.name === 'NotReadableError' || err.name === 'TrackStartError') {
                    errorMessage = 'The camera is already in use by another application.';
                } else if (err.name === 'OverconstrainedError' || err.name === 'ConstraintNotSatisfiedError') {
                    errorMessage = 'The requested camera configuration is not supported. ' + (err.message || '');
                } else if (err.name === 'NotSupportedError') {
                    errorMessage = 'Camera access is not supported in this browser. Try Chrome or Firefox on Android, or Safari on iOS.';
                } else {
                    errorMessage += 'Error: ' + (err.message || 'Please try again or check your browser settings.');
                }
                
                showCameraError(errorMessage);
                
                // Clean up if there was an error after getting the stream
                if (stream) {
                    stream.getTracks().forEach(track => track.stop());
                    stream = null;
                }
            }
        }

        // Fetch allowed UPCs from backend on page load
        async function fetchAllowedUPCs() {
            try {
                const response = await fetch('/get_bol_upcs');
                const data = await response.json();
                if (data.upcs) {
                    allowedUPCs = data.upcs.map(String); // ensure all are strings
                    upcListLoaded = true;
                } else {
                    allowedUPCs = [];
                    upcListLoaded = false;
                }
            } catch (e) {
                allowedUPCs = [];
                upcListLoaded = false;
            }
        }

        // Show spinner/status if upload is in progress, or redirect if error
        function checkPictureUploadStatus() {
            const status = sessionStorage.getItem('pictureposition_upload_status');
            // Only check if we actually just came from pictureposition
            if (!window.location.search.includes('pictureposition=1')) return;
            if (status === 'uploading') {
                showUploadSpinner();
                // Poll until done or error
                const interval = setInterval(() => {
                    const s = sessionStorage.getItem('pictureposition_upload_status');
                    if (s === 'done') {
                        hideUploadSpinner();
                        clearInterval(interval);
                    } else if (s === 'error' || s === null) {
                        clearInterval(interval);
                        window.location.href = '/pictureposition?error=1';
                    }
                }, 500);
            } else if (status === 'error' || status === null) {
                window.location.href = '/pictureposition?error=1';
            } else {
                // If status is not uploading or error, do nothing (let user proceed)
                hideUploadSpinner();
            }
        }

        function showUploadSpinner() {
            let spinner = document.getElementById('upload-spinner');
            if (!spinner) {
                spinner = document.createElement('div');
                spinner.id = 'upload-spinner';
                spinner.innerHTML = '<div style="margin:30px auto;text-align:center;"><span style="font-size:1.2em;">Uploading picture...</span><br><svg width="40" height="40" viewBox="0 0 40 40"><circle cx="20" cy="20" r="18" stroke="#1976d2" stroke-width="4" fill="none" stroke-dasharray="90" stroke-dashoffset="60"><animateTransform attributeName="transform" type="rotate" from="0 20 20" to="360 20 20" dur="1s" repeatCount="indefinite"/></circle></svg></div>';
                document.body.appendChild(spinner);
            } else {
                spinner.style.display = '';
            }
        }
        function hideUploadSpinner() {
            let spinner = document.getElementById('upload-spinner');
            if (spinner) spinner.style.display = 'none';
        }
        
        // On load, check if redirected from pictureposition and send the image path to backend
        if (window.location.search.includes('pictureposition=1')) {
            const path = sessionStorage.getItem('pictureposition_path');
            if (path) {
                // Send to backend to set global variable
                fetch('/set_pictureposition_path', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ path })
                }).then(() => {
                    // Optionally clear from sessionStorage
                    // sessionStorage.removeItem('pictureposition_path');
                });
            }
            // Check upload status
            checkPictureUploadStatus();
        }

        // Initialize everything when the page loads
        document.addEventListener('DOMContentLoaded', () => {
            // Unlock audio on user interaction
            window.addEventListener('touchstart', unlockAudio, { once: true });
            window.addEventListener('mousedown', unlockAudio, { once: true });
            // Add a small delay to ensure the DOM is fully loaded
            setTimeout(initializeCamera, 100);
            // Fetch allowed UPCs
            fetchAllowedUPCs();
            // On load, check upload status only if redirected from pictureposition
            if (window.location.search.includes('pictureposition=1')) {
                checkPictureUploadStatus();
            }
            // PERSIST BARCODE: If barcode exists in sessionStorage, pre-fill input
            const storedBarcode = sessionStorage.getItem('barcode');
            if (storedBarcode) {
                scannedResultInput.value = storedBarcode;
                scannedResultInput.style.background = '#e0ffe0';
            }
        });
        
        // Clean up on page unload
        window.addEventListener('unload', () => {
            if (codeReader) {
                codeReader.reset();
            }
            if (stream) {
                stream.getTracks().forEach(track => track.stop());
            }
        });

        // On skip, if barcode exists in sessionStorage, keep it. If not, do nothing (let backend handle empty).
        document.getElementById('skipForm').addEventListener('submit', function(e) {
            const storedBarcode = sessionStorage.getItem('barcode');
            if (storedBarcode) {
                // If barcode exists, submit it instead of empty
                this.querySelector('input[name="scanned_result"]').value = storedBarcode;
            }
        });
    </script>
    
    <!-- Navigation Buttons at Bottom -->
    <div style="margin-top: 30px; width: 100%; display: flex; justify-content: center; gap: 15px; padding: 20px 0; border-top: 1px solid #eee;">
        <a href="/position" style="text-decoration: none; flex: 1; max-width: 200px;">
            <button style="background-color: #6c757d; color: white; border: none; padding: 10px 24px; border-radius: 6px; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 8px; font-size: 1.1em; width: 100%;">
                <i class="fas fa-arrow-left"></i> Back
            </button>
        </a>
        <form id="skipForm" action="/submitbarcode" method="POST" style="flex: 1; max-width: 200px; margin: 0;">
            <input type="hidden" name="scanned_result" value="">
            <button type="submit" style="background-color: #ffc107; color: #000; border: none; padding: 10px 24px; border-radius: 6px; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 8px; font-size: 1.1em; width: 100%;">
                <i class="fas fa-forward"></i> Skip
            </button>
        </form>
        <a href="/" style="text-decoration: none; flex: 1; max-width: 200px;">
            <button style="background-color: #ff4444; color: white; border: none; padding: 10px 24px; border-radius: 6px; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 8px; font-size: 1.1em; width: 100%;">
                <i class="fas fa-times"></i> Exit
            </button>
        </a>
    </div>
</body>
</html>
