    <script src="/static/barcode-entry-state.js?v=20260413b"></script>
    <script>
        // DOM Elements
        const scannedResultInput = document.getElementById('scanned_result');
        const barcodeInput = document.getElementById('barcodeTextInput');
        const t = (key, fallback) => (window.i18n && window.i18n.t) ? window.i18n.t(key) : fallback;
        const invalidModal = document.getElementById('invalidModal');
        const invalidModalClose = document.getElementById('invalidModalClose');
        const missingTitleModal = document.getElementById('missingTitleModal');
        const missingTitleBarcodeText = document.getElementById('missingTitleBarcodeText');
        const missingTitleKeyboardBtn = document.getElementById('missingTitleKeyboardBtn');
        const missingTitleInput = document.getElementById('missingTitleInput');
        const missingTitleSkipBtn = document.getElementById('missingTitleSkipBtn');
        const missingTitleSaveBtn = document.getElementById('missingTitleSaveBtn');
        const barcodeEntryState = window.BarcodeEntryState;
        const MANUAL_TITLE_STORAGE_KEY = 'additem_manual_titles';
        const MANUAL_TITLE_SKIP_STORAGE_KEY = 'additem_manual_title_skips';
        let invalidModalOpen = false;
        let missingTitleModalOpen = false;
        let missingTitleModalResolver = null;
        let missingTitleKeyboardTapRequired = false;
        const SINGLE_SCAN_CAPTURE_MS = 700;
        let pendingSingleBarcode = '';
        let pendingSingleSuffix = 0;
        let pendingSingleSubmitTimer = null;
        let barcodeScanQueue = Promise.resolve();
        const screeningCache = new Map();

        // Macy barcode filtering
        let allowedUPCs = [];
        let upcListLoaded = false;

        // Web Audio API beep logic
        let audioUnlocked = false;
        let audioCtx = null;
        function unlockAudio() {
            if (!audioUnlocked) {
                audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                let buffer = audioCtx.createBuffer(1, 1, 22050);
                let source = audioCtx.createBufferSource();
                source.buffer = buffer;
                source.connect(audioCtx.destination);
                source.start(0);
                audioUnlocked = true;
            }
        }

        function playBeep() {
            try {
                var ctx = window.audioCtx || new (window.AudioContext || window.webkitAudioContext)();
                window.audioCtx = ctx;
                audioCtx = ctx;
                const duration = 0.15;
                const oscillator = ctx.createOscillator();
                const gain = ctx.createGain();
                oscillator.type = 'sine';
                oscillator.frequency.value = 880;
                gain.gain.value = 0.2;
                oscillator.connect(gain);
                gain.connect(ctx.destination);
                oscillator.start();
                oscillator.stop(ctx.currentTime + duration);
                oscillator.onended = () => {
                    oscillator.disconnect();
                    gain.disconnect();
                };
            } catch(e) {}
        }

        // Show spinner/status if upload is in progress, or redirect if error
        function checkPictureUploadStatus() {
            const status = sessionStorage.getItem('pictureposition_upload_status');
            // Only check if we actually just came from pictureposition
            if (!window.location.search.includes('pictureposition=1')) return;
            if (status === 'uploading') {
                showUploadSpinner();
                // Poll until done or error
                const interval = setInterval(() => {
                    const s = sessionStorage.getItem('pictureposition_upload_status');
                    if (s === 'done') {
                        hideUploadSpinner();
                        clearInterval(interval);
                    } else if (s === 'error' || s === null) {
                        clearInterval(interval);
                        window.location.href = '/pictureposition?error=1';
                    }
                }, 500);
            } else if (status === 'error' || status === null) {
                window.location.href = '/pictureposition?error=1';
            } else {
                // If status is not uploading or error, do nothing (let user proceed)
                hideUploadSpinner();
            }
        }

        function showUploadSpinner() {
            let spinner = document.getElementById('upload-spinner');
            if (!spinner) {
                spinner = document.createElement('div');
                spinner.id = 'upload-spinner';
                spinner.innerHTML = '<div style="margin:30px auto;text-align:center;"><span style="font-size:1.2em;">Uploading picture...</span><br><svg width="40" height="40" viewBox="0 0 40 40"><circle cx="20" cy="20" r="18" stroke="#1976d2" stroke-width="4" fill="none" stroke-dasharray="90" stroke-dashoffset="60"><animateTransform attributeName="transform" type="rotate" from="0 20 20" to="360 20 20" dur="1s" repeatCount="indefinite"/></circle></svg></div>';
                document.body.appendChild(spinner);
            } else {
                spinner.style.display = '';
            }
        }
        function hideUploadSpinner() {
            let spinner = document.getElementById('upload-spinner');
            if (spinner) spinner.style.display = 'none';
        }

        // On load, check if redirected from pictureposition and send the image path to backend
        if (window.location.search.includes('pictureposition=1')) {
            const path = sessionStorage.getItem('pictureposition_path');
            if (path) {
                // Send to backend to set global variable
                fetch('/set_pictureposition_path', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ path })
                }).then(() => {
                    // Optionally clear from sessionStorage
                    // sessionStorage.removeItem('pictureposition_path');
                });
            }
            // Check upload status
            checkPictureUploadStatus();
        }

        function splitScannedBarcode(code) {
            const raw = String(code || '').trim();
            if (!raw) return { base: '', suffix: '' };

            if (barcodeEntryState && typeof barcodeEntryState.splitActualCode === 'function') {
                const split = barcodeEntryState.splitActualCode(raw);
                return {
                    base: String((split && split.code) || '').trim(),
                    suffix: split && split.suffix > 0 ? String(split.suffix) : ''
                };
            }

            const match = raw.match(/^(.*?)-(\d+)$/);
            if (match && match[1]) {
                return { base: String(match[1] || '').trim(), suffix: String(match[2] || '').trim() };
            }
            return { base: raw, suffix: '' };
        }

        function hasLiteralBarcodeSuffix(code) {
            return !!splitScannedBarcode(code).suffix;
        }

        // Validate barcode format (reject invalid formats)
        function isValidBarcode(code) {
            const split = splitScannedBarcode(code);
            if (!/^\d+$/.test(split.base)) {
                return false;
            }
            // Valid lengths for this workflow: UPC-family only (8, 11, 12, 13)
            const len = split.base.length;
            if (len < 8 || len > 13) {
                return false;
            }
            if (split.suffix && !/^[1-9]\d*$/.test(split.suffix)) {
                return false;
            }
            return true;
        }

        function normalizeScannedBarcode(code) {
            const split = splitScannedBarcode(code);
            let base = split.base;
            if (/^\d+$/.test(base) && base.length > 13 && base.startsWith('0')) {
                const stripped = base.replace(/^0+/, '');
                if (stripped && stripped.length <= 13) {
                    base = stripped;
                }
            }
            if (!base) return '';
            return split.suffix ? `${base}-${split.suffix}` : base;
        }

        function formatUpcDisplay(code) {
            const split = splitScannedBarcode(code);
            const base = (/^\d+$/.test(split.base) && split.base.length <= 12)
                ? split.base.padStart(12, '0')
                : split.base;
            return split.suffix ? `${base}-${split.suffix}` : base;
        }

        function normalizeManualTitleKey(code) {
            const split = splitScannedBarcode(code);
            return String(split.base || '').trim();
        }

        function loadManualTitleOverrides() {
            const raw = sessionStorage.getItem(MANUAL_TITLE_STORAGE_KEY);
            if (!raw) return {};
            try {
                const parsed = JSON.parse(raw);
                if (!parsed || typeof parsed !== 'object' || Array.isArray(parsed)) return {};
                const clean = {};
                Object.entries(parsed).forEach(([rawKey, rawValue]) => {
                    const key = normalizeManualTitleKey(rawKey);
                    const value = String(rawValue || '').replace(/\s+/g, ' ').trim();
                    if (key && value) clean[key] = value.slice(0, 200);
                });
                return clean;
            } catch (_) {
                return {};
            }
        }

        function saveManualTitleOverrides(overrides) {
            const next = {};
            Object.entries(overrides || {}).forEach(([rawKey, rawValue]) => {
                const key = normalizeManualTitleKey(rawKey);
                const value = String(rawValue || '').replace(/\s+/g, ' ').trim();
                if (key && value) next[key] = value.slice(0, 200);
            });
            if (Object.keys(next).length) {
                sessionStorage.setItem(MANUAL_TITLE_STORAGE_KEY, JSON.stringify(next));
            } else {
                sessionStorage.removeItem(MANUAL_TITLE_STORAGE_KEY);
            }
            return next;
        }

        function loadSkippedManualTitles() {
            const raw = sessionStorage.getItem(MANUAL_TITLE_SKIP_STORAGE_KEY);
            if (!raw) return {};
            try {
                const parsed = JSON.parse(raw);
                if (!parsed || typeof parsed !== 'object' || Array.isArray(parsed)) return {};
                const clean = {};
                Object.entries(parsed).forEach(([rawKey, rawValue]) => {
                    const key = normalizeManualTitleKey(rawKey);
                    if (key && rawValue) clean[key] = true;
                });
                return clean;
            } catch (_) {
                return {};
            }
        }

        function saveSkippedManualTitles(skips) {
            const next = {};
            Object.entries(skips || {}).forEach(([rawKey, rawValue]) => {
                const key = normalizeManualTitleKey(rawKey);
                if (key && rawValue) next[key] = true;
            });
            if (Object.keys(next).length) {
                sessionStorage.setItem(MANUAL_TITLE_SKIP_STORAGE_KEY, JSON.stringify(next));
            } else {
                sessionStorage.removeItem(MANUAL_TITLE_SKIP_STORAGE_KEY);
            }
            return next;
        }

        function playMissingTitleAlert() {
            try {
                const Ctx = window.AudioContext || window.webkitAudioContext;
                if (!Ctx) return;
                const ctx = window.audioCtx || new Ctx();
                window.audioCtx = ctx;
                const start = ctx.currentTime + 0.02;
                const notes = [
                    { freq: 932, at: 0, dur: 0.09 },
                    { freq: 698, at: 0.12, dur: 0.1 },
                    { freq: 1046, at: 0.26, dur: 0.15 }
                ];
                notes.forEach(note => {
                    const osc = ctx.createOscillator();
                    const gain = ctx.createGain();
                    osc.type = 'triangle';
                    osc.frequency.setValueAtTime(note.freq, start + note.at);
                    gain.gain.setValueAtTime(0.0001, start + note.at);
                    gain.gain.exponentialRampToValueAtTime(0.17, start + note.at + 0.02);
                    gain.gain.exponentialRampToValueAtTime(0.0001, start + note.at + note.dur);
                    osc.connect(gain);
                    gain.connect(ctx.destination);
                    osc.start(start + note.at);
                    osc.stop(start + note.at + note.dur + 0.03);
                    osc.onended = () => {
                        osc.disconnect();
                        gain.disconnect();
                    };
                });
            } catch (_) {}
            if (navigator.vibrate) navigator.vibrate([90, 60, 90, 60, 130]);
        }

        function requiresMissingTitleKeyboardTap() {
            const ua = navigator.userAgent || '';
            return /iPhone|iPad|iPod/.test(ua) || (/Macintosh/.test(ua) && 'ontouchend' in document);
        }

        function setMissingTitleScanPause(active) {
            if (barcodeInput) {
                barcodeInput.readOnly = !!active;
            }
            try {
                if (document.activeElement && typeof document.activeElement.blur === 'function') {
                    document.activeElement.blur();
                }
            } catch (_) {}
        }

        function unlockMissingTitleTyping(retry = true) {
            missingTitleKeyboardTapRequired = false;
            if (missingTitleKeyboardBtn) {
                missingTitleKeyboardBtn.style.display = 'none';
            }
            if (missingTitleInput) {
                missingTitleInput.readOnly = false;
            }
            focusMissingTitleEntry(retry);
        }

        function closeMissingTitleModal(result) {
            if (!missingTitleModal) return;
            missingTitleModal.style.display = 'none';
            missingTitleModalOpen = false;
            missingTitleKeyboardTapRequired = false;
            if (missingTitleInput) {
                missingTitleInput.readOnly = false;
            }
            if (missingTitleKeyboardBtn) {
                missingTitleKeyboardBtn.style.display = 'none';
            }
            setMissingTitleScanPause(false);
            const resolver = missingTitleModalResolver;
            missingTitleModalResolver = null;
            if (resolver) resolver(result || { action: 'dismiss', title: '' });
            window.setTimeout(() => {
                if (missingTitleModalOpen || !barcodeInput) return;
                barcodeInput.focus();
                if (typeof barcodeInput.select === 'function') barcodeInput.select();
            }, 60);
        }

        function focusMissingTitleEntry(retry = false) {
            if (!missingTitleInput) return;

            const attemptFocus = () => {
                if (!missingTitleModalOpen) return;
                try {
                    if (document.activeElement && document.activeElement !== missingTitleInput && typeof document.activeElement.blur === 'function') {
                        document.activeElement.blur();
                    }
                } catch (_) {}
                try {
                    missingTitleInput.focus({ preventScroll: true });
                } catch (_) {
                    missingTitleInput.focus();
                }
                if (typeof missingTitleInput.click === 'function') missingTitleInput.click();
                if (typeof missingTitleInput.select === 'function') missingTitleInput.select();
                if (typeof missingTitleInput.setSelectionRange === 'function') {
                    const end = missingTitleInput.value.length;
                    missingTitleInput.setSelectionRange(end, end);
                }
            };

            attemptFocus();
            if (retry) {
                window.requestAnimationFrame(attemptFocus);
                window.setTimeout(attemptFocus, 50);
                window.setTimeout(attemptFocus, 180);
            }
        }

        function openMissingTitleModal(code) {
            if (!missingTitleModal || !missingTitleInput || !missingTitleBarcodeText) {
                return Promise.resolve({ action: 'skip', title: '' });
            }

            if (missingTitleModalResolver) {
                closeMissingTitleModal({ action: 'dismiss', title: '' });
            }

            missingTitleBarcodeText.textContent = formatUpcDisplay(code);
            missingTitleInput.value = '';
            missingTitleInput.style.borderColor = '#f2c66d';
            missingTitleInput.style.boxShadow = '';
            missingTitleKeyboardTapRequired = requiresMissingTitleKeyboardTap();
            missingTitleInput.readOnly = missingTitleKeyboardTapRequired;
            if (missingTitleKeyboardBtn) {
                missingTitleKeyboardBtn.style.display = missingTitleKeyboardTapRequired ? 'block' : 'none';
            }
            missingTitleModal.style.display = 'flex';
            missingTitleModalOpen = true;
            setMissingTitleScanPause(true);
            playMissingTitleAlert();
            if (missingTitleKeyboardTapRequired) {
                window.requestAnimationFrame(() => {
                    if (missingTitleModalOpen && missingTitleKeyboardBtn) missingTitleKeyboardBtn.focus();
                });
            } else {
                focusMissingTitleEntry(true);
            }

            return new Promise(resolve => {
                missingTitleModalResolver = resolve;
            });
        }

        async function fetchAddItemScreeningSingle(code) {
            const key = normalizeManualTitleKey(code);
            if (!key) return null;
            if (screeningCache.has(key)) return screeningCache.get(key);

            const controller = new AbortController();
            const timeout = setTimeout(() => controller.abort(), 3000);
            try {
                const response = await fetch('/api/add-item/screen', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ barcodes: [key] }),
                    signal: controller.signal
                });
                const payload = await response.json().catch(() => ({}));
                if (!response.ok || payload.success === false) {
                    throw new Error((payload && payload.error) || 'Unable to screen item');
                }
                const item = payload.items && (payload.items[key] || payload.items[code]) ? (payload.items[key] || payload.items[code]) : null;
                screeningCache.set(key, item);
                return item;
            } finally {
                clearTimeout(timeout);
            }
        }

        async function ensureScannedBarcodeReadyForAdd(code) {
            const key = normalizeManualTitleKey(code);
            if (!key) return true;

            const overrides = loadManualTitleOverrides();
            if (overrides[key]) return true;
            const skipped = loadSkippedManualTitles();
            if (skipped[key]) return true;

            try {
                const item = await fetchAddItemScreeningSingle(key);
                if (!item || !item.needs_manual_title) return true;
            } catch (err) {
                console.error('Barcode screening failed; allowing scan:', err);
                return true;
            }

            const modalResult = await openMissingTitleModal(code);
            if (!modalResult || (modalResult.action !== 'skip' && modalResult.action !== 'save')) return false;

            if (modalResult.action === 'skip') {
                skipped[key] = true;
                saveSkippedManualTitles(skipped);
                return true;
            }

            const value = String((modalResult && modalResult.title) || '').replace(/\s+/g, ' ').trim();
            if (!value) return false;

            overrides[key] = value.slice(0, 200);
            saveManualTitleOverrides(overrides);
            if (skipped[key]) {
                delete skipped[key];
                saveSkippedManualTitles(skipped);
            }
            return true;
        }

        function clearPendingSingleSubmit() {
            if (pendingSingleSubmitTimer) {
                clearTimeout(pendingSingleSubmitTimer);
                pendingSingleSubmitTimer = null;
            }
        }

        function resetPendingSingleBarcode() {
            pendingSingleBarcode = '';
            pendingSingleSuffix = 0;
            document.getElementById('scanned_result').value = '';
            scannedResultInput.style.background = '';
        }

        function submitBarcodePayload(barcodeString) {
            const payload = String(barcodeString || '').trim();
            if (barcodeEntryState) {
                const entries = barcodeEntryState.parseEntriesFromString(payload);
                if (entries.length) {
                    barcodeEntryState.saveEntries(entries);
                } else {
                    sessionStorage.removeItem('barcode');
                    sessionStorage.removeItem('barcode_entries');
                }
            } else if (payload) {
                sessionStorage.setItem('barcode', payload);
            } else {
                sessionStorage.removeItem('barcode');
            }

            const form = document.getElementById('scan_form');
            if (!form) return;
            document.getElementById('scanned_result').value = payload;
            form.submit();
        }

        function currentSingleActualCode() {
            if (!pendingSingleBarcode) return '';
            if (hasLiteralBarcodeSuffix(pendingSingleBarcode)) return pendingSingleBarcode;
            return pendingSingleSuffix > 0
                ? `${pendingSingleBarcode}-${pendingSingleSuffix}`
                : pendingSingleBarcode;
        }

        function updatePendingSingleDisplay() {
            const finalCode = currentSingleActualCode();
            if (!finalCode) return;
            document.getElementById('scanned_result').value = finalCode;
            scannedResultInput.style.background = '#e0ffe0';
        }

        async function commitPendingSingleBarcode() {
            clearPendingSingleSubmit();
            const finalCode = currentSingleActualCode();
            if (!finalCode) return;

            const ready = await ensureScannedBarcodeReadyForAdd(finalCode);
            if (!ready) {
                resetPendingSingleBarcode();
                if (barcodeInput) barcodeInput.focus();
                return;
            }

            if (barcodeEntryState) {
                barcodeEntryState.saveEntries(
                    barcodeEntryState.parseEntriesFromString(finalCode)
                );
            } else {
                sessionStorage.setItem('barcode', finalCode);
            }
            document.getElementById('scanned_result').value = finalCode;

            const urlParams = new URLSearchParams(window.location.search);
            const returnTo = urlParams.get('return');

            if (returnTo === 'marketplace') {
                window.location.href = '/marketplace-sale?scanned=true';
                return;
            }

            submitBarcodePayload(finalCode);
        }

        function queueSingleBarcode(code) {
            const normalized = String(code || '').trim();
            if (!normalized) return;

            if (pendingSingleBarcode === normalized && !hasLiteralBarcodeSuffix(normalized)) {
                pendingSingleSuffix += 1;
            } else {
                pendingSingleBarcode = normalized;
                pendingSingleSuffix = 0;
            }

            playBeep();
            updatePendingSingleDisplay();
            clearPendingSingleSubmit();
            pendingSingleSubmitTimer = setTimeout(() => {
                commitPendingSingleBarcode().catch(err => {
                    console.error('Commit pending barcode failed:', err);
                    resetPendingSingleBarcode();
                });
            }, SINGLE_SCAN_CAPTURE_MS);
        }

        // Handle barcode input for manual or scanner input
        function handleBarcodeInput(code) {
            const trimmed = String(code || '').trim();
            if (!trimmed) return;
            queueBarcodeScan(trimmed);
            barcodeInput.value = '';
        }

        // Play error beep (same as position.html)
        function playErrorBeep() {
            try {
                var ctx = window.audioCtx || new (window.AudioContext || window.webkitAudioContext)();
                window.audioCtx = ctx;
                var osc = ctx.createOscillator();
                var gain = ctx.createGain();
                osc.type = 'square';
                osc.frequency.value = 220;
                gain.gain.value = 0.3;
                osc.connect(gain);
                gain.connect(ctx.destination);
                osc.start();
                osc.stop(ctx.currentTime + 0.25);
                osc.onended = function() {
                    osc.disconnect();
                    gain.disconnect();
                };
            } catch(e) {}
        }

        function showInvalidModal() {
            if (!invalidModal || invalidModalOpen) return;
            invalidModalOpen = true;
            invalidModal.style.display = 'flex';
        }

        function closeInvalidModal() {
            if (!invalidModal) return;
            invalidModalOpen = false;
            invalidModal.style.display = 'none';
        }

        if (invalidModalClose) invalidModalClose.addEventListener('click', closeInvalidModal);
        if (invalidModal) {
            invalidModal.addEventListener('click', (e) => {
                if (e.target === invalidModal) closeInvalidModal();
            });
        }
        if (missingTitleSkipBtn) {
            missingTitleSkipBtn.addEventListener('click', () => closeMissingTitleModal({ action: 'skip', title: '' }));
        }
        if (missingTitleSaveBtn) {
            missingTitleSaveBtn.addEventListener('click', () => {
                const value = String(missingTitleInput && missingTitleInput.value || '').replace(/\s+/g, ' ').trim();
                if (!value) {
                    if (missingTitleInput) {
                        missingTitleInput.style.borderColor = '#dc2626';
                        missingTitleInput.style.boxShadow = '0 0 0 3px rgba(220,38,38,0.16)';
                        missingTitleInput.focus();
                    }
                    return;
                }
                closeMissingTitleModal({ action: 'save', title: value });
            });
        }
        if (missingTitleInput) {
            const handleMissingTitleTap = (e) => {
                if (!missingTitleKeyboardTapRequired) return;
                if (e) e.preventDefault();
                unlockMissingTitleTyping(false);
            };
            missingTitleInput.addEventListener('input', () => {
                missingTitleInput.style.borderColor = '#f2c66d';
                missingTitleInput.style.boxShadow = '';
            });
            missingTitleInput.addEventListener('keydown', (e) => {
                if (e.key === 'Enter') {
                    e.preventDefault();
                    if (missingTitleSaveBtn) missingTitleSaveBtn.click();
                } else if (e.key === 'Escape') {
                    e.preventDefault();
                    focusMissingTitleEntry(true);
                }
            });
            missingTitleInput.addEventListener('touchend', handleMissingTitleTap);
            missingTitleInput.addEventListener('mouseup', handleMissingTitleTap);
        }
        if (missingTitleKeyboardBtn) {
            const handleMissingTitleKeyboardBtn = (e) => {
                if (e) e.preventDefault();
                unlockMissingTitleTyping(true);
            };
            missingTitleKeyboardBtn.addEventListener('click', handleMissingTitleKeyboardBtn);
            missingTitleKeyboardBtn.addEventListener('touchend', handleMissingTitleKeyboardBtn);
        }
        if (missingTitleModal) {
            missingTitleModal.addEventListener('click', (e) => {
                if (e.target === missingTitleModal) {
                    if (missingTitleKeyboardTapRequired && missingTitleKeyboardBtn) {
                        missingTitleKeyboardBtn.focus();
                        return;
                    }
                    focusMissingTitleEntry(true);
                }
            });
        }

        // Multi-barcode scanning state
        let scannedBarcodes = [];
        let autoSubmitTimer = null;
        let autoSubmitCountdown = null;

        function getAutoSubmitDelay() {
            // Get timer settings from localStorage (set in misc.html)
            let seconds = 10;
            const stored = localStorage.getItem('barcodeTimer');
            if (stored && !isNaN(parseInt(stored))) {
                seconds = Math.max(1, Math.min(30, parseInt(stored)));
            }
            return seconds * 1000; // Convert to milliseconds
        }

        function isShelfLocked() {
            return sessionStorage.getItem('positionLocked') === 'true';
        }

        async function addBarcodeToList(code) {
            const ready = await ensureScannedBarcodeReadyForAdd(code);
            if (!ready) {
                if (barcodeInput) {
                    barcodeInput.value = '';
                    barcodeInput.focus();
                }
                return;
            }
            // Avoid duplicates
            if (scannedBarcodes.includes(code)) {
                playErrorBeep();
                return;
            }
            scannedBarcodes.push(code);
            playBeep();
            updateBarcodeList();
            resetAutoSubmitTimer();
        }

        function updateBarcodeList() {
            const listEl = document.getElementById('barcodeList');
            if (!listEl) return;

            if (scannedBarcodes.length === 0) {
                listEl.innerHTML = '<div style="color:#999; text-align:center; padding:12px;">' + t('no_barcodes_scanned', 'No barcodes scanned yet') + '</div>';
                return;
            }

            listEl.innerHTML = scannedBarcodes.map((code, idx) => `
                <div style="display:flex; justify-content:space-between; align-items:center; padding:8px; background:#fff; margin-bottom:4px; border-radius:4px;">
                    <span style="font-family:monospace; font-weight:600;">${formatUpcDisplay(code)}</span>
                    <button onclick="removeBarcodeAt(${idx})" style="background:#e74c3c; color:#fff; border:none; padding:4px 8px; border-radius:4px; cursor:pointer;">X</button>
                </div>
            `).join('');
        }

        function removeBarcodeAt(idx) {
            scannedBarcodes.splice(idx, 1);
            updateBarcodeList();
            if (scannedBarcodes.length === 0) {
                clearAutoSubmitTimer();
            } else {
                resetAutoSubmitTimer();
            }
        }

        function resetAutoSubmitTimer() {
            clearAutoSubmitTimer();
            const autoSubmitDelay = getAutoSubmitDelay();
            let secondsLeft = Math.floor(autoSubmitDelay / 1000);
            const timerEl = document.getElementById('autoSubmitTimer');
            if (timerEl) {
                timerEl.textContent = `${t('auto_submit_in', 'Auto-submit in')} ${secondsLeft}s`;
            }
            autoSubmitCountdown = setInterval(() => {
                secondsLeft--;
                if (timerEl) {
                    timerEl.textContent = `${t('auto_submit_in', 'Auto-submit in')} ${secondsLeft}s`;
                }
            }, 1000);
            autoSubmitTimer = setTimeout(() => {
                submitBarcodes();
            }, autoSubmitDelay);
        }

        function clearAutoSubmitTimer() {
            if (autoSubmitTimer) {
                clearTimeout(autoSubmitTimer);
                autoSubmitTimer = null;
            }
            if (autoSubmitCountdown) {
                clearInterval(autoSubmitCountdown);
                autoSubmitCountdown = null;
            }
            const timerEl = document.getElementById('autoSubmitTimer');
            if (timerEl) {
                timerEl.textContent = '';
            }
        }

        function submitBarcodes() {
            clearAutoSubmitTimer();
            if (scannedBarcodes.length === 0) return;
            const barcodeString = scannedBarcodes.join(',');
            submitBarcodePayload(barcodeString);
        }

        function showMultiBarcodeUI() {
            const container = document.getElementById('multiBarcodeContainer');
            const resultInput = document.getElementById('scanned_result');
            if (container) {
                container.style.display = 'block';
                resultInput.placeholder = t('scan_multiple', 'Scan multiple barcodes...');
            }
        }

        function hideMultiBarcodeUI() {
            const container = document.getElementById('multiBarcodeContainer');
            const resultInput = document.getElementById('scanned_result');
            if (container) {
                container.style.display = 'none';
                resultInput.placeholder = t('barcode_will_appear', 'BARCODE will appear here');
            }
            scannedBarcodes = [];
            clearAutoSubmitTimer();
        }

        function queueBarcodeScan(code) {
            const raw = String(code || '').trim();
            if (!raw || missingTitleModalOpen) return barcodeScanQueue;
            barcodeScanQueue = barcodeScanQueue.then(() => handleBarcodeScan(raw)).catch(err => {
                console.error('Barcode scan processing failed:', err);
            });
            return barcodeScanQueue;
        }

        // Ensure barcode is set in sessionStorage on successful scan or input
        async function handleBarcodeScan(code) {
            code = normalizeScannedBarcode(code);
            // Validate barcode format
            if (!isValidBarcode(code)) {
                playErrorBeep();
                const resultInput = document.getElementById('scanned_result');
                const originalValue = resultInput.value;
                const originalBg = resultInput.style.background;
                resultInput.value = t('invalid_barcode', 'INVALID BARCODE');
                resultInput.style.background = '#ffdddd';
                resultInput.style.color = '#d32f2f';
                resultInput.style.fontWeight = 'bold';
                showInvalidModal();
                setTimeout(() => {
                    resultInput.value = originalValue;
                    resultInput.style.background = originalBg;
                    resultInput.style.color = '';
                    resultInput.style.fontWeight = 'bold';
                }, 1500);
                return;
            }

            if (isShelfLocked()) {
                showMultiBarcodeUI();
                await addBarcodeToList(code);
                return;
            }

            queueSingleBarcode(code);
        }

        function fetchAllowedUPCs() {
            // Deprecated: keep stub for compatibility
            allowedUPCs = [];
            upcListLoaded = true;
        }

        // Initialize everything when the page loads
        window.addEventListener('DOMContentLoaded', () => {
            // Unlock audio on user interaction
            window.addEventListener('touchstart', unlockAudio, { once: true });
            window.addEventListener('mousedown', unlockAudio, { once: true });

            // Focus barcode input by default
            if (barcodeInput) {
                barcodeInput.focus();
                barcodeInput.select();
            }

            // Handle barcode input: Enter or change
            if (barcodeInput) {
                barcodeInput.addEventListener('keydown', (e) => {
                    if (e.key === 'Enter') {
                        e.preventDefault();
                        handleBarcodeInput(barcodeInput.value);
                    }
                });
                barcodeInput.addEventListener('change', () => {
                    handleBarcodeInput(barcodeInput.value);
                });
            }

            // Fetch allowed UPCs
            fetchAllowedUPCs();
            // On load, check upload status only if redirected from pictureposition
            if (window.location.search.includes('pictureposition=1')) {
                checkPictureUploadStatus();
            }
            // PERSIST BARCODE: If barcode exists in sessionStorage, pre-fill input
            const storedEntries = barcodeEntryState ? barcodeEntryState.loadEntries() : [];
            const storedBarcode = (barcodeEntryState && storedEntries.length)
                ? barcodeEntryState.serializeEntries(storedEntries)
                : sessionStorage.getItem('barcode');
            if (storedBarcode) {
                scannedResultInput.value = storedBarcode;
                scannedResultInput.style.background = '#e0ffe0';
            }

            // Confirm barcodes button
            const confirmBtn = document.getElementById('confirmBarcodesBtn');
            if (confirmBtn) {
                confirmBtn.addEventListener('click', () => {
                    submitBarcodes();
                });
            }

            const skipForm = document.getElementById('skipForm');
            if (skipForm) {
                skipForm.addEventListener('submit', function() {
                    const storedEntries = barcodeEntryState ? barcodeEntryState.loadEntries() : [];
                    const storedBarcode = (barcodeEntryState && storedEntries.length)
                        ? barcodeEntryState.serializeEntries(storedEntries)
                        : sessionStorage.getItem('barcode');
                    if (storedBarcode) {
                        this.querySelector('input[name="scanned_result"]').value = storedBarcode;
                    }
                });
            }

            if (isShelfLocked()) {
                showMultiBarcodeUI();
            } else {
                hideMultiBarcodeUI();
            }
        });
    </script>

    <div style="margin-top: 30px; width: 100%; display: flex; justify-content: center; gap: 15px; padding: 20px 0; border-top: 1px solid #eee;">

        <button style="background-color: #6c757d; color: white; border: none; padding: 10px 24px; border-radius: 6px; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 8px; font-size: 1.1em; width: 100%;">
            <i class="fas fa-arrow-left"></i> <span data-i18n="back">Back</span>
        </button>
    </a>
        <form id="skipForm" action="/submitbarcode" method="POST" style="flex: 1; max-width: 200px; margin: 0;">
            <input type="hidden" name="scanned_result" value="">
            <button type="submit" style="background-color: #ffc107; color: #000; border: none; padding: 10px 24px; border-radius: 6px; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 8px; font-size: 1.1em; width: 100%;">
                <i class="fas fa-forward"></i> <span data-i18n="skip">Skip</span>
            </button>
        </form>
        <button id="exitBtn" type="button" style="background-color: #ff4444; color: white; border: none; padding: 10px 24px; border-radius: 6px; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 8px; font-size: 1.1em; width: 100%; max-width: 200px;">
            <i class="fas fa-times"></i> <span data-i18n="exit">Exit</span>
        </button>
    </div>
    <script>
    document.getElementById('exitBtn').addEventListener('click', function(e) {
        e.preventDefault();
        sessionStorage.removeItem('item_position');
        sessionStorage.removeItem('barcode');
        sessionStorage.removeItem('barcode_entries');
        sessionStorage.removeItem('additem_manual_titles');
        sessionStorage.removeItem('additem_manual_title_skips');
        sessionStorage.removeItem('pictureposition_path');
        sessionStorage.removeItem('positionLocked');
        // Notify server to clear lock state
        fetch('/toggle', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ checked: false })
        }).catch(err => console.error('Error clearing lock:', err));
        window.location.href = '/';
    });
    </script>
