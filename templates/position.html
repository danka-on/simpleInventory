<!DOCTYPE html>
<html lang="en">
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Set Position of Item</title>
    <style>
        body {
            font-family: sans-serif;
            max-width: 600px;
            margin: auto;
            padding: 10px;
        }

        #reader {
            width: 100%;
            margin-top: 20px;
            height: 300px;
            background: #222;
            border-radius: 8px;
            position: relative;
            overflow: hidden;
        }

        input[type="text"] {
            width: 100%;
            font-size: 1.2em;
            padding: 10px;
            margin-top: 20px;
        }

        button {
            font-size: 18px;
            padding: 10px 20px;
            margin-top: 10px;
        }

        #scanner-overlay {
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            pointer-events: none;
            z-index: 2;
        }

        .scanner-line {
            position: absolute;
            left: 0;
            width: 100%;
            height: 3px;
            background: red;
            animation: scan-move 2s linear infinite;
            opacity: 0.8;
        }

        @keyframes scan-move {
            0% { top: 0; }
            100% { top: 100%; }
        }
    </style>
</head>
<body>
    <h1>Set Position of Item</h1>

    <div id="reader" style="position: relative; width: 100%; height: 300px; background: #222; border-radius: 8px; overflow: hidden;">
        <div id="scanner-overlay">
            <div class="scanner-line"></div>
        </div>
    </div>


    <form type="text" id="scan_form" action="/submitposition" method="POST">
        <input name="scanned_result" type="text" id="scanned_result" placeholder="Scanned code will appear here">
    </form>


    <button onclick="restartScanner()">Restart Scanner</button>

    <a href="/barcode">
  <button type="button">Skip</button>
    </a>


    <button id="flashBtn" type="button" style="display:none">Turn On Flashlight</button>
    <span id="flashMsg" style="color:red; display:none; font-size:0.9em;"></span>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/quagga/0.12.1/quagga.min.js"></script>
<script>
    let scannerActive = false;
    let scanBuffer = [];
    const REQUIRED_MATCHES = 1;
    let track = null;
    let imageCapture = null;
    let torchOn = false;

    // --- Web Audio API beep logic ---
    let audioUnlocked = false;
    let audioCtx = null;
    function unlockAudio() {
        if (!audioUnlocked) {
            audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            // Play a silent sound to unlock
            let buffer = audioCtx.createBuffer(1, 1, 22050);
            let source = audioCtx.createBufferSource();
            source.buffer = buffer;
            source.connect(audioCtx.destination);
            source.start(0);
            audioUnlocked = true;
        }
    }
    function playBeep() {
        if (!audioCtx) return;
        let duration = 0.1;
        let oscillator = audioCtx.createOscillator();
        let gain = audioCtx.createGain();
        oscillator.type = 'sine';
        oscillator.frequency.value = 880;
        gain.gain.value = 0.2;
        oscillator.connect(gain);
        gain.connect(audioCtx.destination);
        oscillator.start();
        oscillator.stop(audioCtx.currentTime + duration);
        oscillator.onended = () => {
            oscillator.disconnect();
            gain.disconnect();
        };
    }
    window.addEventListener('touchstart', unlockAudio, { once: true });
    window.addEventListener('mousedown', unlockAudio, { once: true });

    function startScanner() {
        if (scannerActive) return;
        scannerActive = true;
        Quagga.init({
            inputStream: {
                name: "Live",
                type: "LiveStream",
                target: document.querySelector('#reader'),
                constraints: {
                    facingMode: "environment",
                    width: { ideal: 640 },
                    height: { ideal: 480 }
                },
            },
            decoder: {
                readers: [  "upc_reader",
                            "upc_e_reader",
                            "ean_reader",
                            "ean_8_reader" ]
            },
            locate: true
        }, function (err) {
            if (err) {
                console.error(err);
                scannerActive = false;
                return;
            }
            Quagga.start();
        });

        Quagga.onDetected(function (result) {
            let code = result.codeResult.code;
            if (!code) return;
            code = code.trim().replace(/^0+/, '');
            if (scanBuffer.length > 0 && scanBuffer[scanBuffer.length - 1] !== code) {
                scanBuffer = [];
            }
            scanBuffer.push(code);
            if (scanBuffer.length > REQUIRED_MATCHES) scanBuffer.shift();
            if (scanBuffer.length === REQUIRED_MATCHES && scanBuffer.every(c => c === code)) {
                document.getElementById("scanned_result").value = code;
                Quagga.stop();
                scannerActive = false;
                playBeep();
                document.getElementById("scan_form").submit();
            }
        });
        Quagga.onProcessed(function (result) {
            // Removed console.log for speed
        });
    }
    function restartScanner() {
        if (scannerActive) {
            Quagga.stop();
            scannerActive = false;
        }
        startScanner();
    }

    // Flashlight and focus logic
    function checkTorchSupport() {
        if (!track) return;
        const capabilities = track.getCapabilities ? track.getCapabilities() : {};
        if (capabilities.torch) {
            document.getElementById('flashBtn').style.display = '';
        } else {
            document.getElementById('flashBtn').style.display = 'none';
            document.getElementById('flashMsg').textContent = 'Flashlight not supported on this device/browser.';
            document.getElementById('flashMsg').style.display = '';
        }
    }
    document.getElementById('flashBtn').addEventListener('click', async function() {
        if (!track) return;
        try {
            torchOn = !torchOn;
            await track.applyConstraints({
                advanced: [{ torch: torchOn }]
            });
            this.textContent = torchOn ? 'Turn Off Flashlight' : 'Turn On Flashlight';
        } catch (e) {
            document.getElementById('flashMsg').textContent = 'Failed to toggle flashlight.';
            document.getElementById('flashMsg').style.display = '';
        }
    });

    window.addEventListener('load', startScanner);
    setTimeout(() => {
        let stream = Quagga.cameraAccess && Quagga.cameraAccess.getActiveStream && Quagga.cameraAccess.getActiveStream();
        if (stream && stream.getVideoTracks) {
            track = stream.getVideoTracks()[0];
            try {
                imageCapture = new window.ImageCapture(track);
            } catch (e) {
                imageCapture = null;
            }
            checkTorchSupport();
        }
    }, 500);
</script>

</body>
</html>
