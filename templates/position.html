<!DOCTYPE html>
<html lang="en">
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title data-i18n="location_step_title">Location QR (step 1/2)</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <style>
    /* Green screen overlay */
    #green-screen {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background-color: #00ff00;
        z-index: 99999;
        opacity: 0;
        pointer-events: none;
        transition: opacity 200ms ease-in-out;
    }
    
    #green-screen.visible {
        opacity: 1;
    }
    
    #green-screen .checkmark {
        position: absolute;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
        color: white;
        font-size: 120px;
        text-shadow: 0 0 20px rgba(255, 255, 255, 0.5);
    }

    body {
        font-family: sans-serif;
        max-width: 600px;
        margin: auto;
        padding: 10px;
        display: flex; /* Center content */
        flex-direction: column;
        align-items: center; /* Center horizontally */
        min-height: 100vh; /* Full viewport height */
    }
    .layout {
        width: 100%;
        max-width: 600px;
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 18px;
    }
    .header-block {
        width: 100%;
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 10px;
    }
    .scan-bar {
        width: 100%;
        max-width: 420px;
        display: flex;
        flex-direction: column;
        gap: 10px;
    }
    .location-suggestions {
        display: none;
        width: 100%;
        gap: 7px;
        flex-wrap: wrap;
        padding: 9px;
        border: 1px solid #d7e0e8;
        border-radius: 10px;
        background: #f7fafc;
        box-sizing: border-box;
    }
    .location-suggestions.visible { display: flex; }
    .location-option {
        margin: 0;
        padding: 7px 11px;
        border: 1px solid #9fc5e8;
        border-radius: 999px;
        background: #fff;
        color: #24557a;
        font-size: .95rem;
        font-weight: 700;
        cursor: pointer;
    }
    .location-option:hover, .location-option:focus {
        background: #2d98da;
        border-color: #2d98da;
        color: #fff;
        outline: none;
    }
    .section {
        width: 100%;
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 12px;
    }
    .dual-row{
        width: 100%;
        display: flex;
        gap: 16px;
        align-items: flex-start;
        justify-content: center;
        flex-wrap: wrap;
    }
    .dual-card{
        display:flex;
        flex-direction:column;
        align-items:center;
        gap:8px;
        width: 100%;
        max-width: 260px;
    }
    .dual-card .dual-btn{
        width: 100%;
        max-width: 220px;
        min-height: 52px;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: 10px;
    }
    @media (max-width: 640px){
        .dual-row{
            flex-direction: column;
            align-items: center;
        }
    }
    .img-frame{
        width: 180px;
        height: 180px;
        display:flex;
        align-items:center;
        justify-content:center;
    }
    .img-card {
        max-width: 100%;
        max-height: 100%;
        width: auto;
        height: auto;
        object-fit: contain;
        background: transparent;
        border-radius: 6px;
        display: block;
        box-sizing: border-box;
    }
    #reader {
        display: none;
    }
    input[type="text"] {
        width: 100%;
        font-size: 1.2em;
        padding: 10px;
        margin-top: 20px;
    }
    button {
        font-size: 18px;
        padding: 10px 20px;
        margin-top: 10px;
    }

    .back-fixed{
        position: fixed;
        top: 12px;
        left: 12px;
        z-index: 10000;
        background: #e74c3c;
        color: #fff;
        border: none;
        padding: 10px 14px;
        border-radius: 10px;
        cursor: pointer;
        font-size: 16px;
        font-weight: 800;
        box-shadow: 0 8px 18px rgba(0,0,0,0.18);
        margin: 0;
        display: inline-flex;
        align-items: center;
        gap: 8px;
    }
    .back-fixed:hover{ filter: brightness(1.02); }
    .back-fixed:active{ transform: translateY(1px); }


    .img-highlight {
        box-shadow: 0 0 0 2px #2ecc71;
        border-radius: 6px;
    }
    .title-line {
        display: flex;
        align-items: baseline;
        gap: 6px;
    }
    .title-main {
        color: #222;
        font-weight: 600;
    }
    .title-qr {
        color: #2ecc71;
        font-weight: 800;
    }
    .title-step {
        color: #555;
        font-weight: 600;
        font-size: 0.85em;
    }

    .invalid-modal {
        display: none;
        position: fixed;
        inset: 0;
        background: rgba(0,0,0,0.55);
        z-index: 99999;
        align-items: center;
        justify-content: center;
        padding: 20px;
    }
    .invalid-card {
        background: #fff;
        border-radius: 12px;
        padding: 18px 20px 16px;
        width: 92%;
        max-width: 420px;
        box-shadow: 0 12px 30px rgba(0,0,0,0.25);
        border: 1px solid #e6e6e6;
        position: relative;
    }
    .invalid-accent {
        height: 6px;
        border-radius: 6px;
        background: linear-gradient(90deg, #e74c3c, #f39c12);
        margin: -18px -20px 14px;
    }
    .invalid-title {
        margin: 0 0 8px;
        font-size: 1.05rem;
        font-weight: 700;
        color: #2c3e50;
    }
    .invalid-text {
        margin: 0 0 12px;
        font-size: 0.98rem;
        color: #333;
        line-height: 1.45;
    }
    .invalid-close {
        background: #e74c3c;
        color: #fff;
        border: none;
        border-radius: 8px;
        padding: 8px 12px;
        cursor: pointer;
        font-weight: 600;
    }

    /* Night mode */
    html.ss-theme-night body{
        background: #0f172a;
        color: #e2e8f0;
    }
    html.ss-theme-night .title-main{
        color: #e2e8f0;
    }
    html.ss-theme-night .title-step{
        color: #94a3b8;
    }
    html.ss-theme-night input[type="text"]{
        background: #0f172a;
        color: #e2e8f0 !important;
        border: 1px solid rgba(255,255,255,0.12);
        -webkit-text-fill-color: #e2e8f0;
    }
    html.ss-theme-night .location-suggestions{background:#111c30;border-color:#334155}
    html.ss-theme-night .location-option{background:#1e293b;color:#bae6fd;border-color:#475569}

    </style>
</head>
<body>
    <div class="layout">
        <div class="header-block">
            <h1 style="margin: 0; display:flex; flex-direction:column; align-items:center; gap:4px;">
                <span class="title-line">
                    <span class="title-main" data-i18n="location">Location</span>
                    <span class="title-qr" data-i18n="qr">QR</span>
                </span>
                <span class="title-step" data-i18n="step_1_2">(step 1/2)</span>
            </h1>
            <div class="scan-bar" style="margin-bottom: 10px;">
                <input type="text" id="qrTextInput" name="qrTextInput" data-i18n="scan_or_enter_qr" placeholder="Scan or enter QR LOCATION code" style="flex: 1; font-size:1.2em; padding:10px; display:none;" autocomplete="off" />
                <div id="locationSuggestions" class="location-suggestions" aria-label="Available location suggestions"></div>
            </div>
        </div>

        <!-- Edit Mode Banner -->
        <div id="editModeBanner" style="display:none; background:#ff9800; color:white; padding:12px; text-align:center; font-weight:bold; border-radius:8px; box-shadow:0 2px 8px rgba(0,0,0,0.2);">
            📦 EDIT MODE: Moving <span id="editModeQty">?</span> items
        </div>
        
    <form id="scan_form" action="/submitposition" method="POST" style="display: none;">
        <input name="scanned_result" type="text" id="scanned_result">
        <input name="for_diagnostic" type="hidden" id="for_diagnostic">
        <input name="return_url" type="hidden" id="return_url">
        <input name="upc" type="hidden" id="upc_field">
        <input name="position_locked" type="hidden" id="position_locked_field" value="false">
    </form>
    <!-- Lock Shelf button (replaces checkbox) -->
    <div class="section" style="text-align: center;">
        <div class="dual-row">
            <div class="dual-card">
                <div class="img-frame">
                    <img id="singleBarcodeImg" class="img-highlight img-card" src="/static/singlebarcodeexample.png?v=20260203e" alt="QR Code" />
                </div>
                <button id="singleModeBtn" type="button" class="dual-btn" data-i18n="single_item" style="background:#2ecc71;color:#fff;border:none;padding:10px 14px;border-radius:8px;cursor:pointer;font-size:1.05em;font-weight:700;">Single Item</button>
            </div>
            <div class="dual-card">
                <div class="img-frame">
                    <img id="multiBarcodeImg" class="img-card" src="/static/multibarcodeexample.png?v=20260203e" alt="Multi barcode example">
                </div>
                <button id="lockPositionBtn" type="button" class="dual-btn" style="background-color: #757575; color: white; border: none; padding: 10px 14px; border-radius: 8px; cursor: pointer; font-size: 1.05em; display: inline-flex; align-items: center; justify-content: center; gap: 10px; font-weight: bold; transition: background 0.3s;">
                    <i class="fas fa-unlock" id="lockIcon"></i>
                    <span id="lockText" data-i18n="lock_shelf_multi">Multiple Items</span>
                </button>
            </div>
        </div>
        <div style="display:flex; align-items:center; gap:8px; width:100%; max-width:360px; justify-content:center;">
            <div style="display:flex; flex-direction:column; align-items:center; gap:6px; width:100%;">
                <a href="/movelocation" style="text-decoration:none; width:100%; display:flex; flex-direction:column; align-items:center;">
                    <div class="img-frame">
                        <img src="/static/movelocationexample.png?v=20260203e" alt="Move items example" class="img-card">
                    </div>
                    <button style="background:#2d98da;color:#fff;border:none;padding:12px 18px;border-radius:8px;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:8px;font-size:1.05em;font-weight:600;width:100%;">
                        <i class="fas fa-exchange-alt"></i> <span data-i18n="move_items_location">Move Items to Another Location</span>
                    </button>
                </a>
            </div>
        </div>
    </div>
    <div id="green-screen">
        <i class="fas fa-check-circle checkmark"></i>
    </div>

    <div id="invalidModal" class="invalid-modal">
        <div class="invalid-card">
            <div class="invalid-accent"></div>
            <h3 class="invalid-title" id="invalidModalTitle" data-i18n="invalid_location_title">Invalid Shelf Code</h3>
            <p class="invalid-text" id="invalidModalBody" data-i18n="invalid_location_body">This is not a valid shelf/location code. Please scan a shelf QR code.</p>
            <div style="text-align:right;">
                <button class="invalid-close" id="invalidModalClose" data-i18n="close">Close</button>
            </div>
        </div>
    </div>
    </div>

    <script>
  // Lock Position button logic (replaces checkbox)
  let positionLocked = false;
  const lockBtn = document.getElementById('lockPositionBtn');
  const lockIcon = document.getElementById('lockIcon');
  const lockText = document.getElementById('lockText');
  const singleBarcodeImg = document.getElementById('singleBarcodeImg');
  const multiBarcodeImg = document.getElementById('multiBarcodeImg');
  const singleModeBtn = document.getElementById('singleModeBtn');
  const invalidModal = document.getElementById('invalidModal');
  const invalidModalClose = document.getElementById('invalidModalClose');
  let invalidModalOpen = false;
  const t = (key, fallback) => (window.i18n && window.i18n.t) ? window.i18n.t(key) : fallback;
  function setLockText(key, fallback) {
    if (lockText) {
      lockText.setAttribute('data-i18n', key);
      lockText.textContent = t(key, fallback);
    }
  }
  function updateImageHighlight() {
    if (!singleBarcodeImg || !multiBarcodeImg) return;
    if (positionLocked) {
      singleBarcodeImg.classList.remove('img-highlight');
      multiBarcodeImg.classList.add('img-highlight');
    } else {
      multiBarcodeImg.classList.remove('img-highlight');
      singleBarcodeImg.classList.add('img-highlight');
    }
    if (singleModeBtn) {
      singleModeBtn.style.backgroundColor = positionLocked ? '#9e9e9e' : '#2ecc71';
      singleModeBtn.style.color = '#fff';
    }
  }

  function showInvalidModal() {
    if (!invalidModal || invalidModalOpen) return;
    invalidModalOpen = true;
    invalidModal.style.display = 'flex';
  }

  function closeInvalidModal() {
    if (!invalidModal) return;
    invalidModalOpen = false;
    invalidModal.style.display = 'none';
  }

  if (invalidModalClose) invalidModalClose.addEventListener('click', closeInvalidModal);
  if (invalidModal) {
    invalidModal.addEventListener('click', (e) => {
      if (e.target === invalidModal) closeInvalidModal();
    });
  }

  function queueScanInput() {
    const qrInput = document.getElementById('qrTextInput');
    if (!qrInput) return;
    if (qrInput.style.display === 'none') {
      qrInput.style.display = '';
    }
    setTimeout(() => {
      qrInput.focus();
      qrInput.click();
      qrInput.select();
    }, 100);
  }

  function setLockState(locked, notifyServer = true) {
    positionLocked = !!locked;
    if (positionLocked) {
      lockBtn.style.backgroundColor = '#43a047'; // Green when locked
      lockIcon.className = 'fas fa-lock';
      setLockText('locked_multi', 'Scan Multiple Barcodes (Same Shelf)');
      sessionStorage.setItem('positionLocked', 'true');
      document.getElementById('position_locked_field').value = 'true';
      // Auto-focus on input field for immediate scanning
      queueScanInput();
    } else {
      lockBtn.style.backgroundColor = '#757575'; // Gray when unlocked
      lockIcon.className = 'fas fa-unlock';
      setLockText('lock_shelf_multi', 'Scan Multiple Barcodes (Same Shelf)');
      sessionStorage.removeItem('positionLocked');
      document.getElementById('position_locked_field').value = 'false';
      // Clear position when unlocking
      sessionStorage.removeItem('item_position');
      sessionStorage.removeItem('pictureposition_path');
      // Keep the scan input queued for single item mode
      queueScanInput();
    }
    updateImageHighlight();

    if (notifyServer) {
      fetch('/toggle', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ checked: positionLocked })
      })
      .then(response => response.json())
      .then(data => {
        console.log("Server says:", data.message);
      })
      .catch(error => console.error('Error:', error));
    }
  }

  // Load lock state from sessionStorage on page load
  function loadLockState() {
    const stored = sessionStorage.getItem('positionLocked');
    setLockState(stored === 'true', false);
  }

  lockBtn.addEventListener('click', function () {
    setLockState(!positionLocked, true);
  });

  if (singleBarcodeImg) {
    singleBarcodeImg.style.cursor = 'pointer';
    singleBarcodeImg.addEventListener('click', () => setLockState(false, true));
  }
  if (multiBarcodeImg) {
    multiBarcodeImg.style.cursor = 'pointer';
    multiBarcodeImg.addEventListener('click', () => setLockState(true, true));
  }
  if (singleModeBtn) {
    singleModeBtn.addEventListener('click', () => setLockState(false, true));
  }

  // Load state on page load
  loadLockState();

    let validShelves = [];
    let validShelvesLoaded = false;
    let validShelvesPromise = null;
    let positionSubmissionInFlight = false;

    // Fetch valid shelves from server
    function fetchValidShelves() {
        if (validShelvesPromise) return validShelvesPromise;

        validShelvesPromise = fetch('/api/valid_shelves')
            .then(response => response.json())
            .then(data => {
                if (data.success) {
                    validShelves = data.codes.map(c => c.toLowerCase());
                    console.log('Loaded valid shelves:', validShelves);
                    renderLocationSuggestions(document.getElementById('qrTextInput').value);
                }
            })
            .catch(err => console.error('Error loading valid shelves:', err))
            .finally(() => {
                validShelvesLoaded = true;
            });

        return validShelvesPromise;
    }
    
    // Load valid shelves on startup
    fetchValidShelves();

    // Web Audio API beep logic
    let audioUnlocked = false;
    let audioCtx = null;
    function unlockAudio() {
        if (!audioUnlocked) {
            audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            let buffer = audioCtx.createBuffer(1, 1, 22050);
            let source = audioCtx.createBufferSource();
            source.buffer = buffer;
            source.connect(audioCtx.destination);
            source.start(0);
            audioUnlocked = true;
        }
    }

    function playBeep() {
        if (!audioCtx) return;
        let duration = 0.1;
        let oscillator = audioCtx.createOscillator();
        let gain = audioCtx.createGain();
        oscillator.type = 'sine';
        oscillator.frequency.value = 880;
        gain.gain.value = 0.2;
        oscillator.connect(gain);
        gain.connect(audioCtx.destination);
        oscillator.start();
        oscillator.stop(audioCtx.currentTime + duration);
        oscillator.onended = () => {
            oscillator.disconnect();
            gain.disconnect();
        };
    }

    window.addEventListener('touchstart', unlockAudio, { once: true });
    window.addEventListener('mousedown', unlockAudio, { once: true });



    function setupDeviceMode() {
        var qrInput = document.getElementById('qrTextInput');
        // Always use handheld scanner mode (no camera)
        if (qrInput) {
            qrInput.style.display = '';
            qrInput.value = '';
            requestAnimationFrame(function() {
                qrInput.focus();
            });
        }
    }

    window.addEventListener('DOMContentLoaded', setupDeviceMode);

    // Optionally, handle QR code input for iPad/tablet
    var qrInput = document.getElementById('qrTextInput');
    var locationSuggestions = document.getElementById('locationSuggestions');
    var debounceTimer = null;

    function renderLocationSuggestions(rawValue) {
        if (!locationSuggestions) return;
        const prefix = String(rawValue || '').trim().toLowerCase();
        if (!prefix) {
            locationSuggestions.innerHTML = '';
            locationSuggestions.classList.remove('visible');
            return;
        }
        const matches = validShelves
            .filter(code => code.startsWith(prefix))
            .slice(0, 12);
        locationSuggestions.innerHTML = '';
        matches.forEach(code => {
            const option = document.createElement('button');
            option.type = 'button';
            option.className = 'location-option';
            option.textContent = code.toUpperCase();
            option.addEventListener('click', () => {
                qrInput.value = code;
                renderLocationSuggestions('');
                qrInput.dispatchEvent(new Event('input', { bubbles: true }));
            });
            locationSuggestions.appendChild(option);
        });
        locationSuggestions.classList.toggle('visible', matches.length > 0);
    }

    if (qrInput) {
        qrInput.addEventListener('input', function() {
            var inputEl = this;
            var code = inputEl.value.trim();
            var flashMsg = document.getElementById('flashMsg');
            renderLocationSuggestions(code);
            
            // Clear any pending validation
            if (debounceTimer) clearTimeout(debounceTimer);
            
            // Hide error message while typing
            if (flashMsg) flashMsg.style.display = 'none';

            // Set delay for validation
            debounceTimer = setTimeout(async function() {
                if (!code) return;

                // A fast scan can arrive before the shelf list finishes loading.
                // Wait for that initial lookup so valid custom shelf codes are not
                // intermittently rejected by the fallback-only validation below.
                if (!validShelvesLoaded) {
                    await fetchValidShelves();
                }

                // Ignore stale validation if the operator scanned/typed another
                // value while the shelf lookup was still in flight.
                if (inputEl.value.trim() !== code) return;

                let isValid = false;
                if (validShelves.length > 0) {
                    if (validShelves.includes(code.toLowerCase())) isValid = true;
                }
                if (!isValid && code.match(/^(gr[1-5]|or[1-3])s[2-6]$/i)) isValid = true;

                if (isValid) {
                    if (positionSubmissionInFlight) return;
                    positionSubmissionInFlight = true;
                    renderLocationSuggestions('');
                    const posCode = code;
                    document.getElementById('scanned_result').value = posCode;
                    sessionStorage.setItem('item_position', posCode);
                    var greenScreen = document.getElementById('green-screen');
                    greenScreen.classList.add('visible');
                    // Play positive beep
                    try {
                        var ctx = window.audioCtx || new (window.AudioContext || window.webkitAudioContext)();
                        window.audioCtx = ctx;
                        var osc = ctx.createOscillator();
                        var gain = ctx.createGain();
                        osc.type = 'sine';
                        osc.frequency.value = 880;
                        gain.gain.value = 0.2;
                        osc.connect(gain);
                        gain.connect(ctx.destination);
                        osc.start();
                        osc.stop(ctx.currentTime + 0.15);
                        osc.onended = function() {
                            osc.disconnect();
                            gain.disconnect();
                        };
                    } catch(e) {}
                    // If in edit mode, call API and redirect back
                    const urlParams = new URLSearchParams(window.location.search);
                    const editId = urlParams.get('edit_rack_id');
                    if(editId){
                        fetch('/api/set_rack_location', {method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({id: editId, item_position: posCode})})
                        .then(r=>r.json()).then(j=>{
                            // redirect back to searchrack
                            setTimeout(()=>{ window.location.href = '/searchrack'; }, 600);
                        }).catch(err=>{ console.error('set location failed',err); setTimeout(()=>{ window.location.href = '/searchrack'; }, 600); });
                    } else {
                        setTimeout(function() { document.getElementById('scan_form').submit(); }, 200);
                    }
                    // Auto-clear the input after processing
                    inputEl.value = '';
                } else {
                    const isValidPrefix = validShelves.some(shelf => shelf.startsWith(code.toLowerCase()));
                    // Only show error if it's a substantial input (e.g. > 3 chars)
                    if (code.length > 3 && !isValidPrefix) {
                        if (flashMsg) flashMsg.style.display = 'none';
                        showInvalidModal();
                        // Play error beep
                        try {
                            var ctx = window.audioCtx || new (window.AudioContext || window.webkitAudioContext)();
                            window.audioCtx = ctx;
                            var osc = ctx.createOscillator();
                            var gain = ctx.createGain();
                            osc.type = 'square';
                            osc.frequency.value = 220;
                            gain.gain.value = 0.3;
                            osc.connect(gain);
                            gain.connect(ctx.destination);
                            osc.start();
                            osc.stop(ctx.currentTime + 0.25);
                            osc.onended = function() {
                                osc.disconnect();
                                gain.disconnect();
                            };
                        } catch(e) {}
                        setTimeout(function() {
                            inputEl.value = '';
                        }, 300);
                    }
                }
            }, 500); // 0.5s delay
        });
    }

    window.addEventListener('load', () => {
        // Check if this is for diagnostic workflow
        const urlParams = new URLSearchParams(window.location.search);
        const forDiagnostic = urlParams.get('for_diagnostic');
        const returnUrl = urlParams.get('return');
        const editId = urlParams.get('edit_rack_id');
        const moveQty = urlParams.get('move_qty');
        
        // Show edit mode banner if editing
        if(editId){
            const banner = document.getElementById('editModeBanner');
            const qtySpan = document.getElementById('editModeQty');
            if(moveQty){
                qtySpan.textContent = moveQty;
            } else {
                qtySpan.textContent = 'ALL';
            }
            banner.style.display = 'block';
        }
        
        // Update back button to return to diagnostic page if we came from there
        if(returnUrl){
            const backBtn = document.getElementById('backBtn');
            if(backBtn) backBtn.href = returnUrl;
        }
        
        if(forDiagnostic){
            document.getElementById('for_diagnostic').value = forDiagnostic;
            document.getElementById('upc_field').value = forDiagnostic;
            if(returnUrl){
                document.getElementById('return_url').value = returnUrl;
            }
            // Change form action to diagnostic endpoint
            document.getElementById('scan_form').action = '/position/diagnostic';
        }
    });
    </script>
    
    <!-- Navigation Buttons at Bottom -->
    <div style="margin-top: 30px; width: 100%; display: flex; justify-content: center; gap: 15px; padding: 20px 0; border-top: 1px solid #eee;">
        <button id="skipBtn" type="button" style="background-color: #ffc107; color: #000; border: none; padding: 10px 24px; border-radius: 6px; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 8px; font-size: 1.1em; width: 100%; max-width: 200px;">
            <i class="fas fa-forward"></i> Skip
        </button>
        <button id="exitBtn" type="button" style="background-color: #ff4444; color: white; border: none; padding: 10px 24px; border-radius: 6px; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 8px; font-size: 1.1em; width: 100%; max-width: 200px;">
            <i class="fas fa-times"></i> Exit
        </button>
    </div>
    <script>
    // Exit button clears sessionStorage and goes to index.html
    document.addEventListener('DOMContentLoaded', function() {
        // Skip button - go to multibarcode if locked, otherwise barcode
        var skipBtn = document.getElementById('skipBtn');
        if (skipBtn) {
            skipBtn.addEventListener('click', function(e) {
                e.preventDefault();
                // Use the in-memory state (drives the UI highlight) to avoid any stale sessionStorage edge cases.
                var isLocked = (typeof positionLocked !== 'undefined') ? !!positionLocked : (sessionStorage.getItem('positionLocked') === 'true');
                window.location.href = isLocked ? '/multibarcode' : '/barcode';
            });
        }
        
        var exitBtn = document.getElementById('exitBtn');
        if (exitBtn) {
            exitBtn.addEventListener('click', function(e) {
                e.preventDefault();
                sessionStorage.removeItem('item_position');
                sessionStorage.removeItem('barcode');
                sessionStorage.removeItem('pictureposition_path');
                sessionStorage.removeItem('positionLocked');
                // Notify server to clear lock state
                fetch('/toggle', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ checked: false })
                }).catch(err => console.error('Error clearing lock:', err));
                window.location.href = '/';
            });
        }
    });
    </script>
    <script src="/static/i18n.js?v=20260203d"></script>
