<!DOCTYPE html>
<html lang="en">
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Location</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <style>
    /* Green screen overlay */
    #green-screen {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background-color: #00ff00;
        z-index: 99999;
        opacity: 0;
        pointer-events: none;
        transition: opacity 200ms ease-in-out;
    }
    
    #green-screen.visible {
        opacity: 1;
    }
    
    #green-screen .checkmark {
        position: absolute;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
        color: white;
        font-size: 120px;
        text-shadow: 0 0 20px rgba(255, 255, 255, 0.5);
    }

    body {
        font-family: sans-serif;
        max-width: 600px;
        margin: auto;
        padding: 10px;
        display: flex; /* Center content */
        flex-direction: column;
        align-items: center; /* Center horizontally */
        min-height: 100vh; /* Full viewport height */
    }
    #reader {
        width: 100%;
        max-width: 300px; /* Square container */
        margin-top: 20px;
        aspect-ratio: 1/1; /* Force square */
        background: #222;
        border-radius: 8px;
        position: relative;
        overflow: hidden;
    }
    input[type="text"] {
        width: 100%;
        font-size: 1.2em;
        padding: 10px;
        margin-top: 20px;
    }
    button {
        font-size: 18px;
        padding: 10px 20px;
        margin-top: 10px;
    }

    /* Simple scanning line animation */
    .qr-overlay {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        pointer-events: none;
        z-index: 9999;
        display: none;
    }

    .qr-square {
        position: absolute;
        width: 200px;
        height: 200px;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
        border: 2px solid rgba(255, 255, 255, 0.8);
    }

    .qr-scan-line {
        position: absolute;
        width: 100%;
        height: 2px;
        background-color: #ff0000;
        top: 0;
        left: 0;
        animation: scanAnimation 2s linear infinite;
    }

    @keyframes scanAnimation {
        0% { top: 0; }
        50% { top: calc(100% - 2px); }
        50.001% { top: calc(100% - 2px); }
        100% { top: 0; }
    }
    </style>
</head>
<body>
    <div style="display: flex; justify-content: center; align-items: center; margin-bottom: 20px; gap: 15px;">
        <h1 style="margin: 0;">Location</h1>
        <img src="/static/qrcode.jpg" alt="QR Code" style="width:50px; height:50px; object-fit:contain; border:2px solid #000; background:#fff;" />
    </div>
    <div id="reader"></div>

    <!-- Simplified overlay with just the scanning line -->
    <div class="qr-overlay" id="qrOverlay">
        <div class="qr-square">
            <div class="qr-scan-line"></div>
        </div>
    </div>

    <!-- QR Code Text Input (hidden by default, shown for iPad/tablet) -->
    <input type="text" id="qrTextInput" name="qrTextInput" placeholder="Scan or enter QR code" style="width:100%;font-size:1.2em;padding:10px;margin-top:20px;display:none;" autocomplete="off" />

    <div style="margin: 20px 0; display: flex; flex-direction: column; gap: 15px; width: 100%; max-width: 300px;">
        <button onclick="restartScanner()" style="background-color: #2196F3; color: white; border: none; padding: 12px; border-radius: 6px; cursor: pointer; font-size: 1.1em; display: flex; align-items: center; justify-content: center; gap: 8px;">
            <i class="fas fa-sync-alt"></i> Restart Scanner
        </button>
        <button id="picturePositionBtn" type="button" style="background-color: #ff4444; color: white; border: none; padding: 12px; border-radius: 6px; cursor: pointer; font-size: 1.1em; display: flex; align-items: center; justify-content: center; gap: 8px;">
            <i class="fas fa-camera"></i> NO SHELF (take a picture)
        </button>
    </div>
    <form id="scan_form" action="/submitposition" method="POST" style="display: none;">
        <input name="scanned_result" type="text" id="scanned_result">
    </form>
    <form action="/toggle" method="POST" style="margin-top: 10px; text-align: center;">
        <label>
            <input type="checkbox" id="featureToggle"> KEEP SAME POSITION?
        </label>
    </form>
    <button id="flashBtn" type="button" style="display:none">Turn On Flashlight</button>
    <div id="flashMsg" style="color:red; display:none; font-size:0.9em;"></div>
    <div id="green-screen">
        <i class="fas fa-check-circle checkmark"></i>
    </div>

    <script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
    <script>
  document.getElementById('featureToggle').addEventListener('change', function () {
    fetch('/toggle', {
      method: 'POST',
      headers: {
        'Content-Type': 'application/json'
      },
      body: JSON.stringify({ checked: this.checked })
    })
    .then(response => response.json())
    .then(data => {
      console.log("Server says:", data.message);  // Optional feedback
    })
    .catch(error => console.error('Error:', error));
  });

    let scannerActive = false;
    let html5QrCode = null;
    let track = null;
    let torchOn = false;

    // Web Audio API beep logic
    let audioUnlocked = false;
    let audioCtx = null;
    function unlockAudio() {
        if (!audioUnlocked) {
            audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            let buffer = audioCtx.createBuffer(1, 1, 22050);
            let source = audioCtx.createBufferSource();
            source.buffer = buffer;
            source.connect(audioCtx.destination);
            source.start(0);
            audioUnlocked = true;
        }
    }

    function playBeep() {
        if (!audioCtx) return;
        let duration = 0.1;
        let oscillator = audioCtx.createOscillator();
        let gain = audioCtx.createGain();
        oscillator.type = 'sine';
        oscillator.frequency.value = 880;
        gain.gain.value = 0.2;
        oscillator.connect(gain);
        gain.connect(audioCtx.destination);
        oscillator.start();
        oscillator.stop(audioCtx.currentTime + duration);
        oscillator.onended = () => {
            oscillator.disconnect();
            gain.disconnect();
        };
    }

    window.addEventListener('touchstart', unlockAudio, { once: true });
    window.addEventListener('mousedown', unlockAudio, { once: true });

    // Position overlay based on reader element position
    function positionOverlay() {
        const reader = document.getElementById('reader');
        const overlay = document.getElementById('qrOverlay');
        if (!reader || !overlay) return;

        const rect = reader.getBoundingClientRect();

        overlay.style.left = rect.left + 'px';
        overlay.style.top = rect.top + 'px';
        overlay.style.width = rect.width + 'px';
        overlay.style.height = rect.height + 'px';
        overlay.style.display = scannerActive ? 'block' : 'none';
    }

    function startScanner() {
        if (scannerActive) return;

        // Configure and start scanner
        html5QrCode = new Html5Qrcode("reader");

        html5QrCode.start(
            { facingMode: "environment" },
            {
                fps: 10,
                qrbox: { width: 200, height: 200 },
                aspectRatio: 1.0,
                showTorchButtonIfSupported: false,
                showZoomSliderIfSupported: false,
                hideQrBoxOnSuccess: false,
                disableFlip: true
            },
            (decodedText) => {
                const code = decodedText.trim();
                if (!code.match(/^(gr[1-5]|or[1-3])s[2-6]$/)) return;
                document.getElementById("scanned_result").value = code;
                // Set sessionStorage for additem checklist
                sessionStorage.setItem('item_position', code);
                stopScanner();
                playBeep();
                // Show green screen and submit after delay
                const greenScreen = document.getElementById('green-screen');
                greenScreen.classList.add('visible');
                setTimeout(() => {
                    document.getElementById("scan_form").submit();
                }, 1000);
            },
            (error) => {}
        ).then(() => {
            scannerActive = true;

            // Show overlay after scanner starts
            setTimeout(() => {
                positionOverlay();
                window.addEventListener('resize', positionOverlay);

                // Hide the library's built-in QR box
                const qrRegion = document.querySelector("#reader div");
                if (qrRegion) {
                    // Add CSS to hide internal scanner box
                    const style = document.createElement('style');
                    style.id = 'qr-box-hider';
                    style.innerHTML = `
                        #reader div div {
                            border: none !important;
                            border-color: transparent !important;
                            box-shadow: none !important;
                        }
                        #reader canvas + div {
                            display: none !important;
                        }
                    `;
                    document.head.appendChild(style);
                }
            }, 500);

            // Get camera track for flashlight
            const stream = html5QrCode._localMediaStream;
            if (stream && stream.getVideoTracks) {
                track = stream.getVideoTracks()[0];
                checkTorchSupport();
            }
        }).catch((err) => {
            console.error("Failed to start scanner:", err);
            scannerActive = false;
        });
    }

    function stopScanner() {
        if (!scannerActive) return;
        if (html5QrCode) {
            html5QrCode.stop().then(() => {
                document.getElementById('qrOverlay').style.display = 'none';
                window.removeEventListener('resize', positionOverlay);

                // Remove the style element we added
                const styleElem = document.getElementById('qr-box-hider');
                if (styleElem) styleElem.remove();

                scannerActive = false;
            }).catch((err) => {
                console.error("Failed to stop scanner:", err);
            });
        }
        scannerActive = false;
    }

    function restartScanner() {
        stopScanner();
        setTimeout(() => {
            startScanner();
        }, 300);
    }

    // Flashlight logic
    function checkTorchSupport() {
        if (!track) return;
        const capabilities = track.getCapabilities ? track.getCapabilities() : {};
        if (capabilities.torch) {
            document.getElementById('flashBtn').style.display = '';
        } else {
            document.getElementById('flashBtn').style.display = 'none';
            document.getElementById('flashMsg').textContent = 'Flashlight not supported on this device/browser.';
            document.getElementById('flashMsg').style.display = '';
        }
    }

    document.getElementById('flashBtn').addEventListener('click', async function() {
        if (!track) return;
        try {
            torchOn = !torchOn;
            await track.applyConstraints({
                advanced: [{ torch: torchOn }]
            });
            this.textContent = torchOn ? 'Turn Off Flashlight' : 'Turn On Flashlight';
        } catch (e) {
            document.getElementById('flashMsg').textContent = 'Failed to toggle flashlight.';
            document.getElementById('flashMsg').style.display = '';
        }
    });

    document.getElementById('picturePositionBtn').addEventListener('click', function() {
        window.location.href = '/pictureposition';
    });

    function getDeviceType() {
        const ua = navigator.userAgent;
        if (/iPad|Macintosh/.test(ua) && 'ontouchend' in document) return 'iPad';
        if (/Android/.test(ua) && !/Mobile/.test(ua)) return 'Android Tablet';
        if (/iPhone|Android.*Mobile|Windows Phone|webOS|BlackBerry|Opera Mini|IEMobile|Mobile/.test(ua)) return 'Mobile';
        return 'Desktop';
    }

    function setupDeviceMode() {
        var deviceType = getDeviceType();
        var qrInput = document.getElementById('qrTextInput');
        var readerDiv = document.getElementById('reader');
        if (deviceType === 'iPad' || deviceType === 'Android Tablet') {
            // Hide camera/QR scanner, show QR input
            if (readerDiv) readerDiv.style.display = 'none';
            if (qrInput) {
                qrInput.style.display = '';
                // Remove any value so cursor appears at start
                qrInput.value = '';
                // Use requestAnimationFrame for reliable cursor focus
                requestAnimationFrame(function() {
                    qrInput.focus();
                });
            }
            // Hide overlay and camera controls
            var overlay = document.getElementById('qrOverlay');
            if (overlay) overlay.style.display = 'none';
            document.getElementById('flashBtn').style.display = 'none';
            document.getElementById('flashMsg').style.display = 'none';
            // Prevent scanner from starting
            window.startScanner = function(){};
        } else {
            // Mobile or desktop: keep camera, hide QR input
            if (readerDiv) readerDiv.style.display = '';
            if (qrInput) qrInput.style.display = 'none';
        }
    }

    window.addEventListener('DOMContentLoaded', setupDeviceMode);

    // Optionally, handle QR code input for iPad/tablet
    var qrInput = document.getElementById('qrTextInput');
    if (qrInput) {
        qrInput.addEventListener('input', function() {
            var code = this.value.trim();
            if (code.match(/^(gr[1-5]|or[1-3])s[2-6]$/i)) {
                document.getElementById('scanned_result').value = code;
                sessionStorage.setItem('item_position', code);
                // Show green screen and submit after delay
                var greenScreen = document.getElementById('green-screen');
                greenScreen.classList.add('visible');
                setTimeout(function() {
                    document.getElementById('scan_form').submit();
                }, 1000);
            }
        });
    }

    // Start scanner on page load
    window.addEventListener('load', () => {
        setTimeout(startScanner, 500);
    });
    </script>
    
    <!-- Navigation Buttons at Bottom -->
    <div style="margin-top: 30px; width: 100%; display: flex; justify-content: center; gap: 15px; padding: 20px 0; border-top: 1px solid #eee;">
        <a href="/barcode" style="text-decoration: none; flex: 1; max-width: 200px;">
            <button style="background-color: #ffc107; color: #000; border: none; padding: 10px 24px; border-radius: 6px; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 8px; font-size: 1.1em; width: 100%;">
                <i class="fas fa-forward"></i> Skip
            </button>
        </a>
        <a href="/" style="text-decoration: none; flex: 1; max-width: 200px;">
            <button style="background-color: #ff4444; color: white; border: none; padding: 10px 24px; border-radius: 6px; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 8px; font-size: 1.1em; width: 100%;">
                <i class="fas fa-times"></i> Exit
            </button>
        </a>
    </div>
</body>
</html>
