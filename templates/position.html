<!DOCTYPE html>
<html lang="en">
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title data-i18n="location_step_title">Location QR (step 1/2)</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <style>
    /* Green screen overlay */
    #green-screen {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background-color: #00ff00;
        z-index: 99999;
        opacity: 0;
        pointer-events: none;
        transition: opacity 200ms ease-in-out;
    }
    
    #green-screen.visible {
        opacity: 1;
    }
    
    #green-screen .checkmark {
        position: absolute;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
        color: white;
        font-size: 120px;
        text-shadow: 0 0 20px rgba(255, 255, 255, 0.5);
    }

    body {
        font-family: sans-serif;
        max-width: 600px;
        margin: auto;
        padding: 10px;
        display: flex; /* Center content */
        flex-direction: column;
        align-items: center; /* Center horizontally */
        min-height: 100vh; /* Full viewport height */
    }
    #reader {
        width: 100%;
        max-width: 300px; /* Square container */
        margin-top: 20px;
        aspect-ratio: 1/1; /* Force square */
        background: #222;
        border-radius: 8px;
        position: relative;
        overflow: hidden;
    }
    input[type="text"] {
        width: 100%;
        font-size: 1.2em;
        padding: 10px;
        margin-top: 20px;
    }
    button {
        font-size: 18px;
        padding: 10px 20px;
        margin-top: 10px;
    }

    /* Simple scanning line animation */
    .qr-overlay {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        pointer-events: none;
        z-index: 9999;
        display: none;
    }

    .qr-square {
        position: absolute;
        width: 200px;
        height: 200px;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
        border: 2px solid rgba(255, 255, 255, 0.8);
    }

    .qr-scan-line {
        position: absolute;
        width: 100%;
        height: 2px;
        background-color: #ff0000;
        top: 0;
        left: 0;
        animation: scanAnimation 2s linear infinite;
    }

    @keyframes scanAnimation {
        0% { top: 0; }
        50% { top: calc(100% - 2px); }
        50.001% { top: calc(100% - 2px); }
        100% { top: 0; }
    }

    .img-highlight {
        outline: 4px solid #2ecc71;
        outline-offset: 3px;
        box-shadow: 0 0 0 2px rgba(46, 204, 113, 0.25);
    }
    .title-line {
        display: flex;
        align-items: baseline;
        gap: 6px;
    }
    .title-main {
        color: #222;
        font-weight: 600;
    }
    .title-qr {
        color: #2ecc71;
        font-weight: 800;
    }
    .title-step {
        color: #555;
        font-weight: 600;
        font-size: 0.85em;
    }

    .invalid-modal {
        display: none;
        position: fixed;
        inset: 0;
        background: rgba(0,0,0,0.55);
        z-index: 99999;
        align-items: center;
        justify-content: center;
        padding: 20px;
    }
    .invalid-card {
        background: #fff;
        border-radius: 12px;
        padding: 18px 20px 16px;
        width: 92%;
        max-width: 420px;
        box-shadow: 0 12px 30px rgba(0,0,0,0.25);
        border: 1px solid #e6e6e6;
        position: relative;
    }
    .invalid-accent {
        height: 6px;
        border-radius: 6px;
        background: linear-gradient(90deg, #e74c3c, #f39c12);
        margin: -18px -20px 14px;
    }
    .invalid-title {
        margin: 0 0 8px;
        font-size: 1.05rem;
        font-weight: 700;
        color: #2c3e50;
    }
    .invalid-text {
        margin: 0 0 12px;
        font-size: 0.98rem;
        color: #333;
        line-height: 1.45;
    }
    .invalid-close {
        background: #e74c3c;
        color: #fff;
        border: none;
        border-radius: 8px;
        padding: 8px 12px;
        cursor: pointer;
        font-weight: 600;
    }

    </style>
</head>
<body>
    <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:20px;gap:12px;width:100%;">
        <div style="width:120px;"></div>
        <div style="display:flex;flex-direction:column;align-items:center;gap:6px;">
            <h1 style="margin: 0 0 8px 0; display:flex; flex-direction:column; align-items:center; gap:4px;">
                <span class="title-line">
                    <span class="title-main" data-i18n="location">Location</span>
                    <span class="title-qr" data-i18n="qr">QR</span>
                </span>
                <span class="title-step" data-i18n="step_1_2">(step 1/2)</span>
            </h1>
            <img id="singleBarcodeImg" class="img-highlight" src="/static/singlebarcodeexample.png?v=20260203" alt="QR Code" style="width:180px; height:180px; object-fit:contain; border:2px solid #000; background:#fff; margin-bottom:10px;" />
            <button id="singleModeBtn" type="button" data-i18n="single_item" style="margin-top:4px;background:#2ecc71;color:#fff;border:none;padding:10px 14px;border-radius:8px;cursor:pointer;font-size:1.05em;font-weight:700;min-width:180px;">Single Item (SCAN QR CODE)</button>
        </div>
        <div style="width:120px;"></div>
    </div>
    
    <!-- Edit Mode Banner -->
    <div id="editModeBanner" style="display:none; background:#ff9800; color:white; padding:12px; text-align:center; font-weight:bold; margin-bottom:15px; border-radius:8px; box-shadow:0 2px 8px rgba(0,0,0,0.2);">
        📦 EDIT MODE: Moving <span id="editModeQty">?</span> items
    </div>
    
    <div id="reader"></div>

    <!-- Simplified overlay with just the scanning line -->
    <div class="qr-overlay" id="qrOverlay">
        <div class="qr-square">
            <div class="qr-scan-line"></div>
        </div>
    </div>

    <!-- Notification for invalid QR code (hidden by default) -->
    <div id="flashMsg" style="color:#d32f2f; background:#ffdddd; display:none; font-size:0.9em; font-weight:bold; text-align:center; margin-bottom:8px; border-radius:6px; padding:8px;"></div>
    
    <!-- Input with camera button -->
    <div style="display: flex; gap: 10px; align-items: center; margin-top: 20px;">
        <input type="text" id="qrTextInput" name="qrTextInput" placeholder="Scan or enter QR code" style="flex: 1; font-size:1.2em; padding:10px; display:none;" autocomplete="off" />
    </div>

    <div style="margin: 20px 0; display: flex; flex-direction: column; gap: 15px; width: 100%; max-width: 300px;">
        <button id="restartScannerBtn" onclick="restartScanner()" style="background-color: #2196F3; color: white; border: none; padding: 12px; border-radius: 6px; cursor: pointer; font-size: 1.1em; display: flex; align-items: center; justify-content: center; gap: 8px;">
            <i class="fas fa-sync-alt"></i> <span data-i18n="restart_scanner">Restart Scanner</span>
        </button>
    </div>
    <form id="scan_form" action="/submitposition" method="POST" style="display: none;">
        <input name="scanned_result" type="text" id="scanned_result">
        <input name="for_diagnostic" type="hidden" id="for_diagnostic">
        <input name="return_url" type="hidden" id="return_url">
        <input name="upc" type="hidden" id="upc_field">
        <input name="position_locked" type="hidden" id="position_locked_field" value="false">
    </form>
    <!-- Lock Shelf button (replaces checkbox) -->
    <div style="margin-top: 20px; text-align: center; display:flex; flex-direction:column; align-items:center; gap:10px;">
        <div style="display:flex; align-items:center; gap:8px; width:100%; max-width:360px; justify-content:center;">
            <div style="display:flex; flex-direction:column; align-items:center; gap:6px; width:100%;">
                <img id="multiBarcodeImg" src="/static/multibarcodeexample.png?v=20260203" alt="Multi barcode example" style="width:158px;height:158px;object-fit:contain;background:#fff;border-radius:6px;border:1px solid #d0d0d0;box-shadow:0 2px 6px rgba(0,0,0,0.08);">
                <button id="lockPositionBtn" type="button" style="background-color: #757575; color: white; border: none; padding: 16px 24px; border-radius: 8px; cursor: pointer; font-size: 1.2em; display: inline-flex; align-items: center; justify-content: center; gap: 10px; font-weight: bold; transition: background 0.3s; width:100%;">
                    <i class="fas fa-unlock" id="lockIcon"></i>
                    <span id="lockText" data-i18n="lock_shelf_multi">Scan Multiple Barcodes (Same Shelf)</span>
                </button>
            </div>
        </div>
        <div style="display:flex; align-items:center; gap:8px; width:100%; max-width:360px; justify-content:center;">
            <div style="display:flex; flex-direction:column; align-items:center; gap:6px; width:100%;">
                <img src="/static/movelocationexample.png?v=20260203" alt="Move items example" style="width:158px;height:158px;object-fit:contain;background:#fff;border-radius:6px;border:1px solid #d0d0d0;box-shadow:0 2px 6px rgba(0,0,0,0.08);">
                <a href="/movelocation" style="text-decoration:none; width:100%;">
                    <button style="background:#2d98da;color:#fff;border:none;padding:12px 18px;border-radius:8px;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:8px;font-size:1.05em;font-weight:600;width:100%;">
                        <i class="fas fa-exchange-alt"></i> <span data-i18n="move_items_location">Move Items to Another Location</span>
                    </button>
                </a>
            </div>
        </div>
    </div>
    <button id="flashBtn" type="button" style="display:none">Turn On Flashlight</button>
    <div id="flashMsg" style="color:red; display:none; font-size:0.9em;"></div>
    <div id="green-screen">
        <i class="fas fa-check-circle checkmark"></i>
    </div>

    <div id="invalidModal" class="invalid-modal">
        <div class="invalid-card">
            <div class="invalid-accent"></div>
            <h3 class="invalid-title" id="invalidModalTitle" data-i18n="invalid_location_title">Invalid Shelf Code</h3>
            <p class="invalid-text" id="invalidModalBody" data-i18n="invalid_location_body">This is not a valid shelf/location code. Please scan a shelf QR code.</p>
            <div style="text-align:right;">
                <button class="invalid-close" id="invalidModalClose" data-i18n="close">Close</button>
            </div>
        </div>
    </div>

    <script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
    <script>
  // Lock Position button logic (replaces checkbox)
  let positionLocked = false;
  const lockBtn = document.getElementById('lockPositionBtn');
  const lockIcon = document.getElementById('lockIcon');
  const lockText = document.getElementById('lockText');
  const singleBarcodeImg = document.getElementById('singleBarcodeImg');
  const multiBarcodeImg = document.getElementById('multiBarcodeImg');
  const singleModeBtn = document.getElementById('singleModeBtn');
  const invalidModal = document.getElementById('invalidModal');
  const invalidModalClose = document.getElementById('invalidModalClose');
  let invalidModalOpen = false;
  const t = (key, fallback) => (window.i18n && window.i18n.t) ? window.i18n.t(key) : fallback;
  function setLockText(key, fallback) {
    if (lockText) {
      lockText.setAttribute('data-i18n', key);
      lockText.textContent = t(key, fallback);
    }
  }
  function updateImageHighlight() {
    if (!singleBarcodeImg || !multiBarcodeImg) return;
    if (positionLocked) {
      singleBarcodeImg.classList.remove('img-highlight');
      multiBarcodeImg.classList.add('img-highlight');
    } else {
      multiBarcodeImg.classList.remove('img-highlight');
      singleBarcodeImg.classList.add('img-highlight');
    }
    if (singleModeBtn) {
      singleModeBtn.style.backgroundColor = positionLocked ? '#9e9e9e' : '#2ecc71';
      singleModeBtn.style.color = '#fff';
    }
  }

  function showInvalidModal() {
    if (!invalidModal || invalidModalOpen) return;
    invalidModalOpen = true;
    invalidModal.style.display = 'flex';
  }

  function closeInvalidModal() {
    if (!invalidModal) return;
    invalidModalOpen = false;
    invalidModal.style.display = 'none';
  }

  if (invalidModalClose) invalidModalClose.addEventListener('click', closeInvalidModal);
  if (invalidModal) {
    invalidModal.addEventListener('click', (e) => {
      if (e.target === invalidModal) closeInvalidModal();
    });
  }

  function setLockState(locked, notifyServer = true) {
    positionLocked = !!locked;
    if (positionLocked) {
      lockBtn.style.backgroundColor = '#43a047'; // Green when locked
      lockIcon.className = 'fas fa-lock';
      setLockText('locked_multi', 'Scan Multiple Barcodes (Same Shelf)');
      sessionStorage.setItem('positionLocked', 'true');
      document.getElementById('position_locked_field').value = 'true';

      // Auto-focus on input field for immediate scanning
      const qrInput = document.getElementById('qrTextInput');
      if (qrInput && qrInput.style.display !== 'none') {
        setTimeout(() => {
          qrInput.focus();
          qrInput.click();
          qrInput.select();
        }, 100);
      }
    } else {
      lockBtn.style.backgroundColor = '#757575'; // Gray when unlocked
      lockIcon.className = 'fas fa-unlock';
      setLockText('lock_shelf_multi', 'Scan Multiple Barcodes (Same Shelf)');
      sessionStorage.removeItem('positionLocked');
      document.getElementById('position_locked_field').value = 'false';
      // Clear position when unlocking
      sessionStorage.removeItem('item_position');
      sessionStorage.removeItem('pictureposition_path');
    }
    updateImageHighlight();

    if (notifyServer) {
      fetch('/toggle', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ checked: positionLocked })
      })
      .then(response => response.json())
      .then(data => {
        console.log("Server says:", data.message);
      })
      .catch(error => console.error('Error:', error));
    }
  }

  // Load lock state from sessionStorage on page load
  function loadLockState() {
    const stored = sessionStorage.getItem('positionLocked');
    setLockState(stored === 'true', false);
  }

  lockBtn.addEventListener('click', function () {
    setLockState(!positionLocked, true);
  });

  if (singleBarcodeImg) {
    singleBarcodeImg.style.cursor = 'pointer';
    singleBarcodeImg.addEventListener('click', () => setLockState(false, true));
  }
  if (multiBarcodeImg) {
    multiBarcodeImg.style.cursor = 'pointer';
    multiBarcodeImg.addEventListener('click', () => setLockState(true, true));
  }
  if (singleModeBtn) {
    singleModeBtn.addEventListener('click', () => setLockState(false, true));
  }

  // Load state on page load
  loadLockState();

    let scannerActive = false;
    let html5QrCode = null;
    let track = null;
    let torchOn = false;
    let validShelves = [];

    // Fetch valid shelves from server
    function fetchValidShelves() {
        fetch('/api/valid_shelves')
            .then(response => response.json())
            .then(data => {
                if (data.success) {
                    validShelves = data.codes.map(c => c.toLowerCase());
                    console.log('Loaded valid shelves:', validShelves);
                }
            })
            .catch(err => console.error('Error loading valid shelves:', err));
    }
    
    // Load valid shelves on startup
    fetchValidShelves();

    // Web Audio API beep logic
    let audioUnlocked = false;
    let audioCtx = null;
    function unlockAudio() {
        if (!audioUnlocked) {
            audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            let buffer = audioCtx.createBuffer(1, 1, 22050);
            let source = audioCtx.createBufferSource();
            source.buffer = buffer;
            source.connect(audioCtx.destination);
            source.start(0);
            audioUnlocked = true;
        }
    }

    function playBeep() {
        if (!audioCtx) return;
        let duration = 0.1;
        let oscillator = audioCtx.createOscillator();
        let gain = audioCtx.createGain();
        oscillator.type = 'sine';
        oscillator.frequency.value = 880;
        gain.gain.value = 0.2;
        oscillator.connect(gain);
        gain.connect(audioCtx.destination);
        oscillator.start();
        oscillator.stop(audioCtx.currentTime + duration);
        oscillator.onended = () => {
            oscillator.disconnect();
            gain.disconnect();
        };
    }

    window.addEventListener('touchstart', unlockAudio, { once: true });
    window.addEventListener('mousedown', unlockAudio, { once: true });

    // Position overlay based on reader element position
    function positionOverlay() {
        const reader = document.getElementById('reader');
        const overlay = document.getElementById('qrOverlay');
        if (!reader || !overlay) return;

        const rect = reader.getBoundingClientRect();

        overlay.style.left = rect.left + 'px';
        overlay.style.top = rect.top + 'px';
        overlay.style.width = rect.width + 'px';
        overlay.style.height = rect.height + 'px';
        overlay.style.display = scannerActive ? 'block' : 'none';
    }

    function startScanner() {
        if (scannerActive) return;

        // Configure and start scanner
        html5QrCode = new Html5Qrcode("reader");

        html5QrCode.start(
            { facingMode: "environment" },
            {
                fps: 10,
                qrbox: { width: 200, height: 200 },
                aspectRatio: 1.0,
                showTorchButtonIfSupported: false,
                showZoomSliderIfSupported: false,
                hideQrBoxOnSuccess: false,
                disableFlip: true
            },
            (decodedText) => {
                const code = decodedText.trim();
                let isValid = false;
                
                // Check dynamic list first
                if (validShelves.length > 0) {
                    if (validShelves.includes(code.toLowerCase())) isValid = true;
                }
                
                // Also allow legacy codes if they match regex
                if (!isValid && code.match(/^(gr[1-5]|or[1-3])s[2-6]$/i)) isValid = true;
                
                if (!isValid) {
                    showInvalidModal();
                    return;
                }
                
                const posCode = code;
                document.getElementById("scanned_result").value = posCode;
                    // Set sessionStorage for additem checklist
                    sessionStorage.setItem('item_position', posCode);
                    stopScanner();
                    playBeep();
                    // Show green screen
                    const greenScreen = document.getElementById('green-screen');
                    greenScreen.classList.add('visible');
                    // If this page was opened for editing a SEARCHRACK row, call API to set it and then return
                    const urlParams = new URLSearchParams(window.location.search);
                    const editId = urlParams.get('edit_rack_id');
                    if(editId){
                        // call API - include move_qty if provided in URL OR sessionStorage
                        let moveQty = urlParams.get('move_qty');
                        
                        // Fallback: read from sessionStorage if not in URL (cache issue workaround)
                        if(!moveQty && editId === sessionStorage.getItem('edit_rack_id')){
                            moveQty = sessionStorage.getItem('edit_move_qty');
                        }
                        
                        const payload = {id: editId, item_position: posCode};
                        if(moveQty){
                            payload.move_qty = parseInt(moveQty);
                        }
                        
                        // Clear sessionStorage after reading
                        sessionStorage.removeItem('edit_move_qty');
                        sessionStorage.removeItem('edit_rack_id');
                        fetch('/api/set_rack_location', {method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify(payload)})
                        .then(r=>r.json())
                        .then(j=>{
                            console.log('✅ Location update response:', j);
                            // restore search state if any
                            const st = sessionStorage.getItem('searchrack_return_state');
                            if(st){
                                sessionStorage.removeItem('searchrack_return_state');
                            }
                            // briefly show green then redirect back with cache buster
                            setTimeout(()=>{ window.location.href = '/searchrack?refresh=' + Date.now(); }, 600);
                        }).catch(err=>{ console.error('Failed to set rack location', err); setTimeout(()=>{ window.location.href = '/searchrack?refresh=' + Date.now(); }, 600); });
                    } else {
                        // normal flow: submit form to /submitposition
                        setTimeout(() => { document.getElementById("scan_form").submit(); }, 250);
                    }
            },
            (error) => {}
        ).then(() => {
            scannerActive = true;

            // Show overlay after scanner starts
            setTimeout(() => {
                positionOverlay();
                window.addEventListener('resize', positionOverlay);

                // Hide the library's built-in QR box
                const qrRegion = document.querySelector("#reader div");
                if (qrRegion) {
                    // Add CSS to hide internal scanner box
                    const style = document.createElement('style');
                    style.id = 'qr-box-hider';
                    style.innerHTML = `
                        #reader div div {
                            border: none !important;
                            border-color: transparent !important;
                            box-shadow: none !important;
                        }
                        #reader canvas + div {
                            display: none !important;
                        }
                    `;
                    document.head.appendChild(style);
                }
            }, 500);

            // Get camera track for flashlight
            const stream = html5QrCode._localMediaStream;
            if (stream && stream.getVideoTracks) {
                track = stream.getVideoTracks()[0];
                checkTorchSupport();
            }
        }).catch((err) => {
            console.error("Failed to start scanner:", err);
            scannerActive = false;
        });
    }

    function stopScanner() {
        if (!scannerActive) return;
        if (html5QrCode) {
            html5QrCode.stop().then(() => {
                document.getElementById('qrOverlay').style.display = 'none';
                window.removeEventListener('resize', positionOverlay);

                // Remove the style element we added
                const styleElem = document.getElementById('qr-box-hider');
                if (styleElem) styleElem.remove();

                scannerActive = false;
            }).catch((err) => {
                console.error("Failed to stop scanner:", err);
            });
        }
        scannerActive = false;
    }

    function restartScanner() {
        stopScanner();
        setTimeout(() => {
            startScanner();
        }, 300);
    }

    // Flashlight logic
    function checkTorchSupport() {
        if (!track) return;
        const capabilities = track.getCapabilities ? track.getCapabilities() : {};
        if (capabilities.torch) {
            document.getElementById('flashBtn').style.display = '';
        } else {
            document.getElementById('flashBtn').style.display = 'none';
            document.getElementById('flashMsg').textContent = 'Flashlight not supported on this device/browser.';
            document.getElementById('flashMsg').style.display = '';
        }
    }

    document.getElementById('flashBtn').addEventListener('click', async function() {
        if (!track) return;
        try {
            torchOn = !torchOn;
            await track.applyConstraints({
                advanced: [{ torch: torchOn }]
            });
            this.textContent = torchOn ? 'Turn Off Flashlight' : 'Turn On Flashlight';
        } catch (e) {
            document.getElementById('flashMsg').textContent = 'Failed to toggle flashlight.';
            document.getElementById('flashMsg').style.display = '';
        }
    });


    function getDeviceType() {
        const ua = navigator.userAgent;
        if (/iPad|Macintosh/.test(ua) && 'ontouchend' in document) return 'iPad';
        if (/Android/.test(ua) && !/Mobile/.test(ua)) return 'Android Tablet';
        if (/iPhone|Android.*Mobile|Windows Phone|webOS|BlackBerry|Opera Mini|IEMobile|Mobile/.test(ua)) return 'Mobile';
        return 'Desktop';
    }

    function setupDeviceMode() {
        var deviceType = getDeviceType();
        var qrInput = document.getElementById('qrTextInput');
        var readerDiv = document.getElementById('reader');
        var restartBtn = document.getElementById('restartScannerBtn');
        // Check for scanner mode override
        const scannerMode = localStorage.getItem('scannerMode');
        const forceHandheld = scannerMode === 'handheld';
        
        // Always use scanner/handheld mode (no camera)
        if (readerDiv) readerDiv.style.display = 'none';
        if (qrInput) {
            qrInput.style.display = '';
            qrInput.value = '';
            requestAnimationFrame(function() {
                qrInput.focus();
            });
        }
        var overlay = document.getElementById('qrOverlay');
        if (overlay) overlay.style.display = 'none';
        document.getElementById('flashBtn').style.display = 'none';
        document.getElementById('flashMsg').style.display = 'none';
        window.startScanner = function(){};
        stopScanner();
        if (restartBtn) restartBtn.style.display = 'none';
    }

    window.addEventListener('DOMContentLoaded', setupDeviceMode);

    // Optionally, handle QR code input for iPad/tablet
    var qrInput = document.getElementById('qrTextInput');
    var debounceTimer = null;

    if (qrInput) {
        qrInput.addEventListener('input', function() {
            var inputEl = this;
            var code = inputEl.value.trim();
            var flashMsg = document.getElementById('flashMsg');
            
            // Clear any pending validation
            if (debounceTimer) clearTimeout(debounceTimer);
            
            // Hide error message while typing
            if (flashMsg) flashMsg.style.display = 'none';

            // Set delay for validation
            debounceTimer = setTimeout(function() {
                if (!code) return;

                let isValid = false;
                if (validShelves.length > 0) {
                    if (validShelves.includes(code.toLowerCase())) isValid = true;
                }
                if (!isValid && code.match(/^(gr[1-5]|or[1-3])s[2-6]$/i)) isValid = true;

                if (isValid) {
                    const posCode = code;
                    document.getElementById('scanned_result').value = posCode;
                    sessionStorage.setItem('item_position', posCode);
                    var greenScreen = document.getElementById('green-screen');
                    greenScreen.classList.add('visible');
                    // Play positive beep
                    try {
                        var ctx = window.audioCtx || new (window.AudioContext || window.webkitAudioContext)();
                        window.audioCtx = ctx;
                        var osc = ctx.createOscillator();
                        var gain = ctx.createGain();
                        osc.type = 'sine';
                        osc.frequency.value = 880;
                        gain.gain.value = 0.2;
                        osc.connect(gain);
                        gain.connect(ctx.destination);
                        osc.start();
                        osc.stop(ctx.currentTime + 0.15);
                        osc.onended = function() {
                            osc.disconnect();
                            gain.disconnect();
                        };
                    } catch(e) {}
                    // If in edit mode, call API and redirect back
                    const urlParams = new URLSearchParams(window.location.search);
                    const editId = urlParams.get('edit_rack_id');
                    if(editId){
                        fetch('/api/set_rack_location', {method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({id: editId, item_position: posCode})})
                        .then(r=>r.json()).then(j=>{
                            // redirect back to searchrack
                            setTimeout(()=>{ window.location.href = '/searchrack'; }, 600);
                        }).catch(err=>{ console.error('set location failed',err); setTimeout(()=>{ window.location.href = '/searchrack'; }, 600); });
                    } else {
                        setTimeout(function() { document.getElementById('scan_form').submit(); }, 200);
                    }
                    // Auto-clear the input after processing
                    inputEl.value = '';
                } else {
                    // Only show error if it's a substantial input (e.g. > 3 chars)
                    if (code.length > 3) {
                        if (flashMsg) flashMsg.style.display = 'none';
                        showInvalidModal();
                        // Play error beep
                        try {
                            var ctx = window.audioCtx || new (window.AudioContext || window.webkitAudioContext)();
                            window.audioCtx = ctx;
                            var osc = ctx.createOscillator();
                            var gain = ctx.createGain();
                            osc.type = 'square';
                            osc.frequency.value = 220;
                            gain.gain.value = 0.3;
                            osc.connect(gain);
                            gain.connect(ctx.destination);
                            osc.start();
                            osc.stop(ctx.currentTime + 0.25);
                            osc.onended = function() {
                                osc.disconnect();
                                gain.disconnect();
                            };
                        } catch(e) {}
                        setTimeout(function() {
                            inputEl.value = '';
                        }, 300);
                    }
                }
            }, 500); // 0.5s delay
        });
    }

    window.addEventListener('load', () => {
        // Check if this is for diagnostic workflow
        const urlParams = new URLSearchParams(window.location.search);
        const forDiagnostic = urlParams.get('for_diagnostic');
        const returnUrl = urlParams.get('return');
        const editId = urlParams.get('edit_rack_id');
        const moveQty = urlParams.get('move_qty');
        
        // Show edit mode banner if editing
        if(editId){
            const banner = document.getElementById('editModeBanner');
            const qtySpan = document.getElementById('editModeQty');
            if(moveQty){
                qtySpan.textContent = moveQty;
            } else {
                qtySpan.textContent = 'ALL';
            }
            banner.style.display = 'block';
        }
        
        // Update back button to return to diagnostic page if we came from there
        if(returnUrl){
            const backBtn = document.getElementById('backBtn');
            if(backBtn) backBtn.href = returnUrl;
        }
        
        if(forDiagnostic){
            document.getElementById('for_diagnostic').value = forDiagnostic;
            document.getElementById('upc_field').value = forDiagnostic;
            if(returnUrl){
                document.getElementById('return_url').value = returnUrl;
            }
            // Change form action to diagnostic endpoint
            document.getElementById('scan_form').action = '/position/diagnostic';
        }
        setTimeout(startScanner, 500);
    });
    </script>
    
    <!-- Navigation Buttons at Bottom -->
    <div style="margin-top: 30px; width: 100%; display: flex; justify-content: center; gap: 15px; padding: 20px 0; border-top: 1px solid #eee;">
        <button id="skipBtn" type="button" style="background-color: #ffc107; color: #000; border: none; padding: 10px 24px; border-radius: 6px; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 8px; font-size: 1.1em; width: 100%; max-width: 200px;">
            <i class="fas fa-forward"></i> Skip
        </button>
        <button id="exitBtn" type="button" style="background-color: #ff4444; color: white; border: none; padding: 10px 24px; border-radius: 6px; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 8px; font-size: 1.1em; width: 100%; max-width: 200px;">
            <i class="fas fa-times"></i> Exit
        </button>
    </div>
    <script>
    // Exit button clears sessionStorage and goes to index.html
    document.addEventListener('DOMContentLoaded', function() {
        // Skip button - go to multibarcode if locked, otherwise barcode
        var skipBtn = document.getElementById('skipBtn');
        if (skipBtn) {
            skipBtn.addEventListener('click', function(e) {
                e.preventDefault();
                var isLocked = sessionStorage.getItem('positionLocked') === 'true';
                window.location.href = isLocked ? '/multibarcode' : '/barcode';
            });
        }
        
        var exitBtn = document.getElementById('exitBtn');
        if (exitBtn) {
            exitBtn.addEventListener('click', function(e) {
                e.preventDefault();
                sessionStorage.removeItem('item_position');
                sessionStorage.removeItem('barcode');
                sessionStorage.removeItem('pictureposition_path');
                sessionStorage.removeItem('positionLocked');
                // Notify server to clear lock state
                fetch('/toggle', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ checked: false })
                }).catch(err => console.error('Error clearing lock:', err));
                window.location.href = '/';
            });
        }
    });
    </script>
