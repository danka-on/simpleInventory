<!DOCTYPE html>
<html lang="en">
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Set Position of Item</title>
    <style>
    body {
        font-family: sans-serif;
        max-width: 600px;
        margin: auto;
        padding: 10px;
        display: flex; /* Center content */
        flex-direction: column;
        align-items: center; /* Center horizontally */
        min-height: 100vh; /* Full viewport height */
    }
    #reader {
        width: 100%;
        max-width: 300px; /* Square container */
        margin-top: 20px;
        aspect-ratio: 1/1; /* Force square */
        background: #222;
        border-radius: 8px;
        position: relative;
        overflow: hidden;
    }
    input[type="text"] {
        width: 100%;
        font-size: 1.2em;
        padding: 10px;
        margin-top: 20px;
    }
    button {
        font-size: 18px;
        padding: 10px 20px;
        margin-top: 10px;
    }

    /* Simple scanning line animation */
    .qr-overlay {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        pointer-events: none;
        z-index: 9999;
        display: none;
    }

    .qr-square {
        position: absolute;
        width: 200px;
        height: 200px;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
        border: 2px solid rgba(255, 255, 255, 0.8);
    }

    .qr-scan-line {
        position: absolute;
        width: 100%;
        height: 2px;
        background-color: #ff0000;
        top: 0;
        left: 0;
        animation: scanAnimation 2s linear infinite;
    }

    @keyframes scanAnimation {
        0% { top: 0; }
        50% { top: calc(100% - 2px); }
        50.001% { top: calc(100% - 2px); }
        100% { top: 0; }
    }
    </style>
</head>
<body>
    <h1>Set Position of Item</h1>
    <div style="display: flex; flex-direction: row; align-items: center; width: 100%; justify-content: center; margin-bottom: 10px; gap: 18px;">
        <!-- Wider rack symbol SVG with brown boxes -->
        <svg width="60" height="70" viewBox="0 0 60 70" fill="none" xmlns="http://www.w3.org/2000/svg">
            <!-- Vertical posts -->
            <rect x="6" y="5" width="6" height="60" fill="#444"/>
            <rect x="48" y="5" width="6" height="60" fill="#444"/>
            <!-- Shelves (3 lines) -->
            <rect x="6" y="15" width="48" height="4" fill="#888"/>
            <rect x="6" y="35" width="48" height="4" fill="#888"/>
            <rect x="6" y="55" width="48" height="4" fill="#888"/>
            <!-- Brown boxes on shelves -->
            <rect x="14" y="8" width="12" height="7" fill="#a0522d" stroke="#7b3f00" stroke-width="1"/>
            <rect x="32" y="8" width="12" height="7" fill="#deb887" stroke="#7b3f00" stroke-width="1"/>
            <rect x="14" y="28" width="12" height="7" fill="#deb887" stroke="#7b3f00" stroke-width="1"/>
            <rect x="32" y="28" width="12" height="7" fill="#a0522d" stroke="#7b3f00" stroke-width="1"/>
            <rect x="14" y="48" width="12" height="7" fill="#a0522d" stroke="#7b3f00" stroke-width="1"/>
            <rect x="32" y="48" width="12" height="7" fill="#deb887" stroke="#7b3f00" stroke-width="1"/>
        </svg>
        <!-- Use static QR code image -->
        <img src="/static/qrcode.jpg" alt="QR Code" style="width:60px; height:60px; object-fit:contain; border:2px solid #000; background:#fff;" />
    </div>
    <button id="picturePositionBtn" type="button" style="background-color:#1976d2;color:white;margin-bottom:10px;">Take Picture of Location</button>
    <div id="reader"></div>

    <!-- Simplified overlay with just the scanning line -->
    <div class="qr-overlay" id="qrOverlay">
        <div class="qr-square">
            <div class="qr-scan-line"></div>
        </div>
    </div>

    <form id="scan_form" action="/submitposition" method="POST">
        <input name="scanned_result" type="text" id="scanned_result" placeholder="Scanned code will appear here">
    </form>
    <form action="/toggle" method="POST">
    <label>
    <input type="checkbox" id="featureToggle">  KEEP SAME POSITION?
    </label>
    </form>
    <button onclick="restartScanner()">Restart Scanner</button>
    <a href="/barcode"><button type="button">Skip</button></a>
    <button id="flashBtn" type="button" style="display:none">Turn On Flashlight</button>
    <span id="flashMsg" style="color:red; display:none; font-size:0.9em;"></span>

    <script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
    <script>
  document.getElementById('featureToggle').addEventListener('change', function () {
    fetch('/toggle', {
      method: 'POST',
      headers: {
        'Content-Type': 'application/json'
      },
      body: JSON.stringify({ checked: this.checked })
    })
    .then(response => response.json())
    .then(data => {
      console.log("Server says:", data.message);  // Optional feedback
    })
    .catch(error => console.error('Error:', error));
  });

    let scannerActive = false;
    let html5QrCode = null;
    let track = null;
    let torchOn = false;

    // Web Audio API beep logic
    let audioUnlocked = false;
    let audioCtx = null;
    function unlockAudio() {
        if (!audioUnlocked) {
            audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            let buffer = audioCtx.createBuffer(1, 1, 22050);
            let source = audioCtx.createBufferSource();
            source.buffer = buffer;
            source.connect(audioCtx.destination);
            source.start(0);
            audioUnlocked = true;
        }
    }

    function playBeep() {
        if (!audioCtx) return;
        let duration = 0.1;
        let oscillator = audioCtx.createOscillator();
        let gain = audioCtx.createGain();
        oscillator.type = 'sine';
        oscillator.frequency.value = 880;
        gain.gain.value = 0.2;
        oscillator.connect(gain);
        gain.connect(audioCtx.destination);
        oscillator.start();
        oscillator.stop(audioCtx.currentTime + duration);
        oscillator.onended = () => {
            oscillator.disconnect();
            gain.disconnect();
        };
    }

    window.addEventListener('touchstart', unlockAudio, { once: true });
    window.addEventListener('mousedown', unlockAudio, { once: true });

    // Position overlay based on reader element position
    function positionOverlay() {
        const reader = document.getElementById('reader');
        const overlay = document.getElementById('qrOverlay');
        if (!reader || !overlay) return;

        const rect = reader.getBoundingClientRect();

        overlay.style.left = rect.left + 'px';
        overlay.style.top = rect.top + 'px';
        overlay.style.width = rect.width + 'px';
        overlay.style.height = rect.height + 'px';
        overlay.style.display = scannerActive ? 'block' : 'none';
    }

    function startScanner() {
        if (scannerActive) return;

        // Configure and start scanner
        html5QrCode = new Html5Qrcode("reader");

        html5QrCode.start(
            { facingMode: "environment" },
            {
                fps: 10,
                qrbox: { width: 200, height: 200 },
                aspectRatio: 1.0,
                showTorchButtonIfSupported: false,
                showZoomSliderIfSupported: false,
                hideQrBoxOnSuccess: false,
                disableFlip: true
            },
            (decodedText) => {
                const code = decodedText.trim();
                if (!code.match(/^(gr[1-5]|or[1-3])s[2-6]$/)) return;
                document.getElementById("scanned_result").value = code;
                stopScanner();
                playBeep();
                document.getElementById("scan_form").submit();
            },
            (error) => {}
        ).then(() => {
            scannerActive = true;

            // Show overlay after scanner starts
            setTimeout(() => {
                positionOverlay();
                window.addEventListener('resize', positionOverlay);

                // Hide the library's built-in QR box
                const qrRegion = document.querySelector("#reader div");
                if (qrRegion) {
                    // Add CSS to hide internal scanner box
                    const style = document.createElement('style');
                    style.id = 'qr-box-hider';
                    style.innerHTML = `
                        #reader div div {
                            border: none !important;
                            border-color: transparent !important;
                            box-shadow: none !important;
                        }
                        #reader canvas + div {
                            display: none !important;
                        }
                    `;
                    document.head.appendChild(style);
                }
            }, 500);

            // Get camera track for flashlight
            const stream = html5QrCode._localMediaStream;
            if (stream && stream.getVideoTracks) {
                track = stream.getVideoTracks()[0];
                checkTorchSupport();
            }
        }).catch((err) => {
            console.error("Failed to start scanner:", err);
            scannerActive = false;
        });
    }

    function stopScanner() {
        if (!scannerActive) return;
        if (html5QrCode) {
            html5QrCode.stop().then(() => {
                document.getElementById('qrOverlay').style.display = 'none';
                window.removeEventListener('resize', positionOverlay);

                // Remove the style element we added
                const styleElem = document.getElementById('qr-box-hider');
                if (styleElem) styleElem.remove();

                scannerActive = false;
            }).catch((err) => {
                console.error("Failed to stop scanner:", err);
            });
        }
        scannerActive = false;
    }

    function restartScanner() {
        stopScanner();
        setTimeout(() => {
            startScanner();
        }, 300);
    }

    // Flashlight logic
    function checkTorchSupport() {
        if (!track) return;
        const capabilities = track.getCapabilities ? track.getCapabilities() : {};
        if (capabilities.torch) {
            document.getElementById('flashBtn').style.display = '';
        } else {
            document.getElementById('flashBtn').style.display = 'none';
            document.getElementById('flashMsg').textContent = 'Flashlight not supported on this device/browser.';
            document.getElementById('flashMsg').style.display = '';
        }
    }

    document.getElementById('flashBtn').addEventListener('click', async function() {
        if (!track) return;
        try {
            torchOn = !torchOn;
            await track.applyConstraints({
                advanced: [{ torch: torchOn }]
            });
            this.textContent = torchOn ? 'Turn Off Flashlight' : 'Turn On Flashlight';
        } catch (e) {
            document.getElementById('flashMsg').textContent = 'Failed to toggle flashlight.';
            document.getElementById('flashMsg').style.display = '';
        }
    });

    document.getElementById('picturePositionBtn').addEventListener('click', function() {
        window.location.href = '/pictureposition';
    });

    // Start scanner on page load
    window.addEventListener('load', () => {
        setTimeout(startScanner, 500);
    });
    </script>
</body>
</html>
