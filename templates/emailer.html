<!DOCTYPE html>
<html lang="en">
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="icon" type="image/png" href="{{ url_for('static', filename='favicon.ico') }}">
    <title>Emailer - Sweet Shelves</title>
    <style>
        :root {
            --primary: #0984e3;
            --accent: #00b894;
            --danger: #e74c3c;
            --bg: #f9f9f9;
            --card: #fff;
            --border: #e0e0e0;
            --radius: 14px;
        }
        body {
            font-family: 'Segoe UI', Arial, sans-serif;
            background: var(--bg);
            margin: 0;
            padding: 0;
            min-height: 100vh;
        }
        .container {
            max-width: 800px;
            margin: 0 auto;
            padding: 20px 16px 80px 16px;
        }
        h1 {
            margin: 0 0 18px 0;
            font-weight: 600;
            color: #2c3e50;
            text-align: center;
        }
        .card {
            background: var(--card);
            border-radius: var(--radius);
            padding: 20px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.04);
            border: 1px solid var(--border);
            margin-bottom: 20px;
        }
        .card h2 {
            margin-top: 0;
            font-size: 1.3rem;
            color: #2c3e50;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .form-group {
            margin-bottom: 20px;
        }
        .form-group label {
            display: block;
            margin-bottom: 8px;
            color: #555;
            font-weight: 500;
        }
        .form-group input[type="email"],
        .form-group input[type="text"],
        .form-group textarea {
            width: 100%;
            padding: 12px;
            border: 1px solid var(--border);
            border-radius: 8px;
            font-size: 1rem;
            box-sizing: border-box;
        }
        .email-list {
            display: flex;
            flex-direction: column;
            gap: 12px;
            margin-top: 10px;
        }
        .email-card {
            background: var(--card);
            border: 2px solid var(--border);
            border-radius: var(--radius);
            padding: 16px;
            transition: border-color 0.2s;
            display: flex;
            align-items: center;
            gap: 16px;
        }
        .email-card:hover {
            border-color: var(--primary);
        }
        .email-info {
            flex: 1;
            display: flex;
            align-items: center;
            gap: 12px;
        }
        .email-info i {
            color: var(--primary);
            font-size: 1.2rem;
        }
        .email-address {
            font-weight: 600;
            color: #2c3e50;
        }
        .alert-type {
            background: #f39c12;
            color: white;
            padding: 4px 10px;
            border-radius: 6px;
            font-size: 0.85rem;
            font-weight: 500;
        }
        .frequency-select {
            padding: 10px 12px;
            border: 2px solid var(--border);
            border-radius: 8px;
            font-size: 0.95rem;
            background: white;
            cursor: pointer;
            min-width: 140px;
        }
        .frequency-select:focus {
            outline: none;
            border-color: var(--primary);
        }
        .email-actions {
            display: flex;
            gap: 8px;
        }
        .remove-btn {
            background: var(--danger);
            color: white;
            border: none;
            border-radius: 6px;
            padding: 6px 12px;
            cursor: pointer;
            font-size: 0.9rem;
        }
        .remove-btn:hover {
            opacity: 0.85;
        }
        .test-btn {
            background: #f39c12;
            color: white;
            border: none;
            border-radius: 6px;
            padding: 6px 12px;
            cursor: pointer;
            font-size: 0.9rem;
        }
        .test-btn:hover {
            opacity: 0.85;
        }
        .alert-type-select {
            padding: 12px;
            border: 1px solid var(--border);
            border-radius: 8px;
            font-size: 1rem;
            background: white;
            cursor: pointer;
            flex: 1;
        }
        .alert-type-select:focus {
            outline: none;
            border-color: var(--primary);
        }
        .email-item button:hover {
            opacity: 0.85;
        }
        .add-email-btn {
            background: var(--accent);
            color: white;
            border: none;
            border-radius: 8px;
            padding: 10px 16px;
            cursor: pointer;
            font-size: 1rem;
            margin-top: 10px;
        }
        .add-email-btn:hover {
            opacity: 0.85;
        }
        .toggle-group {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 12px;
            background: #f9f9f9;
            border-radius: 8px;
            margin-bottom: 8px;
        }
        .toggle-group label {
            color: #555;
            font-weight: 500;
            margin: 0;
            font-size: 0.9rem;
        }
        .toggle-switch {
            position: relative;
            width: 44px;
            height: 24px;
        }
        .toggle-switch input {
            opacity: 0;
            width: 0;
            height: 0;
        }
        .toggle-slider {
            position: absolute;
            cursor: pointer;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background-color: #ccc;
            transition: .3s;
            border-radius: 24px;
        }
        .toggle-slider:before {
            position: absolute;
            content: "";
            height: 18px;
            width: 18px;
            left: 3px;
            bottom: 3px;
            background-color: white;
            transition: .3s;
            border-radius: 50%;
        }
        input:checked + .toggle-slider {
            background-color: var(--accent);
        }
        input:checked + .toggle-slider:before {
            transform: translateX(20px);
        }
        .timer-selector {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 8px;
            margin-top: 8px;
        }
        .timer-option {
            padding: 8px;
            background: white;
            border: 2px solid var(--border);
            border-radius: 6px;
            text-align: center;
            cursor: pointer;
            transition: all 0.2s;
            font-size: 0.8rem;
        }
        .timer-option:hover {
            border-color: var(--primary);
        }
        .timer-option.active {
            background: var(--primary);
            color: white;
            border-color: var(--primary);
        }
        .timer-option i {
            font-size: 1rem;
            margin-bottom: 2px;
        }
        .save-btn {
            width: 100%;
            background: var(--primary);
            color: white;
            border: none;
            border-radius: var(--radius);
            padding: 14px;
            font-size: 1.1rem;
            cursor: pointer;
            font-weight: 500;
            margin-top: 20px;
        }
        .save-btn:hover {
            opacity: 0.9;
        }
        .status-message {
            padding: 12px;
            border-radius: 8px;
            margin-top: 15px;
            display: none;
        }
        .status-message.success {
            background: #d4edda;
            color: #155724;
            border: 1px solid #c3e6cb;
        }
        .status-message.error {
            background: #f8d7da;
            color: #721c24;
            border: 1px solid #f5c6cb;
        }
        .add-email-btn {
            background: var(--accent);
            color: white;
            border: none;
            border-radius: 8px;
            padding: 10px 16px;
            cursor: pointer;
            font-size: 1rem;
        }
        .add-email-btn:hover {
            opacity: 0.85;
        }
        @media (max-width: 768px) {
            .container {
                padding: 16px 12px 80px 12px;
            }
            .timer-selector {
                grid-template-columns: repeat(2, 1fr);
            }
        }
    </style>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
</head>
<body>
    <div class="container">
        <div style="display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:20px;">
            <a href="/tools" style="text-decoration:none;">
                <button style="background:#e74c3c;color:#fff;border:none;padding:8px 14px;border-radius:6px;cursor:pointer;display:flex;align-items:center;gap:8px;">
                    <i class="fas fa-arrow-left"></i> Back
                </button>
            </a>
            <h1 style="flex:1;text-align:center;margin:0;">Email Alerts</h1>
            <div style="width:84px"></div>
        </div>

        <!-- Add Email -->
        <div class="card">
            <h2><i class="fas fa-user-plus" style="color: var(--accent);"></i> Add Alert</h2>
            <div class="form-group">
                <label>Email Address</label>
                <input type="email" id="newEmail" placeholder="email@example.com" style="margin-bottom: 10px;">
                <label>Alert Type</label>
                <div style="display: flex; gap: 10px;">
                    <select id="alertType" class="alert-type-select">
                        <option value="health">App Health Stats</option>
                        <option value="inventory">Inventory Alert</option>
                    </select>
                    <button class="add-email-btn" onclick="addEmail()">
                        <i class="fas fa-plus"></i> Add
                    </button>
                </div>
            </div>
        </div>

        <!-- Email List with Individual Settings -->
        <div id="emailList" class="email-list">
            <!-- Email cards will be added here dynamically -->
        </div>

        <button class="save-btn" onclick="saveAllSettings()">
            <i class="fas fa-save"></i> Save All Settings
        </button>

        <div id="statusMessage" class="status-message"></div>
    </div>

    <script>
        let emailSettings = []; // Array of {email, alert_type, interval}

        // Load saved settings on page load
        window.onload = function() {
            loadSettings();
        };

        function loadSettings() {
            fetch('/api/emailer/settings')
                .then(response => response.json())
                .then(data => {
                    if (data.success) {
                        emailSettings = data.email_settings || [];
                        renderEmailList();
                    }
                })
                .catch(err => {
                    console.error('Failed to load settings:', err);
                });
        }

        function addEmail() {
            const emailInput = document.getElementById('newEmail');
            const alertTypeSelect = document.getElementById('alertType');
            const email = emailInput.value.trim();
            const alertType = alertTypeSelect.value;
            
            if (!email) {
                showStatus('Please enter an email address', 'error');
                return;
            }
            
            // Basic email validation
            const emailRegex = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
            if (!emailRegex.test(email)) {
                showStatus('Please enter a valid email address', 'error');
                return;
            }
            
            // Check if this email+alertType combo already exists
            if (emailSettings.find(e => e.email === email && e.alert_type === alertType)) {
                showStatus('This email with this alert type already exists', 'error');
                return;
            }
            
            emailSettings.push({
                email: email,
                alert_type: alertType,
                interval: '1d'
            });
            
            emailInput.value = '';
            renderEmailList();
            showStatus('Alert added successfully', 'success');
        }

        function removeEmail(index) {
            emailSettings.splice(index, 1);
            renderEmailList();
            showStatus('Alert removed', 'success');
        }

        function updateInterval(index, interval) {
            emailSettings[index].interval = interval;
        }

        function sendTestToEmail(email, alertType) {
            let endpoint = '/api/emailer/send-test';
            if (alertType === 'health') endpoint = '/api/emailer/send-health';
            if (alertType === 'inventory') endpoint = '/api/emailer/send-inventory';
            if (alertType === 'test') endpoint = '/api/emailer/send-test-inventory';  // Send inventory test for "test" type
            
            fetch(endpoint, {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify({ emails: [email] })
            })
            .then(response => response.json())
            .then(data => {
                if (data.success) {
                    const msgType = alertType === 'health' ? 'Health report' : (alertType === 'inventory' ? 'Inventory alert' : 'Test inventory alert');
                    showStatus(`${msgType} sent to ${email}!`, 'success');
                } else {
                    showStatus('Failed to send email: ' + (data.error || 'Unknown error'), 'error');
                }
            })
            .catch(err => {
                showStatus('Failed to send email: ' + err.message, 'error');
            });
        }

        function renderEmailList() {
            const listContainer = document.getElementById('emailList');
            
            if (emailSettings.length === 0) {
                listContainer.innerHTML = '<div class="card"><p style="color: #999; text-align: center; padding: 20px;">No alerts configured yet</p></div>';
                return;
            }
            
            listContainer.innerHTML = emailSettings.map((setting, index) => {
                let alertBadgeColor = '#f39c12';
                let alertBadgeText = 'Test Email';
                if (setting.alert_type === 'health') {
                    alertBadgeColor = '#3498db';
                    alertBadgeText = 'Health Stats';
                } else if (setting.alert_type === 'inventory') {
                    alertBadgeColor = '#e74c3c';
                    alertBadgeText = 'Inventory Alert';
                }
                
                return `
                <div class="email-card">
                    <div class="email-info">
                        <i class="fas fa-envelope"></i>
                        <span class="email-address">${setting.email}</span>
                        <span class="alert-type" style="background: ${alertBadgeColor};">${alertBadgeText}</span>
                    </div>
                    <select class="frequency-select" onchange="updateInterval(${index}, this.value)">
                        ${setting.alert_type === 'inventory' ? '<option value="30m" ' + (setting.interval === '30m' ? 'selected' : '') + '>Every 30 minutes</option>' : ''}
                        <option value="10m" ${setting.interval === '10m' ? 'selected' : ''}>Every 10 minutes</option>
                        <option value="1h" ${setting.interval === '1h' ? 'selected' : ''}>Every 1 hour</option>
                        <option value="12h" ${setting.interval === '12h' ? 'selected' : ''}>Every 12 hours</option>
                        <option value="1d" ${setting.interval === '1d' ? 'selected' : ''}>Every 1 day</option>
                        <option value="1w" ${setting.interval === '1w' ? 'selected' : ''}>Every 1 week</option>
                        <option value="1mo" ${setting.interval === '1mo' ? 'selected' : ''}>Every 1 month</option>
                    </select>
                    <div class="email-actions">
                        <button class="test-btn" onclick="sendTestToEmail('${setting.email}', '${setting.alert_type}')">
                            <i class="fas fa-paper-plane"></i> Send
                        </button>
                        <button class="remove-btn" onclick="removeEmail(${index})">
                            <i class="fas fa-trash"></i>
                        </button>
                    </div>
                </div>
                `;
            }).join('');
        }

        function saveAllSettings() {
            fetch('/api/emailer/settings', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify({ email_settings: emailSettings })
            })
            .then(response => response.json())
            .then(data => {
                if (data.success) {
                    showStatus('Settings saved successfully!', 'success');
                } else {
                    showStatus('Failed to save settings: ' + (data.error || 'Unknown error'), 'error');
                }
            })
            .catch(err => {
                showStatus('Failed to save settings: ' + err.message, 'error');
            });
        }

        function showStatus(message, type) {
            const statusEl = document.getElementById('statusMessage');
            statusEl.textContent = message;
            statusEl.className = 'status-message ' + type;
            statusEl.style.display = 'block';
            
            setTimeout(() => {
                statusEl.style.display = 'none';
            }, 5000);
        }

        // Allow pressing Enter to add email
        document.addEventListener('DOMContentLoaded', function() {
            document.getElementById('newEmail').addEventListener('keypress', function(e) {
                if (e.key === 'Enter') {
                    addEmail();
                }
            });
        });
    </script>
</body>
</html>
