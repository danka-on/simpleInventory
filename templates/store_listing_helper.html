<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title data-i18n="store_listing_helper">Store Doctor</title>
  <style>
    * { box-sizing: border-box; }
    body {
      font-family: 'Inter', 'Segoe UI', -apple-system, BlinkMacSystemFont, sans-serif;
      background: #0f172a;
      min-height: 100vh;
      margin: 0;
      padding: 24px;
      color: #e2e8f0;
    }
    .container {
      max-width: 1200px;
      margin: 0 auto;
    }

    /* Header */
    .header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 28px;
      flex-wrap: wrap;
      gap: 16px;
    }
    .header h1 {
      color: #f8fafc;
      margin: 0;
      font-size: 1.75rem;
      font-weight: 700;
      display: flex;
      align-items: center;
      gap: 12px;
      letter-spacing: -0.02em;
    }
    .header h1 .icon {
      font-size: 1.5rem;
      background: linear-gradient(135deg, #10b981, #06b6d4);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }
    .btn {
      padding: 11px 20px;
      border-radius: 10px;
      border: none;
      cursor: pointer;
      font-weight: 600;
      font-size: 0.9rem;
      transition: all 0.15s ease;
      display: inline-flex;
      align-items: center;
      gap: 8px;
    }
    .btn:hover { transform: translateY(-1px); }
    .btn:active { transform: translateY(0); }
    .btn-back {
      background: rgba(255,255,255,0.08);
      color: #94a3b8;
      border: 1px solid rgba(255,255,255,0.1);
    }
    .btn-back:hover { background: rgba(255,255,255,0.12); color: #e2e8f0; }
    .btn-scan {
      background: linear-gradient(135deg, #10b981, #059669);
      color: #fff;
      box-shadow: 0 4px 14px rgba(16,185,129,0.35);
      margin-right: 80px;
    }
    .btn-scan:hover { box-shadow: 0 6px 20px rgba(16,185,129,0.45); }

    /* Summary Cards */
    .summary-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 16px;
      margin-bottom: 24px;
    }
    .summary-card {
      background: #1e293b;
      border-radius: 14px;
      padding: 20px;
      text-align: center;
      border: 1px solid rgba(255,255,255,0.06);
      transition: all 0.2s ease;
    }
    .summary-card:hover {
      border-color: rgba(255,255,255,0.12);
      background: #263445;
    }
    .summary-card .icon {
      font-size: 1.5rem;
      margin-bottom: 10px;
      display: block;
      opacity: 0.7;
    }
    .summary-card .count {
      font-size: 2.25rem;
      font-weight: 800;
      line-height: 1;
      margin-bottom: 6px;
      letter-spacing: -0.02em;
    }
    .summary-card .label {
      font-size: 0.75rem;
      color: #64748b;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }
    .summary-card.danger .count { color: #f87171; }
    .summary-card.danger .icon { color: #f87171; }
    .summary-card.warning .count { color: #fbbf24; }
    .summary-card.warning .icon { color: #fbbf24; }

    /* Main Content Card */
    .main-card {
      background: #1e293b;
      border-radius: 16px;
      border: 1px solid rgba(255,255,255,0.06);
      overflow: hidden;
    }

    /* Tabs */
    .tabs {
      display: flex;
      background: rgba(0,0,0,0.2);
      padding: 10px;
      gap: 6px;
      overflow-x: auto;
      border-bottom: 1px solid rgba(255,255,255,0.06);
    }
    .tabs::-webkit-scrollbar { height: 4px; }
    .tabs::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.2); border-radius: 2px; }
    .tab {
      padding: 10px 18px;
      border: none;
      background: transparent;
      border-radius: 8px;
      cursor: pointer;
      font-size: 0.85rem;
      font-weight: 600;
      color: #64748b;
      transition: all 0.15s ease;
      white-space: nowrap;
      position: relative;
    }
    .tab:hover { background: rgba(255,255,255,0.05); color: #94a3b8; }
    .tab.active {
      background: #334155;
      color: #f8fafc;
    }
    .tab .badge {
      position: absolute;
      top: 2px;
      right: 2px;
      min-width: 18px;
      height: 18px;
      border-radius: 9px;
      font-size: 0.65rem;
      font-weight: 700;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #fff;
    }
    .badge-red { background: #ef4444; }
    .badge-yellow { background: #f59e0b; }
    .badge-gray { background: #475569; }

    /* Tab Content */
    .tab-content {
      display: none;
      padding: 24px;
      min-height: 320px;
    }
    .tab-content.active { display: block; }

    /* Alert Cards */
    .alert-card {
      background: #0f172a;
      border-radius: 12px;
      padding: 20px;
      margin-bottom: 14px;
      border: 1px solid rgba(255,255,255,0.06);
      transition: all 0.15s ease;
    }
    .alert-card:hover {
      border-color: rgba(255,255,255,0.12);
    }
    .alert-card.red { border-left: 3px solid #ef4444; }
    .alert-card.yellow { border-left: 3px solid #f59e0b; }

    .alert-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 14px;
      flex-wrap: wrap;
      gap: 10px;
    }
    .alert-upc {
      font-weight: 700;
      font-size: 1.1rem;
      font-family: 'JetBrains Mono', 'SF Mono', Monaco, monospace;
      color: #f8fafc;
      background: #334155;
      padding: 8px 14px;
      border-radius: 8px;
      letter-spacing: 0.02em;
    }
    .alert-severity {
      padding: 6px 12px;
      border-radius: 6px;
      font-size: 0.72rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }
    .alert-severity.red { background: rgba(239,68,68,0.15); color: #fca5a5; }
    .alert-severity.yellow { background: rgba(245,158,11,0.15); color: #fcd34d; }

    .alert-details {
      color: #94a3b8;
      font-size: 0.9rem;
      margin-bottom: 16px;
      padding: 14px 16px;
      background: rgba(255,255,255,0.03);
      border-radius: 8px;
      line-height: 1.7;
      display: flex;
      flex-wrap: wrap;
      gap: 8px 20px;
      align-items: center;
    }
    .alert-details strong { color: #e2e8f0; }
    .detail-divider {
      width: 1px;
      height: 16px;
      background: #334155;
    }

    /* Listing Items */
    .listing-list {
      display: flex;
      flex-direction: column;
      gap: 8px;
      margin-top: 12px;
    }
    .listing-item {
      display: flex;
      align-items: center;
      gap: 12px;
      background: rgba(255,255,255,0.02);
      padding: 12px 14px;
      border-radius: 10px;
      font-size: 0.88rem;
      border: 1px solid rgba(255,255,255,0.04);
      transition: all 0.15s ease;
    }
    .listing-item:hover {
      background: rgba(255,255,255,0.04);
      border-color: rgba(255,255,255,0.08);
    }
    .listing-item img {
      width: 44px;
      height: 44px;
      object-fit: cover;
      border-radius: 8px;
      cursor: pointer;
      flex-shrink: 0;
      transition: transform 0.15s ease;
    }
    .listing-item img:hover { transform: scale(1.08); }

    .listing-num {
      font-size: 0.7rem;
      color: #64748b;
      background: #334155;
      border-radius: 5px;
      padding: 3px 7px;
      font-weight: 600;
      flex-shrink: 0;
    }
    .store-badge {
      padding: 4px 9px;
      border-radius: 5px;
      font-size: 0.68rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.3px;
      flex-shrink: 0;
    }
    .store-badge.ebay { background: #0064d2; color: #fff; }
    .store-badge.amazon { background: #ff9900; color: #111; }
    .listing-qty {
      font-weight: 700;
      color: #34d399;
      background: rgba(52,211,153,0.1);
      padding: 4px 9px;
      border-radius: 5px;
      font-size: 0.85rem;
      flex-shrink: 0;
    }
    .listing-title {
      flex: 1;
      color: #cbd5e1;
      line-height: 1.4;
      font-size: 0.88rem;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    /* Action Buttons */
    .alert-actions {
      margin-top: 16px;
      display: flex;
      gap: 10px;
      justify-content: flex-end;
      flex-wrap: wrap;
    }
    .btn-finder {
      background: linear-gradient(135deg, #8b5cf6, #7c3aed);
      color: #fff;
      text-decoration: none;
      padding: 10px 16px;
      border-radius: 8px;
      font-size: 0.85rem;
      font-weight: 600;
      display: inline-flex;
      align-items: center;
      gap: 7px;
      transition: all 0.15s ease;
    }
    .btn-finder:hover { transform: translateY(-1px); box-shadow: 0 4px 14px rgba(139,92,246,0.35); }
    .btn-dismiss {
      background: #334155;
      color: #94a3b8;
      font-size: 0.85rem;
      padding: 10px 16px;
      border-radius: 8px;
      border: none;
      cursor: pointer;
      font-weight: 600;
      transition: all 0.15s ease;
    }
    .btn-dismiss:hover { background: #475569; color: #e2e8f0; }

    /* Warehouse */
    .warehouse-label { font-weight: 600; color: #94a3b8; }
    .warehouse-qty { font-weight: 700; color: #34d399; }
    .warehouse-qty.zero { color: #f87171; }

    /* Store Section Labels */
    .store-section {
      margin: 16px 0 10px;
      font-weight: 700;
      font-size: 0.85rem;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .store-section.ebay { color: #60a5fa; }
    .store-section.amazon { color: #fbbf24; }

    /* Empty State */
    .empty-state {
      text-align: center;
      padding: 60px 20px;
      color: #64748b;
    }
    .empty-state .icon {
      font-size: 3.5rem;
      margin-bottom: 16px;
      display: block;
      color: #10b981;
    }
    .empty-state p {
      font-size: 1rem;
      margin: 0;
      color: #94a3b8;
    }

    /* Loading */
    #loading {
      text-align: center;
      padding: 60px;
      color: #64748b;
    }
    .spinner {
      width: 44px;
      height: 44px;
      border: 3px solid #334155;
      border-top: 3px solid #10b981;
      border-radius: 50%;
      animation: spin 0.7s linear infinite;
      margin: 0 auto 16px;
    }
    @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }

    /* Image Modal */
    .img-modal {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.85);
      backdrop-filter: blur(8px);
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 9999;
      padding: 20px;
    }
    .img-modal .modal-content {
      background: #1e293b;
      border-radius: 16px;
      padding: 20px;
      max-width: 90vw;
      max-height: 90vh;
      overflow: auto;
      border: 1px solid rgba(255,255,255,0.1);
    }
    .img-modal .modal-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 16px;
      padding-bottom: 14px;
      border-bottom: 1px solid rgba(255,255,255,0.08);
    }
    .img-modal .title {
      font-weight: 700;
      font-size: 1rem;
      color: #f8fafc;
    }
    .img-modal img {
      max-width: 100%;
      height: auto;
      border-radius: 10px;
      display: block;
    }
    .btn-close {
      background: #334155;
      color: #94a3b8;
      border: none;
      padding: 8px 14px;
      border-radius: 7px;
      cursor: pointer;
      font-weight: 600;
      font-size: 0.85rem;
      transition: all 0.15s ease;
    }
    .btn-close:hover { background: #475569; color: #e2e8f0; }

    /* Responsive */
    @media (max-width: 1024px) {
      .summary-grid { grid-template-columns: repeat(2, 1fr); }
    }
    @media (max-width: 640px) {
      body { padding: 14px; }
      .header { gap: 12px; }
      .header h1 { font-size: 1.35rem; }
      .btn-scan { margin-right: 0; }
      .summary-grid { gap: 12px; }
      .summary-card { padding: 16px; }
      .summary-card .icon { font-size: 1.25rem; }
      .summary-card .count { font-size: 1.75rem; }
      .summary-card .label { font-size: 0.68rem; }
      .tabs { padding: 8px; }
      .tab { padding: 9px 14px; font-size: 0.8rem; }
      .tab-content { padding: 16px; }
      .alert-card { padding: 16px; }
      .alert-upc { font-size: 0.95rem; padding: 6px 10px; }
      .alert-details { font-size: 0.85rem; padding: 12px; flex-direction: column; align-items: flex-start; gap: 8px; }
      .detail-divider { display: none; }
      .listing-item { padding: 10px; flex-wrap: wrap; }
      .listing-item img { width: 38px; height: 38px; }
      .listing-title { flex-basis: 100%; margin-top: 6px; white-space: normal; }
    }
    @media (max-width: 400px) {
      .summary-card .count { font-size: 1.5rem; }
      .tab { padding: 8px 10px; font-size: 0.75rem; }
      .tab .badge { min-width: 16px; height: 16px; font-size: 0.6rem; }
    }

    /* Day mode overrides */
    html.ss-theme-day body { background: var(--bg, #f9f9f9); color: var(--ink, #111827); }
    html.ss-theme-day .header h1 { color: #111827; }
    html.ss-theme-day .btn-back { background: rgba(0,0,0,0.05); color: #475569; border-color: #e2e8f0; }
    html.ss-theme-day .btn-back:hover { background: rgba(0,0,0,0.08); color: #111827; }
    html.ss-theme-day .summary-card { background: #fff; border-color: #e2e8f0; }
    html.ss-theme-day .summary-card:hover { background: #f8fafc; border-color: #cbd5e1; }
    html.ss-theme-day .summary-card .label { color: #64748b; }
    html.ss-theme-day .main-card { background: #fff; border-color: #e2e8f0; }
    html.ss-theme-day .tabs { background: #f1f5f9; border-bottom-color: #e2e8f0; }
    html.ss-theme-day .tab { color: #64748b; }
    html.ss-theme-day .tab:hover { background: rgba(0,0,0,0.04); color: #475569; }
    html.ss-theme-day .tab.active { background: #fff; color: #111827; }
    html.ss-theme-day .alert-card { background: #f8fafc; border-color: #e2e8f0; }
    html.ss-theme-day .alert-card:hover { border-color: #cbd5e1; }
    html.ss-theme-day .alert-upc { color: #111827; background: #e2e8f0; }
    html.ss-theme-day .alert-details { color: #475569; background: rgba(0,0,0,0.02); }
    html.ss-theme-day .alert-details strong { color: #111827; }
    html.ss-theme-day .detail-divider { background: #e2e8f0; }
    html.ss-theme-day .listing-item { background: rgba(0,0,0,0.02); border-color: #e2e8f0; }
    html.ss-theme-day .listing-item:hover { background: rgba(0,0,0,0.04); border-color: #cbd5e1; }
    html.ss-theme-day .listing-num { color: #64748b; background: #e2e8f0; }
    html.ss-theme-day .listing-title { color: #334155; }
    html.ss-theme-day .btn-dismiss { background: #e2e8f0; color: #475569; }
    html.ss-theme-day .btn-dismiss:hover { background: #cbd5e1; color: #111827; }
    html.ss-theme-day .warehouse-label { color: #475569; }
    html.ss-theme-day .empty-state p { color: #64748b; }
    html.ss-theme-day #loading { color: #64748b; }
    html.ss-theme-day .spinner { border-color: #e2e8f0; border-top-color: #10b981; }
  </style>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>

<div class="container">
  <div class="header">
    <a href="/items-to-list" class="btn btn-back"><i class="fas fa-arrow-left"></i> <span data-i18n="back">Back</span></a>
    <h1><span class="icon">🩺</span> <span data-i18n="store_listing_helper">Store Doctor</span></h1>
    <button class="btn btn-scan" onclick="scanAlerts()"><i class="fas fa-stethoscope"></i> <span data-i18n="scan">Diagnose</span></button>
  </div>

  <div class="summary-grid">
    <div class="summary-card danger">
      <span class="icon"><i class="fas fa-warehouse"></i></span>
      <div class="count" id="count-no-warehouse">-</div>
      <div class="label" data-i18n="no_warehouse">No Warehouse</div>
    </div>
    <div class="summary-card warning">
      <span class="icon"><i class="fas fa-clone"></i></span>
      <div class="count" id="count-cross-store">-</div>
      <div class="label" data-i18n="cross_store">Cross-Store</div>
    </div>
    <div class="summary-card danger">
      <span class="icon"><i class="fas fa-copy"></i></span>
      <div class="count" id="count-same-store">-</div>
      <div class="label" data-i18n="same_store_dup">Same-Store Dup</div>
    </div>
    <div class="summary-card danger">
      <span class="icon"><i class="fas fa-balance-scale-right"></i></span>
      <div class="count" id="count-qty-mismatch">-</div>
      <div class="label" data-i18n="qty_mismatch">Qty Mismatch</div>
    </div>
  </div>

  <div class="main-card">
    <div class="tabs">
      <button class="tab active" data-tab="no_warehouse">
        <i class="fas fa-warehouse" style="margin-right:6px"></i><span data-i18n="no_warehouse">No Warehouse</span>
        <span class="badge badge-red" id="badge-no-warehouse" style="display:none">0</span>
      </button>
      <button class="tab" data-tab="cross_store">
        <i class="fas fa-clone" style="margin-right:6px"></i><span data-i18n="cross_store">Cross-Store</span>
        <span class="badge badge-yellow" id="badge-cross-store" style="display:none">0</span>
      </button>
      <button class="tab" data-tab="same_store_dup">
        <i class="fas fa-copy" style="margin-right:6px"></i><span data-i18n="same_store_dup">Same-Store Dup</span>
        <span class="badge badge-red" id="badge-same-store" style="display:none">0</span>
      </button>
      <button class="tab" data-tab="qty_mismatch">
        <i class="fas fa-balance-scale-right" style="margin-right:6px"></i><span data-i18n="qty_mismatch">Qty Mismatch</span>
        <span class="badge badge-red" id="badge-qty-mismatch" style="display:none">0</span>
      </button>
      <button class="tab" data-tab="dismissed">
        <i class="fas fa-check-circle" style="margin-right:6px"></i><span data-i18n="marked_fixed">Marked Fixed</span>
        <span class="badge badge-gray" id="badge-dismissed" style="display:none">0</span>
      </button>
    </div>

    <div id="loading" style="display:none">
      <div class="spinner"></div>
      <span data-i18n="scanning_listings">Running diagnostics...</span>
    </div>

    <div class="tab-content active" id="content-no_warehouse"></div>
    <div class="tab-content" id="content-cross_store"></div>
    <div class="tab-content" id="content-same_store_dup"></div>
    <div class="tab-content" id="content-qty_mismatch"></div>
    <div class="tab-content" id="content-dismissed"></div>
  </div>
</div>

<div id="imgModal" class="img-modal">
  <div class="modal-content">
    <div class="modal-header">
      <div id="imgModalTitle" class="title"></div>
      <button class="btn-close" onclick="closeImgModal()" data-i18n="close">Close</button>
    </div>
    <img id="imgModalImg" src="" alt="">
  </div>
</div>

<script>
function t(key){ return (window.i18n && window.i18n.t) ? window.i18n.t(key) : key; }
function storeLabel(store) {
  const s = String(store || '').toLowerCase();
  if (s === 'ebay') return t('ebay');
  if (s === 'amazon') return t('amazon');
  return store || '';
}
function missingImgSvg(){
  const label = t('no_image');
  return 'data:image/svg+xml;utf8,' + encodeURIComponent('<svg xmlns="http://www.w3.org/2000/svg" width="48" height="48"><rect width="100%" height="100%" fill="#f0f0f0" rx="8"/><text x="50%" y="50%" dominant-baseline="middle" text-anchor="middle" fill="#b0b0b0" font-size="8">'+label+'</text></svg>');
}

function esc(s) {
  const d = document.createElement('div');
  d.textContent = s || '';
  return d.innerHTML;
}

// Tab switching
document.querySelectorAll('.tab').forEach(tab => {
  tab.addEventListener('click', () => {
    document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
    document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));
    tab.classList.add('active');
    document.getElementById('content-' + tab.dataset.tab).classList.add('active');
  });
});

let alertsData = null;

async function scanAlerts() {
  document.getElementById('loading').style.display = 'block';
  document.querySelectorAll('.tab-content').forEach(c => c.innerHTML = '');

  try {
    const resp = await fetch('/api/listing-helper/scan');
    const data = await resp.json();

    if (!data.success) {
      alert(t('scan_failed') + ': ' + (data.error || t('unknown')));
      return;
    }

    alertsData = data.alerts;
    const counts = data.counts;

    // Update counts
    document.getElementById('count-no-warehouse').textContent = counts.no_warehouse;
    document.getElementById('count-cross-store').textContent = counts.cross_store;
    document.getElementById('count-same-store').textContent = counts.same_store_dup;
    document.getElementById('count-qty-mismatch').textContent = counts.qty_mismatch;

    // Update badges
    updateBadge('badge-no-warehouse', counts.no_warehouse);
    updateBadge('badge-cross-store', counts.cross_store);
    updateBadge('badge-same-store', counts.same_store_dup);
    updateBadge('badge-qty-mismatch', counts.qty_mismatch);

    // Render alerts
    renderNoWarehouse(alertsData.no_warehouse);
    renderCrossStore(alertsData.cross_store);
    renderSameStoreDup(alertsData.same_store_dup);
    renderQtyMismatch(alertsData.qty_mismatch);

  } catch (e) {
    alert(t('error_scanning') + ': ' + e.message);
  } finally {
    document.getElementById('loading').style.display = 'none';
  }
}

function updateBadge(id, count) {
  const badge = document.getElementById(id);
  if (count > 0) {
    badge.textContent = count;
    badge.style.display = 'flex';
  } else {
    badge.style.display = 'none';
  }
}

function renderListings(listings) {
  return listings.map((l, idx) => `
    <div class="listing-item">
      <img src="${esc(l.image || '') || missingImgSvg()}" data-img="${encodeURIComponent(l.image || '')}" data-title="${encodeURIComponent(l.title || '')}" onclick="openListingImg(this)" onerror="this.src='${missingImgSvg()}'">
      <span class="listing-num">#${idx + 1}</span>
      <span class="store-badge ${l.store}">${esc(storeLabel(l.store))}</span>
      <span class="listing-qty">×${l.qty}</span>
      <span class="listing-title" title="${esc(l.title || t('untitled'))}">${esc(l.title || t('untitled'))}</span>
    </div>
  `).join('');
}

function renderNoWarehouse(alerts) {
  const el = document.getElementById('content-no_warehouse');
  if (!alerts.length) {
    el.innerHTML = `<div class="empty-state"><span class="icon"><i class="fas fa-check-circle"></i></span><p>${esc(t('all_listings_have_stock'))}</p></div>`;
    return;
  }
  el.innerHTML = alerts.map(a => {
    const first = (a.listings && a.listings.length) ? a.listings[0] : {};
    const finderParams = new URLSearchParams({
      title: first.title || '',
      barcode: a.upc || '',
      image: first.image || '',
      return: '/store-listing-helper'
    }).toString();
    const finderHref = `/finder?${finderParams}`;
    return `
    <div class="alert-card ${a.severity}">
      <div class="alert-header">
        <span class="alert-upc">${esc(a.upc)}</span>
        <span class="alert-severity ${a.severity}">${a.severity === 'red' ? '<i class="fas fa-exclamation-triangle"></i> ' + esc(t('multi_store')) : '<i class="fas fa-info-circle"></i> ' + esc(t('single_store'))}</span>
      </div>
      <div class="alert-details">
        <span><i class="fas fa-store" style="margin-right:6px;color:#60a5fa"></i>${esc(t('listed_on'))}: <strong>${a.stores.map(s => esc(storeLabel(s))).join(', ')}</strong></span>
        <span class="detail-divider"></span>
        <span><i class="fas fa-warehouse" style="margin-right:6px;color:#f87171"></i>${esc(t('no_matching_upc'))}</span>
      </div>
      <div class="listing-list">${renderListings(a.listings)}</div>
      <div class="alert-actions">
        <a class="btn-finder" href="${esc(finderHref)}" target="_blank" rel="noopener"><i class="fas fa-search"></i> ${esc(t('finder'))}</a>
        <button class="btn-dismiss" onclick="dismissAlert('no_warehouse', '${a.hash}', '${esc(a.upc)}')">
          <i class="fas fa-check"></i> ${esc(t('mark_fixed'))}
        </button>
      </div>
    </div>
  `}).join('');
}

function renderCrossStore(alerts) {
  const el = document.getElementById('content-cross_store');
  if (!alerts.length) {
    el.innerHTML = `<div class="empty-state"><span class="icon"><i class="fas fa-check-circle"></i></span><p>${esc(t('no_cross_store_dups'))}</p></div>`;
    return;
  }
  el.innerHTML = alerts.map(a => {
    const warehouseQty = a.warehouse_qty || 0;
    const warehouseQtyClass = warehouseQty === 0 ? 'warehouse-qty zero' : 'warehouse-qty';
    return `
    <div class="alert-card yellow">
      <div class="alert-header">
        <span class="alert-upc">${esc(a.upc)}</span>
        <span class="alert-severity yellow"><i class="fas fa-clone"></i> ${esc(t('cross_store'))}</span>
      </div>
      <div class="alert-details">
        <span><i class="fas fa-info-circle" style="margin-right:6px;color:#fbbf24"></i>${esc(t('same_upc_both_stores'))}</span>
        <span class="detail-divider"></span>
        <span><span class="warehouse-label"><i class="fas fa-warehouse" style="margin-right:5px"></i>${esc(t('warehouse'))}:</span> <span class="${warehouseQtyClass}">${warehouseQty}</span></span>
      </div>
      <div class="store-section ebay"><i class="fab fa-ebay" style="margin-right:6px"></i>${esc(t('ebay'))}</div>
      <div class="listing-list">${renderListings(a.ebay_listings)}</div>
      <div class="store-section amazon"><i class="fab fa-amazon" style="margin-right:6px"></i>${esc(t('amazon'))}</div>
      <div class="listing-list">${renderListings(a.amazon_listings)}</div>
      <div class="alert-actions">
        <button class="btn-dismiss" onclick="dismissAlert('cross_store', '${a.hash}', '${esc(a.upc)}')">
          <i class="fas fa-check"></i> ${esc(t('acknowledge'))}
        </button>
      </div>
    </div>
  `}).join('');
}

function renderSameStoreDup(alerts) {
  const el = document.getElementById('content-same_store_dup');
  if (!alerts.length) {
    el.innerHTML = `<div class="empty-state"><span class="icon"><i class="fas fa-check-circle"></i></span><p>${esc(t('no_same_store_dups'))}</p></div>`;
    return;
  }
  el.innerHTML = alerts.map(a => `
    <div class="alert-card red">
      <div class="alert-header">
        <span class="alert-upc">${esc(a.upc)}</span>
        <span class="alert-severity red"><i class="fas fa-copy"></i> ${a.count} ${esc(t('listings_on'))} ${esc(storeLabel(a.store))}</span>
      </div>
      <div class="alert-details">
        <span><i class="fas fa-exclamation-triangle" style="margin-right:6px;color:#f87171"></i>${esc(t('same_upc_listed'))} <strong>${a.count}</strong> ${esc(t('times_on'))} <strong>${esc(storeLabel(a.store))}</strong></span>
      </div>
      <div class="listing-list">${renderListings(a.listings)}</div>
      <div class="alert-actions">
        <button class="btn-dismiss" onclick="dismissAlert('same_store_dup', '${a.hash}', '${esc(a.upc)}', '${a.store}')">
          <i class="fas fa-check"></i> ${esc(t('mark_fixed'))}
        </button>
      </div>
    </div>
  `).join('');
}

function renderQtyMismatch(alerts) {
  const el = document.getElementById('content-qty_mismatch');
  if (!alerts.length) {
    el.innerHTML = `<div class="empty-state"><span class="icon"><i class="fas fa-check-circle"></i></span><p>${esc(t('all_quantities_match'))}</p></div>`;
    return;
  }
  el.innerHTML = alerts.map(a => {
    const warehouseQty = a.warehouse_qty || 0;
    const warehouseQtyClass = warehouseQty === 0 ? 'warehouse-qty zero' : 'warehouse-qty';
    return `
    <div class="alert-card red">
      <div class="alert-header">
        <span class="alert-upc">${esc(a.upc)}</span>
        <span class="alert-severity red"><i class="fas fa-exclamation-circle"></i> ${esc(t('oversold_by'))} ${a.overage}</span>
      </div>
      <div class="alert-details">
        <span><i class="fas fa-list-ol" style="margin-right:6px;color:#60a5fa"></i>${esc(t('listing_total'))}: <strong>${a.listing_qty}</strong></span>
        <span class="detail-divider"></span>
        <span><span class="warehouse-label"><i class="fas fa-warehouse" style="margin-right:5px"></i>${esc(t('warehouse'))}:</span> <span class="${warehouseQtyClass}">${warehouseQty}</span></span>
        <span class="detail-divider"></span>
        <span><i class="fas fa-arrow-up" style="margin-right:5px;color:#f87171"></i>${esc(t('overage'))}: <strong style="color:#f87171">+${a.overage}</strong></span>
      </div>
      <div class="listing-list">${renderListings(a.listings)}</div>
      <div class="alert-actions">
        <button class="btn-dismiss" onclick="dismissAlert('qty_mismatch', '${a.hash}', '${esc(a.upc)}')">
          <i class="fas fa-check"></i> ${esc(t('mark_fixed'))}
        </button>
      </div>
    </div>
  `}).join('');
}

function formatDismissedAt(raw) {
  if (!raw) return '';
  try {
    let s = String(raw).trim();
    if (/\d{4}-\d{2}-\d{2} \d{2}:\d{2}/.test(s) && !s.includes('T')) {
      s = s.replace(' ', 'T') + 'Z';
    }
    const d = new Date(s);
    if (!isNaN(d.getTime())) return d.toLocaleString();
  } catch (e) {}
  return raw;
}

function renderDismissed(items) {
  const el = document.getElementById('content-dismissed');
  if (!el) return;
  if (!items.length) {
    el.innerHTML = `<div class="empty-state"><span class="icon"><i class="fas fa-clipboard-check"></i></span><p>${esc(t('no_marked_fixed'))}</p></div>`;
    return;
  }
  el.innerHTML = items.map(d => {
    let listingIds = [];
    try { listingIds = JSON.parse(d.listing_ids || '[]'); } catch (e) {}
    const typeLabel = t(d.alert_type) || d.alert_type || '';
    const storeLabelText = d.store ? storeLabel(d.store) : '';
    const dismissedAt = formatDismissedAt(d.dismissed_at);
    return `
      <div class="alert-card">
        <div class="alert-header">
          <span class="alert-upc">${esc(d.upc || '')}</span>
          <span class="alert-severity yellow"><i class="fas fa-check"></i> ${esc(typeLabel)}</span>
        </div>
        <div class="alert-details">
          <span><i class="fas fa-tag" style="margin-right:6px;color:#60a5fa"></i><strong>${esc(t('alert_type'))}:</strong> ${esc(typeLabel)}</span>
          ${storeLabelText ? `<span class="detail-divider"></span><span><i class="fas fa-store" style="margin-right:5px"></i><strong>${esc(t('store'))}:</strong> ${esc(storeLabelText)}</span>` : ''}
          ${listingIds.length ? `<span class="detail-divider"></span><span><i class="fas fa-list" style="margin-right:5px"></i><strong>${esc(t('listings'))}:</strong> ${listingIds.length}</span>` : ''}
          ${dismissedAt ? `<span class="detail-divider"></span><span><i class="fas fa-clock" style="margin-right:5px"></i><strong>${esc(t('dismissed_at'))}:</strong> ${esc(dismissedAt)}</span>` : ''}
        </div>
        <div class="alert-actions">
          <button class="btn-dismiss" onclick="undismissAlert('${d.snapshot_hash}')">
            <i class="fas fa-undo"></i> ${esc(t('undo'))}
          </button>
        </div>
      </div>
    `;
  }).join('');
}

async function loadDismissed() {
  try {
    const resp = await fetch('/api/listing-helper/dismissed');
    const data = await resp.json();
    if (!data.success) return;
    const rows = Array.isArray(data.dismissed) ? data.dismissed : [];
    updateBadge('badge-dismissed', rows.length);
    renderDismissed(rows);
  } catch (e) {}
}

function openListingImg(el) {
  if (!el) return;
  const img = decodeURIComponent(el.getAttribute('data-img') || '');
  const title = decodeURIComponent(el.getAttribute('data-title') || '');
  const modal = document.getElementById('imgModal');
  const imgEl = document.getElementById('imgModalImg');
  const titleEl = document.getElementById('imgModalTitle');
  if (!modal || !imgEl || !titleEl) return;
  imgEl.src = img || missingImgSvg();
  titleEl.textContent = title || t('listing');
  modal.style.display = 'flex';
}

function closeImgModal() {
  const modal = document.getElementById('imgModal');
  if (modal) modal.style.display = 'none';
}

async function dismissAlert(alertType, hash, upc, store = '') {
  try {
    const resp = await fetch('/api/listing-helper/dismiss', {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({alert_type: alertType, hash: hash, upc: upc, store: store})
    });
    const data = await resp.json();
    if (data.success) {
      scanAlerts();
      loadDismissed();
    } else {
      alert(t('failed_to_dismiss') + ': ' + (data.error || t('unknown')));
    }
  } catch (e) {
    alert(t('error') + ': ' + e.message);
  }
}

async function undismissAlert(hash) {
  try {
    const resp = await fetch('/api/listing-helper/undismiss', {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({hash})
    });
    const data = await resp.json();
    if (data.success) {
      scanAlerts();
      loadDismissed();
    } else {
      alert(t('error') + ': ' + (data.error || t('unknown')));
    }
  } catch (e) {
    alert(t('error') + ': ' + e.message);
  }
}

function hookLangToggle() {
  if (window.i18n && window.i18n.setLang && !window._listingHelperLangHooked) {
    const originalSetLang = window.i18n.setLang;
    window.i18n.setLang = function(lang) {
      originalSetLang(lang);
      scanAlerts();
      loadDismissed();
    };
    window._listingHelperLangHooked = true;
  }
}

// Auto-scan on load
window.addEventListener('load', () => {
  if (window.i18n && window.i18n.applyTranslations) {
    window.i18n.applyTranslations();
  }
  hookLangToggle();
  scanAlerts();
  loadDismissed();
});

// Close image modal when clicking outside
document.getElementById('imgModal').addEventListener('click', function(e) {
  if (e.target === this) closeImgModal();
});
</script>
<script src="/static/i18n.js"></script>
</body>
</html>
