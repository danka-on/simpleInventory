<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title data-i18n="mail_center">Mail Center</title>
  <style>
    :root {
      --mc-bg: #f8fafc;
      --mc-card: #ffffff;
      --mc-border: #e2e8f0;
      --mc-ink: #0f172a;
      --mc-muted: #64748b;
      --mc-accent: #7c3aed;
      --mc-accent2: #a78bfa;
      --mc-ok: #16a34a;
      --mc-warn: #f59e0b;
      --mc-radius: 14px;
    }
    * { box-sizing: border-box; margin: 0; }
    body {
      font-family: 'Segoe UI', 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      background: var(--mc-bg);
      color: var(--mc-ink);
      min-height: 100vh;
    }

    /* ── HERO ── */
    .hero {
      background: linear-gradient(135deg, #7c3aed 0%, #6366f1 50%, #818cf8 100%);
      padding: 22px 28px 18px;
      color: #fff;
    }
    .heroInner {
      max-width: 1280px;
      margin: 0 auto;
      display: flex;
      align-items: center;
      gap: 14px;
    }
    .heroBtn {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      padding: 7px 14px;
      border-radius: 10px;
      border: 1.5px solid rgba(255,255,255,0.3);
      background: rgba(255,255,255,0.12);
      color: #fff;
      font-size: 0.88rem;
      font-weight: 600;
      cursor: pointer;
      text-decoration: none;
      backdrop-filter: blur(6px);
      transition: background .15s, border-color .15s;
      white-space: nowrap;
    }
    .heroBtn:hover { background: rgba(255,255,255,0.22); border-color: rgba(255,255,255,0.5); }
    .heroTitle {
      font-size: 1.35rem;
      font-weight: 800;
      letter-spacing: -.02em;
    }
    .heroSub {
      font-size: 0.82rem;
      opacity: 0.8;
      margin-top: 2px;
    }
    .heroActions {
      margin-left: auto;
      display: flex;
      gap: 8px;
    }

    /* ── TOOLBAR ── */
    .toolbar {
      position: sticky;
      top: 0;
      z-index: 50;
      background: var(--mc-card);
      border-bottom: 1px solid var(--mc-border);
      padding: 10px 28px;
      display: flex;
      align-items: center;
      gap: 12px;
      flex-wrap: wrap;
    }
    .tbSearch {
      flex: 1;
      min-width: 180px;
      max-width: 340px;
    }
    .tbSearch input {
      width: 100%;
      padding: 8px 14px;
      border: 1.5px solid var(--mc-border);
      border-radius: 22px;
      font: inherit;
      font-size: 0.9rem;
      background: var(--mc-bg);
      color: var(--mc-ink);
      transition: border-color .15s;
    }
    .tbSearch input:focus {
      outline: none;
      border-color: var(--mc-accent);
    }
    .tbField {
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .tbField label {
      font-size: 0.78rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: .4px;
      color: var(--mc-muted);
      white-space: nowrap;
    }
    .tbField select {
      padding: 7px 10px;
      border: 1.5px solid var(--mc-border);
      border-radius: 10px;
      font: inherit;
      font-size: 0.88rem;
      background: var(--mc-bg);
      color: var(--mc-ink);
      cursor: pointer;
    }
    .tbField select:focus { outline: none; border-color: var(--mc-accent); }

    /* ── KPI PILLS ── */
    .kpiPills {
      display: flex;
      gap: 6px;
      margin-left: auto;
    }
    .kpiPill {
      padding: 5px 12px;
      border-radius: 20px;
      font-size: 0.78rem;
      font-weight: 700;
      background: rgba(124, 58, 237, 0.08);
      color: var(--mc-accent);
      border: 1px solid rgba(124, 58, 237, 0.15);
      white-space: nowrap;
    }
    .kpiPill.unread {
      background: rgba(239, 68, 68, 0.08);
      color: #dc2626;
      border-color: rgba(239, 68, 68, 0.18);
    }

    /* ── LAYOUT ── */
    .container {
      max-width: 1280px;
      margin: 0 auto;
      padding: 16px 28px;
    }
    .layout {
      display: grid;
      grid-template-columns: 380px 1fr;
      gap: 14px;
      min-height: 72vh;
    }

    /* ── PANELS ── */
    .panel {
      background: var(--mc-card);
      border: 1px solid var(--mc-border);
      border-radius: var(--mc-radius);
      box-shadow: 0 4px 24px rgba(0,0,0,0.05);
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }
    .panelHead {
      padding: 10px 14px;
      font-weight: 800;
      font-size: 0.85rem;
      letter-spacing: .3px;
      text-transform: uppercase;
      color: var(--mc-muted);
      border-bottom: 1px solid var(--mc-border);
      background: rgba(124, 58, 237, 0.03);
    }

    /* ── MESSAGE LIST ── */
    .msgList {
      list-style: none;
      padding: 0;
      overflow: auto;
      max-height: 72vh;
      flex: 1;
    }
    .msg {
      display: block;
      width: 100%;
      border: 0;
      border-bottom: 1px solid var(--mc-border);
      background: transparent;
      text-align: left;
      padding: 12px 14px;
      cursor: pointer;
      color: inherit;
      font: inherit;
      transition: background .1s;
    }
    .msg:hover { background: rgba(124, 58, 237, 0.05); }
    .msg.active { background: rgba(124, 58, 237, 0.1); border-left: 3px solid var(--mc-accent); }
    .msg.unread .msgSubject { font-weight: 800; }
    .msgTop {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 8px;
      margin-bottom: 4px;
    }
    .badge {
      display: inline-flex;
      align-items: center;
      border-radius: 999px;
      padding: 2px 9px;
      font-size: 0.72rem;
      font-weight: 700;
      letter-spacing: .3px;
    }
    .badge.store-ebay {
      background: rgba(59, 130, 246, 0.1);
      color: #2563eb;
      border: 1px solid rgba(59, 130, 246, 0.2);
    }
    .badge.store-amazon {
      background: rgba(249, 115, 22, 0.1);
      color: #c2410c;
      border: 1px solid rgba(249, 115, 22, 0.2);
    }
    .badge.unread-badge {
      background: rgba(239, 68, 68, 0.1);
      color: #dc2626;
      border: 1px solid rgba(239, 68, 68, 0.18);
    }
    .msgSubject {
      font-size: 0.94rem;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      margin-bottom: 3px;
    }
    .msgMeta {
      font-size: 0.8rem;
      color: var(--mc-muted);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    /* ── DETAIL PANEL ── */
    .detailWrap {
      display: flex;
      flex-direction: column;
      min-height: 0;
    }
    .detail {
      border-bottom: 1px solid var(--mc-border);
      padding: 14px;
      display: flex;
      flex-direction: column;
      gap: 10px;
      min-height: 180px;
    }
    .detailSubject {
      font-size: 1.08rem;
      font-weight: 700;
    }
    .metaRow {
      display: flex;
      flex-wrap: wrap;
      gap: 8px 16px;
      font-size: 0.86rem;
      color: var(--mc-muted);
    }
    .metaRow strong { color: var(--mc-ink); font-weight: 600; }
    .bodyBlock {
      white-space: pre-wrap;
      line-height: 1.5;
      background: rgba(124, 58, 237, 0.03);
      border: 1px solid var(--mc-border);
      border-radius: 10px;
      padding: 12px;
      min-height: 70px;
      font-size: 0.92rem;
    }
    .detailActions {
      display: flex;
      gap: 8px;
      margin-top: 4px;
    }

    /* ── COMPOSE ── */
    .compose {
      padding: 14px;
      display: flex;
      flex-direction: column;
      gap: 10px;
      flex: 1;
    }
    .composeGrid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 10px;
    }
    .composeGrid .full { grid-column: 1 / -1; }
    .field { display: flex; flex-direction: column; gap: 5px; }
    .field label {
      font-size: 0.8rem;
      font-weight: 600;
      color: var(--mc-muted);
    }
    .field select,
    .field input,
    .field textarea {
      border: 1.5px solid var(--mc-border);
      border-radius: 10px;
      padding: 9px 11px;
      font: inherit;
      font-size: 0.9rem;
      background: var(--mc-bg);
      color: var(--mc-ink);
      transition: border-color .15s;
    }
    .field select:focus,
    .field input:focus,
    .field textarea:focus {
      outline: none;
      border-color: var(--mc-accent);
    }
    .composeActions {
      display: flex;
      gap: 8px;
      justify-content: flex-end;
    }
    .btnSm {
      padding: 8px 16px;
      border-radius: 10px;
      border: 1.5px solid var(--mc-border);
      background: var(--mc-card);
      color: var(--mc-ink);
      font-size: 0.88rem;
      font-weight: 600;
      cursor: pointer;
      transition: all .15s;
    }
    .btnSm:hover { background: var(--mc-bg); }
    .btnSm.primary {
      background: linear-gradient(135deg, #7c3aed, #6366f1);
      color: #fff;
      border: none;
      box-shadow: 0 3px 12px rgba(124, 58, 237, 0.25);
    }
    .btnSm.primary:hover { box-shadow: 0 5px 18px rgba(124, 58, 237, 0.35); }
    .status {
      min-height: 1.2em;
      font-size: 0.86rem;
      color: var(--mc-muted);
    }
    .status.ok { color: var(--mc-ok); }
    .status.err { color: #dc2626; }
    .empty {
      padding: 24px;
      color: var(--mc-muted);
      text-align: center;
      font-size: 0.92rem;
    }

    /* ── RESPONSIVE ── */
    @media (max-width: 980px) {
      .layout { grid-template-columns: 1fr; }
      .msgList { max-height: 42vh; }
      .composeGrid { grid-template-columns: 1fr; }
      .hero { padding: 16px 14px 14px; }
      .toolbar { padding: 10px 14px; }
      .container { padding: 12px 14px; }
    }

    /* ── NIGHT MODE ── */
    html.ss-theme-night {
      --mc-bg: #0f172a;
      --mc-card: #1e293b;
      --mc-border: rgba(255,255,255,0.1);
      --mc-ink: #e2e8f0;
      --mc-muted: #94a3b8;
    }
    html.ss-theme-night .hero {
      background: linear-gradient(135deg, #5b21b6 0%, #4338ca 50%, #6366f1 100%);
    }
    html.ss-theme-night .toolbar {
      background: var(--mc-card);
      border-bottom-color: rgba(255,255,255,0.08);
    }
    html.ss-theme-night .tbSearch input {
      background: rgba(255,255,255,0.05);
      border-color: rgba(255,255,255,0.12);
      color: var(--mc-ink);
    }
    html.ss-theme-night .tbField select {
      background: rgba(255,255,255,0.05);
      border-color: rgba(255,255,255,0.12);
      color: var(--mc-ink);
      color-scheme: dark;
    }
    html.ss-theme-night .tbField select option {
      background-color: #0f172a;
      color: #e2e8f0;
    }
    html.ss-theme-night .tbField select option:checked {
      background-color: #334155;
      color: #f8fafc;
    }
    html.ss-theme-night .panel {
      box-shadow: 0 8px 32px rgba(0,0,0,0.3);
    }
    html.ss-theme-night .panelHead {
      background: rgba(124, 58, 237, 0.06);
    }
    html.ss-theme-night .msg {
      border-bottom-color: rgba(255,255,255,0.06);
    }
    html.ss-theme-night .msg:hover { background: rgba(139, 92, 246, 0.1); }
    html.ss-theme-night .msg.active { background: rgba(139, 92, 246, 0.18); border-left-color: var(--mc-accent2); }
    html.ss-theme-night .bodyBlock {
      background: rgba(0,0,0,0.3);
      border-color: rgba(255,255,255,0.08);
    }
    html.ss-theme-night .field select,
    html.ss-theme-night .field input,
    html.ss-theme-night .field textarea {
      background: rgba(255,255,255,0.05);
      border-color: rgba(255,255,255,0.12);
      color: var(--mc-ink);
    }
    html.ss-theme-night .btnSm {
      background: rgba(255,255,255,0.05);
      border-color: rgba(255,255,255,0.12);
      color: var(--mc-ink);
    }
    html.ss-theme-night .btnSm:hover { background: rgba(255,255,255,0.1); }
    html.ss-theme-night .metaRow strong { color: #e2e8f0; }
    html.ss-theme-night .kpiPill {
      background: rgba(167, 139, 250, 0.12);
      border-color: rgba(167, 139, 250, 0.2);
      color: var(--mc-accent2);
    }
    html.ss-theme-night .kpiPill.unread {
      background: rgba(248, 113, 113, 0.12);
      border-color: rgba(248, 113, 113, 0.2);
      color: #f87171;
    }
    html.ss-theme-night .badge.store-ebay {
      background: rgba(96, 165, 250, 0.12);
      color: #93c5fd;
      border-color: rgba(96, 165, 250, 0.2);
    }
    html.ss-theme-night .badge.store-amazon {
      background: rgba(251, 146, 60, 0.12);
      color: #fdba74;
      border-color: rgba(251, 146, 60, 0.2);
    }
  </style>
</head>
<body>
  <!-- ── HERO ── -->
  <div class="hero">
    <div class="heroInner">
      <a href="/store-manager" class="heroBtn" style="margin-right:6px;">← Back</a>
      <div>
        <div class="heroTitle" data-i18n="mail_center">Mail Center</div>
        <div class="heroSub" data-i18n="mail_center_desc">Centralized messages for all stores</div>
      </div>
      <div class="heroActions">
        <button id="syncBtn" class="heroBtn" type="button" data-i18n="sync_live">Sync Live</button>
        <button id="refreshBtn" class="heroBtn" type="button" data-i18n="refresh">Refresh</button>
      </div>
    </div>
  </div>

  <!-- ── TOOLBAR ── -->
  <div class="toolbar">
    <div class="tbSearch">
      <input id="searchInput" type="text" data-i18n="mail_search_placeholder" placeholder="Search subject, body, sender, recipient">
    </div>
    <div class="tbField">
      <label for="storeFilter">Store</label>
      <select id="storeFilter">
        <option value="all" data-i18n="all_stores">All Stores</option>
        <option value="ebay">eBay</option>
        <option value="amazon">Amazon</option>
      </select>
    </div>
    <div class="tbField">
      <label for="boxFilter">Mailbox</label>
      <select id="boxFilter">
        <option value="inbox" data-i18n="inbox">Inbox</option>
        <option value="sent" data-i18n="sent">Sent</option>
        <option value="all" data-i18n="all_messages">All</option>
      </select>
    </div>
    <div class="kpiPills">
      <span class="kpiPill" id="kpiTotal">0 messages</span>
      <span class="kpiPill unread" id="kpiUnread">0 unread</span>
    </div>
  </div>

  <!-- ── MAIN LAYOUT ── -->
  <div class="container">
    <div class="layout">
      <!-- Message List Panel -->
      <section class="panel">
        <div class="panelHead" data-i18n="mail_queue">Messages</div>
        <ul id="messageList" class="msgList"></ul>
      </section>

      <!-- Detail & Compose Panel -->
      <section class="panel detailWrap">
        <div class="panelHead" data-i18n="message">Message Detail</div>
        <div id="messageDetail" class="detail">
          <div class="empty" data-i18n="select_message_to_view">Select a message to view details</div>
        </div>
        <form id="composeForm" class="compose">
          <div class="panelHead" style="margin:-14px -14px 0 -14px;" data-i18n="send_message">Send Message</div>
          <input id="replyToId" type="hidden">
          <div class="composeGrid">
            <div class="field full">
              <label for="composeBody" data-i18n="message_body">Message Body</label>
              <textarea id="composeBody" rows="5" data-i18n="message_body_placeholder" placeholder="Type your message"></textarea>
            </div>
          </div>
          <div class="composeActions">
            <button id="clearComposeBtn" type="button" class="btnSm" data-i18n="clear">Clear</button>
            <button id="sendBtn" type="submit" class="btnSm primary" data-i18n="send">Send</button>
          </div>
          <div id="statusLine" class="status"></div>
        </form>
      </section>
    </div>
  </div>

  <script src="/static/i18n.js"></script>
  <script>
    (function(){
      const state = {
        messages: [],
        activeId: null,
        loadPromise: null,
        syncPromise: null,
        lastLoadAt: 0,
        lastSyncAt: 0,
        lastLoadQuery: '',
      };

      const $ = (id) => document.getElementById(id);
      const listEl = $('messageList');
      const detailEl = $('messageDetail');
      const statusEl = $('statusLine');
      const storeFilterEl = $('storeFilter');
      const boxFilterEl = $('boxFilter');
      const searchInputEl = $('searchInput');
      const syncBtnEl = $('syncBtn');

      function t(key){
        return (window.i18n && window.i18n.t) ? window.i18n.t(key) : key;
      }

      function esc(v){
        return String(v == null ? '' : v)
          .replace(/&/g, '&amp;')
          .replace(/</g, '&lt;')
          .replace(/>/g, '&gt;')
          .replace(/"/g, '&quot;')
          .replace(/'/g, '&#39;');
      }

      function fmtStore(raw){
        const s = (raw || '').toLowerCase();
        if(s.includes('ebay')) return 'eBay';
        if(s.includes('amazon')) return 'Amazon';
        return raw || '';
      }

      function fmtTs(value){
        if(!value) return '';
        const d = new Date(value.replace(' ', 'T'));
        if(Number.isNaN(d.getTime())) return value;
        return d.toLocaleString();
      }

      function setStatus(msg, kind){
        statusEl.textContent = msg || '';
        statusEl.className = 'status';
        if(kind === 'ok') statusEl.classList.add('ok');
        if(kind === 'err') statusEl.classList.add('err');
      }

      function updateKpis(){
        const total = state.messages.length;
        const unread = state.messages.filter(m => m.direction === 'inbound' && m.status === 'unread').length;
        $('kpiTotal').textContent = total + ' message' + (total !== 1 ? 's' : '');
        $('kpiUnread').textContent = unread + ' unread';
      }

      function applyInitialFiltersFromUrl(){
        try{
          const p = new URLSearchParams(window.location.search || '');
          const store = (p.get('store') || '').trim().toLowerCase();
          const box = (p.get('box') || '').trim().toLowerCase();
          const q = (p.get('q') || '').trim();

          if(['all', 'ebay', 'amazon'].includes(store)){
            storeFilterEl.value = store;
          }
          if(['inbox', 'sent', 'all'].includes(box)){
            boxFilterEl.value = box;
          }
          if(q){
            searchInputEl.value = q;
          }
        }catch(_e){}
      }

      function buildQuery(){
        const p = new URLSearchParams();
        p.set('store', storeFilterEl.value || 'all');
        p.set('box', boxFilterEl.value || 'inbox');
        const q = (searchInputEl.value || '').trim();
        if(q) p.set('q', q);
        p.set('limit', '300');
        return p.toString();
      }

      async function markRead(id){
        try{
          await fetch('/api/mail-center/messages/' + encodeURIComponent(id) + '/read', { method: 'POST' });
        }catch(_e){}
      }

      function renderList(){
        const activeId = state.activeId;
        if(!state.messages.length){
          listEl.innerHTML = '<li class="empty" data-i18n="no_messages_found">' + esc(t('no_messages_found')) + '</li>';
          if(window.i18n && window.i18n.applyTranslations) window.i18n.applyTranslations();
          return;
        }

        listEl.innerHTML = state.messages.map((m) => {
          const active = (m.id === activeId) ? ' active' : '';
          const unread = (m.direction === 'inbound' && m.status === 'unread') ? ' unread' : '';
          const storeClass = fmtStore(m.store) === 'eBay' ? 'store-ebay' : 'store-amazon';
          const subject = m.subject || '(No subject)';
          const peer = m.direction === 'inbound' ? (m.sender_name || '') : (m.recipient_name || '');
          const unreadBadge = unread ? ('<span class="badge unread-badge">NEW</span>') : '';
          return ''
            + '<li>'
            + '  <button class="msg' + active + unread + '" data-id="' + m.id + '" type="button">'
            + '    <div class="msgTop">'
            + '      <span class="badge ' + storeClass + '">' + esc(fmtStore(m.store)) + '</span>'
            + '      ' + unreadBadge
            + '    </div>'
            + '    <div class="msgSubject">' + esc(subject) + '</div>'
            + '    <div class="msgMeta">' + esc(peer) + ' · ' + esc(fmtTs(m.created_at)) + '</div>'
            + '  </button>'
            + '</li>';
        }).join('');

        listEl.querySelectorAll('.msg').forEach((btn) => {
          btn.addEventListener('click', () => {
            const id = parseInt(btn.getAttribute('data-id') || '0', 10);
            if(id) setActiveMessage(id);
          });
        });
      }

      function renderDetail(){
        const m = state.messages.find(x => x.id === state.activeId);
        if(!m){
          detailEl.innerHTML = '<div class="empty" data-i18n="select_message_to_view">' + esc(t('select_message_to_view')) + '</div>';
          if(window.i18n && window.i18n.applyTranslations) window.i18n.applyTranslations();
          return;
        }
        const peerLabel = m.direction === 'inbound' ? t('sender') : t('recipient');
        const peerValue = m.direction === 'inbound' ? (m.sender_name || '') : (m.recipient_name || '');
        const statusLabel = m.direction === 'inbound' ? (m.status || '') : t('sent');
        detailEl.innerHTML = ''
          + '<div class="detailSubject">' + esc(m.subject || '(No subject)') + '</div>'
          + '<div class="metaRow">'
          + '  <span><strong>' + esc(t('store')) + ':</strong> ' + esc(fmtStore(m.store)) + '</span>'
          + '  <span><strong>' + esc(peerLabel) + ':</strong> ' + esc(peerValue) + '</span>'
          + '  <span><strong>' + esc(t('status')) + ':</strong> ' + esc(statusLabel) + '</span>'
          + '  <span><strong>' + esc(t('date')) + ':</strong> ' + esc(fmtTs(m.created_at)) + '</span>'
          + '</div>'
          + '<div class="bodyBlock">' + esc(m.body || '') + '</div>'
          + '<div class="detailActions">'
          + '  <button id="replyBtn" type="button" class="btnSm">Reply</button>'
          + '</div>';

        const replyBtn = $('replyBtn');
        if(replyBtn){
          replyBtn.addEventListener('click', () => {
            prepareReply(m);
          });
        }
      }

      function clearCompose(){
        $('replyToId').value = '';
        $('composeBody').value = '';
        setStatus('');
      }

      function prepareReply(m){
        $('replyToId').value = String(m.id);
        $('composeBody').focus();
      }

      async function setActiveMessage(id){
        state.activeId = id;
        renderList();
        renderDetail();
        const m = state.messages.find(x => x.id === id);
        if(m && m.direction === 'inbound' && m.status === 'unread'){
          m.status = 'read';
          renderList();
          renderDetail();
          updateKpis();
          await markRead(id);
        }
      }

      async function loadMessages(opts){
        const keepSelection = !opts || opts.keepSelection !== false;
        const force = !!(opts && opts.force);
        const now = Date.now();
        const query = buildQuery();
        if(state.loadPromise){
          return state.loadPromise;
        }
        if(!force && state.lastLoadQuery === query && (now - state.lastLoadAt) < 1000){
          return;
        }

        state.loadPromise = (async () => {
          setStatus(t('loading'));
          try{
            const r = await fetch('/api/mail-center/messages?' + query);
            const j = await r.json();
            if(!j || !j.success){
              throw new Error((j && j.error) ? j.error : 'Failed to load messages');
            }
            state.messages = j.messages || [];
            if(keepSelection && state.activeId && state.messages.some(m => m.id === state.activeId)){
              // keep active selection
            } else {
              state.activeId = state.messages.length ? state.messages[0].id : null;
            }
            renderList();
            renderDetail();
            updateKpis();
            setStatus('');
            state.lastLoadAt = Date.now();
            state.lastLoadQuery = query;
          }catch(err){
            setStatus((err && err.message) ? err.message : t('error'), 'err');
          } finally {
            state.loadPromise = null;
          }
        })();
        return state.loadPromise;
      }

      async function syncLive(opts){
        const silent = !!(opts && opts.silent);
        const now = Date.now();
        if(state.syncPromise){
          return state.syncPromise;
        }
        if(!silent && (now - state.lastSyncAt) < 1000){
          return;
        }
        state.syncPromise = (async () => {
          if(!silent) setStatus(t('live_syncing'));
          try{
            const payload = { store: (storeFilterEl.value || 'all') };
            const resp = await fetch('/api/mail-center/sync', {
              method: 'POST',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify(payload)
            });
            const j = await resp.json();
            if(!resp.ok || !j.success){
              throw new Error((j && j.error) ? j.error : 'Sync failed');
            }
            state.lastSyncAt = Date.now();
            if(!silent){
              const warnings = (j.warnings || []);
              setStatus(warnings.length ? warnings.join(', ') : t('live_sync_ok'), warnings.length ? 'err' : 'ok');
            }
          }catch(err){
            if(!silent){
              setStatus((err && err.message) ? err.message : t('error'), 'err');
            }
          } finally {
            state.syncPromise = null;
          }
        })();
        return state.syncPromise;
      }

      async function sendMessage(ev){
        ev.preventDefault();
        setStatus('');
        const body = ($('composeBody').value || '').trim();
        const reply_to_id = $('replyToId').value ? parseInt($('replyToId').value, 10) : null;
        const replyMsg = reply_to_id ? state.messages.find((m) => m.id === reply_to_id) : null;
        let store = 'ebay';
        if(replyMsg){
          store = fmtStore(replyMsg.store) === 'Amazon' ? 'amazon' : 'ebay';
        } else if((storeFilterEl.value || '').toLowerCase() === 'amazon'){
          store = 'amazon';
        }
        const recipient_name = (replyMsg ? (replyMsg.sender_name || replyMsg.recipient_name || '') : '').trim();
        const baseSubject = ((replyMsg && replyMsg.subject) ? replyMsg.subject : '').trim();
        const subject = baseSubject
          ? (baseSubject.toLowerCase().startsWith('re:') ? baseSubject : ('Re: ' + baseSubject))
          : (store === 'amazon' ? 'Message from Sweet Shelves' : 'Re: eBay Message');
        if(!body){
          setStatus(t('message_body_required'), 'err');
          return;
        }

        try{
          const resp = await fetch('/api/mail-center/send', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ store, recipient_name, subject, body, reply_to_id })
          });
          const j = await resp.json();
          if(!resp.ok || !j.success){
            throw new Error((j && j.error) ? j.error : 'Send failed');
          }

          setStatus(t('message_sent_ok'), 'ok');
          $('replyToId').value = '';
          $('composeBody').value = '';
          if((boxFilterEl.value || 'inbox') === 'sent'){
            await loadMessages({ keepSelection: false });
          }
        }catch(err){
          setStatus((err && err.message) ? err.message : t('error'), 'err');
        }
      }

      function wireEvents(){
        $('refreshBtn').addEventListener('click', () => loadMessages({ keepSelection: true }));
        if(syncBtnEl){
          syncBtnEl.addEventListener('click', async () => {
            await syncLive({ silent: false });
            await loadMessages({ keepSelection: true, force: true });
          });
        }
        $('clearComposeBtn').addEventListener('click', clearCompose);
        $('composeForm').addEventListener('submit', sendMessage);
        storeFilterEl.addEventListener('change', () => loadMessages({ keepSelection: false }));
        boxFilterEl.addEventListener('change', () => loadMessages({ keepSelection: false }));

        let searchTimer = null;
        searchInputEl.addEventListener('input', () => {
          clearTimeout(searchTimer);
          searchTimer = setTimeout(() => loadMessages({ keepSelection: false }), 220);
        });
      }

      applyInitialFiltersFromUrl();
      wireEvents();
      (async () => {
        await syncLive({ silent: true });
        await loadMessages({ keepSelection: false, force: true });
      })();
      setInterval(async () => {
        if(document.visibilityState !== 'visible') return;
        await syncLive({ silent: true });
        await loadMessages({ keepSelection: true, force: true });
      }, 60000);
    })();
  </script>
</body>
</html>
