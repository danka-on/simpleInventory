<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title data-i18n="item_prep_no_barcode_title">Item Prep - No Barcode</title>
  <style>
    * { margin:0; padding:0; box-sizing:border-box; }
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif; padding:16px; background:#95a5a6; }
    .container { max-width:800px; margin:0 auto; }
    h1 { margin-bottom:20px; color:#2c3e50; }
    .card { background:#fff; padding:20px; border-radius:12px; box-shadow:0 2px 8px rgba(0,0,0,0.1); margin-bottom:16px; }
    .btn { padding:10px 16px; border:none; border-radius:8px; font-size:14px; cursor:pointer; margin-right:8px; transition:all 0.2s; }
    .btn-primary { background:#00b894; color:#fff; }
    .btn-primary:hover { background:#00a383; }
    .btn-danger { background:#e74c3c; color:#fff; }
    .btn-danger:hover { background:#d63027; }
    .btn-gray { background:#95a5a6; color:#fff; }
    .btn-gray:hover { background:#7f8c8d; }
    .search-box { display:flex; gap:8px; align-items:stretch; }
    .search-box input[type="text"] { flex:1; padding:12px; border:1px solid #ddd; border-radius:8px; font-size:14px; margin-bottom:0; }
    .search-box button { padding:12px 20px; border:none; border-radius:8px; background:#00b894; color:#fff; cursor:pointer; font-size:18px; transition:all 0.2s; }
    .search-box button:hover { background:#00a383; }
    .search-results { margin-top:16px; }
    .result-item { background:#f8f9fa; padding:12px; margin-bottom:8px; border-radius:8px; cursor:pointer; transition:all 0.2s; border:2px solid transparent; }
    .result-item:hover { background:#e9ecef; border-color:#00b894; }
    .result-item.selected { background:#d1f2eb; border-color:#00b894; }
    .result-item img { width:60px; height:60px; object-fit:cover; border-radius:6px; margin-right:12px; vertical-align:middle; }
    .result-item-info { display:inline-block; vertical-align:middle; max-width:calc(100% - 80px); }
    .result-title { font-weight:600; color:#2c3e50; margin-bottom:4px; }
    .result-upc { color:#7f8c8d; font-size:13px; }
    .muted { color:#95a5a6; font-size:13px; margin-top:8px; }
    .hidden { display:none; }
    .sr-only { position:absolute; width:1px; height:1px; padding:0; margin:-1px; overflow:hidden; clip:rect(0,0,0,0); border:0; }
    .selected-item-card { background:#e8f8f5; padding:16px; border-radius:8px; border:2px solid #00b894; margin-top:16px; }
    .selected-item-card img { max-width:200px; border-radius:8px; margin-top:8px; }
    .barcode-field { background:#fff; padding:12px; border:2px solid #00b894; border-radius:8px; font-family:monospace; font-size:16px; margin-top:12px; }
    .action-buttons { margin-top:16px; display:flex; gap:12px; }
    .pagination { margin-top:16px; display:flex; gap:8px; align-items:center; justify-content:center; }
    .pagination-btn { padding:8px 12px; background:#ecf0f1; border:1px solid #bdc3c7; border-radius:6px; cursor:pointer; }
    .pagination-btn:hover { background:#bdc3c7; }
    .pagination-btn:disabled { background:#f5f5f5; cursor:not-allowed; opacity:0.5; }
    .pagination-info { color:#7f8c8d; font-size:13px; }
  </style>
</head>
<body>
  <div class="container">
    <h1>🔍 <span data-i18n="item_prep_no_barcode_title">Item Prep - No Barcode</span></h1>
    <div style="margin-bottom:16px; text-align:right;">
      <a href="/barcode-print-que" class="btn btn-primary" style="text-decoration:none;">🖨️ <span data-i18n="barcode_print_que">Barcode Print Que</span></a>
    </div>
    <div class="card">
      <a href="/item-prep"><button class="btn btn-danger">← <span data-i18n="back_to_prep">Back to Prep</span></button></a>
      <div style="margin-top:20px; margin-bottom:20px">
        <div class="search-box">
          <input type="text" id="searchInput" placeholder="Search by item name or UPC code..." data-i18n="search_items_placeholder" autofocus>
          <button id="searchBtn">🔍 <span class="sr-only" data-i18n="search">Search</span></button>
        </div>
      </div>
      <div id="searchResults" class="search-results hidden">
        <div id="resultsContainer"></div>
        <div id="pagination" class="pagination hidden"></div>
      </div>
      <div id="selectedItemCard" class="selected-item-card hidden">
        <h3 style="margin-bottom:12px" data-i18n="selected_item">Selected Item</h3>
        <div id="selectedItemInfo"></div>
        <div class="barcode-field" id="barcodeField"></div>
        <div class="action-buttons">
          <button class="btn btn-primary" id="printBarcodeBtn" style="flex:1">🖨️ <span data-i18n="print_barcode">Print Barcode</span></button>
          <button class="btn btn-primary" id="addToQueBtn" style="flex:1">➕ <span data-i18n="add_to_print_que">Add to Print Que</span></button>
        </div>
      </div>
      <div style="margin-top:144px; text-align:center">
        <a href="/item-prep-create-item" style="text-decoration:none; display:block;">
          <button class="btn" style="background:#f39c12; color:#fff; padding:12px 24px; border-radius:8px; border:none; font-size:1rem; width:100%; display:block;">➕ <span data-i18n="no_item_found_create_new">No Item Found - Create New</span></button>
        </a>
      </div>
      <div id="statusMsg" class="muted"></div>
    </div>
  </div>
  <script>
    let selectedItem = null;
    let currentPage = 1;
    let totalPages = 1;
    let currentQuery = '';
    const searchInput = document.getElementById('searchInput');
    const searchBtn = document.getElementById('searchBtn');
    const searchResults = document.getElementById('searchResults');
    const resultsContainer = document.getElementById('resultsContainer');
    const pagination = document.getElementById('pagination');
    const selectedItemCard = document.getElementById('selectedItemCard');
    const selectedItemInfo = document.getElementById('selectedItemInfo');
    const barcodeField = document.getElementById('barcodeField');
    const addToQueBtn = document.getElementById('addToQueBtn');
    addToQueBtn.disabled = true;

    function tr(key, fallback) {
      if (window.i18n && typeof window.i18n.t === 'function') return window.i18n.t(key);
      return fallback || key;
    }

    function updateAddToQueBtn() {
      addToQueBtn.disabled = !selectedItem;
    }

    addToQueBtn.addEventListener('click', async () => {
      if (!selectedItem) return;
      
      // Immediate visual feedback
      addToQueBtn.disabled = true;
      addToQueBtn.style.opacity = '0.5';
      addToQueBtn.textContent = '⏳ ' + tr('adding', 'Adding...');
      statusMsg.textContent = 'Adding to print queue...';
      
      try {
        const response = await fetch('/api/print-queue', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ title: selectedItem.item_description, barcode: selectedItem.upc })
        });
        const data = await response.json();
        if (data.success) {
          addToQueBtn.textContent = '✓ ' + tr('added', 'Added!');
          addToQueBtn.style.background = '#2ecc71';
          statusMsg.textContent = 'Added to print queue! Loading item prep...';
          // Store UPC and redirect to item prep page to continue workflow
          sessionStorage.setItem('prepUpc', selectedItem.upc);
          setTimeout(() => {
            window.location.href = '/item-prep';
          }, 300);
        } else {
          statusMsg.textContent = 'Failed to add to queue: ' + data.error;
          addToQueBtn.disabled = false;
          addToQueBtn.style.opacity = '1';
          addToQueBtn.textContent = '➕ ' + tr('add_to_print_que', 'Add to Print Que');
        }
      } catch (error) {
        console.error('Error adding to queue:', error);
        statusMsg.textContent = 'Failed to add to queue: ' + error.message;
        addToQueBtn.disabled = false;
        addToQueBtn.style.opacity = '1';
        addToQueBtn.textContent = '➕ ' + tr('add_to_print_que', 'Add to Print Que');
      }
    });

    function esc(s) {
      return (s || '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;','\'':'&#39;'}[c]));
    }
    function missingThumb(w=200,h=200){ return `https://placehold.co/${w}x${h}?text=No+Image`; }

    async function searchItems(query, page=1) {
      if (!query.trim()) return;
      statusMsg.textContent = 'Searching...';
      resultsContainer.innerHTML = '';
      selectedItem = null;
      selectedItemCard.classList.add('hidden');
      updateAddToQueBtn();
      searchResults.classList.remove('hidden');
      pagination.classList.add('hidden');
      try {
        const resp = await fetch('/api/search-rawbol', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ query, page })
        });
        const data = await resp.json();
        if (!data.success) throw new Error(data.error || 'Search failed');
        const items = data.results || [];
        totalPages = Math.ceil((data.total || 0) / 3);
        currentPage = page;
        currentQuery = query;
        resultsContainer.innerHTML = '';
        if (items.length === 0) {
          resultsContainer.innerHTML = '<div class="muted">No items found.</div>';
          pagination.classList.add('hidden');
        } else {
          items.forEach((item, idx) => {
            const div = document.createElement('div');
            div.className = 'result-item';
            div.innerHTML = `<img src="${esc(item.image_url) || missingThumb(60,60)}" alt="item"><span class="result-item-info"><div class="result-title">${esc(item.item_description)}</div><div class="result-upc">UPC: ${esc(item.upc)}</div></span>`;
            div.onclick = () => selectItem(item, div);
            resultsContainer.appendChild(div);
          });
          pagination.classList.remove('hidden');
          renderPagination();
        }
        statusMsg.textContent = '';
      } catch (e) {
        resultsContainer.innerHTML = '<div class="muted">Search failed: '+esc(e.message)+'</div>';
        statusMsg.textContent = '';
      }
    }

    function renderPagination() {
      pagination.innerHTML = '';
      const prevBtn = document.createElement('button');
      prevBtn.className = 'pagination-btn';
      prevBtn.textContent = '← ' + tr('prev', 'Prev');
      prevBtn.disabled = currentPage <= 1;
      prevBtn.onclick = () => searchItems(currentQuery, currentPage - 1);
      pagination.appendChild(prevBtn);
      const info = document.createElement('span');
      info.className = 'pagination-info';
      info.textContent = `Page ${currentPage} of ${totalPages}`;
      pagination.appendChild(info);
      const nextBtn = document.createElement('button');
      nextBtn.className = 'pagination-btn';
      nextBtn.textContent = tr('next', 'Next') + ' →';
      nextBtn.disabled = currentPage >= totalPages;
      nextBtn.onclick = () => searchItems(currentQuery, currentPage + 1);
      pagination.appendChild(nextBtn);
    }

    function selectItem(item, elem) {
      document.querySelectorAll('.result-item').forEach(e => e.classList.remove('selected'));
      elem.classList.add('selected');
      selectedItem = item;
      selectedItemInfo.innerHTML = `<div class="result-title">${esc(item.item_description)}</div><div class="result-upc">UPC: ${esc(item.upc)}</div><img src="${esc(item.image_url) || missingThumb(200,200)}" alt="item" onerror="this.src='${missingThumb(200,200)}'">`;
      barcodeField.textContent = `Barcode: ${item.upc}`;
      selectedItemCard.classList.remove('hidden');
      statusMsg.textContent = 'Item selected. Print barcode or continue to prep.';
      updateAddToQueBtn();
      setTimeout(() => { window.scrollTo({ top: document.body.scrollHeight, behavior: 'smooth' }); }, 100);
    }

    searchInput.addEventListener('keypress', (e) => { if (e.key === 'Enter') searchItems(searchInput.value); });
    searchBtn.addEventListener('click', () => searchItems(searchInput.value));

    function printBarcodeBrowser(barcodeData) {
  const printWindow = window.open('', '', 'toolbar=0,location=0,menubar=0,scrollbars=0,status=0,titlebar=0');
  const html = [
  '<!DOCTYPE html>',
  '<html>',
  '<head>',
  '  <title></title>',
  '  <style>',
  '    @page {',
  '      size: 3in 1in;',
  '      margin: 0;',
  "      /* Remove all headers/footers in most browsers */",
  '      @top-left { content: none }',
  '      @top-center { content: none }',
  '      @top-right { content: none }',
  '      @bottom-left { content: none }',
  '      @bottom-center { content: none }',
  '      @bottom-right { content: none }',
  '    }',
  '    html, body { width: 100%; height: 100%; margin: 0 !important; padding: 0 !important; background: white !important; box-shadow: none !important; }',
  '    body { font-family: Arial, sans-serif; display: flex; justify-content: center; align-items: center; height: 1in; }',
  '    .barcode-label { width: 3in; height: 1in; display: flex; flex-direction: column; align-items: center; justify-content: center; page-break-inside: avoid; break-inside: avoid; padding: 0; }',
  '    .barcode-title { font-size: 12px; font-weight: bold; text-align: center; margin-bottom: 2px; color: #000; max-width: 2.8in; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }',
  '    #barcode { display: block; margin: 0 auto; width: 2.6in; height: 0.5in; }',
  '    @media print {',
  '      .barcode-label { border: none; page-break-inside: avoid; break-inside: avoid; }',
  '      body { -webkit-print-color-adjust: exact; print-color-adjust: exact; }',
  '      header, footer { display: none !important; }',
  '    }',
  '  </style>',
        '  <script src="https://cdn.jsdelivr.net/npm/jsbarcode@3.11.5/dist/JsBarcode.all.min.js"><\/script>',
        '</head>',
        '<body>',
        '  <div class="barcode-label">',
        '    <div class="barcode-title">' + (barcodeData.description || '') + '</div>',
        '    <svg id="barcode"></svg>',
        '  </div>',
        '  <script>',
        '    JsBarcode("#barcode", "' + (barcodeData.upc || '') + '", {',
        '      format: "CODE128",',
        '      width: 2,',
        '      height: 40,',
        '      displayValue: true,',
        '      fontSize: 12,',
        '      margin: 0',
        '    });',
        '    setTimeout(function() { window.print(); }, 400);',
        '    window.onafterprint = function() { window.close(); };',
        '  <\/script>',
        '</body>',
        '</html>'
      ].join('\n');
      printWindow.document.write(html);
      printWindow.document.close();
      // Remove about:blank and set document title to empty after load
      printWindow.onload = function() {
        printWindow.document.title = '';
      };
    }

    printBarcodeBtn.addEventListener('click', async () => {
      if (!selectedItem) return;
      
      // Immediate visual feedback
      printBarcodeBtn.disabled = true;
      printBarcodeBtn.style.opacity = '0.5';
      printBarcodeBtn.textContent = '⏳ ' + tr('printing', 'Printing...');
      
      try {
        statusMsg.textContent = 'Preparing to print...';
        const configResponse = await fetch('/api/printer/config');
        const configData = await configResponse.json();
        const printerConfig = configData.config || {};
        
        if (printerConfig.print_method === 'browser') {
          statusMsg.textContent = 'Opening print dialog...';
          printBarcodeBrowser({ upc: selectedItem.upc, description: selectedItem.item_description });
          printBarcodeBtn.textContent = '✓ ' + tr('print_dialog_opened', 'Print Dialog Opened!');
          printBarcodeBtn.style.background = '#2ecc71';
          statusMsg.textContent = 'Print dialog opened! Loading item prep...';
          // Store UPC and redirect to item prep page
          sessionStorage.setItem('prepUpc', selectedItem.upc);
          setTimeout(() => {
            window.location.href = '/item-prep';
          }, 800);
          return;
        }
        
        statusMsg.textContent = 'Printing...';
        const response = await fetch('/api/printer/print-barcode', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ upc: selectedItem.upc, item_description: selectedItem.item_description, quantity: 1 })
        });
        const data = await response.json();
        if (data.success) {
          printBarcodeBtn.textContent = '✓ ' + tr('printed', 'Printed!');
          printBarcodeBtn.style.background = '#2ecc71';
          statusMsg.textContent = 'Barcode printed successfully! Loading item prep...';
          // Store UPC and redirect to item prep page
          sessionStorage.setItem('prepUpc', selectedItem.upc);
          setTimeout(() => {
            window.location.href = '/item-prep';
          }, 500);
        } else {
          statusMsg.textContent = 'Print failed: ' + data.error;
          alert('Print failed: ' + data.error + '\n\nMake sure the printer is configured in Printer Settings.');
          printBarcodeBtn.disabled = false;
          printBarcodeBtn.style.opacity = '1';
          printBarcodeBtn.textContent = '🖨️ ' + tr('print_barcode', 'Print Barcode');
        }
      } catch (error) {
        console.error('Print error:', error);
        statusMsg.textContent = 'Print failed: ' + error.message;
        alert('Print failed: ' + error.message);
        printBarcodeBtn.disabled = false;
        printBarcodeBtn.style.opacity = '1';
        printBarcodeBtn.textContent = '🖨️ ' + tr('print_barcode', 'Print Barcode');
      }
    });
  </script>
  <script src="/static/i18n.js?v=20260203c"></script>
</body>
</html>
