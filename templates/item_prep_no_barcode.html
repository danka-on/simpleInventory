<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Item Prep - No Barcode</title>
  <style>
    * { margin:0; padding:0; box-sizing:border-box; }
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; padding:16px; background:#f5f5f5; }
    .container { max-width:800px; margin:0 auto; }
    h1 { margin-bottom:20px; color:#2c3e50; }
    .card { background:#fff; padding:20px; border-radius:12px; box-shadow:0 2px 8px rgba(0,0,0,0.1); margin-bottom:16px; }
    .btn { padding:10px 16px; border:none; border-radius:8px; font-size:14px; cursor:pointer; margin-right:8px; transition:all 0.2s; }
    .btn-primary { background:#00b894; color:#fff; }
    .btn-primary:hover { background:#00a383; }
    .btn-danger { background:#e74c3c; color:#fff; }
    .btn-danger:hover { background:#d63027; }
    .btn-gray { background:#95a5a6; color:#fff; }
    .btn-gray:hover { background:#7f8c8d; }
    .search-box { display:flex; gap:8px; align-items:stretch; }
    .search-box input[type="text"] { flex:1; padding:12px; border:1px solid #ddd; border-radius:8px; font-size:14px; margin-bottom:0; }
    .search-box button { padding:12px 20px; border:none; border-radius:8px; background:#00b894; color:#fff; cursor:pointer; font-size:18px; transition:all 0.2s; }
    .search-box button:hover { background:#00a383; }
    .search-results { margin-top:16px; }
    .result-item { background:#f8f9fa; padding:12px; margin-bottom:8px; border-radius:8px; cursor:pointer; transition:all 0.2s; border:2px solid transparent; }
    .result-item:hover { background:#e9ecef; border-color:#00b894; }
    .result-item.selected { background:#d1f2eb; border-color:#00b894; }
    .result-item img { width:60px; height:60px; object-fit:cover; border-radius:6px; margin-right:12px; vertical-align:middle; }
    .result-item-info { display:inline-block; vertical-align:middle; max-width:calc(100% - 80px); }
    .result-title { font-weight:600; color:#2c3e50; margin-bottom:4px; }
    .result-upc { color:#7f8c8d; font-size:13px; }
    .muted { color:#95a5a6; font-size:13px; margin-top:8px; }
    .hidden { display:none; }
    .selected-item-card { background:#e8f8f5; padding:16px; border-radius:8px; border:2px solid #00b894; margin-top:16px; }
    .selected-item-card img { max-width:200px; border-radius:8px; margin-top:8px; }
    .barcode-field { background:#fff; padding:12px; border:2px solid #00b894; border-radius:8px; font-family:monospace; font-size:16px; margin-top:12px; }
    .action-buttons { margin-top:16px; display:flex; gap:12px; }
    .pagination { margin-top:16px; display:flex; gap:8px; align-items:center; justify-content:center; }
    .pagination-btn { padding:8px 12px; background:#ecf0f1; border:1px solid #bdc3c7; border-radius:6px; cursor:pointer; }
    .pagination-btn:hover { background:#bdc3c7; }
    .pagination-btn:disabled { background:#f5f5f5; cursor:not-allowed; opacity:0.5; }
    .pagination-info { color:#7f8c8d; font-size:13px; }
  </style>
</head>
<body>
  <div class="container">
    <h1>🔍 Item Prep - No Barcode</h1>
    
    <div class="card">
      <a href="/item-prep"><button class="btn btn-danger">← Back to Prep</button></a>
      
      <div style="margin-top:20px; margin-bottom:20px">
        <div class="search-box">
          <input type="text" id="searchInput" placeholder="Search by item name..." autofocus>
          <button id="searchBtn">🔍</button>
        </div>
      </div>
      
      <div id="searchResults" class="search-results hidden">
        <div id="resultsContainer"></div>
        <div id="pagination" class="pagination hidden"></div>
      </div>
      
      <div id="selectedItemCard" class="selected-item-card hidden">
        <h3 style="margin-bottom:12px">Selected Item</h3>
        <div id="selectedItemInfo"></div>
        <div class="barcode-field" id="barcodeField"></div>
        
        <div class="action-buttons">
          <button class="btn btn-primary" id="printBarcodeBtn" style="flex:1">
            🖨️ Print Barcode (Coming Soon)
          </button>
          <button class="btn btn-primary" id="continueBtn" style="flex:1">
            ✓ Continue to Prep
          </button>
        </div>
      </div>
      
      <div style="margin-top:144px; text-align:center">
        <a href="/item-prep-create-item" style="text-decoration:none; display:block;">
          <button class="btn" style="background:#f39c12; color:#fff; padding:12px 24px; border-radius:8px; border:none; font-size:1rem; width:100%; display:block;">
            ➕ No Item Found - Create New
          </button>
        </a>
      </div>
      
      <div id="statusMsg" class="muted"></div>
    </div>
  </div>

  <script>
    let selectedItem = null;
    let currentPage = 1;
    let currentQuery = '';
    let totalPages = 1;
    
    const searchInput = document.getElementById('searchInput');
    const searchBtn = document.getElementById('searchBtn');
    const searchResults = document.getElementById('searchResults');
    const resultsContainer = document.getElementById('resultsContainer');
    const pagination = document.getElementById('pagination');
    const selectedItemCard = document.getElementById('selectedItemCard');
    const selectedItemInfo = document.getElementById('selectedItemInfo');
    const barcodeField = document.getElementById('barcodeField');
    const printBarcodeBtn = document.getElementById('printBarcodeBtn');
    const continueBtn = document.getElementById('continueBtn');
    const statusMsg = document.getElementById('statusMsg');
    
    function missingThumb(width=60, height=60) {
      return 'data:image/svg+xml;utf8,' + encodeURIComponent(
        '<svg xmlns="http://www.w3.org/2000/svg" width="' + width + '" height="' + height + '">' +
        '<rect width="100%" height="100%" fill="#f8f8f8"/>' +
        '<text x="50%" y="50%" dominant-baseline="middle" text-anchor="middle" fill="#b0b0b0" font-size="10">No Img</text>' +
        '</svg>'
      );
    }
    
    function esc(s) {
      return String(s || '').replace(/[&<>]/g, c => ({"&":"&amp;", "<":"&lt;", ">":"&gt;"}[c]));
    }
    
    async function searchItems(query, page = 1) {
      if (!query.trim()) {
        statusMsg.textContent = 'Please enter a search term';
        return;
      }
      
      currentQuery = query;
      currentPage = page;
      
      statusMsg.textContent = 'Searching...';
      resultsContainer.innerHTML = '';
      pagination.classList.add('hidden');
      searchResults.classList.remove('hidden');
      
      try {
        const response = await fetch('/api/search-rawbol', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ query: query, page: page })
        });
        
        const data = await response.json();
        
        if (data.success && data.results.length > 0) {
          totalPages = data.total_pages || 1;
          statusMsg.textContent = `Found ${data.total} items (showing page ${page} of ${totalPages})`;
          renderResults(data.results);
          renderPagination(data.page, data.total_pages, data.total);
        } else {
          statusMsg.textContent = 'No items found';
          resultsContainer.innerHTML = '<div class="muted" style="text-align:center;padding:20px">No items found. Try a different search term.</div>';
        }
      } catch (error) {
        console.error('Search error:', error);
        statusMsg.textContent = 'Search failed: ' + error.message;
      }
    }
    
    function renderPagination(page, totalPages, totalItems) {
      if (totalPages <= 1) {
        pagination.classList.add('hidden');
        return;
      }
      
      pagination.classList.remove('hidden');
      
      const prevDisabled = page <= 1;
      const nextDisabled = page >= totalPages;
      
      pagination.innerHTML = `
        <button class="pagination-btn" ${prevDisabled ? 'disabled' : ''} onclick="searchItems(currentQuery, ${page - 1})">
          ← Prev
        </button>
        <span class="pagination-info">Page ${page} of ${totalPages}</span>
        <button class="pagination-btn" ${nextDisabled ? 'disabled' : ''} onclick="searchItems(currentQuery, ${page + 1})">
          Next →
        </button>
      `;
    }
    
    function renderResults(results) {
      resultsContainer.innerHTML = results.map((item, index) => {
        const imgUrl = item.image_url || missingThumb();
        const title = esc(item.item_description || 'No description');
        const upc = esc(item.upc || 'No UPC');
        
        return `
          <div class="result-item" data-index="${index}">
            <img src="${imgUrl}" alt="item" onerror="this.src='${missingThumb()}'">
            <div class="result-item-info">
              <div class="result-title">${title}</div>
              <div class="result-upc">UPC: ${upc}</div>
            </div>
          </div>
        `;
      }).join('');
      
      // Add click handlers
      document.querySelectorAll('.result-item').forEach((elem, index) => {
        elem.addEventListener('click', () => selectItem(results[index], elem));
      });
    }
    
    function selectItem(item, elem) {
      // Remove previous selection
      document.querySelectorAll('.result-item').forEach(e => e.classList.remove('selected'));
      elem.classList.add('selected');
      
      selectedItem = item;
      
      // Show selected item card
      const imgUrl = item.image_url || missingThumb(200, 200);
      const title = esc(item.item_description || 'No description');
      const upc = esc(item.upc || 'No UPC');
      
      selectedItemInfo.innerHTML = `
        <div class="result-title">${title}</div>
        <div class="result-upc">UPC: ${upc}</div>
        <img src="${imgUrl}" alt="item" onerror="this.src='${missingThumb(200, 200)}'">
      `;
      
      barcodeField.textContent = `Barcode: ${upc}`;
      selectedItemCard.classList.remove('hidden');
      statusMsg.textContent = 'Item selected. Print barcode or continue to prep.';
      
      // Auto scroll to bottom of page
      setTimeout(() => {
        window.scrollTo({ top: document.body.scrollHeight, behavior: 'smooth' });
      }, 100);
    }
    
    // Search on Enter key
    searchInput.addEventListener('keypress', (e) => {
      if (e.key === 'Enter') {
        searchItems(searchInput.value);
      }
    });
    
    // Search button click
    searchBtn.addEventListener('click', () => {
      searchItems(searchInput.value);
    });
    
    // Print barcode button
    printBarcodeBtn.addEventListener('click', async () => {
      if (!selectedItem) return;
      
      try {
        statusMsg.textContent = 'Printing...';
        const response = await fetch('/api/printer/print-barcode', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            upc: selectedItem.upc,
            item_description: selectedItem.item_description,
            quantity: 1
          })
        });
        
        const data = await response.json();
        
        if (data.success) {
          statusMsg.textContent = 'Barcode printed successfully!';
          alert('Barcode printed successfully!');
        } else {
          statusMsg.textContent = 'Print failed: ' + data.error;
          alert('Print failed: ' + data.error + '\n\nMake sure the printer is configured in Printer Settings.');
        }
      } catch (error) {
        console.error('Print error:', error);
        statusMsg.textContent = 'Print failed: ' + error.message;
        alert('Print failed: ' + error.message);
      }
    });
    
    // Continue to prep button
    continueBtn.addEventListener('click', async () => {
      if (!selectedItem) return;
      
      // Store the UPC in session storage so the prep page can auto-fill it
      sessionStorage.setItem('prepUpc', selectedItem.upc);
      
      // Redirect to prep page
      window.location.href = '/item-prep';
    });
  </script>
</body>
</html>
