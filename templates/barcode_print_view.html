<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Print Barcodes</title>
  <style>
    @page { margin: 0.25in; }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { 
      font-family: Arial, sans-serif; 
      background: white; 
      margin: 0; 
      padding: 0; 
      display: flex; 
      flex-wrap: wrap; 
      gap: 0.1in; 
      justify-content: flex-start; 
      align-content: flex-start; 
    }
    .barcode-label { 
      width: 3in; 
      height: 1in; 
      display: flex; 
      flex-direction: column; 
      align-items: center; 
      justify-content: center; 
      page-break-inside: avoid; 
      break-inside: avoid; 
      padding: 0; 
      box-sizing: border-box; 
    }
    .barcode-title { 
      font-size: 12px; 
      font-weight: bold; 
      text-align: center; 
      margin-bottom: 2px; 
      color: #000; 
      max-width: 2.8in; 
      overflow: hidden; 
      text-overflow: ellipsis; 
      white-space: nowrap; 
    }
    .barcode-svg { 
      display: block; 
      margin: 0 auto; 
      width: 2.6in; 
      height: 0.5in; 
    }
    .print-controls {
      position: fixed;
      top: 10px;
      right: 10px;
      z-index: 1000;
      display: flex;
      gap: 10px;
    }
    .btn {
      padding: 10px 16px;
      border: none;
      border-radius: 8px;
      font-size: 14px;
      cursor: pointer;
      color: white;
    }
    .btn-primary { background: #00b894; }
    .btn-danger { background: #e74c3c; }
    @media print {
      .print-controls { display: none !important; }
      .barcode-label { border: none; page-break-inside: avoid; break-inside: avoid; }
      body { -webkit-print-color-adjust: exact; print-color-adjust: exact; }
      header, footer { display: none !important; }
    }
  </style>
  <script src="https://cdn.jsdelivr.net/npm/jsbarcode@3.11.5/dist/JsBarcode.all.min.js"></script>
</head>
<body>
  <div class="print-controls">
    <button class="btn btn-primary" onclick="window.print()">🖨️ Print</button>
    <button class="btn btn-danger" onclick="window.history.back()">✖ Cancel</button>
  </div>
  <div id="barcodeContainer"></div>
  
  <script>
    // Get queue from sessionStorage
    const queueData = sessionStorage.getItem('printQueue');
    if (!queueData) {
      alert('No print data found');
      window.history.back();
    } else {
      const que = JSON.parse(queueData);
      const container = document.getElementById('barcodeContainer');
      
      que.forEach((item, idx) => {
        const label = document.createElement('div');
        label.className = 'barcode-label';
        
        const title = document.createElement('div');
        title.className = 'barcode-title';
        title.textContent = item.title;
        
        const svg = document.createElementNS('http://www.w3.org/2000/svg', 'svg');
        svg.setAttribute('class', 'barcode-svg');
        svg.setAttribute('id', 'barcode' + idx);
        
        label.appendChild(title);
        label.appendChild(svg);
        container.appendChild(label);
        
        // Generate barcode
        JsBarcode('#barcode' + idx, item.barcode, {
          format: "CODE128",
          width: 2,
          height: 40,
          displayValue: true,
          fontSize: 12,
          margin: 0
        });
      });
      
      // Auto-print on mobile after slight delay to ensure rendering
      const isMobile = /Android|webOS|iPhone|iPad|iPod|BlackBerry|IEMobile|Opera Mini/i.test(navigator.userAgent);
      if (isMobile) {
        setTimeout(() => {
          window.print();
        }, 500);
      }
    }
  </script>
  <script src="/static/i18n.js"></script>
</body>
</html>
