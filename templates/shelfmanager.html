<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
    <link rel="icon" type="image/png" href="{{ url_for('static', filename='favicon.ico') }}">
    <title>Shelf Manager - Sweet Shelves</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <link rel="stylesheet" href="{{ url_for('static', filename='shelf-creator.css') }}?v=8">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
</head>
<body>
    <div class="container">

        <!-- Browse: locations, then the shelves in one location -->
        <div id="list-view" class="view active">
            <header class="sm-header">
                <button class="back-btn" id="back-btn" type="button">
                    <i class="fas fa-arrow-left"></i> <span id="back-btn-text">Tools</span>
                </button>
                <div class="sm-title">
                    <div class="sm-crumb" id="view-crumb">Shelf Manager</div>
                    <h1 id="view-title">Locations</h1>
                </div>
            </header>

            <div class="sm-toolbar">
                <div class="shelf-search-bar" role="search">
                    <i class="fas fa-search" aria-hidden="true"></i>
                    <input id="shelf-search-input" type="search"
                           placeholder="Find a shelf, e.g. or1s3"
                           autocomplete="off" autocapitalize="off" spellcheck="false"
                           aria-label="Search shelves and locations">
                    <button class="search-clear" id="clear-shelf-search-btn" type="button" style="display:none;" aria-label="Clear search">
                        <i class="fas fa-times-circle"></i>
                    </button>
                </div>
                <div class="sm-tools">
                    <div id="sort-controls" style="display:none;">
                        <select id="shelf-sort" aria-label="Sort shelves">
                            <option value="name" selected>By rack</option>
                            <option value="created">Newest first</option>
                            <option value="items">Most items first</option>
                        </select>
                        <button id="apply-sort-btn" type="button">Sort</button>
                    </div>
                    <button class="btn btn-select" id="select-mode-btn" type="button" style="display:none;">
                        <i class="fas fa-check-square"></i> Select
                    </button>
                    <button class="btn btn-primary" id="add-btn" type="button">
                        <i class="fas fa-plus"></i> <span id="add-btn-text">New location</span>
                    </button>
                </div>
            </div>
            <div id="shelf-search-summary" class="shelf-search-summary" aria-live="polite"></div>
            <div id="shelf-list" class="shelf-grid">
                <div class="loading"><i class="fas fa-spinner fa-spin"></i> Loading…</div>
            </div>
        </div>

        <!-- Add / edit one shelf -->
        <div id="add-view" class="view">
            <header class="sm-header">
                <button class="back-btn" id="cancel-btn" type="button">
                    <i class="fas fa-arrow-left"></i> Back
                </button>
                <div class="sm-title">
                    <div class="sm-crumb" id="form-crumb">Shelf Manager</div>
                    <h1 id="form-title">New shelf</h1>
                </div>
            </header>

            <div class="form-card">
                <div class="form-step">
                    <div class="step-title"><span class="step-num">1</span> Shelf code</div>
                    <div class="form-group">
                        <input type="text" id="shelf-code" placeholder="e.g. or1s3" autocomplete="off" autocapitalize="off" spellcheck="false" aria-label="Shelf code">
                        <div id="code-validation" class="validation-message"></div>
                    </div>
                </div>

                <div class="form-step">
                    <div class="step-title"><span class="step-num">2</span> <span id="photo-step-title">Photo of the shelf</span></div>

                    <div class="photo-choices" id="photo-choices">
                        <button class="btn btn-primary" id="start-camera-btn" type="button">
                            <i class="fas fa-camera"></i> Take photo
                        </button>
                        <button class="btn btn-soft" id="gallery-btn" type="button">
                            <i class="fas fa-images"></i> Choose photo
                        </button>
                    </div>

                    <div id="camera-section" style="display: none;">
                        <div id="camera-container">
                            <video id="camera-video" autoplay playsinline></video>
                            <canvas id="camera-preview"></canvas>
                            <button class="capture-btn" id="capture-btn" type="button" style="display: none;" aria-label="Take the picture">
                                <i class="fas fa-camera"></i>
                            </button>
                        </div>
                        <div class="btn-group" id="camera-controls" style="display: none;">
                            <button class="btn btn-secondary" id="retake-btn" type="button">
                                <i class="fas fa-redo"></i> Retake
                            </button>
                            <button class="btn btn-primary" id="continue-btn" type="button">
                                <i class="fas fa-check"></i> Use this photo
                            </button>
                        </div>
                    </div>

                    <div id="upload-section" style="display: none;">
                        <div class="upload-area" id="upload-area">
                            <input type="file" id="file-input" accept="image/*" style="display: none;">
                        </div>
                    </div>

                    <div id="editor-container">
                        <canvas id="editor-canvas"></canvas>
                        <div class="editor-hint">
                            <i class="fas fa-hand-pointer"></i> Drag to draw a box around the shelf
                        </div>
                        <div class="editor-controls">
                            <button class="btn btn-secondary" id="redraw-rect-btn" type="button">
                                <i class="fas fa-sync-alt"></i> Redraw box
                            </button>
                            <button class="btn btn-secondary" id="replace-image-btn" type="button" style="display: none;">
                                <i class="fas fa-camera-retro"></i> Different photo
                            </button>
                        </div>
                    </div>

                    <label class="original-only" id="original-only-group">
                        <input type="checkbox" id="original-only">
                        <span>Only save the clean photo
                            <small>No box is drawn. Keeps the shelf's current picture if it already has one.</small>
                        </span>
                    </label>
                </div>

                <div class="btn-group">
                    <button class="btn btn-success" id="save-btn" type="button" disabled>
                        <i class="fas fa-save"></i> Save shelf
                    </button>
                </div>
            </div>
        </div>
    </div>

    <!-- While selecting shelves -->
    <div class="select-bar" id="select-bar" role="toolbar" aria-label="Selected shelves">
        <span class="sel-count" id="sel-count-text">Tap shelves to select them</span>
        <button class="btn btn-secondary" id="select-all-btn" type="button" style="display: none;">
            <i class="fas fa-check-double"></i> All
        </button>
        <button class="btn btn-secondary" id="print-qr-btn" type="button" style="display: none;">
            <i class="fas fa-qrcode"></i> <span>Print QR (<span id="selected-count">0</span>)</span>
        </button>
        <button class="btn btn-info" id="move-group-btn" type="button" style="display: none;">
            <i class="fas fa-folder-open"></i> Move
        </button>
        <button class="btn btn-danger" id="delete-selected-btn" type="button" style="display: none;">
            <i class="fas fa-trash"></i> <span>Delete (<span id="delete-count">0</span>)</span>
        </button>
        <button class="btn btn-secondary" id="select-done-btn" type="button">Done</button>
    </div>

    <!-- One shelf -->
    <div id="image-modal" class="modal">
        <div class="modal-content" role="dialog" aria-modal="true" aria-labelledby="modal-title">
            <div class="sheet-head">
                <div>
                    <h3 id="modal-title">Shelf</h3>
                    <div class="sheet-sub" id="modal-sub"></div>
                </div>
                <button class="modal-close" id="modal-close-btn" type="button" aria-label="Close">
                    <i class="fas fa-times"></i>
                </button>
            </div>
            <img id="modal-image" src="" alt="Shelf">
            <div class="modal-actions">
                <button class="btn btn-primary" id="view-items-btn" type="button">
                    <i class="fas fa-list"></i> <span id="view-items-text">See items</span>
                </button>
                <button class="btn btn-soft" id="edit-shelf-btn" type="button">
                    <i class="fas fa-pen"></i> Edit
                </button>
                <div class="sheet-more">
                    <button class="btn btn-secondary" id="duplicate-shelf-btn" type="button">
                        <i class="fas fa-copy"></i> Duplicate
                    </button>
                    <button class="btn btn-warning" id="clear-inventory-btn" type="button" title="Take this shelf off every item on it">
                        <i class="fas fa-broom"></i> Empty shelf
                    </button>
                    <button class="btn btn-danger" id="delete-shelf-btn" type="button">
                        <i class="fas fa-trash"></i> Delete
                    </button>
                </div>
            </div>
        </div>
    </div>

    <!-- New location -->
    <div id="create-group-modal" class="modal">
        <div class="modal-content">
            <h3>New location</h3>
            <div class="form-group">
                <input type="text" id="new-group-name" placeholder="e.g. Garage, Office" aria-label="Location name">
            </div>
            <div class="modal-actions">
                <button class="btn btn-secondary" id="cancel-group-btn" type="button">Cancel</button>
                <button class="btn btn-primary" id="save-group-btn" type="button">Create</button>
            </div>
        </div>
    </div>

    <!-- Move shelves -->
    <div id="move-group-modal" class="modal">
        <div class="modal-content">
            <h3>Move <span id="move-count">0</span> shelves to…</h3>
            <div class="form-group">
                <select id="move-group-select" aria-label="Destination location"></select>
            </div>
            <div class="modal-actions">
                <button class="btn btn-secondary" id="cancel-move-btn" type="button">Cancel</button>
                <button class="btn btn-primary" id="confirm-move-btn" type="button">Move</button>
            </div>
        </div>
    </div>

    <script src="{{ url_for('static', filename='shelf-creator.js') }}?v=19"></script>
    <script src="/static/i18n.js"></script>
</body>
</html>
