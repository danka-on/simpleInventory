<!DOCTYPE html>
<html lang="en">
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
    <link rel="icon" type="image/png" href="{{ url_for('static', filename='favicon.ico') }}">
    <title>Shelf Manager - Sweet Shelves</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <link rel="stylesheet" href="{{ url_for('static', filename='shelf-creator.css') }}?v=6">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
</head>
<body>
    <div class="container">
        <h1><i class="fas fa-box"></i> Shelf Manager</h1>
        
        <!-- List View -->
        <div id="list-view" class="view active">
            <div class="action-bar">
                <div class="action-left">
                    <a href="/tools" class="back-btn btn btn-exit" id="exit-btn">
                        <i class="fas fa-arrow-left"></i> Exit
                    </a>
                    <button class="btn btn-primary" id="print-qr-btn" style="display: none;">
                        <i class="fas fa-qrcode"></i> Print QR Codes (<span id="selected-count">0</span>)
                    </button>
                </div>
                <div style="flex:1; text-align:center; display:flex; align-items:center; justify-content:center; gap:8px;">
                    <label for="shelf-sort" style="font-size:0.9rem;margin-right:8px;color:#444;">Sort:</label>
                    <select id="shelf-sort" style="padding:6px;border-radius:6px;border:1px solid #ddd;">
                        <option value="name">Name (A-Z)</option>
                        <option value="items">Items (desc)</option>
                        <option value="created">Created (newest)</option>
                    </select>
                    <button id="apply-sort-btn" class="btn btn-primary" style="padding:6px 10px;">Apply</button>
                </div>
                <div class="action-right">
                    <button class="btn btn-select" id="select-mode-btn">
                        <i class="fas fa-check-square"></i> Select
                    </button>
                </div>
            </div>
            <div id="shelf-list" class="shelf-grid">
                <div class="loading">
                    <i class="fas fa-spinner fa-spin"></i> Loading shelves...
                </div>
            </div>
            <button class="add-shelf-btn" id="add-btn">
                <i class="fas fa-plus"></i>
            </button>
        </div>
        
        <!-- Add/Edit View -->
        <div id="add-view" class="view">
            <div class="form-card">
                <h2 id="form-title">Add New Shelf</h2>
                
                <div class="form-group">
                    <label for="shelf-code">Shelf Code</label>
                    <input type="text" id="shelf-code" placeholder="e.g., gr1s1, or2s3" autocomplete="off">
                    <div id="code-validation" class="validation-message"></div>
                </div>
                
                <!-- Camera Section (Mobile) -->
                <div id="camera-section" style="display: none;">
                    <div id="camera-container">
                        <video id="camera-video" autoplay playsinline></video>
                        <canvas id="camera-preview"></canvas>
                        <button class="capture-btn" id="capture-btn" style="display: none;">
                            <i class="fas fa-camera"></i>
                        </button>
                    </div>
                    <div class="btn-group" id="camera-controls" style="display: none;">
                        <button class="btn btn-secondary" id="retake-btn">
                            <i class="fas fa-redo"></i> Retake
                        </button>
                        <button class="btn btn-success" id="continue-btn">
                            <i class="fas fa-arrow-right"></i> Continue
                        </button>
                    </div>
                </div>
                
                <!-- Upload Section (Desktop) -->
                <div id="upload-section" style="display: none;">
                    <div class="upload-area" id="upload-area">
                        <i class="fas fa-cloud-upload-alt" style="font-size: 3rem; color: var(--primary); margin-bottom: 10px;"></i>
                        <p>Click to upload PNG image</p>
                        <input type="file" id="file-input" accept=".png,image/png" style="display: none;">
                    </div>
                </div>
                
                <!-- Rectangle Editor -->
                <div id="editor-container">
                    <canvas id="editor-canvas"></canvas>
                    <div class="editor-hint">
                        <i class="fas fa-hand-pointer"></i> Drag to draw a rectangle around the shelf area
                    </div>
                </div>
                
                <div class="btn-group">
                    <button class="btn btn-secondary" id="cancel-btn">
                        <i class="fas fa-times"></i> Cancel
                    </button>
                    <button class="btn btn-primary" id="start-camera-btn" style="display: none;">
                        <i class="fas fa-camera"></i> Take Photo
                    </button>
                    <button class="btn btn-success" id="save-btn" disabled>
                        <i class="fas fa-save"></i> Save Shelf
                    </button>
                </div>
            </div>
        </div>
    </div>
    
    <!-- Modal for Enlarged Image -->
    <div id="image-modal" class="modal">
        <div class="modal-content">
            <button class="modal-close" id="modal-close-btn">
                <i class="fas fa-times"></i> Close
            </button>
            <img id="modal-image" src="" alt="Shelf">
            <div class="modal-actions">
                <button class="btn btn-info" id="view-items-btn">
                    <i class="fas fa-list"></i> View Items
                </button>
                <button class="btn btn-primary" id="edit-shelf-btn">
                    <i class="fas fa-edit"></i> Edit
                </button>
                <button class="btn btn-danger" id="delete-shelf-btn">
                    <i class="fas fa-trash"></i> Delete
                </button>
                <button class="btn btn-warning" id="clear-inventory-btn" title="Clear all items linked to this shelf">
                    <i class="fas fa-broom"></i> Clear All Inventory
                </button>
            </div>
        </div>
    </div>
    
    <script src="{{ url_for('static', filename='shelf-creator.js') }}?v=6"></script>
</body>
</html>
