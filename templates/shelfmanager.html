<!DOCTYPE html>
<html lang="en">
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
    <link rel="icon" type="image/png" href="{{ url_for('static', filename='favicon.ico') }}">
    <title>Shelf Manager - Sweet Shelves</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <link rel="stylesheet" href="{{ url_for('static', filename='shelf-creator.css') }}?v=6">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
</head>
<body>
    <div class="container">
        <h1><i class="fas fa-box"></i> <span data-i18n="shelf_manager">Shelf Manager</span></h1>
        
        <!-- List View -->
        <div id="list-view" class="view active">
            <div class="action-bar">
                <div class="action-left">
                    <button class="back-btn btn btn-exit" id="back-btn">
                        <i class="fas fa-arrow-left"></i> <span id="back-btn-text" data-i18n="exit">Exit</span>
                    </button>
                    <button class="btn btn-primary" id="print-qr-btn" style="display: none;">
                        <i class="fas fa-qrcode"></i> Print QR (<span id="selected-count">0</span>)
                    </button>
                    <button class="btn btn-info" id="move-group-btn" style="display: none;">
                        <i class="fas fa-folder-open"></i> Move
                    </button>
                    <button class="btn btn-secondary" id="select-all-btn" style="display: none;">
                        <i class="fas fa-check-double"></i> Select All
                    </button>
                    <button class="btn btn-danger" id="delete-selected-btn" style="display: none;">
                        <i class="fas fa-trash"></i> Delete (<span id="delete-count">0</span>)
                    </button>
                </div>
                <div style="flex:1; text-align:center; display:flex; align-items:center; justify-content:center; gap:8px;">
                    <h2 id="view-title" style="margin:0; font-size:1.2rem; color:#333;" data-i18n="groups">Groups</h2>
                </div>
                <div class="action-right">
                    <div id="sort-controls" style="display:none; align-items:center; gap:5px;">
                        <select id="shelf-sort" style="padding:6px;border-radius:6px;border:1px solid #ddd;">
                            <option value="created" selected>Created (newest)</option>
                            <option value="name">Name (A-Z)</option>
                            <option value="items">Items (desc)</option>
                        </select>
                        <button id="apply-sort-btn" class="btn btn-primary" style="padding:6px 10px;">Sort</button>
                    </div>
                    <button class="btn btn-select" id="select-mode-btn" style="display:none;">
                        <i class="fas fa-check-square"></i> Select
                    </button>
                    <button class="btn btn-success" id="add-btn">
                        <i class="fas fa-plus"></i> Add
                    </button>
                </div>
            </div>
            <div id="shelf-list" class="shelf-grid">
                <div class="loading">
                    <i class="fas fa-spinner fa-spin"></i> Loading...
                </div>
            </div>
        </div>
        
        <!-- Add/Edit View -->
        <div id="add-view" class="view">
            <div class="form-card">
                <h2 id="form-title" data-i18n="add_new_shelf">Add New Shelf</h2>
                
                <div class="form-group">
                    <label for="shelf-code" data-i18n="shelf_code">Shelf Code</label>
                    <input type="text" id="shelf-code" placeholder="e.g., gr1s1, or2s3" autocomplete="off">
                    <div id="code-validation" class="validation-message"></div>
                </div>
                
                <!-- Camera Section (Mobile) -->
                <div id="camera-section" style="display: none;">
                    <div id="camera-container">
                        <video id="camera-video" autoplay playsinline></video>
                        <canvas id="camera-preview"></canvas>
                        <button class="capture-btn" id="capture-btn" style="display: none;">
                            <i class="fas fa-camera"></i>
                        </button>
                    </div>
                    <div class="btn-group" id="camera-controls" style="display: none;">
                        <button class="btn btn-secondary" id="retake-btn">
                            <i class="fas fa-redo"></i> Retake
                        </button>
                        <button class="btn btn-success" id="continue-btn">
                            <i class="fas fa-arrow-right"></i> Continue
                        </button>
                    </div>
                </div>
                
                <!-- Upload Section (Desktop) -->
                <div id="upload-section" style="display: none;">
                    <div class="upload-area" id="upload-area">
                        <i class="fas fa-cloud-upload-alt" style="font-size: 3rem; color: var(--primary); margin-bottom: 10px;"></i>
                        <p>Click to upload PNG image</p>
                        <input type="file" id="file-input" accept=".png,image/png" style="display: none;">
                    </div>
                </div>
                
                <!-- Rectangle Editor -->
                <div id="editor-container">
                    <canvas id="editor-canvas"></canvas>
                    <div class="editor-controls" style="margin-top: 10px; text-align: center;">
                        <button class="btn btn-secondary" id="redraw-rect-btn" type="button">
                            <i class="fas fa-sync-alt"></i> Redraw Box
                        </button>
                    </div>
                    <div class="editor-hint">
                        <i class="fas fa-hand-pointer"></i> Drag to draw a rectangle around the shelf area
                    </div>
                </div>
                
                <div class="btn-group">
                    <button class="btn btn-secondary" id="cancel-btn">
                        <i class="fas fa-times"></i> Cancel
                    </button>
                    <button class="btn btn-warning" id="replace-image-btn" style="display: none;">
                        <i class="fas fa-camera-retro"></i> Replace Image
                    </button>
                    <button class="btn btn-primary" id="start-camera-btn" style="display: none;">
                        <i class="fas fa-camera"></i> Take Photo
                    </button>
                    <button class="btn btn-success" id="save-btn" disabled>
                        <i class="fas fa-save"></i> Save Shelf
                    </button>
                </div>
            </div>
        </div>
    </div>
    
    <!-- Modal for Enlarged Image -->
    <div id="image-modal" class="modal">
        <div class="modal-content">
            <button class="modal-close" id="modal-close-btn">
                <i class="fas fa-times"></i> Close
            </button>
            <img id="modal-image" src="" alt="Shelf">
            <div class="modal-actions">
                <button class="btn btn-info" id="view-items-btn">
                    <i class="fas fa-list"></i> View Items
                </button>
                <button class="btn btn-primary" id="edit-shelf-btn">
                    <i class="fas fa-edit"></i> Edit
                </button>
                <button class="btn btn-secondary" id="duplicate-shelf-btn">
                    <i class="fas fa-copy"></i> Duplicate
                </button>
                <button class="btn btn-danger" id="delete-shelf-btn">
                    <i class="fas fa-trash"></i> Delete
                </button>
                <button class="btn btn-warning" id="clear-inventory-btn" title="Clear all items linked to this shelf">
                    <i class="fas fa-broom"></i> Clear All Inventory
                </button>
            </div>
        </div>
    </div>
    
    <!-- Modal for Creating Group -->
    <div id="create-group-modal" class="modal">
        <div class="modal-content" style="max-width: 400px;">
            <h3 data-i18n="create_new_group">Create New Group</h3>
            <div class="form-group">
                <label for="new-group-name" data-i18n="group_name">Group Name</label>
                <input type="text" id="new-group-name" placeholder="e.g., Aisle 1, Warehouse B">
            </div>
            <div class="modal-actions">
                <button class="btn btn-secondary" id="cancel-group-btn">Cancel</button>
                <button class="btn btn-success" id="save-group-btn">Create</button>
            </div>
        </div>
    </div>

    <!-- Modal for Moving Shelves -->
    <div id="move-group-modal" class="modal">
        <div class="modal-content" style="max-width: 400px;">
            <h3 data-i18n="move_to_group">Move to Group</h3>
            <p>Select a destination group for <span id="move-count">0</span> shelves:</p>
            <div class="form-group">
                <select id="move-group-select" style="width:100%; padding:10px; font-size:1.1rem;">
                    <!-- Options populated by JS -->
                </select>
            </div>
            <div class="modal-actions">
                <button class="btn btn-secondary" id="cancel-move-btn">Cancel</button>
                <button class="btn btn-primary" id="confirm-move-btn">Move</button>
            </div>
        </div>
    </div>
    
    <script src="{{ url_for('static', filename='shelf-creator.js') }}?v=8"></script>
    <script src="/static/i18n.js"></script>
</body>
</html>
