<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Diagnostic</title>
  <style>
    body{font-family:Segoe UI,Arial,sans-serif;background:#f7fafc;margin:0;padding:18px}
    .top{display:flex;align-items:center;gap:10px;justify-content:space-between}
    .btn{padding:10px 16px;border-radius:8px;border:none;cursor:pointer}
    .btn-primary{background:#00b894;color:#fff}
    .btn-danger{background:#e74c3c;color:#fff}
  .card{background:#fff;border:1px solid #e8e8e8;border-radius:12px;padding:16px;margin-top:14px}
  .row{display:flex;gap:10px;flex-wrap:wrap}
  /* Camera overlay controls */
  .cam-wrap{position:relative;display:block;width:100%;max-width:420px}
  .cam-wrap{margin:0 auto}
  .cam-row{display:flex;gap:8px;align-items:flex-start;justify-content:center}
  .cam-reset-outside{background:#f39c12;color:#fff;border:none;padding:8px;border-radius:8px;cursor:pointer;font-size:0.95rem;height:36px}
  .cam-overlay-btn{position:absolute;bottom:18px;left:50%;transform:translateX(-50%);display:flex;gap:12px;align-items:center;justify-content:center;z-index:5}
  .cam-btn{background:rgba(255,255,255,0.18);backdrop-filter:blur(4px);border:1px solid rgba(255,255,255,0.24);color:#fff;padding:18px 22px;border-radius:999px;cursor:pointer;font-size:1.2rem;box-shadow:0 8px 20px rgba(0,0,0,0.22)}
  .cam-btn.large{padding:22px 28px;font-size:1.4rem}
  /* Capture and reset on the right/left of feed as well (optional) */
  .cam-side-btn{position:absolute;top:10px;right:10px;background:rgba(0,0,0,0.36);color:#fff;border:none;padding:8px;border-radius:8px;z-index:6;font-size:1rem}
  .cam-full-btn{position:absolute;top:10px;left:10px;background:rgba(0,0,0,0.36);color:#fff;border:none;padding:8px;border-radius:8px;z-index:6;font-size:1rem}
  /* Complete button styling: full width, light green */
  .complete-wrap{margin-top:12px}
  .btn-complete{display:block;width:100%;padding:16px 18px;border-radius:10px;border:none;background:#00c853;color:#fff;font-weight:800;font-size:1.05rem;box-shadow:0 8px 18px rgba(0,200,83,0.18);cursor:pointer}
  .btn-complete:active{transform:translateY(1px)}
  .preview{display:flex;gap:10px;flex-wrap:wrap;margin-top:10px}
  .thumb-wrap{position:relative;width:110px;height:110px}
  .thumb-wrap .rotate-btn{position:absolute;right:6px;bottom:6px;background:rgba(0,0,0,0.36);color:#fff;border:none;padding:6px;border-radius:6px;z-index:6;font-size:0.9rem;cursor:pointer}
  .thumb-wrap img{transition: transform 0.25s ease}
    .thumb{width:100%;height:100%;object-fit:cover;border-radius:8px;background:#f0f0f0}
  .del-x{position:absolute;top:-10px;right:-10px;background:#e74c3c;color:#fff;border:none;border-radius:50%;width:36px;height:36px;cursor:pointer;line-height:36px;text-align:center;font-weight:bold;box-shadow:0 3px 8px rgba(0,0,0,0.25);font-size:18px}
  .badge-quality{position:absolute;left:6px;bottom:6px;background:rgba(0,0,0,0.7);color:#fff;border-radius:10px;padding:2px 6px;font-size:0.75rem;cursor:pointer}
  /* Status pill colors */
  .pill{display:inline-block;padding:6px 10px;border-radius:999px;color:#fff;font-weight:600;font-size:0.95rem}
  .pill.good{background:#2ecc71}
  .pill.bad{background:#e74c3c}
  .pill.unchecked{background:#9aa0a6}
    label{display:block;margin-top:8px}
    /* Prominent reason selection */
  .reason-group{display:flex;gap:10px;flex-wrap:wrap;margin:8px 0}
  .reason-btn{padding:14px 18px;border-radius:999px;border:2px solid #ddd;background:#f9f9f9;cursor:pointer;font-size:1.05rem}
  .reason-btn.active{background:#00b894;color:#fff;border-color:#00b894}
    textarea[name=note]{font-size:1rem}
    /* Existing photos grid */
    .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:10px}
    .existing-thumb{width:100%;aspect-ratio:1/1;object-fit:cover;border-radius:10px;background:#f0f0f0;cursor:pointer}
    /* Modal */
    .modal{display:none;position:fixed;inset:0;background:rgba(0,0,0,0.8);z-index:9999;align-items:center;justify-content:center}
    .modal img{max-width:90vw;max-height:88vh;border-radius:8px}
    /* Upload overlay */
    #uploadOverlay{display:none;position:fixed;inset:0;background:rgba(255,255,255,0.85);z-index:9998;align-items:center;justify-content:center}
    .spinner{width:56px;height:56px;border:6px solid #eee;border-top-color:#00b894;border-radius:50%;animation:spin 1s linear infinite}
    @keyframes spin{to{transform:rotate(360deg)}}
  </style>
</head>
<body>
  <div class="top">
    <a id="back-link" href="/"><button class="btn btn-danger">Back</button></a>
    <h2>Diagnostic</h2>
    <div style="display:flex;gap:8px">
      <button type="button" class="btn" id="resetBtn" style="background:#f39c12;color:#fff">Reset</button>
    </div>
  </div>

  <div class="card">
    <div class="row">
      <div>UPC:</div>
      <div id="upcText">{{ upc }}</div>
    </div>
    <!-- Status pill shown prominently at top -->
    <div style="margin-top:8px;margin-bottom:6px">
      <span style="font-weight:600;margin-right:8px">Status:</span>
      <span id="statusPill" class="pill unchecked">Unchecked</span>
    </div>
    <form id="diagForm" enctype="multipart/form-data">
      <input type="hidden" name="upc" value="{{ upc }}">
      <!-- Move the status select up so it is near the pill visually -->
      <label style="margin-top:6px;margin-bottom:6px;display:block">Status:
        <select id="diag-status" name="status">
          <option value="unchecked">Unchecked</option>
          <option value="good">Good</option>
          <option value="bad">Bad</option>
        </select>
      </label>

      <label style="font-weight:600;font-size:1.05rem">Defect:</label>
      <div class="reason-group" role="group" aria-label="Select defect">
        <button type="button" class="reason-btn" data-val="Missing pieces">Missing pieces</button>
        <button type="button" class="reason-btn" data-val="Wrong item">Wrong item</button>
        <button type="button" class="reason-btn" data-val="Broken">Broken</button>
        <button type="button" class="reason-btn" data-val="Return">Return</button>
        <button type="button" class="reason-btn" data-val="Replacement">Replacement</button>
        <button type="button" class="reason-btn" data-val="Other">Other</button>
      </div>
      <input type="hidden" name="reason" id="reasonSelect" required>
      
      <label>Note:
        <textarea name="note" rows="3" style="width:100%;box-sizing:border-box"></textarea>
      </label>
      <label>Photos:
        <input type="file" id="photos" accept="image/*" capture="environment" multiple>
      </label>
      <div style="margin-top:8px">
        <div class="small-muted" style="display:flex;align-items:center;gap:10px;justify-content:space-between;flex-wrap:wrap">
          <span>Or use camera</span>
          <div style="display:flex;align-items:center;gap:8px">
            <span>Quality:</span>
            <div id="qualityGroup" style="display:flex;gap:6px">
              <button type="button" class="btn" data-q="low" style="padding:6px 10px">Low</button>
              <button type="button" class="btn" data-q="med" style="padding:6px 10px;background:#00b894;color:#fff">Med</button>
              <button type="button" class="btn" data-q="high" style="padding:6px 10px">High</button>
            </div>
          </div>
        </div>
          <div id="preview" class="preview"></div>
        <div class="cam-row">
          <div class="cam-wrap">
            <video id="cam" playsinline muted style="width:100%;aspect-ratio:1/1;background:#222;border-radius:8px;display:block"></video>
            <canvas id="canvas" style="display:none"></canvas>
            <!-- Overlayed controls centered bottom -->
            <div class="cam-overlay-btn">
              <button type="button" class="cam-btn large" id="captureBtn">Capture</button>
            </div>
          </div>
          <!-- reset button relocated under Complete (hidden/off-screen) -->
        </div>
      </div>
      <div class="complete-wrap">
          <button type="button" class="btn-complete" id="completeBtn">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg" style="vertical-align:middle;margin-right:8px">
            <rect x="1" y="1" width="22" height="22" rx="4" fill="#00c853"/>
            <path d="M7 12.5L10 15.5L17 8.5" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
          Complete
        </button>
          <!-- Hidden reset button placed below the Complete button to keep camera centered; visually off-screen but reachable via script or CSS if needed -->
          <button type="button" id="resetCamHiddenBtn" style="position:relative;left:-9999px;visibility:hidden;" aria-hidden="true">Reset Cam Hidden</button>
      </div>
    </form>
    <div id="msg" style="margin-top:10px"></div>
  </div>

  <div class="card" id="existingCard" style="display:none">
    <h3 style="margin:0 0 8px 0">Existing Diagnostic</h3>
    <div id="existingMeta" class="muted"></div>
    <div id="existingGrid" class="grid" style="margin-top:10px"></div>
  </div>

  <div id="imgModal" class="modal"><img id="modalImg" src="" alt=""></div>
  <div id="uploadOverlay"><div class="spinner" title="Uploading..."></div></div>

  <script>
  const photos = document.getElementById('photos');
    const preview = document.getElementById('preview');
    const qualityGroup = document.getElementById('qualityGroup');
  const reasonSelect = document.getElementById('reasonSelect');
  const reasonBtns = Array.from(document.querySelectorAll('.reason-btn'));
    let currentQuality = 'med'; // 'low' | 'med' | 'high'
    function uid(){ return 'id_'+Math.random().toString(36).slice(2); }
    const pendingFiles = []; // {id, file, quality}
    const capturedFiles = []; // {id, file, quality}

    function makeThumb(entry, source){
      const url = URL.createObjectURL(entry.file);
      const wrap = document.createElement('div');
      wrap.className='thumb-wrap';
      const img = document.createElement('img'); img.className='thumb'; img.src=url; img.alt='photo';
      const del = document.createElement('button'); del.type='button'; del.className='del-x'; del.textContent='×';
      del.dataset.id = entry.id; del.dataset.source = source;
      const badge = document.createElement('span'); badge.className='badge-quality'; badge.dataset.badge = entry.id; badge.textContent = ((entry.quality||'').toUpperCase()||'');
      badge.title = 'Click to change quality';
      del.addEventListener('click', ()=>{
        // remove from arrays
        const src = del.dataset.source; const id = del.dataset.id;
        if(src==='pending'){
          const idx = pendingFiles.findIndex(x=>x.id===id); if(idx>-1) pendingFiles.splice(idx,1);
        } else {
          const idx = capturedFiles.findIndex(x=>x.id===id); if(idx>-1) capturedFiles.splice(idx,1);
        }
        URL.revokeObjectURL(url);
        wrap.remove();
      });
      badge.addEventListener('click', async ()=>{
        const seq = ['low','med','high'];
        const next = seq[(seq.indexOf(entry.quality||'med')+1)%seq.length];
        await reencodeEntry(entry, next);
        badge.textContent = next.toUpperCase();
      });
  const rotBtn = document.createElement('button'); rotBtn.type='button'; rotBtn.className='rotate-btn'; rotBtn.title='Rotate'; rotBtn.textContent='⟲';
  rotBtn.addEventListener('click', (e)=>{ e.stopPropagation(); toggleRotate(img); });
  // initialize rotation dataset for this thumb
  img.dataset.rot = img.dataset.rot || '0';
  wrap.appendChild(img); wrap.appendChild(del); wrap.appendChild(badge); wrap.appendChild(rotBtn);
      // insert at the start so newest appear above
      if(preview.firstChild) preview.insertBefore(wrap, preview.firstChild); else preview.appendChild(wrap);
      // Smooth scroll the Complete button into view so the user can press it easily
      try{
        const completeBtn = document.getElementById('completeBtn');
        if(completeBtn){ completeBtn.scrollIntoView({ behavior: 'smooth', block: 'center' }); }
      }catch(e){}
    }

      // Toggle rotation for a given image element (90deg left / back)
      function toggleRotate(img){
        const current = img.dataset.rot ? parseInt(img.dataset.rot) : 0;
        const next = (current - 90) % 360; // rotate left
        img.dataset.rot = next;
        img.style.transform = `rotate(${next}deg)`;
      }

      // Fullscreen button removed per UI request - no-op

    photos.addEventListener('change', ()=>{
      const files = Array.from(photos.files||[]);
      files.forEach(f=>{ const entry = {id: uid(), file: f, quality: 'med'}; pendingFiles.push(entry); makeThumb(entry,'pending'); annotateQualityFromImage(entry); });
      // clear the input so we control the file list ourselves
      photos.value = '';
    });

    function annotateQualityFromImage(entry){
      try{
        const img = new Image();
        const url = URL.createObjectURL(entry.file);
        img.onload = ()=>{
          const w = img.naturalWidth, h = img.naturalHeight;
          URL.revokeObjectURL(url);
          const maxSide = Math.max(w,h);
          let q = 'high';
          if(maxSide <= 900) q = 'low'; else if(maxSide <= 2200) q = 'med';
          entry.quality = q;
          const badge = document.querySelector(`[data-badge="${entry.id}"]`);
          if(badge) badge.textContent = q.toUpperCase();
        };
        img.src = url;
      }catch{}
    }

    // Camera capture that stacks multiple images without leaving the page
    let stream=null;
    let imageCapture=null;
    const video = document.getElementById('cam');
    const canvas = document.getElementById('canvas');
    async function startCam(){
      try{
        const constraints = {
          video:{
            facingMode:{ideal:'environment'},
            width: { ideal: currentQuality==='low' ? 640 : (currentQuality==='med' ? 1920 : 3840) },
            height: { ideal: currentQuality==='low' ? 480 : (currentQuality==='med' ? 1080 : 2160) }
          }
        };
        stream = await navigator.mediaDevices.getUserMedia(constraints);
        video.srcObject = stream; await video.play();
        const track = stream.getVideoTracks && stream.getVideoTracks()[0];
        imageCapture = null;
        if(track && 'ImageCapture' in window){
          try { imageCapture = new ImageCapture(track); } catch(_) { imageCapture = null; }
        }
      }catch(e){ /* camera optional */ }
    }
    function stopCam(){ try{ stream && stream.getTracks().forEach(t=>t.stop()); }catch{}; stream=null; }
    function dataURLtoFile(dataurl, filename) {
      const arr = dataurl.split(','); const mime = arr[0].match(/:(.*?);/)[1];
      const bstr = atob(arr[1]); let n = bstr.length; const u8arr = new Uint8Array(n);
      while(n--) u8arr[n] = bstr.charCodeAt(n);
      return new File([u8arr], filename, {type:mime});
    }

    document.getElementById('captureBtn').onclick = async ()=>{
      if(!video || video.readyState < 2) return;
      // Prefer full-quality ImageCapture if available
      if(imageCapture && imageCapture.takePhoto){
        try{
          let blob = await imageCapture.takePhoto();
          // Downscale as needed
          if(currentQuality !== 'high'){
            blob = await downscaleBlob(blob, currentQuality);
          }
          const file = new File([blob], `capture_${Date.now()}.jpg`, { type: blob.type || 'image/jpeg' });
          const entry = {id: uid(), file, quality: currentQuality};
          capturedFiles.push(entry);
          makeThumb(entry,'captured');
          return;
        }catch(e){ /* fall back */ }
      }
      // Fallback to canvas at chosen resolution/quality
      let w = video.videoWidth || (currentQuality==='low'?640:(currentQuality==='med'?1920:3840));
      let h = video.videoHeight || (currentQuality==='low'?480:(currentQuality==='med'?1080:2160));
      const target = currentQuality==='low' ? {w:640,h:480} : (currentQuality==='med'?{w:1920,h:1080}:{w:3840,h:2160});
      const ratio = Math.min(target.w / w, target.h / h, 1);
      w = Math.round(w * ratio); h = Math.round(h * ratio);
      canvas.width = w; canvas.height = h;
      const ctx = canvas.getContext('2d');
      ctx.drawImage(video, 0, 0, w, h);
      const qf = currentQuality==='low' ? 0.7 : 0.95;
      const data = canvas.toDataURL('image/jpeg', qf);
      const file = dataURLtoFile(data, `capture_${Date.now()}.jpg`);
      const entry = {id: uid(), file, quality: currentQuality};
      capturedFiles.push(entry);
      makeThumb(entry,'captured');
    };
    // Reset button was moved outside the camera view
  const resetCamHidden = document.getElementById('resetCamHiddenBtn');
  if(resetCamHidden) resetCamHidden.addEventListener('click', ()=>{ stopCam(); startCam(); });
    qualityGroup.addEventListener('click', (e)=>{
      const b = e.target.closest('button[data-q]'); if(!b) return;
      currentQuality = b.getAttribute('data-q');
      qualityGroup.querySelectorAll('button').forEach(x=>{ x.style.background=''; x.style.color=''; });
      b.style.background = '#00b894'; b.style.color = '#fff';
      stopCam(); startCam();
    });

    async function reencodeEntry(entry, nextQuality){
      try{
        const blob = entry.file instanceof Blob ? entry.file : new Blob([entry.file], {type: entry.file.type||'image/jpeg'});
        const re = await downscaleBlob(blob, nextQuality);
        entry.file = new File([re], `re_${Date.now()}.jpg`, {type: re.type||'image/jpeg'});
        entry.quality = nextQuality;
      }catch(e){ /* ignore */ }
    }
    async function downscaleBlob(blob, mode){
      const img = await blobToImage(blob);
      const target = mode==='low' ? {w:640,h:480} : (mode==='med'?{w:1920,h:1080}:{w:3840,h:2160});
      const ratio = Math.min(target.w / img.width, target.h / img.height, 1);
      const w = Math.round(img.width * ratio), h = Math.round(img.height * ratio);
      canvas.width = w; canvas.height = h;
      const ctx = canvas.getContext('2d');
      ctx.drawImage(img, 0, 0, w, h);
      const qf = mode==='low' ? 0.7 : (mode==='med'?0.95:0.98);
      const dataUrl = canvas.toDataURL('image/jpeg', qf);
      const arr = dataUrl.split(','); const mime = arr[0].match(/:(.*?);/)[1];
      const bstr = atob(arr[1]); let n = bstr.length; const u8arr = new Uint8Array(n);
      while(n--) u8arr[n] = bstr.charCodeAt(n);
      return new Blob([u8arr], {type: mime});
    }
    function blobToImage(blob){ return new Promise((resolve)=>{ const url=URL.createObjectURL(blob); const img=new Image(); img.onload=()=>{ URL.revokeObjectURL(url); resolve(img); }; img.src=url; }); }

    document.getElementById('completeBtn').onclick = async ()=>{
      const form = document.getElementById('diagForm');
      const fd = new FormData(form);
      // Append both pending and captured images, and include matching rotations[] values
      const rotations = [];
      pendingFiles.forEach(({file, id})=>{
        fd.append('photos[]', file, file.name);
        // find the corresponding thumbnail image rotation (if present in preview)
        const thumbImg = document.querySelector(`#preview [data-badge="${id}"]`);
        // fallback: look for the img element by walking preview items
        let rotVal = 0;
        try{
          // try to find img by matching a sibling badge data attribute
          const badge = document.querySelector(`[data-badge="${id}"]`);
          if(badge){
            const wrap = badge.closest('.thumb-wrap');
            if(wrap){ const img = wrap.querySelector('img'); if(img && img.dataset && img.dataset.rot) rotVal = parseInt(img.dataset.rot) || 0; }
          }
        }catch(e){}
        rotations.push(rotVal);
      });
      capturedFiles.forEach(({file, id})=>{
        fd.append('photos[]', file, file.name);
        let rotVal = 0;
        try{
          const badge = document.querySelector(`[data-badge="${id}"]`);
          if(badge){ const wrap = badge.closest('.thumb-wrap'); if(wrap){ const img = wrap.querySelector('img'); if(img && img.dataset && img.dataset.rot) rotVal = parseInt(img.dataset.rot) || 0; } }
        }catch(e){}
        rotations.push(rotVal);
      });
      // Append rotations in same order as photos[]
      rotations.forEach(r => fd.append('rotations[]', String(r)));
      // Show uploading overlay
      try{ document.getElementById('uploadOverlay').style.display='flex'; }catch{}
      try{
        const res = await fetch('/api/items_prep/diagnostic',{method:'POST', body: fd});
        let j = null;
        try{ j = await res.json(); }catch(_jsonErr){ j = null; }
        const msg = document.getElementById('msg');
        if(res.ok && j && j.success){
          // Also POST status (status, reason, note)
          try{
            const statusVal = (document.getElementById('diag-status') && document.getElementById('diag-status').value) || 'unchecked';
            const reasonVal = (document.getElementById('reasonSelect') && document.getElementById('reasonSelect').value) || '';
            const noteVal = (document.querySelector('textarea[name=note]') && document.querySelector('textarea[name=note]').value) || '';
            await fetch('/api/items_prep/status', { method: 'POST', headers: {'Content-Type':'application/json'}, body: JSON.stringify({ upc: '{{ upc }}', status: statusVal, reason: reasonVal, note: noteVal }) });
          }catch(e){ /* ignore status save errors */ }
          msg.textContent='Saved diagnostic';
          // If a return URL was provided in query params, go back to it preserving filters
          try{
            const params = new URLSearchParams(window.location.search);
            const ret = params.get('return');
            if(ret){ setTimeout(()=>{ window.location.href = ret; }, 600); }
            else { setTimeout(()=>{ window.location.href='/item-prep?forceFocus=1'; }, 600); }
          }catch(_){ setTimeout(()=>{ window.location.href='/item-prep?forceFocus=1'; }, 600); }
        } else {
          const errText = (j && j.error) ? j.error : ('HTTP '+res.status+' '+(res.statusText||''));
          msg.textContent = 'Failed: '+ errText;
        }
      }catch(e){
        const msg = document.getElementById('msg'); msg.textContent = 'Failed: '+e;
      } finally {
        try{ document.getElementById('uploadOverlay').style.display='none'; }catch{}
      }
    };

    window.addEventListener('DOMContentLoaded', startCam);
    // If a return param was provided, set the back link to that URL
    window.addEventListener('DOMContentLoaded', ()=>{
      try{
        const params = new URLSearchParams(window.location.search);
        const ret = params.get('return');
        if(ret){ const bl = document.getElementById('back-link'); if(bl) bl.href = ret; }
      }catch(e){}
    });
    // Keep the top status pill in sync with the select value
    function updateStatusPill(val){
      try{
        const pill = document.getElementById('statusPill'); if(!pill) return;
        const v = (val||'').toString().toLowerCase();
        pill.classList.remove('good','bad','unchecked');
        if(v==='good'){ pill.classList.add('good'); pill.textContent = 'Good'; }
        else if(v==='bad'){ pill.classList.add('bad'); pill.textContent = 'Bad'; }
        else { pill.classList.add('unchecked'); pill.textContent = 'Unchecked'; }
      }catch(e){}
    }
    // Wire up select to update pill
    const diagStatusEl = document.getElementById('diag-status');
    if(diagStatusEl){ diagStatusEl.addEventListener('change', (e)=> updateStatusPill(e.target.value)); }
    window.addEventListener('beforeunload', stopCam);

    // Reason buttons sync with select and toggle when clicked again
    reasonBtns.forEach(btn=>{
      btn.addEventListener('click', ()=>{
        const isActive = btn.classList.contains('active');
        // clear all
        reasonBtns.forEach(b=> b.classList.remove('active'));
        if(!isActive){
          btn.classList.add('active');
          reasonSelect.value = btn.dataset.val;
        } else {
          // toggle off
          reasonSelect.value = '';
        }
      });
    });

    // Load existing diagnostic (reason/note and photos)
    window.addEventListener('DOMContentLoaded', async ()=>{
      const upc = '{{ upc }}'.trim();
      if(!upc) return;
      try{
        const r = await fetch(`/api/items_prep/diagnostic/${encodeURIComponent(upc)}`);
        const j = await r.json();
  const st = j && j.status ? j.status : null;
        const imgs = Array.isArray(j && j.images) ? j.images : [];
        if(st){
          const val = (st.reason||'').trim();
          const valid = ['Missing pieces','Wrong item','Broken','Return','Replacement','Other'];
          reasonSelect.value = valid.includes(val) ? val : '';
          const targetBtn = reasonBtns.find(b=> b.dataset.val === reasonSelect.value);
          if(targetBtn){ reasonBtns.forEach(b=> b.classList.remove('active')); targetBtn.classList.add('active'); }
          // Note
          const ta = document.querySelector('textarea[name=note]');
          if(ta){ ta.value = st.note || ''; }
          // Status dropdown
          const statusSel = document.getElementById('diag-status'); if(statusSel){ statusSel.value = st.status || 'unchecked'; updateStatusPill(statusSel.value); }
        }
        if(imgs.length){
          const card = document.getElementById('existingCard');
          const grid = document.getElementById('existingGrid');
          const meta = document.getElementById('existingMeta');
          card.style.display = '';
          // Friendly updated timestamp (e.g., 2025-10-18 6:30am)
          function fmtFriendly(iso){
            try{
              const d = new Date(iso);
              if(isNaN(d.getTime())) return iso;
              const parts = new Intl.DateTimeFormat('en-US', { timeZone: 'America/New_York', year:'numeric', month:'2-digit', day:'2-digit', hour:'numeric', minute:'2-digit', hour12:true }).formatToParts(d);
              const vals = {}; parts.forEach(p=> vals[p.type]=p.value);
              const year = vals.year || d.getFullYear(); const month = vals.month || String(d.getMonth()+1).padStart(2,'0'); const day = vals.day || String(d.getDate()).padStart(2,'0');
              let hour = vals.hour || String(d.getHours()).padStart(2,'0'); let minute = vals.minute || String(d.getMinutes()).padStart(2,'0'); const ampm = (vals.dayPeriod||'').toLowerCase();
              hour = String(hour).replace(/^0/,'');
              return `${year}-${month}-${day} ${hour}:${minute}${ampm}`;
            }catch(e){ return iso; }
          }
          meta.textContent = st && st.updated_at ? ('Updated: '+ fmtFriendly(st.updated_at)) : '';
          imgs.forEach(im=>{
            const src = im.image_path ? `/static/${im.image_path}` : '';
            if(!src) return;
            const wrap = document.createElement('div'); wrap.className = 'thumb-wrap';
            const img = document.createElement('img'); img.className='existing-thumb'; img.src = src; img.alt='existing photo'; img.dataset.src = src;
            const rot = document.createElement('button'); rot.type='button'; rot.className='rotate-btn'; rot.title='Rotate'; rot.textContent='⟲';
            rot.addEventListener('click', (e)=>{ e.stopPropagation(); toggleRotate(img); });
            img.addEventListener('click', ()=>{ const m=document.getElementById('imgModal'); const mi=document.getElementById('modalImg'); mi.src = src; m.style.display='flex'; });
            // Add delete button for each existing photo (editor-only)
            const del = document.createElement('button'); del.type='button'; del.className='del-x'; del.title='Delete photo'; del.textContent='×';
            del.style.top = '-10px'; del.style.right = '-10px'; del.addEventListener('click', async (ev)=>{
              ev.stopPropagation(); if(!confirm('Delete this photo? This moves it to trash.')) return;
              try{
                del.disabled = true; del.textContent = '...';
                const resp = await fetch('/api/items_prep/photo/'+encodeURIComponent(im.id), { method: 'DELETE' });
                const j = await resp.json();
                if(!(j && j.success)){ alert('Delete failed: '+(j&&j.error||'unknown')); del.disabled=false; del.textContent='×'; return; }
                // remove from DOM and if none left hide card
                wrap.remove();
                if(!document.querySelector('#existingGrid .thumb-wrap')){ document.getElementById('existingCard').style.display='none'; }
              }catch(err){ alert('Error deleting: '+err); del.disabled=false; del.textContent='×'; }
            });
            wrap.appendChild(img); wrap.appendChild(rot); wrap.appendChild(del); grid.appendChild(wrap);
          });
          document.getElementById('imgModal').addEventListener('click', ()=>{ const m=document.getElementById('imgModal'); const mi=document.getElementById('modalImg'); mi.src=''; m.style.display='none'; });
        }
      }catch(e){ /* ignore */ }
    });

    // Reset diagnostic: set unchecked, unlist, delete photos (with warning)
    document.getElementById('resetBtn').addEventListener('click', async ()=>{
      const upc = '{{ upc }}'.trim(); if(!upc) return;
      let hasPhotos = false;
      try{
        const r = await fetch(`/api/items_prep/diagnostic/${encodeURIComponent(upc)}`);
        const j = await r.json();
        hasPhotos = Array.isArray(j.images) && j.images.length > 0;
      }catch{}
      const msg = hasPhotos ? 'Reset will delete all diagnostic photos and clear status/listing. Continue?' : 'Reset will clear status and listing. Continue?';
      if(!confirm(msg)) return;
      try{
        // Show overlay
        try{ document.getElementById('uploadOverlay').style.display='flex'; }catch{}
        // 1) Delete photos if any
        if(hasPhotos){
          try{
            const delRes = await fetch(`/api/items_prep/diagnostic/${encodeURIComponent(upc)}/photos`, { method:'DELETE' });
            const dj = await delRes.json();
            if(!(dj && dj.success)){
              alert('Photos could not be deleted: '+(dj&&dj.error||'unknown'));
            }
          }catch(e){ alert('Photos could not be deleted: '+e); }
        }
        // 2) Uncheck status (clear reason/note)
        await fetch('/api/items_prep/status', {method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({ upc, status: 'unchecked', reason: '', note: '' })});
        // 3) Unlist
        await fetch('/api/bol_items/list_status', {method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({ upc, list_status: '' })});
        // 4) Clear UI
        reasonBtns.forEach(b=> b.classList.remove('active')); reasonSelect.value='';
        const ta = document.querySelector('textarea[name=note]'); if(ta) ta.value = '';
        // clear pending/captured previews
        try{ document.getElementById('preview').innerHTML = ''; }catch{}
        // clear existing photos section
        try{ document.getElementById('existingGrid').innerHTML=''; document.getElementById('existingCard').style.display='none'; }catch{}
        const m = document.getElementById('msg'); if(m) m.textContent = 'Reset complete';
      } finally {
        try{ document.getElementById('uploadOverlay').style.display='none'; }catch{}
      }
    });
  </script>
</body>
</html>
