<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Diagnostic</title>
  <style>
    body{font-family:Segoe UI,Arial,sans-serif;background:#f7fafc;margin:0;padding:18px}
    .top{display:flex;align-items:center;gap:10px;justify-content:space-between}
    .btn{padding:10px 16px;border-radius:8px;border:none;cursor:pointer}
    .btn-primary{background:#00b894;color:#fff}
    .btn-danger{background:#e74c3c;color:#fff}
    .card{background:#fff;border:1px solid #e8e8e8;border-radius:12px;padding:16px;margin-top:14px}
    .row{display:flex;gap:10px;flex-wrap:wrap}
    .preview{display:flex;gap:10px;flex-wrap:wrap;margin-top:10px}
    .thumb-wrap{position:relative;width:100px;height:100px}
    .thumb{width:100%;height:100%;object-fit:cover;border-radius:8px;background:#f0f0f0}
    .del-x{position:absolute;top:-8px;right:-8px;background:#e74c3c;color:#fff;border:none;border-radius:50%;width:22px;height:22px;cursor:pointer;line-height:22px;text-align:center;font-weight:bold;box-shadow:0 1px 4px rgba(0,0,0,0.25)}
    label{display:block;margin-top:8px}
    /* Prominent reason selection */
  .reason-group{display:flex;gap:10px;flex-wrap:wrap;margin:8px 0}
  .reason-btn{padding:14px 18px;border-radius:999px;border:2px solid #ddd;background:#f9f9f9;cursor:pointer;font-size:1.05rem}
  .reason-btn.active{background:#00b894;color:#fff;border-color:#00b894}
    textarea[name=note]{font-size:1rem}
    /* Existing photos grid */
    .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:10px}
    .existing-thumb{width:100%;aspect-ratio:1/1;object-fit:cover;border-radius:10px;background:#f0f0f0;cursor:pointer}
    /* Modal */
    .modal{display:none;position:fixed;inset:0;background:rgba(0,0,0,0.8);z-index:9999;align-items:center;justify-content:center}
    .modal img{max-width:90vw;max-height:88vh;border-radius:8px}
    /* Upload overlay */
    #uploadOverlay{display:none;position:fixed;inset:0;background:rgba(255,255,255,0.85);z-index:9998;align-items:center;justify-content:center}
    .spinner{width:56px;height:56px;border:6px solid #eee;border-top-color:#00b894;border-radius:50%;animation:spin 1s linear infinite}
    @keyframes spin{to{transform:rotate(360deg)}}
  </style>
</head>
<body>
  <div class="top">
    <a href="/item-prep?upc={{ upc }}"><button class="btn btn-danger">Back</button></a>
    <h2>Diagnostic</h2>
    <div style="width:100px"></div>
  </div>

  <div class="card">
    <div class="row">
      <div>UPC:</div>
      <div id="upcText">{{ upc }}</div>
    </div>
    <form id="diagForm" enctype="multipart/form-data">
      <input type="hidden" name="upc" value="{{ upc }}">
      <label style="font-weight:600;font-size:1.05rem">Reason:</label>
      <div class="reason-group" role="group" aria-label="Select reason">
        <button type="button" class="reason-btn" data-val="Missing pieces">Missing pieces</button>
        <button type="button" class="reason-btn" data-val="Wrong item">Wrong item</button>
        <button type="button" class="reason-btn" data-val="Broken">Broken</button>
        <button type="button" class="reason-btn" data-val="Trash">Trash</button>
        <button type="button" class="reason-btn" data-val="Other">Other</button>
      </div>
      <input type="hidden" name="reason" id="reasonSelect" required>
      <label>Note:
        <textarea name="note" rows="3" style="width:100%;box-sizing:border-box"></textarea>
      </label>
      <label>Photos:
        <input type="file" id="photos" accept="image/*" capture="environment" multiple>
      </label>
      <div style="margin-top:8px">
        <div class="small-muted" style="display:flex;align-items:center;gap:10px;justify-content:space-between;flex-wrap:wrap">
          <span>Or use camera</span>
          <label style="display:flex;align-items:center;gap:6px;font-size:0.95rem">
            <input type="checkbox" id="lowResToggle"> Low res (faster upload)
          </label>
        </div>
        <video id="cam" playsinline muted style="width:100%;max-width:420px;aspect-ratio:1/1;background:#222;border-radius:8px"></video>
        <canvas id="canvas" style="display:none"></canvas>
        <div style="margin-top:8px;display:flex;gap:8px">
          <button type="button" class="btn btn-primary" id="captureBtn">Capture</button>
          <button type="button" class="btn" id="resetCamBtn">Reset</button>
        </div>
      </div>
      <div id="preview" class="preview"></div>
      <div style="margin-top:12px">
        <button type="button" class="btn btn-primary" id="completeBtn">Complete</button>
      </div>
    </form>
    <div id="msg" style="margin-top:10px"></div>
  </div>

  <div class="card" id="existingCard" style="display:none">
    <h3 style="margin:0 0 8px 0">Existing Diagnostic</h3>
    <div id="existingMeta" class="muted"></div>
    <div id="existingGrid" class="grid" style="margin-top:10px"></div>
  </div>

  <div id="imgModal" class="modal"><img id="modalImg" src="" alt=""></div>
  <div id="uploadOverlay"><div class="spinner" title="Uploading..."></div></div>

  <script>
  const photos = document.getElementById('photos');
    const preview = document.getElementById('preview');
    const lowResToggle = document.getElementById('lowResToggle');
  const reasonSelect = document.getElementById('reasonSelect');
  const reasonBtns = Array.from(document.querySelectorAll('.reason-btn'));
    let lowRes = false;
    function uid(){ return 'id_'+Math.random().toString(36).slice(2); }
    const pendingFiles = []; // {id, file}
    const capturedFiles = []; // {id, file}

    function makeThumb(entry, source){
      const url = URL.createObjectURL(entry.file);
      const wrap = document.createElement('div');
      wrap.className='thumb-wrap';
      const img = document.createElement('img'); img.className='thumb'; img.src=url; img.alt='photo';
      const del = document.createElement('button'); del.type='button'; del.className='del-x'; del.textContent='×';
      del.dataset.id = entry.id; del.dataset.source = source;
      del.addEventListener('click', ()=>{
        // remove from arrays
        const src = del.dataset.source; const id = del.dataset.id;
        if(src==='pending'){
          const idx = pendingFiles.findIndex(x=>x.id===id); if(idx>-1) pendingFiles.splice(idx,1);
        } else {
          const idx = capturedFiles.findIndex(x=>x.id===id); if(idx>-1) capturedFiles.splice(idx,1);
        }
        URL.revokeObjectURL(url);
        wrap.remove();
      });
      wrap.appendChild(img); wrap.appendChild(del);
      preview.appendChild(wrap);
    }

    photos.addEventListener('change', ()=>{
      const files = Array.from(photos.files||[]);
      files.forEach(f=>{ const entry = {id: uid(), file: f}; pendingFiles.push(entry); makeThumb(entry,'pending'); });
      // clear the input so we control the file list ourselves
      photos.value = '';
    });

    // Camera capture that stacks multiple images without leaving the page
    let stream=null;
    let imageCapture=null;
    const video = document.getElementById('cam');
    const canvas = document.getElementById('canvas');
    async function startCam(){
      try{
        const constraints = {
          video:{
            facingMode:{ideal:'environment'},
            width: { ideal: lowRes ? 640 : 3840 },
            height: { ideal: lowRes ? 480 : 2160 }
          }
        };
        stream = await navigator.mediaDevices.getUserMedia(constraints);
        video.srcObject = stream; await video.play();
        const track = stream.getVideoTracks && stream.getVideoTracks()[0];
        imageCapture = null;
        if(track && 'ImageCapture' in window){
          try { imageCapture = new ImageCapture(track); } catch(_) { imageCapture = null; }
        }
      }catch(e){ /* camera optional */ }
    }
    function stopCam(){ try{ stream && stream.getTracks().forEach(t=>t.stop()); }catch{}; stream=null; }
    function dataURLtoFile(dataurl, filename) {
      const arr = dataurl.split(','); const mime = arr[0].match(/:(.*?);/)[1];
      const bstr = atob(arr[1]); let n = bstr.length; const u8arr = new Uint8Array(n);
      while(n--) u8arr[n] = bstr.charCodeAt(n);
      return new File([u8arr], filename, {type:mime});
    }

    document.getElementById('captureBtn').onclick = async ()=>{
      if(!video || video.readyState < 2) return;
      // Prefer full-quality ImageCapture if available
      if(imageCapture && imageCapture.takePhoto && !lowRes){
        try{
          const blob = await imageCapture.takePhoto();
          const file = new File([blob], `capture_${Date.now()}.jpg`, { type: blob.type || 'image/jpeg' });
          const entry = {id: uid(), file};
          capturedFiles.push(entry);
          makeThumb(entry,'captured');
          return;
        }catch(e){ /* fall back */ }
      }
      // Fallback to canvas at chosen resolution/quality
      let w = video.videoWidth || (lowRes?640:1920);
      let h = video.videoHeight || (lowRes?480:1080);
      // Optionally downscale if lowRes
      if(lowRes){
        const ratio = Math.min(640 / w, 480 / h, 1);
        w = Math.round(w * ratio); h = Math.round(h * ratio);
      }
      canvas.width = w; canvas.height = h;
      const ctx = canvas.getContext('2d');
      ctx.drawImage(video, 0, 0, w, h);
      const quality = lowRes ? 0.7 : 1.0;
      const data = canvas.toDataURL('image/jpeg', quality);
      const file = dataURLtoFile(data, `capture_${Date.now()}.jpg`);
      const entry = {id: uid(), file};
      capturedFiles.push(entry);
      makeThumb(entry,'captured');
    };
    document.getElementById('resetCamBtn').onclick = ()=>{ stopCam(); startCam(); };
    lowResToggle.addEventListener('change', ()=>{ lowRes = !!lowResToggle.checked; stopCam(); startCam(); });

    document.getElementById('completeBtn').onclick = async ()=>{
      const form = document.getElementById('diagForm');
      const fd = new FormData(form);
      // Append both pending and captured images
      pendingFiles.forEach(({file})=> fd.append('photos[]', file, file.name));
      capturedFiles.forEach(({file})=> fd.append('photos[]', file, file.name));
      // Show uploading overlay
      try{ document.getElementById('uploadOverlay').style.display='flex'; }catch{}
      try{
        const res = await fetch('/api/items_prep/diagnostic',{method:'POST', body: fd});
        const j = await res.json();
        const msg = document.getElementById('msg');
        if(j && j.success){ msg.textContent='Saved diagnostic'; setTimeout(()=>{ window.location.href='/item-prep'; }, 600); }
        else { msg.textContent='Failed: '+(j.error||''); }
      }catch(e){
        const msg = document.getElementById('msg'); msg.textContent = 'Failed: '+e;
      } finally {
        try{ document.getElementById('uploadOverlay').style.display='none'; }catch{}
      }
    };

    window.addEventListener('DOMContentLoaded', startCam);
    window.addEventListener('beforeunload', stopCam);

    // Reason buttons sync with select
    reasonBtns.forEach(btn=>{
      btn.addEventListener('click', ()=>{
        reasonBtns.forEach(b=> b.classList.remove('active'));
        btn.classList.add('active');
        reasonSelect.value = btn.dataset.val;
      });
    });

    // Load existing diagnostic (reason/note and photos)
    window.addEventListener('DOMContentLoaded', async ()=>{
      const upc = '{{ upc }}'.trim();
      if(!upc) return;
      try{
        const r = await fetch(`/api/items_prep/diagnostic/${encodeURIComponent(upc)}`);
        const j = await r.json();
        const st = j && j.status ? j.status : null;
        const imgs = Array.isArray(j && j.images) ? j.images : [];
        if(st){
          const val = (st.reason||'').trim();
          const valid = ['Missing pieces','Wrong item','Broken','Trash','Other'];
          reasonSelect.value = valid.includes(val) ? val : 'Other';
          const targetBtn = reasonBtns.find(b=> b.dataset.val === reasonSelect.value);
          if(targetBtn){ reasonBtns.forEach(b=> b.classList.remove('active')); targetBtn.classList.add('active'); }
          // Note
          const ta = document.querySelector('textarea[name=note]');
          if(ta){ ta.value = st.note || ''; }
        }
        if(imgs.length){
          const card = document.getElementById('existingCard');
          const grid = document.getElementById('existingGrid');
          const meta = document.getElementById('existingMeta');
          card.style.display = '';
          meta.textContent = st && st.updated_at ? ('Updated: '+ st.updated_at) : '';
          imgs.forEach(im=>{
            const src = im.image_path ? `/static/${im.image_path}` : '';
            if(!src) return;
            const img = document.createElement('img'); img.className='existing-thumb'; img.src = src; img.alt='existing photo'; img.dataset.src = src;
            img.addEventListener('click', ()=>{ const m=document.getElementById('imgModal'); const mi=document.getElementById('modalImg'); mi.src = src; m.style.display='flex'; });
            grid.appendChild(img);
          });
          document.getElementById('imgModal').addEventListener('click', ()=>{ const m=document.getElementById('imgModal'); const mi=document.getElementById('modalImg'); mi.src=''; m.style.display='none'; });
        }
      }catch(e){ /* ignore */ }
    });
  </script>
</body>
</html>
