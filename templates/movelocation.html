<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Move / Remove Items</title>
  <style>
    *{box-sizing:border-box}
    body{font-family:Segoe UI,Arial,sans-serif;background:#f0f4f8;margin:0;padding:0;color:#1e293b;min-height:100vh}

    /* ── Top bar ── */
    .topbar{display:flex;align-items:center;gap:10px;padding:12px 16px;background:#fff;border-bottom:1px solid #e2e8f0;position:sticky;top:0;z-index:100}
    .topbar-back{background:none;border:none;cursor:pointer;color:#64748b;padding:6px;border-radius:8px;display:flex;align-items:center;gap:5px;font-size:.9rem;font-weight:600}
    .topbar-back:hover{background:#f1f5f9;color:#1e293b}
    .topbar-title{font-size:1.1rem;font-weight:700;flex:1;text-align:center;color:#1e293b}
    .topbar-spacer{width:60px}

    /* ── Page body ── */
    .page{max-width:860px;margin:0 auto;padding:16px}

    /* ── Cards ── */
    .card{background:#fff;border-radius:14px;box-shadow:0 1px 4px rgba(0,0,0,.08);margin-bottom:14px;overflow:hidden}
    .card-body{padding:14px 16px}

    /* ── Scan row ── */
    .scan-section{display:flex;flex-direction:column;gap:10px}
    .input-row{display:flex;gap:8px}
    .input-row input{flex:1;padding:11px 14px;border:1.5px solid #cbd5e1;border-radius:10px;font-size:1rem;background:#fff;transition:border .15s}
    .input-row input:focus{outline:none;border-color:#3b82f6;box-shadow:0 0 0 3px rgba(59,130,246,.12)}
    .input-row input::placeholder{color:#94a3b8}

    /* ── Buttons ── */
    .btn{border:none;border-radius:10px;padding:10px 16px;font-weight:600;cursor:pointer;font-size:.9rem;display:inline-flex;align-items:center;gap:6px;transition:filter .15s,transform .1s;white-space:nowrap}
    .btn:active{transform:scale(.97)}
    .btn:disabled{opacity:.55;cursor:not-allowed;transform:none}
    .btn-blue{background:#3b82f6;color:#fff}
    .btn-blue:hover:not(:disabled){filter:brightness(1.08)}
    .btn-red{background:#ef4444;color:#fff}
    .btn-red:hover:not(:disabled){filter:brightness(1.08)}
    .btn-slate{background:#64748b;color:#fff}
    .btn-slate:hover:not(:disabled){filter:brightness(1.1)}
    .btn-ghost{background:none;border:1.5px solid #cbd5e1;color:#475569}
    .btn-ghost:hover:not(:disabled){background:#f8fafc;border-color:#94a3b8}
    .btn-icon{padding:8px 10px;border-radius:8px;background:#f1f5f9;border:none;cursor:pointer;color:#64748b;font-size:1rem;line-height:1}
    .btn-icon:hover{background:#e2e8f0;color:#1e293b}

    /* ── Status ── */
    .status-bar{padding:8px 12px;border-radius:8px;font-size:.875rem;font-weight:500;margin-top:8px;min-height:0}
    .status-bar:empty{display:none}
    .status-ok{background:#f0fdf4;color:#15803d;border:1px solid #bbf7d0}
    .status-err{background:#fef2f2;color:#b91c1c;border:1px solid #fecaca}
    .status-neutral{background:#f8fafc;color:#475569;border:1px solid #e2e8f0}

    /* ── Queue header ── */
    .queue-header{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:14px 16px 10px;border-bottom:1px solid #f1f5f9}
    .queue-label{font-weight:700;font-size:.95rem;color:#1e293b}
    .queue-count{font-size:.82rem;color:#64748b;font-weight:500;margin-top:1px}
    .queue-actions{display:flex;align-items:center;gap:8px;flex-wrap:wrap;justify-content:flex-end}

    /* ── Table ── */
    .table-wrap{overflow-x:auto}
    table{border-collapse:collapse;width:100%;min-width:600px}
    th{background:#f8fafc;padding:8px 12px;font-size:.72rem;text-transform:uppercase;color:#64748b;letter-spacing:.06em;font-weight:700;text-align:left;border-bottom:1px solid #e2e8f0}
    td{padding:10px 12px;border-bottom:1px solid #f1f5f9;vertical-align:middle}
    tr:last-child td{border-bottom:none}
    tr.needs-location{background:#fffbeb}

    .item-cell{display:flex;gap:10px;align-items:center;min-width:180px}
    .thumb{width:48px;height:48px;border-radius:8px;border:1px solid #e2e8f0;object-fit:cover;background:#f8fafc;flex-shrink:0}
    .item-title{font-weight:600;font-size:.875rem;line-height:1.3;color:#1e293b}
    .item-code{font-family:Consolas,monospace;font-size:.75rem;color:#64748b;margin-top:2px}

    .qty-cell{white-space:nowrap}
    .qty-wrap{display:inline-flex;align-items:center;gap:5px}
    .qty-btn{width:26px;height:26px;border-radius:50%;border:1.5px solid #bfdbfe;background:#eff6ff;color:#1d4ed8;font-weight:900;cursor:pointer;padding:0;font-size:.95rem;line-height:1;display:flex;align-items:center;justify-content:center}
    .qty-btn:disabled{opacity:.4;cursor:not-allowed}
    .qty-val{min-width:28px;text-align:center;font-weight:700;font-size:.9rem;color:#1e40af}
    .qty-max{font-size:.7rem;color:#94a3b8;margin-top:2px}

    .loc-cell{min-width:200px}
    .loc-bubbles{display:flex;gap:5px;flex-wrap:wrap}
    .loc-bubble{border:1.5px solid #7dd3fc;background:#e0f2fe;color:#0c4a6e;border-radius:999px;padding:5px 11px;cursor:pointer;font-size:.8rem;font-weight:600;transition:background .12s,border .12s;white-space:nowrap}
    .loc-bubble.sel{background:#0369a1;color:#fff;border-color:#0369a1}
    .loc-bubble .bqty{font-size:.72rem;opacity:.85;margin-left:3px}
    .loc-note{font-size:.72rem;color:#94a3b8;margin-top:4px}
    .loc-warn{font-size:.72rem;color:#d97706;font-weight:600;margin-top:4px}
    .loc-sel-note{font-size:.72rem;color:#0369a1;margin-top:4px;display:flex;align-items:center;gap:6px}
    .loc-clear-btn{font-size:.68rem;color:#64748b;cursor:pointer;text-decoration:underline;border:none;background:none;padding:0}

    .avail-cell{font-weight:700;font-size:.9rem}
    .avail-ok{color:#15803d}
    .avail-zero{color:#dc2626}

    .action-cell{text-align:right}
    .empty-row td{text-align:center;color:#94a3b8;padding:36px 12px;font-size:.9rem}

    /* ── Bottom action bar ── */
    .action-bar{padding:12px 16px;border-top:1px solid #f1f5f9;display:flex;gap:10px;flex-wrap:wrap;align-items:center}
    .action-bar-spacer{flex:1}

    /* ── Destination modal ── */
    .modal-backdrop{display:none;position:fixed;inset:0;background:rgba(15,23,42,.55);z-index:500;align-items:center;justify-content:center;padding:16px}
    .modal-backdrop.open{display:flex}
    .modal-card{background:#fff;border-radius:16px;width:min(440px,100%);box-shadow:0 20px 60px rgba(0,0,0,.18);overflow:hidden}
    .modal-header{padding:16px 18px 12px;border-bottom:1px solid #f1f5f9;display:flex;align-items:center;justify-content:space-between}
    .modal-title{font-weight:700;font-size:1rem;color:#1e293b}
    .modal-close{background:none;border:none;font-size:1.3rem;color:#94a3b8;cursor:pointer;padding:4px;line-height:1;border-radius:6px}
    .modal-close:hover{background:#f1f5f9;color:#64748b}
    .modal-body{padding:16px 18px}
    .modal-body label{display:block;font-size:.82rem;font-weight:700;color:#64748b;text-transform:uppercase;letter-spacing:.05em;margin-bottom:6px}
    .modal-body input{width:100%;padding:13px 14px;border:1.5px solid #cbd5e1;border-radius:10px;font-size:1.05rem;font-weight:600;letter-spacing:.03em;text-align:center}
    .modal-body input:focus{outline:none;border-color:#3b82f6;box-shadow:0 0 0 3px rgba(59,130,246,.12)}
    .modal-footer{padding:12px 18px 16px;display:flex;gap:10px;justify-content:flex-end}
    .modal-hint{margin-top:8px;font-size:.8rem;color:#94a3b8;text-align:center}

    /* ── Confirm modal ── */
    .confirm-icon{text-align:center;font-size:2rem;margin-bottom:8px}
    .confirm-title{text-align:center;font-weight:700;font-size:1rem;color:#1e293b;margin-bottom:6px}
    .confirm-body{font-size:.875rem;color:#475569;line-height:1.5;text-align:center}
    .confirm-detail{margin-top:10px;background:#f8fafc;border-radius:8px;padding:10px 12px;font-size:.8rem;color:#64748b;text-align:left}
    .confirm-detail-row{display:flex;justify-content:space-between;margin-bottom:3px}
    .confirm-detail-row:last-child{margin-bottom:0}

    /* ── Toast-style message modal ── */
    .msg-backdrop{display:none;position:fixed;inset:0;background:rgba(15,23,42,.45);z-index:600;align-items:center;justify-content:center;padding:16px}
    .msg-backdrop.open{display:flex}
    .msg-card{background:#fff;border-radius:14px;width:min(420px,100%);box-shadow:0 16px 48px rgba(0,0,0,.16);overflow:hidden}
    .msg-accent{height:4px}
    .msg-accent.blue{background:#3b82f6}
    .msg-accent.red{background:#ef4444}
    .msg-accent.green{background:#22c55e}
    .msg-inner{padding:16px 18px 14px}
    .msg-head{font-weight:700;font-size:.95rem;color:#1e293b;margin-bottom:6px}
    .msg-text{font-size:.875rem;color:#475569;white-space:pre-wrap;line-height:1.45;max-height:50vh;overflow:auto}
    .msg-foot{padding:10px 18px 14px;display:flex;justify-content:flex-end}

    /* ── Location image modal ── */
    .img-modal{display:none;position:fixed;inset:0;background:rgba(15,23,42,.6);z-index:700;align-items:center;justify-content:center;padding:16px}
    .img-modal.open{display:flex}
    .img-card{background:#fff;border-radius:14px;width:min(500px,100%);padding:16px;box-shadow:0 20px 60px rgba(0,0,0,.2)}
    .img-card img{max-width:100%;border-radius:10px;display:block;margin:10px auto;border:1px solid #e2e8f0}
    .img-card h4{margin:0 0 6px;font-size:.95rem}

    /* ── Dark mode ── */
    html.ss-theme-night body{background:#0f172a;color:#e2e8f0}
    html.ss-theme-night .topbar,html.ss-theme-night .card{background:#1e293b;border-color:#334155}
    html.ss-theme-night .card-body .input-row input,html.ss-theme-night .modal-body input{background:#0f172a;color:#e2e8f0;border-color:#334155}
    html.ss-theme-night th{background:#1e293b;color:#94a3b8}
    html.ss-theme-night td,html.ss-theme-night .queue-header,html.ss-theme-night .action-bar{border-color:#334155}
    html.ss-theme-night .modal-card,html.ss-theme-night .msg-card,html.ss-theme-night .img-card,html.ss-theme-night .confirm-detail{background:#1e293b}
    html.ss-theme-night .modal-header,html.ss-theme-night .modal-footer,html.ss-theme-night .msg-foot{border-color:#334155}
    html.ss-theme-night .btn-ghost{border-color:#334155;color:#94a3b8}
    html.ss-theme-night .btn-icon{background:#334155;color:#94a3b8}
    html.ss-theme-night .qty-btn{background:#172554;border-color:#1d4ed8;color:#93c5fd}
    html.ss-theme-night tr.needs-location{background:#1c1400}
    html.ss-theme-night .confirm-detail{background:#0f172a;border-color:#334155}

    @media(max-width:620px){
      .page{padding:10px}
      .queue-actions{gap:6px}
      .action-bar{gap:8px}
      .topbar-title{font-size:1rem}
    }
  </style>
</head>
<body>

  <div class="topbar">
    <button class="topbar-back" id="backBtn" type="button">
      <svg width="16" height="16" viewBox="0 0 16 16" fill="none"><path d="M10 12L6 8l4-4" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
      Back
    </button>
    <div class="topbar-title">Move / Remove Items</div>
    <div class="topbar-spacer"></div>
  </div>

  <div class="page">

    <!-- Scan inputs -->
    <div class="card">
      <div class="card-body scan-section">
        <div class="input-row">
          <input id="barcodeInput" type="text" placeholder="Scan barcode + Enter" autocomplete="off" autocapitalize="off" spellcheck="false">
          <button id="scanBtn" class="btn btn-blue" type="button">Add</button>
        </div>
        <div class="input-row">
          <input id="shelfInput" type="text" placeholder="Scan shelf code to load all items" autocomplete="off" autocapitalize="off" spellcheck="false">
          <button id="loadShelfBtn" class="btn btn-ghost" type="button">Load Shelf</button>
        </div>
        <div id="statusBar" class="status-bar" role="status"></div>
      </div>
    </div>

    <!-- Queue -->
    <div class="card">
      <div class="queue-header">
        <div>
          <div class="queue-label">Scanned Items</div>
          <div id="queueCount" class="queue-count">0 items queued</div>
        </div>
        <div class="queue-actions">
          <button id="moveBtn" class="btn btn-blue" type="button">
            <svg width="14" height="14" viewBox="0 0 16 16" fill="none"><path d="M3 8h10M9 4l4 4-4 4" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
            Move to Shelf
          </button>
          <button id="removeBtn" class="btn btn-red" type="button">
            <svg width="14" height="14" viewBox="0 0 16 16" fill="none"><path d="M2 4h12M6 4V2h4v2M5 4v9h6V4" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
            Remove from Inventory
          </button>
          <button id="clearQueueBtn" class="btn btn-ghost" type="button">Clear Queue</button>
        </div>
      </div>

      <div class="table-wrap">
        <table>
          <thead>
            <tr>
              <th>Item</th>
              <th>Qty</th>
              <th>Source Location</th>
              <th>In Stock</th>
              <th></th>
            </tr>
          </thead>
          <tbody id="queueBody">
            <tr class="empty-row"><td colspan="5">Scan a barcode or load a shelf to get started.</td></tr>
          </tbody>
        </table>
      </div>
    </div>

  </div><!-- /page -->

  <!-- ── Destination modal (for Move) ── -->
  <div id="destModal" class="modal-backdrop">
    <div class="modal-card">
      <div class="modal-header">
        <span class="modal-title">Move to Shelf</span>
        <button id="destModalClose" class="modal-close" type="button">&#x2715;</button>
      </div>
      <div class="modal-body">
        <label>Destination Shelf Code</label>
        <input id="destInput" type="text" placeholder="Scan or type shelf code" autocomplete="off" autocapitalize="off" spellcheck="false">
        <div class="modal-hint" id="destHint"></div>
      </div>
      <div class="modal-footer">
        <button id="destCancelBtn" class="btn btn-ghost" type="button">Cancel</button>
        <button id="destConfirmBtn" class="btn btn-blue" type="button">Confirm Move</button>
      </div>
    </div>
  </div>

  <!-- ── Confirm modal (for Remove) ── -->
  <div id="confirmModal" class="modal-backdrop">
    <div class="modal-card">
      <div class="modal-header">
        <span class="modal-title" id="confirmTitle">Confirm</span>
        <button id="confirmModalClose" class="modal-close" type="button">&#x2715;</button>
      </div>
      <div class="modal-body">
        <div class="confirm-icon" id="confirmIcon">🗑️</div>
        <div class="confirm-title" id="confirmHeading"></div>
        <div class="confirm-body" id="confirmBody"></div>
        <div class="confirm-detail" id="confirmDetail"></div>
      </div>
      <div class="modal-footer">
        <button id="confirmCancelBtn" class="btn btn-ghost" type="button">Cancel</button>
        <button id="confirmOkBtn" class="btn btn-red" type="button">Yes, Remove</button>
      </div>
    </div>
  </div>

  <!-- ── Message modal ── -->
  <div id="msgModal" class="msg-backdrop">
    <div class="msg-card">
      <div id="msgAccent" class="msg-accent blue"></div>
      <div class="msg-inner">
        <div id="msgHead" class="msg-head"></div>
        <div id="msgText" class="msg-text"></div>
      </div>
      <div class="msg-foot">
        <button id="msgClose" class="btn btn-ghost" type="button">Close</button>
      </div>
    </div>
  </div>

  <!-- ── Location image modal ── -->
  <div id="imgModal" class="img-modal">
    <div class="img-card">
      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:4px">
        <h4 id="imgTitle">Location Preview</h4>
        <button id="imgClose" class="btn btn-ghost" type="button" style="padding:6px 10px">Close</button>
      </div>
      <div id="imgBody"></div>
    </div>
  </div>

  <script src="/static/location-preview.js?v=20260317a"></script>
  <script>
    /* ─── refs ─── */
    const barcodeInput   = document.getElementById('barcodeInput');
    const scanBtn        = document.getElementById('scanBtn');
    const shelfInput     = document.getElementById('shelfInput');
    const loadShelfBtn   = document.getElementById('loadShelfBtn');
    const statusBar      = document.getElementById('statusBar');
    const queueBody      = document.getElementById('queueBody');
    const queueCount     = document.getElementById('queueCount');
    const moveBtn        = document.getElementById('moveBtn');
    const removeBtn      = document.getElementById('removeBtn');
    const clearQueueBtn  = document.getElementById('clearQueueBtn');

    const destModal      = document.getElementById('destModal');
    const destInput      = document.getElementById('destInput');
    const destHint       = document.getElementById('destHint');
    const destConfirmBtn = document.getElementById('destConfirmBtn');
    const destCancelBtn  = document.getElementById('destCancelBtn');
    const destModalClose = document.getElementById('destModalClose');

    const confirmModal     = document.getElementById('confirmModal');
    const confirmTitle     = document.getElementById('confirmTitle');
    const confirmIcon      = document.getElementById('confirmIcon');
    const confirmHeading   = document.getElementById('confirmHeading');
    const confirmBody      = document.getElementById('confirmBody');
    const confirmDetail    = document.getElementById('confirmDetail');
    const confirmOkBtn     = document.getElementById('confirmOkBtn');
    const confirmCancelBtn = document.getElementById('confirmCancelBtn');
    const confirmModalClose= document.getElementById('confirmModalClose');

    const msgModal   = document.getElementById('msgModal');
    const msgAccent  = document.getElementById('msgAccent');
    const msgHead    = document.getElementById('msgHead');
    const msgText    = document.getElementById('msgText');
    const msgClose   = document.getElementById('msgClose');

    const imgModal   = document.getElementById('imgModal');
    const imgTitle   = document.getElementById('imgTitle');
    const imgBody    = document.getElementById('imgBody');
    const imgClose   = document.getElementById('imgClose');

    /* ─── state ─── */
    let queue     = [];
    let seq       = 1;
    let busy      = false;
    let validShelves = [];

    /* ─── utils ─── */
    function esc(v){return String(v||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}
    function noImg(){
      return "data:image/svg+xml;utf8,"+encodeURIComponent('<svg xmlns="http://www.w3.org/2000/svg" width="48" height="48"><rect width="100%" height="100%" fill="#e2e8f0"/><text x="50%" y="54%" dominant-baseline="middle" text-anchor="middle" fill="#94a3b8" font-size="8">No Img</text></svg>');
    }
    function normScan(v){
      let s = String(v||'').trim();
      if(!s) return '';
      if(s.endsWith('.0') && /^\d+\.0$/.test(s)) s = s.slice(0,-2);
      if(/^\d+$/.test(s) && s.length > 13 && s.startsWith('0')){
        const stripped = s.replace(/^0+/,'');
        if(stripped && stripped.length <= 13) s = stripped;
      }
      return s;
    }
    function barcodeKey(v){
      const s = normScan(v);
      if(!s) return '';
      if(s.includes('-')){
        const p = s.split('-',2);
        if(/^\d+$/.test(p[0])) return (p[0].replace(/^0+/,'')||'0')+'-'+p[1];
        return s;
      }
      if(/^\d+$/.test(s)) return s.replace(/^0+/,'')||'0';
      return s;
    }
    function barcodeDisplay(v){
      const s = String(v||'').trim();
      if(/^\d+$/.test(s) && s.length <= 12) return s.padStart(12,'0');
      return s;
    }

    function setStatus(type, msg){
      statusBar.textContent = msg || '';
      statusBar.className = 'status-bar' + (msg ? (type==='ok' ? ' status-ok' : type==='err' ? ' status-err' : ' status-neutral') : '');
    }

    /* ─── message modal ─── */
    function showMsg(title, text, color){
      msgHead.textContent = title || '';
      msgText.textContent = text || '';
      msgAccent.className = 'msg-accent ' + (color || 'blue');
      msgModal.classList.add('open');
    }
    msgClose.addEventListener('click', ()=>{ msgModal.classList.remove('open'); barcodeInput.focus(); });
    msgModal.addEventListener('click', e=>{ if(e.target===msgModal){ msgModal.classList.remove('open'); barcodeInput.focus(); } });

    /* ─── image modal ─── */
    function openPreview(location){
      const loc = String(location||'').trim();
      if(!loc) return;
      if(window.SSLocationPreview){
        window.SSLocationPreview.openForLocation(loc,'',`Location: ${loc}`);
        return;
      }
      imgTitle.textContent = 'Location: ' + loc;
      const bust = Date.now();
      const candidates = [
        `/shelf-image/${encodeURIComponent(loc)}.png?t=${bust}`,
        `/shelf-image/${encodeURIComponent(loc.toLowerCase())}.png?t=${bust}`,
        `/static/pictureposition/${encodeURIComponent(loc)}?t=${bust}`,
        `/static/pictureposition/${encodeURIComponent(loc)}.jpg?t=${bust}`,
        `/static/pictureposition/${encodeURIComponent(loc)}.png?t=${bust}`
      ];
      let ci = 0;
      imgBody.innerHTML = `<img id="locImg" alt="Location image">`;
      const img = document.getElementById('locImg');
      const tryNext = () => {
        if(ci >= candidates.length){ imgBody.innerHTML = `<div style="color:#94a3b8;text-align:center;padding:24px;">No image found for ${esc(loc)}.</div>`; return; }
        img.src = candidates[ci++];
      };
      img.onerror = tryNext;
      tryNext();
      imgModal.classList.add('open');
    }
    imgClose.addEventListener('click', ()=>{ imgModal.classList.remove('open'); barcodeInput.focus(); });
    imgModal.addEventListener('click', e=>{ if(e.target===imgModal){ imgModal.classList.remove('open'); barcodeInput.focus(); } });

    /* ─── valid shelves ─── */
    async function loadValidShelves(){
      try{
        const r = await fetch('/api/valid_shelves');
        const d = await r.json();
        if(d && d.success && Array.isArray(d.codes)){
          validShelves = d.codes.map(x=>String(x||'').trim().toLowerCase()).filter(Boolean);
        }
      }catch(_){}
    }
    function isValidShelf(code){
      const c = String(code||'').trim().toLowerCase();
      if(!c) return false;
      if(validShelves.length && validShelves.includes(c)) return true;
      return /^(gr[1-5]|or[1-3]|h\d+)/i.test(code);
    }

    /* ─── location helpers ─── */
    function mergeLocations(oldList, newList){
      const map = new Map();
      (oldList||[]).forEach(l => map.set(String(l.location_key||''), Object.assign({}, l)));
      (newList||[]).forEach(l => {
        const key = String(l.location_key||'');
        if(!key) return;
        map.set(key, { location_key: key, code: String(l.code||'').trim(), quantity: Number(l.quantity||0), preview_key: String(l.preview_key||l.code||'').trim() });
      });
      return Array.from(map.values()).sort((a,b)=>{
        const diff = Number(b.quantity||0) - Number(a.quantity||0);
        return diff || String(a.code||'').localeCompare(String(b.code||''));
      });
    }
    function maxQty(row){ const v = Number.parseInt(row&&row.total_available,10); return Number.isFinite(v)&&v>0?v:1; }
    function clampQty(row){
      const m = maxQty(row);
      let q = Number.parseInt(row&&row.scan_qty,10);
      if(!Number.isFinite(q)||q<1) q=1;
      if(q>m) q=m;
      row.scan_qty = q;
      return {qty:q, maxQty:m};
    }
    function syncSel(row){
      if(!row||!Array.isArray(row.locations)) return;
      const cap = Math.max(1, Number.parseInt(row.scan_qty||1,10)||1);
      const locMap = new Map();
      row.locations.forEach(l=>{ const k=String(l.location_key||'').trim(); if(k) locMap.set(k,l); });

      const keys=[], codes=[], seen=new Set();
      const push = k => {
        const key = String(k||'').trim();
        if(!key||seen.has(key)||!locMap.has(key)) return;
        seen.add(key);
        keys.push(key);
        const l = locMap.get(key);
        codes.push(String((l&&l.code)||'').trim());
      };
      const legacy = [];
      if(Array.isArray(row.selected_location_keys)) legacy.push(...row.selected_location_keys);
      if(row.selected_location_key) legacy.push(row.selected_location_key);
      legacy.forEach(push);

      if(!keys.length && row.locations.length===1){
        const only = row.locations[0];
        if(only&&only.location_key){ push(only.location_key); row.selected_preview_key = String(only.preview_key||only.code||'').trim(); }
      }

      row.selected_location_keys   = keys.slice(0,cap);
      row.selected_location_codes  = codes.slice(0,cap);
      row.selected_location_key    = row.selected_location_keys[0]||'';
      row.selected_location_code   = row.selected_location_codes[0]||'';
      if(!row.selected_preview_key && keys.length){
        const fl = locMap.get(row.selected_location_keys[0]);
        row.selected_preview_key = String((fl&&(fl.preview_key||fl.code))||'').trim();
      }
    }
    function totalUnits(){ return queue.reduce((s,r)=>s+Number(r.scan_qty||0),0); }

    /* ─── render queue ─── */
    function render(){
      const units = totalUnits();
      queueCount.textContent = `${units} unit${units===1?'':'s'} across ${queue.length} item${queue.length===1?'':'s'}`;

      if(!queue.length){
        queueBody.innerHTML = '<tr class="empty-row"><td colspan="5">Scan a barcode or load a shelf to get started.</td></tr>';
        return;
      }

      let html = '';
      queue.forEach(row => {
        const {qty, maxQty: mq} = clampQty(row);
        syncSel(row);
        const selKeys  = new Set((row.selected_location_keys||[]).map(v=>String(v||'').trim()).filter(Boolean));
        const selCodes = (row.selected_location_codes||[]).map(v=>String(v||'').trim()).filter(Boolean);
        const needsLoc = selKeys.size===0 && row.locations.length>1;

        const bubblesHtml = row.locations.length
          ? row.locations.map(l=>{
              const k = String(l.location_key||'');
              const sel = selKeys.has(k);
              return `<button type="button" class="loc-bubble${sel?' sel':''}" data-row="${row.uid}" data-lockey="${esc(k)}" title="Tap to select. Tap selected bubble again to preview image.">${esc(l.code)}<span class="bqty">${esc(l.quantity)}</span></button>`;
            }).join('')
          : '<span style="color:#dc2626;font-weight:600;font-size:.8rem">No location</span>';

        const selNote = selCodes.length
          ? `<div class="loc-sel-note">&#x2713; ${esc(selCodes.join(', '))} <button type="button" class="loc-clear-btn" data-clear-sel="${row.uid}">clear</button></div>`
          : '';
        const warnNote = needsLoc ? '<div class="loc-warn">&#9888; Select a source location</div>' : '';

        const img = row.image ? esc(row.image) : noImg();
        const availClass = Number(row.total_available||0)>0 ? 'avail-ok' : 'avail-zero';

        html += `<tr class="${needsLoc?'needs-location':''}">
          <td><div class="item-cell">
            <img class="thumb" src="${img}" onerror="this.src='${noImg()}'">
            <div>
              <div class="item-title">${esc(row.title||row.barcode||'Item')}</div>
              <div class="item-code">${esc(barcodeDisplay(row.barcode_display||row.barcode||''))}</div>
            </div>
          </div></td>
          <td class="qty-cell">
            <div class="qty-wrap">
              <button type="button" class="qty-btn" data-row="${row.uid}" data-adj="-1" ${qty<=1?'disabled':''}>&#x2212;</button>
              <span class="qty-val">${esc(qty)}</span>
              <button type="button" class="qty-btn" data-row="${row.uid}" data-adj="1" ${qty>=mq?'disabled':''}>&#x2B;</button>
            </div>
            <div class="qty-max">max ${esc(mq)}</div>
          </td>
          <td class="loc-cell">
            <div class="loc-bubbles">${bubblesHtml}</div>
            ${warnNote}${selNote}
          </td>
          <td class="avail-cell ${availClass}">${esc(row.total_available||0)}</td>
          <td class="action-cell">
            <button type="button" class="btn-icon" data-remove-row="${row.uid}" title="Remove from queue">&#x2715;</button>
          </td>
        </tr>`;
      });
      queueBody.innerHTML = html;

      queueBody.querySelectorAll('[data-adj]').forEach(btn =>
        btn.addEventListener('click', ()=>adjustQty(Number(btn.dataset.row), Number(btn.dataset.adj||0))));
      queueBody.querySelectorAll('.loc-bubble').forEach(btn =>
        btn.addEventListener('click', ()=>toggleLocation(Number(btn.dataset.row), String(btn.dataset.lockey||''))));
      queueBody.querySelectorAll('[data-clear-sel]').forEach(btn =>
        btn.addEventListener('click', ()=>clearSel(Number(btn.dataset.clearSel))));
      queueBody.querySelectorAll('[data-remove-row]').forEach(btn =>
        btn.addEventListener('click', ()=>removeFromQueue(Number(btn.dataset.removeRow))));
    }

    function adjustQty(uid, delta){
      const row = queue.find(r=>Number(r.uid)===uid);
      if(!row) return;
      const m = maxQty(row);
      let q = (Number.parseInt(row.scan_qty,10)||1) + delta;
      if(q<1) q=1;
      if(q>m){ q=m; setStatus('err',`Max available for this item is ${m}`); }
      else setStatus(null,'');
      row.scan_qty = q;
      syncSel(row);
      render();
      barcodeInput.focus();
    }
    function clearSel(uid){
      const row = queue.find(r=>Number(r.uid)===uid);
      if(!row) return;
      row.selected_location_keys=[]; row.selected_location_codes=[];
      row.selected_location_key=''; row.selected_location_code=''; row.selected_preview_key='';
      syncSel(row); render();
      barcodeInput.focus();
    }
    function toggleLocation(uid, key){
      const row = queue.find(r=>Number(r.uid)===uid);
      if(!row) return;
      clampQty(row); syncSel(row);
      const loc = (row.locations||[]).find(l=>String(l.location_key||'')===String(key||''));
      if(!loc) return;
      const selSet = new Set((row.selected_location_keys||[]).map(v=>String(v||'').trim()).filter(Boolean));
      if(selSet.has(String(key||''))){
        openPreview(loc.preview_key||loc.code||'');
        return;
      }
      const cap = Math.max(1, Number.parseInt(row.scan_qty||1,10)||1);
      if(selSet.size>=cap){ setStatus('err',`Qty is ${cap} — can't select more than ${cap} source location${cap===1?'':'s'}.`); return; }
      const nextKeys = (row.selected_location_keys||[]).slice();
      nextKeys.push(loc.location_key);
      row.selected_location_keys = nextKeys;
      row.selected_location_codes = (row.selected_location_codes||[]).slice();
      row.selected_location_codes.push(loc.code);
      syncSel(row);
      row.selected_preview_key = loc.preview_key||loc.code||'';
      render();
      barcodeInput.focus();
    }
    function removeFromQueue(uid){
      queue = queue.filter(r=>Number(r.uid)!==uid);
      render();
      barcodeInput.focus();
    }

    function rowsMissingLocation(){
      return queue.filter(r=>{ syncSel(r); return !((r.selected_location_keys||[]).length); });
    }
    function buildPayload(){
      return queue.map(r=>({
        barcode: r.barcode,
        from_location: String(((r.selected_location_codes||[])[0]||r.selected_location_code||'')).trim(),
        from_locations: (r.selected_location_codes||[]).map(v=>String(v||'').trim()).filter(Boolean),
        quantity: Number(r.scan_qty||0)||1,
        manifest_ids: []
      }));
    }
    function applyResults(results){
      const warnings = [];
      const next = [];
      queue.forEach((row,idx)=>{
        const rr = results.find(x=>Number(x.index)===idx);
        if(!rr){ next.push(row); warnings.push(`${row.barcode}: no result returned`); return; }
        const moved = Number(rr.moved_qty||0);
        const remain = Math.max(0, Number(row.scan_qty||0)-moved);
        if(remain>0){ row.scan_qty=remain; next.push(row); }
        if(rr.error) warnings.push(`${row.barcode}: ${rr.error}`);
      });
      queue = next;
      render();
      return warnings;
    }

    /* ─── scan / lookup ─── */
    async function lookupAndAdd(rawCode){
      const code = normScan(rawCode);
      if(!code||busy) return;
      busy=true; scanBtn.disabled=true;
      setStatus('neutral',`Looking up ${code}…`);
      try{
        const r = await fetch('/api/movelocation_lookup?barcode='+encodeURIComponent(code));
        const d = await r.json();
        if(!d||!d.success) throw new Error((d&&d.error)||'Lookup failed');
        if(!d.found||!d.item){
          const msg = d.error||`No location found for ${code}`;
          showMsg('Not Found', msg, 'red');
          setStatus('err', msg);
          return;
        }
        const item = d.item;
        const key  = String(item.barcode_key||barcodeKey(item.barcode||code));
        const newLocs = mergeLocations([], Array.isArray(item.locations)?item.locations:[]);
        if(!newLocs.length){
          const msg = `No location code found for ${code}`;
          showMsg('No Location', msg, 'red');
          setStatus('err', msg);
          return;
        }
        let row = queue.find(r=>String(r.barcode_key||'')=== key);
        if(row){
          const prior = Number.parseInt(row.scan_qty||0,10)||0;
          row.scan_qty = prior+1;
          row.title = row.title||item.title||row.barcode;
          row.image = row.image||item.image||'';
          row.locations = mergeLocations(row.locations, newLocs);
          row.total_available = Number(item.total_available!=null?item.total_available:row.total_available||0);
          const {qty,maxQty:mq} = clampQty(row);
          syncSel(row);
          if(qty<=prior){ setStatus('err',`Max available reached (${mq}) for ${item.title||code}`); }
          else { setStatus('ok',`Added ${item.title||code} (qty ${qty})`); }
        } else {
          row = {
            uid:seq++, barcode:String(item.barcode||code),
            barcode_display:String(item.barcode_display||item.barcode||code),
            barcode_key:key, title:String(item.title||item.barcode||code),
            image:String(item.image||''), total_available:Number(item.total_available||0),
            locations:newLocs, scan_qty:1,
            selected_location_keys:[], selected_location_codes:[],
            selected_location_key:'', selected_location_code:'', selected_preview_key:''
          };
          clampQty(row); syncSel(row);
          queue.unshift(row);
          setStatus('ok',`Added ${row.title||code}`);
        }
        render();
      }catch(err){
        showMsg('Lookup Error', err.message||'Lookup failed', 'red');
        setStatus('err', err.message||'Lookup failed');
      }finally{
        busy=false; scanBtn.disabled=false;
        barcodeInput.value=''; barcodeInput.focus();
      }
    }

    /* ─── load shelf ─── */
    async function loadShelf(rawShelf){
      const shelf = String(rawShelf||'').trim();
      if(!shelf||busy) return;
      if(!isValidShelf(shelf)){
        const msg = `"${shelf}" is not a recognised shelf code.`;
        showMsg('Invalid Shelf', msg, 'red');
        setStatus('err', msg);
        shelfInput.focus();
        return;
      }
      if(queue.length && !confirm(`Replace current queue with all items from shelf "${shelf}"?`)){
        shelfInput.focus(); return;
      }
      busy=true; loadShelfBtn.disabled=true;
      setStatus('neutral',`Loading items from shelf ${shelf}…`);
      try{
        const r = await fetch('/api/movelocation_lookup_shelf?shelf='+encodeURIComponent(shelf));
        const d = await r.json();
        if(!d||!d.success) throw new Error((d&&d.error)||'Shelf lookup failed');
        const items = Array.isArray(d.items)?d.items:[];
        if(!d.found||!items.length){
          queue=[]; render();
          const msg = d.error||`No items found on shelf ${shelf}`;
          showMsg('Shelf Empty', msg, 'blue');
          setStatus('err', msg);
          return;
        }
        const next = [];
        items.forEach(item=>{
          const locs = mergeLocations([], Array.isArray(item.locations)?item.locations:[]);
          const avail = Math.max(0, Number.parseInt(item.total_available,10)||0);
          if(!locs.length||avail<=0) return;
          const row = {
            uid:seq++, barcode:String(item.barcode||''),
            barcode_display:String(item.barcode_display||item.barcode||''),
            barcode_key:String(item.barcode_key||barcodeKey(item.barcode||'')),
            title:String(item.title||item.barcode||'Item'),
            image:String(item.image||''), total_available:avail,
            locations:locs, scan_qty:avail,
            selected_location_keys:[], selected_location_codes:[],
            selected_location_key:'', selected_location_code:'', selected_preview_key:''
          };
          clampQty(row); syncSel(row);
          next.push(row);
        });
        if(!next.length){ queue=[]; render(); showMsg('Nothing Movable', `No movable inventory found on shelf ${shelf}.`, 'blue'); setStatus('err','No movable inventory found'); return; }
        queue = next;
        render();
        const units = totalUnits();
        setStatus('ok', `Loaded ${queue.length} item(s), ${units} unit(s) from ${shelf}.`);
      }catch(err){
        showMsg('Shelf Error', err.message||'Shelf lookup failed', 'red');
        setStatus('err', err.message||'Shelf lookup failed');
      }finally{
        busy=false; loadShelfBtn.disabled=false;
        shelfInput.value=''; barcodeInput.focus();
      }
    }

    /* ─── Move flow ─── */
    function openDestModal(){
      if(!queue.length){ showMsg('No Items', 'Add items to the queue first.', 'blue'); return; }
      const missing = rowsMissingLocation();
      if(missing.length){
        showMsg('Select Source Location', `Please select a source location for:\n\n${missing.map(r=>barcodeDisplay(r.barcode_display||r.barcode||'')).join('\n')}`, 'red');
        setStatus('err','Select source location for all queued items');
        return;
      }
      destInput.value=''; destHint.textContent='';
      destModal.classList.add('open');
      destInput.focus();
    }
    function closeDestModal(){ destModal.classList.remove('open'); destInput.value=''; barcodeInput.focus(); }

    async function submitMove(){
      if(busy) return;
      const dest = String(destInput.value||'').trim();
      if(!dest){ destInput.focus(); destHint.textContent='Enter a destination shelf code.'; return; }
      const missing = rowsMissingLocation();
      if(missing.length){ closeDestModal(); showMsg('Select Source Location','Select source locations first.','red'); return; }
      const payload = buildPayload();
      if(!payload.length) return;

      busy=true; destConfirmBtn.disabled=true;
      destHint.textContent=`Moving ${payload.length} row(s) to ${dest}…`;
      try{
        const r = await fetch('/api/movelocation_execute',{
          method:'POST', headers:{'Content-Type':'application/json'},
          body:JSON.stringify({to_location:dest, items:payload})
        });
        const d = await r.json();
        if(!r.ok||!d||!d.success) throw new Error((d&&d.error)||'Move failed');
        const warnings = applyResults(Array.isArray(d.item_results)?d.item_results:[]);
        closeDestModal();
        const movedUnits = Number(d.moved_units||0);
        const movedItems = Number(d.moved_items||0);
        setStatus('ok',`Moved ${movedUnits} unit(s) across ${movedItems} item(s) to ${dest}.`);
        if(warnings.length||Number(d.skipped_items||0)>0){
          showMsg('Move completed with warnings', `Moved ${movedUnits} unit(s).\nSkipped: ${d.skipped_items||0}.\n\n${warnings.join('\n')}`, 'blue');
        }
      }catch(err){
        destHint.textContent='';
        showMsg('Move Failed', err.message||'Move failed', 'red');
        setStatus('err', err.message||'Move failed');
      }finally{
        busy=false; destConfirmBtn.disabled=false;
      }
    }

    /* ─── Remove flow ─── */
    function openRemoveConfirm(){
      if(!queue.length){ showMsg('No Items', 'Add items to the queue first.', 'blue'); return; }
      const missing = rowsMissingLocation();
      if(missing.length){
        showMsg('Select Source Location', `Please select a source location for:\n\n${missing.map(r=>barcodeDisplay(r.barcode_display||r.barcode||'')).join('\n')}`, 'red');
        setStatus('err','Select source location for all queued items');
        return;
      }
      const rows  = queue.length;
      const units = totalUnits();
      confirmTitle.textContent   = 'Remove from Inventory';
      confirmIcon.textContent    = '🗑️';
      confirmHeading.textContent = `Remove ${units} unit${units===1?'':'s'} from warehouse inventory?`;
      confirmBody.textContent    = 'This will zero out the quantity and clear the location code for each selected item. The action is logged in Rack History.';
      confirmDetail.innerHTML    = `<div class="confirm-detail-row"><span>Items</span><span>${rows}</span></div><div class="confirm-detail-row"><span>Units</span><span>${units}</span></div>`;
      confirmOkBtn.textContent   = 'Yes, Remove';
      confirmOkBtn.className     = 'btn btn-red';
      confirmModal.classList.add('open');
      confirmOkBtn.onclick       = submitRemove;
    }

    async function submitRemove(){
      if(busy) return;
      confirmModal.classList.remove('open');
      const payload = buildPayload();
      if(!payload.length) return;
      busy=true; removeBtn.disabled=true;
      setStatus('neutral',`Removing ${payload.length} row(s) from inventory…`);
      try{
        const r = await fetch('/api/movelocation_execute',{
          method:'POST', headers:{'Content-Type':'application/json'},
          body:JSON.stringify({clear_location:true, items:payload})
        });
        const d = await r.json();
        if(!r.ok||!d||!d.success) throw new Error((d&&d.error)||'Remove failed');
        const warnings = applyResults(Array.isArray(d.item_results)?d.item_results:[]);
        const mu = Number(d.moved_units||0);
        const mi = Number(d.moved_items||0);
        setStatus('ok',`Removed ${mu} unit(s) across ${mi} item(s) from inventory.`);
        if(warnings.length||Number(d.skipped_items||0)>0){
          showMsg('Remove completed with warnings', `Removed ${mu} unit(s).\nSkipped: ${d.skipped_items||0}.\n\n${warnings.join('\n')}`, 'red');
        }
      }catch(err){
        showMsg('Remove Failed', err.message||'Remove failed', 'red');
        setStatus('err', err.message||'Remove failed');
      }finally{
        busy=false; removeBtn.disabled=false;
        barcodeInput.focus();
      }
    }

    /* ─── event wiring ─── */
    barcodeInput.addEventListener('keydown', e=>{ if(e.key==='Enter'){ e.preventDefault(); const c=barcodeInput.value.trim(); if(c) lookupAndAdd(c); }});
    scanBtn.addEventListener('click', ()=>{ const c=barcodeInput.value.trim(); if(c) lookupAndAdd(c); });
    shelfInput.addEventListener('keydown', e=>{ if(e.key==='Enter'){ e.preventDefault(); const s=shelfInput.value.trim(); if(s) loadShelf(s); }});
    loadShelfBtn.addEventListener('click', ()=>{ const s=shelfInput.value.trim(); if(s) loadShelf(s); });

    moveBtn.addEventListener('click', openDestModal);
    destInput.addEventListener('keydown', e=>{ if(e.key==='Enter'){ e.preventDefault(); submitMove(); }});
    destConfirmBtn.addEventListener('click', submitMove);
    destCancelBtn.addEventListener('click', closeDestModal);
    destModalClose.addEventListener('click', closeDestModal);
    destModal.addEventListener('click', e=>{ if(e.target===destModal) closeDestModal(); });

    removeBtn.addEventListener('click', openRemoveConfirm);
    confirmCancelBtn.addEventListener('click', ()=>{ confirmModal.classList.remove('open'); barcodeInput.focus(); });
    confirmModalClose.addEventListener('click', ()=>{ confirmModal.classList.remove('open'); barcodeInput.focus(); });
    confirmModal.addEventListener('click', e=>{ if(e.target===confirmModal){ confirmModal.classList.remove('open'); barcodeInput.focus(); }});

    clearQueueBtn.addEventListener('click', ()=>{
      if(!queue.length) return;
      if(!confirm(`Clear all ${queue.length} item(s) from the queue?`)) return;
      queue=[]; render();
      setStatus('ok','Queue cleared.');
      barcodeInput.focus();
    });

    document.getElementById('backBtn').addEventListener('click', ()=>{
      if(window.history.length>1) window.history.back();
      else window.location.href='/';
    });

    /* ─── init ─── */
    async function init(){
      await loadValidShelves();
      render();
      barcodeInput.focus();
    }
    init();
  </script>
</body>
</html>
