function renderReadyToShipOrderLocationHtml(loc, options = {}) {
    const emptyMessage = String((options && options.emptyMessage) || '').trim();
    if (!loc) {
        return emptyMessage
            ? `<div class="popup-muted" style="font-size:0.95em;">${esc(emptyMessage)}</div>`
            : '';
    }

    let content = '';

    if (Array.isArray(loc)) {
        content += `<div class="popup-loc-banner" style="font-size: 0.98rem; margin-bottom: 12px; font-weight: 500;">Multiple Locations:</div>`;

        const groups = {
            hallway: [],
            office: [],
            garage: [],
            other: []
        };

        loc.forEach(location => {
            const locCode = (location.code || '').toLowerCase();
            if (locCode.startsWith('h')) {
                groups.hallway.push(location);
            } else if (locCode.startsWith('o')) {
                groups.office.push(location);
            } else if (locCode.startsWith('g')) {
                groups.garage.push(location);
            } else {
                groups.other.push(location);
            }
        });

        ['hallway', 'office', 'garage', 'other'].forEach(groupName => {
            if (groups[groupName].length === 0) return;

            const groupTitle = groupName.charAt(0).toUpperCase() + groupName.slice(1);
            content += `<div style="margin-bottom: 16px;">`;
            content += `<div class="popup-group-title" style="font-size: 0.95rem; font-weight: 600; margin-bottom: 8px;">${groupTitle}:</div>`;

            groups[groupName].forEach((location) => {
                const rawCode = location.code || '';
                const rawImage = location.image || location.code || '';
                const locCode = esc(rawCode);
                const qty = location.quantity || 1;

                content += `<div style="margin-left: 12px; margin-bottom: 8px;">`;
                content += `<button type="button" class="popup-link rt-location-open" data-location-code="${esc(rawCode)}" data-preview-key="${esc(rawImage)}" data-preview-index="0" onclick="event.stopPropagation();event.preventDefault();openLocationMediaPreview(this.dataset.locationCode,this.dataset.previewKey,this.dataset.previewIndex);return false;" style="cursor:pointer;text-decoration:underline;font-weight:600;background:none;border:none;padding:0;color:#fff;">${locCode}</button>`;
                content += ` <span class="popup-qty" style="font-size: 0.9rem;">(Qty: ${qty})</span>`;
                content += readyToShipLocationPreviewHtml(rawCode, rawImage);
                content += `</div>`;
            });

            content += `</div>`;
        });
        return content;
    }

    const rawLoc = String(loc || '');
    content += `<div class="popup-loc-line" style="font-size: 0.98rem; margin-bottom: 12px; font-weight: 500;">Location: <button type="button" class="popup-link rt-location-open" data-location-code="${esc(rawLoc)}" data-preview-key="${esc(rawLoc)}" data-preview-index="0" onclick="event.stopPropagation();event.preventDefault();openLocationMediaPreview(this.dataset.locationCode,this.dataset.previewKey,this.dataset.previewIndex);return false;" style="cursor:pointer;text-decoration:underline;background:none;border:none;padding:0;color:#fff;font-weight:600;">${esc(rawLoc)}</button></div>`;
    content += readyToShipLocationPreviewHtml(rawLoc, rawLoc);
    return content;
}

function showOrderPopup(order, options = {}) {
    const oldPopup = document.getElementById('order-popup');
    if (oldPopup) oldPopup.remove();
    const focusPrep = !!(options && options.focusPrep);
    const popupMode = String((options && options.mode) || 'title').trim().toLowerCase();
    const isInfoMode = popupMode === 'info';
    const isLocMode = popupMode === 'loc';
    const isTitleMode = !isInfoMode && !isLocMode;

    const overlay = document.createElement('div');
    overlay.id = 'order-popup';
    overlay.className = 'order-popup-overlay';
    overlay.style.cssText = `
        position: fixed;
        top: 0;
        left: 0;
        width: 100vw;
        height: 100vh;
        background: rgba(0,0,0,0.6);
        backdrop-filter: blur(4px);
        display: flex;
        align-items: center;
        justify-content: center;
        z-index: 9999;
        animation: fadeIn 0.2s ease;
    `;
    overlay.onclick = (e) => { if (e.target === overlay) overlay.remove(); };

    const popup = document.createElement('div');
    popup.className = 'order-popup-card';
    popup.style.cssText = `
        border-radius: 16px;
        padding: 28px 24px;
        max-width: min(820px, 94vw);
        max-height: 80vh;
        overflow-y: auto;
        text-align: center;
        position: relative;
        animation: slideUp 0.3s ease;
    `;
    popup.onclick = (e) => e.stopPropagation();

    const missingDataUrlPopup = 'data:image/svg+xml;utf8,' + encodeURIComponent('<svg xmlns="http://www.w3.org/2000/svg" width="360" height="220"><rect width="100%" height="100%" fill="#1e293b"/><text x="50%" y="50%" dominant-baseline="middle" text-anchor="middle" fill="#475569" font-size="18">Image missing</text></svg>');
    const title = order && order.title ? order.title : '';
    const imageUrl = order ? (order.image || order.image_url) : '';
    const buyer = order && order.shipping_name ? order.shipping_name : '';
    const address = order ? [order.shipping_street1, order.shipping_street2, order.shipping_city, order.shipping_state, order.shipping_postal_code, order.shipping_country].filter(Boolean).join(' ') : '';
    const price = order && order.price ? `$${parseFloat(order.price).toFixed(2)}` : '';
    const paidTime = order && order.paid_time ? fmtET(order.paid_time) : '';
    const barcode = order && order.barcode ? order.barcode : '';
    const loc = order ? (order.locations || order.location) : null;
    const prepSummary = order && order.prep_alert_summary ? order.prep_alert_summary : null;

    let content = '';

    if (isTitleMode && title) {
        content += `<div style="font-weight: bold; font-size: 1.1rem; margin-bottom: 12px;">${esc(title)}</div>`;
    }

    if (isTitleMode && imageUrl) {
        content += `<img src="${esc(imageUrl)}" alt="${esc(title || 'Order')}" class="popup-image" style="max-width: 100%; border-radius: 12px; margin-bottom: 18px;">`;
    }

    if (isTitleMode && barcode) {
        content += `<div class="popup-muted" style="font-size: 0.9rem; margin-bottom: 12px;"><strong>Barcode:</strong> ${esc(formatUpcDisplay(barcode))}</div>`;
    }

    if (isInfoMode) {
        content += renderReadyToShipOrderInfoHtml(buyer, address, price, paidTime);
    }

    if (isTitleMode && barcode) {
        const prepVisible = !!(focusPrep || (prepSummary && prepSummary.has_alerts));
        content += `
            <div class="rt-prep-section" style="${prepVisible ? '' : 'display:none;'}">
                <div class="popup-group-title" style="font-size:1rem;font-weight:700;">Prep Notes / Defects</div>
                <div class="popup-muted" style="margin-top:4px;">Shows the newest most relevant items-to-list entries first, then older related rows.</div>
                <div data-prep-host style="margin-top:6px;">${prepVisible ? '<div class="rt-prep-loading">Loading prep notes and defects...</div>' : ''}</div>
            </div>
        `;
    }

    if (isLocMode) {
        content += renderReadyToShipOrderLocationHtml(loc, { emptyMessage: 'No location photos available.' });
    } else if (isTitleMode) {
        content += renderReadyToShipOrderLocationHtml(loc);
    }

    popup.innerHTML = content + `
        ${isTitleMode ? `
        <div data-order-stats style="
            margin-top: 18px;
            font-size: 0.92rem;
            color: #94a3b8;
            line-height: 1.55;
        ">
            <div><strong>In warehouse:</strong> ...</div>
            <div><strong>total from macy:</strong> ...</div>
        </div>
        ` : ''}
        <button class="popup-close-btn" onclick="this.closest('#order-popup').remove()" style="
            margin-top: 16px;
            color: #fff;
            border: none;
            padding: 10px 24px;
            font-size: 1rem;
            cursor: pointer;
        ">
            Close
        </button>
    `;

    overlay.appendChild(popup);
    document.body.appendChild(overlay);

    const prepHost = popup.querySelector('[data-prep-host]');
    if (prepHost && barcode) {
        loadReadyToShipPrepContext(order, prepHost, focusPrep);
    }
    const orderStatsHost = popup.querySelector('[data-order-stats]');
    if (orderStatsHost) {
        loadReadyToShipOrderStats(order, orderStatsHost);
    }
}

// Friendly Eastern Time formatter used across pages
function fmtET(ts){
    try{
        if(!ts) return '';
        const d = new Date(ts);
        if(isNaN(d.getTime())) return String(ts);
        const parts = new Intl.DateTimeFormat('en-US', { timeZone: 'America/New_York', year:'numeric', month:'2-digit', day:'2-digit', hour:'numeric', minute:'2-digit', hour12:true }).formatToParts(d);
        const vals = {}; parts.forEach(p=> vals[p.type] = p.value);
        const year = vals.year || d.getFullYear(); const month = vals.month || String(d.getMonth()+1).padStart(2,'0'); const day = vals.day || String(d.getDate()).padStart(2,'0');
        let hour = vals.hour || String(d.getHours()).padStart(2,'0'); let minute = vals.minute || String(d.getMinutes()).padStart(2,'0'); const ampm = (vals.dayPeriod||'').toLowerCase(); hour = String(hour).replace(/^0/, '');
        return `${year}-${month}-${day} ${hour}:${minute}${ampm}`;
    }catch(e){ return String(ts); }
}
