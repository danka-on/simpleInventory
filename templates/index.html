<!DOCTYPE html>
<html lang="en">
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="icon" type="image/png" href="{{ url_for('static', filename='favicon.ico') }}">
    <link rel="preconnect" href="https://cdnjs.cloudflare.com">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" media="print" onload="this.media='all'">
    <noscript><link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css"></noscript>
    <link rel="apple-touch-icon" href="{{ url_for('static', filename='apple-touch-icon.png') }}">
    <title>Sweet Shelves</title>
    <style>
        :root {
            --primary: #0984e3;
            --accent: #00b894;
            --bg: #f9f9f9;
            --card: #fff;
            --border: #e0e0e0;
            --radius: 14px;
            --success: #4caf50;
            --success-light: #e8f5e9;
        }
        
        @keyframes slideOutRight {
            to {
                transform: translateX(100%);
                opacity: 0;
                height: 0;
                padding-top: 0;
                padding-bottom: 0;
                margin-bottom: 0;
                border-width: 0;
            }
        }
        
        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }
        
        @keyframes slideIn {
            from {
                transform: translateX(100%);
                opacity: 0;
            }
            to {
                transform: translateX(0);
                opacity: 1;
            }
        }
        
        @keyframes slideOut {
            from {
                transform: translateX(0);
                opacity: 1;
            }
            to {
                transform: translateX(100%);
                opacity: 0;
            }
        }
        
        @keyframes slideUp {
            from {
                transform: translateY(20px);
                opacity: 0;
            }
            to {
                transform: translateY(0);
                opacity: 1;
            }
        }
        
        .tab-button {
            background: none;
            border: none;
            padding: 10px 20px;
            font-size: 1em;
            cursor: pointer;
            border-bottom: 3px solid transparent;
            transition: all 0.3s ease;
            font-weight: 600;
            color: #666;
        }
        
        .tab-button.active {
            color: var(--primary);
            border-bottom-color: var(--primary);
        }
        
        .tab-content {
            display: none;
            animation: fadeIn 0.3s ease-in-out;
        }
        
        .tab-content.active {
            display: block;
        }
        
        .completed-row {
            background-color: var(--success-light) !important;
            transition: all 0.3s ease;
        }
        
        .slide-out {
            animation: slideOutRight 0.5s forwards;
            overflow: hidden;
            transition: all 0.5s ease;
        }

        /* Loading overlay */
        .page-loading-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,0.5);z-index:99999;align-items:center;justify-content:center}
        .page-loading-overlay.active{display:flex}
        .loading-spinner-large{border:4px solid #f3f3f3;border-top:4px solid #00b894;border-radius:50%;width:50px;height:50px;animation:spin 1s linear infinite}

        /* Refresh button */
        @keyframes spin { to { transform: rotate(360deg); } }
        .refresh-btn {
            width: 32px; height: 32px; border-radius: 50%; border: none;
            background: #f0f0f0; cursor: pointer; display: flex;
            align-items: center; justify-content: center; transition: background 0.2s;
        }
        .refresh-btn:hover { background: #e0e0e0; }
        .refresh-btn.spinning i { animation: spin 0.8s linear; }

        /* Days confirm button */
        .days-confirm-btn {
            width: 26px; height: 26px; border-radius: 50%; border: none;
            background: var(--success); color: #fff; cursor: pointer;
            display: none; align-items: center; justify-content: center;
            font-size: 0.75rem; transition: opacity 0.2s, transform 0.2s;
        }
        .days-confirm-btn.visible { display: inline-flex; }
        .days-confirm-btn:hover { transform: scale(1.1); }

        /* Status buttons */
        .status-btn {
            border: none; color: #fff; padding: 6px 14px; border-radius: 20px;
            font-size: 0.8rem; cursor: pointer; transition: all 0.2s;
            display: inline-flex; align-items: center; justify-content: center; gap: 4px;
        }
        .status-btn:hover { filter: brightness(1.1); transform: scale(1.05); }
        .status-btn:disabled { opacity: 0.5; cursor: not-allowed; transform: none; }
        .status-btn-done { background: var(--success); }
        .status-btn-undo { background: #ff9800; }

        /* Table header class */
        .orders-th {
            padding: 8px; border-bottom: 2px solid #e0e0e0; font-size: 0.85rem;
        }

        /* Completed tab styling */
        #completed-orders-table thead tr { background: #e8f5e9 !important; }
        #completed-orders-table tbody tr {
            border-left: 3px solid var(--success);
        }
        .token-banner {
            background: #d32f2f;
            color: #fff;
            text-align: center;
            padding: 14px 16px;
            font-weight: 700;
            font-size: 1.05rem;
            position: sticky;
            top: 0;
            z-index: 10001;
            box-shadow: 0 4px 8px rgba(0,0,0,0.2);
            border-bottom: 3px solid #b71c1c;
            display: none;
        }
        .token-banner .token-item {
            display: inline-block;
            margin: 0 12px;
        }
        .testing-banner {
            background: #ff9800;
            color: #fff;
            text-align: center;
            padding: 12px 16px;
            font-weight: 700;
            font-size: 1.1rem;
            position: sticky;
            top: 0;
            z-index: 10000;
            box-shadow: 0 4px 8px rgba(0,0,0,0.15);
            letter-spacing: 0.5px;
            border-bottom: 3px solid #f57c00;
        }
        body {
            font-family: 'Segoe UI', Arial, sans-serif;
            background: var(--bg);
            margin: 0;
            padding: 0;
            min-height: 100vh;
            opacity: 1;
        }
        .container {
            max-width: 480px;
            margin: 0 auto;
            padding: 16px 8px 80px 8px;
        }
        h1, h2 {
            margin: 0 0 18px 0;
            font-weight: 600;
        }
        .main-actions {
            display: flex;
            flex-direction: column;
            gap: 10px;
            margin-bottom: 32px;
        }
        .main-actions button, .main-actions a > button {
            border: none;
            cursor: pointer;
            transition: all 0.2s;
        }
        .main-actions .main-btn {
            width: 100%;
            font-size: 1.15rem;
            padding: 16px 0;
            color: #fff;
            border-radius: var(--radius);
            box-shadow: 0 2px 8px rgba(0,0,0,0.04);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }
        /* Per-button hover variants: lighter shade for main buttons, darker for tools */
        .btn-lighten:hover { filter: brightness(1.06); transition: filter 0.15s ease; }
        .btn-darken:hover { filter: brightness(0.92); transition: filter 0.15s ease; }
        .section-card {
            background: var(--card);
            border-radius: var(--radius);
            box-shadow: 0 2px 8px rgba(0,0,0,0.04);
            padding: 18px 12px 12px 12px;
            margin-bottom: 24px;
            border: 1px solid var(--border);
        }
        #sold-orders-table {
            border-collapse: collapse;
            width: 100%;
            margin-bottom: 10px;
        }
        #sold-orders-table, #sold-orders-table th, #sold-orders-table td {
            border: 1px solid #bbb;
        }
        #sold-orders-table th, #sold-orders-table td {
            padding: 6px 8px;
            background: #fff;
        }
        #sold-orders-table th {
            background: #f0f0f0;
        }
        #sold-orders-table tr.handled {
            text-decoration: line-through;
            background: #e0e0e0;
            opacity: 0.6;
        }
        .sold-td-small {
            font-size: 12px;
            max-width: 120px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            cursor: pointer;
        }
        .sold-popup {
            display: none;
            position: fixed;
            z-index: 9999;
            left: 50%;
            top: 50%;
            transform: translate(-50%, -50%);
            background: #fff;
            border: 2px solid #333;
            border-radius: 8px;
            padding: 20px;
            box-shadow: 0 2px 16px rgba(0,0,0,0.3);
            max-width: 90vw;
            max-height: 70vh;
            overflow: auto;
            font-size: 16px;
        }
        .sold-popup-close {
            float: right;
            font-size: 22px;
            font-weight: bold;
            color: #333;
            cursor: pointer;
            margin-left: 10px;
        }
        html.ss-theme-night .sold-popup {
            background: #1e293b;
            color: #e2e8f0;
            border-color: rgba(255,255,255,0.1);
            box-shadow: 0 12px 30px rgba(0,0,0,0.45);
        }
        html.ss-theme-night .sold-popup-close { color: #e2e8f0; }
        .order-popup-overlay { }
        .order-popup-card {
            background: #fff;
            border-radius: 14px;
            color: #111;
            border: 1px solid #e5e7eb;
        }
        .order-popup-card .popup-muted { color: #666; }
        .order-popup-card .popup-divider { border-top-color: #e0e0e0; }
        .order-popup-card .popup-group-title { color: #2c3e50; }
        .order-popup-card .popup-link { color: #0984e3; }
        .order-popup-card .popup-qty { color: #666; }
        .order-popup-card .popup-loc-banner { color: #e53935; }
        .order-popup-card .popup-image,
        .order-popup-card .popup-loc-image {
            background: #f8f8f8;
            border: 1px solid #e5e7eb;
        }
        html.ss-theme-night .order-popup-card {
            background: #1e293b !important;
            color: #e2e8f0 !important;
            border-color: rgba(255,255,255,0.1) !important;
            box-shadow: 0 12px 30px rgba(0,0,0,0.45) !important;
        }
        html.ss-theme-night .order-popup-card .popup-muted { color: #94a3b8 !important; }
        html.ss-theme-night .order-popup-card .popup-divider { border-top-color: rgba(255,255,255,0.12) !important; }
        html.ss-theme-night .order-popup-card .popup-group-title { color: #e2e8f0 !important; }
        html.ss-theme-night .order-popup-card .popup-link { color: #7dd3fc !important; }
        html.ss-theme-night .order-popup-card .popup-qty { color: #94a3b8 !important; }
        html.ss-theme-night .order-popup-card .popup-loc-banner { color: #fca5a5 !important; }
        html.ss-theme-night .order-popup-card .popup-image,
        html.ss-theme-night .order-popup-card .popup-loc-image {
            background: #0f172a;
            border-color: rgba(255,255,255,0.12);
        }
        html.ss-theme-night .order-popup-card .popup-close-btn {
            background: #334155 !important;
            color: #e2e8f0 !important;
        }
        html.ss-theme-night .order-popup-card .popup-close-btn:hover {
            background: #475569 !important;
        }
        .tools-section {
            background: var(--card);
            border-radius: var(--radius);
            box-shadow: 0 2px 8px rgba(0,0,0,0.04);
            padding: 14px 12px 10px 12px;
            border: 1px solid var(--border);
            margin-bottom: 18px;
        }
        .tools-section h3 {
            margin: 0 0 10px 0;
            font-size: 1.1rem;
            color: #555;
            font-weight: 500;
        }
        .tools-row {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }
        .tools-row label {
            font-size: 0.98rem;
            color: #444;
        }
        @media (max-width: 600px) {
            .container {
                padding: 8px 2vw 80px 2vw;
            }
            .main-actions button, .main-actions a > button {
                font-size: 1.05rem;
                padding: 14px 0;
            }
            .section-card, .tools-section {
                padding: 10px 4px 8px 4px;
            }
        }
    </style>
</head>
<body>
    <div class="token-banner" id="tokenBanner"></div>
    {% if is_testing_server %}
    <div class="testing-banner">
        ⚠️ TESTING SERVER - {{ server_hostname }} ⚠️
    </div>
    {% endif %}
    <div id="pageLoadingOverlay" class="page-loading-overlay"><div class="loading-spinner-large"></div></div>
    <div class="container">

        <div style="display:flex;justify-content:center;align-items:center;margin:6px 0 12px 0;color:#0ea5e9;">
            <span style="display:inline-flex;align-items:center;gap:8px;font-weight:700;">
                <i class="fas fa-star" style="font-size:1.05rem;"></i>
            </span>
        </div>

        <div class="main-actions" style="margin-bottom:12px;">
            <a href="/store-manager" style="text-decoration:none; width: 100%;">
                <button type="button" class="btn-lighten main-btn" style="background:linear-gradient(135deg,#0ea5e9 0%,#22c55e 100%);box-shadow:0 8px 20px rgba(16,185,129,0.35);letter-spacing:0.4px;">
                    <span style="font-size:1.2rem">🏪</span> <span data-i18n="store_manager">Store Manager</span>
                </button>
            </a>
            <a href="/marketplace-session" style="text-decoration:none; width: 100%;">
                <button type="button" class="btn-lighten main-btn" style="background:#1877f2;">
                    <span style="font-size:1.1rem">💵</span> <span data-i18n="marketplace_sale">Marketplace Sale</span>
                </button>
            </a>
            
        </div>

        <div style="height:1px;background:var(--border);margin:10px 0;border-radius:2px"></div>
        <div style="display:flex;justify-content:center;align-items:center;margin:6px 0 12px 0;">
            <span style="display:inline-flex;align-items:center;justify-content:center;width:32px;height:32px;border-radius:999px;background:rgba(52,152,219,0.18);color:#3498db;">
                <i class="fas fa-warehouse" style="font-size:1.05rem;"></i>
            </span>
        </div>

        <div class="main-actions" style="margin-top: 18px;">
            <form method="GET" action="/position" style="margin:0; width: 100%;">
                <button type="submit" class="btn-lighten main-btn" style="background:#27ae60;">
                    <span style="font-size:1.2rem">➕</span>
                    <span data-i18n="add_item_to_shelf">Add Item</span>
                </button>
            </form>

            <a href="/searchrack" style="text-decoration:none; width: 100%;">
                <button type="button" class="btn-lighten main-btn" style="background:#0f766e;">
                    <span style="font-size:1.2rem">📦</span>
                    <span data-i18n="warehouse">Warehouse</span>
                </button>
            </a>

            <div style="height:1px;background:var(--border);margin:8px 0;border-radius:2px"></div>

            <a href="/item-prep" style="text-decoration:none; width: 100%;">
                <button type="button" class="btn-lighten main-btn" style="background:#7B3F00;">
                    <i class="fas fa-diagnoses"></i> <span data-i18n="preparation">Preparation</span>
                </button>
            </a>
        </div>

        
    </div>


<script>
(function checkTokenStatus() {
    fetch('/api/token-status')
        .then(r => r.json())
        .then(data => {
            const problems = [];
            if (data.ebay === 'expired') problems.push('<span class="token-item">eBay token expired — re-authorize in Developer Portal</span>');
            if (data.amazon === 'expired') problems.push('<span class="token-item">Amazon token expired — re-authorize in Seller Central</span>');
            const banner = document.getElementById('tokenBanner');
            if (problems.length) {
                banner.innerHTML = '\u26a0\ufe0f ' + problems.join(' | ');
                banner.style.display = 'block';
            } else {
                banner.style.display = 'none';
            }
        })
        .catch(() => {});
    setTimeout(checkTokenStatus, 10 * 60 * 1000);
})();
</script>
<script src="/static/i18n.js"></script>
</body>
</html>
