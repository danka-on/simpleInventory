<!DOCTYPE html>
<html>
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="icon" type="image/png" href="{{ url_for('static', filename='favicon.ico') }}">
    <link rel="apple-touch-icon" href="{{ url_for('static', filename='apple-touch-icon.png') }}">
    <title>Sweet Shelves</title>
    <style>
        body {
            font-family: sans-serif;
            max-width: 600px;
            margin: auto;
            padding: 10px;
        }
        img {
            width: 100%;
            border: 1px solid #ccc;
            margin-top: 20px;
        }
        </style>
</head>
<body>
    <h1>Search Inventory</h1>
    <form method="POST" action="/search">
    <input type="text" name="query" placeholder="Enter item name or ID" required>
    <button type="submit">Search</button>
    </form>

    {% if search_result %}
        <h2>Result:</h2>
        <p>{{ search_result }}</p>
    {% endif %}

    <h1>Select a Shelf</h1>

    <form method="GET" action="/">
        <select name="shelf">
            <option value="shelf 1">Shelf 1</option>
            <option value="shelf 2">Shelf 2</option>
            <option value="shelf 3">Shelf 3</option>
            <option value="shelf 4">Shelf 4</option>
            <option value="shelf top">Shelf Top</option>
        </select>
        <button type="submit">Highlight</button>
    </form>

    {% if shelf %}
    <img src="{{ url_for('highlight') }}?shelf={{ shelf }}" alt="shelfHighlighter">
    {% endif %}

<h2>Scan Barcode</h2>
<div id="reader" style="width:100%"></div>


<script src="https://unpkg.com/html5-qrcode"></script>
<script>
    function onScanSuccess(decodedText, decodedResult) {
        console.log(`Code scanned: ${decodedText}`);
        // Auto-fill and submit the search form
        document.querySelector("input[name='query']").value = decodedText;
        document.querySelector("form[method='POST']").submit();
    }

    const html5QrCode = new Html5Qrcode("reader");
    Html5Qrcode.getCameras().then(devices => {
        if (devices && devices.length) {
            html5QrCode.start(
                devices[0].id,
                { fps: 10, qrbox: { width: 250, height: 100 } },
                onScanSuccess
            );
        }
    }).catch(err => {
        console.error("Camera error:", err);
    });
</script>

</body>
</html>
