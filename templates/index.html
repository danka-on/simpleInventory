<!DOCTYPE html>
<html lang="en">
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="icon" type="image/png" href="{{ url_for('static', filename='favicon.ico') }}">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <link rel="apple-touch-icon" href="{{ url_for('static', filename='apple-touch-icon.png') }}">
    <title>Sweet Shelves</title>
    <style>
        :root {
            --primary: #0984e3;
            --accent: #00b894;
            --bg: #f9f9f9;
            --card: #fff;
            --border: #e0e0e0;
            --radius: 14px;
            --success: #4caf50;
            --success-light: #e8f5e9;
        }
        
        @keyframes slideOutRight {
            to {
                transform: translateX(100%);
                opacity: 0;
                height: 0;
                padding-top: 0;
                padding-bottom: 0;
                margin-bottom: 0;
                border-width: 0;
            }
        }
        
        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }
        
        .tab-button {
            background: none;
            border: none;
            padding: 10px 20px;
            font-size: 1em;
            cursor: pointer;
            border-bottom: 3px solid transparent;
            transition: all 0.3s ease;
            font-weight: 600;
            color: #666;
        }
        
        .tab-button.active {
            color: var(--primary);
            border-bottom-color: var(--primary);
        }
        
        .tab-content {
            display: none;
            animation: fadeIn 0.3s ease-in-out;
        }
        
        .tab-content.active {
            display: block;
        }
        
        .completed-row {
            background-color: var(--success-light) !important;
            transition: all 0.3s ease;
        }
        
        .slide-out {
            animation: slideOutRight 0.5s forwards;
            overflow: hidden;
            transition: all 0.5s ease;
        }
        body {
            font-family: 'Segoe UI', Arial, sans-serif;
            background: var(--bg);
            margin: 0;
            padding: 0;
            min-height: 100vh;
        }
        body.loading {
            opacity: 0;
        }
        body.loaded {
            opacity: 1;
            transition: opacity 0.2s ease-in;
        }
        .container {
            max-width: 480px;
            margin: 0 auto;
            padding: 16px 8px 80px 8px;
        }
        h1, h2 {
            margin: 0 0 18px 0;
            font-weight: 600;
        }
        .main-actions {
            display: flex;
            flex-direction: column;
            gap: 18px;
            margin-bottom: 32px;
        }
        .main-actions button, .main-actions a > button {
            width: 100%;
            font-size: 1.2rem;
            padding: 18px 0;
            background: var(--primary);
            color: #fff;
            border: none;
            border-radius: var(--radius);
            box-shadow: 0 2px 8px rgba(0,0,0,0.04);
            cursor: pointer;
            transition: background 0.2s;
        }
        .main-actions button:hover, .main-actions a > button:hover {
            background: var(--accent);
        }
        /* Per-button hover variants: lighter shade for main buttons, darker for tools */
        .btn-lighten:hover { filter: brightness(1.06); transition: filter 0.15s ease; }
        .btn-darken:hover { filter: brightness(0.92); transition: filter 0.15s ease; }
        .section-card {
            background: var(--card);
            border-radius: var(--radius);
            box-shadow: 0 2px 8px rgba(0,0,0,0.04);
            padding: 18px 12px 12px 12px;
            margin-bottom: 24px;
            border: 1px solid var(--border);
        }
        #sold-orders-table {
            border-collapse: collapse;
            width: 100%;
            margin-bottom: 10px;
        }
        #sold-orders-table, #sold-orders-table th, #sold-orders-table td {
            border: 1px solid #bbb;
        }
        #sold-orders-table th, #sold-orders-table td {
            padding: 6px 8px;
            background: #fff;
        }
        #sold-orders-table th {
            background: #f0f0f0;
        }
        #sold-orders-table tr.handled {
            text-decoration: line-through;
            background: #e0e0e0;
            opacity: 0.6;
        }
        .sold-td-small {
            font-size: 12px;
            max-width: 120px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            cursor: pointer;
        }
        .sold-popup {
            display: none;
            position: fixed;
            z-index: 9999;
            left: 50%;
            top: 50%;
            transform: translate(-50%, -50%);
            background: #fff;
            border: 2px solid #333;
            border-radius: 8px;
            padding: 20px;
            box-shadow: 0 2px 16px rgba(0,0,0,0.3);
            max-width: 90vw;
            max-height: 70vh;
            overflow: auto;
            font-size: 16px;
        }
        .sold-popup-close {
            float: right;
            font-size: 22px;
            font-weight: bold;
            color: #333;
            cursor: pointer;
            margin-left: 10px;
        }
        .tools-section {
            background: var(--card);
            border-radius: var(--radius);
            box-shadow: 0 2px 8px rgba(0,0,0,0.04);
            padding: 14px 12px 10px 12px;
            border: 1px solid var(--border);
            margin-bottom: 18px;
        }
        .tools-section h3 {
            margin: 0 0 10px 0;
            font-size: 1.1rem;
            color: #555;
            font-weight: 500;
        }
        .tools-row {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }
        .tools-row label {
            font-size: 0.98rem;
            color: #444;
        }
        @media (max-width: 600px) {
            .container {
                padding: 8px 2vw 80px 2vw;
            }
            .main-actions button, .main-actions a > button {
                font-size: 1.05rem;
                padding: 14px 0;
            }
            .section-card, .tools-section {
                padding: 10px 4px 8px 4px;
            }
        }
    </style>
</head>
<body class="loading">
    <div class="container">

        <div class="main-actions" style="margin-bottom:12px;">
            <a href="/items-to-list" style="text-decoration:none; width: 100%;">
                <button type="button" class="btn-lighten" style="width: 100%; font-size:1.2rem; padding:18px 0; background:var(--primary); color:#fff; border:none; border-radius:var(--radius); box-shadow:0 2px 8px rgba(0,0,0,0.04); display:flex;align-items:center;justify-content:center;gap:8px; margin-bottom:8px;">
                    <i class="fas fa-list"></i> Item Manager
                </button>
            </a>
        </div>

        <div class="section-card" style="overflow-x: auto;">
            <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px;">
                <div style="display: flex; gap: 10px;">
                    <button class="tab-button active" data-tab="pending">Ready to Ship</button>
                    <button class="tab-button" data-tab="completed">Completed</button>
                </div>
                <div style="display: flex; align-items: center; gap: 8px;">
                    <label for="sold-orders-days" style="font-size:0.9rem; white-space: nowrap;">Days:</label>
                    <input type="number" id="sold-orders-days" value="2" min="1" max="120" style="width: 50px; padding: 4px; border: 1px solid #ddd; border-radius: 4px;">
                </div>
            </div>
            <div class="tab-content active" id="pending-orders">
                <div style="max-height: 400px; overflow-y: auto; border: 1px solid #e0e0e0; border-radius: 6px;">
                    <table id="sold-orders-table" style="width: 100%; border-collapse: collapse;">
                        <thead>
                            <tr style="background:#f5f5f5; position: sticky; top: 0; z-index: 10;">
                                <th style="padding: 8px; text-align: left; border-bottom: 2px solid #e0e0e0; font-size: 0.85rem;">Title</th>
                                <th style="padding: 8px; text-align: left; border-bottom: 2px solid #e0e0e0; font-size: 0.85rem;">Info</th>
                                <th style="padding: 8px; text-align: center; border-bottom: 2px solid #e0e0e0; font-size: 0.85rem; width: 60px;">Loc</th>
                                <th style="padding: 8px; text-align: center; border-bottom: 2px solid #e0e0e0; font-size: 0.85rem; width: 40px;">#</th>
                                <th style="padding: 8px; text-align: center; border-bottom: 2px solid #e0e0e0; font-size: 0.85rem; width: 80px;">Status</th>
                            </tr>
                        </thead>
                        <tbody style="font-size: 0.85rem;"></tbody>
                    </table>
                </div>
            </div>
            
            <div class="tab-content" id="completed-orders">
                <div style="max-height: 400px; overflow-y: auto; border: 1px solid #e0e0e0; border-radius: 6px; min-height: 100px;">
                    <table id="completed-orders-table" style="width: 100%; border-collapse: collapse;">
                        <thead>
                            <tr style="background:#f5f5f5; position: sticky; top: 0; z-index: 10;">
                                <th style="padding: 8px; text-align: left; border-bottom: 2px solid #e0e0e0; font-size: 0.85rem;">Title</th>
                                <th style="padding: 8px; text-align: left; border-bottom: 2px solid #e0e0e0; font-size: 0.85rem;">Info</th>
                                <th style="padding: 8px; text-align: center; border-bottom: 2px solid #e0e0e0; font-size: 0.85rem; width: 60px;">Loc</th>
                                <th style="padding: 8px; text-align: center; border-bottom: 2px solid #e0e0e0; font-size: 0.85rem; width: 40px;">#</th>
                                <th style="padding: 8px; text-align: center; border-bottom: 2px solid #e0e0e0; font-size: 0.85rem; width: 80px;">Status</th>
                            </tr>
                        </thead>
                        <tbody style="font-size: 0.85rem;">
                            <tr>
                                <td colspan="5" style="text-align: center; padding: 20px; color: #666;">No completed orders yet</td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>

        <div class="main-actions" style="margin-top: 18px;">
            <form method="GET" action="/position" style="margin:0; width: 100%;">
                <button type="submit" class="btn-lighten" style="background:#27ae60; width: 100%; display: flex; align-items: center; justify-content: center; gap: 8px;">
                    <i class="fas fa-plus-circle"></i> Add Item to Shelf
                </button>
            </form>

            <a href="/searchrack" style="text-decoration:none; width: 100%;">
                <button type="button" style="width: 100%; display: flex; align-items: center; justify-content: center; gap: 8px;">
                    <i class="fas fa-search"></i> Search Warehouse
                </button>
            </a>

            <div style="height:1px;background:var(--border);margin:8px 0;border-radius:2px"></div>

            <a href="/item-prep" style="text-decoration:none; width: 100%;">
                <button type="button" class="btn-lighten" style="width: 100%; display: flex; align-items: center; justify-content: center; gap: 8px; background: #7B3F00;">
                    <i class="fas fa-diagnoses"></i> Preperation
                </button>
            </a>
        </div>

        <div class="main-actions" style="margin-top: 20px;">
            <a href="/tools" style="text-decoration:none; width: 100%;">
                <button type="button" class="btn-darken" style="width: 100%; background: #95a5a6; color: #fff; margin: 0;">
                    <i class="fas fa-tools" style="margin-right: 8px;"></i> Tools
                </button>
            </a>
        </div>
    </div>

<script>
function esc(s) {
    return String(s||'').replace(/&/g, '&amp;').replace(/"/g, '&quot;').replace(/'/g, '&#39;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
}
function tdTitle(order) {
    var fullTitle = esc(order.title || '');
    var imgSrc = esc(order.image || order.image_url || '');
    // small thumbnail to the left of the title (48x48)
    const missingDataUrlThumb = 'data:image/svg+xml;utf8,' + encodeURIComponent('<svg xmlns="http://www.w3.org/2000/svg" width="48" height="48"><rect width="100%" height="100%" fill="#f8f8f8"/><text x="50%" y="50%" dominant-baseline="middle" text-anchor="middle" fill="#b0b0b0" font-size="8">No Img</text></svg>');
    var thumbHtml = '';
    if (imgSrc) {
        thumbHtml = `<img src="${imgSrc}" style="width:48px;height:48px;object-fit:cover;border-radius:6px;margin-right:8px;vertical-align:middle;" onerror="this.src='${missingDataUrlThumb}'">`;
    } else {
        thumbHtml = `<img src='${missingDataUrlThumb}' style="width:48px;height:48px;object-fit:cover;border-radius:6px;margin-right:8px;vertical-align:middle;">`;
    }
    return `<td class='sold-td-small'><a href="#" class="order-title-link" data-title="${fullTitle}" data-image="${imgSrc}" style="display:flex;align-items:center;">${thumbHtml}<span style="display:inline-block;max-width:220px;vertical-align:middle;">${fullTitle}</span></a></td>`;
}

function tdInfo(order) {
    var buyer = esc(order.shipping_name || '');
    var address = [order.shipping_street1, order.shipping_street2, order.shipping_city, order.shipping_state, order.shipping_postal_code, order.shipping_country].filter(Boolean).map(esc).join(' ');
    var info = `${buyer}${address ? ' - ' + address : ''}`;
    return `<td class='sold-td-small'><a href="#" class="order-info-link" data-info="${info}">${buyer}</a></td>`;
}

function tdLocation(order) {
    var locationText = esc(order.location || '');
    // If location looks like a picture filename, show a thumbnail linking to the pictureposition static file
    if (locationText.match(/\.(jpg|jpeg|png)$/i)) {
        var thumb = `/static/pictureposition/${locationText}`;
    // show a small inline placeholder on error instead of default gr1new.png
    const missingDataUrl = 'data:image/svg+xml;utf8,' + encodeURIComponent('<svg xmlns="http://www.w3.org/2000/svg" width="120" height="80"><rect width="100%" height="100%" fill="#f8f8f8"/><text x="50%" y="50%" dominant-baseline="middle" text-anchor="middle" fill="#b0b0b0" font-size="12">Image missing</text></svg>');
    return `<td class='sold-td-small'><a href="#" class="order-loc-link" data-loc="${locationText}"><img src="${thumb}" style="max-width:60px;max-height:60px;border-radius:6px;" onerror="this.src='${missingDataUrl}'"></a></td>`;
    }
    return `<td class='sold-td-small'><a href="#" class="order-loc-link" data-loc="${locationText}">${locationText}</a></td>`;
}

function tdQuantity(order) {
    var qty = order.quantity || '1';
    var highlight = parseInt(qty) > 1 ? ' style="color:#e53935;font-weight:bold;background:#ffeaea;"' : '';
    return `<td${highlight}>${qty}</td>`;
}

function renderSoldOrders(orders) {
    // Clear the orders list before rendering new data
    document.querySelector('#sold-orders-table tbody').innerHTML = '';
    document.querySelector('#completed-orders-table tbody').innerHTML = '';
    
    // Create table rows for each order
    orders.forEach(function(order) {
        var tr = document.createElement('tr');
        tr.orderData = order; // Attach order data for info popup
        if (order.isHandled) {
            // Add to completed table
            tr.innerHTML =
                tdTitle(order) +
                tdInfo(order) +
                tdLocation(order) +
                tdQuantity(order) +
                `<td style="text-align: center;">
                    <button class="handle-btn undo-btn" 
                            data-id="${order.id}" 
                            style="background:#ff9800;color:white;border:none;padding:8px 12px;border-radius:20px;font-size:14px;cursor:pointer;transition:all 0.3s ease;width:60px;display:inline-flex;align-items:center;justify-content:center;gap:4px;">
                        <span style="font-size:16px;">↩</span>
                    </button>
                </td>`;
            document.querySelector('#completed-orders-table tbody').appendChild(tr);
            
            // Remove "No orders" message if it exists
            const noOrdersRow = document.querySelector('#completed-orders-table tbody tr td[colspan="5"]');
            if (noOrdersRow) {
                noOrdersRow.closest('tr').remove();
            }
        } else {
            // Add to pending table
            tr.innerHTML =
                tdTitle(order) +
                tdInfo(order) +
                tdLocation(order) +
                tdQuantity(order) +
                `<td style="text-align: center;">
                    <button class="handle-btn" 
                            data-id="${order.id}" 
                            style="background:#4caf50;color:white;border:none;padding:8px 12px;border-radius:20px;font-size:14px;cursor:pointer;transition:all 0.3s ease;width:60px;display:inline-flex;align-items:center;justify-content:center;gap:4px;">
                        <span style="font-size:16px;">✓</span>
                    </button>
                </td>`;
            document.querySelector('#sold-orders-table tbody').appendChild(tr);
        }
    });
    
    // Show "No orders" message if no completed orders
    if (document.querySelectorAll('#completed-orders-table tbody tr').length === 0) {
        const noOrdersRow = document.createElement('tr');
        noOrdersRow.innerHTML = '<td colspan="5" style="text-align: center; padding: 20px; color: #666;">No completed orders yet</td>';
        document.querySelector('#completed-orders-table tbody').appendChild(noOrdersRow);
    }
    // Handle tab switching
    document.querySelectorAll('.tab-button').forEach(button => {
        button.addEventListener('click', (e) => {
            e.preventDefault();
            e.stopPropagation();
            
            // Update active tab
            document.querySelectorAll('.tab-button').forEach(btn => btn.classList.remove('active'));
            button.classList.add('active');
            
            // Show corresponding content
            document.querySelectorAll('.tab-content').forEach(content => content.classList.remove('active'));
            document.getElementById(`${button.dataset.tab}-orders`).classList.add('active');
        });
    });

    // Event delegation for handle buttons
    document.addEventListener('click', function(e) {
        const handleBtn = e.target.closest('.handle-btn');
        if (!handleBtn) return;
        
        const tr = handleBtn.closest('tr');
        const orderId = handleBtn.getAttribute('data-id');
        const isUndo = handleBtn.classList.contains('undo-btn');
        
        // Add slide-out animation
        tr.classList.add('slide-out');
        
        // After animation completes, move between tables
        setTimeout(() => {
            if (isUndo) {
                // Move from completed back to pending
                const orderId = tr.querySelector('.handle-btn').getAttribute('data-id');
                
                // First, mark the order as unhandled on the server
                fetch('/mark-order-unhandled', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({
                        id: orderId
                    })
                })
                .then(response => response.json())
                .then(data => {
                    if (!data.success) {
                        console.error('Failed to update order status:', data.error);
                        return;
                    }
                    
                    // Then fetch the updated order details
                    return fetch(`/get-order?id=${orderId}`);
                })
                .then(response => response.json())
                .then(order => {
                    if (!order) return;
                    
                    const pendingTable = document.querySelector('#sold-orders-table tbody');
                    const pendingRow = document.createElement('tr');
                    
                    // Rebuild the row with all order data
                    pendingRow.innerHTML = `
                        ${tdTitle(order)}
                        ${tdInfo(order)}
                        ${tdLocation(order)}
                        ${tdQuantity(order)}
                        <td style="text-align: center;">
                            <button class="handle-btn" 
                                    data-id="${order.id}" 
                                    style="background:#4caf50;color:white;border:none;padding:8px 12px;border-radius:20px;font-size:14px;cursor:pointer;transition:all 0.3s ease;width:60px;display:inline-flex;align-items:center;justify-content:center;gap:4px;">
                                <span style="font-size:16px;">✓</span>
                            </button>
                        </td>
                    `;
                    
                    // Add to pending table with fade-in effect
                    pendingRow.style.opacity = '0';
                    pendingTable.prepend(pendingRow);
                    setTimeout(() => pendingRow.style.opacity = '1', 10);
                    
                    // Remove from completed table
                    tr.remove();
                })
                    .catch(error => {
                        console.error('Error fetching order:', error);
                        // Fallback to simple row move if fetch fails
                        const pendingTable = document.querySelector('#sold-orders-table tbody');
                        const pendingRow = tr.cloneNode(true);
                        
                        // Update the status button
                        const pendingBtn = pendingRow.querySelector('.handle-btn');
                        if (pendingBtn) {
                            pendingBtn.innerHTML = '<span style="font-size:16px;">✓</span>';
                            pendingBtn.style.backgroundColor = '#4caf50';
                            pendingBtn.classList.remove('undo-btn');
                            pendingBtn.style.pointerEvents = 'auto';
                        }
                        
                        pendingTable.prepend(pendingRow);
                        tr.remove();
                    });
            } else {
                // Move from pending to completed
                const completedTable = document.querySelector('#completed-orders-table tbody');
                const completedRow = tr.cloneNode(true);
                
                // Update the status button
                const completeBtn = completedRow.querySelector('.handle-btn');
                if (completeBtn) {
                    completeBtn.innerHTML = '<span style="font-size:16px;">↩</span>';
                    completeBtn.style.backgroundColor = '#ff9800';
                    completeBtn.classList.add('undo-btn');
                    completeBtn.style.pointerEvents = 'auto';
                }
                
                // Remove the "No orders" message if it exists
                const noOrdersRow = completedTable.querySelector('tr td[colspan="5"]');
                if (noOrdersRow) {
                    noOrdersRow.closest('tr').remove();
                }
                
                // Add to completed table with fade-in effect
                completedRow.style.opacity = '0';
                completedTable.prepend(completedRow);
                setTimeout(() => completedRow.style.opacity = '1', 10);
                
                // Remove from pending table
                tr.remove();
            }
            
            // Update the server - using the appropriate endpoint based on action
            const endpoint = isUndo ? '/mark-order-unhandled' : '/mark-order-handled';
            fetch(endpoint, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ id: orderId })
            })
            .catch(error => console.error('Error updating order status:', error));
        }, 400);
    });
    attachPopups();
}
function fetchAndShowSoldOrders(days) {
    // First, fetch new sold orders for the given days
    return fetch('/get-sold-orders', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ days })
    })
    .then(r => r.json())
    .then(data => {
        // After fetching, load and display the sold orders
        return loadSoldOrders(days);
    });
}
function loadSoldOrders(days, force = false) {
    if (!isSoldOrdersTabActive && !force) return;
    
    days = days || parseInt(document.getElementById('sold-orders-days').value) || 2;
    return fetch(`/sold-orders?days=${days}`)
        .then(r => r.json())
        .then(renderSoldOrders);
}
document.getElementById('sold-orders-days').onchange = function() {
    const days = parseInt(this.value) || 2;
    fetchAndShowSoldOrders(days);
};

// Track tab visibility
let isSoldOrdersTabActive = true;

// Listen for tab changes
document.addEventListener('visibilitychange', function() {
    isSoldOrdersTabActive = !document.hidden;
    if (isSoldOrdersTabActive) {
        // Refresh data when tab becomes active
        loadSoldOrders(null, true);
    }
});
// Tab switching functionality
function setupTabs() {
    const tabButtons = document.querySelectorAll('.tab-button');
    const tabContents = document.querySelectorAll('.tab-content');
    
    tabButtons.forEach(button => {
        button.addEventListener('click', () => {
            // Remove active class from all buttons and contents
            tabButtons.forEach(btn => btn.classList.remove('active'));
            tabContents.forEach(content => content.classList.remove('active'));
            
            // Add active class to clicked button and corresponding content
            button.classList.add('active');
            const tabId = button.getAttribute('data-tab') + '-orders';
            document.getElementById(tabId).classList.add('active');
            
            // If switching to pending tab, refresh the data
            if (button.getAttribute('data-tab') === 'pending') {
                loadSoldOrders();
            }
        });
    });
}

window.addEventListener('DOMContentLoaded', function() {
    // Set up tab functionality
    setupTabs();
    
    // On load, fetch and show last 48 hours (2 days), then reveal the page
    fetchAndShowSoldOrders(2).then(() => {
        // Remove loading class and add loaded class to fade in the page
        document.body.classList.remove('loading');
        document.body.classList.add('loaded');
    }).catch((error) => {
        console.error('Error loading orders:', error);
        // Still show the page even if there's an error
        document.body.classList.remove('loading');
        document.body.classList.add('loaded');
    });
    
    // Set up the sold orders button click handler
    const soldOrdersBtn = document.getElementById('get-sold-orders-btn');
    if (soldOrdersBtn) {
        soldOrdersBtn.onclick = function(e) {
            e.preventDefault();
            const days = parseInt(document.getElementById('sold-days').value) || 90;
            fetch('/get-sold-orders', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ days })
            })
            .then(r => r.json())
            .then(data => {
                if (data.success) {
                    alert('Sold orders fetched and stored!');
                    // Refresh the orders after fetching
                    loadSoldOrders();
                } else {
                    alert('Error: ' + (data.error || 'Unknown error'));
                }
            })
            .catch(error => {
                console.error('Error:', error);
                alert('Error fetching sold orders');
            });
        };
    }
    
    // Add event listener for days dropdown change
    const soldOrdersDays = document.getElementById('sold-orders-days');
    if (soldOrdersDays) {
        soldOrdersDays.addEventListener('change', function() {
            const days = parseInt(this.value) || 2;
            fetchAndShowSoldOrders(days);
        });
    }
}); // End of DOMContentLoaded

function showOrderPopup(title, imageUrl, info, loc, price, paidTime) {
    // Remove any existing popup
    const oldPopup = document.getElementById('order-popup');
    if (oldPopup) oldPopup.remove();
    // Create overlay
    const overlay = document.createElement('div');
    overlay.id = 'order-popup';
    overlay.style.position = 'fixed';
    overlay.style.top = 0;
    overlay.style.left = 0;
    overlay.style.width = '100vw';
    overlay.style.height = '100vh';
    overlay.style.background = 'rgba(0,0,0,0.35)';
    overlay.style.display = 'flex';
    overlay.style.alignItems = 'center';
    overlay.style.justifyContent = 'center';
    overlay.style.zIndex = 9999;
    overlay.onclick = function(e) {
        if (e.target === overlay) overlay.remove();
    };
    // Create popup content
    const popup = document.createElement('div');
    popup.style.background = '#fff';
    popup.style.borderRadius = '14px';
    popup.style.boxShadow = '0 2px 16px rgba(0,0,0,0.18)';
    popup.style.padding = '28px 24px';
    popup.style.maxWidth = '340px';
    popup.style.textAlign = 'center';
    popup.style.position = 'relative';
    popup.onclick = function(e) { e.stopPropagation(); };
    // Info tab formatting (old system)
    if (info) {
        // info = buyer + address
        let infoParts = info.split(' - ');
        let buyer = infoParts[0] || '';
        let address = infoParts[1] || '';
        const infoHtml = `
            <div style='max-width:300px;'>
                <div style='margin-bottom:10px;'>
                    <b>${buyer}</b><br>
                    <span style='font-size:0.98em;'>${address}</span>
                </div>
                <hr style='border:none;border-top:1px solid #ddd;margin:10px 0;'>
                <div style='margin-bottom:5px;'><b>Price:</b> ${price || 'N/A'}</div>
                <div><b>Paid:</b> ${paidTime || 'N/A'}</div>
            </div>
        `;
        popup.innerHTML += infoHtml;
    }
    // Location tab formatting (show shelf image)
    if (loc) {
        const locEl = document.createElement('div');
        locEl.textContent = 'Location: ' + loc;
        locEl.style.fontSize = '0.98rem';
        locEl.style.marginBottom = '8px';
        popup.appendChild(locEl);
        // Shelf image
        // If the location looks like an image filename, show the pictureposition image
        const missingDataUrlPopup = 'data:image/svg+xml;utf8,' + encodeURIComponent('<svg xmlns="http://www.w3.org/2000/svg" width="360" height="220"><rect width="100%" height="100%" fill="#f8f8f8"/><text x="50%" y="50%" dominant-baseline="middle" text-anchor="middle" fill="#b0b0b0" font-size="18">Image missing</text></svg>');
        if (loc.match(/\.(jpg|jpeg|png)$/i)) {
            const img = document.createElement('img');
            img.src = '/static/pictureposition/' + loc;
            img.alt = loc;
            img.style.maxWidth = '220px';
            img.style.borderRadius = '10px';
            img.style.marginBottom = '18px';
            img.onerror = function() { img.src = missingDataUrlPopup; };
            popup.appendChild(img);
        } else {
            const img = document.createElement('img');
            const locationLower = loc.toLowerCase();
            img.src = '/static/shelves/' + locationLower + '.png';
            img.alt = loc;
            img.style.maxWidth = '220px';
            img.style.borderRadius = '10px';
            img.style.marginBottom = '18px';
            img.onerror = function() { img.src = missingDataUrlPopup; };
            popup.appendChild(img);
        }
    }
    // Title and image (for title tab)
    if (title) {
        const nameEl = document.createElement('div');
        nameEl.textContent = title;
        nameEl.style.fontWeight = 'bold';
        nameEl.style.fontSize = '1.1rem';
        nameEl.style.marginBottom = '8px';
        popup.appendChild(nameEl);
    }
    if (imageUrl) {
        const img = document.createElement('img');
        img.src = imageUrl;
        img.alt = title;
        img.style.maxWidth = '220px';
        img.style.borderRadius = '10px';
        img.style.marginBottom = '18px';
        popup.appendChild(img);
    }
    // Add close button
    const closeBtn = document.createElement('button');
    closeBtn.textContent = 'Close';
    closeBtn.style.marginTop = '12px';
    closeBtn.style.background = '#0984e3';
    closeBtn.style.color = '#fff';
    closeBtn.style.border = 'none';
    closeBtn.style.borderRadius = '6px';
    closeBtn.style.padding = '8px 18px';
    closeBtn.style.cursor = 'pointer';
    closeBtn.onclick = function() { overlay.remove(); };
    popup.appendChild(closeBtn);
    overlay.appendChild(popup);
    document.body.appendChild(overlay);
}
// Attach to all title, info, and loc clickable elements
function attachPopups() {
    document.querySelectorAll('.order-title-link').forEach(el => {
        el.onclick = function(e) {
            e.preventDefault();
            showOrderPopup(el.dataset.title, el.dataset.image, null, null);
        };
    });
    document.querySelectorAll('.order-info-link').forEach(el => {
        el.onclick = function(e) {
            e.preventDefault();
            // Get price and paidTime from parent row
            const tr = el.closest('tr');
            let price = 'N/A', paidTime = 'N/A';
            if (tr && tr.orderData) {
                price = tr.orderData.price ? `$${parseFloat(tr.orderData.price).toFixed(2)}` : 'N/A';
                paidTime = tr.orderData.paid_time ? fmtET(tr.orderData.paid_time) : 'N/A';
            }
            showOrderPopup(null, null, el.dataset.info, null, price, paidTime);
        };
    });
    document.querySelectorAll('.order-loc-link').forEach(el => {
        el.onclick = function(e) {
            e.preventDefault();
            showOrderPopup(null, null, null, el.dataset.loc);
        };
    });
}
document.addEventListener('DOMContentLoaded', attachPopups);
// Friendly Eastern Time formatter used across pages
function fmtET(ts){
    try{
        if(!ts) return '';
        const d = new Date(ts);
        if(isNaN(d.getTime())) return String(ts);
        const parts = new Intl.DateTimeFormat('en-US', { timeZone: 'America/New_York', year:'numeric', month:'2-digit', day:'2-digit', hour:'numeric', minute:'2-digit', hour12:true }).formatToParts(d);
        const vals = {}; parts.forEach(p=> vals[p.type] = p.value);
        const year = vals.year || d.getFullYear(); const month = vals.month || String(d.getMonth()+1).padStart(2,'0'); const day = vals.day || String(d.getDate()).padStart(2,'0');
        let hour = vals.hour || String(d.getHours()).padStart(2,'0'); let minute = vals.minute || String(d.getMinutes()).padStart(2,'0'); const ampm = (vals.dayPeriod||'').toLowerCase(); hour = String(hour).replace(/^0/, '');
        return `${year}-${month}-${day} ${hour}:${minute}${ampm}`;
    }catch(e){ return String(ts); }
}
