<!DOCTYPE html>
<html>
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="icon" type="image/png" href="{{ url_for('static', filename='favicon.ico') }}">
    <link rel="apple-touch-icon" href="{{ url_for('static', filename='apple-touch-icon.png') }}">
    <title>Sweet Shelves</title>
    <style>
        body {
            font-family: sans-serif;
            max-width: 600px;
            margin: auto;
            padding: 10px;
        }
        img {
            width: 100%;
            border: 1px solid #ccc;
            margin-top: 20px;
        }
        #sold-orders-table {
    border-collapse: collapse;
    width: 100%;
    margin-bottom: 20px;
}
#sold-orders-table, #sold-orders-table th, #sold-orders-table td {
    border: 1px solid #bbb;
}
#sold-orders-table th, #sold-orders-table td {
    padding: 6px 8px;
    background: #fff;
}
#sold-orders-table th {
    background: #f0f0f0;
}
#sold-orders-table tr.handled {
    text-decoration: line-through;
    background: #e0e0e0;
    opacity: 0.6;
}
.sold-td-small {
    font-size: 12px;
    max-width: 120px;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    cursor: pointer;
}
.sold-popup {
    display: none;
    position: fixed;
    z-index: 9999;
    left: 50%;
    top: 50%;
    transform: translate(-50%, -50%);
    background: #fff;
    border: 2px solid #333;
    border-radius: 8px;
    padding: 20px;
    box-shadow: 0 2px 16px rgba(0,0,0,0.3);
    max-width: 90vw;
    max-height: 70vh;
    overflow: auto;
    font-size: 16px;
}
.sold-popup-close {
    float: right;
    font-size: 22px;
    font-weight: bold;
    color: #333;
    cursor: pointer;
    margin-left: 10px;
}
    </style>
</head>
<body>



    <h1>Search Inventory</h1>
    <form method="POST" action="/search">
    <input type="text" name="query" placeholder="Enter item name or ID" required>
    <button type="submit">Search</button>
    </form>
    <h1></h1>

    <form method="GET" action="/database">
    <button type="submit">Go to Inventory page</button>
    </form>

    {% if search_result %}
        <h2>Result:</h2>
        <p>{{ search_result }}</p>
    {% endif %}

    <h1>Select a Shelf</h1>

    <form method="GET" action="/">
        <select name="shelf">
            <option value="shelf 1">Shelf 1</option>
            <option value="shelf 2">Shelf 2</option>
            <option value="shelf 3">Shelf 3</option>
            <option value="shelf 4">Shelf 4</option>
            <option value="shelf top">Shelf Top</option>
        </select>
        <button type="submit">Highlight</button>
    </form>

    {% if shelf %}
    <img src="{{ url_for('highlight') }}?shelf={{ shelf }}" alt="shelfHighlighter">
    {% endif %}

<h2></h2>
<div></div>


    <form method="GET" action="/position">
    <button style="font-size: 20px; padding: 15px 200px;">Add Item</button>
    </form>

    <a href="/extractor"><button type="button">BOL Extract</button></a>
    <form method="GET" action="/manualmatcher">
    <button type="submit">Manual Matcher</button>
</form>

<label for="sold-days">Days to fetch:</label>
<input type="number" id="sold-days" value="90" min="1" max="120" style="width:60px;">
<button id="get-sold-orders-btn">Get Sold Orders</button>
<script>
document.getElementById('get-sold-orders-btn').onclick = function() {
    const days = parseInt(document.getElementById('sold-days').value) || 90;
    fetch('/get-sold-orders', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ days })
    })
    .then(r => r.json())
    .then(data => {
        if (data.success) {
            alert('Sold orders fetched and stored!');
        } else {
            alert('Failed to fetch sold orders: ' + (data.error || 'Unknown error'));
        }
    });
};
</script>

<h2>Recent Sold Orders</h2>
<label for="sold-orders-days">Days to show:</label>
<input type="number" id="sold-orders-days" value="1" min="1" max="120" style="width:60px;">
<table id="sold-orders-table">
    <thead>
        <tr style="background:#f0f0f0;">
            <th>Title</th>
            <th>Quantity</th>
            <th>Image</th>
            <th>Buyer Name</th>
            <th>Address</th>
            <th>Checkout Status</th>
            <th>Handled</th>
        </tr>
    </thead>
    <tbody></tbody>
</table>
<div id="sold-popup" class="sold-popup"><span class="sold-popup-close" onclick="this.parentNode.style.display='none'">&times;</span><span id="sold-popup-content"></span></div>
<script>
function showSoldPopup(text) {
    document.getElementById('sold-popup-content').innerHTML = text;
    document.getElementById('sold-popup').style.display = 'block';
}
// Move tdSmall to top-level so it can be used in renderSoldOrders
function tdSmall(content, full) {
    // Escape HTML for attribute and popup
    const esc = s => String(s).replace(/&/g, '&amp;').replace(/"/g, '&quot;').replace(/'/g, '&#39;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
    return `<td class='sold-td-small' title='${esc(full)}' onclick='showSoldPopup("${esc(full)}")'>${esc(content)}</td>`;
}
function renderSoldOrders(orders) {
    const tbody = document.querySelector('#sold-orders-table tbody');
    tbody.innerHTML = '';
    orders.forEach(order => {
        const tr = document.createElement('tr');
        if (order.isHandled === '1') {
            tr.classList.add('handled');
        }
        const address = [order.shipping_street1, order.shipping_street2, order.shipping_city, order.shipping_state, order.shipping_postal_code, order.shipping_country].filter(Boolean).join(' ');
        tr.innerHTML = `
            ${tdSmall(order.title || '', order.title || '')}
            ${tdSmall(order.quantity || '', order.quantity || '')}
            <td><img src="${order.image || order.image_url || ''}" alt="item" style="max-width:60px;max-height:60px;"></td>
            ${tdSmall(order.shipping_name || '', order.shipping_name || '')}
            ${tdSmall(address, address)}
            ${tdSmall(order.checkout_status || '', order.checkout_status || '')}
            <td><button class="handle-btn" data-id="${order.id}" style="background:#4caf50;color:white;border:none;padding:6px 10px;border-radius:4px;font-size:18px;cursor:pointer;">&#10003;</button></td>
        `;
        tbody.appendChild(tr);
    });
    // Add event listeners for handle buttons
    document.querySelectorAll('.handle-btn').forEach(btn => {
        btn.onclick = function() {
            const tr = this.closest('tr');
            const id = this.getAttribute('data-id');
            const isHandled = tr.classList.contains('handled');
            fetch('/mark-order-handled', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ id, undo: isHandled })
            })
            .then(r => r.json())
            .then(data => {
                if (data.success) {
                    tr.classList.toggle('handled');
                } else {
                    alert('Failed to update handled status: ' + (data.error || 'Unknown error'));
                }
            });
        };
    });
}
function loadSoldOrders() {
    const days = parseInt(document.getElementById('sold-orders-days').value) || 1;
    fetch(`/sold-orders?days=${days}`)
        .then(r => r.json())
        .then(renderSoldOrders);
}
document.getElementById('sold-orders-days').onchange = loadSoldOrders;
window.addEventListener('DOMContentLoaded', loadSoldOrders);
</script>

<div style="margin: 20px 0; text-align: center;">
    <a href="/searchrack"><button style="background:#0984e3;color:white;font-size:20px;padding:12px 32px;border:none;border-radius:8px;cursor:pointer;">Search My Rack</button></a>
</div>

</body>
</html>
