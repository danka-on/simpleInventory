<!DOCTYPE html>
<html lang="en">
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="icon" type="image/png" href="{{ url_for('static', filename='favicon.ico') }}">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <link rel="apple-touch-icon" href="{{ url_for('static', filename='apple-touch-icon.png') }}">
    <title>Sweet Shelves</title>
    <style>
        :root {
            --primary: #0984e3;
            --accent: #00b894;
            --bg: #f9f9f9;
            --card: #fff;
            --border: #e0e0e0;
            --radius: 14px;
        }
        body {
            font-family: 'Segoe UI', Arial, sans-serif;
            background: var(--bg);
            margin: 0;
            padding: 0;
            min-height: 100vh;
        }
        .container {
            max-width: 480px;
            margin: 0 auto;
            padding: 16px 8px 80px 8px;
        }
        h1, h2 {
            margin: 0 0 18px 0;
            font-weight: 600;
        }
        .main-actions {
            display: flex;
            flex-direction: column;
            gap: 18px;
            margin-bottom: 32px;
        }
        .main-actions button, .main-actions a > button {
            width: 100%;
            font-size: 1.2rem;
            padding: 18px 0;
            background: var(--primary);
            color: #fff;
            border: none;
            border-radius: var(--radius);
            box-shadow: 0 2px 8px rgba(0,0,0,0.04);
            cursor: pointer;
            transition: background 0.2s;
        }
        .main-actions button:hover, .main-actions a > button:hover {
            background: var(--accent);
        }
        .section-card {
            background: var(--card);
            border-radius: var(--radius);
            box-shadow: 0 2px 8px rgba(0,0,0,0.04);
            padding: 18px 12px 12px 12px;
            margin-bottom: 24px;
            border: 1px solid var(--border);
        }
        #sold-orders-table {
            border-collapse: collapse;
            width: 100%;
            margin-bottom: 10px;
        }
        #sold-orders-table, #sold-orders-table th, #sold-orders-table td {
            border: 1px solid #bbb;
        }
        #sold-orders-table th, #sold-orders-table td {
            padding: 6px 8px;
            background: #fff;
        }
        #sold-orders-table th {
            background: #f0f0f0;
        }
        #sold-orders-table tr.handled {
            text-decoration: line-through;
            background: #e0e0e0;
            opacity: 0.6;
        }
        .sold-td-small {
            font-size: 12px;
            max-width: 120px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            cursor: pointer;
        }
        .sold-popup {
            display: none;
            position: fixed;
            z-index: 9999;
            left: 50%;
            top: 50%;
            transform: translate(-50%, -50%);
            background: #fff;
            border: 2px solid #333;
            border-radius: 8px;
            padding: 20px;
            box-shadow: 0 2px 16px rgba(0,0,0,0.3);
            max-width: 90vw;
            max-height: 70vh;
            overflow: auto;
            font-size: 16px;
        }
        .sold-popup-close {
            float: right;
            font-size: 22px;
            font-weight: bold;
            color: #333;
            cursor: pointer;
            margin-left: 10px;
        }
        .tools-section {
            background: var(--card);
            border-radius: var(--radius);
            box-shadow: 0 2px 8px rgba(0,0,0,0.04);
            padding: 14px 12px 10px 12px;
            border: 1px solid var(--border);
            margin-bottom: 18px;
        }
        .tools-section h3 {
            margin: 0 0 10px 0;
            font-size: 1.1rem;
            color: #555;
            font-weight: 500;
        }
        .tools-row {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }
        .tools-row label {
            font-size: 0.98rem;
            color: #444;
        }
        @media (max-width: 600px) {
            .container {
                padding: 8px 2vw 80px 2vw;
            }
            .main-actions button, .main-actions a > button {
                font-size: 1.05rem;
                padding: 14px 0;
            }
            .section-card, .tools-section {
                padding: 10px 4px 8px 4px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="main-actions">
            <form method="GET" action="/position" style="margin:0; width: 100%;">
                <button type="submit" style="background:#27ae60; width: 100%; display: flex; align-items: center; justify-content: center; gap: 8px;">
                    <i class="fas fa-plus-circle"></i> Add Item to Shelf
                </button>
            </form>
            <a href="/searchrack" style="text-decoration:none; width: 100%;">
                <button type="button" style="width: 100%; display: flex; align-items: center; justify-content: center; gap: 8px;">
                    <i class="fas fa-search"></i> Search My Rack
                </button>
            </a>
        </div>

        <div class="section-card" style="overflow-x: auto;">
            <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px;">
                <h2 style="font-size:1.2rem; margin: 0;">Ready to Ship</h2>
                <div style="display: flex; align-items: center; gap: 8px;">
                    <label for="sold-orders-days" style="font-size:0.9rem; white-space: nowrap;">Days:</label>
                    <input type="number" id="sold-orders-days" value="2" min="1" max="120" style="width: 50px; padding: 4px; border: 1px solid #ddd; border-radius: 4px;">
                </div>
            </div>
            <div style="max-height: 400px; overflow-y: auto; border: 1px solid #e0e0e0; border-radius: 6px;">
                <table id="sold-orders-table" style="width: 100%; border-collapse: collapse;">
                    <thead>
                        <tr style="background:#f5f5f5; position: sticky; top: 0; z-index: 10;">
                            <th style="padding: 8px; text-align: left; border-bottom: 2px solid #e0e0e0; font-size: 0.85rem;">Title</th>
                            <th style="padding: 8px; text-align: left; border-bottom: 2px solid #e0e0e0; font-size: 0.85rem;">Info</th>
                            <th style="padding: 8px; text-align: center; border-bottom: 2px solid #e0e0e0; font-size: 0.85rem; width: 60px;">Loc</th>
                            <th style="padding: 8px; text-align: center; border-bottom: 2px solid #e0e0e0; font-size: 0.85rem; width: 40px;">#</th>
                            <th style="padding: 8px; text-align: center; border-bottom: 2px solid #e0e0e0; font-size: 0.85rem; width: 60px;">Status</th>
                        </tr>
                    </thead>
                    <tbody style="font-size: 0.85rem;"></tbody>
                </table>
            </div>
            <div id="sold-popup" class="sold-popup" onclick="hideSoldPopup(event)"><span class="sold-popup-close" onclick="this.parentNode.style.display='none'">&times;</span><span id="sold-popup-content"></span></div>
        </div>

        <div class="main-actions" style="margin-top: 20px;">
            <a href="/tools" style="text-decoration:none; width: 100%;">
                <button type="button" style="width: 100%; background: #6c5ce7; margin: 0;">
                    <i class="fas fa-tools" style="margin-right: 8px;"></i> Tools
                </button>
            </a>
        </div>
    </div>

<script>
function hideSoldPopup(event) {
    // Only close if clicking the background or an image inside the popup
    var popup = document.getElementById('sold-popup');
    var content = document.getElementById('sold-popup-content');
    if (event.target === popup || event.target.tagName === 'IMG') {
        popup.style.display = 'none';
    }
}
function showSoldPopup(contentHtml) {
    console.log('showSoldPopup called with:', contentHtml); // Debug log
    var popup = document.getElementById('sold-popup');
    var content = document.getElementById('sold-popup-content');
    content.innerHTML = contentHtml;
    popup.style.display = 'block';
}
function esc(s) {
    return String(s||'').replace(/&/g, '&amp;').replace(/"/g, '&quot;').replace(/'/g, '&#39;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
}
function tdTitle(order) {
    var fullTitle = esc(order.title || '');
    var titleHtml = `<div style='font-weight:bold;font-size:1.1em;margin-bottom:8px;text-align:center;'>${fullTitle}</div>`;
    
    if (order.image || order.image_url) {
        var imgSrc = esc(order.image || order.image_url);
        var popupContent = titleHtml + `<img src='${imgSrc}' style='display:block;margin:0 auto;max-width:90vw;max-height:60vh;'>`;
        return `<td class='sold-td-small'><a href="#" onclick="event.preventDefault(); showSoldPopup('${popupContent.replace(/'/g, "\\'")}');">${esc(order.title || '')}</a></td>`;
    } else {
        return `<td class='sold-td-small'><a href="#" onclick="event.preventDefault(); showSoldPopup('${titleHtml.replace(/'/g, "\\'")}');">${esc(order.title || '')}</a></td>`;
    }
}
function tdQuantity(order) {
    var qty = order.quantity || '';
    var highlight = parseInt(qty) > 1 ? ' style="color:#e53935;font-weight:bold;background:#ffeaea;"' : '';
    return `<td${highlight}>${qty}</td>`;
}
function tdLocation(order) {
    if (!order.location) return '<td></td>';
    
    var imgUrl = 'https://nexuscentralhq.org/static/gr1new.png';  // Use the known working URL
    var locationText = esc(order.location);
    var popupContent = `<div style='text-align:center;margin-bottom:10px;font-size:1.2em;font-weight:bold;'>Location: ${locationText}</div>`;
    popupContent += `<img src='${imgUrl}' style='display:block;margin:0 auto;max-width:90vw;max-height:65vh;'>`;
    return `<td class='sold-td-small'><a href="#" onclick="showSoldPopup('${popupContent.replace(/'/g, '\\' + "'")}');return false;">${locationText}</a></td>`;
}
function tdInfo(order) {
    var buyer = esc(order.shipping_name || '');
    var address = [order.shipping_street1, order.shipping_street2, order.shipping_city, order.shipping_state, order.shipping_postal_code, order.shipping_country].filter(Boolean).map(esc).join(' ');
    
    // Format price, tax, and fees
    var price = order.price ? `$${parseFloat(order.price).toFixed(2)}` : 'N/A';
    var paidTime = order.paid_time ? new Date(order.paid_time).toLocaleString() : 'N/A';
    var tax = order.tax ? `$${parseFloat(order.tax).toFixed(2)}` : 'N/A';
    var fees = order.fees ? `$${parseFloat(order.fees).toFixed(2)}` : 'N/A';
    var sellerFees = order.seller_fees ? `$${parseFloat(order.seller_fees).toFixed(2)}` : 'N/A';
    
    // Build the popup content - using single quotes for HTML attributes to avoid escaping issues
    var popupContent = [
        "<div style='max-width:300px;'>",
        "<div style='margin-bottom:10px;'>",
        "<b>", buyer, "</b><br>",
        "<span style='font-size:0.98em;'>", address, "</span>",
        "</div>",
        "<hr style='border:none;border-top:1px solid #ddd;margin:10px 0;'>",
        "<div style='margin-bottom:5px;'><b>Price:</b> ", price, "</div>",
        "<div style='margin-bottom:5px;'><b>Paid:</b> ", paidTime, "</div>",
        "<hr style='border:none;border-top:1px solid #ddd;margin:10px 0;'>",
        "<div style='font-size:0.9em;color:#666;'>",
        "<div style='margin-bottom:3px;'><b>Tax:</b> ", tax, "</div>",
        "<div style='margin-bottom:3px;'><b>Fees:</b> ", fees, "</div>",
        "<div><b>Seller Fees:</b> ", sellerFees, "</div>",
        "</div></div>"
    ].join('');
    
    // Escape single quotes for the onclick handler
    var escapedContent = popupContent.replace(/'/g, "\\'");
    return `<td class='sold-td-small'><a href="#" onclick="event.preventDefault(); showSoldPopup('${escapedContent}');">${buyer}</a></td>`;
}
function renderSoldOrders(orders) {
    var tbody = document.querySelector('#sold-orders-table tbody');
    tbody.innerHTML = '';
    orders.forEach(function(order) {
        var tr = document.createElement('tr');
        if (order.isHandled === '1') {
            tr.classList.add('handled');
        }
        tr.innerHTML =
            tdTitle(order) +
            tdInfo(order) +
            tdLocation(order) +
            tdQuantity(order) +
            `<td><button class="handle-btn" data-id="${order.id}" style="background:#4caf50;color:white;border:none;padding:6px 10px;border-radius:4px;font-size:18px;cursor:pointer;">&#10003;</button></td>`;
        tbody.appendChild(tr);
    });
    document.querySelectorAll('.handle-btn').forEach(function(btn) {
        btn.onclick = function() {
            var tr = this.closest('tr');
            var id = this.getAttribute('data-id');
            var isHandled = tr.classList.contains('handled');
            fetch('/mark-order-handled', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ id: id, undo: isHandled })
            })
            .then(function(r) { return r.json(); })
            .then(function(data) {
                if (data.success) {
                    tr.classList.toggle('handled');
                } else {
                    alert('Failed to update handled status: ' + (data.error || 'Unknown error'));
                }
            });
        };
    });
}
function fetchAndShowSoldOrders(days) {
    // First, fetch new sold orders for the given days
    fetch('/get-sold-orders', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ days })
    })
    .then(r => r.json())
    .then(data => {
        // After fetching, load and display the sold orders
        loadSoldOrders(days);
    });
}
function loadSoldOrders(days) {
    days = days || parseInt(document.getElementById('sold-orders-days').value) || 2;
    fetch(`/sold-orders?days=${days}`)
        .then(r => r.json())
        .then(renderSoldOrders);
}
document.getElementById('sold-orders-days').onchange = function() {
    const days = parseInt(this.value) || 2;
    fetchAndShowSoldOrders(days);
};
window.addEventListener('DOMContentLoaded', function() {
    // On load, fetch and show last 48 hours (2 days)
    fetchAndShowSoldOrders(2);
});
document.getElementById('get-sold-orders-btn').onclick = function(e) {
    e.preventDefault();
    const days = parseInt(document.getElementById('sold-days').value) || 90;
    fetch('/get-sold-orders', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ days })
    })
    .then(r => r.json())
    .then(data => {
        if (data.success) {
            alert('Sold orders fetched and stored!');
        } else {
            alert('Failed to fetch sold orders: ' + (data.error || 'Unknown error'));
        }
    });
};
</script>
</body>
</html>
