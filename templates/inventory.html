<!DOCTYPE html>
<html>
<head>
  <title>Inventory List</title>
  <style>
    table { border-collapse: collapse; width: 100%; }
    th, td { border: 1px solid #aaa; padding: 8px; }
    th { background-color: #eee; }
  </style>
</head>
<body>
  <h1>Inventory</h1>
  <table>
    <tr>
      <th>ID</th>
      <th>Title</th>
      <th>ItemID</th>
      <th>SKU</th>
      <th>Price</th>
      <th>Quantity</th>
      <th>Status</th>
      <th>Date Listed</th>
    </tr>
    {% for item in items %}
    <tr>
      <td>{{ item["ID"] }}</td>
      <td>{{ item["Title"] }}</td>
      <td>{{ item["ItemID"] }}</td>
      <td>{{ item["SKU"] }}</td>
      <td>{{ item["Price"] }}</td>
      <td>{{ item["Quantity"] }}</td>
      <td>{{ item["Status"] }}</td>
      <td>{{ item["DateListed"] }}</td>
    </tr>
    {% endfor %}
  </table>
</body>
</html>
