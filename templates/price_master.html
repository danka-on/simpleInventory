<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="icon" type="image/png" href="{{ url_for('static', filename='favicon.ico') }}">
  <title>Price Master</title>

  <script src="/static/i18n.js" defer></script>

  <style>
    :root{
      --pm-ink: var(--ink, #111827);
      --pm-muted: var(--muted, #6b7280);
      --pm-bg: var(--bg, #f3f4f6);
      --pm-card: var(--card, #ffffff);
      --pm-border: var(--border, #e5e7eb);
      --pm-accent: #10b981;
      --pm-accent2: #059669;
      --pm-primary: #0984e3;
      --pm-danger: #e74c3c;
      --pm-radius: 16px;
      --pm-shadow: 0 4px 24px rgba(0,0,0,0.07);
      --pm-hero-from: #10b981;
      --pm-hero-to: #059669;
    }

    *{ box-sizing:border-box; }
    body{
      margin:0;
      padding:0;
      font-family: "Segoe UI", Arial, sans-serif;
      background: var(--pm-bg);
      color: var(--pm-ink);
      min-height: 100vh;
    }

    .wrap{
      max-width: 1280px;
      margin: 0 auto;
      padding: 0 16px 100px;
    }

    /* ─── HERO HEADER ─── */
    .hero{
      background: linear-gradient(135deg, var(--pm-hero-from), var(--pm-hero-to));
      padding: 28px 28px 22px;
      color: #fff;
      position: relative;
      overflow: hidden;
    }
    .hero::before{
      content:'';
      position:absolute;
      top:-40%;right:-10%;
      width:340px;height:340px;
      border-radius:50%;
      background: rgba(255,255,255,0.08);
    }
    .hero::after{
      content:'';
      position:absolute;
      bottom:-30%;left:10%;
      width:200px;height:200px;
      border-radius:50%;
      background: rgba(255,255,255,0.05);
    }
    .heroInner{
      max-width: 1280px;
      margin: 0 auto;
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap: 16px;
      flex-wrap: wrap;
      position:relative;
      z-index:1;
    }
    .heroLeft{
      display:flex;
      align-items:center;
      gap: 14px;
    }
    .heroIcon{
      width:44px;height:44px;
      background: rgba(255,255,255,0.18);
      border-radius:12px;
      display:flex;align-items:center;justify-content:center;
      font-size:1.4rem;
      backdrop-filter: blur(6px);
    }
    .heroTitle{
      font-size: 1.35rem;
      font-weight: 800;
      letter-spacing: -0.02em;
    }
    .heroSub{
      font-size: 0.88rem;
      opacity: 0.85;
      margin-top: 2px;
      font-weight: 500;
    }
    .heroActions{
      display:flex;
      gap: 8px;
      flex-wrap: wrap;
    }
    .heroBtn{
      appearance:none;
      border: 1px solid rgba(255,255,255,0.25);
      background: rgba(255,255,255,0.15);
      backdrop-filter: blur(6px);
      color: #fff;
      padding: 9px 18px;
      border-radius: 10px;
      cursor: pointer;
      font-weight: 700;
      font-size: 0.88rem;
      display:inline-flex;
      align-items:center;
      gap: 6px;
      transition: background .15s, transform .12s;
      white-space: nowrap;
    }
    .heroBtn:hover{ background: rgba(255,255,255,0.25); transform: translateY(-1px); }
    .heroBtn:active{ transform: translateY(0); }
    .heroBtnSolid{
      background: #fff;
      color: var(--pm-hero-from);
      border-color: transparent;
      font-weight: 800;
    }
    .heroBtnSolid:hover{ background: rgba(255,255,255,0.92); }

    /* ─── TOOLBAR ─── */
    .toolbar{
      display:flex;
      align-items:center;
      gap: 10px;
      flex-wrap: wrap;
      padding: 12px 16px;
      background: var(--pm-card);
      border-bottom: 1px solid var(--pm-border);
      box-shadow: 0 2px 8px rgba(0,0,0,0.04);
      position: sticky;
      top: 0;
      z-index: 50;
    }
    html.ss-has-top-banner .toolbar{
      top: 36px;
    }

    .searchPill{
      flex: 1;
      min-width: 200px;
      max-width: 340px;
      position: relative;
    }
    .searchPill input{
      width: 100%;
      padding: 9px 14px;
      border: 1.5px solid var(--pm-border);
      border-radius: 999px;
      background: var(--pm-bg);
      color: var(--pm-ink);
      font-size: 0.9rem;
      outline: none;
      transition: border-color .15s;
    }
    .searchPill input:focus{
      border-color: var(--pm-accent);
    }
    html.ss-theme-night .searchPill input{
      background: rgba(255,255,255,0.05);
      border-color: rgba(255,255,255,0.12);
    }

    .tbSort{
      display:flex;
      align-items:center;
      gap: 6px;
    }
    .tbSort label{
      font-size: 0.82rem;
      font-weight: 700;
      color: var(--pm-muted);
      white-space: nowrap;
    }
    .tbSort select{
      padding: 8px 10px;
      border: 1.5px solid var(--pm-border);
      border-radius: 10px;
      background: var(--pm-bg);
      color: var(--pm-ink);
      font-size: 0.85rem;
      outline: none;
    }
    html.ss-theme-night .tbSort select{
      background: rgba(255,255,255,0.05);
      border-color: rgba(255,255,255,0.12);
    }
    html.ss-theme-night select option,
    html.ss-theme-night select optgroup{
      background: #0f172a;
      color: #e2e8f0;
    }

    .storePills{
      display:flex;
      gap: 6px;
      flex-wrap: wrap;
    }
    .spill{
      display:inline-flex;
      align-items:center;
      gap: 5px;
      padding: 6px 13px;
      border-radius: 999px;
      font-weight: 800;
      font-size: 0.82rem;
      border: 1.5px solid var(--pm-border);
      background: rgba(0,0,0,0.02);
      color: var(--pm-muted);
      white-space: nowrap;
      cursor: pointer;
      transition: all .2s;
      letter-spacing: .3px;
      user-select: none;
    }
    .spill .cnt{
      font-weight: 900;
      font-size: 0.85rem;
      min-width: 14px;
      text-align: center;
    }
    .spill.all{
      border-color: var(--pm-border);
    }
    .spill.all.active{
      background: var(--pm-accent);
      border-color: var(--pm-accent);
      color: #fff;
    }
    .spill.ebay{
      background: rgba(96,165,250,0.10);
      border-color: rgba(96,165,250,0.25);
      color: #3b82f6;
    }
    .spill.ebay.active{
      background: #3b82f6;
      border-color: #3b82f6;
      color: #fff;
      box-shadow: 0 0 0 2px rgba(96,165,250,0.2);
    }
    .spill.ebay .cnt{ color: inherit; }
    .spill.amazon{
      background: rgba(255,153,0,0.10);
      border-color: rgba(255,153,0,0.25);
      color: #f59e0b;
    }
    .spill.amazon.active{
      background: #f59e0b;
      border-color: #f59e0b;
      color: #fff;
      box-shadow: 0 0 0 2px rgba(255,153,0,0.2);
    }
    .spill.amazon .cnt{ color: inherit; }
    .spill.ebay.has-sel{
      background: rgba(96,165,250,0.22);
      border-color: rgba(96,165,250,0.4);
      box-shadow: 0 0 0 2px rgba(96,165,250,0.15);
    }
    .spill.amazon.has-sel{
      background: rgba(255,153,0,0.22);
      border-color: rgba(255,153,0,0.4);
      box-shadow: 0 0 0 2px rgba(255,153,0,0.15);
    }
    html.ss-theme-night .spill{
      background: rgba(255,255,255,0.04);
      border-color: rgba(255,255,255,0.10);
      color: #94a3b8;
    }
    html.ss-theme-night .spill.all.active{
      background: var(--pm-accent);
      border-color: var(--pm-accent);
      color: #fff;
    }
    html.ss-theme-night .spill.ebay{
      background: rgba(96,165,250,0.12);
      border-color: rgba(96,165,250,0.28);
      color: #60a5fa;
    }
    html.ss-theme-night .spill.ebay.active{
      background: #3b82f6;
      border-color: #3b82f6;
      color: #fff;
    }
    html.ss-theme-night .spill.ebay.has-sel{
      background: rgba(96,165,250,0.25);
      border-color: rgba(96,165,250,0.4);
    }
    html.ss-theme-night .spill.amazon{
      background: rgba(251,191,36,0.12);
      border-color: rgba(251,191,36,0.28);
      color: #fbbf24;
    }
    html.ss-theme-night .spill.amazon.active{
      background: #f59e0b;
      border-color: #f59e0b;
      color: #fff;
    }
    html.ss-theme-night .spill.amazon.has-sel{
      background: rgba(251,191,36,0.25);
      border-color: rgba(251,191,36,0.4);
    }

    /* ─── TABLE ─── */
    .tableCard{
      background: var(--pm-card);
      border: 1px solid var(--pm-border);
      border-radius: var(--pm-radius);
      margin: 16px 16px 0;
      box-shadow: var(--pm-shadow);
      overflow: hidden;
    }
    html.ss-theme-night .tableCard{
      border-color: rgba(255,255,255,0.08);
      box-shadow: 0 8px 32px rgba(0,0,0,0.3);
    }
    .tableHeader{
      padding: 12px 16px;
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap: 10px;
      border-bottom: 1px solid var(--pm-border);
    }
    html.ss-theme-night .tableHeader{
      border-bottom-color: rgba(255,255,255,0.08);
      background: rgba(0,0,0,0.08);
    }
    .tableTitle{
      font-weight: 800;
      font-size: 0.95rem;
      display:flex;
      align-items:center;
      gap: 8px;
    }
    .listingCount{
      font-size: 0.82rem;
      font-weight: 700;
      color: var(--pm-muted);
    }

    .tableWrap{
      overflow:auto;
      max-height: 65vh;
    }
    table{
      width: 100%;
      border-collapse: separate;
      border-spacing: 0;
      font-size: 0.9rem;
    }
    thead th{
      position: sticky;
      top: 0;
      z-index: 3;
      background: var(--pm-card);
      border-bottom: 2px solid var(--pm-border);
      padding: 10px 12px;
      text-align: left;
      font-weight: 800;
      font-size: 0.78rem;
      letter-spacing: .5px;
      text-transform: uppercase;
      color: var(--pm-muted);
      white-space: nowrap;
    }
    .th-sortable{
      cursor: pointer;
      user-select: none;
    }
    .th-sortable:hover{
      color: var(--pm-ink);
    }
    .th-sortable .sort-ind{
      font-size: 0.82em;
      opacity: 0.8;
      margin-left: 4px;
      display: inline-block;
      min-width: 10px;
      text-align: center;
    }
    html.ss-has-top-banner .tableWrap thead th{
      top: 0 !important;
    }
    html.ss-theme-night thead th{
      background: var(--pm-card);
      border-bottom-color: rgba(255,255,255,0.08);
    }
    html.ss-theme-night .th-sortable:hover{
      color: #e2e8f0;
    }
    tbody td{
      border-bottom: 1px solid rgba(0,0,0,0.05);
      padding: 10px 12px;
      vertical-align: middle;
    }
    html.ss-theme-night tbody td{
      border-bottom-color: rgba(255,255,255,0.06);
    }
    tbody tr{
      transition: background .12s;
    }
    tbody tr:hover{
      background: rgba(0,0,0,0.02);
    }
    html.ss-theme-night tbody tr:hover{
      background: rgba(255,255,255,0.04);
    }
    /* Store row tinting */
    tbody tr[data-store="ebay"]{
      background: rgba(59,130,246,0.03);
    }
    tbody tr[data-store="amazon"]{
      background: rgba(245,158,11,0.03);
    }
    html.ss-theme-night tbody tr[data-store="ebay"]{
      background: rgba(59,130,246,0.05);
    }
    html.ss-theme-night tbody tr[data-store="amazon"]{
      background: rgba(245,158,11,0.04);
    }
    tbody tr[data-store="ebay"]:hover{
      background: rgba(59,130,246,0.07);
    }
    tbody tr[data-store="amazon"]:hover{
      background: rgba(245,158,11,0.07);
    }
    html.ss-theme-night tbody tr[data-store="ebay"]:hover{
      background: rgba(59,130,246,0.10);
    }
    html.ss-theme-night tbody tr[data-store="amazon"]:hover{
      background: rgba(245,158,11,0.08);
    }

    .badge{
      display:inline-flex;
      align-items:center;
      gap: 5px;
      border-radius: 999px;
      padding: 3px 9px;
      font-size: 0.76rem;
      font-weight: 800;
      letter-spacing: .3px;
      border: 1px solid var(--pm-border);
      background: rgba(0,0,0,0.02);
      color: var(--pm-muted);
      white-space: nowrap;
    }
    html.ss-theme-night .badge{
      background: rgba(255,255,255,0.04);
      border-color: rgba(255,255,255,0.10);
    }
    .badge.ebay{ color: #2563eb; border-color: rgba(37,99,235,0.3); background: rgba(37,99,235,0.08); }
    .badge.amazon{ color: #d97706; border-color: rgba(217,119,6,0.3); background: rgba(217,119,6,0.08); }
    html.ss-theme-night .badge.ebay{ background: rgba(96,165,250,0.15); border-color: rgba(96,165,250,0.25); color: #60a5fa; }
    html.ss-theme-night .badge.amazon{ background: rgba(251,191,36,0.15); border-color: rgba(251,191,36,0.25); color: #fbbf24; }

    .muted{ color: var(--pm-muted); }
    .mono{ font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", monospace; font-size: 0.88em; }

    .newPriceUp{
      color: #ef4444;
      font-weight: 800;
    }
    .newPriceDown{
      color: #22c55e;
      font-weight: 800;
    }

    .btnSm{
      appearance:none;
      border: 1.5px solid var(--pm-border);
      background: var(--pm-card);
      color: var(--pm-ink);
      padding: 7px 14px;
      border-radius: 8px;
      cursor: pointer;
      font-weight: 700;
      font-size: 0.82rem;
      transition: transform .12s, background .15s;
      white-space: nowrap;
    }
    .btnSm:hover{ transform: translateY(-1px); }

    /* ─── FLOATING ACTION BAR ─── */
    .fab{
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      z-index: 60;
      transform: translateY(100%);
      transition: transform .3s cubic-bezier(0.4,0,0.2,1);
      pointer-events: none;
    }
    .fab.visible{
      transform: translateY(0);
      pointer-events: auto;
    }
    .fabInner{
      max-width: 1280px;
      margin: 0 auto;
      padding: 12px 20px;
      background: var(--pm-card);
      border-top: 1px solid var(--pm-border);
      box-shadow: 0 -4px 24px rgba(0,0,0,0.1);
      display:flex;
      align-items:center;
      gap: 12px;
      flex-wrap: wrap;
    }
    html.ss-theme-night .fabInner{
      background: var(--pm-card);
      border-top-color: rgba(255,255,255,0.08);
      box-shadow: 0 -4px 24px rgba(0,0,0,0.4);
    }
    .fabLeft{
      display:flex;
      align-items:center;
      gap: 10px;
      font-weight: 800;
      font-size: 0.92rem;
    }
    .fabCount{
      display:inline-flex;
      align-items:center;
      justify-content:center;
      background: var(--pm-accent);
      color: #fff;
      border-radius: 999px;
      min-width: 28px;
      height: 28px;
      padding: 0 8px;
      font-size: 0.88rem;
      font-weight: 800;
    }
    .fabControls{
      display:flex;
      align-items:center;
      gap: 8px;
      flex: 1;
      flex-wrap: wrap;
    }
    .fabControls label{
      font-size: 0.8rem;
      font-weight: 700;
      color: var(--pm-muted);
      text-transform: uppercase;
    }
    .fabControls select, .fabControls input{
      padding: 8px 10px;
      border: 1.5px solid var(--pm-border);
      border-radius: 8px;
      background: var(--pm-bg);
      color: var(--pm-ink);
      font-size: 0.88rem;
      outline: none;
    }
    html.ss-theme-night .fabControls select,
    html.ss-theme-night .fabControls input{
      background: rgba(255,255,255,0.05);
      border-color: rgba(255,255,255,0.12);
    }
    .fabRight{
      display:flex;
      gap: 8px;
      flex-wrap: wrap;
      margin-left: auto;
    }
    .fabBtn{
      appearance:none;
      border: none;
      padding: 10px 20px;
      border-radius: 10px;
      cursor: pointer;
      font-weight: 700;
      font-size: 0.88rem;
      display:inline-flex;
      align-items:center;
      gap: 6px;
      transition: transform .12s, filter .12s;
      white-space: nowrap;
    }
    .fabBtn:hover{ transform: translateY(-1px); filter: brightness(1.05); }
    .fabBtnApply{
      background: linear-gradient(135deg, #10b981, #059669);
      color: #fff;
    }
    .fabBtnCheck{
      background: var(--pm-bg);
      color: var(--pm-ink);
      border: 1.5px solid var(--pm-border);
    }
    .fabBtnClear{
      background: transparent;
      color: var(--pm-muted);
      font-size: 0.82rem;
      padding: 8px 12px;
    }

    /* ─── COLLAPSIBLE LOG ─── */
    .logCard{
      background: var(--pm-card);
      border: 1px solid var(--pm-border);
      border-radius: var(--pm-radius);
      margin: 16px 16px 0;
      box-shadow: var(--pm-shadow);
      overflow: hidden;
    }
    html.ss-theme-night .logCard{
      border-color: rgba(255,255,255,0.08);
      box-shadow: 0 8px 32px rgba(0,0,0,0.3);
    }
    .logHeader{
      padding: 10px 16px;
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap: 10px;
      cursor: pointer;
      user-select: none;
    }
    .logTitle{
      font-weight: 800;
      font-size: 0.88rem;
      display:flex;
      align-items:center;
      gap: 8px;
      color: var(--pm-muted);
    }
    .logBody{
      max-height: 0;
      overflow: hidden;
      transition: max-height .3s ease;
    }
    .logCard.open .logBody{
      max-height: 250px;
    }
    .logCard.open .logHeader{
      border-bottom: 1px solid var(--pm-border);
    }
    html.ss-theme-night .logCard.open .logHeader{
      border-bottom-color: rgba(255,255,255,0.08);
    }
    .logChev{
      transition: transform .25s ease;
      font-size: 0.8rem;
      color: var(--pm-muted);
    }
    .logCard.open .logChev{
      transform: rotate(180deg);
    }
    .log{
      white-space: pre-wrap;
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", monospace;
      font-size: 0.84rem;
      margin: 0;
      padding: 10px 14px;
      max-height: 220px;
      overflow:auto;
      background: rgba(0,0,0,0.02);
      color: var(--pm-muted);
    }
    html.ss-theme-night .log{
      background: rgba(0,0,0,0.18);
    }

    label{
      font-size: 0.8rem;
      font-weight: 800;
      color: var(--pm-muted);
      letter-spacing: .3px;
      text-transform: uppercase;
    }
    input[type="text"], input[type="number"], select{
      width: 100%;
      padding: 9px 12px;
      border: 1.5px solid var(--pm-border);
      border-radius: 10px;
      background: var(--pm-bg);
      color: var(--pm-ink);
      outline: none;
      font-size: 0.92rem;
      transition: border-color .15s;
    }
    input[type="text"]:focus, input[type="number"]:focus, select:focus{
      border-color: var(--pm-accent);
    }
    html.ss-theme-night input[type="text"],
    html.ss-theme-night input[type="number"],
    html.ss-theme-night select{
      background: rgba(255,255,255,0.05);
      border-color: rgba(255,255,255,0.12);
    }

    /* ─── RESPONSIVE ─── */
    @media (max-width: 900px){
      .hero{ padding: 20px 16px 16px; }
      .heroInner{ flex-direction: column; align-items: flex-start; }
      .heroTitle{ font-size: 1.15rem; }
      .toolbar{ padding: 10px 12px; }
      .searchPill{ max-width: none; }
      .storePills{ margin-left: 0; width: 100%; }
      .tableCard, .logCard{ margin: 12px 8px 0; }
      thead th, tbody td{ padding: 8px 8px; }
      .fabInner{ padding: 10px 12px; }
    }
  </style>
</head>
<body>
  <!-- ─── HERO HEADER ─── -->
  <div class="hero">
    <div class="heroInner">
      <a href="/store-manager" class="heroBtn" style="margin-right:6px;">← Back</a>
      <div class="heroLeft">
        <div class="heroIcon">💰</div>
        <div>
          <div class="heroTitle">Price Master</div>
          <div class="heroSub">Bulk re-pricing for eBay & Amazon listings</div>
        </div>
      </div>
      <div class="heroActions">
        <button class="heroBtnSolid heroBtn" id="refreshBtn" type="button">↻ Refresh</button>
      </div>
    </div>
  </div>

  <!-- ─── TOOLBAR ─── -->
  <div class="toolbar">
    <div class="searchPill">
      <input id="pmSearch" type="text" placeholder="UPC, Title, SKU, ASIN…" />
    </div>

    <div class="tbSort">
      <label for="pmSort">Sort</label>
      <select id="pmSort">
        <option value="list_new">Newest Listed</option>
        <option value="list_old">Oldest Listed</option>
        <option value="chg_new">Recent Change</option>
        <option value="chg_old">Longest Unchanged</option>
        <option value="price_low">Price ↑</option>
        <option value="price_high">Price ↓</option>
      </select>
    </div>

    <div class="storePills" role="tablist" aria-label="Store filter">
      <button type="button" class="spill all active" data-store="all">All <span class="cnt" id="kpiAll">0</span></button>
      <button type="button" class="spill ebay" data-store="ebay" id="kpiEbayPill">eBay <span class="cnt" id="kpiEbay">0</span></button>
      <button type="button" class="spill amazon" data-store="amazon" id="kpiAmazonPill">Amz <span class="cnt" id="kpiAmazon">0</span></button>
    </div>
  </div>

  <div class="wrap">
    <!-- ─── LISTINGS TABLE ─── -->
    <div class="tableCard">
      <div class="tableHeader">
        <div class="tableTitle">
          📋 Listings <span class="listingCount" id="pmStatus"></span>
        </div>
        <div style="display:flex;gap:6px;align-items:center;">
          <input type="checkbox" id="selectAllCheckbox" title="Select all shown" style="width:16px;height:16px;cursor:pointer;">
          <button class="btnSm" type="button" id="selectAllBtn">Select All</button>
          <button class="btnSm" type="button" id="clearSelBtn">Clear</button>
        </div>
      </div>
      <div class="tableWrap">
        <table>
          <thead>
            <tr>
              <th style="width:38px;"></th>
              <th style="width:90px;">Store</th>
              <th>Item</th>
              <th style="width:150px;">ID</th>
              <th class="th-sortable" data-sort-column="price" title="Sort by price" role="button" tabindex="0" aria-sort="none" style="width:100px;">Price <span class="sort-ind" data-sort-indicator="price"></span></th>
              <th style="width:110px;">New Price</th>
              <th class="th-sortable" data-sort-column="list_age" title="Sort by list age" role="button" tabindex="0" aria-sort="ascending" style="width:130px;">List Age <span class="sort-ind" data-sort-indicator="list_age"></span></th>
              <th class="th-sortable" data-sort-column="since_change" title="Sort by time since last change" role="button" tabindex="0" aria-sort="none" style="width:150px;">Since Change <span class="sort-ind" data-sort-indicator="since_change"></span></th>
            </tr>
          </thead>
          <tbody id="pmTbody"></tbody>
        </table>
      </div>
    </div>

    <!-- ─── COLLAPSIBLE LOG ─── -->
    <div class="logCard" id="logPanel">
      <div class="logHeader" id="logToggle">
        <div class="logTitle">📝 Activity Log</div>
        <div style="display:flex;gap:8px;align-items:center;">
          <button class="btnSm" type="button" id="clearLogBtn" onclick="event.stopPropagation()">Clear</button>
          <span class="logChev">▼</span>
        </div>
      </div>
      <div class="logBody">
        <pre class="log" id="pmLog"></pre>
      </div>
    </div>
  </div>

  <!-- ─── FLOATING ACTION BAR ─── -->
  <div class="fab" id="fabBar">
    <div class="fabInner">
      <div class="fabLeft">
        <span class="fabCount" id="fabCount">0</span>
        <span>selected</span>
      </div>
      <div class="fabControls">
        <select id="pmMode" style="width:auto;">
          <option value="delta">$ ±</option>
          <option value="percent">% ±</option>
        </select>
        <input id="pmValue" type="number" step="0.01" placeholder="e.g. -5 or 1.25" style="width:140px;" />
      </div>
      <div class="fabRight">
        <button class="fabBtn fabBtnApply" type="button" id="applyBtn">✓ Apply</button>
        <button class="fabBtn fabBtnCheck" type="button" id="checkFeedBtn">Check Feed</button>
        <button class="fabBtn fabBtnClear" type="button" id="fabClearBtn">✕ Clear</button>
      </div>
    </div>
  </div>

  <script>
    const $ = (id) => document.getElementById(id);

    const state = {
      all: [],
      store: 'all',
      q: '',
      sort: 'list_new',
      selected: new Set(),
      mode: 'delta',
      value: null,
      lastRenderKeys: [],
    };
    const feedCheckAttempts = {};
    let lastFeedId = null;
    const ebayUpdateKey = 'pm_last_ebay_updates';
    const headerSortMap = {
      price: {asc: 'price_low', desc: 'price_high'},
      list_age: {asc: 'list_new', desc: 'list_old'},
      since_change: {asc: 'chg_new', desc: 'chg_old'}
    };

    function setLastFeedId(id){
      if(!id) return;
      lastFeedId = String(id);
      try{ localStorage.setItem('pm_last_feed_id', lastFeedId); }catch(e){}
    }

    function getLastFeedId(){
      if(lastFeedId) return lastFeedId;
      try{
        const v = localStorage.getItem('pm_last_feed_id');
        if(v){
          lastFeedId = v;
          return v;
        }
      }catch(e){}
      const logText = ($('pmLog') && $('pmLog').textContent) ? $('pmLog').textContent : '';
      const m = logText.match(/feed\s+(\d+)/i);
      if(m){
        setLastFeedId(m[1]);
        return m[1];
      }
      return null;
    }

    function pushEbayUpdate(itemId, expectedPrice){
      if(!itemId) return;
      let arr = [];
      try{ arr = JSON.parse(localStorage.getItem(ebayUpdateKey) || '[]'); }catch(e){ arr = []; }
      if(!Array.isArray(arr)) arr = [];
      arr = arr.filter(x => x && x.item_id !== itemId);
      arr.unshift({item_id: String(itemId), expected_price: expectedPrice ?? null, ts: Date.now()});
      if(arr.length > 10) arr = arr.slice(0, 10);
      try{ localStorage.setItem(ebayUpdateKey, JSON.stringify(arr)); }catch(e){}
    }

    function getRecentEbayUpdates(){
      try{
        const arr = JSON.parse(localStorage.getItem(ebayUpdateKey) || '[]');
        if(Array.isArray(arr) && arr.length) return arr;
      }catch(e){}
      const logText = ($('pmLog') && $('pmLog').textContent) ? $('pmLog').textContent : '';
      const m = logText.match(/ebay:(\d+)\s+\$[0-9.]+\s+→\s+\$([0-9.]+)/i);
      if(m){
        const itemId = m[1];
        const expected = Number(m[2]);
        if(Number.isFinite(expected)) return [{item_id: itemId, expected_price: expected}];
        return [{item_id: itemId}];
      }
      return [];
    }

    function keyFor(it){
      return `${it.platform}:${it.listing_key}`;
    }

    function sortDirectionForColumn(column){
      const map = headerSortMap[String(column || '').trim()];
      if(!map) return null;
      if(state.sort === map.asc) return 'asc';
      if(state.sort === map.desc) return 'desc';
      return null;
    }

    function setSort(sortValue){
      const next = String(sortValue || '').trim();
      if(!next) return;
      state.sort = next;
      const sortSelect = $('pmSort');
      if(sortSelect && sortSelect.value !== next) sortSelect.value = next;
      render();
    }

    function toggleHeaderSort(column){
      const key = String(column || '').trim();
      const map = headerSortMap[key];
      if(!map) return;
      const dir = sortDirectionForColumn(key);
      setSort(dir === 'asc' ? map.desc : map.asc);
    }

    function updateSortHeaderUi(){
      const sortSelect = $('pmSort');
      if(sortSelect && sortSelect.value !== state.sort) sortSelect.value = state.sort;

      document.querySelectorAll('th.th-sortable[data-sort-column]').forEach((el) => {
        const key = el.getAttribute('data-sort-column') || '';
        const dir = sortDirectionForColumn(key);
        const indicator = el.querySelector('[data-sort-indicator]');
        if(indicator) indicator.textContent = dir === 'asc' ? '▲' : (dir === 'desc' ? '▼' : '');
        el.setAttribute('aria-sort', dir === 'asc' ? 'ascending' : (dir === 'desc' ? 'descending' : 'none'));
      });
    }

    function toNumber(v){
      if(v === null || v === undefined) return null;
      const n = Number(v);
      if(!Number.isFinite(n)) return null;
      return n;
    }

    function fmtUsd(n){
      const v = toNumber(n);
      if(v === null) return '';
      return '$' + v.toFixed(2);
    }

    function fmtDate(iso){
      if(!iso) return '';
      try{
        const d = new Date(iso);
        if(Number.isNaN(d.getTime())) return String(iso);
        return d.toLocaleString([], {year:'numeric', month:'short', day:'2-digit', hour:'2-digit', minute:'2-digit'});
      }catch(e){
        return String(iso);
      }
    }

    function fmtAge(iso){
      if(!iso) return '';
      const d = new Date(iso);
      if(Number.isNaN(d.getTime())) return '';
      const ms = Date.now() - d.getTime();
      const mins = Math.max(0, Math.floor(ms / 60000));
      const hrs = Math.floor(mins / 60);
      const days = Math.floor(hrs / 24);
      if(days > 0) return `${days}d`;
      if(hrs > 0) return `${hrs}h`;
      return `${mins}m`;
    }

    function computeNewPrice(oldPrice){
      const base = toNumber(oldPrice);
      if(base === null) return null;
      const mode = state.mode;
      const val = toNumber(state.value);
      if(val === null) return null;
      let next = base;
      if(mode === 'delta') next = base + val;
      else if(mode === 'percent') next = base * (1 + (val / 100));
      next = Math.max(0, next);
      next = Math.round(next * 100) / 100;
      return next;
    }

    function escapeHtml(s){
      return String(s ?? '')
        .replaceAll('&', '&amp;')
        .replaceAll('<', '&lt;')
        .replaceAll('>', '&gt;')
        .replaceAll('"', '&quot;')
        .replaceAll("'", '&#039;');
    }

    function log(line){
      const ts = new Date().toLocaleTimeString([], {hour:'2-digit', minute:'2-digit', second:'2-digit'});
      const el = $('pmLog');
      if(!el) return;
      el.textContent = `[${ts}] ${line}\n` + el.textContent;
      try{
        const lines = el.textContent.split('\n');
        if(lines.length > 250) el.textContent = lines.slice(0, 250).join('\n');
      }catch(e){}
      const lp = $('logPanel');
      if(lp && !lp.classList.contains('open')) lp.classList.add('open');
    }

    function setStatus(text){
      const el = $('pmStatus');
      if(el) el.textContent = text || '';
    }

    function applyFilters(){
      const q = (state.q || '').trim().toLowerCase();
      let rows = Array.isArray(state.all) ? state.all.slice() : [];

      if(state.store !== 'all'){
        rows = rows.filter(it => it.platform === state.store);
      }

      if(q){
        rows = rows.filter(it => {
          const hay = [
            it.title,
            it.upc,
            it.asin,
            it.sku,
            it.item_id,
            it.listing_key,
          ].filter(Boolean).join(' ').toLowerCase();
          return hay.includes(q);
        });
      }

      const ts = (iso) => {
        if(!iso) return 0;
        const d = new Date(iso);
        const t = d.getTime();
        return Number.isFinite(t) ? t : 0;
      };

      const listT = (it) => ts(it.list_date || it.first_seen_at || it.last_updated);
      const chgT = (it) => ts(it.last_price_change_at);

      const sort = state.sort;
      rows.sort((a,b) => {
        if(sort === 'list_new') return listT(b) - listT(a);
        if(sort === 'list_old') return listT(a) - listT(b);
        if(sort === 'chg_new') return chgT(b) - chgT(a);
        if(sort === 'chg_old') return chgT(a) - chgT(b);
        if(sort === 'price_low') return (toNumber(a.price) ?? 0) - (toNumber(b.price) ?? 0);
        if(sort === 'price_high') return (toNumber(b.price) ?? 0) - (toNumber(a.price) ?? 0);
        return 0;
      });

      return rows;
    }

    function updateFab(){
      const count = state.selected.size;
      const fab = $('fabBar');
      if(!fab) return;
      fab.classList.toggle('visible', count > 0);
      $('fabCount').textContent = String(count);
    }

    function updateKpis(shown){
      let ebay = 0, amazon = 0, ebSel = 0, amSel = 0;
      for(const it of shown){
        const k = keyFor(it);
        if(it.platform === 'ebay'){ ebay++; if(state.selected.has(k)) ebSel++; }
        else if(it.platform === 'amazon'){ amazon++; if(state.selected.has(k)) amSel++; }
      }
      const hasSel = state.selected.size > 0;
      $('kpiAll').textContent = String(ebay + amazon);
      $('kpiEbay').textContent = hasSel ? `${ebSel}/${ebay}` : String(ebay);
      $('kpiAmazon').textContent = hasSel ? `${amSel}/${amazon}` : String(amazon);
      const ebPill = $('kpiEbayPill');
      const amPill = $('kpiAmazonPill');
      if(ebPill) ebPill.classList.toggle('has-sel', ebSel > 0 && state.store !== 'ebay');
      if(amPill) amPill.classList.toggle('has-sel', amSel > 0 && state.store !== 'amazon');
      updateFab();
    }

    function render(){
      const tbody = $('pmTbody');
      if(!tbody) return;

      const rows = applyFilters();
      state.lastRenderKeys = rows.map(keyFor);
      updateKpis(rows);
      updateSortHeaderUi();

      const val = toNumber(state.value);
      setStatus(rows.length ? `${rows.length} listing(s)` : 'No results');

      tbody.innerHTML = '';
      for(const it of rows){
        const k = keyFor(it);
        const tr = document.createElement('tr');
        tr.setAttribute('data-store', it.platform);

        const selected = state.selected.has(k);

        const listIso = it.list_date || it.first_seen_at || it.last_updated || '';
        const chgIso = it.last_price_change_at || '';

        const newPrice = (val === null) ? null : computeNewPrice(it.price);
        const oldP = toNumber(it.price);
        let npClass = '';
        if(newPrice !== null && oldP !== null){
          npClass = newPrice > oldP ? 'newPriceUp' : (newPrice < oldP ? 'newPriceDown' : '');
        }

        tr.innerHTML = `
          <td><input type="checkbox" class="pmRowCb" data-key="${k}" ${selected ? 'checked' : ''} style="width:15px;height:15px;cursor:pointer;"></td>
          <td>${it.platform === 'ebay' ? '<span class="badge ebay">eBay</span>' : '<span class="badge amazon">Amazon</span>'}</td>
          <td>
            <div style="font-weight:800; line-height:1.2; font-size:0.88rem;">${escapeHtml(it.title || '(no title)')}</div>
            <div class="muted mono" style="margin-top:3px; font-size:0.78em;">${escapeHtml(it.upc || it.asin || '')}</div>
          </td>
          <td class="mono" style="font-size:0.82em;">${escapeHtml(it.listing_key || '')}</td>
          <td><span class="mono" style="font-weight:800;">${fmtUsd(it.price)}</span></td>
          <td>${newPrice === null ? '<span class="muted">—</span>' : `<span class="mono ${npClass}">${fmtUsd(newPrice)}</span>`}</td>
          <td>
            <div class="mono" style="font-weight:800;">${fmtAge(listIso)}</div>
            <div class="muted" style="margin-top:2px; font-size:0.78em;">${escapeHtml(fmtDate(listIso))}</div>
          </td>
          <td>
            <div class="mono" style="font-weight:800;">${chgIso ? fmtAge(chgIso) : ''}</div>
            <div class="muted" style="margin-top:2px; font-size:0.78em;">${chgIso ? escapeHtml(fmtDate(chgIso)) : '<span class="muted">—</span>'}</div>
          </td>
        `;

        tbody.appendChild(tr);
      }

      tbody.querySelectorAll('.pmRowCb').forEach(cb => {
        cb.addEventListener('change', (e) => {
          const key = e.target.getAttribute('data-key');
          if(!key) return;
          if(e.target.checked) state.selected.add(key);
          else state.selected.delete(key);
          updateKpis(applyFilters());
          updateFab();
        });
      });

      const allShownSelected = state.lastRenderKeys.length > 0 && state.lastRenderKeys.every(k => state.selected.has(k));
      $('selectAllCheckbox').checked = allShownSelected;
    }

    async function loadListings(){
      setStatus('Loading…');
      try{
        const r = await fetch('/api/pricemaster/listings', {cache:'no-store'});
        const j = await r.json();
        if(!r.ok || j.success === false) throw new Error(j.error || `Request failed (${r.status})`);
        state.all = j.items || [];
        log(`Loaded ${state.all.length} listing(s).`);
        render();
      }catch(e){
        setStatus('Load failed');
        log(`Load failed: ${e.message}`);
        state.all = [];
        render();
      }
    }

    async function applyBulkUpdate(){
      const val = toNumber(state.value);
      if(val === null){
        log('Enter a value first.');
        return;
      }
      if(state.selected.size === 0){
        log('Select at least one listing.');
        return;
      }

      const targets = [];
      for(const key of state.selected){
        const parts = key.split(':');
        if(parts.length !== 2) continue;
        targets.push({platform: parts[0], listing_key: parts[1]});
      }

      setStatus('Updating…');
      log(`Bulk update started (${targets.length} item(s))…`);

      try{
        const r = await fetch('/api/pricemaster/bulk_update', {
          method: 'POST',
          headers: {'Content-Type': 'application/json', 'Accept':'application/json'},
          body: JSON.stringify({
            adjustment: {mode: state.mode, value: val},
            targets: targets
          })
        });
        const j = await r.json().catch(() => ({}));
        if(!r.ok || j.success === false) throw new Error(j.error || `Update failed (${r.status})`);

        const res = j.results || [];
        const pending = res.filter(x => x && x.pending).length;
        const ok = res.filter(x => x && x.success && !x.pending).length;
        const bad = res.length - ok - pending;
        if(pending > 0){
          log(`Done. ${ok} success • ${pending} pending • ${bad} failed`);
        } else {
          log(`Done. ${ok} success • ${bad} failed`);
        }

        for(const row of res){
          if(!row) continue;
          const tag = `${row.platform || '?'}:${row.listing_key || '?'}`;
          if(row.success && row.pending){
            const note = row.note ? ` (${row.note})` : '';
            log(`⏳ ${tag} ${fmtUsd(row.old_price)} → ${fmtUsd(row.new_price)}${note}`);
            const feedIdMatch = (row.note || '').match(/feed\s+(\d+)/i);
            if(feedIdMatch){
              const feedId = feedIdMatch[1];
              setLastFeedId(feedId);
              setTimeout(() => checkFeedStatus(feedId), 2500);
            }
          } else if(row.success){
            const note = row.note ? ` (${row.note})` : '';
            log(`✓ ${tag} ${fmtUsd(row.old_price)} → ${fmtUsd(row.new_price)}${note}`);
            const feedIdMatch = (row.note || '').match(/feed\s+(\d+)/i);
            if(feedIdMatch) setLastFeedId(feedIdMatch[1]);
            if((row.platform || '').toLowerCase() === 'ebay'){
              pushEbayUpdate(row.listing_key, row.new_price);
            }
          } else {
            log(`✗ ${tag} failed: ${row.error || 'Unknown error'}`);
          }
        }

        await loadListings();
      }catch(e){
        log(`Bulk update failed: ${e.message}`);
      }finally{
        setStatus('');
      }
    }

    async function checkFeedStatus(feedId){
      if(!feedId) return;
      setLastFeedId(feedId);
      feedCheckAttempts[feedId] = (feedCheckAttempts[feedId] || 0) + 1;
      try{
        const r = await fetch('/api/pricemaster/feed_status', {
          method: 'POST',
          headers: {'Content-Type':'application/json', 'Accept':'application/json'},
          body: JSON.stringify({feed_id: feedId})
        });
        const j = await r.json().catch(() => ({}));
        if(!r.ok || j.success === false) throw new Error(j.error || `Feed status failed (${r.status})`);
        const st = (j.status || '').toString();
        if(j.report && j.report.error_count > 0){
          const msg = (j.report_errors && j.report_errors[0] && j.report_errors[0].message) ? j.report_errors[0].message : 'Feed processing error';
          log(`Feed ${feedId} status: ${st} (errors: ${j.report.error_count}) — ${msg}`);
        } else {
          log(`Feed ${feedId} status: ${st}${j.applied ? ' (applied)' : ''}`);
        }
        if(j.applied){
          await loadListings();
        } else if(['IN_QUEUE','IN_PROGRESS'].includes(st.toUpperCase())) {
          if(feedCheckAttempts[feedId] < 3){
            setTimeout(() => checkFeedStatus(feedId), 20000);
          }
        }
      }catch(e){
        log(`Feed ${feedId} status check failed: ${e.message}`);
      }
    }

    async function checkEbayStatus(items){
      if(!items || !items.length) return;
      try{
        const r = await fetch('/api/pricemaster/ebay_verify', {
          method: 'POST',
          headers: {'Content-Type':'application/json', 'Accept':'application/json'},
          body: JSON.stringify({items})
        });
        const j = await r.json().catch(() => ({}));
        if(!r.ok || j.success === false) throw new Error(j.error || `eBay verify failed (${r.status})`);
        const list = j.items || [];
        let anyApplied = false;
        for(const it of list){
          const itemId = it.item_id || '?';
          if(it.error){
            log(`eBay ${itemId} check failed: ${it.error}`);
            continue;
          }
          const price = fmtUsd(it.price);
          if(it.applied === true){
            anyApplied = true;
            log(`eBay ${itemId} status: ${price} (applied)`);
          } else if(it.applied === false){
            const exp = it.expected_price != null ? fmtUsd(it.expected_price) : '';
            log(`eBay ${itemId} status: ${price}${exp ? ` (expected ${exp})` : ''}`);
          } else {
            log(`eBay ${itemId} status: ${price}`);
          }
        }
        if(anyApplied) await loadListings();
      }catch(e){
        log(`eBay status check failed: ${e.message}`);
      }
    }

    function setStoreFilter(store){
      state.store = store;
      document.querySelectorAll('.spill').forEach(b => b.classList.toggle('active', b.getAttribute('data-store') === store));
      constrainSelectionToStore();
      render();
    }

    function constrainSelectionToStore(){
      if(state.store === 'all') return;
      const prefix = `${state.store}:`;
      for(const key of Array.from(state.selected)){
        if(!key.startsWith(prefix)) state.selected.delete(key);
      }
    }

    // ─── EVENT BINDINGS ───
    $('refreshBtn').addEventListener('click', loadListings);
    $('pmSearch').addEventListener('input', (e) => { state.q = e.target.value || ''; render(); });
    $('pmSort').addEventListener('change', (e) => { setSort(e.target.value); });
    $('pmMode').addEventListener('change', (e) => { state.mode = e.target.value; render(); });
    $('pmValue').addEventListener('input', (e) => {
      const raw = (e.target.value || '').trim();
      state.value = raw === '' ? null : Number(raw);
      render();
    });
    $('applyBtn').addEventListener('click', applyBulkUpdate);
    $('checkFeedBtn').addEventListener('click', () => {
      const id = getLastFeedId();
      if(!id){
        const ebayItems = getRecentEbayUpdates();
        if(ebayItems.length){
          checkEbayStatus(ebayItems);
          return;
        }
        const manual = prompt('Enter Amazon feed id or eBay ItemID (from log):', '');
        if(manual && manual.trim()){
          const raw = manual.trim();
          if(/^\d{8,}$/.test(raw)){
            checkEbayStatus([{item_id: raw}]);
          } else {
            setLastFeedId(raw);
            checkFeedStatus(raw);
          }
          return;
        }
        log('No recent Amazon feed or eBay update. Run an update first.');
        return;
      }
      checkFeedStatus(id);
    });
    $('selectAllBtn').addEventListener('click', () => {
      constrainSelectionToStore();
      for(const k of state.lastRenderKeys) state.selected.add(k);
      render();
    });
    $('clearSelBtn').addEventListener('click', () => {
      state.selected.clear();
      render();
    });
    $('selectAllCheckbox').addEventListener('change', (e) => {
      if(e.target.checked){
        constrainSelectionToStore();
        for(const k of state.lastRenderKeys) state.selected.add(k);
      } else {
        for(const k of state.lastRenderKeys) state.selected.delete(k);
      }
      render();
    });
    $('clearLogBtn').addEventListener('click', () => { $('pmLog').textContent = ''; });
    $('fabClearBtn').addEventListener('click', () => { state.selected.clear(); render(); });
    document.querySelectorAll('.spill').forEach(b => b.addEventListener('click', () => setStoreFilter(b.getAttribute('data-store'))));
    document.querySelectorAll('th.th-sortable[data-sort-column]').forEach((el) => {
      const triggerSort = () => toggleHeaderSort(el.getAttribute('data-sort-column'));
      el.addEventListener('click', triggerSort);
      el.addEventListener('keydown', (e) => {
        if(e.key === 'Enter' || e.key === ' '){
          e.preventDefault();
          triggerSort();
        }
      });
    });

    // Collapsible log
    $('logToggle').addEventListener('click', (e) => {
      if(e.target.closest('.btnSm')) return;
      $('logPanel').classList.toggle('open');
    });

    // Init
    document.addEventListener('DOMContentLoaded', () => {
      try{ if(window.applyTranslations) window.applyTranslations(); }catch(e){}
      loadListings();
    });
  </script>
</body>
</html>
