<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title data-i18n="store_manager">Store Manager</title>
  <style>
    :root {
      --primary: #0984e3;
      --accent: #00b894;
      --bg: #f9f9f9;
      --card: #fff;
      --border: #e0e0e0;
      --radius: 14px;
      --ink: #0f172a;
      --muted: #64748b;
    }
    body {
      font-family: 'Segoe UI', Arial, sans-serif;
      background: var(--bg);
      margin: 0;
      padding: 18px;
      color: var(--ink);
    }
    .container {
      max-width: 520px;
      margin: 0 auto;
    }
    .top {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      margin-bottom: 16px;
    }
    h1 {
      margin: 0;
      font-size: 1.4rem;
      text-align: center;
      flex: 1;
    }
    .grid {
      display: grid;
      gap: 10px;
    }
    .tool-btn {
      display: flex;
      align-items: center;
      gap: 10px;
      border-radius: var(--radius);
      padding: 14px 16px;
      min-height: 64px;
      color: #fff;
      text-decoration: none;
      font-weight: 600;
      box-shadow: 0 2px 8px rgba(0,0,0,0.06);
      transition: transform 0.12s ease, filter 0.12s ease;
    }
    .tool-btn:hover { transform: translateY(-1px); filter: brightness(1.05); }
    .tool-btn .icon { font-size: 1.1rem; }
    .hint {
      margin-top: 6px;
      font-size: 0.85rem;
      color: #ffffff;
      font-weight: 500;
    }
    .tool-btn.list { background: linear-gradient(135deg,#4f46e5 0%, #4338ca 100%); }
    .tool-btn.price { background: linear-gradient(135deg,#16a34a 0%, #15803d 100%); }
    .tool-btn.label { background: linear-gradient(135deg,#111827 0%, #374151 100%); border: 1px solid rgba(255,255,255,0.12); }
    .tool-btn.fb { background: #1877f2; }
    .tool-btn.doctor { background: linear-gradient(135deg,#f87171 0%, #ef4444 100%); }

    /* Night mode */
    html.ss-theme-night body { background: #0f172a; color: #e2e8f0; }
    html.ss-theme-night h1 { color: #e2e8f0; }
    html.ss-theme-night .tool-btn { color: #f8fafc; }
  </style>
</head>
<body>
  <div class="container">
    <div class="top">
      <h1 data-i18n="store_manager">Store Manager</h1>
    </div>

    <div class="grid">
      <a class="tool-btn list" href="/items-to-list">
        <span class="icon">📋</span>
        <div>
          <div data-i18n="list_manager">List Manager</div>
        </div>
      </a>
      <a class="tool-btn price" href="/price-master">
        <span class="icon">💲</span>
        <div>
          <div><span data-i18n="price_master">Price Master</span> <span class="uc">(Under Construction 🚧)</span></div>
          <div class="hint">Bulk price updates</div>
        </div>
      </a>
      <a class="tool-btn label" href="/label-master">
        <span class="icon">🏷️</span>
        <div>
          <div>Label Master <span class="uc">(Under Construction 🚧)</span></div>
          <div class="hint">Buy & print labels</div>
        </div>
      </a>
      <a class="tool-btn doctor" href="/store-listing-helper">
        <span class="icon">🩺</span>
        <div>
          <div><span data-i18n="store_helper">Store Doctor</span> <span class="uc">(Under Construction 🚧)</span></div>
          <div class="hint">Listings diagnostics</div>
        </div>
      </a>
      <a class="tool-btn fb" href="/fb-listings?return=/store-manager">
        <span class="icon">📘</span>
        <div>
          <div><span data-i18n="fb_listings">FB Listings</span> <span class="uc">(Under Construction 🚧)</span></div>
          <div class="hint">Facebook Marketplace</div>
        </div>
      </a>
    </div>
  </div>

  <script src="/static/i18n.js"></script>
</body>
</html>
