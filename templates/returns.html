<!DOCTYPE html>
<html lang="en">
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="icon" type="image/png" href="{{ url_for('static', filename='favicon.ico') }}">
    <title>Returns - Sweet Shelves</title>
    <style>
        :root {
            --primary: #0984e3;
            --accent: #00b894;
            --danger: #e74c3c;
            --warning: #f39c12;
            --bg: #f9f9f9;
            --card: #fff;
            --border: #e0e0e0;
            --radius: 14px;
        }
        body {
            font-family: 'Segoe UI', Arial, sans-serif;
            background: var(--bg);
            margin: 0;
            padding: 0;
            min-height: 100vh;
        }
        .container {
            max-width: 1400px;
            margin: 0 auto;
            padding: 20px 16px 80px 16px;
        }
        h1 {
            margin: 0 0 18px 0;
            font-weight: 600;
            color: #2c3e50;
            text-align: center;
        }
        .header-controls {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
            margin-bottom: 20px;
            flex-wrap: wrap;
        }
        .filters {
            display: flex;
            gap: 12px;
            flex-wrap: wrap;
            flex: 1;
        }
        .filters select,
        .filters input {
            padding: 8px 12px;
            border: 1px solid #ddd;
            border-radius: 8px;
            font-size: 0.95rem;
            background: white;
        }
        .btn {
            padding: 8px 14px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 500;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            transition: all 0.2s;
        }
        .btn-primary {
            background: var(--primary);
            color: white;
        }
        .btn-primary:hover {
            background: var(--accent);
        }
        .btn-danger {
            background: var(--danger);
            color: white;
        }
        .btn-warning {
            background: var(--warning);
            color: white;
        }
        .btn-success {
            background: var(--accent);
            color: white;
        }
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 16px;
            margin-bottom: 20px;
        }
        .stat-card {
            background: var(--card);
            border-radius: var(--radius);
            padding: 16px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.04);
            border: 1px solid var(--border);
        }
        .stat-card h3 {
            margin: 0 0 8px 0;
            font-size: 0.85rem;
            color: #888;
            text-transform: uppercase;
            font-weight: 500;
        }
        .stat-card .value {
            font-size: 1.8rem;
            font-weight: 600;
            color: #2c3e50;
        }
        .returns-table {
            background: var(--card);
            border-radius: var(--radius);
            box-shadow: 0 2px 8px rgba(0,0,0,0.04);
            border: 1px solid var(--border);
            overflow: hidden;
        }
        table {
            width: 100%;
            border-collapse: collapse;
        }
        th {
            background: #f8f9fa;
            padding: 12px;
            text-align: left;
            font-weight: 600;
            color: #555;
            border-bottom: 2px solid var(--border);
            font-size: 0.9rem;
        }
        td {
            padding: 12px;
            border-bottom: 1px solid #f0f0f0;
            font-size: 0.95rem;
        }
        tr:hover {
            background: #f8f9fa;
        }
        .badge {
            display: inline-block;
            padding: 4px 8px;
            border-radius: 4px;
            font-size: 0.8rem;
            font-weight: 500;
        }
        .badge-amazon {
            background: #ff9900;
            color: white;
        }
        .badge-ebay {
            background: #0064d2;
            color: white;
        }
        .badge-pending {
            background: #f39c12;
            color: white;
        }
        .badge-received {
            background: #3498db;
            color: white;
        }
        .badge-restocked {
            background: #00b894;
            color: white;
        }
        .badge-relisted {
            background: #6c5ce7;
            color: white;
        }
        .badge-resold {
            background: #00b894;
            color: white;
        }
        .lifecycle-indicator {
            display: inline-flex;
            align-items: center;
            gap: 4px;
            font-size: 0.75rem;
            padding: 2px 6px;
            border-radius: 3px;
            background: #f0f0f0;
            color: #666;
        }
        .timeline {
            position: relative;
            padding-left: 30px;
            margin: 20px 0;
        }
        .timeline-item {
            position: relative;
            padding-bottom: 20px;
            border-left: 2px solid #e0e0e0;
        }
        .timeline-item:last-child {
            border-left: 2px solid transparent;
        }
        .timeline-icon {
            position: absolute;
            left: -9px;
            width: 16px;
            height: 16px;
            border-radius: 50%;
            background: #fff;
            border: 2px solid #3498db;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 10px;
        }
        .timeline-icon.auto {
            border-color: #00b894;
        }
        .timeline-content {
            margin-left: 20px;
        }
        .timeline-date {
            color: #888;
            font-size: 0.85rem;
            margin-bottom: 4px;
        }
        .timeline-text {
            font-size: 0.95rem;
            color: #333;
        }
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.5);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 1000;
        }
        .modal-content {
            background: white;
            padding: 24px;
            border-radius: 12px;
            max-width: 500px;
            width: 90%;
            max-height: 80vh;
            overflow-y: auto;
        }
        .modal-header {
            margin: 0 0 16px 0;
            font-size: 1.25rem;
            font-weight: 600;
        }
        .form-group {
            margin-bottom: 16px;
        }
        .form-group label {
            display: block;
            margin-bottom: 4px;
            font-weight: 500;
        }
        .form-group input,
        .form-group select,
        .form-group textarea {
            width: 100%;
            padding: 8px;
            border: 1px solid #ddd;
            border-radius: 6px;
            font-size: 0.95rem;
        }
        .form-group textarea {
            min-height: 60px;
            resize: vertical;
        }
        .modal-actions {
            display: flex;
            gap: 8px;
            justify-content: flex-end;
            margin-top: 20px;
        }
        .btn-lifecycle {
            padding: 4px 8px;
            font-size: 0.85rem;
            margin-left: 4px;
            white-space: nowrap;
        }
        .message {
            padding: 12px;
            border-radius: 8px;
            margin-bottom: 16px;
            display: none;
        }
        .message.success {
            background: #d4edda;
            color: #155724;
            border: 1px solid #c3e6cb;
            display: block;
        }
        .message.error {
            background: #f8d7da;
            color: #721c24;
            border: 1px solid #f5c6cb;
            display: block;
        }
        .message.info {
            background: #d1ecf1;
            color: #0c5460;
            border: 1px solid #bee5eb;
            display: block;
        }
        .loading {
            text-align: center;
            padding: 40px;
            color: #888;
        }
        @media (max-width: 768px) {
            .container {
                padding: 16px 12px 80px 12px;
            }
            .header-controls {
                flex-direction: column;
                align-items: stretch;
            }
            .filters {
                flex-direction: column;
            }
            .returns-table {
                overflow-x: auto;
            }
            table {
                min-width: 800px;
            }
        }
    </style>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
</head>
<body>
    <div class="container">
        <div style="display:flex;align-items:center;justify-content:space-between;gap:12px;">
            <a href="/tools" style="text-decoration:none;">
                <button class="btn btn-danger">
                    <i class="fas fa-arrow-left"></i> Back
                </button>
            </a>
            <h1 style="flex:1;text-align:center;margin:0;">Returns</h1>
            <div style="display:flex;gap:8px;">
                <button class="btn btn-success" onclick="showAddReturnModal()">
                    <i class="fas fa-plus"></i> Add Return
                </button>
                <button class="btn btn-primary" onclick="syncAmazonReturns()">
                    <i class="fas fa-sync-alt"></i> Sync Amazon
                </button>
                <button class="btn btn-primary" onclick="syncEbayReturns()">
                    <i class="fas fa-sync-alt"></i> Sync eBay
                </button>
            </div>
        </div>

        <div id="message" class="message"></div>

        <div class="stats-grid">
            <div class="stat-card">
                <h3>Total Returns</h3>
                <div class="value" id="stat-total">-</div>
            </div>
            <div class="stat-card">
                <h3>Total Refunded</h3>
                <div class="value" id="stat-refunded">-</div>
            </div>
            <div class="stat-card">
                <h3>Total Return Cost</h3>
                <div class="value" id="stat-cost">-</div>
            </div>
            <div class="stat-card">
                <h3>Return Rate</h3>
                <div class="value" id="stat-rate">-</div>
            </div>
            <div class="stat-card">
                <h3>Recovery Rate</h3>
                <div class="value" id="stat-recovery">-</div>
            </div>
        </div>

        <div class="header-controls">
            <div class="filters">
                <select id="storeFilter" onchange="loadReturns()">
                    <option value="">All Stores</option>
                    <option value="amazon">Amazon</option>
                    <option value="ebay">eBay</option>
                </select>
                <select id="statusFilter" onchange="loadReturns()">
                    <option value="">All Status</option>
                    <option value="pending">Pending</option>
                    <option value="received">Received</option>
                    <option value="restocked">Restocked</option>
                    <option value="relisted">Relisted</option>
                    <option value="resold">Resold</option>
                </select>
                <input type="text" id="searchBox" placeholder="Search order ID, barcode, title..." onkeyup="filterTable()">
            </div>
        </div>

        <div class="returns-table">
            <div id="loading" class="loading">
                <i class="fas fa-spinner fa-spin"></i> Loading returns...
            </div>
            <table id="returnsTable" style="display:none;">
                <thead>
                    <tr>
                        <th>Return Date</th>
                        <th>Order ID</th>
                        <th>Title</th>
                        <th>Store</th>
                        <th>Qty</th>
                        <th>Refund Amount</th>
                        <th>Return Cost</th>
                        <th>Total Cost</th>
                        <th>Status</th>
                        <th>Actions</th>
                    </tr>
                </thead>
                <tbody id="returnsBody">
                </tbody>
            </table>
        </div>
    </div>

    <script>
        let allReturns = [];

        async function loadReturns() {
            const storeFilter = document.getElementById('storeFilter').value;
            const statusFilter = document.getElementById('statusFilter').value;

            try {
                showLoading(true);
                
                const params = new URLSearchParams();
                if (storeFilter) params.append('store', storeFilter);
                if (statusFilter) params.append('status', statusFilter);
                
                const response = await fetch(`/api/returns?${params.toString()}`);
                const result = await response.json();
                
                if (!result.success) {
                    throw new Error(result.error || 'Failed to load returns');
                }
                
                allReturns = result.returns;
                updateStats(result.stats);
                renderReturns(allReturns);
                
                showLoading(false);
            } catch (error) {
                showMessage('error', `Error loading returns: ${error.message}`);
                showLoading(false);
            }
        }

        function getLifecycleStatus(ret) {
            if (ret.resold) return { status: 'resold', label: 'RESOLD', badge: 'badge-resold' };
            if (ret.relisted) return { status: 'relisted', label: 'RELISTED', badge: 'badge-relisted' };
            if (ret.restocked) return { status: 'restocked', label: 'RESTOCKED', badge: 'badge-restocked' };
            if (ret.received_date) return { status: 'received', label: 'RECEIVED', badge: 'badge-received' };
            return { status: 'pending', label: 'PENDING', badge: 'badge-pending' };
        }

        function renderReturns(returns) {
            const tbody = document.getElementById('returnsBody');
            tbody.innerHTML = '';
            
            if (returns.length === 0) {
                tbody.innerHTML = '<tr><td colspan="10" style="text-align:center;padding:40px;color:#888;">No returns found</td></tr>';
                document.getElementById('returnsTable').style.display = 'table';
                return;
            }
            
            returns.forEach(ret => {
                const totalCost = ret.refund_amount + ret.original_shipping_cost + ret.return_shipping_cost;
                const lifecycle = getLifecycleStatus(ret);
                const cycleIndicator = ret.lifecycle_count > 1 ? `<span class="lifecycle-indicator" title="Returned ${ret.lifecycle_count} times">↻${ret.lifecycle_count}</span>` : '';
                
                // Determine action buttons based on lifecycle stage
                let actionButtons = '';
                if (lifecycle.status === 'pending') {
                    actionButtons = `<button class="btn btn-warning btn-lifecycle" onclick="markReceived(${ret.id})"><i class="fas fa-box"></i> Received</button>`;
                } else if (lifecycle.status === 'received') {
                    actionButtons = `<button class="btn btn-success btn-lifecycle" onclick="openRestockModal(${ret.id})"><i class="fas fa-check"></i> Restocked</button>`;
                } else if (lifecycle.status === 'restocked') {
                    actionButtons = `<button class="btn btn-primary btn-lifecycle" onclick="openRelistModal(${ret.id})"><i class="fas fa-arrow-up"></i> Relist</button>`;
                } else if (lifecycle.status === 'relisted') {
                    actionButtons = `<button class="btn btn-success btn-lifecycle" onclick="openResoldModal(${ret.id})"><i class="fas fa-check-circle"></i> Resold</button>`;
                } else if (lifecycle.status === 'resold') {
                    actionButtons = `<button class="btn btn-secondary btn-lifecycle" onclick="restartLifecycle(${ret.id})"><i class="fas fa-redo"></i> Restart</button>`;
                }
                
                // Always add history button to view lifecycle details
                const historyTitle = ret.event_count > 0 ? `View ${ret.event_count} lifecycle events` : 'View lifecycle history';
                actionButtons += `<button class="btn btn-info btn-lifecycle" onclick="openHistoryModal(${ret.id})" title="${historyTitle}"><i class="fas fa-history"></i></button>`;
                
                // Add edit button
                actionButtons += `<button class="btn btn-secondary btn-lifecycle" onclick="openEditModal(${ret.id}, ${ret.restocked}, '${ret.location || ''}', '${encodeURIComponent(ret.return_reason || '')}', '${ret.received_date || ''}')" title="Edit return details"><i class="fas fa-gear"></i></button>`;
                
                const row = `
                    <tr>
                        <td>${formatDate(ret.return_date)}</td>
                        <td><code>${ret.order_id}</code></td>
                        <td>${ret.title}</td>
                        <td><span class="badge badge-${ret.store}">${ret.store.toUpperCase()}</span></td>
                        <td>${ret.quantity}</td>
                        <td>$${ret.refund_amount.toFixed(2)}</td>
                        <td>$${(ret.original_shipping_cost + ret.return_shipping_cost).toFixed(2)}</td>
                        <td><strong>$${totalCost.toFixed(2)}</strong></td>
                        <td><span class="badge ${lifecycle.badge}">${lifecycle.label}</span> ${cycleIndicator}</td>
                        <td style="text-align:right;white-space:nowrap;">
                            ${actionButtons}
                        </td>
                    </tr>
                `;
                tbody.innerHTML += row;
            });
            
            document.getElementById('returnsTable').style.display = 'table';
        }

        function updateStats(stats) {
            document.getElementById('stat-total').textContent = stats.total_returns || 0;
            document.getElementById('stat-refunded').textContent = stats.total_refunded ? `$${stats.total_refunded.toFixed(2)}` : '$0.00';
            document.getElementById('stat-cost').textContent = stats.total_cost ? `$${stats.total_cost.toFixed(2)}` : '$0.00';
            document.getElementById('stat-rate').textContent = stats.return_rate ? `${stats.return_rate.toFixed(1)}%` : '0%';
            
            // Calculate recovery rate
            const relistCount = allReturns.filter(r => r.relisted).length;
            const resoldCount = allReturns.filter(r => r.resold).length;
            const recoveryRate = relistCount > 0 ? (resoldCount / relistCount * 100).toFixed(1) : '0.0';
            document.getElementById('stat-recovery').textContent = `${recoveryRate}%`;
        }

        function filterTable() {
            const searchTerm = document.getElementById('searchBox').value.toLowerCase();
            const filtered = allReturns.filter(ret => 
                ret.order_id.toLowerCase().includes(searchTerm) ||
                ret.barcode.toLowerCase().includes(searchTerm) ||
                ret.title.toLowerCase().includes(searchTerm)
            );
            renderReturns(filtered);
        }

        async function syncAmazonReturns() {
            try {
                showMessage('info', 'Syncing returns from Amazon...');
                
                const response = await fetch('/api/amazon/sync-returns', {
                    method: 'POST'
                });
                
                const result = await response.json();
                
                if (!result.success) {
                    throw new Error(result.error || 'Sync failed');
                }
                
                showMessage('success', `✓ Successfully synced ${result.synced_count} returns from Amazon`);
                
                // Reload returns
                setTimeout(() => loadReturns(), 1000);
            } catch (error) {
                showMessage('error', `Sync error: ${error.message}`);
            }
        }

        async function syncEbayReturns() {
            try {
                showMessage('info', 'Syncing returns from eBay...');
                
                const response = await fetch('/api/ebay/sync-returns', {
                    method: 'POST'
                });
                
                const result = await response.json();
                
                if (!result.success) {
                    throw new Error(result.error || 'Sync failed');
                }
                
                showMessage('success', `✓ Successfully synced ${result.synced_count} returns from eBay`);
                
                // Reload returns
                setTimeout(() => loadReturns(), 1000);
            } catch (error) {
                showMessage('error', `Sync error: ${error.message}`);
            }
        }

        async function markReceived(returnId) {
            try {
                const response = await fetch(`/api/returns/${returnId}/mark-received`, {
                    method: 'POST'
                });
                
                const result = await response.json();
                
                if (!result.success) {
                    throw new Error(result.error || 'Failed to mark as received');
                }
                
                showMessage('success', '✓ Marked as received');
                loadReturns();
            } catch (error) {
                showMessage('error', `Error: ${error.message}`);
            }
        }

        function openRestockModal(returnId) {
            const modal = document.createElement('div');
            modal.className = 'modal-overlay';
            modal.innerHTML = `
                <div class="modal-content">
                    <h3 class="modal-header">Mark as Restocked</h3>
                    <div class="form-group">
                        <label for="restockLocation">Shelf Location:</label>
                        <input type="text" id="restockLocation" placeholder="e.g., A3, B12, etc." autofocus>
                    </div>
                    <div class="modal-actions">
                        <button onclick="this.closest('.modal-overlay').remove()" class="btn btn-secondary">Cancel</button>
                        <button onclick="markRestocked(${returnId})" class="btn btn-success">Restocked</button>
                    </div>
                </div>
            `;
            document.body.appendChild(modal);
            window.currentLifecycleModal = modal;
        }

        async function markRestocked(returnId) {
            try {
                const location = document.getElementById('restockLocation').value;
                
                const response = await fetch(`/api/returns/${returnId}/restock`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ location })
                });
                
                const result = await response.json();
                
                if (!result.success) {
                    throw new Error(result.error || 'Failed to mark as restocked');
                }
                
                if (window.currentLifecycleModal) {
                    window.currentLifecycleModal.remove();
                }
                
                showMessage('success', '✓ Marked as restocked');
                loadReturns();
            } catch (error) {
                showMessage('error', `Error: ${error.message}`);
            }
        }

        function addToShelf(barcode, title, quantity) {
            // Redirect to position/add to shelf page with pre-filled data
            const params = new URLSearchParams({
                barcode: barcode,
                title: decodeURIComponent(title),
                quantity: quantity,
                from: 'returns'
            });
            window.location.href = `/position?${params.toString()}`;
        }
        
        function openEditModal(returnId, restocked, location, returnReason, receivedDate) {
            const modal = document.createElement('div');
            modal.style.cssText = 'position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,0.5);display:flex;align-items:center;justify-content:center;z-index:1000;';
            modal.innerHTML = `
                <div style="background:white;padding:24px;border-radius:12px;max-width:500px;width:90%;">
                    <h3 style="margin:0 0 16px 0;">Edit Return</h3>
                    <div style="margin-bottom:16px;">
                        <label style="display:block;margin-bottom:8px;font-weight:500;">
                            <input type="checkbox" id="editReceived" ${receivedDate ? 'checked' : ''}>
                            Received
                        </label>
                    </div>
                    <div style="margin-bottom:16px;">
                        <label style="display:block;margin-bottom:8px;font-weight:500;">
                            <input type="checkbox" id="editRestocked" ${restocked ? 'checked' : ''}>
                            Restocked
                        </label>
                    </div>
                    <div style="margin-bottom:16px;">
                        <label style="display:block;margin-bottom:4px;font-weight:500;">Location:</label>
                        <input type="text" id="editLocation" value="${location}" style="width:100%;padding:8px;border:1px solid #ddd;border-radius:6px;">
                    </div>
                    <div style="margin-bottom:16px;">
                        <label style="display:block;margin-bottom:4px;font-weight:500;">Return Reason:</label>
                        <textarea id="editReason" style="width:100%;padding:8px;border:1px solid #ddd;border-radius:6px;min-height:60px;">${decodeURIComponent(returnReason)}</textarea>
                    </div>
                    <div style="display:flex;gap:8px;justify-content:space-between;">
                        <button onclick="deleteReturn(${returnId})" style="padding:10px 16px;background:#e74c3c;color:white;border:none;border-radius:8px;cursor:pointer;">Delete</button>
                        <div style="display:flex;gap:8px;">
                            <button onclick="this.closest('div').parentElement.parentElement.parentElement.remove()" style="padding:10px 16px;background:#95a5a6;color:white;border:none;border-radius:8px;cursor:pointer;">Cancel</button>
                            <button onclick="saveReturn(${returnId})" style="padding:10px 16px;background:#00b894;color:white;border:none;border-radius:8px;cursor:pointer;">Save</button>
                        </div>
                    </div>
                </div>
            `;
            document.body.appendChild(modal);
            window.currentModal = modal;
        }
        
        async function saveReturn(returnId) {
            try {
                const received = document.getElementById('editReceived').checked;
                const restocked = document.getElementById('editRestocked').checked;
                const location = document.getElementById('editLocation').value;
                const returnReason = document.getElementById('editReason').value;
                
                const response = await fetch(`/api/returns/${returnId}`, {
                    method: 'PUT',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        received: received,
                        restocked: restocked,
                        location: location,
                        return_reason: returnReason
                    })
                });
                
                const result = await response.json();
                
                if (!result.success) {
                    throw new Error(result.error || 'Failed to update');
                }
                
                if (window.currentModal) {
                    window.currentModal.remove();
                }
                
                showMessage('success', '✓ Return updated successfully');
                loadReturns();
            } catch (error) {
                showMessage('error', `Error: ${error.message}`);
            }
        }
        
        function openRelistModal(returnId) {
            const modal = document.createElement('div');
            modal.className = 'modal-overlay';
            modal.innerHTML = `
                <div class="modal-content">
                    <h3 class="modal-header">Mark as Relisted</h3>
                    <div class="form-group">
                        <label for="relistStore">Store:</label>
                        <select id="relistStore">
                            <option value="amazon">Amazon</option>
                            <option value="ebay">eBay</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label for="relistItemId">Item ID (optional):</label>
                        <input type="text" id="relistItemId" placeholder="SKU or listing ID">
                    </div>
                    <div class="form-group">
                        <label for="relistNotes">Notes (optional):</label>
                        <textarea id="relistNotes" placeholder="Any additional notes..."></textarea>
                    </div>
                    <div class="modal-actions">
                        <button onclick="this.closest('.modal-overlay').remove()" class="btn btn-secondary">Cancel</button>
                        <button onclick="saveRelist(${returnId})" class="btn btn-primary">Save</button>
                    </div>
                </div>
            `;
            document.body.appendChild(modal);
            window.currentLifecycleModal = modal;
        }

        async function saveRelist(returnId) {
            try {
                const store = document.getElementById('relistStore').value;
                const itemId = document.getElementById('relistItemId').value;
                const notes = document.getElementById('relistNotes').value;
                
                const response = await fetch(`/api/returns/${returnId}/relist`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ store, item_id: itemId, notes })
                });
                
                const result = await response.json();
                
                if (!result.success) {
                    throw new Error(result.error || 'Failed to mark as relisted');
                }
                
                if (window.currentLifecycleModal) {
                    window.currentLifecycleModal.remove();
                }
                
                showMessage('success', '✓ Marked as relisted');
                loadReturns();
            } catch (error) {
                showMessage('error', `Error: ${error.message}`);
            }
        }

        function openResoldModal(returnId) {
            const modal = document.createElement('div');
            modal.className = 'modal-overlay';
            modal.innerHTML = `
                <div class="modal-content">
                    <h3 class="modal-header">Mark as Resold</h3>
                    <div class="form-group">
                        <label for="resoldOrderId">Order ID (optional):</label>
                        <input type="text" id="resoldOrderId" placeholder="New order ID">
                    </div>
                    <div class="form-group">
                        <label for="resoldNotes">Notes (optional):</label>
                        <textarea id="resoldNotes" placeholder="Any additional notes..."></textarea>
                    </div>
                    <div class="modal-actions">
                        <button onclick="this.closest('.modal-overlay').remove()" class="btn btn-secondary">Cancel</button>
                        <button onclick="saveResold(${returnId})" class="btn btn-success">Save</button>
                    </div>
                </div>
            `;
            document.body.appendChild(modal);
            window.currentLifecycleModal = modal;
        }

        async function saveResold(returnId) {
            try {
                const orderId = document.getElementById('resoldOrderId').value;
                const notes = document.getElementById('resoldNotes').value;
                
                const response = await fetch(`/api/returns/${returnId}/resold`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ order_id: orderId, notes })
                });
                
                const result = await response.json();
                
                if (!result.success) {
                    throw new Error(result.error || 'Failed to mark as resold');
                }
                
                if (window.currentLifecycleModal) {
                    window.currentLifecycleModal.remove();
                }
                
                showMessage('success', '✓ Marked as resold');
                loadReturns();
            } catch (error) {
                showMessage('error', `Error: ${error.message}`);
            }
        }

        async function restartLifecycle(returnId) {
            if (!confirm('This will reset the lifecycle for another return cycle. Continue?')) {
                return;
            }
            
            try {
                const response = await fetch(`/api/returns/${returnId}/restart-lifecycle`, {
                    method: 'POST'
                });
                
                const result = await response.json();
                
                if (!result.success) {
                    throw new Error(result.error || 'Failed to restart lifecycle');
                }
                
                showMessage('success', '✓ Lifecycle restarted - ready for next return cycle');
                loadReturns();
            } catch (error) {
                showMessage('error', `Error: ${error.message}`);
            }
        }

        async function openHistoryModal(returnId) {
            try {
                const response = await fetch(`/api/returns/${returnId}/history`);
                const result = await response.json();
                
                if (!result.success) {
                    throw new Error(result.error || 'Failed to load history');
                }
                
                const ret = result.return;
                const events = result.events || [];
                
                let timelineHTML = '';
                events.forEach(event => {
                    const icon = event.auto_detected ? '🤖' : '👤';
                    const iconClass = event.auto_detected ? 'auto' : 'manual';
                    let eventText = '';
                    
                    if (event.event_type === 'received') {
                        eventText = 'Return received';
                    } else if (event.event_type === 'restocked') {
                        eventText = 'Item restocked to inventory';
                    } else if (event.event_type === 'relisted') {
                        eventText = `Relisted on ${event.store || 'unknown'}`;
                        if (event.item_id) eventText += ` (${event.item_id})`;
                    } else if (event.event_type === 'resold') {
                        eventText = 'Item resold';
                        if (event.order_id) eventText += ` - Order ${event.order_id}`;
                    } else if (event.event_type === 'lifecycle_restart') {
                        eventText = 'Lifecycle restarted for next return cycle';
                    }
                    
                    if (event.notes) {
                        eventText += `<br><small style="color:#888;">${event.notes}</small>`;
                    }
                    
                    timelineHTML += `
                        <div class="timeline-item">
                            <div class="timeline-icon ${iconClass}">${icon}</div>
                            <div class="timeline-content">
                                <div class="timeline-date">${formatDate(event.event_date)}</div>
                                <div class="timeline-text">${eventText}</div>
                            </div>
                        </div>
                    `;
                });
                
                const modal = document.createElement('div');
                modal.className = 'modal-overlay';
                modal.innerHTML = `
                    <div class="modal-content">
                        <h3 class="modal-header">Lifecycle History</h3>
                        <div style="margin-bottom:16px;padding:12px;background:#f8f9fa;border-radius:8px;">
                            <div style="font-weight:600;margin-bottom:4px;">${ret.title}</div>
                            <div style="color:#666;font-size:0.9rem;">Order: ${ret.order_id}</div>
                            ${ret.lifecycle_count > 1 ? `<div style="color:#888;font-size:0.85rem;margin-top:4px;">Return Cycle: ${ret.lifecycle_count}</div>` : ''}
                        </div>
                        <div class="timeline">
                            ${timelineHTML || '<p style="color:#888;text-align:center;">No lifecycle events yet</p>'}
                        </div>
                        <div class="modal-actions">
                            <button onclick="this.closest('.modal-overlay').remove()" class="btn btn-primary">Close</button>
                        </div>
                    </div>
                `;
                document.body.appendChild(modal);
                window.currentLifecycleModal = modal;
            } catch (error) {
                showMessage('error', `Error loading history: ${error.message}`);
            }
        }
        
        async function deleteReturn(returnId) {
            if (!confirm('Are you sure you want to delete this return?')) {
                return;
            }
            
            try {
                const response = await fetch(`/api/returns/${returnId}`, {
                    method: 'DELETE'
                });
                
                const result = await response.json();
                
                if (!result.success) {
                    throw new Error(result.error || 'Failed to delete');
                }
                
                if (window.currentModal) {
                    window.currentModal.remove();
                }
                
                showMessage('success', '✓ Return deleted successfully');
                loadReturns();
            } catch (error) {
                showMessage('error', `Error: ${error.message}`);
            }
        }

        function showLoading(show) {
            document.getElementById('loading').style.display = show ? 'block' : 'none';
            document.getElementById('returnsTable').style.display = show ? 'none' : 'table';
        }

        function showMessage(type, message) {
            const messageDiv = document.getElementById('message');
            messageDiv.className = `message ${type}`;
            messageDiv.textContent = message;
            messageDiv.style.display = 'block';
            
            if (type === 'success' || type === 'info') {
                setTimeout(() => {
                    messageDiv.style.display = 'none';
                }, 5000);
            }
        }

        function formatDate(dateStr) {
            if (!dateStr) return '-';
            const date = new Date(dateStr);
            return date.toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: 'numeric' });
        }

        // Load returns on page load
        document.addEventListener('DOMContentLoaded', () => {
            loadReturns();
        });
    </script>
</body>
</html>
