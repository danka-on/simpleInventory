<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Picture Position</title>
    <style>
        body { font-family: sans-serif; max-width: 600px; margin: auto; padding: 10px; display: flex; flex-direction: column; align-items: center; min-height: 100vh; }
        #camera-container { width: 100%; max-width: 350px; margin-top: 20px; position: relative; }
        #video, #preview-img { width: 100%; border-radius: 8px; background: #222; }
        #controls { margin-top: 15px; display: flex; gap: 10px; }
        button { font-size: 18px; padding: 10px 20px; cursor: pointer; }
        #confirm-btn { background: #1976d2; color: white; }
        #retake-btn { background: #aaa; color: white; }
        #skip-btn { background: #eee; color: #222; }
        #status { margin-top: 10px; color: #1976d2; }
    </style>
</head>
<body>
    <h1>Take Picture of Location</h1>
    <div id="camera-container">
        <video id="video" autoplay playsinline></video>
        <img id="preview-img" style="display:none;" />
    </div>
    <div id="controls">
        <button id="capture-btn">Capture</button>
        <button id="confirm-btn" style="display:none;">Confirm</button>
        <button id="retake-btn" style="display:none;">Retake</button>
        <button id="abort-btn" style="display:none;background:#d32f2f;color:#fff;">Abort</button>
        <a href="/barcode" id="skip-link"><button id="skip-btn" type="button">Skip</button></a>
        <a href="/position" id="back-link"><button id="back-btn" type="button" style="background:#eee;color:#222;">Back</button></a>
    </div>
    <div id="status"></div>
    <div id="progress-container" style="width:100%;max-width:350px;margin-top:12px;display:none;">
        <div style="background:#ddd;border-radius:6px;overflow:hidden;height:14px;">
            <div id="progress-bar" style="height:100%;width:0%;background:#1976d2"></div>
        </div>
        <div id="progress-text" style="text-align:center;margin-top:6px;font-size:14px;color:#1976d2">Uploading: 0%</div>
    </div>
    <script>
    let video = document.getElementById('video');
    let previewImg = document.getElementById('preview-img');
    let captureBtn = document.getElementById('capture-btn');
    let confirmBtn = document.getElementById('confirm-btn');
    let retakeBtn = document.getElementById('retake-btn');
    let abortBtn = document.getElementById('abort-btn');
    let statusDiv = document.getElementById('status');
    let stream = null;
    let capturedBlob = null;
    let currentObjectUrl = null;
    let xhrUpload = null;

    async function startCamera() {
        try {
            stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: 'environment' }, audio: false });
            video.srcObject = stream;
            video.style.display = '';
            previewImg.style.display = 'none';
            captureBtn.style.display = '';
            confirmBtn.style.display = 'none';
            retakeBtn.style.display = 'none';
            abortBtn.style.display = 'none';
            statusDiv.textContent = '';
            // ensure video metadata is loaded for proper dimensions
            video.addEventListener('loadedmetadata', () => {
                console.log('video metadata loaded', video.videoWidth, video.videoHeight);
            }, { once: true });
        } catch (e) {
            statusDiv.textContent = 'Camera error: ' + (e.message || e);
            captureBtn.disabled = true;
        }
    }

    function stopCamera() {
        if (stream) {
            stream.getTracks().forEach(track => track.stop());
            stream = null;
        }
    }

    captureBtn.onclick = function() {
        let canvas = document.createElement('canvas');
        // Guard: ensure we have valid video dimensions
        const w = video.videoWidth || 640;
        const h = video.videoHeight || 480;
        canvas.width = w;
        canvas.height = h;
        let ctx = canvas.getContext('2d');
        ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
        canvas.toBlob(blob => {
            capturedBlob = blob;
            if (currentObjectUrl) URL.revokeObjectURL(currentObjectUrl);
            currentObjectUrl = URL.createObjectURL(blob);
            previewImg.src = currentObjectUrl;
            previewImg.style.display = '';
            video.style.display = 'none';
            captureBtn.style.display = 'none';
            confirmBtn.style.display = '';
            retakeBtn.style.display = '';
            abortBtn.style.display = 'none';
        }, 'image/jpeg', 0.7);
    };

    retakeBtn.onclick = function() {
        capturedBlob = null;
        previewImg.style.display = 'none';
        video.style.display = '';
        captureBtn.style.display = '';
        confirmBtn.style.display = 'none';
        retakeBtn.style.display = 'none';
        abortBtn.style.display = 'none';
        statusDiv.textContent = '';
        // revoke object URL
        if (currentObjectUrl) { URL.revokeObjectURL(currentObjectUrl); currentObjectUrl = null; }
    };

    confirmBtn.onclick = function() {
        if (!capturedBlob) return;
        // Disable buttons to prevent multiple clicks
        confirmBtn.disabled = true;
        retakeBtn.disabled = true;
        abortBtn.style.display = '';
        statusDiv.textContent = 'Uploading...';
        document.getElementById('progress-container').style.display = '';
        // Start upload with progress
        uploadWithProgress(capturedBlob).then(result => {
            confirmBtn.disabled = false;
            retakeBtn.disabled = false;
            abortBtn.style.display = 'none';
            if (result && result.success) {
                sessionStorage.setItem('pictureposition_path', result.path);
                sessionStorage.setItem('pictureposition_upload_status', 'done');
                statusDiv.textContent = 'Upload complete.';
                // Immediately redirect after upload, no extra click
                const params = new URLSearchParams(window.location.search);
                const editId = params.get('edit_rack_id');
                const forDiagnostic = params.get('for_diagnostic');
                const returnUrl = params.get('return');
                if(editId){
                    // Include move_qty if provided in URL
                    const moveQty = params.get('move_qty');
                    const payload = {id: editId, pictureposition: result.path};
                    if(moveQty){
                        payload.move_qty = parseInt(moveQty);
                    }
                    fetch('/api/set_rack_location', {method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify(payload)})
                        .then(r=>r.json())
                        .then(j=>{
                            sessionStorage.removeItem('pictureposition_path');
                            sessionStorage.removeItem('pictureposition_upload_status');
                            window.location.href = '/searchrack';
                        }).catch(e=>{
                            console.error('Failed to set pictureposition', e);
                            window.location.href = '/searchrack?pic_error=1';
                        });
                    return;
                } else if(forDiagnostic){
                    fetch('/api/items_prep/location', {
                        method:'POST', 
                        headers:{'Content-Type':'application/json'}, 
                        body: JSON.stringify({upc: forDiagnostic, pictureposition: result.path, location: ''})
                    })
                    .then(r=>r.json())
                    .then(j=>{
                        sessionStorage.removeItem('pictureposition_path');
                        sessionStorage.removeItem('pictureposition_upload_status');
                        if(returnUrl){
                            window.location.href = returnUrl;
                        } else {
                            window.location.href = '/item-prep/diagnostic?upc=' + encodeURIComponent(forDiagnostic);
                        }
                    }).catch(e=>{
                        console.error('Failed to set pictureposition', e);
                        statusDiv.textContent = 'Failed to save location';
                    });
                    return;
                }
                // Non-edit mode: go directly to barcode flow
                window.location.href = '/barcode?pictureposition=1';
            } else {
                sessionStorage.setItem('pictureposition_upload_status', 'error');
                statusDiv.textContent = 'Upload failed. Please retry or retake.';
            }
        }).catch(e => {
            confirmBtn.disabled = false;
            retakeBtn.disabled = false;
            abortBtn.style.display = 'none';
            sessionStorage.setItem('pictureposition_upload_status', 'error');
            statusDiv.textContent = 'Upload error. Please retry or retake.';
            console.error('upload error', e);
        });
    };

    // Abort upload and allow retake
    abortBtn.onclick = function() {
        if (xhrUpload) {
            try { xhrUpload.abort(); } catch (e) {}
            xhrUpload = null;
        }
        statusDiv.textContent = 'Upload aborted. You can retake.';
        document.getElementById('progress-container').style.display = 'none';
        sessionStorage.setItem('pictureposition_upload_status', '');
        // revert UI to allow retake
        retakeBtn.click();
    };

    // Background upload logic
    function uploadWithProgress(blob) {
        return new Promise((resolve, reject) => {
            const url = '/upload_position_picture';
            const formData = new FormData();
            formData.append('picture', blob, 'image.jpg');
            xhrUpload = new XMLHttpRequest();
            xhrUpload.open('POST', url, true);
            xhrUpload.upload.onprogress = function(e) {
                if (e.lengthComputable) {
                    const pct = Math.round((e.loaded / e.total) * 100);
                    document.getElementById('progress-bar').style.width = pct + '%';
                    document.getElementById('progress-text').textContent = 'Uploading: ' + pct + '%';
                }
            };
            xhrUpload.onload = function() {
                xhrUpload = null;
                if (xhrUpload === null) {
                    // proceed
                }
                if (xhrUpload !== null) { /* noop */ }
                if (this.status >= 200 && this.status < 300) {
                    try {
                        const data = JSON.parse(this.responseText);
                        resolve(data);
                    } catch (e) {
                        resolve({ success: false });
                    }
                } else {
                    resolve({ success: false });
                }
            };
            xhrUpload.onerror = function() { xhrUpload = null; resolve({ success: false }); };
            xhrUpload.onabort = function() { xhrUpload = null; resolve({ success: false }); };
            xhrUpload.send(formData);
        });
    }

    // Show error if redirected with error param
    function showErrorIfNeeded() {
        const params = new URLSearchParams(window.location.search);
        if (params.get('error') === '1') {
            let statusDiv = document.getElementById('status');
            if (statusDiv) {
                statusDiv.textContent = 'Error uploading picture. Please try again.';
                statusDiv.style.color = '#d32f2f';
            } else {
                alert('Error uploading picture. Please try again.');
            }
            // Reset upload status
            sessionStorage.setItem('pictureposition_upload_status', '');
        }
    }
    window.addEventListener('DOMContentLoaded', showErrorIfNeeded);
    window.addEventListener('DOMContentLoaded', startCamera);
    window.addEventListener('beforeunload', stopCamera);
    
    // Update back button for diagnostic mode
    window.addEventListener('DOMContentLoaded', ()=>{
        const params = new URLSearchParams(window.location.search);
        const forDiagnostic = params.get('for_diagnostic');
        const returnUrl = params.get('return');
        if(forDiagnostic){
            const backLink = document.getElementById('back-link');
            const skipLink = document.getElementById('skip-link');
            let url = '/position?for_diagnostic=' + encodeURIComponent(forDiagnostic);
            if(returnUrl){
                url += '&return=' + encodeURIComponent(returnUrl);
            }
            if(backLink) backLink.href = url;
            // Hide skip button in diagnostic mode
            if(skipLink) skipLink.style.display = 'none';
        }
    });
    </script>
</body>
</html>
