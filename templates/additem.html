<!DOCTYPE html>
<html lang="en">
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta charset="UTF-8">
    <title>Add Item to Inventory</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <style>
        body {
            font-family: sans-serif;
            max-width: 600px;
            margin: auto;
            padding: 10px;
        }
        img {
            width: 100%;
            border: 1px solid #ccc;
            margin-top: 20px;
        }
        #checklist { display: block !important; }
        #checklist .checkitem {
            padding:12px 18px;
            border-radius:8px;
            margin-bottom:12px;
            cursor:pointer;
            font-size:1.1em;
            font-weight:bold;
            display:flex;
            align-items:center;
            background:#eee;
            color:#222;
            border: 1px solid #bbb;
            min-height: 40px;
            transition: background 0.2s, color 0.2s;
        }
        /* Visual indicator for clickable/editable state */
        #checklist .checkitem.clickable {
            text-decoration: underline dotted;
            box-shadow: 0 2px 10px rgba(0,128,64,0.07);
            position: relative;
        }
        #checklist .checkitem .edit-icon {
            margin-left: 10px;
            font-size: 1.1em;
            color: #fff;
            opacity: 0.85;
        }
        /* New shade of green for set state */
        #checklist .checkitem.set {
            background: #2ecc71 !important;
            color: #fff !important;
        }
        .barcode-editor {
            display: none;
            margin: 20px auto 28px;
            padding: 16px;
            border: 1px solid #d7e1ea;
            border-radius: 12px;
            background: #f8fbfd;
            box-shadow: 0 6px 18px rgba(15, 23, 42, 0.06);
            text-align: left;
            max-width: 460px;
        }
        .barcode-editor-title {
            font-size: 1.05em;
            font-weight: 800;
            color: #1f2937;
            margin-bottom: 12px;
        }
        .barcode-entry-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
            background: #2ecc71;
            color: #fff;
            border-radius: 10px;
            padding: 12px 14px;
            margin-bottom: 10px;
        }
        .barcode-entry-main {
            display: flex;
            flex-direction: column;
            gap: 6px;
            min-width: 0;
            flex: 1;
        }
        .barcode-entry-code {
            font-family: monospace;
            font-size: 1.05em;
            font-weight: 700;
            word-break: break-all;
        }
        .barcode-entry-meta {
            font-size: 0.82em;
            font-weight: 600;
            opacity: 0.96;
        }
        .barcode-entry-actions {
            display: flex;
            align-items: center;
            gap: 10px;
            flex-shrink: 0;
        }
        .suffix-pill {
            display: flex;
            align-items: center;
            gap: 8px;
            background: rgba(255,255,255,0.18);
            border-radius: 999px;
            padding: 6px 10px;
        }
        .suffix-pill button,
        .barcode-remove-btn {
            border: none;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .suffix-pill button {
            width: 28px;
            height: 28px;
            border-radius: 50%;
            background: rgba(255,255,255,0.26);
            color: #fff;
            font-size: 1.05em;
            font-weight: 900;
            margin: 0;
            padding: 0;
        }
        .suffix-pill button:disabled {
            opacity: 0.45;
            cursor: default;
        }
        .suffix-pill span {
            min-width: 82px;
            text-align: center;
            font-size: 0.78em;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.06em;
        }
        .barcode-remove-btn {
            width: 32px;
            height: 32px;
            border-radius: 50%;
            background: rgba(231, 76, 60, 0.9);
            color: #fff;
            font-size: 0.95em;
            padding: 0;
        }
        </style>
</head>
<body>
<div style="text-align: center;">
    <h1 style="margin-bottom: 30px;" data-i18n="add_item_to_inventory">Add Item to Inventory</h1>


    <div id="checklist" style="margin: 30px 0;">
        <div id="position-check" class="checkitem">
            <span id="position-status">Loading...</span>
        </div>
        <div id="barcode-check" class="checkitem">
            <span id="barcode-status">Loading...</span>
        </div>
    </div>
    <div id="barcodeEditorCard" class="barcode-editor">
        <div class="barcode-editor-title">Barcodes Ready To Add</div>
        <div id="barcodeEditorList"></div>
    </div>
    <form id="addItemForm" action="/additemtrue" method="POST">
        <!-- Hidden fields to pass barcode, position, and pictureposition from sessionStorage -->
        <input type="hidden" name="barcode" id="form_barcode" value="">
        <input type="hidden" name="item_position" id="form_position" value="">
        <input type="hidden" name="pictureposition" id="form_pictureposition" value="">
        <div style="display: flex; flex-direction: column; align-items: center; width: 100%; max-width: 350px; margin: 0 auto; gap: 0;">
            <!-- Timer display -->
            <div id="autoSubmitTimer" style="font-size:1.5em; color:#1976d2; margin-bottom: 12px; display:none;"></div>
            <!-- Add Item button (larger, more pronounced) -->
            <button id="addItemBtn" type="submit" form="addItemForm" style="background-color: #43a047; color: white; border: none; padding: 28px 0; border-radius: 10px; cursor: pointer; font-size: 2em; width: 100%; margin-bottom: 32px; display: flex; align-items: center; justify-content: center; gap: 14px; box-shadow: 0 4px 16px rgba(67,160,71,0.12); font-weight: bold; letter-spacing: 1px;">
                <i class="fas fa-plus" style="font-size:1.2em;"></i> <span data-i18n="add_item">Add Item</span>
            </button>
            <!-- Clear button below Add Item, with extra space above -->
            <button id="clearBtn" type="button" style="background-color: #ff4444; color: white; border: none; padding: 14px; border-radius: 6px; cursor: pointer; font-size: 1.1em; width: 100%; margin-bottom: 18px; margin-top: 18px; display: flex; align-items: center; justify-content: center; gap: 8px;">
                <i class="fas fa-trash"></i> <span data-i18n="clear">Clear</span>
            </button>
            <!-- Divider -->
            <div style="width: 100%; height: 1px; background: #eee; margin: 10px 0 18px 0;"></div>
            <!-- Navigation button: Exit only -->
            <div style="width: 100%; display: flex; justify-content: center;">
                <button id="exitBtn" type="button" style="background-color: #ff4444; color: white; border: none; padding: 10px 0; border-radius: 6px; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 8px; font-size: 1em; width: 100%; max-width: 120px;">
                    <i class="fas fa-times"></i> <span data-i18n="exit">Exit</span>
                </button>
            </div>
        </div>
    </form>
    <script src="/static/barcode-entry-state.js"></script>
    <script>
    const barcodeEntryState = window.BarcodeEntryState;

    function formatUpcDisplay(code) {
        const s = String(code || '').trim();
        if (/^\d+$/.test(s) && s.length <= 12) return s.padStart(12, '0');
        return s;
    }

    function getBarcodeEntries() {
        return barcodeEntryState ? barcodeEntryState.loadEntries() : [];
    }

    function getSerializedBarcode() {
        const entries = getBarcodeEntries();
        if (barcodeEntryState && entries.length) {
            return barcodeEntryState.serializeEntries(entries);
        }
        return sessionStorage.getItem('barcode') || '';
    }

    function syncAddItemFormFields() {
        const itemPosition = sessionStorage.getItem('item_position') || '';
        const picturePosition = sessionStorage.getItem('pictureposition_path') || '';
        document.getElementById('form_barcode').value = getSerializedBarcode();
        document.getElementById('form_position').value = itemPosition;
        document.getElementById('form_pictureposition').value = picturePosition;
    }

    function persistBarcodeEntries(entries) {
        if (barcodeEntryState) {
            barcodeEntryState.saveEntries(entries);
        }
        syncAddItemFormFields();
        updateChecklist();
        renderBarcodeEditor();
    }

    function renderBarcodeEditor() {
        const card = document.getElementById('barcodeEditorCard');
        const list = document.getElementById('barcodeEditorList');
        if (!card || !list) return;

        const entries = getBarcodeEntries();
        if (!entries.length) {
            card.style.display = 'none';
            list.innerHTML = '';
            return;
        }

        card.style.display = 'block';
        list.innerHTML = entries.map((item, index) => {
            const displayCode = barcodeEntryState
                ? barcodeEntryState.displayCode(item, formatUpcDisplay)
                : formatUpcDisplay(item.code || '');
            const suffixLabel = item.suffix > 0 ? `Suffix ${item.suffix}` : 'Base';
            const metaText = item.suffix > 0
                ? 'Singular suffix item'
                : (item.quantity > 1 ? `Qty ${item.quantity} | Use + to split one out as a suffix item` : 'Qty 1');
            return `
                <div class="barcode-entry-row">
                    <div class="barcode-entry-main">
                        <div class="barcode-entry-code">${displayCode}</div>
                        <div class="barcode-entry-meta">${metaText}</div>
                    </div>
                    <div class="barcode-entry-actions">
                        <div class="suffix-pill">
                            <button type="button" onclick="adjustAddItemSuffix(${index}, -1)" ${item.suffix > 0 ? '' : 'disabled'}>-</button>
                            <span>${suffixLabel}</span>
                            <button type="button" onclick="adjustAddItemSuffix(${index}, 1)">+</button>
                        </div>
                        <button type="button" class="barcode-remove-btn" onclick="removeAddItemBarcode(${index})" title="Remove one">
                            <i class="fas fa-times"></i>
                        </button>
                    </div>
                </div>
            `;
        }).join('');
    }
    
    function updateChecklist() {
        const t = (key, fallback) => (window.i18n && window.i18n.t) ? window.i18n.t(key) : (fallback || key);
        // If both are set, prefer picturePosition (picture takes precedence)
        const itemPosition = sessionStorage.getItem('item_position');
        const picturePosition = sessionStorage.getItem('pictureposition_path');
        const barcodeEntries = getBarcodeEntries();
        const barcode = getSerializedBarcode();
        // Position logic
        let posText = '', posColor = '', posGoto = '';
        if (picturePosition) {
            posText = `${t('position_set_picture', 'Position set - picture')} <i class=\"fas fa-pen edit-icon\"></i>`;
            posColor = '#2ecc71'; // new green
            posGoto = '/position'; // Always go to position.html
            sessionStorage.removeItem('item_position');
        } else if (itemPosition) {
            posText = `${t('position_set', 'Position set')} - ${itemPosition} <i class=\"fas fa-pen edit-icon\"></i>`;
            posColor = '#2ecc71';
            posGoto = '/position';
        } else {
            posText = t('position_not_set', 'Position NOT set');
            posColor = '#d32f2f';
            posGoto = '/position?error=noposition';
        }
        // Barcode logic
        let barText = '', barColor = '', barGoto = '';
        const isLocked = sessionStorage.getItem('positionLocked') === 'true';
        if (barcode) {
            const totalCount = barcodeEntryState && barcodeEntries.length
                ? barcodeEntryState.totalCount(barcodeEntries)
                : barcode.split(',').filter(Boolean).length;
            if (totalCount > 1) {
                barText = `${t('barcodes_set', 'Barcodes set')} (${totalCount}) <i class=\"fas fa-pen edit-icon\"></i>`;
            } else {
                const firstEntry = barcodeEntries[0];
                const displayCode = firstEntry && barcodeEntryState
                    ? barcodeEntryState.displayCode(firstEntry, formatUpcDisplay)
                    : barcode;
                barText = `${t('barcode_set', 'Barcode set')} - ${displayCode} <i class=\"fas fa-pen edit-icon\"></i>`;
            }
            barColor = '#2ecc71';
            barGoto = isLocked ? '/multibarcode' : '/barcode';
        } else {
            barText = t('barcode_not_set', 'Barcode NOT set');
            barColor = '#d32f2f';
            barGoto = isLocked ? '/multibarcode' : '/barcode';
        }
        // Update DOM
        const posDiv = document.getElementById('position-check');
        if (posDiv) {
            posDiv.style.backgroundColor = posColor;
            posDiv.style.color = '#fff';
            posDiv.classList.remove('set', 'clickable');
            if (picturePosition || itemPosition) {
                posDiv.classList.add('set', 'clickable');
            }
            // Use innerHTML to allow icon
            document.getElementById('position-status').innerHTML = posText;
            posDiv.onclick = () => { window.location.href = posGoto; };
        }
        const barDiv = document.getElementById('barcode-check');
        if (barDiv) {
            barDiv.style.backgroundColor = barColor;
            barDiv.style.color = '#fff';
            barDiv.classList.remove('set', 'clickable');
            if (barcode) {
                barDiv.classList.add('set', 'clickable');
            }
            document.getElementById('barcode-status').innerHTML = barText;
            barDiv.onclick = () => { window.location.href = barGoto; };
        }
    }
    // Always show checklist on load
    window.adjustAddItemSuffix = function(index, delta) {
        if (!barcodeEntryState) return;
        const entries = getBarcodeEntries();
        const nextEntries = delta > 0
            ? barcodeEntryState.incrementSuffix(entries, index)
            : barcodeEntryState.decrementSuffix(entries, index);
        persistBarcodeEntries(nextEntries);
    };

    window.removeAddItemBarcode = function(index) {
        if (!barcodeEntryState) return;
        const entries = getBarcodeEntries();
        const nextEntries = barcodeEntryState.removeOne(entries, index);
        persistBarcodeEntries(nextEntries);
    };

    document.addEventListener('DOMContentLoaded', function() {
        syncAddItemFormFields();
        updateChecklist();
        renderBarcodeEditor();
    });
    // --- Auto-submit timer logic ---
    let autoSubmitTimeout = null;
    let timerInterval = null;

    function startAutoSubmitTimer() {
        // Get timer settings from localStorage (set in misc.html)
        let seconds = 2;
        const stored = localStorage.getItem('addItemTimer');
        if (stored && !isNaN(parseInt(stored))) {
            seconds = Math.max(1, Math.min(30, parseInt(stored)));
        }
        const timerDiv = document.getElementById('autoSubmitTimer');
        timerDiv.textContent = `Auto-adding in ${seconds}...`;
        timerDiv.style.display = '';
        timerInterval = setInterval(() => {
            seconds--;
            if (seconds > 0) {
                timerDiv.textContent = `Auto-adding in ${seconds}...`;
            } else {
                clearInterval(timerInterval);
                timerDiv.textContent = 'Adding...';
            }
        }, 1000);
        autoSubmitTimeout = setTimeout(() => {
            clearInterval(timerInterval);
            timerDiv.textContent = 'Adding...';
            document.getElementById('addItemForm').submit();
        }, seconds * 1000);
    }
    function cancelAutoSubmitTimer() {
        if (autoSubmitTimeout) clearTimeout(autoSubmitTimeout);
        if (timerInterval) clearInterval(timerInterval);
        const timerDiv = document.getElementById('autoSubmitTimer');
        timerDiv.style.display = 'none';
    }
    // Cancel timer on any user input or touch
    ['keydown','mousedown','touchstart'].forEach(evt => {
        window.addEventListener(evt, cancelAutoSubmitTimer, { once: true, passive: true });
    });
    // Always start timer by default (3s) unless explicitly disabled in settings
    document.addEventListener('DOMContentLoaded', function() {
        const barcode = sessionStorage.getItem('barcode');
        const itemPosition = sessionStorage.getItem('item_position');
        const picturePosition = sessionStorage.getItem('pictureposition_path');
        let disable = localStorage.getItem('disableAutoSubmit');
        // If not set, default to enabled
        if (disable === null) disable = '0';
        // Position is set if either itemPosition or picturePosition
        if (disable !== '1' && (itemPosition || picturePosition) && barcode) {
            startAutoSubmitTimer();
        }
    });
    </script>
</body>
</html>
<script>
    // Show spinner/status if upload is in progress, or redirect if error
    function checkPictureUploadStatus() {
        const status = sessionStorage.getItem('pictureposition_upload_status');
        if (status === 'uploading') {
            showUploadSpinner();
            // Poll until done or error
            const interval = setInterval(() => {
                const s = sessionStorage.getItem('pictureposition_upload_status');
                if (s === 'done') {
                    hideUploadSpinner();
                    clearInterval(interval);
                } else if (s === 'error') {
                    clearInterval(interval);
                    window.location.href = '/pictureposition?error=1';
                }
            }, 500);
        } else if (status === 'error') {
            window.location.href = '/pictureposition?error=1';
        }
    }

    function showUploadSpinner() {
        let spinner = document.getElementById('upload-spinner');
        if (!spinner) {
            spinner = document.createElement('div');
            spinner.id = 'upload-spinner';
            spinner.innerHTML = '<div style="margin:30px auto;text-align:center;"><span style="font-size:1.2em;">Uploading picture...</span><br><svg width="40" height="40" viewBox="0 0 40 40"><circle cx="20" cy="20" r="18" stroke="#1976d2" stroke-width="4" fill="none" stroke-dasharray="90" stroke-dashoffset="60"><animateTransform attributeName="transform" type="rotate" from="0 20 20" to="360 20 20" dur="1s" repeatCount="indefinite"/></circle></svg></div>';
            document.body.appendChild(spinner);
        } else {
            spinner.style.display = '';
        }
    }
    function hideUploadSpinner() {
        let spinner = document.getElementById('upload-spinner');
        if (spinner) spinner.style.display = 'none';
    }
    // On load, check upload status if redirected from pictureposition
    if (window.location.search.includes('pictureposition=1')) {
        checkPictureUploadStatus();
    }

    document.getElementById('clearBtn').addEventListener('click', function(e) {
        e.preventDefault();
        sessionStorage.removeItem('item_position');
        sessionStorage.removeItem('barcode');
        sessionStorage.removeItem('barcode_entries');
        sessionStorage.removeItem('pictureposition_path');
        // Optionally clear any other related sessionStorage keys
        // Do NOT submit any form or reload to a new page
        // Instead, update checklist and visually reset
        syncAddItemFormFields();
        updateChecklist();
        renderBarcodeEditor();
    });

    document.getElementById('exitBtn').addEventListener('click', function(e) {
        e.preventDefault();
        sessionStorage.removeItem('item_position');
        sessionStorage.removeItem('barcode');
        sessionStorage.removeItem('barcode_entries');
        sessionStorage.removeItem('pictureposition_path');
        sessionStorage.removeItem('positionLocked');
        // Notify server to clear lock state
        fetch('/toggle', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ checked: false })
        }).catch(err => console.error('Error clearing lock:', err));
        window.location.href = '/';
    });
</script>
<script src="/static/i18n.js"></script>
