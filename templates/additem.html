<!DOCTYPE html>
<html lang="en">
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta charset="UTF-8">
    <title>Add Item to Inventory</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <style>
        body {
            font-family: sans-serif;
            max-width: 600px;
            margin: auto;
            padding: 10px;
        }
        img {
            width: 100%;
            border: 1px solid #ccc;
            margin-top: 20px;
        }
        #checklist { display: block !important; }
        #checklist .checkitem {
            padding:12px 18px;
            border-radius:8px;
            margin-bottom:12px;
            cursor:pointer;
            font-size:1.1em;
            font-weight:bold;
            display:flex;
            align-items:center;
            background:#eee;
            color:#222;
            border: 1px solid #bbb;
            min-height: 40px;
            transition: background 0.2s, color 0.2s;
        }
        /* Visual indicator for clickable/editable state */
        #checklist .checkitem.clickable {
            text-decoration: underline dotted;
            box-shadow: 0 2px 10px rgba(0,128,64,0.07);
            position: relative;
        }
        #checklist .checkitem .edit-icon {
            margin-left: 10px;
            font-size: 1.1em;
            color: #fff;
            opacity: 0.85;
        }
        /* New shade of green for set state */
        #checklist .checkitem.set {
            background: #2ecc71 !important;
            color: #fff !important;
        }
        .barcode-editor {
            display: none;
            margin: 20px auto 28px;
            padding: 16px;
            border: 1px solid #d7e1ea;
            border-radius: 12px;
            background: #f8fbfd;
            box-shadow: 0 6px 18px rgba(15, 23, 42, 0.06);
            text-align: left;
            max-width: 460px;
        }
        .barcode-editor-title {
            font-size: 1.05em;
            font-weight: 800;
            color: #1f2937;
            margin-bottom: 12px;
        }
        .barcode-entry-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
            background: #2ecc71;
            color: #fff;
            border-radius: 10px;
            padding: 12px 14px;
            margin-bottom: 10px;
        }
        .barcode-entry-main {
            display: flex;
            flex-direction: column;
            gap: 6px;
            min-width: 0;
            flex: 1;
        }
        .barcode-entry-code {
            font-family: monospace;
            font-size: 1.05em;
            font-weight: 700;
            word-break: break-all;
        }
        .barcode-entry-meta {
            font-size: 0.82em;
            font-weight: 600;
            opacity: 0.96;
        }
        .barcode-entry-actions {
            display: flex;
            align-items: center;
            gap: 10px;
            flex-shrink: 0;
        }
        .suffix-pill {
            display: flex;
            align-items: center;
            gap: 8px;
            background: rgba(255,255,255,0.18);
            border-radius: 999px;
            padding: 6px 10px;
        }
        .suffix-pill button,
        .barcode-remove-btn {
            border: none;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .suffix-pill button {
            width: 28px;
            height: 28px;
            border-radius: 50%;
            background: rgba(255,255,255,0.26);
            color: #fff;
            font-size: 1.05em;
            font-weight: 900;
            margin: 0;
            padding: 0;
        }
        .suffix-pill button:disabled {
            opacity: 0.45;
            cursor: default;
        }
        .suffix-pill span {
            min-width: 82px;
            text-align: center;
            font-size: 0.78em;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.06em;
        }
        .barcode-remove-btn {
            width: 32px;
            height: 32px;
            border-radius: 50%;
            background: rgba(231, 76, 60, 0.9);
            color: #fff;
            font-size: 0.95em;
            padding: 0;
        }
        .barcode-entry-manual-title {
            font-size: 0.78em;
            font-weight: 700;
            color: #ecfdf5;
            opacity: 0.98;
        }
        .missing-data-modal {
            position: fixed;
            inset: 0;
            background: rgba(15, 23, 42, 0.72);
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            z-index: 100000;
        }
        .missing-data-card {
            width: min(560px, 96vw);
            max-height: 88vh;
            overflow: auto;
            background: #ffffff;
            border-radius: 16px;
            box-shadow: 0 18px 45px rgba(15, 23, 42, 0.28);
            border: 1px solid rgba(226, 232, 240, 0.9);
            padding: 20px 20px 18px;
            text-align: left;
        }
        .missing-data-accent {
            height: 7px;
            margin: -20px -20px 16px;
            border-radius: 16px 16px 8px 8px;
            background: linear-gradient(90deg, #ef4444, #f59e0b);
        }
        .missing-data-title {
            margin: 0 0 8px;
            font-size: 1.15em;
            font-weight: 800;
            color: #111827;
        }
        .missing-data-text {
            margin: 0 0 14px;
            font-size: 0.97em;
            line-height: 1.45;
            color: #475569;
        }
        .missing-data-list {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }
        .missing-data-item {
            padding: 14px;
            border-radius: 12px;
            background: #f8fafc;
            border: 1px solid #dbeafe;
        }
        .missing-data-item-header {
            display: flex;
            justify-content: space-between;
            gap: 10px;
            align-items: baseline;
            margin-bottom: 8px;
            flex-wrap: wrap;
        }
        .missing-data-barcode {
            font-family: monospace;
            font-size: 1.02em;
            font-weight: 800;
            color: #0f172a;
        }
        .missing-data-flags {
            font-size: 0.8em;
            font-weight: 700;
            color: #b45309;
        }
        .missing-data-item input[type="text"] {
            width: 100%;
            margin-top: 8px;
            padding: 12px 14px;
            font-size: 1em;
            border-radius: 10px;
            border: 1px solid #cbd5e1;
            box-sizing: border-box;
        }
        .missing-data-item input[type="text"]:focus {
            outline: none;
            border-color: #2563eb;
            box-shadow: 0 0 0 3px rgba(37,99,235,0.16);
        }
        .missing-data-helper {
            margin-top: 8px;
            color: #64748b;
            font-size: 0.84em;
            line-height: 1.4;
        }
        .missing-data-actions {
            display: flex;
            justify-content: flex-end;
            gap: 10px;
            margin-top: 18px;
            flex-wrap: wrap;
        }
        .missing-data-actions button {
            border: none;
            border-radius: 10px;
            padding: 10px 16px;
            font-size: 0.95em;
            font-weight: 700;
            cursor: pointer;
            margin-top: 0;
        }
        .missing-data-cancel {
            background: #e5e7eb;
            color: #111827;
        }
        .missing-data-save {
            background: #16a34a;
            color: #fff;
        }
        </style>
</head>
<body>
<div style="text-align: center;">
    <h1 style="margin-bottom: 30px;" data-i18n="add_item_to_inventory">Add Item to Inventory</h1>


    <div id="checklist" style="margin: 30px 0;">
        <div id="position-check" class="checkitem">
            <span id="position-status">Loading...</span>
        </div>
        <div id="barcode-check" class="checkitem">
            <span id="barcode-status">Loading...</span>
        </div>
    </div>
    <div id="barcodeEditorCard" class="barcode-editor">
        <div class="barcode-editor-title">Barcodes Ready To Add</div>
        <div id="barcodeEditorList"></div>
    </div>
    <form id="addItemForm" action="/additemtrue" method="POST">
        <!-- Hidden fields to pass barcode, position, and pictureposition from sessionStorage -->
        <input type="hidden" name="barcode" id="form_barcode" value="">
        <input type="hidden" name="item_position" id="form_position" value="">
        <input type="hidden" name="pictureposition" id="form_pictureposition" value="">
        <input type="hidden" name="title_overrides" id="form_title_overrides" value="">
        <div style="display: flex; flex-direction: column; align-items: center; width: 100%; max-width: 350px; margin: 0 auto; gap: 0;">
            <!-- Timer display -->
            <div id="autoSubmitTimer" style="font-size:1.5em; color:#1976d2; margin-bottom: 12px; display:none;"></div>
            <!-- Add Item button (larger, more pronounced) -->
            <button id="addItemBtn" type="submit" form="addItemForm" style="background-color: #43a047; color: white; border: none; padding: 28px 0; border-radius: 10px; cursor: pointer; font-size: 2em; width: 100%; margin-bottom: 32px; display: flex; align-items: center; justify-content: center; gap: 14px; box-shadow: 0 4px 16px rgba(67,160,71,0.12); font-weight: bold; letter-spacing: 1px;">
                <i class="fas fa-plus" style="font-size:1.2em;"></i> <span data-i18n="add_item">Add Item</span>
            </button>
            <!-- Clear button below Add Item, with extra space above -->
            <button id="clearBtn" type="button" style="background-color: #ff4444; color: white; border: none; padding: 14px; border-radius: 6px; cursor: pointer; font-size: 1.1em; width: 100%; margin-bottom: 18px; margin-top: 18px; display: flex; align-items: center; justify-content: center; gap: 8px;">
                <i class="fas fa-trash"></i> <span data-i18n="clear">Clear</span>
            </button>
            <!-- Divider -->
            <div style="width: 100%; height: 1px; background: #eee; margin: 10px 0 18px 0;"></div>
            <!-- Navigation button: Exit only -->
            <div style="width: 100%; display: flex; justify-content: center;">
                <button id="exitBtn" type="button" style="background-color: #ff4444; color: white; border: none; padding: 10px 0; border-radius: 6px; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 8px; font-size: 1em; width: 100%; max-width: 120px;">
                    <i class="fas fa-times"></i> <span data-i18n="exit">Exit</span>
                </button>
            </div>
        </div>
    </form>
    <script src="/static/barcode-entry-state.js?v=20260413b"></script>
    <script>
    const barcodeEntryState = window.BarcodeEntryState;
    const MANUAL_TITLE_STORAGE_KEY = 'additem_manual_titles';
    let autoSubmitTimeout = null;
    let timerInterval = null;
    let addItemSubmitInFlight = false;
    let addItemAlertAudioContext = null;

    function formatUpcDisplay(code) {
        const s = String(code || '').trim();
        if (/^\d+$/.test(s) && s.length <= 12) return s.padStart(12, '0');
        return s;
    }

    function escapeHtml(value) {
        return String(value || '').replace(/[&<>"']/g, function(char) {
            return ({
                '&': '&amp;',
                '<': '&lt;',
                '>': '&gt;',
                '"': '&quot;',
                "'": '&#39;'
            })[char] || char;
        });
    }

    function normalizeManualTitleKey(code) {
        const raw = String(code || '').trim();
        if (!raw) return '';
        if (barcodeEntryState && typeof barcodeEntryState.splitActualCode === 'function') {
            const split = barcodeEntryState.splitActualCode(raw);
            return String(split.code || raw).trim();
        }
        const match = raw.match(/^(.*?)-(\d+)$/);
        return match && match[1] ? String(match[1]).trim() : raw;
    }

    function loadManualTitleOverrides() {
        const raw = sessionStorage.getItem(MANUAL_TITLE_STORAGE_KEY);
        if (!raw) return {};
        try {
            const parsed = JSON.parse(raw);
            if (!parsed || typeof parsed !== 'object' || Array.isArray(parsed)) return {};
            const clean = {};
            Object.entries(parsed).forEach(([rawKey, rawValue]) => {
                const key = normalizeManualTitleKey(rawKey);
                const value = String(rawValue || '').replace(/\s+/g, ' ').trim();
                if (key && value) {
                    clean[key] = value.slice(0, 200);
                }
            });
            return clean;
        } catch (err) {
            return {};
        }
    }

    function saveManualTitleOverrides(overrides) {
        const next = {};
        Object.entries(overrides || {}).forEach(([rawKey, rawValue]) => {
            const key = normalizeManualTitleKey(rawKey);
            const value = String(rawValue || '').replace(/\s+/g, ' ').trim();
            if (key && value) {
                next[key] = value.slice(0, 200);
            }
        });
        if (Object.keys(next).length) {
            sessionStorage.setItem(MANUAL_TITLE_STORAGE_KEY, JSON.stringify(next));
        } else {
            sessionStorage.removeItem(MANUAL_TITLE_STORAGE_KEY);
        }
        return next;
    }

    function pruneManualTitleOverrides(entries) {
        const entryList = Array.isArray(entries) ? entries : getBarcodeEntries();
        const allowed = new Set();
        entryList.forEach(entry => {
            const key = normalizeManualTitleKey(entry && entry.code ? entry.code : entry);
            if (key) allowed.add(key);
        });
        const current = loadManualTitleOverrides();
        const next = {};
        Object.entries(current).forEach(([key, value]) => {
            if (allowed.has(key) && String(value || '').trim()) {
                next[key] = String(value || '').trim().slice(0, 200);
            }
        });
        return saveManualTitleOverrides(next);
    }

    function getManualTitleOverride(code) {
        const key = normalizeManualTitleKey(code);
        if (!key) return '';
        const current = loadManualTitleOverrides();
        return current[key] || '';
    }

    function mergeManualTitleOverrides(overrides) {
        const next = loadManualTitleOverrides();
        Object.entries(overrides || {}).forEach(([rawKey, rawValue]) => {
            const key = normalizeManualTitleKey(rawKey);
            const value = String(rawValue || '').replace(/\s+/g, ' ').trim();
            if (!key) return;
            if (value) {
                next[key] = value.slice(0, 200);
            } else {
                delete next[key];
            }
        });
        return saveManualTitleOverrides(next);
    }

    function getBarcodeEntries() {
        return barcodeEntryState ? barcodeEntryState.loadEntries() : [];
    }

    function getSerializedBarcode() {
        const entries = getBarcodeEntries();
        if (barcodeEntryState && entries.length) {
            return barcodeEntryState.serializeEntries(entries);
        }
        return sessionStorage.getItem('barcode') || '';
    }

    function syncAddItemFormFields() {
        const itemPosition = sessionStorage.getItem('item_position') || '';
        const picturePosition = sessionStorage.getItem('pictureposition_path') || '';
        const titleOverrides = pruneManualTitleOverrides(getBarcodeEntries());
        document.getElementById('form_barcode').value = getSerializedBarcode();
        document.getElementById('form_position').value = itemPosition;
        document.getElementById('form_pictureposition').value = picturePosition;
        document.getElementById('form_title_overrides').value = Object.keys(titleOverrides).length
            ? JSON.stringify(titleOverrides)
            : '';
    }

    function persistBarcodeEntries(entries) {
        if (barcodeEntryState) {
            barcodeEntryState.saveEntries(entries);
        }
        syncAddItemFormFields();
        updateChecklist();
        renderBarcodeEditor();
    }

    function renderBarcodeEditor() {
        const card = document.getElementById('barcodeEditorCard');
        const list = document.getElementById('barcodeEditorList');
        if (!card || !list) return;

        const entries = getBarcodeEntries();
        if (!entries.length) {
            card.style.display = 'none';
            list.innerHTML = '';
            return;
        }

        card.style.display = 'block';
        list.innerHTML = entries.map((item, index) => {
            const displayCode = barcodeEntryState
                ? barcodeEntryState.displayCode(item, formatUpcDisplay)
                : formatUpcDisplay(item.code || '');
            const manualTitle = getManualTitleOverride(item.code || '');
            const suffixLabel = item.suffix > 0 ? `Suffix ${item.suffix}` : 'Base';
            const metaText = item.suffix > 0
                ? 'Singular suffix item'
                : (item.quantity > 1 ? `Qty ${item.quantity} | Use + to split one out as a suffix item` : 'Qty 1');
            const manualTitleHtml = manualTitle
                ? `<div class="barcode-entry-manual-title">Warehouse title: ${escapeHtml(manualTitle)}</div>`
                : '';
            return `
                <div class="barcode-entry-row">
                    <div class="barcode-entry-main">
                        <div class="barcode-entry-code">${escapeHtml(displayCode)}</div>
                        <div class="barcode-entry-meta">${escapeHtml(metaText)}</div>
                        ${manualTitleHtml}
                    </div>
                    <div class="barcode-entry-actions">
                        <div class="suffix-pill">
                            <button type="button" onclick="adjustAddItemSuffix(${index}, -1)" ${item.suffix > 0 ? '' : 'disabled'}>-</button>
                            <span>${escapeHtml(suffixLabel)}</span>
                            <button type="button" onclick="adjustAddItemSuffix(${index}, 1)">+</button>
                        </div>
                        <button type="button" class="barcode-remove-btn" onclick="removeAddItemBarcode(${index})" title="Remove one">
                            <i class="fas fa-times"></i>
                        </button>
                    </div>
                </div>
            `;
        }).join('');
    }
    
    function updateChecklist() {
        const t = (key, fallback) => (window.i18n && window.i18n.t) ? window.i18n.t(key) : (fallback || key);
        // If both are set, prefer picturePosition (picture takes precedence)
        const itemPosition = sessionStorage.getItem('item_position');
        const picturePosition = sessionStorage.getItem('pictureposition_path');
        const barcodeEntries = getBarcodeEntries();
        const barcode = getSerializedBarcode();
        // Position logic
        let posText = '', posColor = '', posGoto = '';
        if (picturePosition) {
            posText = `${t('position_set_picture', 'Position set - picture')} <i class=\"fas fa-pen edit-icon\"></i>`;
            posColor = '#2ecc71'; // new green
            posGoto = '/position'; // Always go to position.html
            sessionStorage.removeItem('item_position');
        } else if (itemPosition) {
            posText = `${t('position_set', 'Position set')} - ${itemPosition} <i class=\"fas fa-pen edit-icon\"></i>`;
            posColor = '#2ecc71';
            posGoto = '/position';
        } else {
            posText = t('position_not_set', 'Position NOT set');
            posColor = '#d32f2f';
            posGoto = '/position?error=noposition';
        }
        // Barcode logic
        let barText = '', barColor = '', barGoto = '';
        const isLocked = sessionStorage.getItem('positionLocked') === 'true';
        if (barcode) {
            const totalCount = barcodeEntryState && barcodeEntries.length
                ? barcodeEntryState.totalCount(barcodeEntries)
                : barcode.split(',').filter(Boolean).length;
            if (totalCount > 1) {
                barText = `${t('barcodes_set', 'Barcodes set')} (${totalCount}) <i class=\"fas fa-pen edit-icon\"></i>`;
            } else {
                const firstEntry = barcodeEntries[0];
                const displayCode = firstEntry && barcodeEntryState
                    ? barcodeEntryState.displayCode(firstEntry, formatUpcDisplay)
                    : barcode;
                barText = `${t('barcode_set', 'Barcode set')} - ${displayCode} <i class=\"fas fa-pen edit-icon\"></i>`;
            }
            barColor = '#2ecc71';
            barGoto = isLocked ? '/multibarcode' : '/barcode';
        } else {
            barText = t('barcode_not_set', 'Barcode NOT set');
            barColor = '#d32f2f';
            barGoto = isLocked ? '/multibarcode' : '/barcode';
        }
        // Update DOM
        const posDiv = document.getElementById('position-check');
        if (posDiv) {
            posDiv.style.backgroundColor = posColor;
            posDiv.style.color = '#fff';
            posDiv.classList.remove('set', 'clickable');
            if (picturePosition || itemPosition) {
                posDiv.classList.add('set', 'clickable');
            }
            // Use innerHTML to allow icon
            document.getElementById('position-status').innerHTML = posText;
            posDiv.onclick = () => { window.location.href = posGoto; };
        }
        const barDiv = document.getElementById('barcode-check');
        if (barDiv) {
            barDiv.style.backgroundColor = barColor;
            barDiv.style.color = '#fff';
            barDiv.classList.remove('set', 'clickable');
            if (barcode) {
                barDiv.classList.add('set', 'clickable');
            }
            document.getElementById('barcode-status').innerHTML = barText;
            barDiv.onclick = () => { window.location.href = barGoto; };
        }
    }
    // Always show checklist on load
    window.adjustAddItemSuffix = function(index, delta) {
        if (!barcodeEntryState) return;
        const entries = getBarcodeEntries();
        const nextEntries = delta > 0
            ? barcodeEntryState.incrementSuffix(entries, index)
            : barcodeEntryState.decrementSuffix(entries, index);
        persistBarcodeEntries(nextEntries);
    };

    window.removeAddItemBarcode = function(index) {
        if (!barcodeEntryState) return;
        const entries = getBarcodeEntries();
        const nextEntries = barcodeEntryState.removeOne(entries, index);
        persistBarcodeEntries(nextEntries);
    };

    function getScreeningBarcodes() {
        const seen = new Set();
        const ordered = [];
        const entries = getBarcodeEntries();
        entries.forEach(entry => {
            const key = normalizeManualTitleKey(entry && entry.code ? entry.code : '');
            if (key && !seen.has(key)) {
                seen.add(key);
                ordered.push(key);
            }
        });
        if (ordered.length) return ordered;

        const fallback = getSerializedBarcode().split(',');
        fallback.forEach(rawCode => {
            const key = normalizeManualTitleKey(rawCode);
            if (key && !seen.has(key)) {
                seen.add(key);
                ordered.push(key);
            }
        });
        return ordered;
    }

    function ensureAddItemAlertAudioContext() {
        const AudioContextCtor = window.AudioContext || window.webkitAudioContext;
        if (!AudioContextCtor) return null;
        if (!addItemAlertAudioContext) {
            try {
                addItemAlertAudioContext = new AudioContextCtor();
            } catch (err) {
                return null;
            }
        }
        if (addItemAlertAudioContext.state === 'suspended') {
            addItemAlertAudioContext.resume().catch(() => {});
        }
        return addItemAlertAudioContext;
    }

    async function playMissingDataAlert() {
        const ctx = ensureAddItemAlertAudioContext();
        if (!ctx) {
            if (navigator.vibrate) navigator.vibrate([120, 80, 120]);
            return;
        }
        try {
            if (ctx.state === 'suspended') {
                await ctx.resume();
            }
            const now = ctx.currentTime;
            const oscillator = ctx.createOscillator();
            const gain = ctx.createGain();
            oscillator.type = 'square';
            oscillator.frequency.setValueAtTime(880, now);
            oscillator.frequency.setValueAtTime(660, now + 0.16);
            gain.gain.setValueAtTime(0.0001, now);
            gain.gain.exponentialRampToValueAtTime(0.18, now + 0.02);
            gain.gain.exponentialRampToValueAtTime(0.0001, now + 0.34);
            oscillator.connect(gain);
            gain.connect(ctx.destination);
            oscillator.start(now);
            oscillator.stop(now + 0.36);
        } catch (err) {
            if (navigator.vibrate) navigator.vibrate([120, 80, 120]);
        }
    }

    function describeIssueFlags(issue) {
        const flags = [];
        if (issue.needsManualTitle) flags.push('No title found');
        if (issue.missingImage) flags.push('No thumbnail found');
        return flags.join(' | ') || 'Incomplete data';
    }

    function openMissingDataModal(issues) {
        return new Promise(resolve => {
            const overlay = document.createElement('div');
            overlay.className = 'missing-data-modal';
            overlay.innerHTML = `
                <div class="missing-data-card" role="dialog" aria-modal="true" aria-labelledby="missingDataTitle">
                    <div class="missing-data-accent"></div>
                    <h2 id="missingDataTitle" class="missing-data-title">Missing item data before add</h2>
                    <p class="missing-data-text">
                        One or more scanned items are missing Macy/BOL details. Add a warehouse title where needed so the item can still be searched after it is added.
                    </p>
                    <div class="missing-data-list">
                        ${issues.map((issue, index) => {
                            const currentTitle = issue.savedManualTitle || issue.existingTitle || '';
                            const helperLines = [];
                            if (currentTitle) {
                                helperLines.push(issue.savedManualTitle
                                    ? `Saved warehouse title: ${escapeHtml(issue.savedManualTitle)}`
                                    : `Found title: ${escapeHtml(issue.existingTitle)}`);
                            }
                            if (issue.needsManualTitle) {
                                helperLines.push('Enter a warehouse title for searchRack.');
                            }
                            if (issue.missingImage) {
                                helperLines.push('Thumbnail is missing, so this item may need extra attention.');
                            }
                            return `
                                <div class="missing-data-item">
                                    <div class="missing-data-item-header">
                                        <div class="missing-data-barcode">${escapeHtml(formatUpcDisplay(issue.barcode))}</div>
                                        <div class="missing-data-flags">${escapeHtml(describeIssueFlags(issue))}</div>
                                    </div>
                                    ${issue.needsManualTitle ? `
                                        <input
                                            type="text"
                                            class="missing-data-title-input"
                                            data-barcode="${escapeHtml(issue.barcode)}"
                                            maxlength="200"
                                            placeholder="Enter a warehouse title"
                                            value="${escapeHtml(issue.savedManualTitle || '')}"
                                        >
                                    ` : ''}
                                    <div class="missing-data-helper">${helperLines.join('<br>')}</div>
                                </div>
                            `;
                        }).join('')}
                    </div>
                    <div class="missing-data-actions">
                        <button type="button" class="missing-data-cancel">Cancel</button>
                        <button type="button" class="missing-data-save">Continue Add</button>
                    </div>
                </div>
            `;

            const cleanup = () => {
                document.removeEventListener('keydown', onKeyDown);
                overlay.remove();
            };

            const close = (result) => {
                cleanup();
                resolve(result);
            };

            const onKeyDown = (event) => {
                if (event.key === 'Escape') {
                    event.preventDefault();
                    close({ continueSubmit: false });
                }
            };

            document.addEventListener('keydown', onKeyDown);

            overlay.querySelector('.missing-data-cancel').addEventListener('click', function() {
                close({ continueSubmit: false });
            });

            overlay.querySelector('.missing-data-save').addEventListener('click', function() {
                const manualTitles = {};
                let invalidInput = null;
                overlay.querySelectorAll('.missing-data-title-input').forEach(input => {
                    const barcode = normalizeManualTitleKey(input.dataset.barcode || '');
                    const value = String(input.value || '').replace(/\s+/g, ' ').trim();
                    if (!value) {
                        invalidInput = invalidInput || input;
                        input.style.borderColor = '#dc2626';
                        input.style.boxShadow = '0 0 0 3px rgba(220,38,38,0.16)';
                        return;
                    }
                    input.style.borderColor = '#16a34a';
                    input.style.boxShadow = '0 0 0 3px rgba(22,163,74,0.12)';
                    if (barcode) {
                        manualTitles[barcode] = value.slice(0, 200);
                    }
                });

                if (invalidInput) {
                    invalidInput.focus();
                    invalidInput.select();
                    return;
                }

                close({ continueSubmit: true, manualTitles });
            });

            document.body.appendChild(overlay);
            const firstInput = overlay.querySelector('.missing-data-title-input');
            if (firstInput) {
                window.setTimeout(() => {
                    firstInput.focus();
                    firstInput.select();
                }, 20);
            }
        });
    }

    async function fetchAddItemScreening(barcodes) {
        const controller = new AbortController();
        const timeout = setTimeout(() => controller.abort(), 5000);
        try {
            const response = await fetch('/api/add-item/screen', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify({ barcodes }),
                signal: controller.signal
            });

            const payload = await response.json().catch(() => ({}));
            if (!response.ok || payload.success === false) {
                throw new Error((payload && payload.error) || 'Unable to screen item data');
            }
            return payload.items || {};
        } finally {
            clearTimeout(timeout);
        }
    }

    async function screenAddItemSubmission() {
        const barcodes = getScreeningBarcodes();
        if (!barcodes.length) {
            return { continueSubmit: true };
        }

        const currentOverrides = loadManualTitleOverrides();
        const screeningItems = await fetchAddItemScreening(barcodes);
        const issues = [];

        barcodes.forEach(barcode => {
            const key = normalizeManualTitleKey(barcode);
            const item = screeningItems[barcode] || screeningItems[key] || {};
            const savedManualTitle = currentOverrides[key] || '';
            const needsManualTitle = Boolean(item.needs_manual_title) && !savedManualTitle;
            // Only block for a missing title — a missing image is informational only
            if (!needsManualTitle) {
                return;
            }
            issues.push({
                barcode: key || barcode,
                needsManualTitle: true,
                missingImage: Boolean(item.missing_image),
                existingTitle: String(item.title || '').trim(),
                savedManualTitle
            });
        });

        if (!issues.length) {
            return { continueSubmit: true };
        }

        await playMissingDataAlert();
        return openMissingDataModal(issues);
    }

    async function submitAddItemForm(form) {
        syncAddItemFormFields();
        const formData = new FormData(form);
        try {
            const res = await fetch('/additemtrue', {
                method: 'POST',
                body: formData,
                headers: { 'Accept': '*/*' }
            });
            if (res.ok) {
                const data = await res.json().catch(() => null);
                if (data && data.success) {
                    sessionStorage.removeItem('barcode');
                    sessionStorage.removeItem('barcode_entries');
                    sessionStorage.removeItem('additem_manual_titles');
                    sessionStorage.removeItem('item_position');
                    sessionStorage.removeItem('pictureposition_path');
                    const wasLocked = sessionStorage.getItem('positionLocked') === 'true';
                    if (wasLocked) {
                        sessionStorage.removeItem('positionLocked');
                        fetch('/toggle', {
                            method: 'POST',
                            headers: { 'Content-Type': 'application/json' },
                            body: JSON.stringify({ checked: false })
                        }).catch(() => {});
                    }
                    window.location.replace('/position');
                    return;
                }
            }
        } catch (_) { /* fall through to native */ }
        // Native fallback (e.g. server returned non-JSON error page)
        form.submit();
    }

    async function handleAddItemSubmit(form) {
        if (addItemSubmitInFlight) return;
        addItemSubmitInFlight = true;
        cancelAutoSubmitTimer();

        const addButton = document.getElementById('addItemBtn');
        if (addButton) addButton.disabled = true;

        try {
            syncAddItemFormFields();
            const screeningResult = await screenAddItemSubmission();
            if (screeningResult && screeningResult.manualTitles) {
                mergeManualTitleOverrides(screeningResult.manualTitles);
                syncAddItemFormFields();
                renderBarcodeEditor();
            }
            if (!screeningResult || screeningResult.continueSubmit === false) {
                return;
            }
            await submitAddItemForm(form);
        } catch (err) {
            console.error('Add item screening failed, submitting anyway:', err);
            await submitAddItemForm(form);
        } finally {
            addItemSubmitInFlight = false;
            if (addButton) addButton.disabled = false;
        }
    }

    document.addEventListener('DOMContentLoaded', function() {
        syncAddItemFormFields();
        updateChecklist();
        renderBarcodeEditor();

        const addItemForm = document.getElementById('addItemForm');
        if (addItemForm) {
            addItemForm.addEventListener('submit', function(event) {
                event.preventDefault();
                handleAddItemSubmit(addItemForm);
            });
        }
    });

    function startAutoSubmitTimer() {
        // Get timer settings from localStorage (set in misc.html)
        let seconds = 2;
        const stored = localStorage.getItem('addItemTimer');
        if (stored && !isNaN(parseInt(stored))) {
            seconds = Math.max(1, Math.min(30, parseInt(stored)));
        }
        const timerDiv = document.getElementById('autoSubmitTimer');
        timerDiv.textContent = `Auto-adding in ${seconds}...`;
        timerDiv.style.display = '';
        timerInterval = setInterval(() => {
            seconds--;
            if (seconds > 0) {
                timerDiv.textContent = `Auto-adding in ${seconds}...`;
            } else {
                clearInterval(timerInterval);
                timerDiv.textContent = 'Adding...';
            }
        }, 1000);
        autoSubmitTimeout = setTimeout(() => {
            clearInterval(timerInterval);
            timerDiv.textContent = 'Adding...';
            const form = document.getElementById('addItemForm');
            if (form && typeof form.requestSubmit === 'function') {
                form.requestSubmit();
            } else if (form) {
                handleAddItemSubmit(form);
            }
        }, seconds * 1000);
    }
    function cancelAutoSubmitTimer() {
        if (autoSubmitTimeout) clearTimeout(autoSubmitTimeout);
        if (timerInterval) clearInterval(timerInterval);
        const timerDiv = document.getElementById('autoSubmitTimer');
        timerDiv.style.display = 'none';
    }
    // Cancel timer on keyboard/mouse input — intentionally excludes touchstart
    // so mobile page-load scroll or a residual finger touch doesn't kill the timer
    ['keydown', 'mousedown'].forEach(evt => {
        window.addEventListener(evt, cancelAutoSubmitTimer, { once: true, passive: true });
    });
    ['pointerdown', 'keydown', 'touchstart'].forEach(evt => {
        window.addEventListener(evt, ensureAddItemAlertAudioContext, { once: true, passive: true });
    });
    // Always start timer by default (3s) unless explicitly disabled in settings
    document.addEventListener('DOMContentLoaded', function() {
        const barcode = getSerializedBarcode();
        const itemPosition = sessionStorage.getItem('item_position');
        const picturePosition = sessionStorage.getItem('pictureposition_path');
        let disable = localStorage.getItem('disableAutoSubmit');
        // If not set, default to enabled
        if (disable === null) disable = '0';
        // Position is set if either itemPosition or picturePosition
        if (disable !== '1' && (itemPosition || picturePosition) && barcode) {
            startAutoSubmitTimer();
        }
    });
    </script>
</body>

<script>
    // Show spinner/status if upload is in progress, or redirect if error
    function checkPictureUploadStatus() {
        const status = sessionStorage.getItem('pictureposition_upload_status');
        if (status === 'uploading') {
            showUploadSpinner();
            // Poll until done or error
            const interval = setInterval(() => {
                const s = sessionStorage.getItem('pictureposition_upload_status');
                if (s === 'done') {
                    hideUploadSpinner();
                    clearInterval(interval);
                } else if (s === 'error') {
                    clearInterval(interval);
                    window.location.href = '/pictureposition?error=1';
                }
            }, 500);
        } else if (status === 'error') {
            window.location.href = '/pictureposition?error=1';
        }
    }

    function showUploadSpinner() {
        let spinner = document.getElementById('upload-spinner');
        if (!spinner) {
            spinner = document.createElement('div');
            spinner.id = 'upload-spinner';
            spinner.innerHTML = '<div style="margin:30px auto;text-align:center;"><span style="font-size:1.2em;">Uploading picture...</span><br><svg width="40" height="40" viewBox="0 0 40 40"><circle cx="20" cy="20" r="18" stroke="#1976d2" stroke-width="4" fill="none" stroke-dasharray="90" stroke-dashoffset="60"><animateTransform attributeName="transform" type="rotate" from="0 20 20" to="360 20 20" dur="1s" repeatCount="indefinite"/></circle></svg></div>';
            document.body.appendChild(spinner);
        } else {
            spinner.style.display = '';
        }
    }
    function hideUploadSpinner() {
        let spinner = document.getElementById('upload-spinner');
        if (spinner) spinner.style.display = 'none';
    }
    // On load, check upload status if redirected from pictureposition
    if (window.location.search.includes('pictureposition=1')) {
        checkPictureUploadStatus();
    }

    document.getElementById('clearBtn').addEventListener('click', function(e) {
        e.preventDefault();
        sessionStorage.removeItem('item_position');
        sessionStorage.removeItem('barcode');
        sessionStorage.removeItem('barcode_entries');
        sessionStorage.removeItem('additem_manual_titles');
        sessionStorage.removeItem('pictureposition_path');
        // Optionally clear any other related sessionStorage keys
        // Do NOT submit any form or reload to a new page
        // Instead, update checklist and visually reset
        syncAddItemFormFields();
        updateChecklist();
        renderBarcodeEditor();
    });

    document.getElementById('exitBtn').addEventListener('click', function(e) {
        e.preventDefault();
        sessionStorage.removeItem('item_position');
        sessionStorage.removeItem('barcode');
        sessionStorage.removeItem('barcode_entries');
        sessionStorage.removeItem('additem_manual_titles');
        sessionStorage.removeItem('pictureposition_path');
        sessionStorage.removeItem('positionLocked');
        // Notify server to clear lock state
        fetch('/toggle', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ checked: false })
        }).catch(err => console.error('Error clearing lock:', err));
        window.location.href = '/';
    });
</script>
