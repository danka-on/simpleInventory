<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="icon" type="image/png" href="{{ url_for('static', filename='favicon.ico') }}">
    <title>Listings &amp; Stock - Sweet Shelves</title>
    <style>
        :root{
            color-scheme:light;
            --r-bg:#f3f5f8;--r-panel:#fff;--r-panel2:#f8fafc;--r-line:#e3e8ef;--r-line2:#cbd5e1;
            --r-ink:#0f172a;--r-ink2:#334155;--r-muted:#64748b;
            --r-shadow:0 1px 2px rgba(15,23,42,.05),0 6px 20px rgba(15,23,42,.05);
            --r-accent:#2563eb;--r-accent-soft:#dbeafe;
            --c-need:#7c3aed;--c-need-soft:#ede9fe;
            --c-out:#dc2626;--c-out-soft:#fee2e2;
            --c-short:#d97706;--c-short-soft:#fef3c7;
            --c-ok:#059669;--c-ok-soft:#d1fae5;
            --c-unlisted:#0284c7;--c-unlisted-soft:#e0f2fe;
            --c-done:#64748b;--c-done-soft:#e2e8f0;
            --c-all:#0f172a;--c-all-soft:#e2e8f0;
            --s-ebay:#0064d2;--s-ebay-ink:#fff;--s-amazon:#f59e0b;--s-amazon-ink:#1f1300;--s-wh:#475569;--s-wh-ink:#fff;
        }
        html.ss-theme-night{
            color-scheme:dark;
            --r-bg:#0b1220;--r-panel:#111a2e;--r-panel2:#172238;--r-line:rgba(255,255,255,.09);--r-line2:rgba(255,255,255,.18);
            --r-ink:#e2e8f0;--r-ink2:#cbd5e1;--r-muted:#94a3b8;
            --r-shadow:0 1px 2px rgba(0,0,0,.4),0 10px 30px rgba(0,0,0,.35);
            --r-accent:#60a5fa;--r-accent-soft:rgba(96,165,250,.16);
            --c-need:#a78bfa;--c-need-soft:rgba(167,139,250,.16);
            --c-out:#f87171;--c-out-soft:rgba(248,113,113,.16);
            --c-short:#fbbf24;--c-short-soft:rgba(251,191,36,.16);
            --c-ok:#34d399;--c-ok-soft:rgba(52,211,153,.16);
            --c-unlisted:#38bdf8;--c-unlisted-soft:rgba(56,189,248,.16);
            --c-done:#94a3b8;--c-done-soft:rgba(148,163,184,.16);
            --c-all:#e2e8f0;--c-all-soft:rgba(226,232,240,.14);
            --s-ebay:#3b82f6;--s-amazon:#f59e0b;--s-wh:#64748b;
        }
        *{box-sizing:border-box}
        html,body{margin:0}
        body{background:var(--r-bg);color:var(--r-ink);font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;font-size:14px;line-height:1.45}
        html.ss-theme-night body{background:var(--r-bg);color:var(--r-ink)}
        button,input,select{font:inherit;color:inherit}
        button{cursor:pointer}
        a{color:var(--r-accent)}
        code{font-family:"SFMono-Regular",Consolas,"Liberation Mono",monospace;font-size:.92em}
        .page{max-width:1240px;margin:auto;padding:16px 16px 96px;min-width:0}

        /* Header */
        .header{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:12px}
        .brand{display:flex;align-items:center;gap:12px;min-width:0}
        .back{display:inline-flex;align-items:center;gap:6px;padding:7px 11px;border:1px solid var(--r-line2);border-radius:9px;background:var(--r-panel);color:var(--r-ink2);text-decoration:none;font-weight:600;font-size:13px;white-space:nowrap}
        .back:hover{border-color:var(--r-accent);color:var(--r-accent)}
        h1{margin:0;font-size:1.35rem;letter-spacing:-.02em;line-height:1.2}
        .meta-line{color:var(--r-muted);font-size:12.5px;margin-top:2px}
        .meta-line b{color:var(--r-ink);font-weight:700;font-variant-numeric:tabular-nums}
        .actions{display:flex;gap:8px;flex-wrap:wrap}

        /* Buttons */
        .btn{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--r-line2);background:var(--r-panel);color:var(--r-ink2);padding:7px 12px;border-radius:9px;text-decoration:none;font-weight:650;font-size:13px;line-height:1.2;white-space:nowrap;transition:border-color .12s,background .12s,color .12s}
        .btn:hover{border-color:var(--r-accent);color:var(--r-accent)}
        .btn:disabled{opacity:.5;cursor:default}
        .btn.primary{background:var(--r-accent);border-color:var(--r-accent);color:#fff}
        .btn.primary:hover{filter:brightness(1.07);color:#fff}
        .btn.link{background:var(--c-ok);border-color:var(--c-ok);color:#fff}
        .btn.link:hover{filter:brightness(1.07);color:#fff}
        .btn.success{background:var(--c-ok);border-color:var(--c-ok);color:#fff}
        .btn.success:hover{filter:brightness(1.07);color:#fff}
        .btn.quiet{border-color:transparent;background:transparent;color:var(--r-muted)}
        .btn.quiet:hover{background:var(--r-panel2);color:var(--r-ink)}
        .btn.danger{color:var(--c-out)}
        .btn.danger:hover{border-color:var(--c-out);background:var(--c-out-soft)}
        .btn.sm{padding:5px 9px;font-size:12px;border-radius:7px}

        .panel{background:var(--r-panel);border:1px solid var(--r-line);border-radius:14px;box-shadow:var(--r-shadow)}
        .error{display:none;padding:12px 14px;border:1px solid var(--c-out);background:var(--c-out-soft);color:var(--c-out);border-radius:10px;margin-bottom:12px;font-weight:600}

        /* Loading skeleton */
        .loading{padding:6px 0}
        .skel{height:92px;border-radius:14px;margin-bottom:10px;background:linear-gradient(90deg,var(--r-panel) 0%,var(--r-panel2) 50%,var(--r-panel) 100%);background-size:200% 100%;animation:shimmer 1.2s ease-in-out infinite;border:1px solid var(--r-line)}
        @keyframes shimmer{from{background-position:200% 0}to{background-position:-200% 0}}
        .loading .hint{color:var(--r-muted);font-size:13px;text-align:center;padding:8px}
        #workspace{display:none}

        /* Status board: one bar + colored tabs */
        .board{padding:12px 14px 10px;margin-bottom:12px}
        .health{display:flex;align-items:center;gap:14px;margin-bottom:10px}
        .health .pct{font-size:1.5rem;font-weight:800;letter-spacing:-.02em;font-variant-numeric:tabular-nums;line-height:1;color:var(--c-ok);white-space:nowrap}
        .health .pct small{display:block;font-size:11px;font-weight:600;color:var(--r-muted);letter-spacing:.02em;text-transform:uppercase;margin-top:3px}
        .bar{flex:1;height:12px;border-radius:999px;overflow:hidden;background:var(--c-done-soft);display:flex;min-width:0}
        .bar i{display:block;height:100%;transition:width .35s ease}
        .bar .in{background:var(--c-ok)}.bar .short{background:var(--c-short)}.bar .out{background:var(--c-out)}.bar .need{background:var(--c-need)}
        .tabs{display:flex;gap:6px;overflow-x:auto;scrollbar-width:thin;padding-bottom:2px;margin:0 -2px}
        .tab{--tone:var(--c-all);--soft:var(--c-all-soft);flex:1 0 auto;display:flex;flex-direction:column;align-items:flex-start;gap:2px;min-width:118px;padding:8px 11px;border:1px solid var(--r-line);border-radius:11px;background:var(--r-panel);text-align:left;transition:background .12s,border-color .12s}
        .tab:hover{background:var(--r-panel2)}
        .tab .n{font-size:1.15rem;font-weight:800;line-height:1;color:var(--tone);font-variant-numeric:tabular-nums}
        .tab .l{font-size:11.5px;font-weight:650;color:var(--r-muted);white-space:nowrap;display:flex;align-items:center;gap:5px}
        .tab .l::before{content:"";width:7px;height:7px;border-radius:50%;background:var(--tone);flex:none}
        .tab[aria-selected="true"]{background:var(--soft);border-color:var(--tone);box-shadow:inset 0 0 0 1px var(--tone)}
        .tab[aria-selected="true"] .l{color:var(--r-ink)}
        .tab[data-tab="needs_matching"]{--tone:var(--c-need);--soft:var(--c-need-soft)}
        .tab[data-tab="out_of_stock"]{--tone:var(--c-out);--soft:var(--c-out-soft)}
        .tab[data-tab="short_stock"]{--tone:var(--c-short);--soft:var(--c-short-soft)}
        .tab[data-tab="in_stock"]{--tone:var(--c-ok);--soft:var(--c-ok-soft)}
        .tab[data-tab="unlisted"]{--tone:var(--c-unlisted);--soft:var(--c-unlisted-soft)}
        .tab[data-tab="reviewed"]{--tone:var(--c-done);--soft:var(--c-done-soft)}

        /* Toolbar */
        .toolbar{position:sticky;top:0;z-index:20;display:flex;gap:8px;align-items:center;flex-wrap:wrap;padding:8px 10px;margin-bottom:10px;background:var(--r-panel);border:1px solid var(--r-line);border-radius:12px;box-shadow:var(--r-shadow)}
        html.ss-has-top-banner .toolbar{top:calc(var(--ss-banner-h,44px) + 6px)}
        .search{flex:1 1 260px;position:relative;display:flex;align-items:center;min-width:0}
        .search svg{position:absolute;left:11px;width:16px;height:16px;color:var(--r-muted);pointer-events:none}
        .search input{width:100%;min-width:0;padding:9px 34px 9px 34px;border:1px solid var(--r-line2);border-radius:9px;background:var(--r-panel2);color:var(--r-ink);font-size:14px}
        .search input:focus{outline:none;border-color:var(--r-accent);box-shadow:0 0 0 3px var(--r-accent-soft);background:var(--r-panel)}
        .search input::placeholder{color:var(--r-muted)}
        .search input::-webkit-search-cancel-button,.search input::-webkit-search-decoration{-webkit-appearance:none;appearance:none;display:none}
        .search .clear{position:absolute;right:6px;width:26px;height:26px;border:0;border-radius:50%;background:transparent;color:var(--r-muted);font-size:18px;line-height:1;display:none;align-items:center;justify-content:center}
        .search .clear:hover{background:var(--r-line);color:var(--r-ink)}
        .search.has-query .clear{display:inline-flex}
        .toolbar select{border:1px solid var(--r-line2);background:var(--r-panel2);border-radius:9px;padding:8px 10px;color:var(--r-ink);max-width:200px}
        .toolbar select:focus{outline:none;border-color:var(--r-accent);box-shadow:0 0 0 3px var(--r-accent-soft)}
        .scope{display:none;align-items:center;gap:6px;font-size:12.5px;font-weight:600;color:var(--r-ink2);padding:6px 8px;border:1px solid var(--r-line);border-radius:9px;background:var(--r-panel2);cursor:pointer;white-space:nowrap}
        .scope input{width:15px;height:15px;accent-color:var(--r-accent);margin:0}
        .toolbar.searching .scope{display:inline-flex}
        .summary{font-size:12.5px;color:var(--r-muted);font-weight:600;white-space:nowrap}
        .summary:empty{display:none}

        /* Section note + bulk */
        .noterow{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;margin:0 4px 10px}
        .section-note{color:var(--r-muted);font-size:12.5px;line-height:1.45;margin:0}
        .bulk{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
        .bulk[hidden]{display:none}
        .bulk-status{font-size:12.5px;font-weight:600;color:var(--r-muted)}
        .bulk-status.bad{color:var(--c-out)}
        .bulk-status:empty{display:none}

        /* Floating selection tray */
        .tray{position:fixed;left:50%;bottom:16px;transform:translateX(-50%);z-index:30;display:flex;gap:10px;align-items:center;flex-wrap:wrap;justify-content:center;max-width:calc(100vw - 24px);padding:10px 14px;background:var(--r-panel);border:1px solid var(--c-ok);border-radius:14px;box-shadow:0 12px 40px rgba(15,23,42,.22)}
        .tray[hidden]{display:none}
        .tray .bulk-status{max-width:60vw}

        /* Rows */
        .item{--tone:var(--c-done);position:relative;padding:14px 16px 14px 18px;margin-bottom:10px;display:grid;grid-template-columns:104px minmax(0,1fr);gap:16px;align-items:start;overflow:hidden}
        .item::before{content:"";position:absolute;left:0;top:0;bottom:0;width:4px;background:var(--tone)}
        .item[data-status="needs_matching"]{--tone:var(--c-need)}
        .item[data-status="out_of_stock"]{--tone:var(--c-out)}
        .item[data-status="short_stock"]{--tone:var(--c-short)}
        .item[data-status="in_stock"]{--tone:var(--c-ok)}
        .item[data-status="unlisted"]{--tone:var(--c-unlisted)}
        .item[data-status="reviewed"]{--tone:var(--c-done);opacity:.9}
        .thumb,.suggestion img{object-fit:cover;border:1px solid var(--r-line);background:var(--r-panel2);cursor:zoom-in;transition:transform .12s,box-shadow .12s,border-color .12s}
        .thumb:hover,.suggestion img:hover,.thumb:focus-visible,.suggestion img:focus-visible{transform:scale(1.05);border-color:var(--c-need);box-shadow:0 4px 14px rgba(0,0,0,.18);outline:none}
        .thumb{width:104px;height:104px;border-radius:10px}
        .body{min-width:0}
        .head{display:flex;align-items:flex-start;gap:8px;flex-wrap:wrap}
        .title{font-weight:700;font-size:16px;line-height:1.35;margin:0;flex:1 1 240px;min-width:0;overflow-wrap:anywhere}
        .title a{color:inherit;text-decoration:none}
        .title a:hover{text-decoration:underline}
        .status-pill{flex:none;font-size:11px;font-weight:750;letter-spacing:.02em;padding:3px 9px;border-radius:999px;background:var(--soft,var(--c-done-soft));color:var(--tone);border:1px solid color-mix(in srgb,var(--tone) 35%,transparent)}
        .item[data-status="needs_matching"] .status-pill{--soft:var(--c-need-soft)}
        .item[data-status="out_of_stock"] .status-pill{--soft:var(--c-out-soft)}
        .item[data-status="short_stock"] .status-pill{--soft:var(--c-short-soft)}
        .item[data-status="in_stock"] .status-pill{--soft:var(--c-ok-soft)}
        .item[data-status="unlisted"] .status-pill{--soft:var(--c-unlisted-soft)}
        .meta{display:flex;gap:5px;flex-wrap:wrap;margin-top:6px;align-items:center}
        .chip{display:inline-flex;align-items:center;gap:4px;background:var(--r-panel2);border:1px solid var(--r-line);border-radius:6px;padding:3px 8px;font-size:12.5px;font-weight:650;color:var(--r-ink2);max-width:100%;overflow-wrap:anywhere}
        .chip.store{border:0;font-weight:800;text-transform:uppercase;font-size:10.5px;letter-spacing:.04em}
        .chip.store-ebay{background:var(--s-ebay);color:var(--s-ebay-ink,#fff)}
        .chip.store-amazon{background:var(--s-amazon);color:var(--s-amazon-ink,#1f1300)}
        .chip.store-warehouse{background:var(--s-wh);color:var(--s-wh-ink,#fff)}
        .chip.code{font-family:"SFMono-Regular",Consolas,monospace;font-weight:600;letter-spacing:.01em}
        .chip.ok{background:var(--c-ok-soft);color:var(--c-ok);border-color:transparent}
        .chip.bad{background:var(--c-out-soft);color:var(--c-out);border-color:transparent}
        .chip.warn{background:var(--c-short-soft);color:var(--c-short);border-color:transparent}
        .chip.hint{background:var(--c-need-soft);color:var(--c-need);border-color:transparent}

        /* Stock strip: inline on purpose so it reads as one sentence */
        .stock{display:block;margin-top:8px;font-size:14px;color:var(--r-muted);font-variant-numeric:tabular-nums}
        .stock b{color:var(--r-ink);font-weight:800;font-size:15px}
        .stock b.ok{color:var(--c-ok)}.stock b.warn{color:var(--c-short)}.stock b.bad{color:var(--c-out)}
        .stock .sep{color:var(--r-line2)}

        .rack{margin-top:7px;font-size:13px;color:var(--r-muted);line-height:1.6;overflow-wrap:anywhere}
        .rack code{background:var(--r-panel2);border:1px solid var(--r-line);border-radius:4px;padding:0 5px}
        .rack .loc{display:inline-block;background:var(--c-unlisted-soft);color:var(--c-unlisted);border-radius:4px;padding:0 6px;font-weight:700}

        /* Suggestions */
        .suggestions{margin-top:10px;display:grid;gap:8px}
        .suggestion{display:grid;grid-template-columns:80px minmax(0,1fr) auto;gap:14px;align-items:center;padding:10px 12px;border:1px dashed color-mix(in srgb,var(--c-need) 45%,transparent);border-radius:10px;background:var(--r-panel2)}
        .suggestion img{width:80px;height:80px;border-radius:8px;background:var(--r-panel)}
        .suggestion .name{font-weight:700;font-size:14.5px;line-height:1.35;overflow-wrap:anywhere}
        .suggestion .why{font-size:12.5px;color:var(--r-muted);margin-top:2px;overflow-wrap:anywhere}
        .suggestion .why strong{color:var(--c-need)}
        .suggestion .claimed{display:-webkit-box;-webkit-box-orient:vertical;-webkit-line-clamp:2;overflow:hidden;cursor:pointer}
        .suggestion .claimed.open{display:block}
        .suggestion .claimed b{color:var(--r-ink2);font-weight:700}
        .suggestion-actions{display:flex;gap:8px;align-items:center;flex-wrap:wrap;justify-content:flex-end}
        .pick-link{display:inline-flex;align-items:center;gap:5px;cursor:pointer;font-size:12px;font-weight:700;color:var(--r-ink2);padding:4px 6px;border-radius:7px}
        .pick-link:hover{background:var(--r-panel)}
        .pick-link input{width:17px;height:17px;accent-color:var(--c-ok);margin:0}
        .why{font-size:12.5px;color:var(--r-muted);overflow-wrap:anywhere}
        .ai-note{margin-top:6px}
        .row-actions{display:flex;gap:6px;flex-wrap:wrap;margin-top:9px;align-items:center}
        .row-status{font-size:12px;font-weight:700;margin-top:4px;min-height:0}
        .row-status:empty{display:none}
        .row-status.ok{color:var(--c-ok)}
        .row-status.bad{color:var(--c-out)}
        .empty{padding:44px 18px;text-align:center;color:var(--r-muted)}
        .empty strong{display:block;color:var(--r-ink);font-size:1rem;margin-bottom:4px}
        .more{display:block;margin:6px auto 18px}
        #reviewHistory{padding:10px 14px;margin-bottom:10px;font-size:12.5px;color:var(--r-muted)}
        #reviewHistory summary{cursor:pointer;font-weight:700;color:var(--r-ink2)}
        #reviewHistory p{margin:4px 0}

        /* Image preview */
        .image-preview{border:0;border-radius:12px;padding:48px 12px 12px;background:#111827;color:white;max-width:96vw;max-height:96vh;overflow:auto;cursor:zoom-out}
        .image-preview::backdrop{background:rgba(0,0,0,.85);cursor:zoom-out}
        .image-preview img{display:block;width:92vw;height:84vh;object-fit:contain;margin:auto}
        .image-preview .close-preview{position:absolute;right:10px;top:8px}

        @media (max-width:760px){
            .page{padding:10px 10px 110px}
            .header{margin-bottom:10px}
            h1{font-size:1.15rem}
            .actions .btn{padding:7px 10px}
            .board{padding:10px 10px 8px}
            .tab{min-width:104px;padding:7px 9px}
            .toolbar{position:static;padding:8px}
            .item{grid-template-columns:76px minmax(0,1fr);padding:12px 10px 12px 14px;gap:12px}
            .thumb{width:76px;height:76px}
            .suggestion{grid-template-columns:64px minmax(0,1fr)}
            .suggestion img{width:64px;height:64px}
            .suggestion-actions{grid-column:1 / -1;justify-content:flex-start}
        }
    </style>
</head>
<body>
<div class="page">
    <div class="header">
        <div class="brand">
            <a class="back" href="/store-manager" aria-label="Back to Store Manager">&larr;</a>
            <div>
                <h1>Listings &amp; Stock</h1>
                <div class="meta-line"><b id="tileLive">0</b> active listings <span id="tileLiveDetail"></span></div>
            </div>
        </div>
        <div class="actions">
            <a class="btn" href="/sync">Sync stores</a>
            <button type="button" class="btn primary" id="refreshButton">Refresh</button>
        </div>
    </div>

    <div class="error" id="errorBox"></div>

    <div class="loading" id="loadingBox">
        <div class="skel"></div><div class="skel"></div><div class="skel"></div>
        <div class="hint">Matching every active listing against the warehouse…</div>
    </div>

    <div id="workspace">
        <div class="panel board">
            <div class="health">
                <div class="pct"><span id="tileCoverage">0%</span><small id="tileCoverageDetail">enough stock</small></div>
                <div class="bar" id="healthBar" aria-hidden="true"><i class="in"></i><i class="short"></i><i class="out"></i><i class="need"></i></div>
            </div>
            <div class="tabs" role="tablist" id="tabs">
                <button type="button" class="tab" role="tab" data-tab="needs_matching" aria-selected="true"><span class="n">0</span><span class="l">Needs matching</span></button>
                <button type="button" class="tab" role="tab" data-tab="out_of_stock" aria-selected="false"><span class="n">0</span><span class="l">Out of stock</span></button>
                <button type="button" class="tab" role="tab" data-tab="short_stock" aria-selected="false"><span class="n">0</span><span class="l">Not enough stock</span></button>
                <button type="button" class="tab" role="tab" data-tab="unlisted" aria-selected="false"><span class="n">0</span><span class="l">Warehouse without listings</span></button>
                <button type="button" class="tab" role="tab" data-tab="reviewed" aria-selected="false"><span class="n">0</span><span class="l">Reviewed</span></button>
                <button type="button" class="tab" role="tab" data-tab="all" aria-selected="false"><span class="n">0</span><span class="l">All active listings</span></button>
            </div>
        </div>

        <div class="toolbar" id="toolbar">
            <div class="search" id="searchWrap">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
                <input type="search" id="searchBox" placeholder="Search name, UPC, ASIN, SKU, shelf or paste a link" title="Press / to search" aria-label="Search listings and warehouse" autocomplete="off">
                <button type="button" class="clear" id="clearSearchButton" aria-label="Clear search" title="Clear search">&times;</button>
            </div>
            <select id="storeFilter" aria-label="Store">
                <option value="">Both stores</option>
                <option value="ebay">eBay only</option>
                <option value="amazon">Amazon only</option>
            </select>
            <select id="brandFilter" aria-label="Brand"><option value="">All brands</option></select>
            <label class="scope" title="Search every view, not only the selected one"><input type="checkbox" id="searchAllTabs" checked> All views</label>
            <span id="searchSummary" class="summary" role="status"></span>
        </div>

        <div class="noterow">
            <p class="section-note" id="sectionNote"></p>
            <div class="bulk" id="bulkBar" hidden>
                <button type="button" class="btn sm" id="bulkHandledButton">Mark all as handled</button>
                <span class="bulk-status" id="bulkStatus"></span>
            </div>
        </div>

        <div id="reviewHistory" class="panel" hidden></div>
        <div id="itemList"></div>
        <button type="button" class="btn more" id="moreButton" hidden>Show more</button>
    </div>
</div>

<div class="tray" id="linkBulkBar" hidden>
    <button type="button" class="btn link" id="linkSelectedButton">Link selected</button>
    <button type="button" class="btn quiet" id="clearSelectedButton">Clear selection</button>
    <span class="bulk-status" id="linkBulkStatus" role="status" aria-live="polite"></span>
</div>

<dialog id="imagePreview" class="image-preview" aria-label="Enlarged product photo">
    <button type="button" class="btn close-preview" id="closeImagePreview" aria-label="Close image preview">Close ×</button>
    <img id="previewImage" alt="">
</dialog>
<script>
const PAGE_SIZE = 150;
const LABELS = {all:'All active listings',needs_matching:'Needs matching',out_of_stock:'Out of stock',short_stock:'Not enough stock',in_stock:'Enough stock',unlisted:'Warehouse without listings',reviewed:'Reviewed'};
const NOTES = {
    all:'Active eBay and merchant-fulfilled Amazon listings. Available = physical stock minus sales from the last 7 days not yet pulled. Stock shared between stores is not reserved twice.',
    needs_matching:'No barcode match on the rack. Confirm the warehouse item for each listing; a suggestion does not count as stock until linked.',
    out_of_stock:'No available units. Check the shelf before changing the store listing; receiving history alone does not prove a sale.',
    short_stock:'Some stock is available, but fewer units than the listing offers.',
    in_stock:'Matched stock covers the listed quantity after pending sales.',
    unlisted:'Stocked items with no active eBay, Amazon (merchant or FBA) or Facebook listing. Unconfirmed suggestions do not count as a listing.',
    reviewed:'Issues you marked reviewed. A stock or quantity change can bring one back. Reviewing changes nothing in the warehouse or the stores.'
};
const state = {data:null, tab:'needs_matching', store:'', query:'', brand:'', shown:PAGE_SIZE, busy:false, selected:new Map()};
function stockStatus(l){return l.stock_status || ({suggested:'needs_matching',unaccounted:'needs_matching',sold_out:'out_of_stock',accounted:l.short_by?'short_stock':'in_stock',handled:'reviewed',warehouse_unlisted:'unlisted'}[l.state]);}
function allItems(){return [...(state.data?.listings || []),...(state.data?.unlisted || [])];}

function esc(value){
    return String(value == null ? '' : value).replace(/[&<>"']/g, c => (
        {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]
    ));
}
function storeName(store){ return store === 'ebay' ? 'eBay' : store === 'amazon' ? 'Amazon' : store === 'warehouse' ? 'Warehouse' : store; }
function missingImg(){
    return 'data:image/svg+xml;utf8,' + encodeURIComponent('<svg xmlns="http://www.w3.org/2000/svg" width="64" height="64"><rect width="100%" height="100%" fill="#e2e8f0" rx="8"/></svg>');
}
function finderUrl(l){
    const params = new URLSearchParams({
        listing_store: l.store, listing_key: l.listing_key, listing_id: l.listing_id,
        title: l.title || '', barcode: l.upc || '', image: l.image || '',
        q: l.upc || l.title || '',
        return: window.location.pathname + '?tab=' + encodeURIComponent(state.tab),
    });
    return `/finder?${params.toString()}`;
}

function searchText(value){
    return String(value || '').normalize('NFKD').replace(/[̀-ͯ]/g, '').toLowerCase()
        .replace(/[^a-z0-9.]+/g, ' ').trim();
}
function oneLetterApart(a, b){
    if (Math.abs(a.length-b.length)>1) return false;
    let i=0, j=0, edits=0;
    while (i<a.length && j<b.length) {
        if (a[i]===b[j]) {i++;j++;continue;}
        if (++edits>1) return false;
        if (a.length<=b.length) j++;
        if (a.length>=b.length) i++;
    }
    return edits + (i<a.length || j<b.length ? 1 : 0) <= 1;
}
function searchRank(l){
    let query=state.query.trim();
    if (!query) return 1;
    // Accept product links as well as their ASIN or item ID.
    query=query.match(/\/(?:dp|gp\/product)\/([a-z0-9]{10})(?:[/?]|$)/i)?.[1]
        || query.match(/\/itm\/(?:[^/]+\/)?(\d+)(?:[/?]|$)/i)?.[1] || query;
    const stock=[...(l.warehouse || []), ...(l.suggestions || [])];
    const identifiers=[l.upc,l.sku,l.item_id,l.listing_key,...(l.codes || []),l.link?.barcode,...stock.map(w=>w.barcode)].filter(Boolean);
    if (/^\d{7,14}(?:-\d+)?$/.test(query)) {
        const key=value=>String(value).replace(/^0+(?=\d)/,'');
        const needle=key(query);
        return identifiers.some(value=>key(value)===needle || (!query.includes('-') && key(value).split('-')[0]===needle)) ? 1000 : 0;
    }
    const compact=query.toLowerCase().replace(/[^a-z0-9]/g,'');
    if (compact.length>=5 && identifiers.some(value=>String(value).toLowerCase().replace(/[^a-z0-9]/g,'')===compact)) return 1000;
    const brandAliases=(l.attributes?.brands || []).flatMap(brand=>[brand,...(state.data?.brand_names?.[brand] || [])]);
    const fields=[...brandAliases,l.title,l.upc,l.sku,l.hint,l.item_id,l.listing_key,l.received_lot,l.link?.barcode,l.link?.location,
        ...stock.flatMap(w=>[w.title,w.barcode,w.location,w.note,...(w.alternate_titles || [])])];
    const texts=fields.map(searchText);
    const words=new Set(texts.flatMap(t=>t.split(/\s+/)));
    const terms=searchText(query).split(/\s+/).filter(Boolean);
    const brandWords=new Set(Object.values(state.data?.brand_names || {}).flatMap(aliases=>aliases.flatMap(alias=>searchText(alias).split(' '))));
    const typeWords=new Set(Object.values(state.data?.type_names || {}).flat());
    const colorWords=new Set(state.data?.color_names || []);
    let score=0;
    for (const term of terms) {
        const weight=brandWords.has(term)?100:typeWords.has(term)?60:colorWords.has(term)?30:/^\d+$/.test(term)?15:20;
        if (words.has(term)) {score+=weight;continue;}
        if (/^[a-z]+$/.test(term) && term.length>=3 && [...words].some(w=>w.startsWith(term))) {score+=weight*.5;continue;}
        if (/^[a-z]+$/.test(term) && term.length>=5 && [...words].some(w=>/^[a-z]+$/.test(w) && oneLetterApart(term,w))) {score+=weight*.25;continue;}
        return 0;
    }
    return score + (texts.some(t=>t===searchText(query)) ? 100 : 0);
}
function searchingAllTabs(){ return !!state.query.trim() && document.getElementById('searchAllTabs').checked; }
function visibleListings(){
    if (!state.data) return [];
    const allTabs=searchingAllTabs();
    return allItems().filter(l=>(allTabs || (state.tab==='all' ? l.store!=='warehouse' : stockStatus(l)===state.tab)) && (!state.store || l.store==='warehouse' || l.store===state.store) && (!state.brand || (l.attributes?.brands || []).includes(state.brand)))
        .map(l=>({listing:l,score:searchRank(l)})).filter(result=>result.score>0)
        .sort((a,b)=>b.score-a.score).map(result=>result.listing);
}

function chips(l){
    const out = [`<span class="chip store store-${esc(l.store)}">${esc(storeName(l.store))}</span>`];
    if (l.upc) out.push(`<span class="chip code" title="Barcode / UPC">${esc(l.upc)}</span>`);
    else out.push('<span class="chip bad">no UPC on listing</span>');
    const sku = String(l.sku || '').trim();
    if (sku && !['none','null'].includes(sku.toLowerCase()) && sku !== l.upc && !l.hint) out.push(`<span class="chip code" title="SKU">SKU ${esc(sku)}</span>`);
    if (l.hint) out.push(`<span class="chip hint" title="Note from the listing SKU field">note: ${esc(l.hint)}</span>`);
    if (l.match_kind === 'linked') out.push(`<span class="chip ok">linked by hand${l.link && l.link.stale ? ' · row gone' : ''}</span>`);
    else if (l.match_kind === 'suffix') out.push('<span class="chip ok">matched a -suffix unit</span>');
    else if (l.match_kind === 'zero-pad') out.push('<span class="chip ok">matched (leading zeros differ)</span>');
    if (l.link && l.link.stale) out.push('<span class="chip bad">Previous link unavailable — check warehouse</span>');
    if (l.available_short_by || l.short_by) out.push(`<span class="chip bad">short by ${l.available_short_by ?? l.short_by}</span>`);
    if (l.state !== 'accounted' && l.received) {
        out.push(`<span class="chip warn">received${l.received_lot ? ' · lot ' + esc(l.received_lot) : ''}, not on rack</span>`);
    }
    return out.join('');
}

function stockStrip(l){
    const sep = '<span class="sep"> · </span>';
    const linked = l.state === 'accounted' || l.store === 'warehouse' || l.physical_qty != null;
    const listed = Number(l.qty || 0);
    if (!linked) {
        return `<div class="stock"><span>Listed: <b>${listed}</b></span>${sep}<span>Warehouse: <b class="bad">not linked</b></span></div>`;
    }
    const physical = l.physical_qty ?? l.warehouse_qty ?? 0;
    const pending = l.pending_sale_qty || 0;
    const available = l.available_qty ?? l.warehouse_qty ?? 0;
    const tone = available <= 0 ? 'bad' : (l.store !== 'warehouse' && available < listed) ? 'warn' : 'ok';
    let html = `<span>Physical: <b>${physical}</b></span>${sep}<span>Pending sales: <b${pending > 0 ? ' class="warn"' : ''}>${pending}</b></span>${sep}<span>Available: <b class="${tone}">${available}</b></span>`;
    if (l.store !== 'warehouse') html += `${sep}<span>Listed: <b>${listed}</b></span>`;
    return `<div class="stock">${html}</div>`;
}

function rackLines(l){
    if (!l.warehouse.length) return l.state === 'accounted' ? '<div class="rack">The linked rack row has no stock left.</div>' : '';
    return '<div class="rack">' + l.warehouse.map(w =>
        `#${w.searchrack_id} · <code>${esc(w.barcode)}</code> · ${w.location ? `<span class="loc">${esc(w.location)}</span>` : 'no location'} · qty ${w.quantity}`
        + (w.note ? ` · <em>${esc(w.note)}</em>` : '')).join('<br>') + '</div>';
}

function suggestionBlocks(l){
    return `<div class="suggestions">` + l.suggestions.map(s => `
        <div class="suggestion">
            <img src="${esc(s.image || '') || missingImg()}" alt="" loading="lazy" onerror="this.src='${missingImg()}'">
            <div>
                <div class="name">${esc(s.title || '(untitled rack row)')}</div>
                <div class="why"><code>${esc(s.barcode)}</code> · ${s.location ? esc(s.location) : 'no location'} · qty ${s.quantity} · ${esc(s.reason)}</div>
                ${s.claimed_by ? `<div class="why claimed" tabindex="0" role="button" aria-expanded="false" title="${esc(s.claimed_by)}"><b>Already matched:</b> ${esc(s.claimed_by)}</div>` : ''}
                ${s.ai_verdict ? `<div class="why"><strong>${s.ai_verdict === 'likely' ? 'Claude: likely match' : 'Claude: possible match'}</strong> · Confirm against the item.</div>` : ''}
                ${s.alternate_titles?.length ? `<div class="why">Saved names: ${s.alternate_titles.map(esc).join(' · ')}</div>` : ''}
            </div>
            <div class="suggestion-actions">
                <label class="pick-link"><input type="checkbox" data-select-link data-searchrack-id="${s.searchrack_id}"
                    aria-label="Select match ${esc(s.barcode)} for ${esc(l.title || l.listing_key)}"
                    ${state.selected.get(selectionKey(l))?.searchrack_id === s.searchrack_id ? 'checked' : ''}>Select</label>
                <button type="button" class="btn link sm" data-action="link" data-searchrack-id="${s.searchrack_id}">Link</button>
            </div>
        </div>`).join('') + '</div>';
}

function actionButtons(l){
    const buttons = [];
    if (stockStatus(l) === 'reviewed') {
        buttons.push('<button type="button" class="btn sm" data-action="undo">Reopen issue</button>');
    } else if (l.store==='warehouse') {
        buttons.push(`<a class="btn sm primary" href="/listingagent?upc=${encodeURIComponent(l.upc)}&return=%2Fstore-listing-helper%3Ftab%3Dunlisted">Create listing</a>`);
        buttons.push(`<a class="btn sm" href="/unified-search?q=${encodeURIComponent(l.upc)}&return=%2Fstore-listing-helper%3Ftab%3Dunlisted">View warehouse item</a>`);
        buttons.push('<button type="button" class="btn sm success" data-action="handled">✓ Mark reviewed</button>');
    } else {
        buttons.push(`<a class="btn sm${l.state === 'accounted' ? '' : ' primary'}" href="${esc(finderUrl(l))}">Find in warehouse</a>`);
        if (l.link) buttons.push('<button type="button" class="btn sm danger" data-action="unlink">Unlink</button>');
        if (stockStatus(l) !== 'in_stock') buttons.push('<button type="button" class="btn sm success" data-action="handled">✓ Mark reviewed</button>');
    }
    if (l.url) buttons.push(`<a class="btn sm quiet" href="${esc(l.url)}" target="_blank" rel="noopener">Open listing ↗</a>`);
    return `<div class="row-actions">${buttons.join('')}</div>`;
}

function aiNote(l){
    if (!state.data?.claude_search_available || !l.ai_search) return '';
    return `<div class="why ai-note">Claude searched ${l.ai_search.catalog_rows.toLocaleString()} stocked rows. ${l.ai_search.match_count ? 'Suggestions require your confirmation.' : 'No suitable match found; existing suggestions remain.'} Saved result · original search ≈$${Number(l.ai_search.estimated_cost_usd).toFixed(3)}.</div>`;
}

function renderListing(l){
    const title = l.title || '(untitled listing)';
    const status = stockStatus(l);
    const open = !['accounted','handled'].includes(l.state) && status !== 'reviewed';
    const showPill = state.tab === 'all' || searchingAllTabs();
    return `<div class="panel item" data-store="${esc(l.store)}" data-key="${esc(l.listing_key)}" data-status="${esc(status)}">
        <img class="thumb" src="${esc(l.image || '') || missingImg()}" alt="" loading="lazy" onerror="this.src='${missingImg()}'">
        <div class="body">
            <div class="head">
                <h3 class="title">${l.url ? `<a href="${esc(l.url)}" target="_blank" rel="noopener">${esc(title)}</a>` : esc(title)}</h3>
                ${showPill ? `<span class="status-pill">${esc(LABELS[status] || l.state)}</span>` : ''}
            </div>
            <div class="meta">${chips(l)}</div>
            ${stockStrip(l)}
            ${rackLines(l)}
            ${open && l.suggestions && l.suggestions.length ? suggestionBlocks(l) : ''}
            ${open ? (l.has_more_suggestions
                ? '<div class="row-actions"><button type="button" class="btn sm" data-action="more_matches">Show 3 more matches</button><span class="why">Local search · no API cost</span></div>'
                : l.more_matches_loaded ? '<div class="why">No more matching products found locally.</div>' : '') : ''}
            ${open && l.state !== 'warehouse_unlisted' ? aiNote(l) : ''}
            ${actionButtons(l)}
            <div class="row-status"></div>
        </div>
    </div>`;
}

const imagePreview = document.getElementById('imagePreview');
function openImagePreview(thumbnail){
    const src = thumbnail.currentSrc || thumbnail.src;
    if (!src || src.startsWith('data:')) return;
    const preview = document.getElementById('previewImage');
    preview.src = src;
    preview.alt = thumbnail.closest('.suggestion')?.querySelector('.name')?.textContent
        || thumbnail.closest('.item')?.querySelector('.title')?.textContent || 'Product photo';
    imagePreview.showModal();
}
// Any click while the photo is open closes it: backdrop, photo or the Close button.
imagePreview.addEventListener('click', () => imagePreview.close());
imagePreview.addEventListener('close', () => document.getElementById('previewImage').removeAttribute('src'));
document.getElementById('itemList').addEventListener('click', event => {
    const thumbnail = event.target.closest('.thumb, .suggestion img');
    if (thumbnail) openImagePreview(thumbnail);
    // The "Already matched" line is clamped to two lines; phones have no hover title, so a tap opens it.
    const claimed = event.target.closest('.suggestion .claimed');
    if (claimed) toggleClaimed(claimed);
});
document.getElementById('itemList').addEventListener('keydown', event => {
    if ((event.key === 'Enter' || event.key === ' ') && event.target.matches('.thumb, .suggestion img')) {
        event.preventDefault();
        openImagePreview(event.target);
    } else if ((event.key === 'Enter' || event.key === ' ') && event.target.matches('.suggestion .claimed')) {
        event.preventDefault();  // Space would scroll the page
        toggleClaimed(event.target);
    }
});
function toggleClaimed(line){
    line.setAttribute('aria-expanded', line.classList.toggle('open'));
}

function render(){
    updateLinkSelection();
    const rows = visibleListings();
    const filtered = !!(state.query.trim() || state.store || state.brand);
    document.getElementById('searchSummary').textContent = filtered
        ? `${rows.length} result${rows.length === 1 ? '' : 's'}${searchingAllTabs() ? ' across all views' : ' in this view'}`
        : '';
    document.getElementById('searchWrap').classList.toggle('has-query', !!state.query);
    document.getElementById('toolbar').classList.toggle('searching', !!state.query.trim());
    const note = document.getElementById('sectionNote');
    note.textContent = NOTES[state.tab] || '';
    const bulkBar = document.getElementById('bulkBar');
    const soldOutCount=rows.filter(l=>stockStatus(l)==='out_of_stock').length;
    bulkBar.hidden = !(state.tab === 'out_of_stock' && soldOutCount);
    if (!state.busy) document.getElementById('bulkHandledButton').textContent = `Mark ${soldOutCount} reviewed`;
    const list = document.getElementById('itemList');
    const history = state.data?.review_history || [];
    const historyBox = document.getElementById('reviewHistory');
    historyBox.hidden = state.tab!=='reviewed' || !history.length;
    if(!historyBox.hidden) historyBox.innerHTML = `<details><summary>Earlier review history (${history.length})</summary><p>Saved reviews from earlier stock conditions or alert rules. These records do not change current stock.</p>${history.map(r=>`<p>${esc(r.dismissed_at)} · ${esc(r.upc || 'Listing issue')} · ${esc(r.store || 'all stores')}</p>`).join('')}</details>`;
    if (!rows.length) {
        list.innerHTML = `<div class="panel empty"><strong>Nothing here.</strong>${filtered ? 'No listing on this view matches the filter.' : 'This view is clear.'}</div>`;
        document.getElementById('moreButton').hidden = true;
        return;
    }
    list.innerHTML = rows.slice(0, state.shown).map(renderListing).join('');
    list.querySelectorAll('.thumb, .suggestion img').forEach(img => {
        img.tabIndex = 0;
        img.setAttribute('role', 'button');
        img.setAttribute('aria-label', 'Enlarge photo');
    });
    const more = document.getElementById('moreButton');
    more.hidden = rows.length <= state.shown;
    more.textContent = `Show more (${rows.length - state.shown} left)`;
}

function formatTime(raw){
    if (!raw) return '';
    const d = new Date(raw);
    if (isNaN(d.getTime())) return '';
    return d.toLocaleTimeString([], {hour:'numeric', minute:'2-digit'});
}

function applyTotals(data){
    const t = data.totals;
    const by = data.stock_counts || allItems().reduce((out,l)=>{const key=stockStatus(l);out[key]=(out[key]||0)+1;return out;},{});
    const count = key => key==='all' ? t.listings : by[key] || 0;
    const pct = key => t.listings ? Math.max(0, Math.min(100, 100*count(key)/t.listings)) : 0;
    document.getElementById('tileLive').textContent = t.listings.toLocaleString();
    const updated = formatTime(data.generated_at);
    document.getElementById('tileLiveDetail').textContent = `· eBay + merchant-fulfilled Amazon · ${Number(t.rack_rows || 0).toLocaleString()} stocked rows${updated ? ' · updated ' + updated : ''}`;
    document.getElementById('tileCoverage').textContent = `${t.listings ? Math.round(100*count('in_stock')/t.listings) : 100}%`;
    document.getElementById('tileCoverageDetail').textContent = `enough stock · ${count('in_stock').toLocaleString()} of ${t.listings.toLocaleString()}`;
    const bar = document.getElementById('healthBar');
    bar.querySelector('.in').style.width = pct('in_stock') + '%';
    bar.querySelector('.short').style.width = pct('short_stock') + '%';
    bar.querySelector('.out').style.width = pct('out_of_stock') + '%';
    bar.querySelector('.need').style.width = pct('needs_matching') + '%';
    bar.title = `${count('in_stock')} enough · ${count('short_stock')} not enough · ${count('out_of_stock')} out of stock · ${count('needs_matching')} needs matching`;
    document.querySelectorAll('#tabs .tab').forEach(tab => {
        const key = tab.dataset.tab;
        const label = LABELS[key];
        tab.querySelector('.n').textContent = count(key).toLocaleString();
        tab.querySelector('.l').textContent = label;
        tab.setAttribute('aria-label', `${label} (${count(key)})`);
    });
}

async function load(refresh){
    document.getElementById('loadingBox').style.display = 'block';
    document.getElementById('workspace').style.display = 'none';
    document.getElementById('errorBox').style.display = 'none';
    try {
        const response = await fetch('/api/listing-reconciliation' + (refresh ? '?refresh=1' : ''), {cache:'no-store'});
        const data = await response.json();
        if (!response.ok || !data.success) throw new Error(data.error || 'Could not load the reconciliation');
        state.data = data;
        const brandCounts=new Map();
        allItems().forEach(l=>(l.attributes?.brands || []).forEach(brand=>brandCounts.set(brand,(brandCounts.get(brand)||0)+1)));
        const brandFilter=document.getElementById('brandFilter');
        brandFilter.innerHTML='<option value="">All brands</option>'+[...brandCounts].sort((a,b)=>b[1]-a[1] || a[0].localeCompare(b[0]))
            .map(([brand,count])=>`<option value="${esc(brand)}">${esc(brand)} (${count})</option>`).join('');
        if (state.brand && !brandCounts.has(state.brand)) state.brand='';
        brandFilter.value=state.brand;
        state.shown = PAGE_SIZE;
        applyTotals(data);
        render();
        document.getElementById('loadingBox').style.display = 'none';
        document.getElementById('workspace').style.display = 'block';
    } catch (error) {
        document.getElementById('loadingBox').style.display = 'none';
        const box = document.getElementById('errorBox');
        box.textContent = error.message;
        box.style.display = 'block';
    }
}

async function post(url, body){
    const response = await fetch(url, {method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify(body)});
    const data = await response.json();
    if (!response.ok || !data.success) throw new Error(data.error || 'Request failed');
    return data;
}

function listingFor(card){
    return allItems().find(l => l.store === card.dataset.store && l.listing_key === card.dataset.key);
}

async function act(card, action, button){
    const l = listingFor(card);
    if (!l || state.busy) return;
    setBusy(true);
    const status = card.querySelector('.row-status');
    status.className = 'row-status';
    status.textContent = '';
    card.querySelectorAll('button').forEach(b => { b.disabled = true; });
    try {
        if (action === 'more_matches') {
            status.textContent = 'Finding the next matching products…';
            const data = await post('/api/listing-reconciliation', {action:'more_matches', store:l.store, listing_key:l.listing_key,
                seen_ids:l.suggestions.map(s=>s.searchrack_id), seen_barcodes:l.suggestions.map(s=>s.barcode)});
            const seen = new Set(l.suggestions.map(s=>s.searchrack_id));
            l.suggestions.push(...data.suggestions.filter(s=>!seen.has(s.searchrack_id)));
            l.has_more_suggestions = data.has_more_suggestions;
            l.more_matches_loaded = true;
            render();
            return;
        } else if (action === 'search_warehouse') {
            status.textContent = 'Claude is searching the entire stocked warehouse catalog and saved names…';
            const data = await post('/api/listing-reconciliation', {action:'search_warehouse', store:l.store, listing_key:l.listing_key});
            const returned = new Set(data.suggestions.map(s=>s.searchrack_id));
            l.suggestions = [...data.suggestions, ...l.suggestions.filter(s=>!returned.has(s.searchrack_id))];
            l.ai_search = data.ai_search;
            render();
            return;
        } else if (action === 'link') {
            await post('/api/listing-helper/inventory-match', {
                store: l.store, listing_key: l.listing_key, listing_id: l.listing_id,
                marketplace_barcode: l.upc || '', listing_title: l.title || '',
                searchrack_id: parseInt(button.dataset.searchrackId, 10) || 0, finder_learn: true,
            });
            status.textContent = 'Linked.';
        } else if (action === 'unlink') {
            await post('/api/listing-helper/inventory-match', {store: l.store, listing_key: l.listing_key, clear: true});
            status.textContent = 'Unlinked.';
        } else if (action === 'handled') {
            await post('/api/listing-helper/dismiss', {alert_type: 'stock_review', hash: l.review_hash || l.hash, upc: l.upc || '', store: l.store, listing_ids: [l.listing_key]});
            status.textContent = 'Marked reviewed.';
        } else if (action === 'undo') {
            await post('/api/listing-helper/undismiss', {hash: l.review_hash || l.hash});
            status.textContent = 'Back on the list.';
        }
        state.selected.delete(selectionKey(l));
        status.className = 'row-status ok';
        await load(true);
    } catch (error) {
        status.className = 'row-status bad';
        status.textContent = error.message;
        card.querySelectorAll('button').forEach(b => { b.disabled = false; });
    } finally {
        setBusy(false);
    }
}

function selectionKey(l){ return JSON.stringify([l.store, l.listing_key]); }

function updateLinkSelection(){
    const count = state.selected.size;
    document.getElementById('linkBulkBar').hidden = !count && !document.getElementById('linkBulkStatus').textContent;
    const button = document.getElementById('linkSelectedButton');
    button.textContent = `Link selected (${count})`;
    button.disabled = state.busy || !count;
    document.getElementById('clearSelectedButton').disabled = state.busy || !count;
}

function setBusy(busy){
    state.busy = busy;
    document.querySelectorAll('button, input, select').forEach(control => { control.disabled = busy; });
    updateLinkSelection();
}

async function linkSelected(){
    if (state.busy || !state.selected.size) return;
    const selected = [...state.selected.entries()];
    const status = document.getElementById('linkBulkStatus');
    setBusy(true);
    status.className = 'bulk-status';
    let done = 0;
    const failures = [];
    try {
        for (const [index, [key, selection]] of selected.entries()) {
            status.textContent = `Linking ${index + 1} of ${selected.length}…`;
            const l = selection.listing;
            try {
                await post('/api/listing-helper/inventory-match', {
                    store:l.store, listing_key:l.listing_key, listing_id:l.listing_id,
                    marketplace_barcode:l.upc || '', listing_title:l.title || '',
                    searchrack_id:selection.searchrack_id, finder_learn:true,
                });
                state.selected.delete(key);
                done++;
            } catch (error) {
                failures.push(`${l.title || l.listing_key}: ${error.message}`);
            }
        }
        status.className = failures.length ? 'bulk-status bad' : 'bulk-status';
        status.textContent = failures.length
            ? `Linked ${done}; ${failures.length} failed and remain selected. ${failures.join(' · ')}`
            : `Linked all ${done}.`;
        // Refresh the expensive reconciliation only once, after the entire batch.
        await load(true);
    } finally {
        setBusy(false);
    }
}

document.getElementById('itemList').addEventListener('change', event => {
    const input = event.target.closest('[data-select-link]');
    if (!input || state.busy) return;
    const card = input.closest('.item');
    const l = listingFor(card);
    if (!l) return;
    const key = selectionKey(l);
    if (input.checked) {
        state.selected.set(key, {listing:l, searchrack_id:Number(input.dataset.searchrackId)});
        card.querySelectorAll('[data-select-link]').forEach(other => { other.checked = other === input; });
    } else state.selected.delete(key);
    document.getElementById('linkBulkStatus').textContent = '';
    updateLinkSelection();
});
document.getElementById('linkSelectedButton').addEventListener('click', linkSelected);
document.getElementById('clearSelectedButton').addEventListener('click', () => {
    if (state.busy) return;
    state.selected.clear();
    document.getElementById('linkBulkStatus').textContent = '';
    render();
});

async function bulkHandled(){
    const rows = visibleListings().filter(l=>stockStatus(l) === 'out_of_stock');
    if (!rows.length || state.busy) return;
    if (!confirm(`Mark all ${rows.length} listings on this view as reviewed?`)) return;
    const button = document.getElementById('bulkHandledButton');
    const status = document.getElementById('bulkStatus');
    setBusy(true);
    button.disabled = true;
    status.className = 'bulk-status';
    let done = 0;
    const failures = [];
    for (const [index, l] of rows.entries()) {
        status.textContent = `Marking ${index + 1} of ${rows.length}…`;
        try {
            await post('/api/listing-helper/dismiss', {alert_type: 'stock_review', hash: l.review_hash || l.hash, upc: l.upc || '', store: l.store, listing_ids: [l.listing_key]});
            done += 1;
        } catch (error) {
            failures.push(`${l.title || l.listing_key}: ${error.message}`);
        }
    }
    status.className = failures.length ? 'bulk-status bad' : 'bulk-status';
    status.textContent = failures.length ? `Marked ${done}; ${failures.length} failed — ${failures.join(' · ')}` : `Marked all ${done}.`;
    await load(true);
    setBusy(false);
}

function selectTab(key){
    if (!LABELS[key]) return;
    state.tab = key;
    state.shown = PAGE_SIZE;
    document.querySelectorAll('#tabs .tab').forEach(t => t.setAttribute('aria-selected', t.dataset.tab === key ? 'true' : 'false'));
    render();
}

document.getElementById('itemList').addEventListener('click', event => {
    const button = event.target.closest('[data-action]');
    if (button) act(button.closest('.item'), button.dataset.action, button);
});
document.getElementById('tabs').addEventListener('click', event => {
    const tab = event.target.closest('.tab');
    if (tab) selectTab(tab.dataset.tab);
});
document.getElementById('storeFilter').addEventListener('change', event => { state.store = event.target.value; state.shown = PAGE_SIZE; render(); });
document.getElementById('brandFilter').addEventListener('change', event=>{state.brand=event.target.value;state.shown=PAGE_SIZE;render();});
document.getElementById('searchAllTabs').addEventListener('change', () => {state.shown=PAGE_SIZE;render();});
function clearSearch(){ state.query=''; document.getElementById('searchBox').value=''; state.shown=PAGE_SIZE; render(); }
document.getElementById('clearSearchButton').addEventListener('click', clearSearch);
document.getElementById('searchBox').addEventListener('input', event => { state.query = event.target.value; state.shown = PAGE_SIZE; render(); });
document.getElementById('searchBox').addEventListener('keydown', event => { if (event.key === 'Escape') { clearSearch(); event.target.blur(); } });
document.addEventListener('keydown', event => {
    if (event.key !== '/' || event.ctrlKey || event.metaKey || event.altKey) return;
    if (['INPUT','SELECT','TEXTAREA'].includes(event.target.tagName) || event.target.isContentEditable) return;
    event.preventDefault();
    document.getElementById('searchBox').focus();
});
document.getElementById('moreButton').addEventListener('click', () => { state.shown += PAGE_SIZE; render(); });
document.getElementById('bulkHandledButton').addEventListener('click', bulkHandled);
document.getElementById('refreshButton').addEventListener('click', () => load(true));

(function init(){
    const previous = new URLSearchParams(window.location.search).get('tab');
    const requested = ({suggested:'needs_matching',unaccounted:'needs_matching',listing_matches:'needs_matching',sold_out:'out_of_stock',no_warehouse:'out_of_stock',quantity_alert:'short_stock',accounted:'in_stock',no_listings:'unlisted',handled:'reviewed',dismissed:'reviewed'}[previous]) || previous;
    if (requested && NOTES[requested]) {
        state.tab = requested;
        document.querySelectorAll('#tabs .tab').forEach(t => t.setAttribute('aria-selected', t.dataset.tab === requested ? 'true' : 'false'));
    }
    // Coming back from the Finder means a link was probably just saved.
    load(true);
})();
window.addEventListener('pageshow', event => { if (event.persisted) load(true); });
</script>
<script src="/static/i18n.js"></script>
</body>
</html>
