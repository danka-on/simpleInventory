<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Lister Stats</title>
  <style>
    :root{--primary:#0a9c6c;--bg:#f7f7f8;--card:#fff;--border:#e0e0e0;--ink:#0f172a;--muted:#64748b;--grid:#eef0f3;--amber:#b7791f;--amber-bg:#fff6e0;--radius:10px;--ebay:#e53238;--amazon:#f59e0b;}
    *{box-sizing:border-box;}
    body{font-family:'Segoe UI',Arial,sans-serif;background:var(--bg);margin:0;padding:16px;color:var(--ink);}
    .top{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:10px;margin-bottom:14px;}
    .back-btn{display:inline-flex;align-items:center;gap:6px;text-decoration:none;color:var(--muted);font-size:0.9rem;font-weight:600;padding:6px 10px;border-radius:var(--radius);border:1px solid var(--border);background:var(--card);}
    .top .back-btn{justify-self:start;} .top .right{justify-self:end;}
    h1{margin:0;font-size:1.3rem;text-align:center;}
    h2{font-size:1rem;margin:0 0 10px;}
    .filters{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:14px;}
    .seg{display:inline-flex;border:1px solid var(--border);border-radius:var(--radius);overflow:hidden;background:var(--card);}
    .seg button{border:none;background:transparent;padding:7px 12px;font-weight:600;font-size:0.85rem;font-family:inherit;color:var(--muted);cursor:pointer;}
    .seg button.on{background:var(--primary);color:#fff;}
    select{padding:7px 10px;border:1px solid var(--border);border-radius:var(--radius);font-size:0.88rem;font-family:inherit;background:var(--card);color:var(--ink);}
    .muted{color:var(--muted);font-size:0.85rem;}
    .tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-bottom:14px;}
    .tile{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:12px 14px;}
    .tile .label{font-size:0.78rem;color:var(--muted);font-weight:600;text-transform:uppercase;letter-spacing:.03em;}
    .tile .big{font-size:2rem;font-weight:700;line-height:1.15;margin:4px 0 2px;font-variant-numeric:tabular-nums;}
    .tile.hero{border-color:var(--primary);box-shadow:inset 3px 0 0 var(--primary);}
    .split{display:flex;gap:10px;flex-wrap:wrap;font-size:0.85rem;color:var(--muted);}
    .dot{display:inline-block;width:9px;height:9px;border-radius:2px;margin-right:4px;vertical-align:0;}
    .dot.ebay{background:var(--ebay);} .dot.amazon{background:var(--amazon);}
    .card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:12px 14px;margin-bottom:14px;}
    .card-head{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:6px;}
    .card-head h2{margin:0;}
    .legend{display:flex;gap:14px;font-size:0.82rem;color:var(--muted);}
    .chart-wrap{position:relative;}
    svg{display:block;width:100%;height:auto;overflow:visible;}
    .axis{fill:var(--muted);font-size:11px;}
    .gridline{stroke:var(--grid);stroke-width:1;}
    .hit{fill:transparent;cursor:pointer;}
    .hit:hover,.hit.sel{fill:rgba(15,23,42,.05);}
    .tip{position:absolute;pointer-events:none;background:var(--ink);color:#fff;border-radius:8px;padding:7px 10px;font-size:0.8rem;white-space:nowrap;transform:translate(-50%,-100%);display:none;z-index:2;line-height:1.45;}
    table{width:100%;border-collapse:collapse;font-size:0.86rem;}
    th,td{text-align:left;padding:6px 6px;border-top:1px solid var(--grid);vertical-align:top;}
    th{color:var(--muted);font-weight:600;border-top:none;}
    td.n,th.n{text-align:right;font-variant-numeric:tabular-nums;}
    .badge{display:inline-block;font-size:11px;font-weight:700;padding:2px 8px;border-radius:6px;color:#fff;}
    .badge.ebay{background:var(--ebay);} .badge.amazon{background:var(--amazon);color:#111;}
    code{background:#f1f5f9;padding:1px 6px;border-radius:5px;font-size:0.82rem;}
    .suffix{background:var(--amber-bg);color:var(--amber);padding:1px 6px;border-radius:5px;font-weight:700;font-size:0.82rem;}
    .sold{color:var(--primary);font-weight:700;}
    .chip{display:inline-flex;align-items:center;gap:6px;font-size:0.8rem;background:#eef6f2;color:var(--primary);border-radius:999px;padding:3px 10px;font-weight:600;}
    .chip button{border:none;background:none;color:inherit;cursor:pointer;font-weight:700;padding:0;}
    .empty{text-align:center;color:var(--muted);padding:24px;}
    .cols{display:grid;grid-template-columns:1fr 1fr;gap:14px;}
    .cols .card{margin-bottom:0;}
    .scroll{overflow-x:auto;}
    @media (max-width:760px){.cols{grid-template-columns:1fr;}.top{grid-template-columns:auto 1fr;}.top h1{text-align:left;}.top .right{display:none;}}
  </style>
</head>
<body>
  <div class="top">
    <a class="back-btn" href="/tools">&larr; Tools</a>
    <h1>Lister Stats</h1>
    <a class="back-btn right" href="/lister-ledger">Ledger &rarr;</a>
  </div>
  <div class="filters">
    <div class="seg" id="range">
      <button type="button" data-days="7">7 days</button>
      <button type="button" data-days="30">30 days</button>
      <button type="button" data-days="90">90 days</button>
      <button type="button" data-days="365">Year</button>
    </div>
    <select id="actor"><option value="">Everyone</option></select>
    <span class="muted" id="status"></span>
  </div>

  <div class="tiles" id="tiles"></div>

  <div class="card">
    <div class="card-head">
      <h2 id="chartTitle">Listed per day</h2>
      <div class="legend"><span><span class="dot ebay"></span>eBay</span><span><span class="dot amazon"></span>Amazon</span></div>
    </div>
    <div class="chart-wrap" id="chartWrap"><div class="tip" id="tip"></div><div id="chart"></div></div>
    <div class="muted" id="chartNote"></div>
  </div>

  <div class="cols">
    <div class="card">
      <h2>By person</h2>
      <div class="scroll" id="people"></div>
    </div>
    <div class="card">
      <h2>Side panel helpers</h2>
      <div id="helpers"></div>
    </div>
  </div>

  <div class="card" style="margin-top:14px">
    <div class="card-head">
      <h2 id="listTitle">What was listed</h2>
      <span id="dayChip"></span>
    </div>
    <div class="scroll" id="listings"></div>
  </div>

  <script>
    const esc = v => String(v ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
    const money = v => '$' + Number(v || 0).toLocaleString(undefined, {minimumFractionDigits: 2, maximumFractionDigits: 2});
    const plural = (n, word) => n + ' ' + word + (n === 1 ? '' : 's');
    const store = p => p === 'amazon' ? 'Amazon' : 'eBay';
    const params = new URLSearchParams(location.search);
    const state = {days: Number(params.get('days')) || 30, actor: params.get('actor') || '', day: params.get('day') || '', data: null};

    function dayLabel(iso, long){
      const d = new Date(iso + 'T12:00:00');
      return d.toLocaleDateString(undefined, long ? {weekday: 'short', month: 'short', day: 'numeric'} : {month: 'short', day: 'numeric'});
    }
    function timeLabel(stamp){
      if(!stamp) return '';
      const d = new Date(String(stamp).replace(' ', 'T'));
      return isNaN(d) ? stamp : d.toLocaleTimeString(undefined, {hour: 'numeric', minute: '2-digit'});
    }
    function syncUrl(){
      const q = new URLSearchParams();
      if(state.days !== 30) q.set('days', state.days);
      if(state.actor) q.set('actor', state.actor);
      if(state.day) q.set('day', state.day);
      history.replaceState(null, '', location.pathname + (q.toString() ? '?' + q : ''));
    }

    async function load(){
      document.getElementById('status').textContent = 'Loading…';
      document.querySelectorAll('#range button').forEach(b => b.classList.toggle('on', Number(b.dataset.days) === state.days));
      const res = await fetch('/api/lister/stats?days=' + state.days + '&actor=' + encodeURIComponent(state.actor), {cache: 'no-store'}).catch(() => null);
      const data = res ? await res.json().catch(() => ({})) : {};
      if(!data.success){
        document.getElementById('status').textContent = data.error || 'Could not load the stats';
        return;
      }
      state.data = data;
      if(state.day && !data.series.some(d => d.date === state.day)) state.day = '';
      document.getElementById('status').textContent = 'Updated ' + new Date().toLocaleTimeString(undefined, {hour: 'numeric', minute: '2-digit'});
      const sel = document.getElementById('actor');
      sel.innerHTML = '<option value="">Everyone</option>' + data.people.map(p => '<option' + (p === state.actor ? ' selected' : '') + '>' + esc(p) + '</option>').join('');
      syncUrl();
      render();
    }

    function render(){
      const d = state.data, t = d.totals;
      const rangeName = d.days === 365 ? 'year' : d.days + ' days';
      const split = b => '<div class="split"><span><span class="dot ebay"></span>eBay ' + b.ebay + '</span><span><span class="dot amazon"></span>Amazon ' + b.amazon + '</span></div>';
      const pace = d.pace.avg_minutes != null ? 'one every ' + d.pace.avg_minutes + ' min' : '';
      const span = d.pace.first_at ? timeLabel(d.pace.first_at) + (d.pace.last_at !== d.pace.first_at ? '–' + timeLabel(d.pace.last_at) : '') : '';
      document.getElementById('tiles').innerHTML = [
        '<div class="tile hero"><div class="label">Listed today</div><div class="big">' + t.today.listed + '</div>' + split(t.today)
          + '<div class="muted">' + [span, pace].filter(Boolean).map(esc).join(' · ') + (t.today.skipped ? (span ? ' · ' : '') + plural(t.today.skipped, 'skip') : '') + '</div></div>',
        '<div class="tile"><div class="label">Last 7 days</div><div class="big">' + t.week.listed + '</div>' + split(t.week) + '<div class="muted">' + plural(t.week.worked, 'item') + ' worked on</div></div>',
        '<div class="tile"><div class="label">Last ' + esc(rangeName) + '</div><div class="big">' + t.range.listed + '</div>' + split(t.range)
          + '<div class="muted">' + (d.avg_per_active_day ? d.avg_per_active_day + ' per listing day' : 'no listings yet') + (d.best_day ? ' · best ' + dayLabel(d.best_day.date) + ' (' + d.best_day.listed + ')' : '') + '</div></div>',
        '<div class="tile"><div class="label">Listed value</div><div class="big">' + money(t.range.value) + '</div><div class="muted">price × quantity, last ' + esc(rangeName) + '</div></div>',
        '<div class="tile"><div class="label">Sold from these</div><div class="big">' + d.sold.orders + '</div><div class="muted">' + plural(d.sold.listings, 'listing') + ' · ' + money(d.sold.revenue) + '</div></div>',
        '<div class="tile"><div class="label">Still in queue</div><div class="big">' + d.queue_waiting + '</div><div class="muted">' + plural(t.range.skipped, 'skip') + ' in range · all-time listed ' + t.all.listed + '</div></div>',
      ].join('');
      renderChart();
      renderPeople();
      renderHelpers();
      renderListings();
    }

    function niceMax(v){
      if(v <= 4) return 4;
      const step = Math.pow(10, Math.floor(Math.log10(v)));
      for(const m of [1, 2, 2.5, 5, 10]) if(m * step >= v) return m * step;
      return 10 * step;
    }

    function renderChart(){
      const d = state.data, series = d.series;
      const W = 900, H = 220, L = 30, R = 6, T = 10, B = 24;
      const max = niceMax(Math.max(...series.map(s => s.listed), 0));
      const slot = (W - L - R) / series.length;
      const bw = Math.max(2, Math.min(28, slot * 0.7));
      const y = v => T + (H - T - B) * (1 - v / max);
      const ticks = [0, max / 2, max];
      let svg = '<svg viewBox="0 0 ' + W + ' ' + H + '" role="img" aria-label="Listings per day">';
      ticks.forEach(v => { svg += '<line class="gridline" x1="' + L + '" x2="' + (W - R) + '" y1="' + y(v) + '" y2="' + y(v) + '"/><text class="axis" x="' + (L - 6) + '" y="' + (y(v) + 4) + '" text-anchor="end">' + v + '</text>'; });
      const every = Math.ceil(series.length / 10);
      const base = y(0);
      series.forEach((s, i) => {
        const cx = L + slot * i + slot / 2, x = cx - bw / 2;
        // Bars grow up from the baseline: eBay below, Amazon on top, 2px surface gap between segments.
        let top = base;
        [['ebay', 'var(--ebay)'], ['amazon', 'var(--amazon)']].forEach(([key, color]) => {
          if(!s[key]) return;
          const h = base - y(s[key]);
          const yTop = top - h;
          const gap = top === base ? 0 : 2;
          const rh = Math.max(1, h - gap);
          const r = Math.min(4, bw / 2, rh);
          const isTop = key === 'amazon' || !s.amazon;
          svg += isTop
            ? '<path fill="' + color + '" d="M' + x + ' ' + (yTop + rh) + 'V' + (yTop + r) + 'Q' + x + ' ' + yTop + ' ' + (x + r) + ' ' + yTop + 'H' + (x + bw - r) + 'Q' + (x + bw) + ' ' + yTop + ' ' + (x + bw) + ' ' + (yTop + r) + 'V' + (yTop + rh) + 'Z"/>'
            : '<rect fill="' + color + '" x="' + x + '" y="' + yTop + '" width="' + bw + '" height="' + rh + '"/>';
          top = yTop;
        });
        if(i % every === 0 || i === series.length - 1 && series.length <= 10){
          svg += '<text class="axis" x="' + cx + '" y="' + (H - 6) + '" text-anchor="middle">' + esc(dayLabel(s.date)) + '</text>';
        }
        svg += '<rect class="hit' + (s.date === state.day ? ' sel' : '') + '" data-i="' + i + '" x="' + (L + slot * i) + '" y="' + T + '" width="' + slot + '" height="' + (H - T - B) + '"/>';
      });
      svg += '</svg>';
      document.getElementById('chart').innerHTML = svg;
      document.getElementById('chartTitle').textContent = 'Listed per day' + (state.actor ? ' · ' + state.actor : '');
      document.getElementById('chartNote').textContent = d.totals.range.listed ? 'Click a day to see what was listed.' : 'Nothing listed through the side panel in this range yet.';
      const tip = document.getElementById('tip'), wrap = document.getElementById('chartWrap');
      document.querySelectorAll('#chart .hit').forEach(el => {
        const s = series[Number(el.dataset.i)];
        el.addEventListener('mousemove', e => {
          const box = wrap.getBoundingClientRect();
          tip.innerHTML = '<b>' + esc(dayLabel(s.date, true)) + '</b><br>' + plural(s.listed, 'listing')
            + (s.listed ? ' (eBay ' + s.ebay + ' · Amazon ' + s.amazon + ')<br>' + money(s.value) : '')
            + (s.skipped ? '<br>' + plural(s.skipped, 'skip') : '') + (s.worked ? '<br>' + plural(s.worked, 'item') + ' worked on' : '')
            + (s.ai ? '<br>' + s.ai + ' AI assists' : '');
          tip.style.display = 'block';
          tip.style.left = Math.min(Math.max(e.clientX - box.left, 90), box.width - 90) + 'px';
          tip.style.top = (e.clientY - box.top - 10) + 'px';
        });
        el.addEventListener('mouseleave', () => { tip.style.display = 'none'; });
        el.addEventListener('click', () => { state.day = state.day === s.date ? '' : s.date; syncUrl(); renderChart(); renderListings(); });
      });
    }

    function renderPeople(){
      const users = state.data.users;
      const el = document.getElementById('people');
      if(!users.length){ el.innerHTML = '<div class="empty">No side panel activity in this range.</div>'; return; }
      el.innerHTML = '<table><tr><th>Who</th><th class="n">Today</th><th class="n">Listed</th><th class="n">eBay</th><th class="n">Amazon</th><th class="n">Skipped</th><th class="n">Worked on</th><th class="n">Value</th></tr>'
        + users.map(u => '<tr><td>' + (u.actor ? esc(u.actor) : '<span class="muted">not signed in</span>') + (u.last_at ? '<div class="muted">last ' + esc(dayLabel(u.last_at.slice(0, 10))) + ' ' + esc(timeLabel(u.last_at)) + '</div>' : '') + '</td>'
          + '<td class="n">' + u.today + '</td><td class="n"><b>' + u.listed + '</b></td><td class="n">' + u.ebay + '</td><td class="n">' + u.amazon + '</td><td class="n">' + u.skipped + '</td><td class="n">' + u.worked + '</td><td class="n">' + money(u.value) + '</td></tr>').join('')
        + '</table>';
    }

    function renderHelpers(){
      const d = state.data, ai = d.ai, s = d.suggestions;
      const rate = s.asked ? Math.round(100 * s.agreed / s.asked) + '%' : '—';
      const rows = [
        ['AI titles written', ai.title], ['AI descriptions written', ai.description], ['AI photoshopped photos', ai.photo],
        ['AI cost', '$' + Number(ai.cost || 0).toFixed(2)],
        ['eBay category / match picks', s.asked ? s.asked + ' · panel was right ' + rate : '—'],
      ];
      document.getElementById('helpers').innerHTML = '<table>' + rows.map(r => '<tr><td>' + esc(r[0]) + '</td><td class="n"><b>' + esc(r[1]) + '</b></td></tr>').join('') + '</table>'
        + (state.actor ? '<div class="muted" style="margin-top:6px">AI counts are for everyone (the usage log has no person).</div>' : '');
    }

    function renderListings(){
      const d = state.data;
      const rows = state.day ? d.listings.filter(l => l.date === state.day) : d.listings;
      document.getElementById('listTitle').textContent = state.day ? 'Listed on ' + dayLabel(state.day, true) : 'What was listed';
      document.getElementById('dayChip').innerHTML = state.day ? '<span class="chip">' + plural(rows.length, 'listing') + ' · ' + money(rows.reduce((a, l) => a + (l.price || 0) * (l.quantity || 1), 0)) + ' <button type="button" id="clearDay" aria-label="Show all days">×</button></span>'
        : '<span class="muted">' + plural(rows.length, 'listing') + ' in range</span>';
      const clear = document.getElementById('clearDay');
      if(clear) clear.onclick = () => { state.day = ''; syncUrl(); renderChart(); renderListings(); };
      const el = document.getElementById('listings');
      if(!rows.length){ el.innerHTML = '<div class="empty">' + (state.day ? 'Nothing listed that day.' : 'Nothing listed through the side panel in this range yet. Listings recorded by the panel show up here.') + '</div>'; return; }
      let lastDate = '';
      el.innerHTML = '<table><tr><th>When</th><th>Store</th><th>Item</th><th class="n">Price</th><th class="n">Qty</th><th>By</th><th>Sold</th></tr>'
        + rows.map(l => {
          const upc = String(l.upc || '');
          const upcHtml = upc.includes('-') ? '<span class="suffix">' + esc(upc) + '</span>' : '<code>' + esc(upc) + '</code>';
          const when = (state.day || l.date === lastDate ? '' : esc(dayLabel(l.date)) + ' ') + esc(timeLabel(l.at));
          lastDate = l.date;
          return '<tr><td style="white-space:nowrap">' + when + '</td><td><span class="badge ' + esc(l.platform) + '">' + store(l.platform) + '</span></td>'
            + '<td>' + (l.url ? '<a href="' + esc(l.url) + '" target="_blank" rel="noopener">' + esc(l.title || '(no title)') + '</a>' : esc(l.title || '(no title)'))
            + '<div class="muted">UPC ' + upcHtml + (l.key ? ' · ' + esc(l.key) : '') + '</div></td>'
            + '<td class="n">' + (l.price != null ? money(l.price) : '') + '</td><td class="n">' + esc(l.quantity) + '</td>'
            + '<td>' + (l.actor ? esc(l.actor) : '<span class="muted">—</span>') + '</td>'
            + '<td>' + (l.sold ? '<a class="sold" href="/lister-ledger?upc=' + encodeURIComponent(upc) + '">' + plural(l.sold, 'order') + '</a>' : '<span class="muted">not yet</span>') + '</td></tr>';
        }).join('') + '</table>';
    }

    document.querySelectorAll('#range button').forEach(b => b.onclick = () => { state.days = Number(b.dataset.days); load(); });
    document.getElementById('actor').onchange = e => { state.actor = e.target.value; load(); };
    load();
    setInterval(() => { if(!document.hidden) load(); }, 60000);
  </script>
</body>
</html>
