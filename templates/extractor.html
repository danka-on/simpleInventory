<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>BOL Extractor</title>
    <style>
        body{font-family:Arial,sans-serif;max-width:1200px;margin:20px auto;padding:0 20px}
        .top{display:flex;align-items:center;gap:10px;margin-bottom:20px}
        .btn-back{padding:8px 14px;background:#e74c3c;color:#fff;border:none;border-radius:6px;cursor:pointer;text-decoration:none;display:inline-block}
        .btn-back:hover{background:#c0392b}
        h2{color:#333;margin:0}
        .form-group{margin-bottom:15px}
        label{display:inline-block;width:120px;font-weight:600}
        input[type="file"],input[type="text"],input[type="date"]{padding:8px;border:1px solid #ccc;border-radius:4px;width:300px}
        button{padding:10px 20px;background:#007bff;color:#fff;border:none;border-radius:4px;cursor:pointer;font-size:14px}
        button:hover{background:#0056b3}
        .message{margin-top:15px;padding:10px;border-radius:4px}
        .message.success{background:#d4edda;color:#155724;border:1px solid #c3e6cb}
        .message.error{background:#f8d7da;color:#721c24;border:1px solid #f5c6cb}
        .section{margin-top:30px;padding:20px;border:1px solid #ddd;border-radius:8px;background:#f9f9f9}
        .section h3{margin-top:0}
        table{width:100%;border-collapse:collapse;margin-top:10px}
        th,td{padding:8px;text-align:left;border-bottom:1px solid #ddd}
        th{background:#007bff;color:#fff}
    </style>
</head>
<body>
    <div class="top">
        <a href="/" class="btn-back">Back</a>
        <h2>BOL Excel Extractor</h2>
    </div>
    <form id="extractor-form" enctype="multipart/form-data">
        <div class="form-group">
            <label for="excel-file">Upload Excel File:</label>
            <input type="file" id="excel-file" name="excel_file" accept=".xls,.xlsx" required>
        </div>
        <div class="form-group">
            <label for="import-date">Date of Purchase:</label>
            <input type="date" id="import-date" name="import_date" required>
        </div>
        <button type="submit">Upload & Sync to BOL</button>
    </form>
    <div id="message"></div>

    <div class="section">
        <h3>Database Statistics</h3>
        <div id="stats-display">Loading...</div>
    </div>

    <div class="section">
        <h3>Upload History</h3>
        <div id="upload-logs">Loading...</div>
    </div>

    <script>
        // Set today's date as default
        document.getElementById('import-date').valueAsDate = new Date();

        // Load upload logs and stats on page load
        loadUploadLogs();
        loadStats();
        
        // Store global total cost for stats display
        let globalTotalCost = 0;

        // Form submission
        document.getElementById('extractor-form').addEventListener('submit', async function(e) {
            e.preventDefault();
            const formData = new FormData(this);
            const msgEl = document.getElementById('message');
            msgEl.innerHTML = '<div class="message">Uploading and syncing...</div>';
            
            try {
                const response = await fetch('/api/rawbol/upload', {
                    method: 'POST',
                    body: formData
                });
                const data = await response.json();
                
                if (data.success) {
                    let msg = `Upload successful! ${data.inserted} rows imported.`;
                    
                    // Show extracted header data
                    if (data.extracted_lot_number) {
                        msg += `<br><strong>Extracted LOT #:</strong> ${data.extracted_lot_number}`;
                    }
                    if (data.bol_location) {
                        msg += `<br><strong>Location:</strong> ${data.bol_location}`;
                    }
                    if (data.total_client_cost !== undefined && data.total_client_cost !== null) {
                        const formattedCost = '$' + parseFloat(data.total_client_cost).toLocaleString('en-US', {minimumFractionDigits: 2, maximumFractionDigits: 2});
                        msg += `<br><strong>Total Client Cost:</strong> ${formattedCost}`;
                    }
                    if (data.avg_cost !== undefined && data.avg_cost !== null) {
                        const formattedAvgCost = '$' + parseFloat(data.avg_cost).toLocaleString('en-US', {minimumFractionDigits: 2, maximumFractionDigits: 2});
                        msg += `<br><strong>Average Cost per Item:</strong> ${formattedAvgCost}`;
                    }
                    
                    if (data.synced) {
                        msg += `<br>Auto-synced to BOL.DB: ${data.sync_updated} updated, ${data.sync_inserted} inserted.`;
                    } else if (data.sync_error) {
                        msg += `<br>WARNING: Sync failed - ${data.sync_error}`;
                    }
                    msgEl.innerHTML = `<div class="message success">${msg}</div>`;
                    
                    // Add undo button
                    const undoBtn = document.createElement('button');
                    undoBtn.textContent = 'Undo Last Upload';
                    undoBtn.style.cssText = 'margin-left:10px;padding:8px 16px;background:#dc3545;color:#fff;border:none;border-radius:4px;cursor:pointer;';
                    undoBtn.onclick = () => undoLastUpload(data.lot_number);
                    
                    const messageDiv = msgEl.querySelector('.message');
                    messageDiv.appendChild(undoBtn);
                    
                    // Auto-hide undo button after 10 seconds
                    setTimeout(() => {
                        if (undoBtn.parentNode) {
                            undoBtn.remove();
                        }
                    }, 10000);
                    
                    document.getElementById('extractor-form').reset();
                    document.getElementById('import-date').valueAsDate = new Date();
                    loadUploadLogs();
                    loadStats();
                } else {
                    // Check if it's a duplicate error
                    if (data.duplicate) {
                        msgEl.innerHTML = `<div class="message error"><strong>Duplicate Upload Detected!</strong><br>${data.error}</div>`;
                    } else {
                        msgEl.innerHTML = `<div class="message error">Error: ${data.error}</div>`;
                    }
                }
            } catch (err) {
                msgEl.innerHTML = `<div class="message error">Error: ${err}</div>`;
            }
        });

        async function loadUploadLogs() {
            try {
                const response = await fetch('/api/rawbol/logs?_=' + Date.now());
                const data = await response.json();
                const logsEl = document.getElementById('upload-logs');
                
                console.log('API Response:', data); // Debug logging
                
                if (data.success && data.logs && data.logs.length > 0) {
                    let html = '<table><tr><th>Location</th><th>Filename</th><th>LOT #</th><th>Items</th><th>Cost</th><th>Date</th><th>Uploaded At</th></tr>';
                    let totalCostSum = 0;
                    let totalItemsSum = 0;
                    
                    data.logs.forEach(log => {
                        // Convert to EST (UTC - 4 hours for EDT, UTC - 5 hours for EST)
                        const uploadedDate = new Date(log.uploaded_at);
                        const uploadedAt = uploadedDate.toLocaleString('en-US', { timeZone: 'America/New_York' });
                        let totalQty = 0;
                        if (log.total_quantity !== undefined && log.total_quantity !== null) {
                            totalQty = parseInt(log.total_quantity) || 0;
                        } else if (log.rows_imported !== undefined && log.rows_imported !== null) {
                            totalQty = parseInt(log.rows_imported) || 0;
                        }
                        totalItemsSum += totalQty;
                        
                        // Format total_client_cost
                        let totalCost = '—';
                        if (log.total_client_cost !== undefined && log.total_client_cost !== null) {
                            const costValue = parseFloat(log.total_client_cost);
                            totalCostSum += costValue;
                            totalCost = '$' + costValue.toLocaleString('en-US', {minimumFractionDigits: 2, maximumFractionDigits: 2});
                        }
                        // Show lot_number (which now contains the extracted LOT #)
                        const lotNumber = log.lot_number || '—';
                        const bolLocation = log.bol_location || '—';
                        console.log('Log data:', log, 'totalQty:', totalQty); // Debug logging
                        html += `<tr>
                            <td>${bolLocation}</td>
                            <td>${log.filename}</td>
                            <td>${lotNumber}</td>
                            <td>${totalQty}</td>
                            <td>${totalCost}</td>
                            <td>${log.import_date}</td>
                            <td>${uploadedAt}</td>
                        </tr>`;
                    });
                    
                    // Add summary row
                    const formattedTotal = '$' + totalCostSum.toLocaleString('en-US', {minimumFractionDigits: 2, maximumFractionDigits: 2});
                    html += `<tr style="background:#e8f4f8;font-weight:bold;border-top:2px solid #007bff">
                        <td colspan="3" style="text-align:right">TOTAL:</td>
                        <td>${totalItemsSum.toLocaleString()}</td>
                        <td>${formattedTotal}</td>
                        <td colspan="2"></td>
                    </tr>`;
                    
                    html += '</table>';
                    logsEl.innerHTML = html;
                    
                    // Update global total cost and refresh stats
                    globalTotalCost = totalCostSum;
                    loadStats();
                } else {
                    logsEl.innerHTML = '<p>No uploads yet.</p>';
                    globalTotalCost = 0;
                    loadStats();
                }
            } catch (err) {
                console.error('Error loading logs:', err); // Debug logging
                document.getElementById('upload-logs').innerHTML = `<p>Error loading logs: ${err}</p>`;
            }
        }

        async function loadStats() {
            try {
                const response = await fetch('/api/rawbol/stats?_=' + Date.now());
                const data = await response.json();
                const statsEl = document.getElementById('stats-display');
                
                if (data.success) {
                    // Use the global total cost from upload history instead of API value
                    const totalCost = '$' + globalTotalCost.toLocaleString('en-US', {minimumFractionDigits: 2, maximumFractionDigits: 2});
                    
                    statsEl.innerHTML = `
                        <p><strong>Total Unique Items:</strong> ${data.unique_items.toLocaleString()}</p>
                        <p><strong>Total Quantity:</strong> ${data.total_quantity.toLocaleString()}</p>
                        <p><strong>Total Cost:</strong> ${totalCost}</p>
                    `;
                } else {
                    statsEl.innerHTML = `<p>Error loading stats: ${data.error}</p>`;
                }
            } catch (err) {
                document.getElementById('stats-display').innerHTML = `<p>Error loading stats: ${err}</p>`;
            }
        }

        async function undoLastUpload(lotNumber) {
            if (!confirm(`Are you sure you want to delete lot ${lotNumber}? This will remove all items from this BOL upload and desync from the main BOL database.`)) {
                return;
            }
            
            const msgEl = document.getElementById('message');
            const originalContent = msgEl.innerHTML;
            msgEl.innerHTML = '<div class="message">Deleting lot...</div>';
            
            try {
                const response = await fetch(`/api/rawbol/delete/${lotNumber}`, {
                    method: 'DELETE'
                });
                const data = await response.json();
                
                if (data.success) {
                    msgEl.innerHTML = `<div class="message success">Lot ${lotNumber} deleted successfully! ${data.deleted_items} items removed from rawbol.db and desynced from bol.db.</div>`;
                    loadUploadLogs();
                    loadStats();
                } else {
                    msgEl.innerHTML = `<div class="message error">Error deleting lot: ${data.error}</div>`;
                }
            } catch (err) {
                msgEl.innerHTML = `<div class="message error">Error: ${err}</div>`;
            }
        }

        async function deleteLot(lotNumber) {
            // Function removed - X button no longer available
            alert('Delete functionality has been disabled.');
        }
    </script>
</body>
</html>
</body>
</html>
