<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>BOL Extractor</title>
    <style>
        body{font-family:Arial,sans-serif;max-width:1200px;margin:20px auto;padding:0 20px}
        .top{display:flex;align-items:center;gap:10px;margin-bottom:20px}
        .btn-back{padding:8px 14px;background:#e74c3c;color:#fff;border:none;border-radius:6px;cursor:pointer;text-decoration:none;display:inline-block}
        .btn-back:hover{background:#c0392b}
        h2{color:#333;margin:0}
        .form-group{margin-bottom:15px}
        label{display:inline-block;width:120px;font-weight:600}
        input[type="file"],input[type="text"],input[type="date"],input[type="number"]{padding:8px;border:1px solid #ccc;border-radius:4px;width:300px}
        input[type="file"]::file-selector-button{margin-right:10px;padding:6px 10px;border:1px solid #cbd5e1;border-radius:4px;background:#f1f5f9;cursor:pointer}
        input[type="file"]::file-selector-button:hover{background:#e2e8f0}
        button{padding:10px 20px;background:#007bff;color:#fff;border:none;border-radius:4px;cursor:pointer;font-size:14px}
        button:hover{background:#0056b3}
        .message{margin-top:15px;padding:10px;border-radius:4px}
        .message.success{background:#d4edda;color:#155724;border:1px solid #c3e6cb}
        .message.error{background:#f8d7da;color:#721c24;border:1px solid #f5c6cb}
        .section{margin-top:30px;padding:20px;border:1px solid #ddd;border-radius:8px;background:#f9f9f9}
        .section h3{margin-top:0}
        table{width:100%;border-collapse:collapse;margin-top:10px}
        th,td{padding:8px;text-align:left;border-bottom:1px solid #ddd}
        th{background:#007bff;color:#fff}
        .edit-icon{cursor:pointer;color:#007bff;font-size:16px;margin-left:8px}
        .edit-icon:hover{color:#0056b3}
        .modal{display:none;position:fixed;z-index:1000;left:0;top:0;width:100%;height:100%;background:rgba(0,0,0,0.5)}
        .modal-content{background:#fff;margin:10% auto;padding:20px;border-radius:8px;width:90%;max-width:500px}
        .modal-content h3{margin-top:0}
        .modal-content .form-group{margin-bottom:15px}
        .modal-content label{display:block;margin-bottom:5px;font-weight:600}
        .modal-content input{width:100%;padding:8px;border:1px solid #ccc;border-radius:4px;box-sizing:border-box}
        .modal-content .btn-group{display:flex;gap:10px;margin-top:20px}
        .modal-content button{flex:1}
        .btn-cancel{background:#6c757d}
        .btn-cancel:hover{background:#5a6268}
        .row-needs-items{background:#fff3cd}
        .summary-row{background:#e8f4f8;font-weight:bold;border-top:2px solid #007bff}
        .summary-label{text-align:right}

        html.ss-theme-night body{background:#0f172a;color:#e2e8f0}
        html.ss-theme-night h2{color:#f8fafc}
        html.ss-theme-night label{color:#e2e8f0}
        html.ss-theme-night input[type="file"],html.ss-theme-night input[type="text"],html.ss-theme-night input[type="date"],html.ss-theme-night input[type="number"]{background:#0f172a;color:#e2e8f0;border-color:rgba(255,255,255,0.12)}
        html.ss-theme-night input[type="file"]::file-selector-button{background:#1f2937;color:#e2e8f0;border-color:rgba(255,255,255,0.15)}
        html.ss-theme-night input[type="file"]::file-selector-button:hover{background:#334155}
        html.ss-theme-night input::placeholder{color:#94a3b8}
        html.ss-theme-night .section{background:#1e293b;border-color:rgba(255,255,255,0.1)}
        html.ss-theme-night .section h3{color:#e2e8f0}
        html.ss-theme-night .message{background:#1e293b;color:#e2e8f0;border:1px solid rgba(255,255,255,0.12)}
        html.ss-theme-night .message.success{background:rgba(16,185,129,0.15);color:#6ee7b7;border-color:rgba(16,185,129,0.35)}
        html.ss-theme-night .message.error{background:rgba(239,68,68,0.15);color:#fca5a5;border-color:rgba(239,68,68,0.35)}
        html.ss-theme-night table{color:#e2e8f0}
        html.ss-theme-night th{background:#1f2937;color:#e2e8f0;border-bottom-color:rgba(255,255,255,0.08)}
        html.ss-theme-night td{border-bottom-color:rgba(255,255,255,0.08)}
        html.ss-theme-night .edit-icon{color:#93c5fd}
        html.ss-theme-night .edit-icon:hover{color:#bfdbfe}
        html.ss-theme-night .modal{background:rgba(2,6,23,0.75)}
        html.ss-theme-night .modal-content{background:#1e293b;color:#e2e8f0;border:1px solid rgba(255,255,255,0.12)}
        html.ss-theme-night .modal-content label{color:#e2e8f0}
        html.ss-theme-night .modal-content input{background:#0f172a;color:#e2e8f0;border-color:rgba(255,255,255,0.12)}
        html.ss-theme-night .btn-cancel{background:#475569}
        html.ss-theme-night .btn-cancel:hover{background:#64748b}
        html.ss-theme-night .row-needs-items{background:rgba(245,158,11,0.2)}
        html.ss-theme-night .summary-row{background:rgba(56,189,248,0.12);border-top-color:#38bdf8}
    </style>
</head>
<body>
    <div class="top">
        <a href="/" class="btn-back">Back</a>
        <h2>BOL Excel Extractor</h2>
    </div>
    <form id="extractor-form" enctype="multipart/form-data">
        <div class="form-group">
            <label for="excel-file">Upload Excel File:</label>
            <input type="file" id="excel-file" name="excel_file" accept=".xls,.xlsx" required>
        </div>
        <div class="form-group">
            <label for="import-date">Date of Purchase:</label>
            <input type="date" id="import-date" name="import_date" required>
        </div>
        <div class="form-group">
            <label for="shipping-cost">Shipping Cost ($):</label>
            <input type="number" id="shipping-cost" name="shipping_cost" step="0.01" min="0" placeholder="0.00">
        </div>
        <button type="submit">Upload & Sync to BOL</button>
    </form>
    <div id="message"></div>

    <div class="section">
        <h3>Database Statistics</h3>
        <div id="stats-display">Loading...</div>
    </div>

    <div class="section">
        <h3>Upload History</h3>
        <div id="upload-logs">Loading...</div>
    </div>

    <script>
        // Set today's date as default
        document.getElementById('import-date').valueAsDate = new Date();

        // Load upload logs and stats on page load
        loadUploadLogs();
        loadStats();
        
        // Store global total cost for stats display
        let globalTotalCost = 0;

        // Form submission
        document.getElementById('extractor-form').addEventListener('submit', async function(e) {
            e.preventDefault();
            const formData = new FormData(this);
            const msgEl = document.getElementById('message');
            msgEl.innerHTML = '<div class="message">Uploading and syncing...</div>';
            
            try {
                const response = await fetch('/api/rawbol/upload', {
                    method: 'POST',
                    body: formData
                });
                const data = await response.json();
                
                if (data.success) {
                    let msg = `Upload successful! ${data.inserted} rows imported.`;
                    
                    // Show extracted header data
                    if (data.extracted_lot_number) {
                        msg += `<br><strong>Extracted LOT #:</strong> ${data.extracted_lot_number}`;
                    }
                    if (data.bol_location) {
                        msg += `<br><strong>Location:</strong> ${data.bol_location}`;
                    }
                    if (data.total_client_cost !== undefined && data.total_client_cost !== null) {
                        const formattedCost = '$' + parseFloat(data.total_client_cost).toLocaleString('en-US', {minimumFractionDigits: 2, maximumFractionDigits: 2});
                        msg += `<br><strong>Total Client Cost:</strong> ${formattedCost}`;
                    }
                    if (data.shipping_cost !== undefined && data.shipping_cost !== null) {
                        const formattedShipping = '$' + parseFloat(data.shipping_cost).toLocaleString('en-US', {minimumFractionDigits: 2, maximumFractionDigits: 2});
                        msg += `<br><strong>Shipping Cost:</strong> ${formattedShipping}`;
                    }
                    if (data.avg_cost !== undefined && data.avg_cost !== null) {
                        const formattedAvgCost = '$' + parseFloat(data.avg_cost).toLocaleString('en-US', {minimumFractionDigits: 2, maximumFractionDigits: 2});
                        msg += `<br><strong>Average Cost per Item:</strong> ${formattedAvgCost}`;
                    }
                    
                    if (data.synced) {
                        msg += `<br>Auto-synced to BOL.DB: ${data.sync_updated} updated, ${data.sync_inserted} inserted.`;
                    } else if (data.sync_error) {
                        msg += `<br>WARNING: Sync failed - ${data.sync_error}`;
                    }
                    msgEl.innerHTML = `<div class="message success">${msg}</div>`;
                    
                    // Add undo button
                    const undoBtn = document.createElement('button');
                    undoBtn.textContent = 'Undo Last Upload';
                    undoBtn.style.cssText = 'margin-left:10px;padding:8px 16px;background:#dc3545;color:#fff;border:none;border-radius:4px;cursor:pointer;';
                    undoBtn.onclick = () => undoLastUpload(data.lot_number);
                    
                    const messageDiv = msgEl.querySelector('.message');
                    messageDiv.appendChild(undoBtn);
                    
                    // Auto-hide undo button after 10 seconds
                    setTimeout(() => {
                        if (undoBtn.parentNode) {
                            undoBtn.remove();
                        }
                    }, 10000);
                    
                    document.getElementById('extractor-form').reset();
                    document.getElementById('import-date').valueAsDate = new Date();
                    loadUploadLogs();
                    loadStats();
                } else {
                    // Check if it's a duplicate error
                    if (data.duplicate) {
                        msgEl.innerHTML = `<div class="message error"><strong>Duplicate Upload Detected!</strong><br>${data.error}</div>`;
                    } else {
                        msgEl.innerHTML = `<div class="message error">Error: ${data.error}</div>`;
                    }
                }
            } catch (err) {
                msgEl.innerHTML = `<div class="message error">Error: ${err}</div>`;
            }
        });

        async function loadUploadLogs() {
            try {
                const response = await fetch('/api/rawbol/logs?_=' + Date.now());
                const data = await response.json();
                const logsEl = document.getElementById('upload-logs');
                
                console.log('API Response:', data); // Debug logging
                
                if (data.success && data.logs && data.logs.length > 0) {
                    let html = '<table><tr><th>Location</th><th>Filename</th><th>LOT #</th><th>Items</th><th>Cost</th><th>Shipping</th><th>Date</th><th>Uploaded At</th><th>Edit</th></tr>';
                    let totalCostSum = 0;
                    let totalShippingSum = 0;
                    let totalItemsSum = 0;
                    
                    data.logs.forEach(log => {
                        // Convert to EST (UTC - 4 hours for EDT, UTC - 5 hours for EST)
                        const uploadedDate = new Date(log.uploaded_at);
                        const uploadedAt = uploadedDate.toLocaleString('en-US', { timeZone: 'America/New_York' });
                        const hasItems = Number(log.has_items || 0) === 1;
                        let totalQty = 0;
                        if (log.total_quantity !== undefined && log.total_quantity !== null) {
                            totalQty = parseInt(log.total_quantity) || 0;
                        } else if (log.rows_imported !== undefined && log.rows_imported !== null) {
                            totalQty = parseInt(log.rows_imported) || 0;
                        }
                        totalItemsSum += totalQty;
                        
                        // Format total_client_cost
                        let totalCost = '—';
                        if (log.total_client_cost !== undefined && log.total_client_cost !== null) {
                            const costValue = parseFloat(log.total_client_cost);
                            totalCostSum += costValue;
                            totalCost = '$' + costValue.toLocaleString('en-US', {minimumFractionDigits: 2, maximumFractionDigits: 2});
                        }
                        
                        // Format shipping_cost
                        let shippingCost = '—';
                        if (log.shipping_cost !== undefined && log.shipping_cost !== null) {
                            const shippingValue = parseFloat(log.shipping_cost);
                            totalShippingSum += shippingValue;
                            shippingCost = '$' + shippingValue.toLocaleString('en-US', {minimumFractionDigits: 2, maximumFractionDigits: 2});
                        }
                        
                        // Show lot_number (which now contains the extracted LOT #)
                        const lotNumber = log.lot_number || '—';
                        const bolLocation = log.bol_location || '—';
                        const shippingForEdit = log.shipping_cost || '';
                        const rowClass = hasItems ? '' : ' class="row-needs-items"';
                        const itemsDisplay = hasItems ? totalQty : `${totalQty} ⚠`;
                        console.log('Log data:', log, 'totalQty:', totalQty); // Debug logging
                        html += `<tr${rowClass}>
                            <td>${bolLocation}</td>
                            <td>${log.filename}</td>
                            <td>${lotNumber}</td>
                            <td>${itemsDisplay}</td>
                            <td>${totalCost}</td>
                            <td>${shippingCost}</td>
                            <td>${log.import_date}</td>
                            <td>${uploadedAt}</td>
                            <td><span class="edit-icon" onclick="openEditModal('${lotNumber}', '${log.import_date}', '${shippingForEdit}')" title="Edit LOT">⚙️</span></td>
                        </tr>`;
                    });
                    
                    // Add summary row
                    const formattedTotal = '$' + totalCostSum.toLocaleString('en-US', {minimumFractionDigits: 2, maximumFractionDigits: 2});
                    const formattedShippingTotal = '$' + totalShippingSum.toLocaleString('en-US', {minimumFractionDigits: 2, maximumFractionDigits: 2});
                    html += `<tr class="summary-row">
                        <td colspan="3" class="summary-label">TOTAL:</td>
                        <td>${totalItemsSum.toLocaleString()}</td>
                        <td>${formattedTotal}</td>
                        <td>${formattedShippingTotal}</td>
                        <td colspan="3"></td>
                    </tr>`;
                    
                    html += '</table>';
                    logsEl.innerHTML = html;
                    
                    // Update global total cost (include shipping) and refresh stats
                    globalTotalCost = totalCostSum + totalShippingSum;
                    loadStats();
                } else {
                    logsEl.innerHTML = '<p>No uploads yet.</p>';
                    globalTotalCost = 0;
                    loadStats();
                }
            } catch (err) {
                console.error('Error loading logs:', err); // Debug logging
                document.getElementById('upload-logs').innerHTML = `<p>Error loading logs: ${err}</p>`;
            }
        }

        async function loadStats() {
            try {
                const response = await fetch('/api/rawbol/stats?_=' + Date.now());
                const data = await response.json();
                const statsEl = document.getElementById('stats-display');
                
                if (data.success) {
                    // Use the global total cost from upload history instead of API value
                    const totalCost = '$' + globalTotalCost.toLocaleString('en-US', {minimumFractionDigits: 2, maximumFractionDigits: 2});
                    
                    statsEl.innerHTML = `
                        <p><strong>Total Unique Items:</strong> ${data.unique_items.toLocaleString()}</p>
                        <p><strong>Total Quantity:</strong> ${data.total_quantity.toLocaleString()}</p>
                        <p><strong>Total Cost:</strong> ${totalCost}</p>
                    `;
                } else {
                    statsEl.innerHTML = `<p>Error loading stats: ${data.error}</p>`;
                }
            } catch (err) {
                document.getElementById('stats-display').innerHTML = `<p>Error loading stats: ${err}</p>`;
            }
        }

        async function undoLastUpload(lotNumber) {
            if (!confirm(`Are you sure you want to delete lot ${lotNumber}? This will remove all items from this BOL upload and desync from the main BOL database.`)) {
                return;
            }
            
            const msgEl = document.getElementById('message');
            const originalContent = msgEl.innerHTML;
            msgEl.innerHTML = '<div class="message">Deleting lot...</div>';
            
            try {
                const response = await fetch(`/api/rawbol/delete/${lotNumber}`, {
                    method: 'DELETE'
                });
                const data = await response.json();
                
                if (data.success) {
                    msgEl.innerHTML = `<div class="message success">Lot ${lotNumber} deleted successfully! ${data.deleted_items} items removed from rawbol.db and desynced from bol.db.</div>`;
                    loadUploadLogs();
                    loadStats();
                } else {
                    msgEl.innerHTML = `<div class="message error">Error deleting lot: ${data.error}</div>`;
                }
            } catch (err) {
                msgEl.innerHTML = `<div class="message error">Error: ${err}</div>`;
            }
        }

        async function deleteLot(lotNumber) {
            // Function removed - X button no longer available
            alert('Delete functionality has been disabled.');
        }
        
        // Edit LOT functionality
        let currentEditLot = null;
        
        function openEditModal(lotNumber, importDate, shippingCost) {
            currentEditLot = lotNumber;
            document.getElementById('edit-lot-number').value = lotNumber;
            document.getElementById('edit-import-date').value = importDate || '';
            document.getElementById('edit-shipping-cost').value = shippingCost || '';
            document.getElementById('edit-modal').style.display = 'block';
        }
        
        function closeEditModal() {
            document.getElementById('edit-modal').style.display = 'none';
            currentEditLot = null;
        }
        
        async function saveEditLot() {
            const newLotNumber = document.getElementById('edit-lot-number').value.trim();
            const newImportDate = document.getElementById('edit-import-date').value.trim();
            const newShippingCost = document.getElementById('edit-shipping-cost').value.trim();
            
            if (!newLotNumber) {
                alert('LOT # is required.');
                return;
            }
            
            try {
                const response = await fetch(`/api/rawbol/update/${currentEditLot}`, {
                    method: 'PUT',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({
                        lot_number: newLotNumber,
                        import_date: newImportDate,
                        shipping_cost: newShippingCost
                    })
                });
                
                const data = await response.json();
                
                if (data.success) {
                    alert('LOT information updated successfully!');
                    closeEditModal();
                    loadUploadLogs();
                    loadStats();
                } else {
                    alert('Error: ' + data.error);
                }
            } catch (err) {
                alert('Error updating LOT: ' + err);
            }
        }
        
        // Close modal if clicking outside
        window.onclick = function(event) {
            const modal = document.getElementById('edit-modal');
            if (event.target == modal) {
                closeEditModal();
            }
        }
    </script>
    
    <!-- Edit LOT Modal -->
    <div id="edit-modal" class="modal">
        <div class="modal-content">
            <h3>Edit LOT Information</h3>
            <div class="form-group">
                <label for="edit-lot-number">LOT #:</label>
                <input type="text" id="edit-lot-number">
            </div>
            <div class="form-group">
                <label for="edit-import-date">Date:</label>
                <input type="date" id="edit-import-date">
            </div>
            <div class="form-group">
                <label for="edit-shipping-cost">Shipping Cost ($):</label>
                <input type="number" id="edit-shipping-cost" step="0.01" min="0">
            </div>
            <div class="btn-group">
                <button onclick="closeEditModal()" class="btn-cancel">Cancel</button>
                <button onclick="saveEditLot()">Save Changes</button>
            </div>
        </div>
    </div>
    <script src="/static/i18n.js"></script>
</body>
</html>
