<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Preperation</title>
  <style>
    body{font-family:Segoe UI,Arial,sans-serif;background:#f7fafc;margin:0;padding:18px}
    .top{display:flex;align-items:center;gap:10px;justify-content:space-between}
    .btn{padding:12px 16px;border-radius:12px;border:none;cursor:pointer;font-size:1.05rem}
    .btn-primary{background:#00b894;color:#fff}
    .btn-danger{background:#e74c3c;color:#fff}
    .btn-gray{background:#95a5a6;color:#fff}
    .card{background:#fff;border:1px solid #e8e8e8;border-radius:14px;padding:16px;margin-top:14px}
    .row{display:flex;gap:10px;flex-wrap:wrap}
    .item{display:flex;gap:16px;align-items:center}
    .thumb{width:80px;height:80px;border-radius:12px;object-fit:cover;background:#f0f0f0}
    .hero{width:100%;max-height:32vh;object-fit:contain;background:#f8f8f8;border-radius:12px}
    .title{font-weight:700;font-size:1.1rem}
    .muted{color:#666;font-size:0.95rem}
    #statusMsg{margin-top:10px;font-size:1rem}
    .ok{color:#2ecc71}
    .bad{color:#e74c3c}
    .hidden{display:none}
    .big-actions{display:flex;gap:12px;margin-top:12px}
    .big-actions .btn{flex:1;padding:18px 0;font-size:1.2rem}
    .pill{display:inline-block;padding:6px 10px;border-radius:999px;background:#eee}
  .qty-display{display:flex;flex-direction:column;gap:12px;margin:12px 0;padding:12px;background:#f8f9fa;border-radius:12px}
  .qty-number{font-size:2.2rem;font-weight:700;min-width:80px;text-align:center;color:#2c3e50}
  .qty-label{font-size:0.72rem;color:#7f8c8d;text-transform:uppercase;letter-spacing:1px;text-align:center;margin-bottom:6px}
  .qty-controls{display:flex;gap:12px;width:100%;align-items:center;justify-content:space-between}
  .qty-btn{font-size:2rem;font-weight:700;padding:12px 0;border:3px solid;border-radius:12px;cursor:pointer;background:#fff;transition:all 0.2s;flex:1;max-width:33vw}
    .qty-btn.plus{color:#00b894;border-color:#00b894}
    .qty-btn.plus:hover{background:#00b894;color:#fff}
    .qty-btn.minus{color:#e74c3c;border-color:#e74c3c}
    .qty-btn.minus:hover{background:#e74c3c;color:#fff}
    .qty-btn:active{transform:scale(0.95)}
    .undo-btn{background:#f39c12;color:#fff;padding:10px 20px;border-radius:10px;margin-top:12px;font-size:1rem}
    .undo-btn:hover{background:#e67e22}
  </style>
  <script src="https://unpkg.com/@zxing/library@0.19.1/umd/index.min.js"></script>
</head>
<body>
  <div class="top">
  <a href="/"><button class="btn btn-danger">Back</button></a>
  <h2 style="margin:0 auto;text-align:center;flex:1">Preperation</h2>
  <button class="btn undo-btn hidden" id="undoBtn">↶ Undo Last Entry</button>
  </div>

  <div class="card">
    <div id="scanner" style="max-width:320px">
      <video id="video" playsinline style="width:100%;aspect-ratio:1/1;background:#222;border-radius:8px"></video>
      <div id="scanMsg" class="muted">Initializing camera...</div>
    </div>

    <div class="row" style="align-items:center;margin-top:12px">
  <input type="text" id="manualUpc" placeholder="Enter/scan UPC" autofocus style="padding:8px;border:1px solid #ddd;border-radius:6px;flex:1;min-width:200px">
      <button class="btn" id="lookupBtn">Lookup</button>
    </div>
    
    <div id="noBarcodeBtn" style="margin-top:48px">
      <a href="/item-prep-no-barcode" style="text-decoration:none;display:block">
        <button class="btn" style="padding:36px 64px;border-radius:12px;background:#e74c3c;border:none;color:#fff;font-size:1.2rem;width:100%;box-shadow:0 2px 8px rgba(231,76,60,0.3);transition:all 0.2s" onmouseover="this.style.background='#c0392b'" onmouseout="this.style.background='#e74c3c'">
          <span style="font-size:1.4rem;margin-right:8px">|||</span> No Barcode
        </button>
      </a>
    </div>

    <div id="result" class="hidden" style="margin-top:12px">
      <div class="item">
        <img id="thumb" class="thumb" src="" alt="thumb">
        <div>
          <div class="title" id="title"></div>
          <div class="muted"><span id="upcTxt"></span></div>
        </div>
      </div>
      <img id="hero" class="hero" src="" alt="item image" onerror="this.style.display='none'" style="margin-top:10px">
      <div id="prepSummary" class="muted" style="margin-top:8px"></div>
      <div id="qtyDisplay" class="qty-display hidden">
        <div class="qty-label">Quantity</div>
        <div class="qty-controls">
          <button class="qty-btn minus" id="qtyMinusBtn">&#8722;</button>
          <span class="qty-number" id="qtyNumber">1</span>
          <button class="qty-btn plus" id="qtyPlusBtn">&#43;</button>
        </div>
      </div>
      <div class="big-actions" id="actions">
        <button class="btn btn-primary" id="goodBtn">Good</button>
        <button class="btn btn-danger" id="badBtn">Bad → Diagnostic</button>
      </div>
      <div style="text-align:right;margin-top:8px"><button class="btn btn-gray" id="skipBtn" style="padding:8px 12px;border-radius:10px">Skip</button></div>
    </div>

    <div id="statusMsg" class="muted"></div>
  </div>

  <script>
    const video = document.getElementById('video');
    const scanMsg = document.getElementById('scanMsg');
    let reader = null;
    let stream = null;

    function missingThumb(width=56,height=56,text='No Img'){return 'data:image/svg+xml;utf8,'+encodeURIComponent('<svg xmlns="http://www.w3.org/2000/svg" width="'+width+'" height="'+height+'"><rect width="100%" height="100%" fill="#f8f8f8"/><text x="50%" y="50%" dominant-baseline="middle" text-anchor="middle" fill="#b0b0b0" font-size="10">'+text+'</text></svg>');}

    async function startScanner(){
      try{
        reader = new ZXing.BrowserMultiFormatReader();
        if (video.srcObject) video.srcObject.getTracks().forEach(t=>t.stop());
        const ms = await navigator.mediaDevices.getUserMedia({video:{facingMode:'environment'}});
        stream = ms;
        video.srcObject = ms;
        await video.play();
        scanMsg.textContent = 'Ready to scan UPC';
        await reader.decodeFromVideoDevice(undefined,'video',(res,err)=>{
          if(res){ const upc = res.getText().trim(); onScan(upc); }
        });
      }catch(e){ scanMsg.textContent = 'Camera unavailable: '+(e.message||''); }
    }

    function stopScanner(){ try{ reader && reader.reset(); }catch{}; try{ stream && stream.getTracks().forEach(t=>t.stop()); }catch{}; reader=null; stream=null; }

    async function onScan(upc){ stopScanner(); document.getElementById('manualUpc').value = upc; await lookup(upc); }

    function esc(s){return String(s||'').replace(/[&<>]/g, c=>({"&":"&amp;","<":"&lt;","<":"&lt;",">":"&gt;"}[c]));}

    let currentUpc = null; // Store the actual UPC returned from server (may be suffixed)
    let currentQty = 1; // Track quantity for visual display, start at 1
    let lastEntry = null; // Store last entry for undo: {upc, status, qty}

    function updateQtyDisplay(change) {
      let newQty = currentQty + change;
      if (newQty < 1) newQty = 1;
      currentQty = newQty;
      const qtyNumber = document.getElementById('qtyNumber');
      qtyNumber.textContent = currentQty;
      // Add a brief scale animation to show the change
      qtyNumber.style.transform = 'scale(1.2)';
      qtyNumber.style.color = change > 0 ? '#00b894' : '#e74c3c';
      setTimeout(() => {
        qtyNumber.style.transform = 'scale(1)';
        qtyNumber.style.color = '#2c3e50';
      }, 300);
    }

    function resetQtyDisplay() {
      currentQty = 1;
      document.getElementById('qtyNumber').textContent = '1';
      document.getElementById('qtyNumber').style.transform = 'scale(1)';
      document.getElementById('qtyNumber').style.color = '#2c3e50';
      document.getElementById('qtyDisplay').classList.add('hidden');
    }

    function showUndoButton() {
      const undoBtn = document.getElementById('undoBtn');
      undoBtn.classList.remove('hidden');
    }

    function hideUndoButton() {
      const undoBtn = document.getElementById('undoBtn');
      undoBtn.classList.add('hidden');
    }

    async function updateQuantity(upc, qty) {
      try {
        const r = await fetch('/api/bol_items/quantity', {
          method: 'POST',
          headers: {'Content-Type': 'application/json'},
          body: JSON.stringify({upc, quantity: qty})
        });
        const j = await r.json();
        return j && j.success;
      } catch(e) {
        console.error('Failed to update quantity:', e);
        return false;
      }
    }

    async function lookup(upc){
      const r = await fetch('/api/bol_lookup?upc='+encodeURIComponent(upc));
      const j = await r.json();
      const resEl = document.getElementById('result');
      const actions = document.getElementById('actions');
      const statusMsg = document.getElementById('statusMsg');
      if(!j.found){
        resEl.classList.add('hidden'); actions.classList.add('hidden');
        document.getElementById('noBarcodeBtn').classList.remove('hidden');
        statusMsg.innerHTML = '<span class="bad">Not found in BOL</span>';
        setTimeout(()=>{ statusMsg.textContent=''; startScanner(); }, 1000);
        currentUpc = null;
        // Auto-clear the input after lookup completes
        document.getElementById('manualUpc').value = '';
        return;
      }
      const it = j.item||{};
      currentUpc = it.upc || upc; // Store the actual UPC (may be suffixed if duplicate)
      document.getElementById('thumb').src = it.image_url || missingThumb();
      const hero = document.getElementById('hero'); hero.style.display=''; hero.src = it.image_url || '';
      document.getElementById('title').textContent = it.item_description || '';
      document.getElementById('upcTxt').textContent = it.upc || '';
      // Show existing prep status summary
      const prep = it.prep_status || null;
      const sum = document.getElementById('prepSummary');
      if(prep && prep.status){
        const pill = `<span class="pill">${(prep.status||'').toUpperCase()}${prep.reason?': '+prep.reason:''}</span>`;
        sum.innerHTML = pill + ` <a href="/item-prep/diagnostic?upc=${encodeURIComponent(it.upc||'')}">Edit diagnostic</a>`;
      } else {
        sum.textContent = '';
      }
      resEl.classList.remove('hidden'); actions.classList.remove('hidden');
      statusMsg.textContent='';
      // Hide No Barcode button when item is displayed
      document.getElementById('noBarcodeBtn').classList.add('hidden');
      // Reset and show quantity display
      resetQtyDisplay();
      document.getElementById('qtyDisplay').classList.remove('hidden');
      // Auto-clear the input after lookup completes
      document.getElementById('manualUpc').value = '';
    }

    async function setStatus(upc, status, qty){
      // Update quantity first
      await updateQuantity(upc, qty);
      const r = await fetch('/api/items_prep/status',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({upc,status})});
      const j = await r.json();
      return j && j.success;
    }

    document.getElementById('lookupBtn').onclick = ()=>{ const v=document.getElementById('manualUpc').value.trim(); if(v) lookup(v); };
    
    document.getElementById('qtyPlusBtn').onclick = ()=>{ updateQtyDisplay(1); };
    document.getElementById('qtyMinusBtn').onclick = ()=>{ updateQtyDisplay(-1); };
    
    document.getElementById('undoBtn').onclick = async ()=>{
      if(!lastEntry) return;
      if(!confirm('Undo last entry for UPC: ' + lastEntry.upc + '?')) return;
      const statusMsg = document.getElementById('statusMsg');
      try {
        // Delete the status
        await fetch('/api/items_prep/status/' + encodeURIComponent(lastEntry.upc), {method: 'DELETE'});
        // Reset quantity to 1
        await updateQuantity(lastEntry.upc, 1);
        statusMsg.innerHTML='<span class="ok">✓ Undone</span>';
        lastEntry = null;
        hideUndoButton();
        setTimeout(()=>{ statusMsg.textContent=''; }, 2000);
      } catch(e) {
        statusMsg.innerHTML='<span class="bad">Failed to undo</span>';
        setTimeout(()=>{ statusMsg.textContent=''; }, 2000);
      }
    };
    
    document.getElementById('goodBtn').onclick = async ()=>{
      if(!currentUpc) return;
      // Store for undo
      lastEntry = {upc: currentUpc, status: 'good', qty: currentQty};
      showUndoButton();
      const ok = await setStatus(currentUpc, 'good', currentQty);
      const statusMsg = document.getElementById('statusMsg');
      if(ok){ statusMsg.innerHTML='<span class="ok">Marked GOOD (Qty: '+currentQty+')</span>'; } else { statusMsg.innerHTML='<span class="bad">Failed to mark</span>'; }
      setTimeout(()=>{ statusMsg.textContent=''; document.getElementById('result').classList.add('hidden'); document.getElementById('actions').classList.add('hidden'); document.getElementById('noBarcodeBtn').classList.remove('hidden'); document.getElementById('manualUpc').value=''; currentUpc = null; resetQtyDisplay(); setupDeviceMode(); }, 600);
    };

    document.getElementById('badBtn').onclick = ()=>{
      if(!currentUpc) return;
      updateQtyDisplay(-1); // Show -1 animation
      setTimeout(() => {
        window.location.href = '/item-prep/diagnostic?upc='+encodeURIComponent(currentUpc)+'&from=bad&return='+encodeURIComponent('/item-prep?forceFocus=1');
      }, 300);
    };

    document.getElementById('skipBtn').onclick = async ()=>{ 
      if (currentUpc) {
        // Cleanup temporary entry if it exists
        try {
          await fetch('/api/items_prep/cleanup_temp', {
            method: 'POST',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify({upc: currentUpc})
          });
        } catch(e) {
          console.error('Cleanup error:', e);
        }
      }
      document.getElementById('manualUpc').value=''; 
      document.getElementById('result').classList.add('hidden'); 
      document.getElementById('actions').classList.add('hidden'); 
      document.getElementById('noBarcodeBtn').classList.remove('hidden');
      currentUpc = null;
      resetQtyDisplay();
      setupDeviceMode(); 
    };

    // Device detection similar to barcode.html
    function getDeviceType(){
      const ua = navigator.userAgent;
      if (/iPad|Macintosh/.test(ua) && 'ontouchend' in document) return 'iPad';
      if (/Android/.test(ua) && !/Mobile/.test(ua)) return 'Android Tablet';
      if (/iPhone|Android.*Mobile|Windows Phone|webOS|BlackBerry|Opera Mini|IEMobile|Mobile/.test(ua)) return 'Mobile';
      return 'Desktop';
    }
    function setupDeviceMode(){
      const type = getDeviceType();
      const scannerDiv = document.getElementById('scanner');
      const input = document.getElementById('manualUpc');
      // Requirement: iPad or Desktop -> manual input only; Mobile phones -> camera
      if (type === 'iPad' || type === 'Desktop'){
        if (scannerDiv) scannerDiv.style.display = 'none';
        stopScanner();
        if (input){ input.style.display=''; try{ input.focus({preventScroll:true}); if(input.select) input.select(); }catch{} }
        scanMsg.textContent = '';
      } else {
        if (scannerDiv) scannerDiv.style.display = '';
        if (input){ input.style.display=''; }
        startScanner();
      }
    }
    // Treat Enter key or change as a trigger for lookup (works well with USB scanners on desktop)
    const manual = document.getElementById('manualUpc');
    manual.addEventListener('keydown', (e)=>{ if (e.key === 'Enter'){ e.preventDefault(); const v = manual.value.trim(); if(v) lookup(v); }});
    manual.addEventListener('change', ()=>{ const v = manual.value.trim(); if(v) lookup(v); });

    function ensureUpcFocus(){
      const input = document.getElementById('manualUpc');
      if(!input) return;
      try{ input.focus({preventScroll:true}); if(input.select) input.select(); }catch{}
      // Retry a few times in case something steals focus on load
      let attempts = 0;
      const timer = setInterval(()=>{
        attempts++;
        if(document.activeElement !== input){
          try{ input.focus({preventScroll:true}); if(input.select) input.select(); }catch{}
        }
        if(document.activeElement === input || attempts >= 6){ clearInterval(timer); }
      }, 120);
    }

    window.addEventListener('DOMContentLoaded', ()=>{
      setupDeviceMode();
      // If no UPC param, focus the manual input for quick scanning/typing
      try{
        const params = new URLSearchParams(window.location.search);
        const upc = (params.get('upc')||'').trim();
        const forceFocus = (params.get('forceFocus')||'') === '1';
        if(forceFocus){
          // Force manual mode focus regardless of device; stop scanner and focus/select input
          try{ stopScanner(); }catch{}
          const scannerDiv = document.getElementById('scanner'); if(scannerDiv) scannerDiv.style.display = 'none';
          ensureUpcFocus();
          // Clean the URL so future reloads aren't affected
          try{ const url = new URL(window.location.href); url.searchParams.delete('forceFocus'); window.history.replaceState({}, '', url.toString()); }catch{}
        } else if(!upc){
          ensureUpcFocus();
        }
      }catch{}
    });
    window.addEventListener('beforeunload', stopScanner);

    // Auto-trigger lookup if ?upc= is provided OR if coming from no-barcode page
    window.addEventListener('DOMContentLoaded', async ()=>{
      try{
        const params = new URLSearchParams(window.location.search);
        let upc = (params.get('upc')||'').trim();
        
        // Check sessionStorage for UPC from no-barcode search
        if(!upc){
          const savedUpc = sessionStorage.getItem('prepUpc');
          if(savedUpc){
            upc = savedUpc.trim();
            sessionStorage.removeItem('prepUpc'); // Clear after use
          }
        }
        
        if(upc){
          document.getElementById('manualUpc').value = upc;
          await lookup(upc);
          // stop scanner while viewing result
          stopScanner();
          // Ensure result is visible and actions are big
          document.getElementById('result').classList.remove('hidden');
          document.getElementById('actions').classList.remove('hidden');
          // Hide No Barcode button when item is displayed
          document.getElementById('noBarcodeBtn').classList.add('hidden');
        }
      }catch(e){}
    });
  </script>
</body>
</html>
