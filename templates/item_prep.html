<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Preparation</title>
  <style>
    body{font-family:Segoe UI,Arial,sans-serif;background:#f7fafc;margin:0;padding:18px}
    .top{display:flex;align-items:center;gap:10px;justify-content:space-between}
    .btn{padding:12px 16px;border-radius:12px;border:none;cursor:pointer;font-size:1.05rem}
    .btn-primary{background:#00b894;color:#fff}
    .btn-danger{background:#e74c3c;color:#fff}
    .btn-gray{background:#95a5a6;color:#fff}
    .card{background:#fff;border:1px solid #e8e8e8;border-radius:14px;padding:16px;margin-top:14px}
    .row{display:flex;gap:10px;flex-wrap:wrap}
    .item{display:flex;gap:16px;align-items:center}
    .thumb{width:80px;height:80px;border-radius:12px;object-fit:cover;background:#f0f0f0}
    .hero{width:100%;max-height:32vh;object-fit:contain;background:#f8f8f8;border-radius:12px}
    .title{font-weight:700;font-size:1.1rem}
    .muted{color:#666;font-size:0.95rem}
    #statusMsg{margin-top:10px;font-size:1rem}
    .ok{color:#2ecc71}
    .bad{color:#e74c3c}
    .hidden{display:none}
    .big-actions{display:flex;gap:12px;margin-top:12px}
    .big-actions .btn{flex:1;padding:18px 0;font-size:1.2rem}
    .pill{display:inline-block;padding:6px 10px;border-radius:999px;background:#eee}
    .qty-display{display:flex;flex-direction:column;gap:12px;margin:12px 0;padding:12px;background:#f8f9fa;border-radius:12px}
    .qty-number{font-size:2.2rem;font-weight:700;min-width:80px;text-align:center;color:#2c3e50}
    .qty-label{font-size:0.72rem;color:#7f8c8d;text-transform:uppercase;letter-spacing:1px;text-align:center;margin-bottom:6px}
    .note-wrap{display:block;margin-top:8px}
    .note-row{display:flex;align-items:center;gap:8px}
    .note-row .note-input{flex:1}
    .note-input{
      display:block;
      width:100%;
      min-width:0;
      height:38px;
      padding:8px 12px;
      border:1px solid #e8d98a;
      border-radius:10px;
      font-family:inherit;
      font-size:0.96rem;
      color:#5c4a00;
      background:#fff6bf;
      box-shadow:inset 0 1px 0 rgba(255,255,255,0.55), 0 1px 2px rgba(0,0,0,0.06);
    }
    .note-input::placeholder{color:#8f7f42}
    .note-input:focus{
      outline:none;
      border-color:#d3bc62;
      box-shadow:0 0 0 2px rgba(234,206,92,0.35);
    }
    .btn-set-note{
      padding:8px 14px;
      min-width:64px;
      border-radius:10px;
      border:1px solid #d9b445;
      background:#f8d556;
      color:#5c4a00;
      font-weight:700;
      font-size:0.92rem;
      line-height:1;
      box-shadow:0 1px 2px rgba(0,0,0,0.08);
    }
    .btn-set-note:hover{background:#f2c842}
    .setqty-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,0.45);z-index:100002;align-items:center;justify-content:center;padding:16px}
    .setqty-overlay.active{display:flex}
    .setqty-card{background:#fff;border:1px solid #e3e3e3;border-radius:14px;max-width:420px;width:100%;padding:16px;box-shadow:0 12px 36px rgba(0,0,0,0.22)}
    .setqty-title{font-size:1.1rem;font-weight:700;color:#1f2937;margin:0 0 8px 0}
    .setqty-note-preview{font-size:0.95rem;color:#475569;margin-bottom:12px}
    .setqty-controls{display:flex;align-items:center;justify-content:center;gap:10px;margin:8px 0 14px}
    .setqty-btn{width:52px;height:52px;border-radius:12px;border:2px solid #d1d5db;background:#fff;font-size:1.9rem;line-height:1;cursor:pointer}
    .setqty-btn:active{transform:scale(0.97)}
    .setqty-value{min-width:74px;text-align:center;font-size:2rem;font-weight:700;color:#0f172a}
    .setqty-actions{display:flex;gap:10px;justify-content:flex-end;flex-wrap:wrap}
    .loading-overlay{position:absolute;top:0;left:0;right:0;bottom:0;background:rgba(255,255,255,0.9);display:flex;align-items:center;justify-content:center;z-index:10;border-radius:12px}
  .spinner{border:3px solid #f3f3f3;border-top:3px solid #00b894;border-radius:50%;width:24px;height:24px;animation:spin 1s linear infinite}
  @keyframes spin{0%{transform:rotate(0deg)}100%{transform:rotate(360deg)}}
  .btn:disabled{opacity:0.5;cursor:not-allowed}
  .loading-overlay{position:absolute;top:0;left:0;right:0;bottom:0;background:rgba(255,255,255,0.9);display:flex;align-items:center;justify-content:center;z-index:10;border-radius:12px}
  .spinner{border:3px solid #f3f3f3;border-top:3px solid #00b894;border-radius:50%;width:24px;height:24px;animation:spin 1s linear infinite}
  @keyframes spin{0%{transform:rotate(0deg)}100%{transform:rotate(360deg)}}
  .btn:disabled{opacity:0.5;cursor:not-allowed}
  /* Full-page loading overlay */
  .page-loading-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,0.5);z-index:99999;align-items:center;justify-content:center}
  .page-loading-overlay.active{display:flex}
  .loading-spinner-large{border:4px solid #f3f3f3;border-top:4px solid #00b894;border-radius:50%;width:50px;height:50px;animation:spin 1s linear infinite}
  .exception-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,0.45);z-index:100000;align-items:center;justify-content:center;padding:16px}
  .exception-overlay.active{display:flex}
  .exception-card{background:#fff;border:1px solid #e3e3e3;border-radius:14px;max-width:560px;width:100%;padding:16px;box-shadow:0 12px 36px rgba(0,0,0,0.22)}
  .exception-title{font-size:1.1rem;font-weight:700;color:#b91c1c;margin:0 0 8px 0}
  .exception-msg{color:#333;line-height:1.35;margin:0 0 12px 0}
  .exception-actions{display:flex;gap:10px;flex-wrap:wrap;justify-content:flex-end}
  .exception-link{display:inline-flex;align-items:center;gap:6px;color:#1d4ed8;text-decoration:none;font-weight:600}
  .lot-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,0.45);z-index:100001;align-items:center;justify-content:center;padding:16px}
  .lot-overlay.active{display:flex}
  .lot-card{background:#fff;border:1px solid #e3e3e3;border-radius:14px;max-width:620px;width:100%;padding:16px;box-shadow:0 12px 36px rgba(0,0,0,0.22)}
  .lot-title{font-size:1.1rem;font-weight:700;color:#1f2937;margin:0 0 8px 0}
  .lot-msg{color:#333;line-height:1.35;margin:0 0 12px 0;white-space:pre-line}
  .lot-actions{display:flex;gap:10px;flex-wrap:wrap;justify-content:flex-end}
  .lot-actions .btn{min-width:150px}
  .qty-controls{display:flex;gap:12px;width:100%;align-items:center;justify-content:space-between}
  .qty-btn{font-size:2rem;font-weight:700;padding:12px 0;border:3px solid;border-radius:12px;cursor:pointer;background:#fff;transition:all 0.2s;flex:1;max-width:33vw}
    .qty-btn.plus{color:#00b894;border-color:#00b894}
    .qty-btn.plus:hover{background:#00b894;color:#fff}
    .qty-btn.minus{color:#e74c3c;border-color:#e74c3c}
    .qty-btn.minus:hover{background:#e74c3c;color:#fff}
    .qty-btn:active{transform:scale(0.95)}
    .undo-btn{background:#e74c3c;color:#fff;padding:32px 64px;border-radius:12px;margin-top:16px;font-size:1.3rem;width:100%;box-shadow:0 2px 8px rgba(231,76,60,0.3);transition:all 0.2s;font-weight:600}
    .undo-btn:hover{background:#c0392b}
    
    /* Mobile/Tablet Landscape Optimization */
    @media (max-height: 600px) and (orientation: landscape) {
      body{padding:10px}
      .top{margin-bottom:8px}
      .top h2{font-size:1.2rem;margin:0}
      .btn{padding:8px 12px;font-size:0.9rem}
      .card{padding:12px;margin-top:8px}
      .hero{max-height:25vh}
      .thumb{width:60px;height:60px}
      .big-actions .btn{padding:14px 0;font-size:1rem}
      .qty-display{margin:8px 0;padding:8px;gap:8px}
      .qty-number{font-size:1.8rem}
      .qty-btn{font-size:1.6rem;padding:10px 0;max-width:30vw}
      .undo-btn{padding:20px 40px;font-size:1.1rem;margin-top:10px}
      #scanner{max-width:280px;margin:0 auto}
      video{max-height:200px}
    }
    
    @media (max-width: 768px) and (orientation: portrait) {
      .qty-btn{max-width:30vw}
      .hero{max-height:28vh}
    }

    /* iPad compact layout so note/image/actions fit without scrolling */
    @media (min-width: 768px) and (max-width: 1100px) {
      body{padding:10px}
      .top{gap:8px}
      .top h2{font-size:1.2rem}
      .btn{padding:8px 12px;font-size:0.92rem}
      .card{padding:10px;margin-top:8px}
      .item{gap:10px}
      .thumb{width:64px;height:64px}
      #hero{max-height:18vh !important;margin-top:6px !important}
      #prepSummary{margin-top:6px !important;font-size:0.88rem}
      .note-wrap{margin-top:6px}
      .note-row{gap:6px}
      .note-input{height:34px;padding:6px 10px;font-size:0.9rem}
      .btn-set-note{height:34px;padding:6px 10px;font-size:0.84rem;min-width:58px}
      .qty-display{margin:6px 0;padding:8px;gap:6px}
      .qty-label{margin-bottom:2px;font-size:0.66rem}
      .qty-number{font-size:1.7rem}
      .qty-btn{font-size:1.4rem;padding:8px 0;max-width:30vw}
      .big-actions{gap:8px;margin-top:8px}
      .big-actions .btn{padding:11px 0;font-size:1rem}
      #noBarcodeBtn{margin-top:16px}
      #manualUpc{padding:6px 8px !important;font-size:0.95rem}
      #lotScopeSelector{padding:6px 10px !important;font-size:0.92rem !important}
    }

    /* Night mode overrides */
    html.ss-theme-night body { background: var(--bg0, #0f172a); color: var(--ink, #e2e8f0); }
    html.ss-theme-night .card { background: var(--card, #1e293b); border-color: rgba(255,255,255,0.08); }
    html.ss-theme-night .title { color: var(--ink-bright, #f8fafc); }
    html.ss-theme-night .muted { color: var(--muted, #94a3b8); }
    html.ss-theme-night .ok { color: #10b981; }
    html.ss-theme-night .bad { color: #f87171; }
    html.ss-theme-night .pill { background: #334155; color: var(--muted, #94a3b8); }
    html.ss-theme-night .qty-display { background: #1e293b; }
    html.ss-theme-night .qty-number { color: var(--ink, #e2e8f0); }
    html.ss-theme-night .qty-label { color: var(--muted-dim, #64748b); }
    html.ss-theme-night .qty-btn { background: #1e293b; border-color: currentColor; }
    html.ss-theme-night .qty-btn.plus:hover { background: #00b894; color: #fff; }
    html.ss-theme-night .qty-btn.minus:hover { background: #e74c3c; color: #fff; }
    html.ss-theme-night .note-input { background:#f7e79f !important; color:#4d3f04 !important; border-color:#cfb95f !important; box-shadow:inset 0 1px 0 rgba(255,255,255,0.45), 0 1px 2px rgba(0,0,0,0.08) !important; }
    html.ss-theme-night .note-input::placeholder { color:#7f7031 !important; }
    html.ss-theme-night .btn-set-note { background:#eab308; color:#3b2f00; border-color:#ca8a04; }
    html.ss-theme-night .btn-set-note:hover { background:#dca307; }
    html.ss-theme-night .setqty-card { background: var(--card, #1e293b); border-color: rgba(255,255,255,0.1); }
    html.ss-theme-night .setqty-title { color: var(--ink-bright, #f8fafc); }
    html.ss-theme-night .setqty-note-preview { color: var(--muted, #94a3b8); }
    html.ss-theme-night .setqty-btn { background: var(--bg0, #0f172a); color: var(--ink, #e2e8f0); border-color: rgba(255,255,255,0.15); }
    html.ss-theme-night .setqty-value { color: var(--ink, #e2e8f0); }
    html.ss-theme-night input[type="text"] { background: var(--bg0, #0f172a); color: var(--ink, #e2e8f0); border-color: rgba(255,255,255,0.12); }
    html.ss-theme-night select { background: var(--bg0, #0f172a); color: var(--ink, #e2e8f0); border-color: rgba(255,255,255,0.12); }
    html.ss-theme-night label { color: var(--muted, #94a3b8); }
    html.ss-theme-night video { background: #0f172a; }
    html.ss-theme-night .thumb { background: #334155; }
    html.ss-theme-night .hero { background: #1e293b; }
    html.ss-theme-night .btn { background: #334155; color: var(--muted, #94a3b8); }
    html.ss-theme-night .btn-primary { background: #10b981; color: #fff; }
    html.ss-theme-night .btn-primary:hover { background: #0ea371; }
    html.ss-theme-night .btn-danger { background: #ef4444; color: #fff; }
    html.ss-theme-night .btn-danger:hover { background: #dc2626; }
    html.ss-theme-night .btn-gray { background: #475569; }
    html.ss-theme-night .loading-overlay { background: rgba(15,23,42,0.9); }
    html.ss-theme-night .page-loading-overlay { background: rgba(15,23,42,0.7); }
    html.ss-theme-night .exception-card { background: var(--card, #1e293b); border-color: rgba(255,255,255,0.1); }
    html.ss-theme-night .exception-title { color: #fca5a5; }
    html.ss-theme-night .exception-msg { color: var(--ink, #e2e8f0); }
    html.ss-theme-night .exception-link { color: #93c5fd; }
    html.ss-theme-night .lot-card { background: var(--card, #1e293b); border-color: rgba(255,255,255,0.1); }
    html.ss-theme-night .lot-title { color: var(--ink-bright, #f8fafc); }
    html.ss-theme-night .lot-msg { color: var(--ink, #e2e8f0); }
    html.ss-theme-night .spinner { border-color: #334155; border-top-color: #10b981; }
    html.ss-theme-night .loading-spinner-large { border-color: #334155; border-top-color: #10b981; }
    html.ss-theme-night .top h2 { color: var(--ink-bright, #f8fafc); }
  </style>
</head>
<body>
<div class="top">
  <h2 style="margin:0 auto;text-align:center;flex:1" data-i18n="preparation">Preparation</h2>
  <div style="display:flex;gap:10px;align-items:center;">
    <!-- Print Que button intentionally hidden for now; keep this spot for possible reactivation later. -->
    <a href="/item-prep/log" style="text-decoration:none"><button class="btn btn-gray">LOG</button></a>
  </div>
  </div>
  
  <!-- Working LOT mode -->
  <div class="card" style="margin-top:12px;padding:12px;">
    <div style="display:flex;align-items:center;gap:12px;flex-wrap:wrap;">
      <label style="font-weight:600;color:#2c3e50;white-space:nowrap;" data-i18n="working_lot">Working LOT:</label>
      <select id="lotScopeSelector" style="min-width:180px;padding:8px 12px;border:2px solid #00b894;border-radius:8px;font-size:1rem;background:#fff;cursor:pointer;">
        <option value="current">Current</option>
        <option value="all">ALL</option>
      </select>
      <div id="lotDate" style="color:#666;font-size:0.9rem;white-space:nowrap;flex:1;min-width:220px;"></div>
    </div>
  </div>

  <div class="card">
    <div class="muted" style="margin-bottom:8px" data-i18n="ready_to_scan_upc">Ready to scan UPC</div>

    <div class="row" style="align-items:center;margin-top:12px">
  <input type="text" id="manualUpc" placeholder="Enter/scan UPC" data-i18n="enter_scan_upc" autofocus style="padding:8px;border:1px solid #ddd;border-radius:6px;flex:1;min-width:200px">
      <button class="btn" id="lookupBtn" data-i18n="lookup">Lookup</button>
    </div>
    
    <div id="noBarcodeBtn" style="margin-top:48px">
      <a href="/item-prep-no-barcode" style="text-decoration:none;display:block">
        <button class="btn" style="padding:36px 64px;border-radius:12px;background:#3498db;border:none;color:#fff;font-size:1.2rem;width:100%;box-shadow:0 2px 8px rgba(52,152,219,0.3);transition:all 0.2s" onmouseover="this.style.background='#2980b9'" onmouseout="this.style.background='#3498db'">
          <span style="font-size:1.4rem;margin-right:8px">✕</span> <span data-i18n="no_barcode_btn">No Barcode</span>
        </button>
      </a>
      <a href="/item-prep-create-item" style="text-decoration:none;display:block;margin-top:16px">
        <button class="btn" style="padding:36px 64px;border-radius:12px;background:#27ae60;border:none;color:#fff;font-size:1.2rem;width:100%;box-shadow:0 2px 8px rgba(39,174,96,0.3);transition:all 0.2s" onmouseover="this.style.background='#229954'" onmouseout="this.style.background='#27ae60'">
          <span style="font-size:1.4rem;margin-right:8px">➕</span> <span data-i18n="create_new_item">Create NEW Item</span>
        </button>
      </a>
      <button class="btn undo-btn hidden" id="undoBtn"><span aria-hidden="true">↶</span> <span data-i18n="undo_last_entry">Undo Last Entry</span></button>
    </div>

    <div id="result" class="hidden" style="margin-top:12px">
      <div class="item">
        <div style="position:relative;display:inline-block">
          <img id="thumb" class="thumb" src="" alt="thumb">
          <button id="addThumbBtn" class="btn" style="display:none;position:absolute;top:0;left:0;right:0;bottom:0;background:#00b894;color:#fff;padding:12px;font-size:0.85rem;border:none;cursor:pointer;border-radius:12px;z-index:2;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px">
            <span style="font-size:1.8rem">📷</span>
            <span style="font-weight:600;letter-spacing:0.5px" data-i18n="take_photo">TAKE PHOTO</span>
          </button>
          <div id="thumbLoadingOverlay" class="loading-overlay" style="display:none">
            <div class="spinner"></div>
          </div>
        </div>
        <div>
          <div class="title" id="title"></div>
          <div class="muted"><span id="upcTxt"></span></div>
        </div>
      </div>
      <input type="file" id="tempThumbInput" accept="image/*" capture="environment" style="display:none">
      <div class="note-wrap">
        <div class="note-row">
          <input id="quickPrepNote" class="note-input" type="text" placeholder="Add note (optional)">
          <button type="button" class="btn btn-set-note" id="setNoteBtn">Set</button>
        </div>
      </div>
      <img id="hero" class="hero" src="" alt="item image" onerror="this.style.display='none'" style="margin-top:10px">
      <div id="prepSummary" class="muted" style="margin-top:8px"></div>
      <div id="qtyDisplay" class="qty-display hidden">
        <div class="qty-label" data-i18n="quantity">Quantity</div>
        <div class="qty-controls">
          <button class="qty-btn minus" id="qtyMinusBtn">&#8722;</button>
          <span class="qty-number" id="qtyNumber">1</span>
          <button class="qty-btn plus" id="qtyPlusBtn">&#43;</button>
        </div>
      </div>
      <div class="big-actions" id="actions">
        <button class="btn btn-primary" id="goodBtn" data-i18n="good">Good</button>
        <button class="btn" id="returnBtn" style="background:#8b4513;color:#fff;width:100%;margin-top:8px" data-i18n="return_item">Return</button>
        <button class="btn btn-danger" id="badBtn" data-i18n="bad_diagnostic">Bad → Diagnostic</button>
      </div>
      <div style="text-align:right;margin-top:8px"><button class="btn btn-gray" id="skipBtn" style="padding:8px 12px;border-radius:10px" data-i18n="skip">Skip</button></div>
    </div>

    <div id="statusMsg" class="muted"></div>
  </div>

  <!-- Full-Page Loading Overlay -->
  <div id="pageLoadingOverlay" class="page-loading-overlay">
    <div class="loading-spinner-large"></div>
  </div>
  <div id="overageExceptionOverlay" class="exception-overlay" aria-hidden="true">
    <div class="exception-card" role="dialog" aria-modal="true" aria-labelledby="overageExceptionTitle">
      <h3 id="overageExceptionTitle" class="exception-title">Already Fully Added</h3>
      <p id="overageExceptionMsg" class="exception-msg"></p>
      <a id="overageExceptionLink" class="exception-link" href="/items-to-list" target="_blank" rel="noopener">Open in Items-to-List</a>
      <div class="exception-actions" style="margin-top:14px">
        <button class="btn btn-gray" id="overageExceptionSkipBtn" type="button">Skip</button>
        <button class="btn btn-primary" id="overageExceptionAddBtn" type="button">Add Anyway (Exception)</button>
      </div>
    </div>
  </div>
  <div id="lotMismatchOverlay" class="lot-overlay" aria-hidden="true">
    <div class="lot-card" role="dialog" aria-modal="true" aria-labelledby="lotMismatchTitle">
      <h3 id="lotMismatchTitle" class="lot-title">Item Not In Current LOT</h3>
      <p id="lotMismatchMsg" class="lot-msg"></p>
      <div class="lot-actions" style="margin-top:14px">
        <button class="btn btn-gray" id="lotMismatchCancelBtn" type="button">Cancel</button>
        <button class="btn" id="lotMismatchAutoBtn" type="button" style="background:#3498db;color:#fff">Auto Assign</button>
        <button class="btn btn-primary" id="lotMismatchOverrideBtn" type="button">Override THIS LOT</button>
      </div>
    </div>
  </div>
  <div id="setQtyOverlay" class="setqty-overlay" aria-hidden="true">
    <div class="setqty-card" role="dialog" aria-modal="true" aria-labelledby="setQtyTitle">
      <h3 id="setQtyTitle" class="setqty-title">Quick Set Note</h3>
      <div id="setQtyPreview" class="setqty-note-preview">Set of 2</div>
      <div class="setqty-controls">
        <button class="setqty-btn" id="setQtyMinusBtn" type="button">-</button>
        <span id="setQtyValue" class="setqty-value">2</span>
        <button class="setqty-btn" id="setQtyPlusBtn" type="button">+</button>
      </div>
      <div class="setqty-actions">
        <button class="btn btn-gray" id="setQtyCancelBtn" type="button">Cancel</button>
        <button class="btn btn-primary" id="setQtyApplyBtn" type="button">Set</button>
      </div>
    </div>
  </div>

  <script>
    // Loading overlay helpers
    function showPageLoading() {
      document.getElementById('pageLoadingOverlay').classList.add('active');
    }
    
    function hidePageLoading() {
      document.getElementById('pageLoadingOverlay').classList.remove('active');
    }
    
    function missingThumb(width=56,height=56,text='No Img'){return 'data:image/svg+xml;utf8,'+encodeURIComponent('<svg xmlns="http://www.w3.org/2000/svg" width="'+width+'" height="'+height+'"><rect width="100%" height="100%" fill="#f8f8f8"/><text x="50%" y="50%" dominant-baseline="middle" text-anchor="middle" fill="#b0b0b0" font-size="10">'+text+'</text></svg>');}

    const LOT_SCOPE_STORAGE_KEY = 'itemPrepLotScope';
    let selectedLot = null;
    let availableLots = [];
    let lotScope = 'current';
    let lotsReadyPromise = null;
    try {
      const savedScope = String(localStorage.getItem(LOT_SCOPE_STORAGE_KEY) || '').toLowerCase();
      lotScope = savedScope === 'all' ? 'all' : 'current';
    } catch (e) {
      lotScope = 'current';
    }
    let lotsLoaded = false;

    function getActiveLotNumber() {
      return lotScope === 'all' ? '' : (selectedLot || '');
    }

    function getActionLotNumber() {
      if (lotScope === 'all') return '';
      const actionLot = (currentLookupInfo && currentLookupInfo.action_lot)
        ? String(currentLookupInfo.action_lot).trim()
        : '';
      return actionLot || getActiveLotNumber();
    }

    function getLotQueryString() {
      const parts = [];
      const activeLot = getActiveLotNumber();
      if (activeLot) {
        parts.push('lot_number=' + encodeURIComponent(activeLot));
      }
      if (lotScope === 'all') {
        parts.push('lot_scope=all');
      }
      return parts.length ? ('&' + parts.join('&')) : '';
    }

    function withLotScope(payload) {
      const body = Object.assign({}, payload || {});
      body.lot_number = getActionLotNumber();
      body.lot_scope = lotScope;
      if (lotScope === 'current' && currentLookupInfo && currentLookupInfo.force_lot_override) {
        body.force_requested_lot = true;
      }
      return body;
    }

    function renderWorkingLotInfo() {
      const lotDate = document.getElementById('lotDate');
      if (!lotDate) return;
      if (lotScope === 'all') {
        lotDate.textContent = 'Mode: ALL LOTs';
        return;
      }
      const latestLot = availableLots.length > 0 ? availableLots[0] : null;
      if (!latestLot) {
        lotDate.textContent = 'Current LOT: none available';
        return;
      }
      lotDate.textContent = latestLot.import_date
        ? `Current LOT: ${latestLot.lot_number} (${latestLot.import_date})`
        : `Current LOT: ${latestLot.lot_number}`;
    }
    
    async function loadLots() {
      try {
        const r = await fetch('/api/lots');
        const j = await r.json();
        
        if (j.error) {
          console.error('Error loading lots:', j.error);
          return;
        }
        
        availableLots = j.lots || [];
        // "Current" always means latest LOT from BOL extractor.
        selectedLot = availableLots.length > 0 ? availableLots[0].lot_number : null;

        const scopeSelector = document.getElementById('lotScopeSelector');
        if (scopeSelector) {
          if (!lotsLoaded) {
            scopeSelector.value = lotScope;

            scopeSelector.addEventListener('change', async (e) => {
              lotScope = (e.target.value || 'current').toLowerCase() === 'all' ? 'all' : 'current';
              try { localStorage.setItem(LOT_SCOPE_STORAGE_KEY, lotScope); } catch (err) {}
              if (lotScope === 'current' && selectedLot) {
                try {
                  await fetch('/api/lots/select', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({lot_number: selectedLot})
                  });
                } catch(err) {
                  console.error('Failed to save lot selection:', err);
                }
              }
              renderWorkingLotInfo();
            });
            lotsLoaded = true;
          } else {
            scopeSelector.value = lotScope;
          }
        }

        if (selectedLot) {
          try {
            await fetch('/api/lots/select', {
              method: 'POST',
              headers: {'Content-Type': 'application/json'},
              body: JSON.stringify({lot_number: selectedLot})
            });
          } catch(err) {
            console.error('Failed to sync latest lot:', err);
          }
        }

        renderWorkingLotInfo();
      } catch(e) {
        console.error('Failed to load lots:', e);
        const lotDate = document.getElementById('lotDate');
        if (lotDate) lotDate.textContent = 'Error loading LOTs';
      }
    }
    
    function stopScanner(){ /* camera removed intentionally */ }

    function esc(s){return String(s||'').replace(/[&<>]/g, c=>({"&":"&amp;","<":"&lt;","<":"&lt;",">":"&gt;"}[c]));}

    let currentUpc = null; // Store the actual UPC returned from server (may be suffixed)
    let currentQty = 1; // Track quantity for visual display, start at 1
    let lastEntry = null; // Store last entry for undo: {upc, status, qty}
    let lookupInFlight = false;
    let queuedLookupUpc = null;
    let lookupDebounceTimer = null;
    let lastLookupFingerprint = {upc: '', ts: 0};
    let currentLookupInfo = null;
    const LOOKUP_DEDUPE_WINDOW_MS = 1200;

    function triggerLookupFromInput(rawUpc){
      const normalized = (rawUpc || '').trim();
      if(!normalized) return;
      const now = Date.now();

      if(lookupInFlight){
        queuedLookupUpc = normalized;
        return;
      }

      if(
        normalized === lastLookupFingerprint.upc &&
        (now - lastLookupFingerprint.ts) < LOOKUP_DEDUPE_WINDOW_MS
      ){
        return;
      }

      lastLookupFingerprint = {upc: normalized, ts: now};
      lookupInFlight = true;
      lookup(normalized)
        .catch((e)=>{ console.error('Lookup failed:', e); })
        .finally(()=>{
          lookupInFlight = false;
          const queued = (queuedLookupUpc || '').trim();
          queuedLookupUpc = null;
          if(queued && queued !== normalized){
            triggerLookupFromInput(queued);
          }
        });
    }

    function updateQtyDisplay(change) {
      let newQty = currentQty + change;
      if (newQty < 1) newQty = 1;
      currentQty = newQty;
      const qtyNumber = document.getElementById('qtyNumber');
      qtyNumber.textContent = currentQty;
      // Add a brief scale animation to show the change
      qtyNumber.style.transform = 'scale(1.2)';
      qtyNumber.style.color = change > 0 ? '#00b894' : '#e74c3c';
      setTimeout(() => {
        qtyNumber.style.transform = 'scale(1)';
        qtyNumber.style.color = '';
      }, 300);
    }

    function resetQtyDisplay() {
      currentQty = 1;
      document.getElementById('qtyNumber').textContent = '1';
      document.getElementById('qtyNumber').style.transform = 'scale(1)';
      document.getElementById('qtyNumber').style.color = '';
      document.getElementById('qtyDisplay').classList.add('hidden');
    }

    function showUndoButton() {
      const undoBtn = document.getElementById('undoBtn');
      undoBtn.classList.remove('hidden');
    }

    function hideUndoButton() {
      const undoBtn = document.getElementById('undoBtn');
      undoBtn.classList.add('hidden');
    }

    function currentBaseUpc(){
      const raw = (currentUpc || '').toString().trim();
      if(!raw) return '';
      return raw.includes('-') ? raw.split('-')[0] : raw;
    }

    function getItemsToListLinkFallback(){
      const base = currentBaseUpc();
      if(!base) return '/items-to-list';
      const p = new URLSearchParams();
      p.set('q', base);
      p.set('status', 'good,bad,unchecked');
      const lot = getActiveLotNumber();
      if(lot) p.set('lot', lot);
      return '/items-to-list?' + p.toString();
    }

    function clearCurrentResultCard(){
      const prepSummary = document.getElementById('prepSummary');
      if(prepSummary) prepSummary.textContent = '';
      const quickNoteEl = document.getElementById('quickPrepNote');
      if(quickNoteEl) quickNoteEl.value = '';
      closeSetQtyModal();
      document.getElementById('manualUpc').value = '';
      document.getElementById('result').classList.add('hidden');
      document.getElementById('actions').classList.add('hidden');
      document.getElementById('noBarcodeBtn').classList.remove('hidden');
      currentUpc = null;
      currentLookupInfo = null;
      resetQtyDisplay();
      setupDeviceMode();
    }

    function promptLotMismatchResolution(opts){
      return new Promise((resolve)=>{
        const info = opts || {};
        const overlay = document.getElementById('lotMismatchOverlay');
        const msg = document.getElementById('lotMismatchMsg');
        const cancelBtn = document.getElementById('lotMismatchCancelBtn');
        const autoBtn = document.getElementById('lotMismatchAutoBtn');
        const overrideBtn = document.getElementById('lotMismatchOverrideBtn');
        if(!overlay || !msg || !cancelBtn || !autoBtn || !overrideBtn){
          resolve('cancel');
          return;
        }

        const requestedLot = String(info.requested_lot || getActiveLotNumber() || '').trim();
        const resolvedLot = String(info.resolved_lot || '').trim();
        const upcLabel = String(info.upc || currentBaseUpc() || '').trim();
        const allowOverride = info.allow_override !== false;
        const mode = String(info.mode || 'mismatch').toLowerCase();
        overrideBtn.style.display = allowOverride ? '' : 'none';

        if(mode === 'missing'){
          msg.textContent = [
            `UPC ${upcLabel || '(unknown)'} is not found in LOT ${requestedLot || '(current)'} or any known LOT.`,
            'Auto Assign will find a matching LOT if available, or create an uncategorized LOT entry for this UPC.'
          ].join('\n');
        } else {
          msg.textContent = [
            `UPC ${upcLabel || '(unknown)'} is not from current LOT ${requestedLot || '(current)'}.`,
            resolvedLot ? `Detected LOT: ${resolvedLot}.` : 'Detected LOT is unavailable.',
            'Choose Override THIS LOT to force current LOT, or Auto Assign to use its matching lot.'
          ].join('\n');
        }

        const closeWith = (choice)=>{
          overlay.classList.remove('active');
          overlay.setAttribute('aria-hidden', 'true');
          cancelBtn.onclick = null;
          autoBtn.onclick = null;
          overrideBtn.onclick = null;
          resolve(choice);
        };

        cancelBtn.onclick = ()=> closeWith('cancel');
        autoBtn.onclick = ()=> closeWith('auto');
        overrideBtn.onclick = ()=> closeWith('override');
        overlay.classList.add('active');
        overlay.setAttribute('aria-hidden', 'false');
      });
    }

    async function autoAssignLotForUpc(upcRaw){
      const upc = String(upcRaw || '').trim();
      if(!upc) return {success:false, error:'Missing upc'};
      const payload = {
        upc: upc,
        lot_number: getActiveLotNumber(),
        lot_scope: lotScope
      };
      const r = await fetch('/api/items_prep/auto_assign_lot', {
        method: 'POST',
        headers: {'Content-Type':'application/json'},
        body: JSON.stringify(payload)
      });
      return r.json().catch(()=>({success:false, error:'Auto-assign failed'}));
    }

    async function updateQuantity(upc, qty) {
      try {
        const r = await fetch('/api/bol_items/quantity', {
          method: 'POST',
          headers: {'Content-Type': 'application/json'},
          body: JSON.stringify({upc, quantity: qty})
        });
        const j = await r.json();
        return j && j.success;
      } catch(e) {
        console.error('Failed to update quantity:', e);
        return false;
      }
    }

    async function lookup(upc){
      const lotQ = getLotQueryString();
      const r = await fetch('/api/bol_lookup?upc='+encodeURIComponent(upc)+lotQ);
      let j = await r.json();
      const resEl = document.getElementById('result');
      const actions = document.getElementById('actions');
      const statusMsg = document.getElementById('statusMsg');
      let forcedActionLot = '';
      let forcedLotOverride = false;
      let lotDecisionNote = '';
      if(!j.found){
        resEl.classList.add('hidden'); actions.classList.add('hidden');
        document.getElementById('noBarcodeBtn').classList.remove('hidden');
        statusMsg.innerHTML = '<span class="bad">Not found in BOL</span>';
        setTimeout(()=>{ statusMsg.textContent=''; }, 1000);
        currentUpc = null;
        currentLookupInfo = null;
        const prepSummary = document.getElementById('prepSummary');
        if(prepSummary) prepSummary.textContent = '';
        // Auto-clear the input after lookup completes
        document.getElementById('manualUpc').value = '';
        return;
      }
      const it = j.item||{};
      currentUpc = it.upc || upc; // Store the actual UPC (may be suffixed if duplicate)
      currentLookupInfo = {
        unchecked_remaining: Number(it.unchecked_remaining || 0),
        items_to_list_url: it.items_to_list_url || '',
        overage_candidate: !!it.is_overage_candidate,
        action_lot: forcedActionLot || '',
        force_lot_override: !!forcedLotOverride,
        lot_decision_note: lotDecisionNote || ''
      };
      if(lotScope === 'current' && !forcedActionLot && (j.lot_mismatch || (it && it.lot_mismatch))){
        const requestedLot = String(j.requested_lot || it.requested_lot || getActiveLotNumber() || '').trim();
        const resolvedLot = String(j.resolved_lot || it.resolved_lot || it.lot_number || '').trim();
        const activeLot = requestedLot || getActiveLotNumber();
        currentLookupInfo.action_lot = activeLot;
        currentLookupInfo.force_lot_override = true;
        currentLookupInfo.lot_mismatch_flagged = true;
        if(activeLot){
          currentLookupInfo.lot_decision_note = resolvedLot
            ? `Flagged lot mismatch: found in ${resolvedLot}, processing under current lot ${activeLot}.`
            : `Flagged lot mismatch: processing under current lot ${activeLot}.`;
        } else {
          currentLookupInfo.lot_decision_note = 'Flagged lot mismatch: processing under current lot override.';
        }
      }
      const thumbImg = document.getElementById('thumb');
      const addThumbBtn = document.getElementById('addThumbBtn');
      const hasImage = it.image_url && it.image_url.trim() && it.image_url !== 'nan' && it.image_url !== 'None';
      
      console.log('Item lookup:', {upc: it.upc, image_url: it.image_url, hasImage: hasImage});
      
      thumbImg.src = hasImage ? it.image_url : missingThumb();
      // Show camera button if no image
      if(addThumbBtn) {
        addThumbBtn.style.display = hasImage ? 'none' : 'block';
        console.log('Camera button display set to:', addThumbBtn.style.display);
      } else {
        console.error('addThumbBtn element not found!');
      }
      
      const hero = document.getElementById('hero'); hero.style.display=''; hero.src = it.image_url || '';
      document.getElementById('title').textContent = it.item_description || '';
      document.getElementById('upcTxt').textContent = it.upc || '';
      const prepSummary = document.getElementById('prepSummary');
      if(prepSummary){
        const lotNote = (currentLookupInfo && currentLookupInfo.lot_decision_note)
          ? ('<span class="bad">' + esc(currentLookupInfo.lot_decision_note) + '</span>')
          : '';
        if(currentLookupInfo.overage_candidate){
          prepSummary.innerHTML = '<span class="bad">BOL unchecked quantity is already exhausted. Processing will continue and be flagged automatically.</span>' + (lotNote ? '<br>' + lotNote : '');
        } else {
          prepSummary.innerHTML = lotNote || '';
        }
      }
      clearQuickPrepNote();
      resEl.classList.remove('hidden'); actions.classList.remove('hidden');
      statusMsg.textContent='';
      // Hide No Barcode button when item is displayed
      document.getElementById('noBarcodeBtn').classList.add('hidden');
      // Reset and show quantity display
      resetQtyDisplay();
      document.getElementById('qtyDisplay').classList.remove('hidden');
      // Auto-clear the input after lookup completes
      document.getElementById('manualUpc').value = '';
      // Scroll to the result section
      setTimeout(() => {
        resEl.scrollIntoView({ behavior: 'smooth', block: 'start' });
      }, 100);
    }

    async function setStatus(upc, status, qty, extraPayload){
      const payload = Object.assign({upc, status, qty}, extraPayload || {});
      return postWithLotFallback('/api/items_prep/status', payload);
    }

    function getQuickPrepNoteText(){
      const el = document.getElementById('quickPrepNote');
      return el ? String(el.value || '').trim() : '';
    }

    function clearQuickPrepNote(){
      const el = document.getElementById('quickPrepNote');
      if(el) el.value = '';
    }

    let setQtyModalValue = 2;
    let setQtyModalMode = 'manual';
    let setQtyModalResolver = null;

    function getSetQtyDismissChoice(){
      return 'cancel';
    }

    function updateSetQtyModalUi(){
      setQtyModalValue = Math.max(1, Math.min(99, parseInt(setQtyModalValue, 10) || 1));
      const qtyEl = document.getElementById('setQtyValue');
      const previewEl = document.getElementById('setQtyPreview');
      if(qtyEl) qtyEl.textContent = String(setQtyModalValue);
      if(previewEl) previewEl.textContent = `Set of ${setQtyModalValue}`;
    }

    function appendSetQtyNote(qty, showMessage=true){
      const safeQty = Math.max(1, parseInt(qty, 10) || 1);
      const noteText = `Set of ${safeQty}`;
      const noteEl = document.getElementById('quickPrepNote');
      if(noteEl){
        const existing = String(noteEl.value || '').trim();
        noteEl.value = existing ? `${existing} | ${noteText}` : noteText;
        noteEl.focus();
        try {
          noteEl.setSelectionRange(noteEl.value.length, noteEl.value.length);
        } catch(e) {}
      }
      if(showMessage){
        const statusMsg = document.getElementById('statusMsg');
        if(statusMsg){
          statusMsg.innerHTML = `<span class="ok">Note added: ${noteText}</span>`;
          setTimeout(()=>{ statusMsg.textContent=''; }, 1200);
        }
      }
    }

    function closeSetQtyModal(choice='cancel'){
      const overlay = document.getElementById('setQtyOverlay');
      if(!overlay) return;
      overlay.classList.remove('active');
      overlay.setAttribute('aria-hidden', 'true');
      if(setQtyModalResolver){
        try{ setQtyModalResolver({choice, qty: setQtyModalValue}); }catch(e){}
        setQtyModalResolver = null;
      }
    }

    function openSetQtyModal(mode='manual'){
      if(!currentUpc){
        const statusMsg = document.getElementById('statusMsg');
        if(statusMsg){
          statusMsg.innerHTML = '<span class="bad">Lookup an item first</span>';
          setTimeout(()=>{ statusMsg.textContent=''; }, 1200);
        }
        return Promise.resolve({choice:'blocked', qty:setQtyModalValue});
      }
      setQtyModalMode = mode || 'manual';
      setQtyModalValue = setQtyModalMode === 'plate_check' ? 1 : Math.max(2, currentQty || 2);
      updateSetQtyModalUi();
      const overlay = document.getElementById('setQtyOverlay');
      const titleEl = document.getElementById('setQtyTitle');
      const cancelBtn = document.getElementById('setQtyCancelBtn');
      const applyBtn = document.getElementById('setQtyApplyBtn');
      if(titleEl && cancelBtn && applyBtn){
        if(setQtyModalMode === 'plate_check'){
          titleEl.textContent = 'Is this a set?';
          cancelBtn.textContent = 'Cancel';
          applyBtn.textContent = 'Continue';
        } else {
          titleEl.textContent = 'Quick Set Note';
          cancelBtn.textContent = 'Cancel';
          applyBtn.textContent = 'Set';
        }
      }
      if(overlay){
        overlay.classList.add('active');
        overlay.setAttribute('aria-hidden', 'false');
      }
      return new Promise((resolve)=>{
        setQtyModalResolver = resolve;
      });
    }

    function applySetQtyNote(){
      if(setQtyModalMode === 'plate_check'){
        if(setQtyModalValue > 1){
          appendSetQtyNote(setQtyModalValue, false);
        }
        closeSetQtyModal('continue');
        return;
      }
      appendSetQtyNote(setQtyModalValue, true);
      closeSetQtyModal('set');
    }

    function shouldPromptPlateSet(){
      const titleText = String((document.getElementById('title') || {}).textContent || '').trim();
      return /\b(plate|napkin)s?\b/i.test(titleText);
    }

    async function maybeRunPlateSetPrompt(){
      if(!shouldPromptPlateSet()) return true;
      const res = await openSetQtyModal('plate_check');
      return !!res && res.choice === 'continue';
    }

    async function savePrepNote(upc, note){
      const upcN = String(upc || '').trim();
      const noteN = String(note || '').trim();
      if(!upcN || !noteN) return {success:false, error:'Missing upc or note'};
      const r = await fetch('/api/items_prep/notes', {
        method: 'POST',
        headers: {'Content-Type':'application/json'},
        body: JSON.stringify({upc: upcN, note: noteN})
      });
      return r.json().catch(() => ({success:false, error:'Failed to save note'}));
    }

    async function postWithLotFallback(url, payload){
      let body = withLotScope(payload);
      let r = await fetch(url, {method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify(body)});
      let j = await r.json().catch(() => ({}));
      if(j && j.lot_match_error && !body.allow_no_lot){
        // Auto-override to current lot without prompting.
        const overrideLot = (body.lot_number || getActionLotNumber() || getActiveLotNumber() || '').toString().trim();
        body.allow_no_lot = false;
        body.force_requested_lot = true;
        body.lot_number = overrideLot;
        r = await fetch(url, {method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify(body)});
        j = await r.json().catch(() => ({}));
        if(j && typeof j === 'object'){
          j.forced_lot_override = true;
        }
      }
      return j;
    }
    

    document.getElementById('lookupBtn').onclick = ()=>{ triggerLookupFromInput(document.getElementById('manualUpc').value); };
    
    // Temporary thumbnail upload
    const addThumbBtn = document.getElementById('addThumbBtn');
    const tempThumbInput = document.getElementById('tempThumbInput');
    if(addThumbBtn && tempThumbInput){
      addThumbBtn.onclick = (e)=>{
        e.preventDefault();
        e.stopPropagation();
        tempThumbInput.click();
      };
      
      tempThumbInput.onchange = async ()=>{
        const file = tempThumbInput.files[0];
        if(!file || !currentUpc) return;
        
        const loadingOverlay = document.getElementById('thumbLoadingOverlay');
        const goodBtn = document.getElementById('goodBtn');
        const badBtn = document.getElementById('badBtn');
        
        // Show loading, disable buttons
        loadingOverlay.style.display = 'flex';
        goodBtn.disabled = true;
        badBtn.disabled = true;
        
        try{
          const fd = new FormData();
          fd.append('photo', file);
          const res = await fetch('/api/items_prep/diagnostic/' + encodeURIComponent(currentUpc) + '/photos', {method:'POST', body: fd});
          const j = await res.json();
          if(!j.success || !j.images || j.images.length === 0){
            alert('Failed to upload image: ' + (j.error || 'Unknown error'));
            return;
          }
          const img = j.images[0];
          // Set as display image
          const setRes = await fetch('/api/items_prep/set_display_image', {
            method: 'POST',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify({ upc: currentUpc, image_path: img.image_path })
          });
          const setJ = await setRes.json();
          if(setJ.success){
            // Clear cache so next lookup will show new image
            await fetch('/api/clear_cache?upc=' + encodeURIComponent(currentUpc));
            
            // Update thumbnails
            const thumbImg = document.getElementById('thumb');
            const heroImg = document.getElementById('hero');
            thumbImg.src = setJ.image_url + '?t=' + Date.now();
            heroImg.src = setJ.image_url + '?t=' + Date.now();
            heroImg.style.display = '';
            addThumbBtn.style.display = 'none';
          } else {
            alert('Image uploaded but failed to set as display: ' + (setJ.error || 'Unknown'));
          }
        }catch(e){
          alert('Error uploading thumbnail: ' + e);
        } finally {
          // Hide loading, re-enable buttons
          loadingOverlay.style.display = 'none';
          goodBtn.disabled = false;
          badBtn.disabled = false;
          tempThumbInput.value = ''; // Reset input
        }
      };
    }
    
    document.getElementById('qtyPlusBtn').onclick = ()=>{ updateQtyDisplay(1); };
    document.getElementById('qtyMinusBtn').onclick = ()=>{ updateQtyDisplay(-1); };
    const setNoteBtn = document.getElementById('setNoteBtn');
    const setQtyMinusBtn = document.getElementById('setQtyMinusBtn');
    const setQtyPlusBtn = document.getElementById('setQtyPlusBtn');
    const setQtyCancelBtn = document.getElementById('setQtyCancelBtn');
    const setQtyApplyBtn = document.getElementById('setQtyApplyBtn');
    const setQtyOverlay = document.getElementById('setQtyOverlay');

    if(setNoteBtn) setNoteBtn.onclick = ()=>{ openSetQtyModal('manual'); };
    if(setQtyMinusBtn) setQtyMinusBtn.onclick = ()=>{ setQtyModalValue -= 1; updateSetQtyModalUi(); };
    if(setQtyPlusBtn) setQtyPlusBtn.onclick = ()=>{ setQtyModalValue += 1; updateSetQtyModalUi(); };
    if(setQtyCancelBtn) setQtyCancelBtn.onclick = ()=>{ closeSetQtyModal(getSetQtyDismissChoice()); };
    if(setQtyApplyBtn) setQtyApplyBtn.onclick = applySetQtyNote;
    if(setQtyOverlay){
      setQtyOverlay.addEventListener('click', (e)=>{
        if(e.target === setQtyOverlay) closeSetQtyModal(getSetQtyDismissChoice());
      });
    }
    document.addEventListener('keydown', (e)=>{
      if(e.key === 'Escape' && setQtyOverlay && setQtyOverlay.classList.contains('active')){
        closeSetQtyModal(getSetQtyDismissChoice());
      }
    });
    
    document.getElementById('undoBtn').onclick = async ()=>{
      if(!lastEntry) return;
      if(!confirm('Undo last entry for UPC: ' + lastEntry.upc + '?')) return;
      const statusMsg = document.getElementById('statusMsg');
      try {
        // Call the unified undo endpoint
        const res = await fetch('/api/items_prep/undo', {
          method: 'POST',
          headers: {'Content-Type': 'application/json'},
          body: JSON.stringify({
            upc: lastEntry.upc,
            status: lastEntry.status,
            action: lastEntry.action,
            previousQty: lastEntry.previousQty,
            base_upc: lastEntry.base_upc,
            qty: lastEntry.qty,
            lot_number: lastEntry.lot_number || getActiveLotNumber(),
            lot_scope: lotScope
          })
        });
        
        const data = await res.json();
        if (data.success) {
          statusMsg.innerHTML='<span class="ok">✓ Undone</span>';
          lastEntry = null;
          hideUndoButton();
          setTimeout(()=>{ statusMsg.textContent=''; }, 2000);
        } else {
          statusMsg.innerHTML='<span class="bad">Failed to undo: ' + (data.error || 'Unknown error') + '</span>';
          setTimeout(()=>{ statusMsg.textContent=''; }, 2000);
        }
      } catch(e) {
        console.error('Undo error:', e);
        statusMsg.innerHTML='<span class="bad">Failed to undo</span>';
        setTimeout(()=>{ statusMsg.textContent=''; }, 2000);
      }
    };
    
    document.getElementById('goodBtn').onclick = async ()=>{
      if(!currentUpc) return;
      const continueAction = await maybeRunPlateSetPrompt();
      if(!continueAction) return;
      const quickNote = getQuickPrepNoteText();
      
      // Show loading overlay
      showPageLoading();
      
      let result = await setStatus(currentUpc, 'good', currentQty, quickNote ? {note: quickNote} : undefined);
      const statusMsg = document.getElementById('statusMsg');
      
      if(result && result.success){ 
        let noteSaveError = '';
        const resultUpc = result.upc || currentUpc;
        const resultBaseUpc = result.base_upc || (String(resultUpc || '').includes('-') ? String(resultUpc).split('-')[0] : String(resultUpc || currentUpc || ''));
        if(quickNote){
          try{
            const noteResp = await savePrepNote(resultUpc, quickNote);
            if(noteResp && noteResp.success){
              clearQuickPrepNote();
            }else{
              noteSaveError = ' (note not saved)';
            }
          }catch(e){
            noteSaveError = ' (note not saved)';
          }
        }
        // Store for undo with action type
        lastEntry = {
          upc: resultUpc, 
          base_upc: resultBaseUpc || null,
          status: 'good', 
          qty: currentQty,
          action: result.action, // 'incremented' or 'created'
          previousQty: result.action === 'incremented' ? (result.quantity - currentQty) : 0,
          lot_number: result.lot_number || getActionLotNumber()
        };
        showUndoButton();
        const exceptionTag = result.exception_overage ? ' <span class="bad">(saved as exception)</span>' : '';
        const forcedTag = result.forced_lot_override ? (' <span class="bad">(forced current LOT ' + esc(result.lot_number || '') + ', flagged)</span>') : '';
        statusMsg.innerHTML='<span class="ok">Marked GOOD (Qty: '+currentQty+')</span>' + exceptionTag + forcedTag + (noteSaveError ? (' <span class="bad">' + noteSaveError + '</span>') : '');
      } else { 
        const errorMsg = result && result.error ? result.error : 'Unknown error';
        console.error('Failed to mark good:', result);
        statusMsg.innerHTML='<span class="bad">Failed: ' + errorMsg + '</span>'; 
      }
      setTimeout(()=>{ hidePageLoading(); statusMsg.textContent=''; clearCurrentResultCard(); }, 3000);
    };

    document.getElementById('returnBtn').onclick = async ()=>{
      if(!currentUpc) return;
      
      // Show loading overlay
      showPageLoading();
      
      // Create a suffixed entry with status "good" and reason "return"
      try {
        const data = await postWithLotFallback('/api/items_prep/create_return_entry', {
          upc: currentUpc,
          qty: currentQty
        });
        
        if (data.success) {
          const statusMsg = document.getElementById('statusMsg');
          const autoHint = data.auto_assigned ? (` <span class="bad">(auto-assigned LOT ${esc(data.lot_number || '')})</span>`) : '';
          const forcedHint = data.forced_lot_override ? (` <span class="bad">(forced current LOT ${esc(data.lot_number || '')}, flagged)</span>`) : '';
          const noLotHint = data.continued_without_lot ? ' <span class="bad">(continued with no LOT)</span>' : '';
          statusMsg.innerHTML='<span class="ok">Return entry created: ' + data.suffixed_upc + ' (Qty: '+currentQty+')</span>' + autoHint + forcedHint + noLotHint;
          
          // Store for undo
          lastEntry = {
            upc: data.suffixed_upc,
            status: 'return', 
            qty: currentQty,
            action: 'return',
            lot_number: data.lot_number || getActionLotNumber()
          };
          showUndoButton();
        } else {
          hidePageLoading();
          if(!data.cancelled){
            alert('Error creating return entry: ' + (data.error || 'Unknown error'));
          }
        }
      } catch(e) {
        hidePageLoading();
        console.error('Return button error:', e);
        alert('Error creating return entry');
      }
      
      setTimeout(()=>{ 
        hidePageLoading();
        const statusMsg = document.getElementById('statusMsg');
        statusMsg.textContent=''; 
        clearCurrentResultCard();
      }, 3000);
    };

    document.getElementById('badBtn').onclick = async ()=>{
      if(!currentUpc) return;
      const continueAction = await maybeRunPlateSetPrompt();
      if(!continueAction) return;
      const quickNote = getQuickPrepNoteText();
      
      // Show loading overlay
      showPageLoading();
      
      // Call API to create temporary suffixed entry for Bad flow
      try {
        let data = await postWithLotFallback('/api/items_prep/create_bad_entry', {
          upc: currentUpc,
          qty: currentQty
        });
        
        if (data.success && data.suffixed_upc) {
          if(quickNote){
            try{
              const noteResp = await savePrepNote(data.suffixed_upc || currentUpc, quickNote);
              if(noteResp && noteResp.success){
                clearQuickPrepNote();
              }
            }catch(e){}
          }
          // Store for undo
          lastEntry = {upc: data.suffixed_upc, status: 'bad', qty: currentQty, base_upc: currentUpc, lot_number: data.lot_number || getActionLotNumber() || ''};
          sessionStorage.setItem('lastEntry', JSON.stringify(lastEntry));
          
          updateQtyDisplay(-1); // Show -1 animation
          
          setTimeout(() => {
            const lotParam = data.lot_number || getActionLotNumber() || '';
            const lotQuery = lotParam ? ('&lot=' + encodeURIComponent(lotParam)) : '';
            const requestedLotParam = data.requested_lot || getActionLotNumber() || '';
            const requestedLotQuery = requestedLotParam ? ('&requested_lot=' + encodeURIComponent(requestedLotParam)) : '';
            const noLotQuery = data.continued_without_lot ? '&continued_without_lot=1' : '';
            const exceptionOverageQuery = data.exception_overage ? '&exception_overage=1' : '';
            window.location.href = '/item-prep/diagnostic?upc='+encodeURIComponent(data.suffixed_upc)+'&from=bad&qty='+currentQty+lotQuery+requestedLotQuery+noLotQuery+exceptionOverageQuery+'&return='+encodeURIComponent('/item-prep?forceFocus=1&showUndo=1');
          }, 300);
        } else {
          hidePageLoading();
          if(!data.cancelled){
            alert('Error creating bad entry: ' + (data.error || 'Unknown error'));
          }
        }
      } catch(e) {
        hidePageLoading();
        console.error('Bad button error:', e);
        alert('Error creating bad entry');
      }
    };

    document.getElementById('skipBtn').onclick = async ()=>{ 
      if (currentUpc) {
        // Cleanup temporary entry if it exists
        try {
          await fetch('/api/items_prep/cleanup_temp', {
            method: 'POST',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify({upc: currentUpc})
          });
        } catch(e) {
          console.error('Cleanup error:', e);
        }
      }
      clearCurrentResultCard();
    };

    // Device detection similar to barcode.html
    function getDeviceType(){
      const ua = navigator.userAgent;
      if (/iPad|Macintosh/.test(ua) && 'ontouchend' in document) return 'iPad';
      if (/Android/.test(ua) && !/Mobile/.test(ua)) return 'Android Tablet';
      if (/iPhone|Android.*Mobile|Windows Phone|webOS|BlackBerry|Opera Mini|IEMobile|Mobile/.test(ua)) return 'Mobile';
      return 'Desktop';
    }
    function setupDeviceMode(){
      const input = document.getElementById('manualUpc');
      stopScanner();
      if (input){
        input.style.display='';
        try{ input.focus({preventScroll:true}); if(input.select) input.select(); }catch{}
      }
    }
    // Treat Enter, input idle, or change as a trigger for lookup (works well with USB scanners on desktop)
    const manual = document.getElementById('manualUpc');
    manual.addEventListener('keydown', (e)=>{
      if (e.key === 'Enter'){
        e.preventDefault();
        if(lookupDebounceTimer){ clearTimeout(lookupDebounceTimer); lookupDebounceTimer = null; }
        triggerLookupFromInput(manual.value);
      }
    });
    manual.addEventListener('input', ()=>{
      if(lookupDebounceTimer){ clearTimeout(lookupDebounceTimer); }
      const v = manual.value.trim();
      if(!v) return;
      const delayMs = v.length >= 8 ? 140 : 240;
      lookupDebounceTimer = setTimeout(()=>{
        lookupDebounceTimer = null;
        triggerLookupFromInput(manual.value);
      }, delayMs);
    });
    manual.addEventListener('change', ()=>{
      if(lookupDebounceTimer){ clearTimeout(lookupDebounceTimer); lookupDebounceTimer = null; }
      triggerLookupFromInput(manual.value);
    });

    function ensureUpcFocus(){
      const input = document.getElementById('manualUpc');
      if(!input) return;
      try{ input.focus({preventScroll:true}); if(input.select) input.select(); }catch{}
      // Retry a few times in case something steals focus on load
      let attempts = 0;
      const timer = setInterval(()=>{
        attempts++;
        if(document.activeElement !== input){
          try{ input.focus({preventScroll:true}); if(input.select) input.select(); }catch{}
        }
        if(document.activeElement === input || attempts >= 6){ clearInterval(timer); }
      }, 120);
    }

    window.addEventListener('DOMContentLoaded', async ()=>{
      lotsReadyPromise = loadLots(); // Load LOT selector first
      await lotsReadyPromise;
      setupDeviceMode();
      // If no UPC param, focus the manual input for quick scanning/typing
      try{
        const params = new URLSearchParams(window.location.search);
        const upc = (params.get('upc')||'').trim();
        const forceFocus = (params.get('forceFocus')||'') === '1';
        const showUndo = (params.get('showUndo')||'') === '1';
        
        // Restore undo button if returning from diagnostic with showUndo flag
        if(showUndo){
          const stored = sessionStorage.getItem('lastEntry');
          if(stored){
            try{
              lastEntry = JSON.parse(stored);
              showUndoButton();
              sessionStorage.removeItem('lastEntry'); // Clean up after restoring
            }catch(e){ console.error('Failed to restore lastEntry:', e); }
          }
        }
        
        if(forceFocus){
          // Force manual mode focus regardless of device; stop scanner and focus/select input
          try{ stopScanner(); }catch{}
          const scannerDiv = document.getElementById('scanner'); if(scannerDiv) scannerDiv.style.display = 'none';
          ensureUpcFocus();
          // Clean the URL so future reloads aren't affected
          try{ const url = new URL(window.location.href); url.searchParams.delete('forceFocus'); url.searchParams.delete('showUndo'); window.history.replaceState({}, '', url.toString()); }catch{}
        } else if(!upc){
          ensureUpcFocus();
        }
      }catch{}
    });
    window.addEventListener('beforeunload', stopScanner);

    // Auto-trigger lookup if ?upc= is provided OR if coming from no-barcode page
    window.addEventListener('DOMContentLoaded', async ()=>{
      try{
        if (lotsReadyPromise) {
          try { await lotsReadyPromise; } catch (e) {}
        }
        const params = new URLSearchParams(window.location.search);
        let upc = (params.get('upc')||'').trim();
        
        // Check sessionStorage for UPC from no-barcode search
        if(!upc){
          const savedUpc = sessionStorage.getItem('prepUpc');
          if(savedUpc){
            upc = savedUpc.trim();
            sessionStorage.removeItem('prepUpc'); // Clear after use
          }
        }
        
        if(upc){
          document.getElementById('manualUpc').value = upc;
          await lookup(upc);
          if (currentUpc) {
            // stop scanner while viewing result
            stopScanner();
            // Ensure result is visible and actions are big
            document.getElementById('result').classList.remove('hidden');
            document.getElementById('actions').classList.remove('hidden');
            // Hide No Barcode button when item is displayed
            document.getElementById('noBarcodeBtn').classList.add('hidden');
          }
        }
      }catch(e){}
    });
  </script>
