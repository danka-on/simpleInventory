<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Prep Log</title>
  <style>
    * { box-sizing: border-box; margin: 0; }

    body {
      font-family: 'Segoe UI', system-ui, sans-serif;
      background: #f1f5f9;
      margin: 0;
      padding: 24px;
      color: #1e293b;
    }

    /* ── Header ── */
    .header {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 20px;
      max-width: 900px;
      margin-left: auto;
      margin-right: auto;
    }
    .header h1 {
      flex: 1;
      text-align: center;
      font-size: 1.3rem;
      font-weight: 700;
      color: #0f172a;
    }
    .btn {
      padding: 10px 20px;
      border-radius: 10px;
      border: none;
      cursor: pointer;
      font-size: 0.95rem;
      font-weight: 600;
      transition: opacity 0.15s;
    }
    .btn:hover { opacity: 0.85; }
    .btn:disabled { opacity: 0.35; cursor: not-allowed; }
    .btn-back { background: #e2e8f0; color: #475569; text-decoration: none; display: inline-block; }
    .btn-undo { background: #ef4444; color: #fff; padding: 8px 16px; font-size: 0.85rem; }
    .btn-gray { background: #64748b; color: #fff; }

    /* ── Toolbar ── */
    .toolbar {
      max-width: 900px;
      margin: 0 auto 16px;
      display: flex;
      gap: 10px;
      align-items: center;
      flex-wrap: wrap;
    }
    .toolbar input[type="text"] {
      flex: 1;
      min-width: 180px;
      padding: 11px 14px;
      font-size: 1rem;
      border: 1.5px solid #e2e8f0;
      border-radius: 10px;
      background: #fff;
      color: #1e293b;
      outline: none;
    }
    .toolbar input:focus { border-color: #94a3b8; }
    .toolbar input::placeholder { color: #94a3b8; }
    .toolbar-filters {
      display: flex;
      gap: 12px;
      align-items: center;
      flex-wrap: wrap;
    }
    .toolbar-filters label {
      display: flex;
      gap: 5px;
      align-items: center;
      font-size: 0.85rem;
      color: #64748b;
      cursor: pointer;
      white-space: nowrap;
    }
    .toolbar-filters input[type="checkbox"] {
      width: 16px;
      height: 16px;
      accent-color: #3b82f6;
    }
    .count { font-size: 0.85rem; color: #94a3b8; font-weight: 500; }

    /* ── Log list ── */
    .log-list {
      max-width: 900px;
      margin: 0 auto;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    /* ── Single log row ── */
    .entry {
      display: flex;
      align-items: center;
      gap: 14px;
      background: #fff;
      border: 1px solid #e2e8f0;
      border-radius: 12px;
      padding: 12px 16px;
    }
    .entry.undone { opacity: 0.4; }

    .entry-num {
      font-size: 1.1rem;
      font-weight: 700;
      color: #94a3b8;
      min-width: 32px;
      text-align: center;
      flex-shrink: 0;
    }

    .entry-thumb {
      width: 56px;
      height: 56px;
      border-radius: 8px;
      object-fit: cover;
      background: #f1f5f9;
      flex-shrink: 0;
      cursor: pointer;
      border: 1px solid #e2e8f0;
    }
    .entry-thumb:hover { border-color: #3b82f6; }
    .entry-thumb-placeholder {
      width: 56px;
      height: 56px;
      border-radius: 8px;
      background: #f1f5f9;
      flex-shrink: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #cbd5e1;
      font-size: 1.2rem;
      border: 1px solid #e2e8f0;
    }

    .entry-info {
      flex: 1;
      min-width: 0;
    }
    .entry-title {
      font-weight: 600;
      font-size: 0.95rem;
      color: #1e293b;
      display: flex;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
    }
    .entry-meta {
      font-size: 0.82rem;
      color: #94a3b8;
      margin-top: 3px;
    }

    .status {
      display: inline-block;
      padding: 2px 8px;
      border-radius: 4px;
      font-size: 0.75rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.02em;
    }
    .status-good { background: #dcfce7; color: #16a34a; }
    .status-bad { background: #fee2e2; color: #dc2626; }
    .status-return { background: #dbeafe; color: #2563eb; }

    .entry-actions {
      flex-shrink: 0;
    }

    .note-line {
      font-size: 0.82rem;
      color: #64748b;
      margin-top: 2px;
      font-style: italic;
    }

    .empty {
      text-align: center;
      padding: 48px 16px;
      color: #94a3b8;
    }
    .bad { color: #dc2626; }

    /* ── Photo modal ── */
    .modal-bg {
      position: fixed;
      inset: 0;
      background: rgba(15,23,42,0.6);
      backdrop-filter: blur(4px);
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 9999;
      padding: 20px;
    }
    .modal {
      background: #fff;
      border-radius: 14px;
      width: min(800px, 95vw);
      max-height: 88vh;
      overflow: auto;
      padding: 20px;
      box-shadow: 0 20px 60px rgba(0,0,0,0.15);
    }
    .modal-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 12px;
    }
    .modal-header strong { font-size: 1.05rem; }
    .modal-close {
      background: #e2e8f0;
      border: none;
      border-radius: 8px;
      padding: 8px 16px;
      cursor: pointer;
      font-weight: 600;
      font-size: 0.9rem;
    }
    .preview-box {
      background: #f8fafc;
      border: 1px solid #e2e8f0;
      border-radius: 10px;
      padding: 10px;
      min-height: 200px;
      display: flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 12px;
    }
    .preview-box img { max-width: 100%; max-height: 50vh; border-radius: 8px; }
    .thumb-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(90px, 1fr));
      gap: 6px;
    }
    .thumb-btn {
      border: 2px solid transparent;
      border-radius: 8px;
      background: #f1f5f9;
      padding: 2px;
      cursor: pointer;
    }
    .thumb-btn:hover { border-color: #3b82f6; }
    .thumb-btn img {
      width: 100%;
      height: 80px;
      object-fit: cover;
      border-radius: 6px;
      display: block;
    }
    .muted { color: #94a3b8; font-size: 0.85rem; }

    /* ── iPad (primary target) ── */
    @media (min-width: 768px) and (max-width: 1024px) {
      body { padding: 28px 36px; }
      .entry { padding: 14px 18px; gap: 16px; }
      .entry-thumb, .entry-thumb-placeholder { width: 64px; height: 64px; }
      .entry-title { font-size: 1rem; }
      .entry-meta { font-size: 0.88rem; }
      .btn-undo { padding: 10px 18px; font-size: 0.9rem; }
    }

    /* ── Mobile ── */
    @media (max-width: 767px) {
      body { padding: 14px; }
      .entry { padding: 10px 12px; gap: 10px; }
      .entry-num { font-size: 0.95rem; min-width: 24px; }
      .entry-thumb, .entry-thumb-placeholder { width: 44px; height: 44px; }
      .entry-title { font-size: 0.88rem; }
      .entry-meta { font-size: 0.78rem; }
      .toolbar { gap: 8px; }
    }
  </style>
</head>
<body>
  <div class="header">
    <a href="/item-prep" class="btn btn-back">&#8592; Back</a>
    <h1>Prep Log</h1>
    <button class="btn btn-gray" id="refreshBtn">Refresh</button>
  </div>

  <div class="toolbar">
    <input type="text" id="searchUpc" placeholder="Search UPC..." autocomplete="off">
    <div class="toolbar-filters">
      <label><input type="checkbox" id="showAll"> All dates</label>
      <label><input type="checkbox" id="hideUndone" checked> Hide undone</label>
      <label><input type="checkbox" id="autoOnly"> Auto only</label>
    </div>
    <span class="count" id="summary">Loading...</span>
  </div>
  <!-- hidden LOT filter for query-string compat -->
  <input type="hidden" id="filterLot" value="">

  <div class="log-list" id="list"></div>
  <div class="muted" id="err" style="max-width:900px;margin:12px auto 0;"></div>

  <div id="photoModal" class="modal-bg" aria-hidden="true">
    <div class="modal">
      <div class="modal-header">
        <div>
          <strong>Item Photos</strong>
          <div class="muted" id="photoModalMeta"></div>
        </div>
        <button class="modal-close" id="closePhotoModal" type="button">Close</button>
      </div>
      <div id="photoModalStatus" class="muted"></div>
      <div id="photoModalPreview" class="preview-box"></div>
      <div id="photoModalGrid" class="thumb-grid"></div>
    </div>
  </div>

  <script>
    function esc(s){
      return String(s ?? '').replace(/[&<>"']/g, c => ({
        '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'
      })[c] || c);
    }

    function fmtTime(iso){
      const s = String(iso ?? '').trim();
      if(!s) return '';
      try{
        const d = new Date(s);
        if(Number.isNaN(d.getTime())) return s;
        return d.toLocaleString([], {month:'short', day:'numeric', hour:'2-digit', minute:'2-digit'});
      }catch(e){ return s; }
    }

    async function apiGet(url){
      const r = await fetch(url, {headers:{'Accept':'application/json'}});
      const j = await r.json().catch(()=>({}));
      if(!r.ok || j.success === false) throw new Error(j.error || ('HTTP '+r.status));
      return j;
    }

    async function apiPost(url, payload){
      const r = await fetch(url, {method:'POST', headers:{'Content-Type':'application/json','Accept':'application/json'}, body:JSON.stringify(payload ?? {})});
      const j = await r.json().catch(()=>({}));
      if(!r.ok || j.success === false) throw new Error(j.error || ('HTTP '+r.status));
      return j;
    }

    function normalizeImageSrc(path){
      const s = String(path ?? '').trim();
      if(!s) return '';
      if(/^https?:\/\//i.test(s) || s.startsWith('/')) return s;
      if(s.startsWith('static/')) return '/' + s;
      return '/static/' + s.replace(/^\/+/, '');
    }

    function setPhotoPreview(src, alt){
      const box = document.getElementById('photoModalPreview');
      if(!box) return;
      box.innerHTML = src
        ? `<img src="${esc(src)}" alt="${esc(alt || 'Photo')}">`
        : '<div class="muted">No preview</div>';
    }

    function closePhotoModal(){
      const m = document.getElementById('photoModal');
      if(m){ m.style.display = 'none'; m.setAttribute('aria-hidden','true'); }
      document.getElementById('photoModalStatus').textContent = '';
      document.getElementById('photoModalGrid').innerHTML = '';
      setPhotoPreview('','');
    }

    async function openLogPhotos(upcRaw, lotRaw){
      const upc = String(upcRaw ?? '').trim();
      const lot = String(lotRaw ?? '').trim();
      if(!upc){ alert('No UPC available.'); return; }

      const modal = document.getElementById('photoModal');
      const meta = document.getElementById('photoModalMeta');
      const status = document.getElementById('photoModalStatus');
      const grid = document.getElementById('photoModalGrid');

      modal.style.display = 'flex';
      modal.setAttribute('aria-hidden','false');
      meta.textContent = `UPC ${upc}` + (lot ? ` — LOT ${lot}` : '');
      status.textContent = 'Loading...';
      grid.innerHTML = '';
      setPhotoPreview('','');

      try{
        const params = new URLSearchParams();
        params.set('include_related','1');
        params.set('include_bol_image','1');
        params.set('prefer_bol_image','1');
        if(lot) params.set('lot', lot);
        const data = await apiGet('/api/items_prep/diagnostic/' + encodeURIComponent(upc) + '?' + params.toString());
        const imgs = Array.isArray(data.images) ? data.images : [];
        if(!imgs.length){ status.textContent = 'No photos found.'; return; }

        status.textContent = imgs.length + ' photo' + (imgs.length === 1 ? '' : 's');
        imgs.forEach((im, i) => {
          const src = normalizeImageSrc(im && im.image_path);
          if(!src) return;
          const btn = document.createElement('button');
          btn.type = 'button';
          btn.className = 'thumb-btn';
          btn.innerHTML = `<img src="${esc(src)}" alt="Photo ${i+1}">`;
          btn.onclick = () => setPhotoPreview(src, 'Photo '+(i+1));
          grid.appendChild(btn);
          if(i === 0) setPhotoPreview(src, 'Photo 1');
        });
      }catch(e){ status.textContent = 'Error: ' + e.message; }
    }

    function statusCls(st){
      const s = String(st ?? '').toLowerCase();
      if(s === 'return') return 'status-return';
      if(s === 'bad') return 'status-bad';
      return 'status-good';
    }
    function statusTxt(st){
      const s = String(st ?? '').toLowerCase();
      if(s === 'return') return 'RETURN';
      if(s === 'bad') return 'BAD';
      return 'GOOD';
    }

    async function undoEntry(id){
      if(!confirm('Undo this prep entry?')) return;
      const btn = document.querySelector(`[data-undo="${id}"]`);
      if(btn) btn.disabled = true;
      try{
        await apiPost('/api/preplog/undo', {id});
        await loadLog();
      }catch(e){
        alert('Undo failed: ' + e.message);
        if(btn) btn.disabled = false;
      }
    }

    let allItems = [];
    const thumbCache = Object.create(null);
    const thumbPending = new Set();
    let thumbRenderQueued = false;

    function thumbCacheKey(upcRaw, lotRaw){
      const upc = String(upcRaw ?? '').trim();
      const lot = String(lotRaw ?? '').trim();
      if(!upc) return '';
      return encodeURIComponent(upc) + '|' + encodeURIComponent(lot);
    }

    function queueLogRender(){
      if(thumbRenderQueued) return;
      thumbRenderQueued = true;
      setTimeout(() => {
        thumbRenderQueued = false;
        renderLog(allItems);
      }, 0);
    }

    async function preloadEntryThumb(upcRaw, lotRaw){
      const upc = String(upcRaw ?? '').trim();
      const lot = String(lotRaw ?? '').trim();
      const key = thumbCacheKey(upc, lot);
      if(!upc || !key) return;
      if(Object.prototype.hasOwnProperty.call(thumbCache, key)) return;
      if(thumbPending.has(key)) return;

      thumbPending.add(key);
      try{
        const params = new URLSearchParams();
        params.set('include_related','1');
        params.set('include_bol_image','1');
        params.set('prefer_bol_image','1');
        params.set('max_images','1');
        if(lot) params.set('lot', lot);
        const data = await apiGet('/api/items_prep/diagnostic/' + encodeURIComponent(upc) + '?' + params.toString());
        const imgs = Array.isArray(data && data.images) ? data.images : [];
        const src = imgs.length ? normalizeImageSrc(imgs[0] && imgs[0].image_path) : '';
        thumbCache[key] = src || '';
      }catch(_){
        thumbCache[key] = '';
      }finally{
        thumbPending.delete(key);
        queueLogRender();
      }
    }

    function todayStr(){
      const d = new Date();
      return d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0');
    }
    function isToday(iso){ return String(iso ?? '').startsWith(todayStr()); }

    function renderLog(items){
      const list = document.getElementById('list');
      const summary = document.getElementById('summary');
      const search = document.getElementById('searchUpc').value.trim().toLowerCase();
      const showAll = document.getElementById('showAll').checked;
      const autoOnly = document.getElementById('autoOnly').checked;
      const lotFilter = document.getElementById('filterLot').value.trim().toLowerCase();

      let filtered = items;
      if(!showAll) filtered = filtered.filter(it => isToday(it.created_at));
      if(search) filtered = filtered.filter(it => {
        const u = String(it.upc ?? '').toLowerCase();
        const b = String(it.base_upc ?? '').toLowerCase();
        return u.includes(search) || b.includes(search);
      });
      if(autoOnly) filtered = filtered.filter(it => !!it.auto_assigned);
      if(lotFilter) filtered = filtered.filter(it => String(it.lot_number ?? '').toLowerCase().includes(lotFilter));

      const label = showAll ? 'all' : 'today';
      summary.textContent = `${filtered.length} entries` + (search || !showAll ? ` (${label})` : '');

      list.innerHTML = '';
      if(!filtered.length){
        list.innerHTML = '<div class="empty">' + (search ? 'No matches.' : 'No entries yet.') + '</div>';
        return;
      }

      filtered.forEach((it, idx) => {
        const id = it.id;
        const st = String(it.status ?? '').toLowerCase();
        const qty = it.quantity ?? it.qty ?? 1;
        const upc = String(it.upc ?? '').trim();
        const lot = String(it.lot_number ?? '').trim();
        const note = String(it.note ?? '').trim();
        const undone = !!it.undone;
        const photoUpc = String(((it.meta && it.meta.photo_upc) || upc) ?? '').trim();
        const thumbKey = thumbCacheKey(photoUpc, lot);
        const cachedThumb = thumbKey && Object.prototype.hasOwnProperty.call(thumbCache, thumbKey)
          ? String(thumbCache[thumbKey] || '')
          : '';

        // Build first image src if available (cache first, then server-provided field)
        const firstImg = cachedThumb || (it.first_image ? normalizeImageSrc(it.first_image) : '');

        // Load thumbnails only for first 5 visible entries.
        if(idx < 5 && photoUpc && thumbKey && !Object.prototype.hasOwnProperty.call(thumbCache, thumbKey)){
          preloadEntryThumb(photoUpc, lot);
        }

        const row = document.createElement('div');
        row.className = 'entry' + (undone ? ' undone' : '');

        const num = filtered.length - idx;

        row.innerHTML = `
          <div class="entry-num">${num}</div>
          ${firstImg
            ? `<img class="entry-thumb" src="${esc(firstImg)}" alt="Photo" data-photo-upc="${esc(photoUpc)}" data-photo-lot="${esc(lot)}">`
            : `<div class="entry-thumb-placeholder" ${photoUpc ? `data-photo-upc="${esc(photoUpc)}" data-photo-lot="${esc(lot)}" style="cursor:pointer"` : ''}>&#128247;</div>`
          }
          <div class="entry-info">
            <div class="entry-title">
              <span>${esc(upc || '—')}</span>
              <span class="status ${statusCls(st)}">${statusTxt(st)}</span>
              ${qty > 1 ? `<span style="color:#64748b;font-weight:400;font-size:0.85rem">x${esc(qty)}</span>` : ''}
            </div>
            <div class="entry-meta">${esc(fmtTime(it.created_at))}${lot ? ' &middot; LOT ' + esc(lot) : ''}${it.auto_assigned ? ' &middot; auto' : ''}</div>
            ${note ? `<div class="note-line">${esc(note)}</div>` : ''}
          </div>
          <div class="entry-actions">
            <button class="btn btn-undo" data-undo="${esc(id)}" ${undone ? 'disabled' : ''}>Undo</button>
          </div>
        `;

        // Event: undo
        const undoBtn = row.querySelector('[data-undo]');
        if(undoBtn) undoBtn.onclick = () => undoEntry(id);

        // Event: photo click (thumb or placeholder)
        const photoEl = row.querySelector('[data-photo-upc]');
        if(photoEl) photoEl.onclick = () => openLogPhotos(photoEl.dataset.photoUpc, photoEl.dataset.photoLot);

        list.appendChild(row);
      });
    }

    async function loadLog(){
      const list = document.getElementById('list');
      const err = document.getElementById('err');
      err.textContent = '';
      list.innerHTML = '<div class="empty">Loading...</div>';

      const hideUndone = document.getElementById('hideUndone').checked;
      const autoOnly = document.getElementById('autoOnly').checked;
      const lotFilter = document.getElementById('filterLot').value.trim();
      const qs = new URLSearchParams();
      qs.set('limit','500');
      qs.set('include_undone', hideUndone ? '0' : '1');
      if(autoOnly) qs.set('auto_assigned_only','1');
      if(lotFilter) qs.set('lot_number', lotFilter);

      try{
        const data = await apiGet('/api/preplog/recent?' + qs.toString());
        allItems = Array.isArray(data.items) ? data.items : [];
        renderLog(allItems);
      }catch(e){
        list.innerHTML = '';
        summary.textContent = '—';
        err.innerHTML = `<span class="bad">Failed to load:</span> ${esc(e.message)}`;
      }
    }

    function applyQueryDefaults(){
      const p = new URLSearchParams(window.location.search || '');
      if((p.get('auto_assigned') || '') === '1') document.getElementById('autoOnly').checked = true;
      const lot = (p.get('lot') || p.get('lot_number') || '').trim();
      if(lot) document.getElementById('filterLot').value = lot;
    }

    document.getElementById('refreshBtn').onclick = loadLog;
    document.getElementById('closePhotoModal').onclick = closePhotoModal;
    document.getElementById('hideUndone').onchange = loadLog;
    document.getElementById('showAll').onchange = () => renderLog(allItems);
    document.getElementById('autoOnly').onchange = loadLog;
    document.getElementById('searchUpc').addEventListener('input', () => renderLog(allItems));
    document.getElementById('photoModal').addEventListener('click', e => {
      if(e.target === e.currentTarget) closePhotoModal();
    });
    document.addEventListener('keydown', e => {
      if(e.key === 'Escape') closePhotoModal();
    });

    (async ()=>{
      applyQueryDefaults();
      await loadLog();
    })();
  </script>
</body>
</html>
