<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Prep Log</title>
  <style>
    body{font-family:Segoe UI,Arial,sans-serif;background:#f7fafc;margin:0;padding:18px}
    .top{display:flex;align-items:center;gap:10px;justify-content:space-between}
    .btn{padding:12px 16px;border-radius:12px;border:none;cursor:pointer;font-size:1.05rem}
    .btn-danger{background:#e74c3c;color:#fff}
    .btn-gray{background:#95a5a6;color:#fff}
    .btn-small{padding:10px 14px;font-size:0.95rem;border-radius:10px}
    .btn:disabled{opacity:0.55;cursor:not-allowed}
    .card{background:#fff;border:1px solid #e8e8e8;border-radius:14px;padding:16px;margin-top:14px}
    .row{display:flex;gap:10px;flex-wrap:wrap}
    .muted{color:#666;font-size:0.95rem}
    .pill{display:inline-flex;align-items:center;gap:8px;padding:6px 10px;border-radius:999px;background:#f0f0f0;font-size:0.9rem}
    .pill-link{border:none;cursor:pointer;transition:all 0.15s ease}
    .pill-link:hover{background:#e8eef7}
    .pill-link:focus{outline:2px solid #9ec5fe;outline-offset:1px}
    .badge{display:inline-flex;align-items:center;gap:8px;padding:6px 10px;border-radius:999px;font-weight:700;font-size:0.9rem}
    .badge-good{background:rgba(0,184,148,0.12);color:#00b894;border:1px solid rgba(0,184,148,0.25)}
    .badge-bad{background:rgba(231,76,60,0.12);color:#e74c3c;border:1px solid rgba(231,76,60,0.25)}
    .badge-return{background:rgba(52,152,219,0.12);color:#2980b9;border:1px solid rgba(52,152,219,0.25)}
    .badge-auto{background:rgba(243,156,18,0.14);color:#b46d00;border:1px solid rgba(243,156,18,0.32)}
    .logRow{border:1px solid #eee;border-radius:14px;padding:12px 12px;margin-top:12px;background:#fff}
    .logRow.undone{opacity:0.55}
    .logTop{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;flex-wrap:wrap}
    .logLeft{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
    .noteBox{margin-top:10px;padding:10px 12px;border-radius:12px;border:1px dashed #ddd;background:#fcfcfc;white-space:pre-wrap;line-height:1.35}
    .bad{color:#e74c3c}
    .ok{color:#00b894}
    .lotSel{min-width:140px;padding:8px 10px;border:1px solid #ddd;border-radius:8px;background:#fff}
    input[type="checkbox"]{width:18px;height:18px}
    .modalOverlay{position:fixed;inset:0;background:rgba(0,0,0,0.55);display:none;align-items:center;justify-content:center;z-index:9999;padding:18px}
    .modalCard{background:#fff;border-radius:14px;width:min(900px,96vw);max-height:90vh;overflow:auto;border:1px solid #ddd;padding:12px}
    .thumbGrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(110px,1fr));gap:10px}
    .thumbBtn{border:1px solid #ddd;border-radius:10px;background:#fff;padding:4px;cursor:pointer}
    .thumbBtn img{width:100%;height:110px;object-fit:cover;border-radius:8px;display:block}
    .previewBox{background:#fafafa;border:1px solid #eee;border-radius:10px;padding:10px;min-height:220px;display:flex;align-items:center;justify-content:center}
    .previewBox img{max-width:100%;max-height:56vh;border-radius:8px}
  </style>
</head>
<body>
  <div class="top">
    <a href="/item-prep" style="text-decoration:none"><button class="btn btn-danger">Back</button></a>
    <h2 style="margin:0 auto;text-align:center;flex:1">Prep Log</h2>
    <div style="display:flex;gap:10px;align-items:center;">
      <button class="btn btn-gray" id="refreshBtn">Refresh</button>
    </div>
  </div>

  <div class="card">
    <div style="margin-bottom:12px;">
      <input type="text" id="searchUpc" placeholder="Search by barcode / UPC..." autocomplete="off" style="width:100%;padding:10px 14px;font-size:1.05rem;border:1px solid #ddd;border-radius:10px;box-sizing:border-box;">
    </div>
    <div class="row" style="align-items:center;justify-content:space-between;">
      <div class="muted" id="summary">Loading...</div>
      <div style="display:flex;gap:16px;align-items:center;flex-wrap:wrap;">
        <label class="muted" style="display:flex;gap:6px;align-items:center;">
          <input type="checkbox" id="showAll">
          Show all
        </label>
        <label class="muted" style="display:flex;gap:6px;align-items:center;">
          <input type="checkbox" id="hideUndone" checked>
          Hide undone
        </label>
        <label class="muted" style="display:flex;gap:6px;align-items:center;">
          <input type="checkbox" id="autoOnly">
          Auto-assigned only
        </label>
        <input type="text" id="filterLot" placeholder="LOT filter..." autocomplete="off" style="padding:8px 10px;border:1px solid #ddd;border-radius:8px;min-width:140px;">
      </div>
    </div>
    <div id="list"></div>
    <div class="muted" id="err" style="margin-top:12px;"></div>
  </div>

  <div id="photoModal" class="modalOverlay" aria-hidden="true">
    <div class="modalCard">
      <div style="display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap">
        <div>
          <strong>Item Photos</strong>
          <div class="muted" id="photoModalMeta"></div>
        </div>
        <button class="btn btn-small btn-gray" id="closePhotoModal" type="button">Close</button>
      </div>
      <div id="photoModalStatus" class="muted" style="margin-top:10px"></div>
      <div id="photoModalPreview" class="previewBox" style="margin-top:10px"></div>
      <div id="photoModalGrid" class="thumbGrid" style="margin-top:12px"></div>
    </div>
  </div>

  <script>
    function esc(s){
      return String(s ?? '').replace(/[&<>"']/g, c => ({
        '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'
      })[c] || c);
    }

    function fmtTime(iso){
      const s = String(iso ?? '').trim();
      if(!s) return '';
      try{
        const d = new Date(s);
        if(Number.isNaN(d.getTime())) return s;
        return d.toLocaleString([], {year:'numeric', month:'short', day:'2-digit', hour:'2-digit', minute:'2-digit'});
      }catch(e){
        return s;
      }
    }

    async function apiGet(url){
      const r = await fetch(url, {headers:{'Accept':'application/json'}});
      const j = await r.json().catch(()=> ({}));
      if(!r.ok || j.success === false) throw new Error(j.error || ('HTTP '+r.status));
      return j;
    }

    async function apiPost(url, payload){
      const r = await fetch(url, {method:'POST', headers:{'Content-Type':'application/json','Accept':'application/json'}, body: JSON.stringify(payload ?? {})});
      const j = await r.json().catch(()=> ({}));
      if(!r.ok || j.success === false) throw new Error(j.error || ('HTTP '+r.status));
      return j;
    }

    function normalizeImageSrc(path){
      const s = String(path ?? '').trim();
      if(!s) return '';
      if(/^https?:\/\//i.test(s) || s.startsWith('/')) return s;
      if(s.startsWith('static/')) return '/' + s;
      return '/static/' + s.replace(/^\/+/, '');
    }

    function setPhotoPreview(src, altText){
      const box = document.getElementById('photoModalPreview');
      if(!box) return;
      if(!src){
        box.innerHTML = '<div class="muted">No preview</div>';
        return;
      }
      box.innerHTML = `<img src="${esc(src)}" alt="${esc(altText || 'Photo')}">`;
    }

    function closePhotoModal(){
      const modal = document.getElementById('photoModal');
      if(modal){
        modal.style.display = 'none';
        modal.setAttribute('aria-hidden', 'true');
      }
      const status = document.getElementById('photoModalStatus');
      const grid = document.getElementById('photoModalGrid');
      if(status) status.textContent = '';
      if(grid) grid.innerHTML = '';
      setPhotoPreview('', '');
    }

    async function openLogPhotos(upcRaw, lotRaw){
      const upc = String(upcRaw ?? '').trim();
      const lot = String(lotRaw ?? '').trim();
      if(!upc){
        alert('No UPC available for this entry.');
        return;
      }

      const modal = document.getElementById('photoModal');
      const meta = document.getElementById('photoModalMeta');
      const status = document.getElementById('photoModalStatus');
      const grid = document.getElementById('photoModalGrid');
      if(!modal || !meta || !status || !grid) return;

      modal.style.display = 'flex';
      modal.setAttribute('aria-hidden', 'false');
      meta.textContent = `UPC ${upc}` + (lot ? ` — LOT ${lot}` : '');
      status.textContent = 'Loading photos...';
      grid.innerHTML = '';
      setPhotoPreview('', '');

      try{
        const lotQ = lot ? ('?lot=' + encodeURIComponent(lot)) : '';
        const data = await apiGet('/api/items_prep/diagnostic/' + encodeURIComponent(upc) + lotQ);
        const imgs = Array.isArray(data.images) ? data.images : [];
        if(imgs.length === 0){
          status.textContent = 'No photos found for this item.';
          return;
        }

        status.textContent = `${imgs.length} photo` + (imgs.length === 1 ? '' : 's');
        imgs.forEach((im, idx)=>{
          const src = normalizeImageSrc(im && im.image_path);
          if(!src) return;
          const btn = document.createElement('button');
          btn.type = 'button';
          btn.className = 'thumbBtn';
          btn.innerHTML = `<img src="${esc(src)}" alt="Thumbnail ${idx + 1}">`;
          btn.onclick = ()=> setPhotoPreview(src, `Photo ${idx + 1}`);
          grid.appendChild(btn);
          if(idx === 0){
            setPhotoPreview(src, 'Photo 1');
          }
        });
      }catch(e){
        status.textContent = 'Failed to load photos: ' + e.message;
      }
    }

    function statusLabel(st){
      const s = String(st ?? '').toLowerCase().trim();
      if(s === 'return') return 'RETURN';
      if(s === 'bad') return 'BAD';
      return 'GOOD';
    }

    function statusClass(st){
      const s = String(st ?? '').toLowerCase().trim();
      if(s === 'return') return 'badge-return';
      if(s === 'bad') return 'badge-bad';
      return 'badge-good';
    }

    async function undoEntry(id){
      if(!confirm('Undo this prep entry?')) return;
      const btn = document.querySelector(`[data-undo-id=\"${id}\"]`);
      if(btn) btn.disabled = true;
      try{
        await apiPost('/api/preplog/undo', {id});
        await loadLog();
      }catch(e){
        alert('Undo failed: ' + e.message);
        if(btn) btn.disabled = false;
      }
    }

    let allItems = [];
    let allLots = [];

    async function loadLots(){
      try{
        const data = await apiGet('/api/lots');
        const rows = Array.isArray(data.lots) ? data.lots : [];
        allLots = rows.map(r => String(r.lot_number || '').trim()).filter(Boolean);
      }catch(_){
        allLots = [];
      }
    }

    function lotOptionsHtml(currentLot){
      const current = String(currentLot || '').trim();
      const values = [...allLots];
      if(current && !values.some(v => v.toLowerCase() === current.toLowerCase())){
        values.unshift(current);
      }
      if(values.length === 0){
        return '<option value="">(no lots)</option>';
      }
      return values.map(v => {
        const selected = current && v.toLowerCase() === current.toLowerCase() ? ' selected' : '';
        return `<option value="${esc(v)}"${selected}>${esc(v)}</option>`;
      }).join('');
    }

    async function reassignLot(id){
      const sel = document.querySelector(`[data-lot-select=\"${id}\"]`);
      if(!sel) return;
      const lot = String(sel.value || '').trim();
      if(!lot){
        alert('Pick a LOT first.');
        return;
      }
      if(!confirm(`Reassign log #${id} to LOT ${lot}?`)) return;
      const btn = document.querySelector(`[data-reassign-id=\"${id}\"]`);
      if(btn) btn.disabled = true;
      try{
        await apiPost('/api/preplog/reassign_lot', {id, lot_number: lot});
        await loadLog();
      }catch(e){
        alert('Reassign failed: ' + e.message);
        if(btn) btn.disabled = false;
      }
    }

    function todayStr(){
      const d = new Date();
      return d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0');
    }

    function isToday(iso){
      const s = String(iso ?? '').trim();
      if(!s) return false;
      return s.startsWith(todayStr());
    }

    function renderLog(items){
      const list = document.getElementById('list');
      const summary = document.getElementById('summary');
      const search = document.getElementById('searchUpc').value.trim().toLowerCase();
      const showAll = document.getElementById('showAll').checked;
      const autoOnly = document.getElementById('autoOnly').checked;
      const lotFilter = document.getElementById('filterLot').value.trim().toLowerCase();

      let filtered = items;

      // Filter to today only (unless "Show all" is checked)
      if(!showAll){
        filtered = filtered.filter(it => isToday(it.created_at));
      }

      // Filter by UPC search
      if(search){
        filtered = filtered.filter(it => {
          const upc = String(it.upc ?? '').toLowerCase();
          const base = String(it.base_upc ?? '').toLowerCase();
          return upc.includes(search) || base.includes(search);
        });
      }

      if(autoOnly){
        filtered = filtered.filter(it => !!it.auto_assigned);
      }

      if(lotFilter){
        filtered = filtered.filter(it => {
          const lot = String(it.lot_number ?? '').toLowerCase();
          return lot.includes(lotFilter);
        });
      }

      const label = showAll ? 'all time' : 'today';
      summary.textContent = (search || !showAll) ? `${filtered.length} of ${items.length} entries (${label})` : `${items.length} entries`;

      list.innerHTML = '';
      if(filtered.length === 0){
        list.innerHTML = '<div class="muted" style="margin-top:10px;">' + (search ? 'No entries matching that barcode.' : 'No prep log entries yet.') + '</div>';
        return;
      }

      for(const it of filtered){
        const id = it.id;
        const st = String(it.status ?? '').toLowerCase().trim();
        const qty = (it.quantity ?? it.qty ?? 1);
        const upc = String(it.upc ?? '').trim();
        const note = String(it.note ?? '').trim();
        const reason = String(it.reason ?? '').trim();
        const undone = !!it.undone;
        const undoneAt = String(it.undone_at ?? '').trim();
        const undoErr = String(it.undo_error ?? '').trim();
        const lot = String(it.lot_number ?? '').trim();
        const requestedLot = String(it.requested_lot ?? '').trim();
        const autoAssigned = !!it.auto_assigned;
        const canReassign = !undone && (st === 'good' || st === 'bad' || st === 'return');
        const upcPill = upc
          ? `<button type="button" class="pill pill-link" data-photo-upc="${esc(upc)}" data-photo-lot="${esc(lot)}" title="Open item photos">UPC ${esc(upc)} 📷</button>`
          : '<span class="pill">UPC —</span>';

        const row = document.createElement('div');
        row.className = 'logRow' + (undone ? ' undone' : '');
        row.innerHTML = `
          <div class="logTop">
            <div class="logLeft">
              <span class="pill">#${esc(id)}</span>
              <span class="pill">${esc(fmtTime(it.created_at))}</span>
              <span class="badge ${esc(statusClass(st))}">${esc(statusLabel(st))}</span>
              <span class="pill">Qty ${esc(qty)}</span>
              ${upcPill}
              <span class="pill">LOT ${esc(lot || '—')}</span>
              ${autoAssigned ? `<span class="badge badge-auto">AUTO-ASSIGNED${requestedLot ? ` (${esc(requestedLot)}→${esc(lot || '?')})` : ''}</span>` : ''}
              ${reason ? `<span class="pill">${esc(reason)}</span>` : ''}
              ${undone && undoneAt ? `<span class="pill">Undone ${esc(fmtTime(undoneAt))}</span>` : ''}
            </div>
            <div style="display:flex;gap:10px;align-items:center;">
              <button class="btn btn-danger btn-small" data-undo-id="${esc(id)}" ${undone ? 'disabled' : ''}>Undo</button>
            </div>
          </div>
          ${canReassign ? `
          <div style="margin-top:10px;display:flex;gap:8px;align-items:center;flex-wrap:wrap;">
            <span class="muted">Reassign LOT:</span>
            <select class="lotSel" data-lot-select="${esc(id)}">${lotOptionsHtml(lot)}</select>
            <button class="btn btn-gray btn-small" data-reassign-id="${esc(id)}">Save LOT</button>
          </div>
          ` : ''}
          ${note ? `<div class="noteBox"><strong>NOTE:</strong> ${esc(note)}</div>` : ''}
          ${undoErr ? `<div class="muted" style="margin-top:10px;"><span class="bad">Undo error:</span> ${esc(undoErr)}</div>` : ''}
        `;

        const undoBtn = row.querySelector('button[data-undo-id]');
        if(undoBtn){
          undoBtn.onclick = () => undoEntry(id);
        }
        const reassignBtn = row.querySelector('button[data-reassign-id]');
        if(reassignBtn){
          reassignBtn.onclick = () => reassignLot(id);
        }
        const photoBtn = row.querySelector('button[data-photo-upc]');
        if(photoBtn){
          photoBtn.onclick = () => openLogPhotos(photoBtn.dataset.photoUpc, photoBtn.dataset.photoLot);
        }

        list.appendChild(row);
      }
    }

    async function loadLog(){
      const list = document.getElementById('list');
      const err = document.getElementById('err');
      err.textContent = '';
      list.innerHTML = '<div class="muted" style="margin-top:10px;">Loading...</div>';

      const hideUndone = document.getElementById('hideUndone').checked;
      const autoOnly = document.getElementById('autoOnly').checked;
      const lotFilter = document.getElementById('filterLot').value.trim();
      const qs = new URLSearchParams();
      qs.set('limit', '500');
      qs.set('include_undone', hideUndone ? '0' : '1');
      if(autoOnly) qs.set('auto_assigned_only', '1');
      if(lotFilter) qs.set('lot_number', lotFilter);

      try{
        const data = await apiGet('/api/preplog/recent?' + qs.toString());
        allItems = Array.isArray(data.items) ? data.items : [];
        renderLog(allItems);
      }catch(e){
        list.innerHTML = '';
        document.getElementById('summary').textContent = '—';
        err.innerHTML = `<span class="bad">Failed to load log:</span> ${esc(e.message)}`;
      }
    }

    function applyQueryDefaults(){
      const params = new URLSearchParams(window.location.search || '');
      if((params.get('auto_assigned') || '').trim() === '1'){
        document.getElementById('autoOnly').checked = true;
      }
      const lotParam = (params.get('lot') || params.get('lot_number') || '').trim();
      if(lotParam){
        document.getElementById('filterLot').value = lotParam;
      }
    }

    document.getElementById('refreshBtn').onclick = loadLog;
    document.getElementById('closePhotoModal').onclick = closePhotoModal;
    document.getElementById('hideUndone').onchange = loadLog;
    document.getElementById('showAll').onchange = () => renderLog(allItems);
    document.getElementById('autoOnly').onchange = loadLog;
    document.getElementById('filterLot').addEventListener('input', () => renderLog(allItems));
    document.getElementById('filterLot').addEventListener('change', loadLog);
    document.getElementById('searchUpc').addEventListener('input', () => renderLog(allItems));
    document.getElementById('photoModal').addEventListener('click', (e)=>{
      if(e.target === e.currentTarget){
        closePhotoModal();
      }
    });
    document.addEventListener('keydown', (e)=>{
      if(e.key === 'Escape'){
        const modal = document.getElementById('photoModal');
        if(modal && modal.style.display === 'flex'){
          closePhotoModal();
        }
      }
    });

    (async ()=>{
      applyQueryDefaults();
      await loadLots();
      await loadLog();
    })();
  </script>
</body>
</html>
