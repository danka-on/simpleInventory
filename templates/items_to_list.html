<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Item Manager</title>
  <style>
    body{font-family:Segoe UI,Arial,sans-serif;background:#f7f7f8;margin:0;padding:18px}
    .top{display:flex;align-items:center;gap:10px;justify-content:space-between}
    .btn{padding:8px 14px;border-radius:6px;border:none;cursor:pointer}
    .btn-primary{background:#00b894;color:#fff}
    .btn-danger{background:#e74c3c;color:#fff}
    .filters{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
    input,select{padding:8px;border:1px solid #ddd;border-radius:6px}
    table{width:100%;border-collapse:collapse;margin-top:12px}
    th,td{padding:8px;border:1px solid #e6e6e6;text-align:left}
    th{background:#f0f0f0}
    .thumb{width:48px;height:48px;object-fit:cover;border-radius:6px;margin-right:8px}
    .title-cell{display:flex;align-items:center}
    .status-box{display:inline-block;padding:4px 8px;border-radius:6px;background:#bbb;color:#fff;font-size:0.85rem}
    .small-muted{color:#777;font-size:0.9rem}
    .modal{display:none;position:fixed;inset:0;background:rgba(0,0,0,0.7);z-index:9999;align-items:center;justify-content:center}
    .modal .card{background:#fff;padding:18px;border-radius:8px;max-width:720px;max-height:80vh;overflow:auto}
    .btn-sm{padding:6px 10px;font-size:0.9rem}
    .btn-copy{background:rgba(32,201,151,0.3) !important;color:#00875a !important;border:1px solid rgba(32,201,151,0.5) !important}
    .btn-copied{background:rgba(46,204,113,0.85) !important;color:#fff !important;font-weight:600 !important}
  </style>
</head>
<body>
  <div class="top">
    <a href="/"><button class="btn btn-danger">Back</button></a>
    <h2>Item Manager</h2>
    <div style="width:100px"></div>
  </div>

  <div class="filters" style="margin-top:10px">
    <label>Search:
      <input type="text" id="filter-q" placeholder="UPC or Title">
    </label>
    <label>Lot:
      <select id="filter-lot"><option value="">All lots</option></select>
    </label>
    <label>Sort:
      <select id="sort-select">
        <option value="last_edited">Last Edited (newest)</option>
        <option value="last_edited_asc">Last Edited (oldest)</option>
        <option value="date_desc">Import Date (newest)</option>
        <option value="date_asc">Import Date (oldest)</option>
        <option value="name">Name</option>
      </select>
    </label>
    <label>Status:
      <select id="status-select">
        <option value="">All</option>
        <option value="unchecked">Unchecked</option>
        <option value="good">Good</option>
        <option value="bad">Bad</option>
      </select>
    </label>
    <label>Defect:
      <select id="filter-defect">
        <option value="">All</option>
        <option value="Missing pieces">Missing pieces</option>
        <option value="Wrong item">Wrong item</option>
        <option value="Broken">Broken</option>
        <option value="Return">Return</option>
        <option value="Replacement">Replacement</option>
        <option value="Other">Other</option>
      </select>
    </label>
    <div style="display:flex;align-items:center;gap:8px">
      <label style="display:flex;align-items:center;gap:6px"><input type="radio" name="filter_listed_radio" id="filter-listed-all" value="" checked> <span>All</span></label>
      <label style="display:flex;align-items:center;gap:6px"><input type="radio" name="filter_listed_radio" id="filter-listed-listed" value="listed"> <span>Listed</span></label>
      <label style="display:flex;align-items:center;gap:6px"><input type="radio" name="filter_listed_radio" id="filter-listed-not" value="not_listed"> <span>Not Listed</span></label>
    </div>
    <button class="btn" id="apply-filters">Apply</button>
  </div>

  <div id="results"></div>

  <div id="imgModal" class="modal"><div class="card"><div style="text-align:right"><button id="closeImg">Close</button></div><div id="imgContent"></div></div></div>

  <!-- Pics preview modal: shows thumbnails and an edit button linking to diagnostic edit -->
  <div id="picsModal" class="modal"><div class="card" style="max-width:800px; width:95%;">
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:8px">
      <div style="font-weight:700">Photos</div>
      <div><button id="closePics" class="btn-sm">Close</button></div>
    </div>
    <div id="picsPreviewArea" style="display:flex;gap:12px;flex-direction:column;align-items:stretch;">
      <div id="picsLarge" style="text-align:center;background:#f6f6f6;padding:12px;border-radius:8px;min-height:220px;display:flex;align-items:center;justify-content:center;"></div>
      <div id="picsGrid" style="display:flex;gap:8px;flex-wrap:wrap;justify-content:center;margin-top:8px"></div>
      <div style="display:flex;justify-content:flex-end;margin-top:10px">
        <a id="picsEditLink" class="btn btn-sm" href="#" style="background:#e74c3c;color:#fff;margin-right:8px">Edit Diagnostic</a>
        <a id="picsDownloadAll" class="btn btn-sm" href="#" style="background:#3498db;color:#fff">Download All</a>
      </div>
    </div>
  </div></div>

<script>
function esc(s){ return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
function missingThumb(width=48,height=48,text='No Img'){ return 'data:image/svg+xml;utf8,'+encodeURIComponent('<svg xmlns="http://www.w3.org/2000/svg" width="'+width+'" height="'+height+'"><rect width="100%" height="100%" fill="#f8f8f8"/><text x="50%" y="50%" dominant-baseline="middle" text-anchor="middle" fill="#b0b0b0" font-size="10">'+text+'</text></svg>'); }

function setFiltersFromURL(){
  const p = new URLSearchParams(window.location.search);
  const lot = p.get('lot')||''; const q = p.get('q')||''; const sort = p.get('sort')||''; const status = p.get('status')||''; const defect = p.get('defect')||'';
  if(q) document.getElementById('filter-q').value = q;
  if(lot) document.getElementById('filter-lot').value = lot;
  if(sort) document.getElementById('sort-select').value = sort;
  if(status) document.getElementById('status-select').value = status;
  if(defect) document.getElementById('filter-defect').value = defect;
  // support legacy ?status=listed or ?listed=true
  const listedFlag = (p.get('listed') === 'true') || (p.get('status') === 'listed');
  const notListedFlag = (p.get('not_listed') === 'true') || (p.get('status') === 'not_listed');
  // set radio selection
  if(listedFlag){ document.getElementById('filter-listed-listed').checked = true; }
  else if(notListedFlag){ document.getElementById('filter-listed-not').checked = true; }
  else { document.getElementById('filter-listed-all').checked = true; }
}

async function loadItems(){
  const lot = document.getElementById('filter-lot').value.trim();
  const q = document.getElementById('filter-q').value.trim();
  const sort = document.getElementById('sort-select').value;
  const status = document.getElementById('status-select').value;
  const defectFilter = (document.getElementById('filter-defect') && document.getElementById('filter-defect').value) || '';
  // Determine listed/not_listed filter from the radio group
  const listedRadio = document.querySelector('input[name="filter_listed_radio"]:checked');
  const listedVal = listedRadio ? (listedRadio.value || '') : '';
  const params = new URLSearchParams();
  if(lot) params.set('lot', lot);
  if(q) params.set('q', q);
  if(sort) params.set('sort', sort);
  if(status) params.set('status', status);
  // Radio value logic: '' = all, 'listed' or 'not_listed'
  if(listedVal === 'listed') params.set('status', 'listed');
  else if(listedVal === 'not_listed') params.set('status', 'not_listed');
  const resp = await fetch('/api/bol_items?'+params.toString());
  const j = await resp.json();
  let results = j.results||[];
  // Client-side defect filtering (server does not yet support defect filter)
  if(defectFilter){
    const df = defectFilter.toLowerCase();
    results = results.filter(r => (r.defect||'').toString().toLowerCase() === df);
  }
  render(results);
}

// Format a timestamp into Eastern Time like: 2025-10-18 9:20am
function formatLastEdited(raw){
  if(!raw) return '';
  // Try to parse
  let dt = new Date(raw);
  if(isNaN(dt.getTime())){
    // try fallback parsing for date-only strings
    try{
      dt = new Date(raw.replace(' ', 'T'));
    }catch(e){
      return raw;
    }
    if(isNaN(dt.getTime())) return raw;
  }
  try{
    // Use Intl to get components in America/New_York
    const parts = new Intl.DateTimeFormat('en-US', {
      timeZone: 'America/New_York',
      year: 'numeric', month: '2-digit', day: '2-digit',
      hour: 'numeric', minute: '2-digit', hour12: true
    }).formatToParts(dt);
    const vals = {};
    parts.forEach(p=> vals[p.type] = p.value);
    // parts give month/day/year as MM/DD/YYYY
    const year = vals.year || dt.getFullYear();
    const month = vals.month || String(dt.getMonth()+1).padStart(2,'0');
    const day = vals.day || String(dt.getDate()).padStart(2,'0');
    // hour may be like '9' or '11', minute is two-digit
    let hour = vals.hour || dt.getHours();
    let minute = vals.minute || String(dt.getMinutes()).padStart(2,'0');
    const dayPeriod = (vals.dayPeriod || '').toLowerCase();
    // Ensure hour no leading zero
    hour = String(hour).replace(/^0/, '');
    // Build like: 2025-10-18 9:20am
    return `${year}-${month}-${day} ${hour}:${minute}${dayPeriod}`;
  }catch(e){
    return raw;
  }
}

function render(results){
  const container = document.getElementById('results');
  if(!results.length){ container.innerHTML = '<div class="small-muted">No items</div>'; return; }
  let html = '<table><thead><tr><th>Info</th><th>Status</th><th>Defect</th><th>Pics</th><th>Title</th><th>UPC</th><th>List Status</th><th>Actions</th><th>Last Edited</th></tr></thead><tbody>';
  results.forEach(r=>{
    const title = esc(r.title||'');
    const img = esc(r.image||'');
    const thumb = img ? img : missingThumb();
    const upc = esc(r.upc||'');
  const last_edited = esc(r.last_edited||'');
    const status = (r.status||'').toLowerCase();
    let pill = '<span class="status-box" title="Unchecked">unchecked</span>';
    if(status==='good') pill = '<span class="status-box" style="background:#2ecc71" title="Good">good</span>';
    if(status==='bad') pill = '<span class="status-box" style="background:#e74c3c" title="Bad">bad</span>';
    const lstatus = (r.list_status||'').toLowerCase();
    let lpill = '<span class="status-box" style="background:#9aa0a6" title="Not listed">not listed</span>';
    if(lstatus==='listed') lpill = '<span class="status-box" style="background:#2ecc71" title="Listed">listed</span>';
    const actionBtn = (lstatus==='listed')
      ? `<button class="btn btn-danger btn-sm btn-unlist" data-upc="${upc}" title="Mark as not listed">✕</button>`
      : `<button class="btn btn-primary btn-sm btn-list" data-upc="${upc}">Mark as Listed</button>`;
    // Diagnostic link moved into its own Info column (first column)
    const diagLink = `<a href="#" class="diag-link" data-upc="${upc}" style="font-size:0.95rem;color:#0066cc;text-decoration:underline">Open</a>`;
    // Pics count button — initially unknown, render placeholder and update later
    const picsCount = (r.pics_count || 0);
    const picsBtn = `<button type="button" class="btn btn-sm pics-count" data-upc="${upc}" title="View photos">${picsCount}</button>`;

    html += `<tr>`+
      `<td style="width:64px;text-align:center">${diagLink}</td>`+
      `<td><div style="display:flex;flex-direction:column;gap:4px;align-items:flex-start">`+
            `<div>${pill}</div>`+
          `</div></td>`+
            `<td>${esc(r.defect||'')}</td>`+
            `<td style="text-align:center">${picsBtn}</td>`+
            `<td><div class="title-cell"><img class="thumb" src="${thumb}" onerror="this.src='${missingThumb(48,48,'No Img')}'"><a href="#" class="img-link" data-img="${img}" data-title="${title}">${title}</a></div></td>`+
            `<td><div style=\"display:flex;gap:6px;align-items:center\"><span>${upc}</span><button type=\"button\" class=\"btn btn-sm btn-copy\" data-upc=\"${upc}\" title=\"Copy UPC\">Copy</button></div></td>`+
          `<td>${lpill}</td>`+
            `<td>${actionBtn}</td>`+
            `<td class="last-edited-cell" data-raw="${last_edited}">${formatLastEdited(last_edited)}</td>`+
            `</tr>`;
  });
  html += '</tbody></table>';
  container.innerHTML = html;
  document.querySelectorAll('.img-link').forEach(el=> el.addEventListener('click', onOpenImg));
  document.querySelectorAll('.diag-link').forEach(el=> el.addEventListener('click', onOpenDiag));
  document.querySelectorAll('.btn-list').forEach(el=> el.addEventListener('click', onMarkListed));
  document.querySelectorAll('.btn-unlist').forEach(el=> el.addEventListener('click', onUnlist));
  document.querySelectorAll('.btn-copy').forEach(el=> el.addEventListener('click', onCopyUpc));
  // Wire pics-count handlers
  document.querySelectorAll('.pics-count').forEach(btn=> btn.addEventListener('click', onOpenPics));
  // After rendering, for each displayed UPC, fetch the actual images count in the background and update the button
  document.querySelectorAll('.pics-count').forEach(async (btn)=>{
    const upc = btn.dataset.upc;
    if(!upc) return;
    try{
      const res = await fetch('/api/items_prep/diagnostic/'+encodeURIComponent(upc));
      if(!res.ok) return;
      const j = await res.json();
      const n = (j.images || []).length;
      btn.textContent = n;
      // show disabled style when 0
      btn.disabled = (n===0);
    }catch(e){ /* ignore */ }
  });
}

function onOpenImg(e){
  e.preventDefault();
  const img = e.currentTarget.dataset.img;
  const title = e.currentTarget.dataset.title;
  const modal = document.getElementById('imgModal');
  const content = document.getElementById('imgContent');
  content.innerHTML = `<div><div class="small-muted" style="margin-bottom:8px">${esc(title)}</div>`+
                      (img?`<img src="${esc(img)}" style="max-width:100%">`:'<div class="small-muted">No image</div>')+
                      `</div>`;
  modal.style.display = 'flex';
}

document.getElementById('closeImg').addEventListener('click', ()=>{ document.getElementById('imgModal').style.display='none'; });
document.getElementById('closePics').addEventListener('click', ()=>{ document.getElementById('picsModal').style.display='none'; });
document.getElementById('apply-filters').addEventListener('click', loadItems);
// Auto-refresh on dropdown changes
document.getElementById('filter-lot').addEventListener('change', loadItems);
document.getElementById('sort-select').addEventListener('change', loadItems);
document.getElementById('status-select').addEventListener('change', loadItems);
// defect filter should behave like other filters
const defectEl = document.getElementById('filter-defect'); if(defectEl) defectEl.addEventListener('change', loadItems);
// radio buttons for listed filter
['filter-listed-all','filter-listed-listed','filter-listed-not'].forEach(id=>{
  const el = document.getElementById(id);
  if(el) el.addEventListener('change', loadItems);
});
function onOpenDiag(e){
  e.preventDefault(); const upc = e.currentTarget.dataset.upc; if(!upc) return;
  const p = new URLSearchParams();
  const lot = document.getElementById('filter-lot').value.trim();
  const q = document.getElementById('filter-q').value.trim();
  const sort = document.getElementById('sort-select').value;
  const status = document.getElementById('status-select').value;
  const defect = (document.getElementById('filter-defect') && document.getElementById('filter-defect').value) || '';
  if(lot) p.set('lot', lot);
  if(q) p.set('q', q);
  if(sort) p.set('sort', sort);
  if(status) p.set('status', status);
  if(defect) p.set('defect', defect);
  const ret = '/items-to-list' + (p.toString()? ('?'+p.toString()) : '');
  window.location.href = '/item-prep/diagnostic/view?upc='+encodeURIComponent(upc)+'&from=items&return='+encodeURIComponent(ret);
}

async function onOpenPics(e){
  e.preventDefault();
  const upc = e.currentTarget.dataset.upc || e.currentTarget.getAttribute('data-upc');
  if(!upc) return;
  const modal = document.getElementById('picsModal');
  const area = document.getElementById('picsGrid');
  const large = document.getElementById('picsLarge');
  const editLink = document.getElementById('picsEditLink');
  const dlAll = document.getElementById('picsDownloadAll');
  area.innerHTML = '<div class="small-muted">Loading...</div>';
  large.innerHTML = '';
  editLink.href = '/item-prep/diagnostic?upc='+encodeURIComponent(upc);
  dlAll.href = '/api/items_prep/diagnostic/'+encodeURIComponent(upc)+'/photos.zip';
  try{
    const res = await fetch('/api/items_prep/diagnostic/'+encodeURIComponent(upc));
    if(!res.ok){ area.innerHTML = '<div class="small-muted">Failed to load</div>'; modal.style.display='flex'; return; }
    const j = await res.json();
    const imgs = j.images || [];
    if(imgs.length===0){ area.innerHTML = '<div class="small-muted">No photos</div>'; modal.style.display='flex'; return; }
    area.innerHTML = '';
    imgs.forEach((im, idx)=>{
      const src = (im.image_path && im.image_path.indexOf('static/')===-1) ? ('/static/'+im.image_path) : im.image_path;
      const wrap = document.createElement('div'); wrap.style.display='flex'; wrap.style.flexDirection='column'; wrap.style.alignItems='center';
      const t = document.createElement('img'); t.src = src; t.style.width='120px'; t.style.height='120px'; t.style.objectFit='cover'; t.style.borderRadius='8px'; t.style.cursor='pointer';
      t.addEventListener('click', ()=>{ large.innerHTML = `<img src="${src}" style="max-width:100%;max-height:60vh;border-radius:8px">`; });
      wrap.appendChild(t);
      area.appendChild(wrap);
      if(idx===0){ large.innerHTML = `<img src="${src}" style="max-width:100%;max-height:60vh;border-radius:8px">`; }
    });
    modal.style.display = 'flex';
  }catch(e){ area.innerHTML = '<div class="small-muted">Error loading images</div>'; modal.style.display='flex'; }
}

async function onMarkListed(e){
  e.preventDefault();
  const upc = e.currentTarget.dataset.upc; if(!upc) return;
  try{
    // Simply set list_status to 'listed' without deleting diagnostic photos
    await fetch('/api/bol_items/list_status', {method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({ upc, list_status: 'listed' })});
  }catch(e){ /* ignore, refresh below */ }
  loadItems();
}

async function onUnlist(e){
  e.preventDefault();
  const upc = e.currentTarget.dataset.upc; if(!upc) return;
  try{
    await fetch('/api/bol_items/list_status', {method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({ upc, list_status: '' })});
  }catch{}
  loadItems();
}

// Copy UPC to clipboard
async function onCopyUpc(e){
  console.log('[onCopyUpc] Click handler fired');
  e.preventDefault();
  // Capture button reference immediately before any async operations
  const btn = e.currentTarget;
  const upc = btn.dataset.upc || '';
  const oldText = btn.textContent;
  console.log('[onCopyUpc] UPC:', upc);
  if(!upc) return;
  let copied = false;
  try{
    if(navigator.clipboard && navigator.clipboard.writeText){
      console.log('[onCopyUpc] Attempting clipboard API...');
      await navigator.clipboard.writeText(upc);
      copied = true;
      console.log('[onCopyUpc] Clipboard API success');
    }
  }catch(err){
    console.log('[onCopyUpc] Clipboard API failed:', err);
  }
  if(!copied){
    console.log('[onCopyUpc] Attempting fallback execCommand...');
    try{
      const ta = document.createElement('textarea');
      ta.value = upc;
      ta.style.position = 'fixed'; ta.style.opacity = '0'; ta.style.pointerEvents = 'none';
      document.body.appendChild(ta);
      ta.focus(); ta.select();
      copied = document.execCommand && document.execCommand('copy');
      document.body.removeChild(ta);
      console.log('[onCopyUpc] Fallback result:', copied);
    }catch(err2){
      console.log('[onCopyUpc] Fallback error:', err2);
    }
  }
  // Show feedback clearly: change text, color, and disable briefly
  console.log('[onCopyUpc] Changing button from', oldText, 'to "Copied"');
  btn.textContent = 'Copied';
  btn.classList.add('btn-copied');
  btn.disabled = true;
  setTimeout(()=>{ 
    console.log('[onCopyUpc] Reverting button to', oldText);
    btn.textContent = oldText; 
    btn.classList.remove('btn-copied'); 
    btn.disabled = false; 
  }, 1200);
}

// Populate lot dropdown with newest-first lots and import dates
async function loadLots(){
  try{
    const r = await fetch('/api/bol_lots');
    const j = await r.json();
    const sel = document.getElementById('filter-lot');
    const cur = sel.value;
    sel.innerHTML = '<option value="">All lots</option>';
    (j.lots||[]).forEach(x=>{
      const opt = document.createElement('option');
      opt.value = x.lot_number; opt.textContent = `${x.lot_number} — ${x.import_date||''}`;
      sel.appendChild(opt);
    });
    if(cur) sel.value = cur;
  }catch{}
}

// initial load: restore filters, populate lots, then load
setFiltersFromURL();
loadLots().then(loadItems);
// Trigger load on Enter in search
document.getElementById('filter-q').addEventListener('keydown', (e)=>{ if(e.key==='Enter'){ e.preventDefault(); loadItems(); } });


</script>
</body>
</html>
