<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title data-i18n="create_new_item_prep_title">Create New Item - Prep</title>
  <script src="https://cdn.jsdelivr.net/npm/jsbarcode@3.11.5/dist/JsBarcode.all.min.js"></script>
  <style>
    * { margin:0; padding:0; box-sizing:border-box; }
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; padding:16px; background:#f5f5f5; }
    .container { max-width:800px; margin:0 auto; }
    h1 { margin-bottom:20px; color:#2c3e50; }
    .card { background:#fff; padding:20px; border-radius:12px; box-shadow:0 2px 8px rgba(0,0,0,0.1); margin-bottom:16px; }
    .btn { padding:10px 16px; border:none; border-radius:8px; font-size:14px; cursor:pointer; margin-right:8px; transition:all 0.2s; }
    .btn-primary { background:#00b894; color:#fff; }
    .btn-primary:hover { background:#00a383; }
    .btn-danger { background:#e74c3c; color:#fff; }
    .btn-danger:hover { background:#d63027; }
    .btn-gray { background:#95a5a6; color:#fff; }
    .btn-gray:not(:disabled):hover { background:#7f8c8d; cursor:pointer; }
    .btn-success { background:#27ae60; color:#fff; }
    .btn-success:hover { background:#229954; }
    .btn-orange { background:#f39c12; color:#fff; }
    .btn-orange:hover { background:#e67e22; }
    .form-group { margin-bottom:20px; }
    label { display:block; margin-bottom:8px; font-weight:600; color:#2c3e50; font-size:14px; }
    input[type="text"] { width:100%; padding:12px; border:1px solid #ddd; border-radius:8px; font-size:14px; }
    .barcode-display { background:#f8f9fa; padding:16px; border-radius:8px; border:2px solid #00b894; font-family:monospace; font-size:20px; text-align:center; margin-bottom:12px; cursor:pointer; transition:all 0.2s; }
    .barcode-display:hover { background:#e8f5f1; border-color:#00a383; }
    .barcode-input { width:100%; padding:16px; border-radius:8px; border:2px solid #00b894; font-family:monospace; font-size:20px; text-align:center; margin-bottom:12px; }
    .barcode-input:focus { outline:none; border-color:#00a383; background:#e8f5f1; }
    .camera-container { position:relative; background:#000; border-radius:8px; overflow:hidden; margin-bottom:12px; }
    video { width:100%; max-height:400px; display:block; }
    canvas { display:none; }
    .camera-controls { text-align:center; margin-top:12px; }
    .preview-image { width:100%; max-width:400px; border-radius:8px; margin-top:12px; }
    .status-msg { padding:12px; border-radius:8px; margin-top:12px; font-size:14px; }
    .status-success { background:#d1f2eb; color:#00b894; border:1px solid #00b894; }
    .status-error { background:#fadbd8; color:#e74c3c; border:1px solid #e74c3c; }
    .status-warning { background:#fff3cd; color:#856404; border:1px solid #ffc107; }
    .hidden { display:none; }
    .field-status { display:inline-block; margin-left:8px; font-size:12px; }
    .field-complete { color:#27ae60; }
    .field-incomplete { color:#e74c3c; }
    .loading-spinner { display:inline-block; width:16px; height:16px; border:2px solid #f3f3f3; border-top:2px solid #00b894; border-radius:50%; animation:spin 1s linear infinite; margin-left:8px; }
    @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    .loading-overlay { display:none; position:fixed; inset:0; background:rgba(0,0,0,0.5); z-index:99999; align-items:center; justify-content:center; }
    .loading-overlay.active { display:flex; }
    .loading-spinner-large { border:4px solid #f3f3f3; border-top:4px solid #00b894; border-radius:50%; width:50px; height:50px; animation:spin 1s linear infinite; }
    .cam-wrap { position:relative; display:block; width:100%; max-width:420px; margin:0 auto; }
    .cam-overlay-btn { position:absolute; bottom:18px; left:50%; transform:translateX(-50%); display:flex; gap:12px; align-items:center; justify-content:center; z-index:5; }
    .cam-btn { background:rgba(255,255,255,0.18); backdrop-filter:blur(4px); border:1px solid rgba(255,255,255,0.24); color:#fff; padding:18px 22px; border-radius:999px; cursor:pointer; font-size:1.2rem; box-shadow:0 8px 20px rgba(0,0,0,0.22); transition:all 0.2s; }
    .cam-btn:hover { background:rgba(255,255,255,0.28); transform:scale(1.05); }

    /* Night mode */
    html.ss-theme-night body { background:#0f172a; color:#e2e8f0; }
    html.ss-theme-night h1 { color:#e2e8f0; }
    html.ss-theme-night .card { background:#1e293b; border:1px solid rgba(255,255,255,0.08); box-shadow:0 10px 28px rgba(0,0,0,0.45); }
    html.ss-theme-night label { color:#e2e8f0; }
    html.ss-theme-night input[type="text"] { background:#0f172a; border-color:rgba(255,255,255,0.12); color:#e2e8f0; }
    html.ss-theme-night input[type="text"]::placeholder { color:#94a3b8; }
    html.ss-theme-night .barcode-display,
    html.ss-theme-night .barcode-input { background:#0f172a; border-color:#10b981; color:#e2e8f0; }
    html.ss-theme-night .barcode-display:hover { background:#111827; border-color:#0ea371; }
    html.ss-theme-night .status-success { background:rgba(16,185,129,0.12); color:#10b981; border-color:#10b981; }
    html.ss-theme-night .status-error { background:rgba(239,68,68,0.12); color:#fca5a5; border-color:#ef4444; }
    html.ss-theme-night .status-warning { background:rgba(251,191,36,0.12); color:#fbbf24; border-color:#fbbf24; }
    html.ss-theme-night .field-incomplete { color:#fca5a5; }
    html.ss-theme-night .field-complete { color:#34d399; }
    html.ss-theme-night .btn { color:#e2e8f0; }
    html.ss-theme-night .btn-primary { background:#10b981; }
    html.ss-theme-night .btn-primary:hover { background:#0ea371; }
    html.ss-theme-night .btn-danger { background:#ef4444; }
    html.ss-theme-night .btn-danger:hover { background:#dc2626; }
    html.ss-theme-night .btn-gray { background:#334155; }
    html.ss-theme-night .btn-gray:hover { background:#475569; }
    html.ss-theme-night .btn-success { background:#22c55e; }
    html.ss-theme-night .btn-success:hover { background:#16a34a; }
    html.ss-theme-night .btn-orange { background:#f59e0b; }
    html.ss-theme-night .btn-orange:hover { background:#d97706; }
    html.ss-theme-night .camera-container { border:1px solid rgba(255,255,255,0.08); }
    html.ss-theme-night .preview-image { border:1px solid rgba(255,255,255,0.1); }
    html.ss-theme-night .loading-overlay { background:rgba(0,0,0,0.65); }
    html.ss-theme-night .loading-spinner-large { border-color:#334155; border-top-color:#10b981; }
  </style>
</head>
<body>
  <div class="container">
    <h1>➕ <span data-i18n="create_new_item_title">Create New Item</span></h1>
    
    <div class="card">
      <button class="btn btn-danger" id="backBtn">← <span data-i18n="back">Back</span></button>
      
      <div style="margin-top:24px">
        <div class="form-group">
          <label>
            <span data-i18n="item_title_desc">Item Title / Description</span>
            <span class="field-status field-incomplete" id="titleStatus">✗ <span data-i18n="required">Required</span></span>
          </label>
          <input type="text" id="itemTitle" placeholder="Enter item description..." data-i18n="enter_item_desc">
        </div>
        
        <div class="form-group">
          <label>
            <span data-i18n="barcode_auto">Barcode (Auto-Generated)</span>
            <span style="color:#666;font-size:0.85em;font-weight:400;" data-i18n="click_to_edit">- Click to edit manually</span>
            <span class="field-status field-complete" id="barcodeStatus">✓ <span data-i18n="generated">Generated</span></span>
          </label>
          <div class="barcode-display" id="barcodeDisplay" data-i18n="loading">Loading...</div>
          <input type="text" class="barcode-input hidden" id="barcodeInput" placeholder="Enter barcode manually..." data-i18n="enter_barcode_manually">
          <button class="btn btn-primary" id="regenerateBtn">🔄 <span data-i18n="regenerate_barcode">Regenerate Barcode</span></button>
        </div>
        
        <div class="form-group">
          <label>
            <span data-i18n="thumbnail_image">Thumbnail Image</span>
            <span class="field-status field-incomplete" id="imageStatus">✗ <span data-i18n="required">Required</span></span>
          </label>
          <div class="cam-wrap hidden" id="cameraContainer">
            <div class="camera-container">
              <video id="video" autoplay playsinline></video>
            </div>
            <div class="cam-overlay-btn">
              <button class="cam-btn hidden" id="captureBtn">📷</button>
              <button class="cam-btn hidden" id="retakeBtn">🔄</button>
            </div>
          </div>
          <canvas id="canvas"></canvas>
          <img id="preview" class="preview-image hidden" alt="Captured image">
          
          <div class="camera-controls">
            <button class="btn btn-primary" id="startCameraBtn">📷 <span data-i18n="start_camera">Start Camera</span></button>
          </div>
        </div>
        
        <div class="form-group">
          <label>
            <span data-i18n="print_barcode">Print Barcode</span>
            <span class="field-status field-incomplete" id="printStatus">✗ <span data-i18n="not_printed">Not Printed</span></span>
          </label>
          <button class="btn btn-gray" id="printBarcodeBtn" style="width:100%; padding:16px; font-size:1rem; display:block;">🖨️ <span data-i18n="print_barcode_label">Print Barcode Label</span></button>
          <button class="btn btn-success" id="addToQueBtn" style="width:100%; padding:16px; font-size:1rem; display:none; margin-top:8px;">➕ <span data-i18n="add_to_print_que">Add to Print Que</span></button>
          <button class="btn btn-success" id="haveBarcodeBtn" style="width:100%; padding:16px; font-size:1rem; display:none; margin-top:8px;">✓ <span data-i18n="have_barcode">Have Barcode</span></button>
          <button class="btn btn-success" id="completeBtn" style="width:100%; padding:20px; font-size:1.1rem; font-weight:700; display:none; margin-top:8px;">✓ <span data-i18n="complete">Complete</span></button>
      </div>
      <script>
        // Add to Print Que logic
        const addToQueBtn = document.getElementById('addToQueBtn');
        addToQueBtn.disabled = true;
        
        async function checkIfInQueue() {
          if (!currentBarcode) return false;
          try {
            const response = await fetch('/api/print-queue');
            const data = await response.json();
            return data.success && data.queue.some(item => item.barcode === currentBarcode);
          } catch (error) {
            return false;
          }
        }
        
        async function updateAddToQueBtn() {
          // No longer needed - Complete button handles this based on barcode type
          return;
        }
        
        async function addToQueueHandler() {
          const title = itemTitle.value.trim();
          if (!title || !currentBarcode) return;
          try {
            showStatus('Adding to print queue...', 'warning');
            const response = await fetch('/api/print-queue', {
              method: 'POST',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify({ title: title, barcode: currentBarcode })
            });
            const data = await response.json();
            if (data.success) {
              // Mark as printed since it's been added to queue
              isPrinted = true;
              updatePrintStatus();
              showStatus('Added to print queue!', 'success');
              checkFormComplete();
              updateAddToQueBtn();
              
              // Auto-continue to prep if all fields are filled
              const hasImage = !!capturedImageData;
              if (title && currentBarcode && hasImage && isPrinted) {
                showStatus('All fields complete! Continuing to prep...', 'success');
                setTimeout(() => {
                  completeAndContinue();
                }, 800);
              }
            } else {
              showStatus('Failed to add to queue: ' + data.error, 'error');
            }
          } catch (error) {
            console.error('Error adding to queue:', error);
            showStatus('Failed to add to queue: ' + error.message, 'error');
          }
        }
        
        async function removeFromQueueHandler() {
          if (!currentBarcode) return;
          try {
            showStatus('Removing from print queue...', 'warning');
            const response = await fetch('/api/print-queue/item', {
              method: 'DELETE',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify({ barcode: currentBarcode })
            });
            const data = await response.json();
            if (data.success) {
              isPrinted = false; // Mark as not printed since removed from queue
              updatePrintStatus();
              showStatus('Removed from print queue!', 'success');
              checkFormComplete();
              updateAddToQueBtn();
            } else {
              showStatus('Failed to remove from queue: ' + data.error, 'error');
            }
          } catch (error) {
            console.error('Error removing from queue:', error);
            showStatus('Failed to remove from queue: ' + error.message, 'error');
          }
        }
        
        itemTitle.addEventListener('input', updateAddToQueBtn);
        // Also update on barcode generation
        const origGenerateBarcode = generateBarcode;
        generateBarcode = async function() {
          await origGenerateBarcode();
          updateAddToQueBtn();
        };
        updateAddToQueBtn();
      </script>
        </div>
        
        <div id="statusMsg" class="hidden"></div>
      </div>
    </div>
  </div>

  <!-- Loading Overlay -->
  <div id="loadingOverlay" class="loading-overlay">
    <div class="loading-spinner-large"></div>
  </div>

  <script>
    // Loading overlay helpers
    function showLoadingOverlay() {
      document.getElementById('loadingOverlay').classList.add('active');
    }
    
    function hideLoadingOverlay() {
      document.getElementById('loadingOverlay').classList.remove('active');
    }
    
    const t = (key, fallback) => (window.i18n && window.i18n.t) ? window.i18n.t(key) : fallback;
    
    let currentBarcode = '';
    let capturedImageData = null;
    let isPrinted = false;
    let stream = null;
    let barcodeWasManual = false; // Track if barcode was manually entered
    
    const itemTitle = document.getElementById('itemTitle');
    const barcodeDisplay = document.getElementById('barcodeDisplay');
    const regenerateBtn = document.getElementById('regenerateBtn');
    console.log('regenerateBtn element:', regenerateBtn);
    const video = document.getElementById('video');
    const canvas = document.getElementById('canvas');
    const preview = document.getElementById('preview');
    const startCameraBtn = document.getElementById('startCameraBtn');
    const captureBtn = document.getElementById('captureBtn');
    const retakeBtn = document.getElementById('retakeBtn');
    const printBarcodeBtn = document.getElementById('printBarcodeBtn');
    const haveBarcodeBtn = document.getElementById('haveBarcodeBtn');
    const completeBtn = document.getElementById('completeBtn');
    const statusMsg = document.getElementById('statusMsg');
    
    const titleStatus = document.getElementById('titleStatus');
    const imageStatus = document.getElementById('imageStatus');
    const printStatus = document.getElementById('printStatus');
    
    function updateButtonVisibility() {
      // Show appropriate buttons based on whether barcode was manually entered
      console.log('updateButtonVisibility called - barcodeWasManual:', barcodeWasManual, 'currentBarcode:', currentBarcode);
      
      if (barcodeWasManual) {
        // Manual barcode: show Complete button (just completes, doesn't add to queue)
        console.log('Setting up MANUAL barcode buttons');
        addToQueBtn.style.display = 'none';
        haveBarcodeBtn.style.display = 'none';
        completeBtn.style.display = 'block';
        completeBtn.textContent = '✓ ' + t('complete', 'Complete');
        completeBtn.onclick = completeWithoutQueue; // Different handler for manual
      } else {
        // Auto-generated: Complete button adds to queue
        console.log('Setting up AUTO-GENERATED barcode buttons');
        addToQueBtn.style.display = 'none';
        haveBarcodeBtn.style.display = 'none';
        completeBtn.style.display = 'block';
        completeBtn.textContent = '✓ ' + t('complete_add_to_print_que', 'Complete & Add to Print Queue');
        completeBtn.onclick = completeWithQueue; // Handler that adds to queue
      }
    }
    
    function showStatus(message, type = 'success') {
      statusMsg.textContent = message;
      statusMsg.className = 'status-msg status-' + type;
      statusMsg.classList.remove('hidden');
    }
    
    function hideStatus() {
      statusMsg.classList.add('hidden');
    }
    
    async function generateBarcode() {
      console.log('generateBarcode called');
      try {
        console.log('Making API call...');
        const response = await fetch('/api/items-prep/generate-barcode', {
          method: 'POST'
        });
        const data = await response.json();
        console.log('API response:', data);
        
        if (data.success) {
          currentBarcode = data.barcode;
          barcodeDisplay.textContent = currentBarcode;
          barcodeWasManual = false; // Mark as auto-generated
          isPrinted = false;
          updatePrintStatus();
          updateButtonVisibility();
          checkFormComplete();
          console.log('Barcode updated to:', currentBarcode);
        } else {
          showStatus('Failed to generate barcode: ' + data.error, 'error');
        }
      } catch (error) {
        console.error('Error generating barcode:', error);
        showStatus('Error generating barcode: ' + error.message, 'error');
      }
    }
    
    async function startCamera() {
      try {
        // Stop any existing stream first
        stopCamera();
        
        stream = await navigator.mediaDevices.getUserMedia({ 
          video: { facingMode: 'environment' },
          audio: false
        });
        video.srcObject = stream;
        
        // Show camera container and capture button, hide start button
        document.getElementById('cameraContainer').classList.remove('hidden');
        startCameraBtn.classList.add('hidden');
        captureBtn.classList.remove('hidden');
      } catch (error) {
        showStatus('Camera access denied or unavailable: ' + error.message, 'error');
      }
    }
    
    function stopCamera() {
      if (stream) {
        stream.getTracks().forEach(track => track.stop());
        stream = null;
      }
    }
    
    function capturePhoto() {
      canvas.width = video.videoWidth;
      canvas.height = video.videoHeight;
      const ctx = canvas.getContext('2d');
      ctx.drawImage(video, 0, 0);
      
      capturedImageData = canvas.toDataURL('image/jpeg', 0.8);
      preview.src = capturedImageData;
      preview.classList.remove('hidden');
      
      video.classList.add('hidden');
      captureBtn.classList.add('hidden');
      retakeBtn.classList.remove('hidden');
      
      stopCamera();
      
      imageStatus.textContent = '✓ ' + t('captured', 'Captured');
      imageStatus.className = 'field-status field-complete';
      
      checkFormComplete();
      
      // Scroll to bottom to show completion buttons
      setTimeout(() => {
        window.scrollTo({ top: document.body.scrollHeight, behavior: 'smooth' });
      }, 100);
    }
    
    function retakePhoto() {
      capturedImageData = null;
      preview.classList.add('hidden');
      video.classList.remove('hidden');
      captureBtn.classList.remove('hidden');
      retakeBtn.classList.add('hidden');
      
      imageStatus.textContent = '✗ ' + t('required', 'Required');
      imageStatus.className = 'field-status field-incomplete';
      
      // Stop and restart camera to reset
      stopCamera();
      startCamera();
      checkFormComplete();
    }
    
    function printBarcodeBrowser(barcodeData) {
  const printWindow = window.open('', '', 'toolbar=0,location=0,menubar=0,scrollbars=0,status=0,titlebar=0');
  const html = [
  '<!DOCTYPE html>',
  '<html>',
  '<head>',
  '  <title></title>',
  '  <style>',
  '    @page {',
  '      size: 3in 1in;',
  '      margin: 0;',
  "      /* Remove all headers/footers in most browsers */",
  '      @top-left { content: none }',
  '      @top-center { content: none }',
  '      @top-right { content: none }',
  '      @bottom-left { content: none }',
  '      @bottom-center { content: none }',
  '      @bottom-right { content: none }',
  '    }',
  '    html, body { width: 100%; height: 100%; margin: 0 !important; padding: 0 !important; background: white !important; box-shadow: none !important; }',
  '    body { font-family: Arial, sans-serif; display: flex; justify-content: center; align-items: center; height: 1in; }',
  '    .barcode-label { width: 3in; height: 1in; display: flex; flex-direction: column; align-items: center; justify-content: center; page-break-inside: avoid; break-inside: avoid; padding: 0; }',
  '    .barcode-title { font-size: 12px; font-weight: bold; text-align: center; margin-bottom: 2px; color: #000; max-width: 2.8in; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }',
  '    #barcode { display: block; margin: 0 auto; width: 2.6in; height: 0.5in; }',
  '    @media print {',
  '      .barcode-label { border: none; page-break-inside: avoid; break-inside: avoid; }',
  '      body { -webkit-print-color-adjust: exact; print-color-adjust: exact; }',
  '      header, footer { display: none !important; }',
  '    }',
  '  </style>',
        '  <script src="https://cdn.jsdelivr.net/npm/jsbarcode@3.11.5/dist/JsBarcode.all.min.js"><\/script>',
        '</head>',
        '<body>',
        '  <div class="barcode-label">',
        '    <div class="barcode-title">' + (barcodeData.description || '') + '</div>',
        '    <svg id="barcode"></svg>',
        '  </div>',
        '  <script>',
        '    JsBarcode("#barcode", "' + (barcodeData.upc || '') + '", {',
        '      format: "CODE128",',
        '      width: 2,',
        '      height: 40,',
        '      displayValue: true,',
        '      fontSize: 12,',
        '      margin: 0',
        '    });',
        '    setTimeout(function() { window.print(); }, 400);',
        '    window.onafterprint = function() { window.close(); };',
        '  <\/script>',
        '</body>',
        '</html>'
      ].join('\n');
      printWindow.document.write(html);
      printWindow.document.close();
      // Remove about:blank and set document title to empty after load
      printWindow.onload = function() {
        printWindow.document.title = '';
      };
    }

    async function printBarcode() {
      if (!currentBarcode) {
        showStatus('No barcode to print', 'error');
        return;
      }
      
      const title = itemTitle.value.trim();
      if (!title) {
        showStatus('Please enter item title before printing', 'warning');
        return;
      }
      
      // Add loading state to print button
      const originalHTML = printBarcodeBtn.innerHTML;
      printBarcodeBtn.disabled = true;
      printBarcodeBtn.innerHTML = '🖨️ ' + t('printing', 'Printing...') + ' <span class="loading-spinner"></span>';
      
      try {
        // Check printer configuration first
        const configResponse = await fetch('/api/printer/config');
        const configData = await configResponse.json();
        const printerConfig = configData.config || {};
        // If browser print mode, use browser print
        if (printerConfig.print_method === 'browser') {
          showStatus('Opening print dialog...', 'warning');
          printBarcodeBrowser({
            upc: currentBarcode,
            description: title
          });
          // Restore button state
          printBarcodeBtn.disabled = false;
          printBarcodeBtn.innerHTML = originalHTML;
          // Mark as printed after a short delay (user initiated print)
          setTimeout(() => {
            isPrinted = true;
            updatePrintStatus();
            showStatus('Print dialog opened! Mark as complete when ready.', 'success');
            checkFormComplete();
          }, 1000);
          return;
        }
        
        // Otherwise use ESC/POS direct print
        showStatus('Printing barcode...', 'warning');
        const response = await fetch('/api/printer/print-barcode', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            upc: currentBarcode,
            item_description: title,
            quantity: 1
          })
        });
        
        const data = await response.json();
        
        if (data.success) {
          isPrinted = true;
          updatePrintStatus();
          showStatus('Barcode printed successfully!', 'success');
          checkFormComplete();
        } else {
          showStatus('Print failed: ' + data.error + '. Check printer settings.', 'error');
        }
      } catch (error) {
        showStatus('Print error: ' + error.message, 'error');
      } finally {
        // Restore button state
        printBarcodeBtn.disabled = false;
        printBarcodeBtn.innerHTML = originalHTML;
      }
    }
    
    function markAsHaveBarcode() {
      isPrinted = true;
      updatePrintStatus();
      showStatus('Marked as having barcode!', 'success');
      checkFormComplete();
    }
    
    function updatePrintStatus() {
      if (isPrinted) {
        printStatus.textContent = '✓ ' + t('printed_status', 'Printed');
        printStatus.className = 'field-status field-complete';
      } else {
        printStatus.textContent = '✗ ' + t('not_printed', 'Not Printed');
        printStatus.className = 'field-status field-incomplete';
      }
    }
    
    function updateTitleStatus() {
      const title = itemTitle.value.trim();
      if (title) {
        titleStatus.textContent = '✓ ' + t('complete', 'Complete');
        titleStatus.className = 'field-status field-complete';
      } else {
        titleStatus.textContent = '✗ ' + t('required', 'Required');
        titleStatus.className = 'field-status field-incomplete';
      }
      checkFormComplete();
    }
    
    // scrollToBottom function removed - completeBtn no longer exists in UI
    
    function checkFormComplete() {
      const title = itemTitle.value.trim();
      const hasBarcode = !!currentBarcode;
      const hasImage = !!capturedImageData;
      const hasPrinted = isPrinted;
      
      const isComplete = title && hasBarcode && hasImage && hasPrinted;
      
      // completeBtn UI element removed - auto-continue logic now handled in printBarcode
      // if (isComplete) {
      //   completeBtn.disabled = false;
      //   completeBtn.className = 'btn btn-success';
      //   completeBtn.style.cursor = 'pointer';
      // } else {
      //   completeBtn.disabled = true;
      //   completeBtn.className = 'btn btn-gray';
      //   completeBtn.style.cursor = 'not-allowed';
      // }
    }
    
    async function completeAndContinue() {
      const title = itemTitle.value.trim();
      
      if (!title || !currentBarcode || !capturedImageData || !isPrinted) {
        const missing = [];
        if (!title) missing.push('Title');
        if (!currentBarcode) missing.push('Barcode');
        if (!capturedImageData) missing.push('Image');
        if (!isPrinted) missing.push('Printed barcode');
        
        showStatus('Missing required fields: ' + missing.join(', '), 'error');
        return;
      }
      
      // Show loading overlay
      showLoadingOverlay();
      
      try {
        // Store the new item temporarily
        const response = await fetch('/api/items-prep/temp-item', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            upc: currentBarcode,
            item_description: title,
            image_data: capturedImageData
          })
        });
        
        const data = await response.json();
        
        if (data.success) {
          // Store in sessionStorage and redirect to prep page
          sessionStorage.setItem('prepUpc', currentBarcode);
          window.location.href = '/item-prep';
        } else {
          hideLoadingOverlay();
          showStatus('Failed to save item: ' + data.error, 'error');
        }
      } catch (error) {
        hideLoadingOverlay();
        showStatus('Error: ' + error.message, 'error');
      }
    }
    
    // Manual barcode entry
    const barcodeInput = document.getElementById('barcodeInput');
    
    barcodeDisplay.addEventListener('click', () => {
      // Switch to manual entry mode
      barcodeDisplay.classList.add('hidden');
      barcodeInput.classList.remove('hidden');
      barcodeInput.value = currentBarcode || '';
      barcodeInput.focus();
      barcodeInput.select();
    });
    
    barcodeInput.addEventListener('blur', () => {
      // Switch back to display mode
      const manualBarcode = barcodeInput.value.trim();
      if (manualBarcode) {
        currentBarcode = manualBarcode;
        barcodeDisplay.textContent = currentBarcode;
        // Check if barcode is auto-generated (starts with 777) or manual
        barcodeWasManual = !currentBarcode.startsWith('777');
        console.log('Barcode input blur - barcode:', currentBarcode, 'barcodeWasManual:', barcodeWasManual);
        isPrinted = false; // Reset print status when barcode changes
        updatePrintStatus();
        updateButtonVisibility(); // Update buttons based on manual vs auto-generated
        checkFormComplete();
        updateAddToQueBtn();
      }
      barcodeInput.classList.add('hidden');
      barcodeDisplay.classList.remove('hidden');
      // Move focus to title after barcode entry
      setTimeout(() => itemTitle.focus(), 100);
    });
    
    barcodeInput.addEventListener('keypress', (e) => {
      if (e.key === 'Enter') {
        barcodeInput.blur(); // Trigger blur to save
      }
    });
    
    // Event listeners
    regenerateBtn.addEventListener('click', () => {
      console.log('Regenerate button clicked');
      generateBarcode();
    });
    startCameraBtn.addEventListener('click', startCamera);
    captureBtn.addEventListener('click', capturePhoto);
    retakeBtn.addEventListener('click', retakePhoto);
    printBarcodeBtn.addEventListener('click', printBarcode);
    haveBarcodeBtn.addEventListener('click', markAsHaveBarcode);
    
    // Handler for manual barcode: just complete without adding to queue
    async function completeWithoutQueue() {
      // Just mark as having barcode and complete
      isPrinted = true; // Mark as printed so validation passes
      updatePrintStatus();
      checkFormComplete();
      
      // Trigger completion
      const title = itemTitle.value.trim();
      const hasImage = !!capturedImageData;
      if (title && currentBarcode && hasImage && isPrinted) {
        showStatus('Completing...', 'success');
        setTimeout(() => {
          completeAndContinue();
        }, 300);
      }
    }
    
    // Handler for auto-generated barcode: add to queue then complete
    async function completeWithQueue() {
      const title = itemTitle.value.trim();
      if (!title || !currentBarcode) {
        showStatus('Please fill in title and barcode first', 'warning');
        return;
      }
      try {
        showStatus('Adding to print queue...', 'warning');
        const response = await fetch('/api/print-queue', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ title: title, barcode: currentBarcode })
        });
        const data = await response.json();
        if (data.success) {
          isPrinted = true;
          updatePrintStatus();
          showStatus('Added to print queue!', 'success');
          checkFormComplete();
          
          // Auto-continue to prep if all fields are filled
          const hasImage = !!capturedImageData;
          if (title && currentBarcode && hasImage && isPrinted) {
            showStatus('All fields complete! Continuing to prep...', 'success');
            setTimeout(() => {
              completeAndContinue();
            }, 800);
          }
        } else {
          showStatus('Failed to add to queue: ' + data.error, 'error');
        }
      } catch (error) {
        console.error('Error adding to queue:', error);
        showStatus('Failed to add to queue: ' + error.message, 'error');
      }
    }
    
    // Complete button will call appropriate handler based on updateButtonVisibility
    completeBtn.addEventListener('click', async () => {
      // This will be overridden by onclick in updateButtonVisibility
    });
    
    itemTitle.addEventListener('input', updateTitleStatus);
    
    // Scroll to camera on blur (when user exits the title input) or on Enter key
    itemTitle.addEventListener('blur', () => {
      if (itemTitle.value.trim()) {
        // Scroll so camera is fully visible
        setTimeout(() => {
          document.getElementById('cameraContainer').scrollIntoView({ behavior: 'smooth', block: 'center' });
        }, 100);
      }
    });
    
    itemTitle.addEventListener('keypress', (e) => {
      if (e.key === 'Enter' && itemTitle.value.trim()) {
        itemTitle.blur(); // Trigger blur which will scroll
      }
    });
    
    // Initialize
    generateBarcode();
    
    // Set up dynamic back button
    const backBtn = document.getElementById('backBtn');
    if (backBtn) {
      const referrer = document.referrer;
      console.log('Referrer:', referrer); // Debug log
      // Check if coming from /item-prep (but not /item-prep-no-barcode)
      if (referrer && (referrer.endsWith('/item-prep') || referrer.includes('/item-prep?') || referrer.includes('/item-prep#'))) {
        backBtn.onclick = () => window.location.href = '/item-prep';
      } else {
        backBtn.onclick = () => window.location.href = '/item-prep-no-barcode';
      }
    }
    
    // Auto-focus barcode input on page load
    setTimeout(() => {
      barcodeDisplay.click(); // Activate manual entry mode
    }, 500);
    
    // Cleanup on page unload
    window.addEventListener('beforeunload', stopCamera);
  </script>
