<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Marketplace Session</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
  <style>
    * { box-sizing: border-box; }
    body {
      font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
      background: #1a1a2e;
      min-height: 100vh;
      margin: 0;
      padding: 0;
      color: #eee;
    }

    /* Top Navigation Bar */
    .navbar {
      background: rgba(255,255,255,0.05);
      backdrop-filter: blur(10px);
      padding: 12px 20px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      flex-wrap: wrap;
      border-bottom: 1px solid rgba(255,255,255,0.1);
      z-index: 100;
    }
    .navbar h1 {
      margin: 0;
      font-size: 1.3rem;
      font-weight: 600;
      color: #fff;
      flex: 1;
      text-align: center;
    }
    .nav-links {
      display: flex;
      gap: 12px;
      align-items: center;
      justify-content: flex-end;
      flex: 1;
      flex-wrap: wrap;
    }
    .nav-spacer { flex: 1; }
    .nav-link {
      color: rgba(255,255,255,0.7);
      text-decoration: none;
      font-size: 0.9rem;
      padding: 8px 14px;
      border-radius: 8px;
      transition: all 0.2s;
    }
    .nav-link:hover { background: rgba(255,255,255,0.1); color: #fff; }

    /* Main Content */
    .main-content {
      max-width: 800px;
      margin: 0 auto;
      padding: 20px;
      padding-bottom: 200px; /* Space for sticky footer */
    }

    /* Hero Scan Section */
    .scan-hero {
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      border-radius: 20px;
      padding: 30px;
      margin-bottom: 20px;
      text-align: center;
    }
    .scan-hero h2 {
      margin: 0 0 20px 0;
      font-size: 1.1rem;
      font-weight: 500;
      color: rgba(255,255,255,0.9);
      text-transform: uppercase;
      letter-spacing: 1px;
    }
    .scan-input-wrap {
      position: relative;
      max-width: 500px;
      margin: 0 auto;
    }
    .scan-input {
      width: 100%;
      padding: 18px 24px;
      font-size: 1.2rem;
      border: none;
      border-radius: 12px;
      background: rgba(255,255,255,0.95);
      color: #333;
      text-align: center;
      box-shadow: 0 4px 20px rgba(0,0,0,0.2);
    }
    .scan-input:focus {
      outline: none;
      box-shadow: 0 4px 30px rgba(0,0,0,0.3), 0 0 0 3px rgba(255,255,255,0.3);
    }
    .scan-input::placeholder { color: #999; }

    /* Search Toggle */
    .search-toggle {
      margin-top: 16px;
      display: flex;
      flex-direction: column;
      gap: 10px;
      align-items: center;
    }
    .search-toggle-btn {
      background: rgba(255,255,255,0.15);
      border: none;
      color: rgba(255,255,255,0.6);
      padding: 8px 16px;
      border-radius: 8px;
      cursor: pointer;
      font-size: 0.8rem;
      transition: all 0.2s;
    }
    .search-toggle-btn:hover { background: rgba(255,255,255,0.25); color: #fff; }
    #toggleManual {
      background: linear-gradient(135deg, #27ae60, #2ecc71);
      color: #fff;
      font-weight: 700;
      font-size: 1.1rem;
      padding: 14px 36px;
      border-radius: 12px;
      box-shadow: 0 4px 16px rgba(39,174,96,0.5);
      letter-spacing: 0.5px;
    }
    #toggleManual:hover {
      background: linear-gradient(135deg, #219a52, #27ae60);
      box-shadow: 0 6px 24px rgba(39,174,96,0.6);
      transform: translateY(-2px);
    }
    #toggleManual.closing {
      background: linear-gradient(135deg, #c0392b, #e74c3c);
      box-shadow: 0 4px 16px rgba(231,76,60,0.5);
    }
    #toggleManual.closing:hover {
      background: linear-gradient(135deg, #a93226, #c0392b);
      box-shadow: 0 6px 24px rgba(231,76,60,0.6);
    }
    .search-panel {
      display: none;
      margin-top: 16px;
      background: rgba(255,255,255,0.1);
      border-radius: 12px;
      padding: 16px;
    }
    .search-panel.open { display: block; }
    .search-row {
      display: flex;
      gap: 10px;
    }
    .search-row input {
      flex: 1;
      padding: 12px 16px;
      border: none;
      border-radius: 8px;
      font-size: 1rem;
      background: rgba(255,255,255,0.9);
      color: #333;
    }
    .search-row input:focus { outline: none; }
    .search-row button {
      padding: 12px 20px;
      border: none;
      border-radius: 8px;
      background: #fff;
      color: #764ba2;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s;
    }
    .search-row button:hover { transform: scale(1.02); }
    .search-results {
      margin-top: 12px;
      max-height: 200px;
      overflow: auto;
      background: rgba(255,255,255,0.95);
      border-radius: 8px;
    }
    .search-results table { width: 100%; border-collapse: collapse; font-size: 0.85rem; color: #333; }
    .search-results th, .search-results td { padding: 10px; border-bottom: 1px solid #eee; text-align: left; }
    .search-results th { background: #f5f5f5; font-weight: 600; }
    .search-results .btn-add {
      background: #27ae60;
      color: #fff;
      border: none;
      padding: 6px 14px;
      border-radius: 6px;
      cursor: pointer;
      font-weight: 600;
    }
    .thumb-sm { width: 36px; height: 36px; border-radius: 6px; object-fit: cover; cursor: pointer; }
    .thumb-placeholder {
      width: 36px; height: 36px; border-radius: 6px;
      background: rgba(102,126,234,0.2); color: #667eea;
      display: inline-flex; align-items: center; justify-content: center;
      font-size: 0.7rem; font-weight: 600; cursor: pointer;
    }
    .img-modal {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.85);
      z-index: 2000;
      align-items: center;
      justify-content: center;
    }
    .img-modal.open { display: flex; }
    .img-modal img { max-width: 90%; max-height: 90%; border-radius: 12px; }
    .img-modal .close-btn {
      position: absolute; top: 20px; right: 20px;
      background: rgba(255,255,255,0.2); color: #fff;
      border: none; border-radius: 50%;
      width: 40px; height: 40px;
      font-size: 1.5rem; cursor: pointer;
    }

    /* Message */
    .message {
      display: none;
      padding: 14px 18px;
      border-radius: 10px;
      margin-bottom: 16px;
      font-weight: 500;
    }
    .message.success { display: block; background: #d4edda; color: #155724; }
    .message.error { display: block; background: #f8d7da; color: #721c24; }

    /* Items Section */
    .items-section {
      background: rgba(255,255,255,0.05);
      border-radius: 16px;
      padding: 20px;
    }
    .items-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 16px;
    }
    .items-header h3 {
      margin: 0;
      font-size: 1rem;
      color: rgba(255,255,255,0.7);
      text-transform: uppercase;
      letter-spacing: 1px;
    }
    .clear-btn {
      background: rgba(231,76,60,0.2);
      color: #e74c3c;
      border: none;
      padding: 8px 16px;
      border-radius: 8px;
      cursor: pointer;
      font-size: 0.85rem;
      transition: all 0.2s;
    }
    .clear-btn:hover { background: rgba(231,76,60,0.3); }

    .items-list {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    .empty-state {
      text-align: center;
      color: rgba(255,255,255,0.4);
      padding: 40px 20px;
      font-size: 1rem;
    }

    /* Item Card - Simplified */
    .item-card {
      display: flex;
      align-items: center;
      gap: 14px;
      background: rgba(255,255,255,0.08);
      border-radius: 12px;
      padding: 14px;
      transition: all 0.2s;
    }
    .item-card:hover { background: rgba(255,255,255,0.12); }
    .item-thumb {
      width: 56px;
      height: 56px;
      border-radius: 10px;
      object-fit: cover;
      background: rgba(255,255,255,0.1);
      flex-shrink: 0;
    }
    .item-info {
      flex: 1;
      min-width: 0;
    }
    .item-title-input {
      width: 100%;
      background: transparent;
      border: none;
      border-bottom: 1px solid rgba(255,255,255,0.2);
      color: #fff;
      font-size: 0.95rem;
      padding: 4px 0;
      margin-bottom: 4px;
    }
    .item-title-input:focus { outline: none; border-bottom-color: #667eea; }
    .item-title-input::placeholder { color: rgba(255,255,255,0.4); }
    .item-barcode {
      font-family: monospace;
      color: rgba(255,255,255,0.5);
      font-size: 0.8rem;
    }
    .item-price {
      width: 100px;
      position: relative;
    }
    .item-price .dollar-sign {
      position: absolute;
      left: 10px;
      top: 50%;
      transform: translateY(-50%);
      color: #27ae60;
      font-weight: 700;
      font-size: 0.95rem;
      pointer-events: none;
    }
    .item-price input {
      width: 100%;
      background: rgba(39,174,96,0.15);
      border: 1.5px solid rgba(39,174,96,0.4);
      border-radius: 8px;
      color: #27ae60;
      padding: 10px 10px 10px 22px;
      text-align: center;
      font-size: 0.95rem;
      font-weight: 600;
    }
    .item-price input:focus { outline: none; border-color: #27ae60; box-shadow: 0 0 0 2px rgba(39,174,96,0.2); }
    .item-price input::placeholder { color: rgba(39,174,96,0.5); }
    .item-qty {
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .qty-btn {
      width: 32px;
      height: 32px;
      border: none;
      border-radius: 8px;
      background: rgba(255,255,255,0.15);
      color: #fff;
      cursor: pointer;
      font-size: 1.1rem;
      font-weight: 600;
      transition: all 0.2s;
    }
    .qty-btn:hover { background: rgba(255,255,255,0.25); }
    .qty-value {
      min-width: 28px;
      text-align: center;
      font-weight: 700;
      font-size: 1.1rem;
      color: #fff;
    }
    .remove-btn {
      width: 32px;
      height: 32px;
      border: none;
      border-radius: 8px;
      background: rgba(231,76,60,0.2);
      color: #e74c3c;
      cursor: pointer;
      font-size: 1rem;
      transition: all 0.2s;
    }
    .remove-btn:hover { background: rgba(231,76,60,0.4); }

    /* Sticky Footer Summary */
    .summary-footer {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      background: rgba(26,26,46,0.95);
      backdrop-filter: blur(20px);
      border-top: 1px solid rgba(255,255,255,0.1);
      padding: 16px 20px;
      z-index: 100;
    }
    .summary-inner {
      max-width: 800px;
      margin: 0 auto;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      flex-wrap: wrap;
    }
    .summary-stats {
      display: flex;
      gap: 24px;
    }
    .stat {
      text-align: center;
    }
    .stat-label {
      font-size: 0.75rem;
      color: rgba(255,255,255,0.5);
      text-transform: uppercase;
      letter-spacing: 0.5px;
      margin-bottom: 4px;
    }
    .stat-value {
      font-size: 1.4rem;
      font-weight: 700;
      color: #27ae60;
    }
    .stat-value.qty { color: #3498db; }
    .override-input {
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .override-input label {
      font-size: 0.8rem;
      color: rgba(255,255,255,0.6);
    }
    .override-input input {
      width: 100px;
      padding: 10px;
      border: 1px solid rgba(255,255,255,0.2);
      border-radius: 8px;
      background: rgba(255,255,255,0.1);
      color: #fff;
      text-align: center;
      font-size: 1rem;
    }
    .override-input input:focus { outline: none; border-color: #667eea; }
    .override-input input::placeholder { color: rgba(255,255,255,0.3); }
    .submit-btn {
      background: linear-gradient(135deg, #27ae60, #1e8449);
      color: #fff;
      border: none;
      padding: 14px 32px;
      border-radius: 10px;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s;
      box-shadow: 0 4px 15px rgba(39,174,96,0.3);
    }
    .submit-btn:hover:not(:disabled) { transform: translateY(-2px); box-shadow: 0 6px 20px rgba(39,174,96,0.4); }
    .submit-btn:disabled { opacity: 0.5; cursor: not-allowed; transform: none; }

    /* Responsive */
    @media (max-width: 700px) {
      .main-content { padding: 16px; padding-bottom: 20px; }
      .scan-hero { padding: 24px 20px; }
      .scan-input { font-size: 1.1rem; padding: 16px 20px; }
      .item-card { flex-wrap: wrap; }
      .item-info { width: 100%; order: 1; }
      .item-thumb { order: 0; }
      .item-price { order: 2; flex: 1; }
      .item-qty { order: 3; }
      .remove-btn { order: 4; }
      /* Footer: stats section becomes inline, submit stays sticky */
      .summary-footer {
        position: static;
        border-top: none;
        border-radius: 16px;
        margin: 20px 16px 100px 16px;
        background: rgba(26,26,46,0.95);
        backdrop-filter: none;
      }
      /* Hide the submit button inside the inline footer on mobile */
      .summary-footer .submit-btn { display: none; }
      /* Sticky mobile submit bar */
      .mobile-submit-bar {
        display: block !important;
        position: fixed;
        bottom: 0;
        left: 0;
        right: 0;
        padding: 12px 16px;
        background: rgba(26,26,46,0.97);
        border-top: 1px solid rgba(255,255,255,0.1);
        z-index: 100;
      }
      .mobile-submit-bar .submit-btn { display: block; width: 100%; }
      .main-content { padding: 16px; padding-bottom: 160px; }
      /* Price needs more room on mobile */
      .item-price {
        width: auto;
        min-width: 120px;
      }
      .summary-inner { flex-direction: column; gap: 12px; }
      .summary-stats { width: 100%; justify-content: space-around; }
      .override-input { width: 100%; justify-content: center; }
      /* Manual entry wrapping on mobile */
      .manual-entry-panel .search-row {
        flex-wrap: wrap;
      }
      .manual-entry-panel .search-row #manualTitle {
        flex: 1 1 100% !important;
        min-width: 0;
      }
      .manual-entry-panel .search-row #manualPrice {
        flex: 1 1 auto !important;
        max-width: none !important;
      }
      .manual-entry-panel .search-row .manual-add-btn {
        flex: 1 1 100%;
      }
      .bulk-manifest-row {
        grid-template-columns: 1fr;
      }
      .bulk-manifest-btn {
        width: 100%;
      }
    }
    @media (max-width: 480px) {
      .navbar h1 { font-size: 1.1rem; }
      .nav-link { padding: 6px 10px; font-size: 0.8rem; }
      .scan-hero h2 { font-size: 0.95rem; }
      .stat-value { font-size: 1.2rem; }
    }

    /* Manual entry panel */
    .manual-entry-panel {
      display: none;
      margin-top: 16px;
      background: rgba(255,255,255,0.1);
      border-radius: 12px;
      padding: 16px;
    }
    .manual-entry-panel.open { display: block; }
    .search-row button.manual-add-btn {
      padding: 12px 20px;
      border: none;
      border-radius: 8px;
      background: #27ae60;
      color: #fff;
      font-weight: 600;
      font-size: 1rem;
      cursor: pointer;
      transition: all 0.2s;
      white-space: nowrap;
    }
    .search-row button.manual-add-btn:hover { background: #219a52; }

    .bulk-manifest-panel {
      margin-top: 14px;
      background: rgba(255,255,255,0.12);
      border: 1px solid rgba(255,255,255,0.16);
      border-radius: 12px;
      padding: 12px;
      text-align: left;
    }
    .bulk-manifest-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      margin-bottom: 8px;
      color: rgba(255,255,255,0.8);
      font-size: 0.86rem;
      font-weight: 600;
      letter-spacing: 0.04em;
      text-transform: uppercase;
    }
    .bulk-manifest-row {
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 8px;
      align-items: center;
    }
    .bulk-manifest-select {
      width: 100%;
      border: none;
      border-radius: 8px;
      padding: 10px 12px;
      font-size: 0.92rem;
      background: rgba(255,255,255,0.94);
      color: #111827;
      min-height: 40px;
    }
    .bulk-manifest-btn {
      padding: 10px 14px;
      border: none;
      border-radius: 8px;
      background: rgba(255,255,255,0.2);
      color: #fff;
      cursor: pointer;
      font-weight: 600;
      white-space: nowrap;
    }
    .bulk-manifest-btn:hover {
      background: rgba(255,255,255,0.28);
    }
    .bulk-manifest-info {
      margin-top: 8px;
      min-height: 18px;
      font-size: 0.82rem;
      color: rgba(255,255,255,0.78);
    }
    .bulk-manifest-info.error { color: #fecaca; }
    .bulk-manifest-info.ok { color: #bbf7d0; }

    /* Highlight animation for scan-not-found items */
    @keyframes pulse-border {
      0% { box-shadow: 0 0 0 0 rgba(102,126,234,0.6); }
      50% { box-shadow: 0 0 12px 4px rgba(102,126,234,0.4); }
      100% { box-shadow: 0 0 0 0 rgba(102,126,234,0); }
    }
    .item-card.highlight {
      animation: pulse-border 1s ease-in-out 2;
      border-color: #667eea !important;
    }

    .loc-alloc-overlay {
      position: fixed;
      inset: 0;
      background: rgba(2, 6, 23, 0.72);
      backdrop-filter: blur(3px);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 10050;
      padding: 16px;
    }
    .loc-alloc-card {
      width: min(700px, 96vw);
      max-height: 90vh;
      overflow-y: auto;
      background: #0f172a;
      border: 1px solid rgba(148, 163, 184, 0.25);
      border-radius: 16px;
      padding: 18px 18px 16px;
      box-shadow: 0 24px 70px rgba(0, 0, 0, 0.45);
    }
    .loc-alloc-title {
      margin: 0 0 8px;
      font-size: 1rem;
      font-weight: 700;
      color: #f8fafc;
    }
    .loc-alloc-subtitle {
      margin: 0 0 12px;
      font-size: 0.86rem;
      color: #94a3b8;
      line-height: 1.45;
    }
    .loc-alloc-summary {
      margin: 0 0 14px;
      font-size: 0.86rem;
      font-weight: 600;
      color: #f8fafc;
      background: rgba(59, 130, 246, 0.12);
      border: 1px solid rgba(59, 130, 246, 0.3);
      border-radius: 10px;
      padding: 9px 11px;
    }
    .loc-alloc-summary.ok {
      color: #bbf7d0;
      background: rgba(16, 185, 129, 0.12);
      border-color: rgba(16, 185, 129, 0.36);
    }
    .loc-alloc-summary.bad {
      color: #fecaca;
      background: rgba(239, 68, 68, 0.13);
      border-color: rgba(239, 68, 68, 0.3);
    }
    .loc-alloc-list {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(210px, 1fr));
      gap: 10px;
      margin-bottom: 14px;
    }
    .loc-alloc-item {
      border: 1px solid rgba(148, 163, 184, 0.24);
      border-radius: 12px;
      padding: 10px;
      background: rgba(15, 23, 42, 0.66);
      transition: border-color 0.15s ease, background 0.15s ease;
    }
    .loc-alloc-item.is-selected {
      border-color: rgba(16, 185, 129, 0.6);
      background: rgba(16, 185, 129, 0.14);
    }
    .loc-alloc-top {
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .loc-alloc-bubble {
      width: auto;
      flex: 1;
      border: 1px solid rgba(148, 163, 184, 0.3);
      border-radius: 999px;
      background: rgba(30, 41, 59, 0.85);
      color: #e2e8f0;
      padding: 8px 12px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      font-size: 0.82rem;
      font-weight: 600;
    }
    .loc-alloc-item.is-selected .loc-alloc-bubble {
      background: rgba(16, 185, 129, 0.22);
      border-color: rgba(16, 185, 129, 0.65);
      color: #ecfdf5;
    }
    .loc-alloc-bubble small {
      color: #93c5fd;
      font-weight: 600;
      font-size: 0.75rem;
    }
    .loc-alloc-item.is-selected .loc-alloc-bubble small {
      color: #bbf7d0;
    }
    .loc-alloc-view {
      border: 1px solid rgba(148, 163, 184, 0.35);
      border-radius: 999px;
      background: rgba(30, 41, 59, 0.9);
      color: #cbd5e1;
      padding: 7px 11px;
      cursor: pointer;
      font-size: 0.74rem;
      font-weight: 700;
    }
    .loc-alloc-view:hover {
      background: rgba(59, 130, 246, 0.2);
      color: #fff;
    }
    .loc-alloc-view:disabled {
      opacity: 0.45;
      cursor: not-allowed;
    }
    .loc-alloc-controls {
      margin-top: 10px;
      display: grid;
      grid-template-columns: 36px 1fr 36px;
      gap: 8px;
      align-items: center;
    }
    .loc-alloc-controls button {
      border: 1px solid rgba(148, 163, 184, 0.3);
      border-radius: 10px;
      background: rgba(30, 41, 59, 0.92);
      color: #fff;

    /* Day mode overrides */

<body>
  <!-- Top Navigation -->
  <nav class="navbar">
    <div class="nav-spacer"></div>
    <h1 data-i18n="marketplace_session">Marketplace Sale</h1>
    <div class="nav-links">
      <a href="/marketplace-stats" class="nav-link">📊 History</a>
      <a href="/marketplace-schedule-pickup" class="nav-link">Schedule Pickup</a>
      <a href="/marketplace-live-pickups" class="nav-link">Live Pickups</a>
    </div>
  </nav>

  <div class="main-content">
    <!-- Hero Scan Area -->
    <div class="scan-hero">
      <h2 data-i18n="marketplace_scan_barcode">Scan Barcode to Add Item</h2>
      <div class="scan-input-wrap">
        <input id="scanInput" type="text" class="scan-input" placeholder="Scan or type barcode..." autofocus>
      </div>
      <div class="search-toggle">
        <button class="search-toggle-btn" id="toggleManual">➕ Add Manually</button>
        <button class="search-toggle-btn" id="toggleSearch">🔍 Search by Name</button>
      </div>
      <div class="search-panel" id="searchPanel">
        <div class="search-row">
          <input id="searchName" type="text" placeholder="Enter product name...">
          <button id="searchBtn">Search</button>
        </div>
        <div id="searchResults" class="search-results" style="display:none"></div>
      </div>
      <div class="manual-entry-panel" id="manualPanel">
        <div class="search-row">
          <input id="manualTitle" type="text" placeholder="Item name (required)" style="flex:2">
          <input id="manualPrice" type="number" min="0" step="0.01" placeholder="Price" style="flex:1; max-width:120px">
          <button id="manualAddBtn" class="manual-add-btn">+ Add</button>
        </div>
      </div>
      <div class="bulk-manifest-panel" id="bulkManifestPanel">
        <div class="bulk-manifest-head">
          <span>Bulk Manifest Integration</span>
          <button id="refreshManifestListBtn" class="bulk-manifest-btn" type="button">Refresh</button>
        </div>
        <div class="bulk-manifest-row">
          <select id="bulkManifestSelect" class="bulk-manifest-select">
            <option value="">Select a saved manifest...</option>
          </select>
          <button id="loadManifestBtn" class="bulk-manifest-btn" type="button">Load Manifest</button>
        </div>
        <div id="bulkManifestInfo" class="bulk-manifest-info"></div>
      </div>
    </div>

    <div id="message" class="message"></div>

    <!-- Items List -->
    <div class="items-section">
      <div class="items-header">
        <h3>Session Items</h3>
        <button class="clear-btn" id="clearSession">Clear All</button>
      </div>
      <div class="items-list" id="itemsList">
        <div class="empty-state" data-i18n="marketplace_empty">Scan items to start a session</div>
      </div>
    </div>
  </div>

  <!-- Image Popup Modal -->
  <div class="img-modal" id="imgModal">
    <button class="close-btn" onclick="closeImgModal()">×</button>
    <img id="imgModalImg" src="" alt="Preview">
  </div>

  <!-- Sticky Footer Summary -->
  <div class="summary-footer">
    <div class="summary-inner">
      <div class="summary-stats">
        <div class="stat">
          <div class="stat-label">Items</div>
          <div class="stat-value qty" id="totalQty">0</div>
        </div>
        <div class="stat">
          <div class="stat-label">Auto Total</div>
          <div class="stat-value" id="autoTotal">$0.00</div>
        </div>
        <div class="stat">
          <div class="stat-label">Final</div>
          <div class="stat-value" id="finalTotal">$0.00</div>
        </div>
      </div>
      <div class="override-input">
        <label>Override $</label>
        <input id="finalTotalInput" type="number" min="0" step="0.01" placeholder="—">
      </div>
      <button class="submit-btn" id="submitSession" disabled>Submit Sale</button>
    </div>
  </div>

  <!-- Mobile-only sticky submit bar (hidden by default, shown via CSS on small screens) -->
  <div class="mobile-submit-bar" style="display:none">
    <button class="submit-btn" id="mobileSubmitBtn" disabled>Submit Sale</button>
  </div>

  <script>
    const items = new Map();
    const pendingLookups = new Map();
    const scanInput = document.getElementById('scanInput');
    const itemsList = document.getElementById('itemsList');
    const message = document.getElementById('message');
    const totalQtyEl = document.getElementById('totalQty');
    const autoTotalEl = document.getElementById('autoTotal');
    const finalTotalEl = document.getElementById('finalTotal');
    const finalTotalInput = document.getElementById('finalTotalInput');
    const submitBtn = document.getElementById('submitSession');
    const mobileSubmitBtn = document.getElementById('mobileSubmitBtn');
    const clearBtn = document.getElementById('clearSession');
    const toggleSearch = document.getElementById('toggleSearch');
    const searchPanel = document.getElementById('searchPanel');
    const toggleManual = document.getElementById('toggleManual');
    const manualPanel = document.getElementById('manualPanel');
    const bulkManifestPanel = document.getElementById('bulkManifestPanel');
    const bulkManifestSelect = document.getElementById('bulkManifestSelect');
    const loadManifestBtn = document.getElementById('loadManifestBtn');
    const refreshManifestListBtn = document.getElementById('refreshManifestListBtn');
    const bulkManifestInfo = document.getElementById('bulkManifestInfo');
    const urlParams = new URLSearchParams(window.location.search);
    const bulkManifestSource = String(urlParams.get('source') || urlParams.get('from') || '').trim().toLowerCase();
    const showBulkManifestIntegration = bulkManifestSource === 'bulk-manifest';

    if (bulkManifestPanel && !showBulkManifestIntegration) {
      bulkManifestPanel.style.display = 'none';
    }

    let bulkManifestCache = [];
    let activeBulkManifest = null;

    // Toggle search panel (closes manual panel)
    toggleSearch.addEventListener('click', () => {
      searchPanel.classList.toggle('open');
      manualPanel.classList.remove('open');
      toggleSearch.textContent = searchPanel.classList.contains('open') ? '✕ Close Search' : '🔍 Search by Name';
      toggleManual.textContent = '➕ Add Manually';
      toggleManual.classList.remove('closing');
      if (searchPanel.classList.contains('open')) document.getElementById('searchName').focus();
    });

    // Toggle manual entry panel (closes search panel)
    toggleManual.addEventListener('click', () => {
      manualPanel.classList.toggle('open');
      searchPanel.classList.remove('open');
      const isOpen = manualPanel.classList.contains('open');
      toggleManual.textContent = isOpen ? '✕ Close Manual' : '➕ Add Manually';
      toggleManual.classList.toggle('closing', isOpen);
      toggleSearch.textContent = '🔍 Search by Name';
      if (isOpen) document.getElementById('manualTitle').focus();
    });

    if (showBulkManifestIntegration) {
      refreshManifestListBtn.addEventListener('click', () => {
        loadBulkManifestHistory(parseManifestId(bulkManifestSelect.value));
      });
      loadManifestBtn.addEventListener('click', () => {
        loadBulkManifest(bulkManifestSelect.value);
      });
      bulkManifestSelect.addEventListener('change', () => {
        const selectedId = parseManifestId(bulkManifestSelect.value);
        if (!selectedId) {
          setBulkManifestInfo('Select a manifest to load it into this sale session.', null);
          return;
        }
        const row = bulkManifestCache.find(x => parseManifestId(x.id) === selectedId);
        if (!row) return;
        const title = String(row.manifest_title || '').trim() || ('Manifest #' + selectedId);
        setBulkManifestInfo(`Ready to load #${selectedId} (${title})`, null);
      });
    }

    function fmtMoney(v) {
      const n = isNaN(v) ? 0 : v;
      return '$' + n.toFixed(2);
    }

    function esc(value) {
      return String(value == null ? '' : value)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#39;');
    }

    function parsePosInt(value, fallback = 0) {
      const n = Number.parseInt(value, 10);
      return Number.isFinite(n) ? n : fallback;
    }

    function normalizeLocationKey(value) {
      const raw = String(value == null ? '' : value).trim().toLowerCase();
      return raw || '__no_code__';
    }

    function showMessage(text, type) {
      message.textContent = text;
      message.className = 'message ' + type;
    }

    function hideMessage() {
      message.className = 'message';
    }

    function setBulkManifestInfo(text, tone) {
      bulkManifestInfo.className = 'bulk-manifest-info';
      if (tone) bulkManifestInfo.classList.add(tone);
      bulkManifestInfo.textContent = text || '';
    }

    function normalizeManifestStatus(status) {
      const raw = String(status || '').trim().toLowerCase();
      if (raw === 'sold') return 'sold';
      if (raw === 'cleanup_complete') return 'cleanup_complete';
      if (raw === 'cleanup_partial') return 'cleanup_partial';
      return 'created';
    }

    function manifestStatusLabel(status) {
      const key = normalizeManifestStatus(status);
      if (key === 'sold') return 'Sold';
      if (key === 'cleanup_complete') return 'Cleanup Complete';
      if (key === 'cleanup_partial') return 'Cleanup Partial';
      return 'Created';
    }

    function parseManifestId(value) {
      const n = Number.parseInt(value, 10);
      return Number.isFinite(n) && n > 0 ? n : 0;
    }

    function renderBulkManifestOptions(manifests, selectedId) {
      const rows = Array.isArray(manifests) ? manifests : [];
      const selected = parseManifestId(selectedId);
      const options = ['<option value="">Select a saved manifest...</option>'];
      rows.forEach(row => {
        const id = parseManifestId(row.id);
        if (!id) return;
        const title = String(row.manifest_title || '').trim() || ('Manifest #' + id);
        const dateText = String(row.manifest_date || '').trim() || String(row.created_at || '').slice(0, 10);
        const units = Number(row.total_units || 0);
        const statusText = manifestStatusLabel(row.status);
        const selectedAttr = id === selected ? ' selected' : '';
        options.push(`<option value="${id}"${selectedAttr}>#${id} • ${title} • ${dateText} • ${units} unit(s) • ${statusText}</option>`);
      });
      bulkManifestSelect.innerHTML = options.join('');
    }

    async function loadBulkManifestHistory(selectedId) {
      setBulkManifestInfo('Loading saved manifests...', null);
      try {
        const resp = await fetch('/api/bulk-manifest/history?limit=120');
        const data = await resp.json();
        if (!data || !data.success) {
          throw new Error((data && data.error) || 'Failed to load manifest list');
        }
        bulkManifestCache = Array.isArray(data.manifests) ? data.manifests : [];
        renderBulkManifestOptions(bulkManifestCache, selectedId);
        if (!bulkManifestCache.length) {
          setBulkManifestInfo('No saved manifests found. Save one first from Bulk Manifest page.', null);
        } else if (selectedId) {
          setBulkManifestInfo('Manifest list refreshed.', 'ok');
        } else {
          setBulkManifestInfo('Select a manifest to load it into this sale session.', null);
        }
      } catch (err) {
        bulkManifestCache = [];
        renderBulkManifestOptions([], 0);
        setBulkManifestInfo(err && err.message ? err.message : 'Failed to load manifest list', 'error');
      }
    }

    function setActiveBulkManifest(manifest) {
      activeBulkManifest = manifest || null;
      if (!activeBulkManifest) return;
      const title = String(activeBulkManifest.manifest_title || '').trim() || ('Manifest #' + activeBulkManifest.id);
      const statusText = manifestStatusLabel(activeBulkManifest.status);
      setBulkManifestInfo(`Loaded #${activeBulkManifest.id} (${title}) • ${activeBulkManifest.total_units || 0} unit(s) • ${statusText}`, 'ok');
    }

    async function loadBulkManifest(manifestId) {
      const id = parseManifestId(manifestId);
      if (!id) {
        setBulkManifestInfo('Select a manifest first.', 'error');
        return;
      }
      loadManifestBtn.disabled = true;
      setBulkManifestInfo('Loading manifest #' + id + '...', null);
      try {
        const resp = await fetch('/api/bulk-manifest/' + encodeURIComponent(id));
        const data = await resp.json();
        if (!resp.ok || !data || !data.success) {
          throw new Error((data && data.error) || 'Failed to load manifest');
        }

        const manifest = data.manifest || {};
        const lineItems = Array.isArray(data.items) ? data.items : [];
        if (!lineItems.length) {
          throw new Error('Manifest has no line items');
        }

        items.clear();
        lineItems.forEach(line => {
          const barcode = String(line.barcode || '').trim();
          if (!barcode) return;
          const qty = Math.max(1, Number.parseInt(line.quantity, 10) || 1);
          const unitPrice = Number.parseFloat(line.unit_price || 0);
          const lineTotalRaw = Number.parseFloat(line.line_total);
          const lineTotal = Number.isFinite(lineTotalRaw)
            ? lineTotalRaw
            : ((Number.isFinite(unitPrice) ? unitPrice : 0) * qty);
          const priceText = Number.isFinite(lineTotal) && lineTotal > 0 ? lineTotal.toFixed(2) : '';

          if (items.has(barcode)) {
            const existing = items.get(barcode);
            const oldPrice = Number.parseFloat(existing.price || 0);
            const mergedPrice = (Number.isFinite(oldPrice) ? oldPrice : 0) + (Number.isFinite(lineTotal) ? lineTotal : 0);
            existing.qty += qty;
            if (!existing.title && line.title) existing.title = String(line.title || '').trim();
            if (!existing.image && line.image_url) existing.image = String(line.image_url || '').trim();
            existing.price = mergedPrice > 0 ? mergedPrice.toFixed(2) : existing.price;
            items.set(barcode, existing);
          } else {
            items.set(barcode, {
              barcode: barcode,
              title: String(line.title || '').trim(),
              image: String(line.image_url || '').trim(),
              qty: qty,
              price: priceText
            });
          }
        });

        const chosen = {
          id: id,
          manifest_title: String(manifest.manifest_title || '').trim(),
          status: normalizeManifestStatus(manifest.status),
          total_units: Number(manifest.total_units || 0),
          total_items: Number(manifest.total_items || 0),
          manifest_date: String(manifest.manifest_date || '').trim()
        };
        setActiveBulkManifest(chosen);
        renderItems();
        showMessage('Loaded manifest #' + id + ' into session.', 'success');
      } catch (err) {
        setBulkManifestInfo(err && err.message ? err.message : 'Failed to load manifest', 'error');
        showMessage(err && err.message ? err.message : 'Failed to load manifest', 'error');
      } finally {
        loadManifestBtn.disabled = false;
      }
    }

    async function lookupItem(barcode) {
      try {
        const resp = await fetch(`/api/marketplace/lookup?barcode=${encodeURIComponent(barcode)}`);
        const data = await resp.json();
        if (data.success && data.found) {
          return { title: data.title || '', image: data.image_url || '' };
        }
      } catch (e) {}
      return { title: '', image: '' };
    }

    function promptMarketplaceLocationAllocation(item, options) {
      return new Promise((resolve) => {
        const existing = document.getElementById('marketplace-location-allocation-popup');
        if (existing) existing.remove();

        const requiredQty = Math.max(1, parsePosInt(options.quantity ?? item.qty, 1));
        const locations = Array.isArray(options.locations) ? options.locations : [];
        if (!locations.length) {
          resolve([]);
          return;
        }

        const state = locations.map((loc) => ({
          location_key: normalizeLocationKey(loc.location_key || loc.location_code),
          location_code: String(loc.location_code || '(No Code)'),
          available_qty: Math.max(0, parsePosInt(loc.available_qty, 0)),
          selected_qty: 0,
          preview_key: String(loc.preview_key || loc.location_code || '').trim()
        }));

        const overlay = document.createElement('div');
        overlay.id = 'marketplace-location-allocation-popup';
        overlay.className = 'loc-alloc-overlay';

        const card = document.createElement('div');
        card.className = 'loc-alloc-card';
        card.onclick = (e) => e.stopPropagation();

        const title = document.createElement('h3');
        title.className = 'loc-alloc-title';
        title.textContent = 'Select Removal Location(s)';

        const subtitle = document.createElement('p');
        subtitle.className = 'loc-alloc-subtitle';
        subtitle.innerHTML = `Item <strong>${esc(item.title || item.barcode || '')}</strong> needs <strong>${requiredQty}</strong> unit(s) removed from inventory.`;

        const summary = document.createElement('div');
        summary.className = 'loc-alloc-summary';

        const list = document.createElement('div');
        list.className = 'loc-alloc-list';

        const actions = document.createElement('div');
        actions.className = 'loc-alloc-actions';
        actions.innerHTML = `
          <button type="button" class="loc-alloc-cancel">Cancel</button>
          <button type="button" class="loc-alloc-confirm">Use Selection</button>
        `;

        card.appendChild(title);
        card.appendChild(subtitle);
        card.appendChild(summary);
        card.appendChild(list);
        card.appendChild(actions);
        overlay.appendChild(card);
        document.body.appendChild(overlay);

        const cancelBtn = actions.querySelector('.loc-alloc-cancel');
        const confirmBtn = actions.querySelector('.loc-alloc-confirm');

        const totalSelected = () => state.reduce((acc, loc) => acc + parsePosInt(loc.selected_qty, 0), 0);

        function clampQty(index, rawQty) {
          const loc = state[index];
          if (!loc) return;
          let qty = parsePosInt(rawQty, 0);
          if (qty < 0) qty = 0;
          if (qty > loc.available_qty) qty = loc.available_qty;
          loc.selected_qty = qty;
        }

        function renderState() {
          const selected = totalSelected();
          const remaining = requiredQty - selected;
          const canFulfill = options.can_fulfill !== false;

          if (!canFulfill) {
            summary.className = 'loc-alloc-summary bad';
            summary.textContent = `Not enough inventory available (have ${options.total_available || 0}, need ${requiredQty}).`;
          } else if (remaining === 0) {
            summary.className = 'loc-alloc-summary ok';
            summary.textContent = `Ready: selected ${selected} / ${requiredQty}.`;
          } else if (remaining > 0) {
            summary.className = 'loc-alloc-summary';
            summary.textContent = `Select ${remaining} more unit(s). Selected ${selected} / ${requiredQty}.`;
          } else {
            summary.className = 'loc-alloc-summary bad';
            summary.textContent = `Selected ${selected} / ${requiredQty} (remove ${Math.abs(remaining)} unit(s) from selection).`;
          }

          confirmBtn.disabled = !canFulfill || remaining !== 0;

          list.innerHTML = state.map((loc, idx) => {
            const isSelected = parsePosInt(loc.selected_qty, 0) > 0;
            return `
              <div class="loc-alloc-item ${isSelected ? 'is-selected' : ''}" data-index="${idx}">
                <div class="loc-alloc-top">
                  <button type="button" class="loc-alloc-bubble" data-role="toggle" data-index="${idx}">
                    <span>${esc(loc.location_code)}</span>
                    <small>Avail ${loc.available_qty}</small>
                  </button>
                  <button type="button" class="loc-alloc-view" data-role="view" data-index="${idx}" ${loc.preview_key ? '' : 'disabled'}>
                    View
                  </button>
                </div>
                ${isSelected ? `
                  <div class="loc-alloc-controls">
                    <button type="button" data-role="dec" data-index="${idx}">-</button>
                    <input type="number" min="0" max="${loc.available_qty}" value="${loc.selected_qty}" data-role="qty" data-index="${idx}">
                    <button type="button" data-role="inc" data-index="${idx}">+</button>
                  </div>
                ` : ''}
              </div>
            `;
          }).join('');
        }

        function closeWith(value) {
          document.removeEventListener('keydown', onKeyDown);
          overlay.remove();
          resolve(value);
        }

        function onKeyDown(e) {
          if (e.key === 'Escape') {
            e.preventDefault();
            closeWith(null);
          }
        }
        document.addEventListener('keydown', onKeyDown);

        overlay.onclick = (e) => {
          if (e.target === overlay) closeWith(null);
        };
        cancelBtn.onclick = () => closeWith(null);
        confirmBtn.onclick = () => {
          const allocations = state
            .filter(loc => parsePosInt(loc.selected_qty, 0) > 0)
            .map(loc => ({
              location_key: loc.location_key,
              location_code: loc.location_code,
              quantity: parsePosInt(loc.selected_qty, 0)
            }));
          closeWith(allocations);
        };

        list.addEventListener('click', (e) => {
          const target = e.target.closest('[data-role]');
          if (!target) return;
          const idx = parsePosInt(target.getAttribute('data-index'), -1);
          if (idx < 0 || !state[idx]) return;
          const role = target.getAttribute('data-role');
          const loc = state[idx];

          if (role === 'toggle') {
            if (parsePosInt(loc.selected_qty, 0) > 0) {
              loc.selected_qty = 0;
            } else {
              const remaining = requiredQty - totalSelected();
              const seed = remaining > 0 ? remaining : 1;
              clampQty(idx, Math.min(loc.available_qty, seed));
            }
            renderState();
            return;
          }
          if (role === 'dec') {
            clampQty(idx, parsePosInt(loc.selected_qty, 0) - 1);
            renderState();
            return;
          }
          if (role === 'inc') {
            clampQty(idx, parsePosInt(loc.selected_qty, 0) + 1);
            renderState();
            return;
          }
          if (role === 'view') {
            if (!window.SSLocationPreview || !loc.preview_key) return;
            window.SSLocationPreview.openForLocation(loc.location_code, loc.preview_key, `Location: ${loc.location_code}`);
          }
        });

        list.addEventListener('input', (e) => {
          const input = e.target.closest('input[data-role="qty"]');
          if (!input) return;
          const idx = parsePosInt(input.getAttribute('data-index'), -1);
          if (idx < 0 || !state[idx]) return;
          clampQty(idx, input.value);
          renderState();
        });

        renderState();
      });
    }

    async function submitMarketplaceItem(item, context) {
      const payload = {
        barcode: item.barcode,
        title: item.title || '',
        quantity: item.qty,
        price: context.itemPrice,
        session_id: context.sessionId,
        price_auto: context.priceAuto,
        store: context.saleStore,
        bulk_manifest_id: context.bulkManifestId || undefined
      };

      while (true) {
        const resp = await fetch('/api/marketplace/sale', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(payload)
        });
        const data = await resp.json().catch(() => ({ success: false, error: 'Invalid server response' }));

        if (data.success) return data;
        if (data.location_selection_required) {
          const chosen = await promptMarketplaceLocationAllocation(item, data);
          if (!chosen || !chosen.length) {
            return { success: false, cancelled: true, error: 'Location selection cancelled' };
          }
          payload.allocations = chosen;
          continue;
        }
        return data;
      }
    }

    async function searchByName(q) {
      const resultsEl = document.getElementById('searchResults');
      if (!q) return;
      resultsEl.style.display = 'block';
      resultsEl.innerHTML = '<div style="padding:20px;text-align:center;color:#666">Searching...</div>';
      try {
        const resp = await fetch(`/api/marketplace/search?q=${encodeURIComponent(q)}`);
        const data = await resp.json();
        if (!data.success) {
          resultsEl.innerHTML = '<div style="padding:20px;text-align:center;color:#e74c3c">Search failed</div>';
          return;
        }
        const rows = data.results || [];
        if (rows.length === 0) {
          resultsEl.innerHTML = '<div style="padding:20px;text-align:center;color:#666">No matches found</div>';
          return;
        }
        let html = '<table><thead><tr><th></th><th>UPC</th><th>Title</th><th></th></tr></thead><tbody>';
        const noImgSvg = 'data:image/svg+xml;utf8,' + encodeURIComponent('<svg xmlns="http://www.w3.org/2000/svg" width="36" height="36"><rect width="100%" height="100%" fill="#f0f0f0"/><text x="50%" y="50%" dominant-baseline="middle" text-anchor="middle" fill="#bbb" font-size="8">No img</text></svg>');
        rows.forEach((r, idx) => {
          const img = r.image_url || '';
          const thumb = img || noImgSvg;
          // First 3 rows show thumbnail, rest show "show" placeholder
          let imgCell;
          if (idx < 3) {
            imgCell = `<img class="thumb-sm" src="${thumb}" data-full="${img}" onclick="openSearchImg(this)" onerror="this.src='${noImgSvg}'">`;
          } else {
            imgCell = `<span class="thumb-placeholder" data-img="${img}" onclick="revealThumb(this)">show</span>`;
          }
          html += `<tr>
            <td>${imgCell}</td>
            <td style="font-family:monospace;font-size:0.8rem">${r.upc || ''}</td>
            <td style="word-break:break-word">${r.item_description || ''}</td>
            <td><button class="btn-add" data-upc="${r.upc || ''}">+ Add</button></td>
          </tr>`;
        });
        html += '</tbody></table>';
        resultsEl.innerHTML = html;
        resultsEl.querySelectorAll('.btn-add').forEach(btn => {
          btn.addEventListener('click', () => {
            const upc = btn.dataset.upc || '';
            if (upc) addScan(upc);
          });
        });
      } catch (e) {
        resultsEl.innerHTML = '<div style="padding:20px;text-align:center;color:#e74c3c">Search failed</div>';
      }
    }

    let lastGeneratedBarcode = null; // track last 888 barcode to avoid duplicates within session

    function nextLocalBarcode() {
      // Increment the last generated barcode locally
      const num = parseInt(lastGeneratedBarcode, 10) + 1;
      lastGeneratedBarcode = String(num).padStart(12, '0');
      // Ensure it keeps 888000 prefix
      if (!lastGeneratedBarcode.startsWith('888000')) {
        lastGeneratedBarcode = '888000' + lastGeneratedBarcode.slice(6);
      }
      return lastGeneratedBarcode;
    }

    async function addManualItem() {
      const titleInput = document.getElementById('manualTitle');
      const priceInput = document.getElementById('manualPrice');
      const title = (titleInput.value || '').trim();

      if (!title) {
        showMessage('Please enter an item name', 'error');
        titleInput.focus();
        return;
      }

      let barcode;
      try {
        if (lastGeneratedBarcode) {
          // Already have a base barcode from API, just increment locally
          barcode = nextLocalBarcode();
          // Skip if this barcode already exists in the session
          while (items.has(barcode)) barcode = nextLocalBarcode();
        } else {
          // First manual item — fetch from API to get the correct starting point
          const resp = await fetch('/api/marketplace/generate-barcode', { method: 'POST' });
          const data = await resp.json();

          if (!data.success) {
            showMessage('Failed to generate barcode', 'error');
            return;
          }
          barcode = data.barcode;
          lastGeneratedBarcode = barcode;
        }
        const price = priceInput.value || '';

        items.set(barcode, {
          barcode: barcode,
          title: title,
          image: '',
          qty: 1,
          price: price
        });

        renderItems();
        showMessage('Added: ' + title, 'success');

        titleInput.value = '';
        priceInput.value = '';
        titleInput.focus();
      } catch (e) {
        showMessage('Error adding item', 'error');
      }
    }

    // Manual entry event listeners
    document.getElementById('manualAddBtn').addEventListener('click', addManualItem);
    document.getElementById('manualTitle').addEventListener('keydown', (e) => {
      if (e.key === 'Enter') { e.preventDefault(); document.getElementById('manualPrice').focus(); }
    });
    document.getElementById('manualPrice').addEventListener('keydown', (e) => {
      if (e.key === 'Enter') { e.preventDefault(); addManualItem(); }
    });

    async function addScan(barcode) {
      const normalized = String(barcode || '').trim();
      if (!normalized) return;

      if (items.has(normalized)) {
        const item = items.get(normalized);
        item.qty += 1;
        items.set(normalized, item);
        renderItems();
        return;
      }

      const pending = pendingLookups.get(normalized);
      if (pending) {
        pending.qty += 1;
        return;
      }

      pendingLookups.set(normalized, { qty: 1 });
      const info = await lookupItem(normalized);
      const pendingState = pendingLookups.get(normalized) || { qty: 1 };
      pendingLookups.delete(normalized);
      const isNotFound = !info.title && !info.image;

      if (items.has(normalized)) {
        const item = items.get(normalized);
        item.qty += pendingState.qty;
        if (!item.title && info.title) item.title = info.title;
        if (!item.image && info.image) item.image = info.image;
        items.set(normalized, item);
      } else {
        items.set(normalized, {
          barcode: normalized,
          title: info.title || '',
          image: info.image || '',
          qty: pendingState.qty,
          price: ''
        });
      }
      renderItems();

      if (isNotFound) {
        showMessage('Item not in system \u2014 enter a name below', 'error');
        setTimeout(() => {
          const card = document.querySelector(`.item-card[data-barcode="${normalized}"]`);
          if (card) {
            const titleEl = card.querySelector('.title-input');
            if (titleEl) titleEl.focus();
            card.classList.add('highlight');
            setTimeout(() => card.classList.remove('highlight'), 2000);
          }
        }, 50);
      }
    }

    function renderItems() {
      if (items.size === 0) {
        itemsList.innerHTML = '<div class="empty-state" data-i18n="marketplace_empty">Scan items to start a session</div>';
        submitBtn.disabled = true;
        mobileSubmitBtn.disabled = true;
        updateSummary();
        return;
      }
      const html = [];
      for (const item of items.values()) {
        const thumb = item.image ? item.image : 'data:image/svg+xml;utf8,' + encodeURIComponent('<svg xmlns="http://www.w3.org/2000/svg" width="56" height="56"><rect width="100%" height="100%" fill="rgba(255,255,255,0.1)"/><text x="50%" y="50%" dominant-baseline="middle" text-anchor="middle" fill="rgba(255,255,255,0.3)" font-size="8">No img</text></svg>');
        html.push(`
          <div class="item-card" data-barcode="${item.barcode}">
            <img class="item-thumb" src="${thumb}" onerror="this.src='${thumb}'">
            <div class="item-info">
              <input type="text" class="item-title-input title-input" value="${item.title || ''}" placeholder="Item name (optional)">
              <div class="item-barcode">${item.barcode}</div>
            </div>
            <div class="item-price">
              <span class="dollar-sign">$</span>
              <input type="number" class="price-input-field" min="0" step="0.01" placeholder="0.00" value="${item.price}">
            </div>
            <div class="item-qty">
              <button class="qty-btn qty-minus">−</button>
              <div class="qty-value">${item.qty}</div>
              <button class="qty-btn qty-plus">+</button>
            </div>
            <button class="remove-btn">✕</button>
          </div>
        `);
      }
      itemsList.innerHTML = html.join('');
      attachRowHandlers();
      submitBtn.disabled = false;
      mobileSubmitBtn.disabled = false;
      updateSummary();
    }

    function attachRowHandlers() {
      document.querySelectorAll('.item-card').forEach(row => {
        const barcode = row.dataset.barcode;
        const item = items.get(barcode);
        const titleInput = row.querySelector('.title-input');
        const priceInput = row.querySelector('.price-input-field');
        const minus = row.querySelector('.qty-minus');
        const plus = row.querySelector('.qty-plus');
        const remove = row.querySelector('.remove-btn');

        titleInput.addEventListener('input', () => {
          item.title = titleInput.value.trim();
          items.set(barcode, item);
        });
        priceInput.addEventListener('input', () => {
          item.price = priceInput.value;
          items.set(barcode, item);
          updateSummary();
        });
        minus.addEventListener('click', () => {
          if (item.qty > 1) {
            item.qty -= 1;
            items.set(barcode, item);
            renderItems();
          }
        });
        plus.addEventListener('click', () => {
          item.qty += 1;
          items.set(barcode, item);
          renderItems();
        });
        remove.addEventListener('click', () => {
          items.delete(barcode);
          renderItems();
        });
      });
    }

    function getTotals() {
      let totalQty = 0;
      let autoTotal = 0;
      for (const item of items.values()) {
        totalQty += item.qty;
        const p = parseFloat(item.price || 0);
        if (!isNaN(p)) autoTotal += p;
      }
      return { totalQty, autoTotal };
    }

    function updateSummary() {
      const { totalQty, autoTotal } = getTotals();
      totalQtyEl.textContent = totalQty;
      autoTotalEl.textContent = fmtMoney(autoTotal);
      const override = parseFloat(finalTotalInput.value);
      const finalTotal = !isNaN(override) && override >= 0 ? override : autoTotal;
      finalTotalEl.textContent = fmtMoney(finalTotal);
    }

    scanInput.addEventListener('keydown', (e) => {
      if (e.key === 'Enter') {
        e.preventDefault();
        const code = scanInput.value.trim();
        scanInput.value = '';
        if (code) addScan(code);
      }
    });

    const searchBtn = document.getElementById('searchBtn');
    const searchName = document.getElementById('searchName');
    if (searchBtn) {
      searchBtn.addEventListener('click', () => {
        const q = (searchName.value || '').trim();
        if (q) searchByName(q);
      });
    }
    if (searchName) {
      searchName.addEventListener('keydown', (e) => {
        if (e.key === 'Enter') {
          e.preventDefault();
          const q = (searchName.value || '').trim();
          if (q) searchByName(q);
        }
      });
    }

    finalTotalInput.addEventListener('input', updateSummary);

    clearBtn.addEventListener('click', () => {
      const t = (window.i18n && window.i18n.t) ? window.i18n.t : (k => k);
      if (confirm(t('marketplace_clear_confirm') || 'Clear all items?')) {
        items.clear();
        activeBulkManifest = null;
        renderItems();
        setBulkManifestInfo('Session cleared. Select a manifest or scan items to start.', null);
      }
    });

    // Mobile submit triggers main submit
    mobileSubmitBtn.addEventListener('click', () => submitBtn.click());

    submitBtn.addEventListener('click', async () => {
      if (items.size === 0) return;
      submitBtn.disabled = true;
      mobileSubmitBtn.disabled = true;
      submitBtn.textContent = 'Submitting...';
      mobileSubmitBtn.textContent = 'Submitting...';
      hideMessage();
      const sessionId = 'session-' + Date.now().toString(36) + '-' + Math.random().toString(36).slice(2, 7);
      const { totalQty, autoTotal } = getTotals();
      const override = parseFloat(finalTotalInput.value);
      let finalTotal = (!isNaN(override) && override >= 0) ? override : autoTotal;
      const bulkManifestId = activeBulkManifest ? parseManifestId(activeBulkManifest.id) : 0;
      const saleStore = bulkManifestId ? 'marketplace-sale-bulk' : 'marketplace';

      const itemList = Array.from(items.values());
      let priceMap = new Map();
      let priceAutoMap = new Map();  // Track if price was auto-calculated
      if (totalQty > 0) {
        if (!isNaN(override) && override >= 0) {
          // Override was used - prices are auto-calculated
          if (autoTotal > 0) {
            const ratio = finalTotal / autoTotal;
            itemList.forEach(i => {
              const p = parseFloat(i.price || 0);
              const unit = isNaN(p) ? 0 : p * ratio;
              priceMap.set(i.barcode, unit);
              // Auto if ratio != 1 (override changed prices) or item had no manual price
              priceAutoMap.set(i.barcode, Math.abs(ratio - 1) > 0.001 || !i.price);
            });
          } else {
            // No individual prices, split evenly across items - definitely auto
            const perItem = finalTotal / itemList.length;
            itemList.forEach(i => {
              priceMap.set(i.barcode, perItem);
              priceAutoMap.set(i.barcode, true);
            });
          }
        } else {
          // No override - use manual prices (not auto)
          itemList.forEach(i => {
            const p = parseFloat(i.price || 0);
            priceMap.set(i.barcode, isNaN(p) ? 0 : p);
            priceAutoMap.set(i.barcode, false);
          });
        }
      }

      let success = 0;
      let fail = 0;
      let submitStopped = false;
      const warnings = [];
      for (const item of itemList) {
        const itemPrice = priceMap.get(item.barcode) || 0;
        const priceAuto = priceAutoMap.get(item.barcode) || false;
        try {
          const data = await submitMarketplaceItem(item, {
            itemPrice,
            priceAuto,
            sessionId,
            saleStore,
            bulkManifestId
          });

          if (data.success) {
            success += 1;
            if (data.inventory_removal_error) {
              warnings.push(`${item.barcode}: ${data.inventory_removal_error}`);
            }
          } else {
            fail += 1;
            if (data.cancelled) {
              submitStopped = true;
              warnings.push(`${item.barcode}: location selection cancelled`);
              break;
            }
            warnings.push(`${item.barcode}: ${data.error || 'Sale failed'}`);
          }
        } catch (e) {
          fail += 1;
          warnings.push(`${item.barcode}: ${e && e.message ? e.message : 'Sale failed'}`);
        }
      }

      submitBtn.textContent = 'Submit Sale';
      mobileSubmitBtn.textContent = 'Submit Sale';
      if (fail === 0) {
        let soldMarkMessage = '';
        if (bulkManifestId) {
          try {
            const soldResp = await fetch('/api/bulk-manifest/' + encodeURIComponent(bulkManifestId) + '/mark-sold', {
              method: 'POST',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify({
                session_id: sessionId,
                sold_total: finalTotal,
                sold_rows: success,
                status: 'sold'
              })
            });
            const soldData = await soldResp.json();
            if (!soldResp.ok || !soldData || !soldData.success) {
              throw new Error((soldData && soldData.error) || 'Failed to mark manifest sold');
            }
            soldMarkMessage = ` Bulk manifest #${bulkManifestId} marked as sold.`;
          } catch (markErr) {
            soldMarkMessage = ` Sale submitted, but manifest status update failed: ${markErr && markErr.message ? markErr.message : 'unknown error'}.`;
          }
        }
        const baseSuccess = (window.i18n && window.i18n.t) ? window.i18n.t('marketplace_submit_success') : 'Sale submitted successfully!';
        const warningText = warnings.length ? ` Inventory warning: ${warnings.slice(0, 2).join(' | ')}` : '';
        showMessage(baseSuccess + soldMarkMessage + warningText, warnings.length ? 'error' : 'success');
        items.clear();
        finalTotalInput.value = '';
        if (bulkManifestId) {
          setBulkManifestInfo(
            `Sale complete for manifest #${bulkManifestId}. Open Move Location and load this manifest to remove sold qty by location.`,
            'ok'
          );
        }
        activeBulkManifest = null;
        renderItems();
        if (showBulkManifestIntegration) {
          loadBulkManifestHistory(bulkManifestId || parseManifestId(bulkManifestSelect.value));
        }
      } else {
        const t = (window.i18n && window.i18n.t) ? window.i18n.t : (k => k);
        const msg = (t('marketplace_submit_partial') || 'Submitted {success}, failed {fail}')
          .replace('{success}', success)
          .replace('{fail}', fail);
        const extra = warnings.length ? ' ' + warnings.slice(0, 2).join(' | ') : '';
        showMessage(msg + (submitStopped ? ' Submission stopped.' : '') + extra, 'error');
      }
      submitBtn.disabled = false;
      mobileSubmitBtn.disabled = false;
      scanInput.focus();
    });

    async function initMarketplaceSessionPage() {
      renderItems();
      if (showBulkManifestIntegration) {
        const queryManifestId = parseManifestId(urlParams.get('manifest_id'));
        await loadBulkManifestHistory(queryManifestId);
        if (queryManifestId) {
          bulkManifestSelect.value = String(queryManifestId);
          await loadBulkManifest(queryManifestId);
        }
      }

      setTimeout(() => {
        scanInput.focus();
        scanInput.select();
      }, 100);
    }

    initMarketplaceSessionPage();

    // Image modal functions
    function openSearchImg(imgEl) {
      const fullSrc = imgEl.dataset.full || imgEl.src;
      if (!fullSrc || fullSrc.startsWith('data:')) return;
      document.getElementById('imgModalImg').src = fullSrc;
      document.getElementById('imgModal').classList.add('open');
    }
    function closeImgModal() {
      document.getElementById('imgModal').classList.remove('open');
      document.getElementById('imgModalImg').src = '';
    }
    function revealThumb(placeholder) {
      const img = placeholder.dataset.img || '';
      const noImgSvg = 'data:image/svg+xml;utf8,' + encodeURIComponent('<svg xmlns="http://www.w3.org/2000/svg" width="36" height="36"><rect width="100%" height="100%" fill="#f0f0f0"/><text x="50%" y="50%" dominant-baseline="middle" text-anchor="middle" fill="#bbb" font-size="8">No img</text></svg>');
      const thumb = img || noImgSvg;
      const imgEl = document.createElement('img');
      imgEl.className = 'thumb-sm';
      imgEl.src = thumb;
      imgEl.dataset.full = img;
      imgEl.onclick = function() { openSearchImg(this); };
      imgEl.onerror = function() { this.src = noImgSvg; };
      placeholder.replaceWith(imgEl);
    }
    document.getElementById('imgModal').addEventListener('click', function(e) {
      if (e.target === this) closeImgModal();
    });
  </script>
