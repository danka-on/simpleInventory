<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Marketplace Sale</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #0f172a;
      color: #f1f5f9;
      min-height: 100vh;
    }

    /* ── Nav ── */
    .navbar {
      background: #1e293b;
      border-bottom: 1px solid #334155;
      height: 52px;
      display: flex;
      align-items: center;
      padding: 0 16px;
      gap: 12px;
      position: sticky;
      top: 0;
      z-index: 50;
    }
    .nav-back {
      color: #64748b;
      text-decoration: none;
      font-size: 1.2rem;
      line-height: 1;
      padding: 5px 8px;
      border-radius: 7px;
      transition: color 0.15s, background 0.15s;
      flex-shrink: 0;
    }
    .nav-back:hover { color: #f1f5f9; background: #334155; }
    .navbar h1 {
      font-size: 0.97rem;
      font-weight: 600;
      color: #f1f5f9;
      flex: 1;
    }
    .nav-links {
      display: flex;
      gap: 2px;
      align-items: center;
    }
    .nav-link {
      color: #64748b;
      text-decoration: none;
      font-size: 0.8rem;
      padding: 6px 10px;
      border-radius: 6px;
      white-space: nowrap;
      transition: color 0.15s, background 0.15s;
    }
    .nav-link:hover { color: #f1f5f9; background: #334155; }
    .nav-link.nav-link-history {
      color: #fff;
      font-size: 0.85rem;
      font-weight: 700;
      background: linear-gradient(135deg, #7c3aed 0%, #a855f7 100%);
      border: 1px solid rgba(168,85,247,.4);
      box-shadow: 0 2px 10px rgba(124,58,237,.45);
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }
    .nav-link.nav-link-history:hover { background: linear-gradient(135deg, #6d28d9 0%, #9333ea 100%); box-shadow: 0 3px 14px rgba(124,58,237,.6); color: #fff; }
    html.ss-theme-day .nav-link.nav-link-history { color: #fff; background: linear-gradient(135deg, #7c3aed 0%, #a855f7 100%); border-color: rgba(124,58,237,.35); box-shadow: 0 2px 10px rgba(124,58,237,.3); }
    html.ss-theme-day .nav-link.nav-link-history:hover { background: linear-gradient(135deg, #6d28d9 0%, #9333ea 100%); color: #fff; }
    .nav-spacer { display: none; }

    /* ── Page wrap ── */
    .page-wrap {
      max-width: 760px;
      margin: 0 auto;
      padding: 14px 14px 130px;
    }

    /* ── Scan section ── */
    .scan-section {
      background: #1e293b;
      border: 1px solid rgba(59,130,246,.35);
      border-radius: 14px;
      padding: 14px;
      margin-bottom: 12px;
      box-shadow: 0 0 0 1px rgba(59,130,246,.07), 0 2px 12px rgba(59,130,246,.06);
    }
    .scan-row {
      display: flex;
      gap: 8px;
      align-items: center;
    }
    .scan-input {
      flex: 1;
      min-width: 0;
      padding: 12px 16px;
      font-size: 1.05rem;
      background: #0f172a;
      border: 1.5px solid rgba(59,130,246,.4);
      border-radius: 10px;
      color: #f1f5f9;
      transition: border-color 0.15s, box-shadow 0.15s;
    }
    .scan-input:focus {
      outline: none;
      border-color: #3b82f6;
      box-shadow: 0 0 0 3px rgba(59,130,246,0.15);
    }
    .scan-input::placeholder { color: #475569; }
    .scan-action-btn {
      padding: 10px 13px;
      background: rgba(59,130,246,.12);
      border: 1.5px solid rgba(59,130,246,.4);
      border-radius: 10px;
      color: #93c5fd;
      font-size: 0.82rem;
      font-weight: 600;
      cursor: pointer;
      white-space: nowrap;
      transition: background 0.15s, color 0.15s, border-color 0.15s;
      flex-shrink: 0;
    }
    .scan-action-btn:hover { background: rgba(59,130,246,.22); color: #bfdbfe; border-color: rgba(59,130,246,.6); }
    .scan-action-btn.active { background: #1e3a5f; border-color: #3b82f6; color: #93c5fd; }
    #toggleManual.closing { background: rgba(239,68,68,0.12); border-color: rgba(239,68,68,0.35); color: #f87171; }

    /* ── Collapsible panels ── */
    .collapsible-panel {
      display: none;
      margin-top: 12px;
      padding-top: 12px;
      border-top: 1px solid #334155;
    }
    .collapsible-panel.open { display: block; }
    .panel-row {
      display: flex;
      gap: 8px;
      align-items: center;
    }
    .panel-input {
      flex: 1;
      min-width: 0;
      padding: 10px 13px;
      background: #0f172a;
      border: 1.5px solid #334155;
      border-radius: 8px;
      color: #f1f5f9;
      font-size: 0.92rem;
    }
    .panel-input:focus { outline: none; border-color: #3b82f6; }
    .panel-input::placeholder { color: #475569; }
    .panel-btn {
      padding: 10px 16px;
      background: #334155;
      border: none;
      border-radius: 8px;
      color: #f1f5f9;
      font-size: 0.88rem;
      font-weight: 600;
      cursor: pointer;
      white-space: nowrap;
      transition: background 0.15s;
      flex-shrink: 0;
    }
    .panel-btn:hover { background: #475569; }
    .panel-btn.green { background: #15803d; }
    .panel-btn.green:hover { background: #166534; }

    /* Search results */
    .search-results {
      margin-top: 8px;
      max-height: 260px;
      overflow-y: auto;
      background: #f8fafc;
      border-radius: 10px;
      box-shadow: 0 8px 28px rgba(0,0,0,0.35);
    }
    .search-results table { width: 100%; border-collapse: collapse; font-size: 0.83rem; color: #1e293b; }
    .search-results th, .search-results td { padding: 8px 10px; border-bottom: 1px solid #e2e8f0; text-align: left; }
    .search-results th { background: #f1f5f9; font-weight: 600; font-size: 0.75rem; text-transform: uppercase; letter-spacing: 0.04em; color: #64748b; }
    .search-results .btn-add {
      background: #15803d; color: #fff; border: none; padding: 5px 12px;
      border-radius: 6px; cursor: pointer; font-weight: 600; font-size: 0.8rem;
    }
    .search-results .btn-add:hover { background: #166534; }
    .thumb-sm { width: 34px; height: 34px; border-radius: 5px; object-fit: cover; cursor: pointer; }
    .thumb-placeholder {
      width: 34px; height: 34px; border-radius: 5px; background: #e2e8f0; color: #64748b;
      display: inline-flex; align-items: center; justify-content: center; font-size: 0.65rem; font-weight: 600; cursor: pointer;
    }

    /* Manual entry */
    .manual-row { flex-wrap: wrap; }
    #manualTitle { flex: 2; min-width: 140px; }
    #manualPrice { max-width: 110px; }

    /* Bulk manifest */
    .bulk-manifest-panel { /* hidden by JS when not in bulk-manifest mode */ }
    .manifest-section {
      margin-top: 12px;
      padding-top: 12px;
      border-top: 1px solid #334155;
    }
    .bulk-manifest-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 8px;
    }
    .manifest-label {
      font-size: 0.72rem;
      font-weight: 700;
      color: #64748b;
      text-transform: uppercase;
      letter-spacing: 0.06em;
    }
    .bulk-manifest-row {
      display: flex;
      gap: 8px;
      align-items: center;
    }
    .bulk-manifest-select {
      flex: 1;
      min-width: 0;
      padding: 9px 12px;
      background: #0f172a;
      border: 1.5px solid #334155;
      border-radius: 8px;
      color: #f1f5f9;
      font-size: 0.88rem;
    }
    .bulk-manifest-select:focus { outline: none; border-color: #3b82f6; }
    .bulk-manifest-btn {
      padding: 9px 13px;
      background: #334155;
      border: none;
      border-radius: 8px;
      color: #cbd5e1;
      font-size: 0.82rem;
      font-weight: 600;
      cursor: pointer;
      white-space: nowrap;
      transition: background 0.15s;
      flex-shrink: 0;
    }
    .bulk-manifest-btn:hover { background: #475569; color: #f1f5f9; }
    #loadManifestBtn { background: #1d4ed8; color: #fff; }
    #loadManifestBtn:hover { background: #2563eb; }
    .bulk-manifest-info {
      margin-top: 7px;
      font-size: 0.8rem;
      color: #64748b;
      min-height: 14px;
    }
    .bulk-manifest-info.ok { color: #4ade80; }
    .bulk-manifest-info.error { color: #f87171; }

    /* ── Message banner ── */
    .message {
      display: none;
      padding: 11px 15px;
      border-radius: 10px;
      margin-bottom: 12px;
      font-size: 0.88rem;
      font-weight: 500;
    }
    .message.success {
      display: block;
      background: rgba(16,185,129,0.12);
      color: #4ade80;
      border: 1px solid rgba(16,185,129,0.28);
    }
    .message.error {
      display: block;
      background: rgba(239,68,68,0.1);
      color: #fca5a5;
      border: 1px solid rgba(239,68,68,0.22);
    }

    /* ── Items section ── */
    .items-section {
      background: #1e293b;
      border: 1px solid #334155;
      border-radius: 14px;
      overflow: hidden;
    }
    .items-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 12px 16px;
      border-bottom: 1px solid #334155;
    }
    .items-header h3 {
      font-size: 0.72rem;
      font-weight: 700;
      color: #64748b;
      text-transform: uppercase;
      letter-spacing: 0.06em;
    }
    .clear-btn {
      background: transparent;
      color: #475569;
      border: 1px solid #334155;
      padding: 5px 11px;
      border-radius: 6px;
      cursor: pointer;
      font-size: 0.76rem;
      font-weight: 600;
      transition: all 0.15s;
    }
    .clear-btn:hover { background: rgba(239,68,68,0.1); color: #f87171; border-color: rgba(239,68,68,0.3); }
    .items-list { display: flex; flex-direction: column; }
    .empty-state {
      text-align: center;
      color: #334155;
      padding: 52px 24px;
      font-size: 0.9rem;
      line-height: 1.6;
    }
    .empty-icon { font-size: 2rem; display: block; margin-bottom: 8px; opacity: 0.6; }

    /* ── Item card ── */
    .item-card {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 11px 14px;
      border-bottom: 1px solid #1a2234;
      background: #0f172a;
      transition: background 0.1s;
    }
    .item-card:last-child { border-bottom: none; }
    .item-card:hover { background: #111c2e; }
    .item-card.highlight { animation: hl-pulse 0.8s ease-in-out 2; }
    @keyframes hl-pulse {
      0%   { box-shadow: inset 0 0 0 2px transparent; }
      45%  { box-shadow: inset 0 0 0 2px #3b82f6; }
      100% { box-shadow: inset 0 0 0 2px transparent; }
    }
    .item-thumb {
      width: 46px;
      height: 46px;
      border-radius: 8px;
      object-fit: cover;
      flex-shrink: 0;
      background: #1e293b;
    }
    .item-info { flex: 1; min-width: 0; }
    .item-title-input {
      width: 100%;
      background: transparent;
      border: none;
      border-bottom: 1px solid transparent;
      color: #e2e8f0;
      font-size: 0.88rem;
      font-weight: 500;
      padding: 2px 0 3px;
      transition: border-color 0.15s;
    }
    .item-title-input:focus { outline: none; border-bottom-color: #3b82f6; }
    .item-title-input::placeholder { color: #334155; font-weight: 400; }
    .item-barcode {
      font-family: "SF Mono", "Fira Code", ui-monospace, monospace;
      color: #334155;
      font-size: 0.7rem;
      margin-top: 3px;
      letter-spacing: 0.02em;
    }

    /* Price */
    .item-price { position: relative; width: 86px; flex-shrink: 0; }
    .dollar-sign {
      position: absolute;
      left: 9px;
      top: 50%;
      transform: translateY(-50%);
      color: #22c55e;
      font-weight: 700;
      font-size: 0.82rem;
      pointer-events: none;
    }
    .price-input-field {
      width: 100%;
      background: rgba(34,197,94,0.08);
      border: 1.5px solid rgba(34,197,94,0.2);
      border-radius: 7px;
      color: #4ade80;
      padding: 7px 7px 7px 20px;
      font-size: 0.88rem;
      font-weight: 600;
      text-align: right;
    }
    .price-input-field:focus {
      outline: none;
      border-color: #22c55e;
      box-shadow: 0 0 0 2px rgba(34,197,94,0.12);
    }
    .price-input-field::placeholder { color: rgba(74,222,128,0.28); }

    /* Qty */
    .item-qty { display: flex; align-items: center; gap: 4px; flex-shrink: 0; }
    .qty-btn {
      width: 27px;
      height: 27px;
      border: 1px solid #2d3f55;
      border-radius: 7px;
      background: #1e293b;
      color: #64748b;
      cursor: pointer;
      font-size: 0.95rem;
      font-weight: 700;
      transition: all 0.1s;
      display: flex; align-items: center; justify-content: center;
    }
    .qty-btn:hover { background: #334155; color: #f1f5f9; border-color: #475569; }
    .qty-btn.qty-plus { background: rgba(59,130,246,.1); border-color: rgba(59,130,246,.35); color: #93c5fd; }
    .qty-btn.qty-plus:hover { background: rgba(59,130,246,.22); border-color: rgba(59,130,246,.6); color: #bfdbfe; }
    .qty-value {
      min-width: 26px;
      text-align: center;
      font-weight: 700;
      font-size: 0.92rem;
      color: #f1f5f9;
    }

    /* Remove */
    .remove-btn {
      width: 27px;
      height: 27px;
      border: none;
      border-radius: 7px;
      background: transparent;
      color: #334155;
      cursor: pointer;
      font-size: 0.82rem;
      transition: all 0.15s;
      flex-shrink: 0;
      display: flex; align-items: center; justify-content: center;
    }
    .remove-btn:hover { background: rgba(239,68,68,0.14); color: #f87171; }

    /* ── Sticky footer ── */
    .summary-footer {
      position: fixed;
      bottom: 0; left: 0; right: 0;
      background: #1e293b;
      border-top: 1px solid #334155;
      padding: 10px 16px;
      z-index: 100;
    }
    .summary-inner {
      max-width: 760px;
      margin: 0 auto;
      display: flex;
      align-items: center;
      gap: 16px;
    }
    .summary-stats { display: flex; gap: 18px; flex: 1; align-items: center; }
    .stat { text-align: left; }
    .stat-label { font-size: 0.66rem; color: #475569; text-transform: uppercase; letter-spacing: 0.06em; margin-bottom: 1px; }
    .stat-value { font-size: 1.15rem; font-weight: 700; color: #22c55e; line-height: 1.1; }
    .stat-value.qty { color: #60a5fa; }
    .override-input {
      display: flex;
      align-items: center;
      gap: 7px;
      flex-shrink: 0;
    }
    .override-input label { font-size: 0.74rem; color: #475569; white-space: nowrap; }
    .override-input input {
      width: 86px;
      padding: 8px 10px;
      background: #0f172a;
      border: 1.5px solid #334155;
      border-radius: 8px;
      color: #f1f5f9;
      font-size: 0.9rem;
      text-align: center;
    }
    .override-input input:focus { outline: none; border-color: #3b82f6; }
    .override-input input::placeholder { color: #334155; }
    .submit-btn {
      background: linear-gradient(135deg, #16a34a 0%, #0d9245 100%);
      color: #fff;
      border: none;
      padding: 11px 22px;
      border-radius: 10px;
      font-size: 0.92rem;
      font-weight: 700;
      cursor: pointer;
      transition: background 0.15s, box-shadow 0.15s;
      white-space: nowrap;
      flex-shrink: 0;
      box-shadow: 0 2px 14px rgba(22,163,74,.4);
    }
    .submit-btn:hover:not(:disabled) { background: linear-gradient(135deg, #22c55e 0%, #16a34a 100%); box-shadow: 0 4px 18px rgba(22,163,74,.5); }
    .submit-btn:disabled { opacity: 0.4; cursor: not-allowed; box-shadow: none; }

    /* Mobile submit bar — kept for JS compatibility, not used in new design */
    .mobile-submit-bar { display: none !important; }

    /* ── Image modal ── */
    .img-modal {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.88);
      z-index: 2000;
      align-items: center;
      justify-content: center;
    }
    .img-modal.open { display: flex; }
    .img-modal img { max-width: 90%; max-height: 90%; border-radius: 12px; }
    .img-modal .close-btn {
      position: absolute; top: 20px; right: 20px;
      background: rgba(255,255,255,0.15); color: #fff;
      border: none; border-radius: 50%;
      width: 40px; height: 40px; font-size: 1.4rem; cursor: pointer;
    }

    /* ── Location allocation popup ── */
    .loc-alloc-overlay {
      position: fixed; inset: 0;
      background: rgba(2,6,23,0.76);
      backdrop-filter: blur(4px);
      display: flex; align-items: center; justify-content: center;
      z-index: 10050; padding: 16px;
    }
    .loc-alloc-card {
      width: min(680px, 95vw);
      max-height: 88vh;
      overflow-y: auto;
      background: #0f172a;
      border: 1px solid #334155;
      border-radius: 16px;
      padding: 20px;
      box-shadow: 0 24px 64px rgba(0,0,0,0.5);
    }
    .loc-alloc-title { margin: 0 0 8px; font-size: 1rem; font-weight: 700; color: #f8fafc; }
    .loc-alloc-subtitle { margin: 0 0 14px; font-size: 0.86rem; color: #94a3b8; line-height: 1.5; }
    .loc-alloc-summary {
      margin: 0 0 14px; font-size: 0.86rem; font-weight: 600; color: #f8fafc;
      background: rgba(59,130,246,0.12); border: 1px solid rgba(59,130,246,0.3);
      border-radius: 10px; padding: 9px 12px;
    }
    .loc-alloc-summary.ok { color: #bbf7d0; background: rgba(16,185,129,0.12); border-color: rgba(16,185,129,0.36); }
    .loc-alloc-summary.bad { color: #fecaca; background: rgba(239,68,68,0.13); border-color: rgba(239,68,68,0.3); }
    .loc-alloc-list { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px,1fr)); gap: 10px; margin-bottom: 14px; }
    .loc-alloc-item { border: 1px solid #334155; border-radius: 12px; padding: 10px; background: rgba(15,23,42,0.7); transition: border-color 0.15s, background 0.15s; }
    .loc-alloc-item.is-selected { border-color: rgba(16,185,129,0.6); background: rgba(16,185,129,0.14); }
    .loc-alloc-top { display: flex; align-items: center; gap: 6px; }
    .loc-alloc-bubble {
      flex: 1; border: 1px solid #334155; border-radius: 999px; background: #1e293b; color: #e2e8f0;
      padding: 8px 12px; cursor: pointer; display: flex; align-items: center; justify-content: space-between;
      gap: 10px; font-size: 0.82rem; font-weight: 600;
    }
    .loc-alloc-item.is-selected .loc-alloc-bubble { background: rgba(16,185,129,0.22); border-color: rgba(16,185,129,0.65); color: #ecfdf5; }
    .loc-alloc-bubble small { color: #93c5fd; font-weight: 600; font-size: 0.74rem; }
    .loc-alloc-item.is-selected .loc-alloc-bubble small { color: #bbf7d0; }
    .loc-alloc-view {
      border: 1px solid #334155; border-radius: 999px; background: #1e293b; color: #94a3b8;
      padding: 7px 11px; cursor: pointer; font-size: 0.72rem; font-weight: 700;
    }
    .loc-alloc-view:hover { background: rgba(59,130,246,0.2); color: #fff; }
    .loc-alloc-view:disabled { opacity: 0.4; cursor: not-allowed; }
    .loc-alloc-controls { margin-top: 10px; display: grid; grid-template-columns: 34px 1fr 34px; gap: 6px; align-items: center; }
    .loc-alloc-controls button { border: 1px solid #334155; border-radius: 8px; background: #1e293b; color: #fff; padding: 7px 0; cursor: pointer; font-size: 1rem; font-weight: 700; }
    .loc-alloc-controls input { width: 100%; border: 1px solid #334155; border-radius: 8px; background: #0f172a; color: #f8fafc; padding: 7px 8px; text-align: center; font-size: 0.9rem; font-weight: 700; }
    .loc-alloc-actions { display: flex; justify-content: flex-end; gap: 10px; margin-top: 14px; }
    .loc-alloc-actions button { border: none; border-radius: 10px; padding: 10px 16px; font-size: 0.88rem; font-weight: 700; cursor: pointer; }
    .loc-alloc-cancel { background: #334155; color: #e2e8f0; }
    .loc-alloc-cancel:hover { background: #475569; }
    .loc-alloc-confirm { background: #2563eb; color: #fff; }
    .loc-alloc-confirm:hover:not(:disabled) { background: #1d4ed8; }
    .loc-alloc-confirm:disabled { opacity: 0.45; cursor: not-allowed; }

    /* ── Responsive ── */
    @media (max-width: 600px) {
      .nav-link { display: none; }
      .nav-link-history { display: flex; align-items: center; gap: 6px; }
      .page-wrap { padding: 10px 10px 120px; }
      .scan-row { flex-wrap: wrap; }
      .scan-input { flex: 1 1 100%; order: 0; }
      .scan-action-btn { flex: 1; order: 1; }
      .item-card { flex-wrap: wrap; gap: 9px; }
      .item-info { width: calc(100% - 58px); order: 1; }
      .item-thumb { order: 0; }
      .item-price { order: 2; flex: 1; width: auto; }
      .item-qty { order: 3; }
      .remove-btn { order: 4; }
      .summary-stats { gap: 12px; }

      .summary-inner { flex-wrap: wrap; gap: 10px; }
      .summary-stats { width: 100%; }
      .override-input { display: none; }
      .submit-btn { flex: 1; }

    /* ── Day mode ── */

<body>

  <!-- Nav -->
  <nav class="navbar">
    <a href="/store-manager" class="nav-back" title="Back">&#8592;</a>
    <h1 data-i18n="marketplace_session">Marketplace Sale</h1>
    <div class="nav-links">
      <a href="/marketplace-stats" class="nav-link nav-link-history"><i class="fas fa-clock-rotate-left"></i> History</a>
      <a href="/marketplace-schedule-pickup" class="nav-link">Schedule Pickup</a>
      <a href="/marketplace-live-pickups" class="nav-link">Live Pickups</a>
    </div>
  </nav>

  <div class="page-wrap">

    <!-- Scan + Add -->
    <div class="scan-section">
      <div class="scan-row">
        <input id="scanInput" type="text" class="scan-input" placeholder="Scan barcode or type a name to search..." autofocus>
        <button class="scan-action-btn" id="toggleManual">+ Manual</button>
      </div>

      <!-- Live search results (shown when input starts with letters) -->
      <div id="searchResults" class="search-results search-dropdown" style="display:none"></div>

      <!-- Manual entry -->
      <div class="collapsible-panel" id="manualPanel">
        <div class="panel-row manual-row">
          <input id="manualTitle" type="text" class="panel-input" placeholder="Item name (required)">
          <input id="manualPrice" type="number" min="0" step="0.01" class="panel-input" placeholder="Price" style="max-width:110px">
          <button id="manualAddBtn" class="panel-btn green">+ Add</button>
        </div>
      </div>

      <!-- Bulk manifest (shown only when ?source=bulk-manifest) -->
      <div class="bulk-manifest-panel" id="bulkManifestPanel">
        <div class="manifest-section">
          <div class="bulk-manifest-head">
            <span class="manifest-label">Bulk Manifest</span>
            <button id="refreshManifestListBtn" class="bulk-manifest-btn" type="button">&#8635; Refresh</button>
          </div>
          <div class="bulk-manifest-row">
            <select id="bulkManifestSelect" class="bulk-manifest-select">
              <option value="">Select a saved manifest...</option>
            </select>
            <button id="loadManifestBtn" class="bulk-manifest-btn" type="button">Load</button>
          </div>
          <div id="bulkManifestInfo" class="bulk-manifest-info"></div>
        </div>
      </div>
    </div>

    <!-- Status message -->
    <div id="message" class="message"></div>

    <!-- Items list -->
    <div class="items-section">
      <div class="items-header">
        <h3>Session Items</h3>
        <button class="clear-btn" id="clearSession">Clear All</button>
      </div>
      <div class="items-list" id="itemsList">
        <div class="empty-state">
          <span class="empty-icon">&#128230;</span>
          <span data-i18n="marketplace_empty">Scan items to start a session</span>
        </div>
      </div>
    </div>

  </div>

  <!-- Image modal -->
  <div class="img-modal" id="imgModal">
    <button class="close-btn" onclick="closeImgModal()">&#215;</button>
    <img id="imgModalImg" src="" alt="Preview">
  </div>

  <!-- Sticky footer -->
  <div class="summary-footer">
    <div class="summary-inner">
      <div class="summary-stats">
        <div class="stat">
          <div class="stat-label">Items</div>
          <div class="stat-value qty" id="totalQty">0</div>
        </div>
        <div class="stat">
          <div class="stat-label">Auto Total</div>
          <div class="stat-value" id="autoTotal">$0.00</div>
        </div>
        <div class="stat">
          <div class="stat-label">Final</div>
          <div class="stat-value" id="finalTotal">$0.00</div>
        </div>
      </div>
      <div class="override-input">
        <label>Override $</label>
        <input id="finalTotalInput" type="number" min="0" step="0.01" placeholder="—">
      </div>
      <button class="submit-btn" id="submitSession" disabled>Submit Sale</button>
    </div>
  </div>

  <!-- Mobile submit bar (kept for JS compatibility) -->
  <div class="mobile-submit-bar" style="display:none">
    <button class="submit-btn" id="mobileSubmitBtn" disabled>Submit Sale</button>
  </div>

  <script>
    const items = new Map();
    const pendingLookups = new Map();
    const scanInput = document.getElementById('scanInput');
    const itemsList = document.getElementById('itemsList');
    const message = document.getElementById('message');
    const totalQtyEl = document.getElementById('totalQty');
    const autoTotalEl = document.getElementById('autoTotal');
    const finalTotalEl = document.getElementById('finalTotal');
    const finalTotalInput = document.getElementById('finalTotalInput');
    const submitBtn = document.getElementById('submitSession');
    const mobileSubmitBtn = document.getElementById('mobileSubmitBtn');
    const clearBtn = document.getElementById('clearSession');
    const toggleManual = document.getElementById('toggleManual');
    const manualPanel = document.getElementById('manualPanel');
    const bulkManifestPanel = document.getElementById('bulkManifestPanel');
    const bulkManifestSelect = document.getElementById('bulkManifestSelect');
    const loadManifestBtn = document.getElementById('loadManifestBtn');
    const refreshManifestListBtn = document.getElementById('refreshManifestListBtn');
    const bulkManifestInfo = document.getElementById('bulkManifestInfo');
    const urlParams = new URLSearchParams(window.location.search);
    const bulkManifestSource = String(urlParams.get('source') || urlParams.get('from') || '').trim().toLowerCase();
    const showBulkManifestIntegration = bulkManifestSource === 'bulk-manifest';

    if (bulkManifestPanel && !showBulkManifestIntegration) {
      bulkManifestPanel.style.display = 'none';
    }

    let bulkManifestCache = [];
    let activeBulkManifest = null;

    // Toggle manual entry panel
    toggleManual.addEventListener('click', () => {
      manualPanel.classList.toggle('open');
      const isOpen = manualPanel.classList.contains('open');
      toggleManual.textContent = isOpen ? '✕ Close' : '+ Manual';
      toggleManual.classList.toggle('closing', isOpen);
      toggleManual.classList.toggle('active', isOpen);
      if (isOpen) document.getElementById('manualTitle').focus();
    });

    if (showBulkManifestIntegration) {
      refreshManifestListBtn.addEventListener('click', () => {
        loadBulkManifestHistory(parseManifestId(bulkManifestSelect.value));
      });
      loadManifestBtn.addEventListener('click', () => {
        loadBulkManifest(bulkManifestSelect.value);
      });
      bulkManifestSelect.addEventListener('change', () => {
        const selectedId = parseManifestId(bulkManifestSelect.value);
        if (!selectedId) {
          setBulkManifestInfo('Select a manifest to load it into this sale session.', null);
          return;
        }
        const row = bulkManifestCache.find(x => parseManifestId(x.id) === selectedId);
        if (!row) return;
        const title = String(row.manifest_title || '').trim() || ('Manifest #' + selectedId);
        setBulkManifestInfo(`Ready to load #${selectedId} (${title})`, null);
      });
    }

    function fmtMoney(v) {
      const n = isNaN(v) ? 0 : v;
      return '$' + n.toFixed(2);
    }

    function esc(value) {
      return String(value == null ? '' : value)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#39;');
    }

    function parsePosInt(value, fallback = 0) {
      const n = Number.parseInt(value, 10);
      return Number.isFinite(n) ? n : fallback;
    }

    function normalizeLocationKey(value) {
      const raw = String(value == null ? '' : value).trim().toLowerCase();
      return raw || '__no_code__';
    }

    function showMessage(text, type) {
      message.textContent = text;
      message.className = 'message ' + type;
    }

    function hideMessage() {
      message.className = 'message';
    }

    function setBulkManifestInfo(text, tone) {
      bulkManifestInfo.className = 'bulk-manifest-info';
      if (tone) bulkManifestInfo.classList.add(tone);
      bulkManifestInfo.textContent = text || '';
    }

    function normalizeManifestStatus(status) {
      const raw = String(status || '').trim().toLowerCase();
      if (raw === 'sold') return 'sold';
      if (raw === 'cleanup_complete') return 'cleanup_complete';
      if (raw === 'cleanup_partial') return 'cleanup_partial';
      return 'created';
    }

    function manifestStatusLabel(status) {
      const key = normalizeManifestStatus(status);
      if (key === 'sold') return 'Sold';
      if (key === 'cleanup_complete') return 'Cleanup Complete';
      if (key === 'cleanup_partial') return 'Cleanup Partial';
      return 'Created';
    }

    function parseManifestId(value) {
      const n = Number.parseInt(value, 10);
      return Number.isFinite(n) && n > 0 ? n : 0;
    }

    function renderBulkManifestOptions(manifests, selectedId) {
      const rows = Array.isArray(manifests) ? manifests : [];
      const selected = parseManifestId(selectedId);
      const options = ['<option value="">Select a saved manifest...</option>'];
      rows.forEach(row => {
        const id = parseManifestId(row.id);
        if (!id) return;
        const title = String(row.manifest_title || '').trim() || ('Manifest #' + id);
        const dateText = String(row.manifest_date || '').trim() || String(row.created_at || '').slice(0, 10);
        const units = Number(row.total_units || 0);
        const statusText = manifestStatusLabel(row.status);
        const selectedAttr = id === selected ? ' selected' : '';
        options.push(`<option value="${id}"${selectedAttr}>#${id} • ${title} • ${dateText} • ${units} unit(s) • ${statusText}</option>`);
      });
      bulkManifestSelect.innerHTML = options.join('');
    }

    async function loadBulkManifestHistory(selectedId) {
      setBulkManifestInfo('Loading saved manifests...', null);
      try {
        const resp = await fetch('/api/bulk-manifest/history?limit=120');
        const data = await resp.json();
        if (!data || !data.success) {
          throw new Error((data && data.error) || 'Failed to load manifest list');
        }
        bulkManifestCache = Array.isArray(data.manifests) ? data.manifests : [];
        renderBulkManifestOptions(bulkManifestCache, selectedId);
        if (!bulkManifestCache.length) {
          setBulkManifestInfo('No saved manifests found. Save one first from Bulk Manifest page.', null);
        } else if (selectedId) {
          setBulkManifestInfo('Manifest list refreshed.', 'ok');
        } else {
          setBulkManifestInfo('Select a manifest to load it into this sale session.', null);
        }
      } catch (err) {
        bulkManifestCache = [];
        renderBulkManifestOptions([], 0);
        setBulkManifestInfo(err && err.message ? err.message : 'Failed to load manifest list', 'error');
      }
    }

    function setActiveBulkManifest(manifest) {
      activeBulkManifest = manifest || null;
      if (!activeBulkManifest) return;
      const title = String(activeBulkManifest.manifest_title || '').trim() || ('Manifest #' + activeBulkManifest.id);
      const statusText = manifestStatusLabel(activeBulkManifest.status);
      setBulkManifestInfo(`Loaded #${activeBulkManifest.id} (${title}) • ${activeBulkManifest.total_units || 0} unit(s) • ${statusText}`, 'ok');
    }

    async function loadBulkManifest(manifestId) {
      const id = parseManifestId(manifestId);
      if (!id) {
        setBulkManifestInfo('Select a manifest first.', 'error');
        return;
      }
      loadManifestBtn.disabled = true;
      setBulkManifestInfo('Loading manifest #' + id + '...', null);
      try {
        const resp = await fetch('/api/bulk-manifest/' + encodeURIComponent(id));
        const data = await resp.json();
        if (!resp.ok || !data || !data.success) {
          throw new Error((data && data.error) || 'Failed to load manifest');
        }

        const manifest = data.manifest || {};
        const lineItems = Array.isArray(data.items) ? data.items : [];
        if (!lineItems.length) {
          throw new Error('Manifest has no line items');
        }

        items.clear();
        lineItems.forEach(line => {
          const barcode = String(line.barcode || '').trim();
          if (!barcode) return;
          const qty = Math.max(1, Number.parseInt(line.quantity, 10) || 1);
          const unitPrice = Number.parseFloat(line.unit_price || 0);
          const lineTotalRaw = Number.parseFloat(line.line_total);
          const lineTotal = Number.isFinite(lineTotalRaw)
            ? lineTotalRaw
            : ((Number.isFinite(unitPrice) ? unitPrice : 0) * qty);
          const priceText = Number.isFinite(lineTotal) && lineTotal > 0 ? lineTotal.toFixed(2) : '';

          if (items.has(barcode)) {
            const existing = items.get(barcode);
            const oldPrice = Number.parseFloat(existing.price || 0);
            const mergedPrice = (Number.isFinite(oldPrice) ? oldPrice : 0) + (Number.isFinite(lineTotal) ? lineTotal : 0);
            existing.qty += qty;
            if (!existing.title && line.title) existing.title = String(line.title || '').trim();
            if (!existing.image && line.image_url) existing.image = String(line.image_url || '').trim();
            existing.price = mergedPrice > 0 ? mergedPrice.toFixed(2) : existing.price;
            items.set(barcode, existing);
          } else {
            items.set(barcode, {
              barcode: barcode,
              title: String(line.title || '').trim(),
              image: String(line.image_url || '').trim(),
              qty: qty,
              price: priceText
            });
          }
        });

        const chosen = {
          id: id,
          manifest_title: String(manifest.manifest_title || '').trim(),
          status: normalizeManifestStatus(manifest.status),
          total_units: Number(manifest.total_units || 0),
          total_items: Number(manifest.total_items || 0),
          manifest_date: String(manifest.manifest_date || '').trim()
        };
        setActiveBulkManifest(chosen);
        renderItems();
        showMessage('Loaded manifest #' + id + ' into session.', 'success');
      } catch (err) {
        setBulkManifestInfo(err && err.message ? err.message : 'Failed to load manifest', 'error');
        showMessage(err && err.message ? err.message : 'Failed to load manifest', 'error');
      } finally {
        loadManifestBtn.disabled = false;
      }
    }

    async function lookupItem(barcode) {
      try {
        const resp = await fetch(`/api/marketplace/lookup?barcode=${encodeURIComponent(barcode)}`);
        const data = await resp.json();
        if (data.success && data.found) {
          return { title: data.title || '', image: data.image_url || '' };
        }
      } catch (e) {}
      return { title: '', image: '' };
    }

    function promptMarketplaceLocationAllocation(item, options) {
      return new Promise((resolve) => {
        const existing = document.getElementById('marketplace-location-allocation-popup');
        if (existing) existing.remove();

        const requiredQty = Math.max(1, parsePosInt(options.quantity ?? item.qty, 1));
        const locations = Array.isArray(options.locations) ? options.locations : [];
        if (!locations.length) {
          resolve([]);
          return;
        }

        const state = locations.map((loc) => ({
          location_key: normalizeLocationKey(loc.location_key || loc.location_code),
          location_code: String(loc.location_code || '(No Code)'),
          available_qty: Math.max(0, parsePosInt(loc.available_qty, 0)),
          selected_qty: 0,
          preview_key: String(loc.preview_key || loc.location_code || '').trim()
        }));

        const overlay = document.createElement('div');
        overlay.id = 'marketplace-location-allocation-popup';
        overlay.className = 'loc-alloc-overlay';

        const card = document.createElement('div');
        card.className = 'loc-alloc-card';
        card.onclick = (e) => e.stopPropagation();

        const title = document.createElement('h3');
        title.className = 'loc-alloc-title';
        title.textContent = 'Select Removal Location(s)';

        const subtitle = document.createElement('p');
        subtitle.className = 'loc-alloc-subtitle';
        subtitle.innerHTML = `Item <strong>${esc(item.title || item.barcode || '')}</strong> needs <strong>${requiredQty}</strong> unit(s) removed from inventory.`;

        const summary = document.createElement('div');
        summary.className = 'loc-alloc-summary';

        const list = document.createElement('div');
        list.className = 'loc-alloc-list';

        const actions = document.createElement('div');
        actions.className = 'loc-alloc-actions';
        actions.innerHTML = `
          <button type="button" class="loc-alloc-cancel">Cancel</button>
          <button type="button" class="loc-alloc-confirm">Use Selection</button>
        `;

        card.appendChild(title);
        card.appendChild(subtitle);
        card.appendChild(summary);
        card.appendChild(list);
        card.appendChild(actions);
        overlay.appendChild(card);
        document.body.appendChild(overlay);

        const cancelBtn = actions.querySelector('.loc-alloc-cancel');
        const confirmBtn = actions.querySelector('.loc-alloc-confirm');

        const totalSelected = () => state.reduce((acc, loc) => acc + parsePosInt(loc.selected_qty, 0), 0);

        function clampQty(index, rawQty) {
          const loc = state[index];
          if (!loc) return;
          let qty = parsePosInt(rawQty, 0);
          if (qty < 0) qty = 0;
          if (qty > loc.available_qty) qty = loc.available_qty;
          loc.selected_qty = qty;
        }

        function renderState() {
          const selected = totalSelected();
          const remaining = requiredQty - selected;
          const canFulfill = options.can_fulfill !== false;

          if (!canFulfill) {
            summary.className = 'loc-alloc-summary bad';
            summary.textContent = `Not enough inventory available (have ${options.total_available || 0}, need ${requiredQty}).`;
          } else if (remaining === 0) {
            summary.className = 'loc-alloc-summary ok';
            summary.textContent = `Ready: selected ${selected} / ${requiredQty}.`;
          } else if (remaining > 0) {
            summary.className = 'loc-alloc-summary';
            summary.textContent = `Select ${remaining} more unit(s). Selected ${selected} / ${requiredQty}.`;
          } else {
            summary.className = 'loc-alloc-summary bad';
            summary.textContent = `Over-selected by ${Math.abs(remaining)}. Reduce selection.`;
          }

          confirmBtn.disabled = !canFulfill || remaining !== 0;

          list.innerHTML = state.map((loc, idx) => {
            const isSelected = parsePosInt(loc.selected_qty, 0) > 0;
            return `
              <div class="loc-alloc-item ${isSelected ? 'is-selected' : ''}" data-index="${idx}">
                <div class="loc-alloc-top">
                  <button type="button" class="loc-alloc-bubble" data-role="toggle" data-index="${idx}">
                    <span>${esc(loc.location_code)}</span>
                    <small>Avail ${loc.available_qty}</small>
                  </button>
                  <button type="button" class="loc-alloc-view" data-role="view" data-index="${idx}" ${loc.preview_key ? '' : 'disabled'}>
                    View
                  </button>
                </div>
                ${isSelected ? `
                  <div class="loc-alloc-controls">
                    <button type="button" data-role="dec" data-index="${idx}">-</button>
                    <input type="number" min="0" max="${loc.available_qty}" value="${loc.selected_qty}" data-role="qty" data-index="${idx}">
                    <button type="button" data-role="inc" data-index="${idx}">+</button>
                  </div>
                ` : ''}
              </div>
            `;
          }).join('');
        }

        function closeWith(value) {
          document.removeEventListener('keydown', onKeyDown);
          overlay.remove();
          resolve(value);
        }

        function onKeyDown(e) {
          if (e.key === 'Escape') {
            e.preventDefault();
            closeWith(null);
          }
        }
        document.addEventListener('keydown', onKeyDown);

        overlay.onclick = (e) => {
          if (e.target === overlay) closeWith(null);
        };
        cancelBtn.onclick = () => closeWith(null);
        confirmBtn.onclick = () => {
          const allocations = state
            .filter(loc => parsePosInt(loc.selected_qty, 0) > 0)
            .map(loc => ({
              location_key: loc.location_key,
              location_code: loc.location_code,
              quantity: parsePosInt(loc.selected_qty, 0)
            }));
          closeWith(allocations);
        };

        list.addEventListener('click', (e) => {
          const target = e.target.closest('[data-role]');
          if (!target) return;
          const idx = parsePosInt(target.getAttribute('data-index'), -1);
          if (idx < 0 || !state[idx]) return;
          const role = target.getAttribute('data-role');
          const loc = state[idx];

          if (role === 'toggle') {
            if (parsePosInt(loc.selected_qty, 0) > 0) {
              loc.selected_qty = 0;
            } else {
              const remaining = requiredQty - totalSelected();
              const seed = remaining > 0 ? remaining : 1;
              clampQty(idx, Math.min(loc.available_qty, seed));
            }
            renderState();
            return;
          }
          if (role === 'dec') {
            clampQty(idx, parsePosInt(loc.selected_qty, 0) - 1);
            renderState();
            return;
          }
          if (role === 'inc') {
            clampQty(idx, parsePosInt(loc.selected_qty, 0) + 1);
            renderState();
            return;
          }
          if (role === 'view') {
            if (!window.SSLocationPreview || !loc.preview_key) return;
            window.SSLocationPreview.openForLocation(loc.location_code, loc.preview_key, `Location: ${loc.location_code}`);
          }
        });

        list.addEventListener('input', (e) => {
          const input = e.target.closest('input[data-role="qty"]');
          if (!input) return;
          const idx = parsePosInt(input.getAttribute('data-index'), -1);
          if (idx < 0 || !state[idx]) return;
          clampQty(idx, input.value);
          renderState();
        });

        renderState();
      });
    }

    async function submitMarketplaceItem(item, context) {
      const payload = {
        barcode: item.barcode,
        title: item.title || '',
        quantity: item.qty,
        price: context.itemPrice,
        session_id: context.sessionId,
        price_auto: context.priceAuto,
        store: context.saleStore,
        bulk_manifest_id: context.bulkManifestId || undefined
      };

      while (true) {
        const resp = await fetch('/api/marketplace/sale', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(payload)
        });
        const data = await resp.json().catch(() => ({ success: false, error: 'Invalid server response' }));

        if (data.success) return data;
        if (data.location_selection_required) {
          const chosen = await promptMarketplaceLocationAllocation(item, data);
          if (!chosen || !chosen.length) {
            return { success: false, cancelled: true, error: 'Location selection cancelled' };
          }
          payload.allocations = chosen;
          continue;
        }
        return data;
      }
    }

    async function searchByName(q) {
      const resultsEl = document.getElementById('searchResults');
      if (!q) return;
      resultsEl.style.display = 'block';
      resultsEl.innerHTML = '<div style="padding:18px;text-align:center;color:#64748b;font-size:0.88rem">Searching...</div>';
      try {
        const resp = await fetch(`/api/marketplace/search?q=${encodeURIComponent(q)}`);
        const data = await resp.json();
        if (!data.success) {
          resultsEl.innerHTML = '<div style="padding:18px;text-align:center;color:#e74c3c;font-size:0.88rem">Search failed</div>';
          return;
        }
        const rows = data.results || [];
        if (rows.length === 0) {
          resultsEl.innerHTML = '<div style="padding:18px;text-align:center;color:#64748b;font-size:0.88rem">No matches found</div>';
          return;
        }
        let html = '<table><thead><tr><th></th><th>UPC</th><th>Title</th><th></th></tr></thead><tbody>';
        const noImgSvg = 'data:image/svg+xml;utf8,' + encodeURIComponent('<svg xmlns="http://www.w3.org/2000/svg" width="36" height="36"><rect width="100%" height="100%" fill="#f0f0f0"/><text x="50%" y="50%" dominant-baseline="middle" text-anchor="middle" fill="#bbb" font-size="8">No img</text></svg>');
        rows.forEach((r, idx) => {
          const img = r.image_url || '';
          const thumb = img || noImgSvg;
          let imgCell;
          if (idx < 3) {
            imgCell = `<img class="thumb-sm" src="${thumb}" data-full="${img}" onclick="openSearchImg(this)" onerror="this.src='${noImgSvg}'">`;
          } else {
            imgCell = `<span class="thumb-placeholder" data-img="${img}" onclick="revealThumb(this)">show</span>`;
          }
          html += `<tr>
            <td>${imgCell}</td>
            <td style="font-family:monospace;font-size:0.78rem">${r.upc || ''}</td>
            <td style="word-break:break-word">${r.item_description || ''}</td>
            <td><button class="btn-add" data-upc="${r.upc || ''}">+ Add</button></td>
          </tr>`;
        });
        html += '</tbody></table>';
        resultsEl.innerHTML = html;
        resultsEl.querySelectorAll('.btn-add').forEach(btn => {
          btn.addEventListener('click', () => {
            const upc = btn.dataset.upc || '';
            if (upc) {
              addScan(upc);
              scanInput.value = '';
              clearSearchResults();
            }
          });
        });
      } catch (e) {
        resultsEl.innerHTML = '<div style="padding:18px;text-align:center;color:#e74c3c;font-size:0.88rem">Search failed</div>';
      }
    }

    let lastGeneratedBarcode = null;

    function nextLocalBarcode() {
      const num = parseInt(lastGeneratedBarcode, 10) + 1;
      lastGeneratedBarcode = String(num).padStart(12, '0');
      if (!lastGeneratedBarcode.startsWith('888000')) {
        lastGeneratedBarcode = '888000' + lastGeneratedBarcode.slice(6);
      }
      return lastGeneratedBarcode;
    }

    async function addManualItem() {
      const titleInput = document.getElementById('manualTitle');
      const priceInput = document.getElementById('manualPrice');
      const title = (titleInput.value || '').trim();

      if (!title) {
        showMessage('Please enter an item name', 'error');
        titleInput.focus();
        return;
      }

      let barcode;
      try {
        if (lastGeneratedBarcode) {
          barcode = nextLocalBarcode();
          while (items.has(barcode)) barcode = nextLocalBarcode();
        } else {
          const resp = await fetch('/api/marketplace/generate-barcode', { method: 'POST' });
          const data = await resp.json();
          if (!data.success) {
            showMessage('Failed to generate barcode', 'error');
            return;
          }
          barcode = data.barcode;
          lastGeneratedBarcode = barcode;
        }
        const price = priceInput.value || '';

        items.set(barcode, {
          barcode: barcode,
          title: title,
          image: '',
          qty: 1,
          price: price
        });

        renderItems();
        showMessage('Added: ' + title, 'success');

        titleInput.value = '';
        priceInput.value = '';
        titleInput.focus();
      } catch (e) {
        showMessage('Error adding item', 'error');
      }
    }

    document.getElementById('manualAddBtn').addEventListener('click', addManualItem);
    document.getElementById('manualTitle').addEventListener('keydown', (e) => {
      if (e.key === 'Enter') { e.preventDefault(); document.getElementById('manualPrice').focus(); }
    });
    document.getElementById('manualPrice').addEventListener('keydown', (e) => {
      if (e.key === 'Enter') { e.preventDefault(); addManualItem(); }
    });

    async function addScan(barcode) {
      const normalized = String(barcode || '').trim();
      if (!normalized) return;

      if (items.has(normalized)) {
        const item = items.get(normalized);
        item.qty += 1;
        items.set(normalized, item);
        renderItems();
        return;
      }

      const pending = pendingLookups.get(normalized);
      if (pending) {
        pending.qty += 1;
        return;
      }

      pendingLookups.set(normalized, { qty: 1 });
      const info = await lookupItem(normalized);
      const pendingState = pendingLookups.get(normalized) || { qty: 1 };
      pendingLookups.delete(normalized);
      const isNotFound = !info.title && !info.image;

      if (items.has(normalized)) {
        const item = items.get(normalized);
        item.qty += pendingState.qty;
        if (!item.title && info.title) item.title = info.title;
        if (!item.image && info.image) item.image = info.image;
        items.set(normalized, item);
      } else {
        items.set(normalized, {
          barcode: normalized,
          title: info.title || '',
          image: info.image || '',
          qty: pendingState.qty,
          price: ''
        });
      }

      renderItems();

      if (isNotFound) {
        showMessage('Item not in system \u2014 enter a name below', 'error');
        setTimeout(() => {
          const card = document.querySelector(`.item-card[data-barcode="${normalized}"]`);
          if (card) {
            const titleEl = card.querySelector('.title-input');
            if (titleEl) titleEl.focus();
            card.classList.add('highlight');
            setTimeout(() => card.classList.remove('highlight'), 2000);
          }
        }, 50);
      }
    }

    function renderItems() {
      if (items.size === 0) {
        itemsList.innerHTML = '<div class="empty-state"><span class="empty-icon">&#128230;</span><span data-i18n="marketplace_empty">Scan items to start a session</span></div>';
        submitBtn.disabled = true;
        mobileSubmitBtn.disabled = true;
        updateSummary();
        return;
      }
      const noImgSvg = 'data:image/svg+xml;utf8,' + encodeURIComponent('<svg xmlns="http://www.w3.org/2000/svg" width="46" height="46"><rect width="100%" height="100%" fill="#1e293b"/></svg>');
      const html = [];
      for (const item of items.values()) {
        const thumb = item.image ? item.image : noImgSvg;
        html.push(`
          <div class="item-card" data-barcode="${esc(item.barcode)}">
            <img class="item-thumb" src="${esc(thumb)}" onerror="this.src='${noImgSvg}'">
            <div class="item-info">
              <input type="text" class="item-title-input title-input" value="${esc(item.title || '')}" placeholder="Item name">
              <div class="item-barcode">${esc(item.barcode)}</div>
            </div>
            <div class="item-price">
              <span class="dollar-sign">$</span>
              <input type="number" class="price-input-field" min="0" step="0.01" placeholder="0.00" value="${esc(item.price)}">
            </div>
            <div class="item-qty">
              <button class="qty-btn qty-minus">&#8722;</button>
              <div class="qty-value">${item.qty}</div>
              <button class="qty-btn qty-plus">+</button>
            </div>
            <button class="remove-btn">&#10005;</button>
          </div>
        `);
      }
      itemsList.innerHTML = html.join('');
      attachRowHandlers();
      submitBtn.disabled = false;
      mobileSubmitBtn.disabled = false;
      updateSummary();
    }

    function attachRowHandlers() {
      document.querySelectorAll('.item-card').forEach(row => {
        const barcode = row.dataset.barcode;
        const item = items.get(barcode);
        const titleInput = row.querySelector('.title-input');
        const priceInput = row.querySelector('.price-input-field');
        const minus = row.querySelector('.qty-minus');
        const plus = row.querySelector('.qty-plus');
        const remove = row.querySelector('.remove-btn');

        titleInput.addEventListener('input', () => {
          item.title = titleInput.value.trim();
          items.set(barcode, item);
        });
        priceInput.addEventListener('input', () => {
          item.price = priceInput.value;
          items.set(barcode, item);
          updateSummary();
        });
        minus.addEventListener('click', () => {
          if (item.qty > 1) {
            item.qty -= 1;
            items.set(barcode, item);
            renderItems();
          }
        });
        plus.addEventListener('click', () => {
          item.qty += 1;
          items.set(barcode, item);
          renderItems();
        });
        remove.addEventListener('click', () => {
          items.delete(barcode);
          renderItems();
        });
      });
    }

    function getTotals() {
      let totalQty = 0;
      let autoTotal = 0;
      for (const item of items.values()) {
        totalQty += item.qty;
        const p = parseFloat(item.price || 0);
        if (!isNaN(p)) autoTotal += p;
      }
      return { totalQty, autoTotal };
    }

    function updateSummary() {
      const { totalQty, autoTotal } = getTotals();
      totalQtyEl.textContent = totalQty;
      autoTotalEl.textContent = fmtMoney(autoTotal);
      const override = parseFloat(finalTotalInput.value);
      const finalTotal = !isNaN(override) && override >= 0 ? override : autoTotal;
      finalTotalEl.textContent = fmtMoney(finalTotal);
    }

    // Unified scan + name-search input
    // Barcodes always start with a digit; names always start with a letter.
    let _searchDebounce = null;
    const searchResultsEl = document.getElementById('searchResults');

    function clearSearchResults() {
      if (searchResultsEl) searchResultsEl.style.display = 'none';
    }

    scanInput.addEventListener('input', () => {
      clearTimeout(_searchDebounce);
      const q = scanInput.value.trim();
      if (!q || /^\d/.test(q)) {
        clearSearchResults();
        return;
      }
      // Starts with a letter — live name search
      if (q.length < 2) { clearSearchResults(); return; }
      _searchDebounce = setTimeout(() => searchByName(q), 280);
    });

    scanInput.addEventListener('keydown', (e) => {
      if (e.key === 'Escape') {
        scanInput.value = '';
        clearTimeout(_searchDebounce);
        clearSearchResults();
        return;
      }
      if (e.key === 'Enter') {
        e.preventDefault();
        clearTimeout(_searchDebounce);
        const code = scanInput.value.trim();
        if (!code) return;
        if (/^\d/.test(code)) {
          // Barcode scan
          scanInput.value = '';
          clearSearchResults();
          addScan(code);
        } else {
          // Force immediate name search
          searchByName(code);
        }
      }
    });

    finalTotalInput.addEventListener('input', updateSummary);

    clearBtn.addEventListener('click', () => {
      const t = (window.i18n && window.i18n.t) ? window.i18n.t : (k => k);
      if (confirm(t('marketplace_clear_confirm') || 'Clear all items?')) {
        items.clear();
        activeBulkManifest = null;
        renderItems();
        setBulkManifestInfo('Session cleared. Select a manifest or scan items to start.', null);
      }
    });

    mobileSubmitBtn.addEventListener('click', () => submitBtn.click());

    submitBtn.addEventListener('click', async () => {
      if (items.size === 0) return;
      submitBtn.disabled = true;
      mobileSubmitBtn.disabled = true;
      submitBtn.textContent = 'Submitting...';
      mobileSubmitBtn.textContent = 'Submitting...';
      hideMessage();
      const sessionId = 'session-' + Date.now().toString(36) + '-' + Math.random().toString(36).slice(2, 7);
      const { totalQty, autoTotal } = getTotals();
      const override = parseFloat(finalTotalInput.value);
      let finalTotal = (!isNaN(override) && override >= 0) ? override : autoTotal;
      const bulkManifestId = activeBulkManifest ? parseManifestId(activeBulkManifest.id) : 0;
      const saleStore = bulkManifestId ? 'marketplace-sale-bulk' : 'marketplace';

      const itemList = Array.from(items.values());
      let priceMap = new Map();
      let priceAutoMap = new Map();
      if (totalQty > 0) {
        if (!isNaN(override) && override >= 0) {
          if (autoTotal > 0) {
            const ratio = finalTotal / autoTotal;
            itemList.forEach(i => {
              const p = parseFloat(i.price || 0);
              const unit = isNaN(p) ? 0 : p * ratio;
              priceMap.set(i.barcode, unit);
              priceAutoMap.set(i.barcode, Math.abs(ratio - 1) > 0.001 || !i.price);
            });
          } else {
            const perItem = finalTotal / itemList.length;
            itemList.forEach(i => {
              priceMap.set(i.barcode, perItem);
              priceAutoMap.set(i.barcode, true);
            });
          }
        } else {
          itemList.forEach(i => {
            const p = parseFloat(i.price || 0);
            priceMap.set(i.barcode, isNaN(p) ? 0 : p);
            priceAutoMap.set(i.barcode, false);
          });
        }
      }

      let success = 0;
      let fail = 0;
      let submitStopped = false;
      const warnings = [];
      for (const item of itemList) {
        const itemPrice = priceMap.get(item.barcode) || 0;
        const priceAuto = priceAutoMap.get(item.barcode) || false;
        try {
          const data = await submitMarketplaceItem(item, {
            itemPrice,
            priceAuto,
            sessionId,
            saleStore,
            bulkManifestId
          });

          if (data.success) {
            success += 1;
            if (data.inventory_removal_error) {
              warnings.push(`${item.barcode}: ${data.inventory_removal_error}`);
            }
          } else {
            fail += 1;
            if (data.cancelled) {
              submitStopped = true;
              warnings.push(`${item.barcode}: location selection cancelled`);
              break;
            }
            warnings.push(`${item.barcode}: ${data.error || 'Sale failed'}`);
          }
        } catch (e) {
          fail += 1;
          warnings.push(`${item.barcode}: ${e && e.message ? e.message : 'Sale failed'}`);
        }
      }

      submitBtn.textContent = 'Submit Sale';
      mobileSubmitBtn.textContent = 'Submit Sale';
      if (fail === 0) {
        let soldMarkMessage = '';
        if (bulkManifestId) {
          try {
            const soldResp = await fetch('/api/bulk-manifest/' + encodeURIComponent(bulkManifestId) + '/mark-sold', {
              method: 'POST',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify({
                session_id: sessionId,
                sold_total: finalTotal,
                sold_rows: success,
                status: 'sold'
              })
            });
            const soldData = await soldResp.json();
            if (!soldResp.ok || !soldData || !soldData.success) {
              throw new Error((soldData && soldData.error) || 'Failed to mark manifest sold');
            }
            soldMarkMessage = ` Bulk manifest #${bulkManifestId} marked as sold.`;
          } catch (markErr) {
            soldMarkMessage = ` Sale submitted, but manifest status update failed: ${markErr && markErr.message ? markErr.message : 'unknown error'}.`;
          }
        }
        const baseSuccess = (window.i18n && window.i18n.t) ? window.i18n.t('marketplace_submit_success') : 'Sale submitted successfully!';
        const warningText = warnings.length ? ` Inventory warning: ${warnings.slice(0, 2).join(' | ')}` : '';
        showMessage(baseSuccess + soldMarkMessage + warningText, warnings.length ? 'error' : 'success');
        items.clear();
        finalTotalInput.value = '';
        if (bulkManifestId) {
          setBulkManifestInfo(
            `Sale complete for manifest #${bulkManifestId}. Open Move Location and load this manifest to remove sold qty by location.`,
            'ok'
          );
        }
        activeBulkManifest = null;
        renderItems();
        if (showBulkManifestIntegration) {
          loadBulkManifestHistory(bulkManifestId || parseManifestId(bulkManifestSelect.value));
        }
      } else {
        const t = (window.i18n && window.i18n.t) ? window.i18n.t : (k => k);
        const msg = (t('marketplace_submit_partial') || 'Submitted {success}, failed {fail}')
          .replace('{success}', success)
          .replace('{fail}', fail);
        const extra = warnings.length ? ' ' + warnings.slice(0, 2).join(' | ') : '';
        showMessage(msg + (submitStopped ? ' Submission stopped.' : '') + extra, 'error');
      }
      submitBtn.disabled = false;
      mobileSubmitBtn.disabled = false;
      scanInput.focus();
    });

    async function initMarketplaceSessionPage() {
      renderItems();
      if (showBulkManifestIntegration) {
        const queryManifestId = parseManifestId(urlParams.get('manifest_id'));
        await loadBulkManifestHistory(queryManifestId);
        if (queryManifestId) {
          bulkManifestSelect.value = String(queryManifestId);
          await loadBulkManifest(queryManifestId);
        }
      }

      setTimeout(() => {
        scanInput.focus();
        scanInput.select();
      }, 100);
    }

    initMarketplaceSessionPage();

    function openSearchImg(imgEl) {
      const fullSrc = imgEl.dataset.full || imgEl.src;
      if (!fullSrc || fullSrc.startsWith('data:')) return;
      document.getElementById('imgModalImg').src = fullSrc;
      document.getElementById('imgModal').classList.add('open');
    }
    function closeImgModal() {
      document.getElementById('imgModal').classList.remove('open');
      document.getElementById('imgModalImg').src = '';
    }
    function revealThumb(placeholder) {
      const img = placeholder.dataset.img || '';
      const noImgSvg = 'data:image/svg+xml;utf8,' + encodeURIComponent('<svg xmlns="http://www.w3.org/2000/svg" width="36" height="36"><rect width="100%" height="100%" fill="#f0f0f0"/><text x="50%" y="50%" dominant-baseline="middle" text-anchor="middle" fill="#bbb" font-size="8">No img</text></svg>');
      const thumb = img || noImgSvg;
      const imgEl = document.createElement('img');
      imgEl.className = 'thumb-sm';
      imgEl.src = thumb;
      imgEl.dataset.full = img;
      imgEl.onclick = function() { openSearchImg(this); };
      imgEl.onerror = function() { this.src = noImgSvg; };
      placeholder.replaceWith(imgEl);
    }
    document.getElementById('imgModal').addEventListener('click', function(e) {
      if (e.target === this) closeImgModal();
    });
  </script>
