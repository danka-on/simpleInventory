<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Marketplace Session</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
  <style>
    * { box-sizing: border-box; }
    body {
      font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
      background: #1a1a2e;
      min-height: 100vh;
      margin: 0;
      padding: 0;
      color: #eee;
    }

    /* Top Navigation Bar */
    .navbar {
      background: rgba(255,255,255,0.05);
      backdrop-filter: blur(10px);
      padding: 12px 20px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 1px solid rgba(255,255,255,0.1);
      position: sticky;
      top: 0;
      z-index: 100;
    }
    .navbar h1 {
      margin: 0;
      font-size: 1.3rem;
      font-weight: 600;
      color: #fff;
    }
    .nav-links {
      display: flex;
      gap: 12px;
      align-items: center;
    }
    .nav-link {
      color: rgba(255,255,255,0.7);
      text-decoration: none;
      font-size: 0.9rem;
      padding: 8px 14px;
      border-radius: 8px;
      transition: all 0.2s;
    }
    .nav-link:hover { background: rgba(255,255,255,0.1); color: #fff; }

    /* Main Content */
    .main-content {
      max-width: 800px;
      margin: 0 auto;
      padding: 20px;
      padding-bottom: 200px; /* Space for sticky footer */
    }

    /* Hero Scan Section */
    .scan-hero {
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      border-radius: 20px;
      padding: 30px;
      margin-bottom: 20px;
      text-align: center;
    }
    .scan-hero h2 {
      margin: 0 0 20px 0;
      font-size: 1.1rem;
      font-weight: 500;
      color: rgba(255,255,255,0.9);
      text-transform: uppercase;
      letter-spacing: 1px;
    }
    .scan-input-wrap {
      position: relative;
      max-width: 500px;
      margin: 0 auto;
    }
    .scan-input {
      width: 100%;
      padding: 18px 24px;
      font-size: 1.2rem;
      border: none;
      border-radius: 12px;
      background: rgba(255,255,255,0.95);
      color: #333;
      text-align: center;
      box-shadow: 0 4px 20px rgba(0,0,0,0.2);
    }
    .scan-input:focus {
      outline: none;
      box-shadow: 0 4px 30px rgba(0,0,0,0.3), 0 0 0 3px rgba(255,255,255,0.3);
    }
    .scan-input::placeholder { color: #999; }

    /* Search Toggle */
    .search-toggle {
      margin-top: 16px;
      display: flex;
      flex-direction: column;
      gap: 10px;
      align-items: center;
    }
    .search-toggle-btn {
      background: rgba(255,255,255,0.15);
      border: none;
      color: rgba(255,255,255,0.6);
      padding: 8px 16px;
      border-radius: 8px;
      cursor: pointer;
      font-size: 0.8rem;
      transition: all 0.2s;
    }
    .search-toggle-btn:hover { background: rgba(255,255,255,0.25); color: #fff; }
    #toggleManual {
      background: linear-gradient(135deg, #27ae60, #2ecc71);
      color: #fff;
      font-weight: 700;
      font-size: 1.1rem;
      padding: 14px 36px;
      border-radius: 12px;
      box-shadow: 0 4px 16px rgba(39,174,96,0.5);
      letter-spacing: 0.5px;
    }
    #toggleManual:hover {
      background: linear-gradient(135deg, #219a52, #27ae60);
      box-shadow: 0 6px 24px rgba(39,174,96,0.6);
      transform: translateY(-2px);
    }
    #toggleManual.closing {
      background: linear-gradient(135deg, #c0392b, #e74c3c);
      box-shadow: 0 4px 16px rgba(231,76,60,0.5);
    }
    #toggleManual.closing:hover {
      background: linear-gradient(135deg, #a93226, #c0392b);
      box-shadow: 0 6px 24px rgba(231,76,60,0.6);
    }
    .search-panel {
      display: none;
      margin-top: 16px;
      background: rgba(255,255,255,0.1);
      border-radius: 12px;
      padding: 16px;
    }
    .search-panel.open { display: block; }
    .search-row {
      display: flex;
      gap: 10px;
    }
    .search-row input {
      flex: 1;
      padding: 12px 16px;
      border: none;
      border-radius: 8px;
      font-size: 1rem;
      background: rgba(255,255,255,0.9);
      color: #333;
    }
    .search-row input:focus { outline: none; }
    .search-row button {
      padding: 12px 20px;
      border: none;
      border-radius: 8px;
      background: #fff;
      color: #764ba2;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s;
    }
    .search-row button:hover { transform: scale(1.02); }
    .search-results {
      margin-top: 12px;
      max-height: 200px;
      overflow: auto;
      background: rgba(255,255,255,0.95);
      border-radius: 8px;
    }
    .search-results table { width: 100%; border-collapse: collapse; font-size: 0.85rem; color: #333; }
    .search-results th, .search-results td { padding: 10px; border-bottom: 1px solid #eee; text-align: left; }
    .search-results th { background: #f5f5f5; font-weight: 600; }
    .search-results .btn-add {
      background: #27ae60;
      color: #fff;
      border: none;
      padding: 6px 14px;
      border-radius: 6px;
      cursor: pointer;
      font-weight: 600;
    }
    .thumb-sm { width: 36px; height: 36px; border-radius: 6px; object-fit: cover; cursor: pointer; }
    .thumb-placeholder {
      width: 36px; height: 36px; border-radius: 6px;
      background: rgba(102,126,234,0.2); color: #667eea;
      display: inline-flex; align-items: center; justify-content: center;
      font-size: 0.7rem; font-weight: 600; cursor: pointer;
    }
    .img-modal {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.85);
      z-index: 2000;
      align-items: center;
      justify-content: center;
    }
    .img-modal.open { display: flex; }
    .img-modal img { max-width: 90%; max-height: 90%; border-radius: 12px; }
    .img-modal .close-btn {
      position: absolute; top: 20px; right: 20px;
      background: rgba(255,255,255,0.2); color: #fff;
      border: none; border-radius: 50%;
      width: 40px; height: 40px;
      font-size: 1.5rem; cursor: pointer;
    }

    /* Message */
    .message {
      display: none;
      padding: 14px 18px;
      border-radius: 10px;
      margin-bottom: 16px;
      font-weight: 500;
    }
    .message.success { display: block; background: #d4edda; color: #155724; }
    .message.error { display: block; background: #f8d7da; color: #721c24; }

    /* Items Section */
    .items-section {
      background: rgba(255,255,255,0.05);
      border-radius: 16px;
      padding: 20px;
    }
    .items-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 16px;
    }
    .items-header h3 {
      margin: 0;
      font-size: 1rem;
      color: rgba(255,255,255,0.7);
      text-transform: uppercase;
      letter-spacing: 1px;
    }
    .clear-btn {
      background: rgba(231,76,60,0.2);
      color: #e74c3c;
      border: none;
      padding: 8px 16px;
      border-radius: 8px;
      cursor: pointer;
      font-size: 0.85rem;
      transition: all 0.2s;
    }
    .clear-btn:hover { background: rgba(231,76,60,0.3); }

    .items-list {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    .empty-state {
      text-align: center;
      color: rgba(255,255,255,0.4);
      padding: 40px 20px;
      font-size: 1rem;
    }

    /* Item Card - Simplified */
    .item-card {
      display: flex;
      align-items: center;
      gap: 14px;
      background: rgba(255,255,255,0.08);
      border-radius: 12px;
      padding: 14px;
      transition: all 0.2s;
    }
    .item-card:hover { background: rgba(255,255,255,0.12); }
    .item-thumb {
      width: 56px;
      height: 56px;
      border-radius: 10px;
      object-fit: cover;
      background: rgba(255,255,255,0.1);
      flex-shrink: 0;
    }
    .item-info {
      flex: 1;
      min-width: 0;
    }
    .item-title-input {
      width: 100%;
      background: transparent;
      border: none;
      border-bottom: 1px solid rgba(255,255,255,0.2);
      color: #fff;
      font-size: 0.95rem;
      padding: 4px 0;
      margin-bottom: 4px;
    }
    .item-title-input:focus { outline: none; border-bottom-color: #667eea; }
    .item-title-input::placeholder { color: rgba(255,255,255,0.4); }
    .item-barcode {
      font-family: monospace;
      color: rgba(255,255,255,0.5);
      font-size: 0.8rem;
    }
    .item-price {
      width: 100px;
      position: relative;
    }
    .item-price .dollar-sign {
      position: absolute;
      left: 10px;
      top: 50%;
      transform: translateY(-50%);
      color: #27ae60;
      font-weight: 700;
      font-size: 0.95rem;
      pointer-events: none;
    }
    .item-price input {
      width: 100%;
      background: rgba(39,174,96,0.15);
      border: 1.5px solid rgba(39,174,96,0.4);
      border-radius: 8px;
      color: #27ae60;
      padding: 10px 10px 10px 22px;
      text-align: center;
      font-size: 0.95rem;
      font-weight: 600;
    }
    .item-price input:focus { outline: none; border-color: #27ae60; box-shadow: 0 0 0 2px rgba(39,174,96,0.2); }
    .item-price input::placeholder { color: rgba(39,174,96,0.5); }
    .item-qty {
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .qty-btn {
      width: 32px;
      height: 32px;
      border: none;
      border-radius: 8px;
      background: rgba(255,255,255,0.15);
      color: #fff;
      cursor: pointer;
      font-size: 1.1rem;
      font-weight: 600;
      transition: all 0.2s;
    }
    .qty-btn:hover { background: rgba(255,255,255,0.25); }
    .qty-value {
      min-width: 28px;
      text-align: center;
      font-weight: 700;
      font-size: 1.1rem;
      color: #fff;
    }
    .remove-btn {
      width: 32px;
      height: 32px;
      border: none;
      border-radius: 8px;
      background: rgba(231,76,60,0.2);
      color: #e74c3c;
      cursor: pointer;
      font-size: 1rem;
      transition: all 0.2s;
    }
    .remove-btn:hover { background: rgba(231,76,60,0.4); }

    /* Sticky Footer Summary */
    .summary-footer {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      background: rgba(26,26,46,0.95);
      backdrop-filter: blur(20px);
      border-top: 1px solid rgba(255,255,255,0.1);
      padding: 16px 20px;
      z-index: 100;
    }
    .summary-inner {
      max-width: 800px;
      margin: 0 auto;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      flex-wrap: wrap;
    }
    .summary-stats {
      display: flex;
      gap: 24px;
    }
    .stat {
      text-align: center;
    }
    .stat-label {
      font-size: 0.75rem;
      color: rgba(255,255,255,0.5);
      text-transform: uppercase;
      letter-spacing: 0.5px;
      margin-bottom: 4px;
    }
    .stat-value {
      font-size: 1.4rem;
      font-weight: 700;
      color: #27ae60;
    }
    .stat-value.qty { color: #3498db; }
    .override-input {
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .override-input label {
      font-size: 0.8rem;
      color: rgba(255,255,255,0.6);
    }
    .override-input input {
      width: 100px;
      padding: 10px;
      border: 1px solid rgba(255,255,255,0.2);
      border-radius: 8px;
      background: rgba(255,255,255,0.1);
      color: #fff;
      text-align: center;
      font-size: 1rem;
    }
    .override-input input:focus { outline: none; border-color: #667eea; }
    .override-input input::placeholder { color: rgba(255,255,255,0.3); }
    .submit-btn {
      background: linear-gradient(135deg, #27ae60, #1e8449);
      color: #fff;
      border: none;
      padding: 14px 32px;
      border-radius: 10px;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s;
      box-shadow: 0 4px 15px rgba(39,174,96,0.3);
    }
    .submit-btn:hover:not(:disabled) { transform: translateY(-2px); box-shadow: 0 6px 20px rgba(39,174,96,0.4); }
    .submit-btn:disabled { opacity: 0.5; cursor: not-allowed; transform: none; }

    /* Responsive */
    @media (max-width: 700px) {
      .main-content { padding: 16px; padding-bottom: 20px; }
      .scan-hero { padding: 24px 20px; }
      .scan-input { font-size: 1.1rem; padding: 16px 20px; }
      .item-card { flex-wrap: wrap; }
      .item-info { width: 100%; order: 1; }
      .item-thumb { order: 0; }
      .item-price { order: 2; flex: 1; }
      .item-qty { order: 3; }
      .remove-btn { order: 4; }
      /* Footer: stats section becomes inline, submit stays sticky */
      .summary-footer {
        position: static;
        border-top: none;
        border-radius: 16px;
        margin: 20px 16px 100px 16px;
        background: rgba(26,26,46,0.95);
        backdrop-filter: none;
      }
      /* Hide the submit button inside the inline footer on mobile */
      .summary-footer .submit-btn { display: none; }
      /* Sticky mobile submit bar */
      .mobile-submit-bar {
        display: block !important;
        position: fixed;
        bottom: 0;
        left: 0;
        right: 0;
        padding: 12px 16px;
        background: rgba(26,26,46,0.97);
        border-top: 1px solid rgba(255,255,255,0.1);
        z-index: 100;
      }
      .mobile-submit-bar .submit-btn { display: block; width: 100%; }
      .main-content { padding: 16px; padding-bottom: 160px; }
      /* Price needs more room on mobile */
      .item-price {
        width: auto;
        min-width: 120px;
      }
      .summary-inner { flex-direction: column; gap: 12px; }
      .summary-stats { width: 100%; justify-content: space-around; }
      .override-input { width: 100%; justify-content: center; }
      /* Manual entry wrapping on mobile */
      .manual-entry-panel .search-row {
        flex-wrap: wrap;
      }
      .manual-entry-panel .search-row #manualTitle {
        flex: 1 1 100% !important;
        min-width: 0;
      }
      .manual-entry-panel .search-row #manualPrice {
        flex: 1 1 auto !important;
        max-width: none !important;
      }
      .manual-entry-panel .search-row .manual-add-btn {
        flex: 1 1 100%;
      }
    }
    @media (max-width: 480px) {
      .navbar h1 { font-size: 1.1rem; }
      .nav-link { padding: 6px 10px; font-size: 0.8rem; }
      .scan-hero h2 { font-size: 0.95rem; }
      .stat-value { font-size: 1.2rem; }
    }

    /* Manual entry panel */
    .manual-entry-panel {
      display: none;
      margin-top: 16px;
      background: rgba(255,255,255,0.1);
      border-radius: 12px;
      padding: 16px;
    }
    .manual-entry-panel.open { display: block; }
    .manual-add-btn {
      padding: 12px 20px;
      border: none;
      border-radius: 8px;
      background: #27ae60;
      color: #fff;
      font-weight: 600;
      font-size: 1rem;
      cursor: pointer;
      transition: all 0.2s;
      white-space: nowrap;
    }
    .manual-add-btn:hover { background: #219a52; }

    /* Highlight animation for scan-not-found items */
    @keyframes pulse-border {
      0% { box-shadow: 0 0 0 0 rgba(102,126,234,0.6); }
      50% { box-shadow: 0 0 12px 4px rgba(102,126,234,0.4); }
      100% { box-shadow: 0 0 0 0 rgba(102,126,234,0); }
    }
    .item-card.highlight {
      animation: pulse-border 1s ease-in-out 2;
      border-color: #667eea !important;
    }

    /* Day mode overrides */
    html.ss-theme-day body { background: var(--bg, #f9f9f9); color: var(--ink, #111827); }
    html.ss-theme-day .navbar { background: rgba(255,255,255,0.85); border-bottom-color: rgba(0,0,0,0.08); }
    html.ss-theme-day .navbar h1 { color: #111827; }
    html.ss-theme-day .nav-link { color: #475569; }
    html.ss-theme-day .nav-link:hover { background: rgba(0,0,0,0.06); color: #111827; }
    html.ss-theme-day .items-section { background: rgba(0,0,0,0.03); }
    html.ss-theme-day .items-header h3 { color: #475569; }
    html.ss-theme-day .item-card { background: #fff; border: 1px solid #e2e8f0; }
    html.ss-theme-day .item-card:hover { background: #f8fafc; }
    html.ss-theme-day .item-title-input { color: #111827; border-bottom-color: #e2e8f0; }
    html.ss-theme-day .item-title-input::placeholder { color: #94a3b8; }
    html.ss-theme-day .item-barcode { color: #64748b; }
    html.ss-theme-day .item-price input { background: rgba(39,174,96,0.08); border-color: rgba(39,174,96,0.3); color: #16a34a; }
    html.ss-theme-day .item-price input::placeholder { color: rgba(22,163,74,0.4); }
    html.ss-theme-day .item-price .dollar-sign { color: #16a34a; }
    html.ss-theme-day .qty-btn { background: #e2e8f0; color: #111827; }
    html.ss-theme-day .qty-btn:hover { background: #cbd5e1; }
    html.ss-theme-day .qty-value { color: #111827; }
    html.ss-theme-day .remove-btn { background: rgba(231,76,60,0.1); }
    html.ss-theme-day .clear-btn { background: rgba(231,76,60,0.1); }
    html.ss-theme-day .empty-state { color: #94a3b8; }
    html.ss-theme-day .summary-footer { background: rgba(255,255,255,0.95); border-top-color: #e2e8f0; }
    html.ss-theme-day .stat-label { color: #64748b; }
    html.ss-theme-day .override-input label { color: #64748b; }
    html.ss-theme-day .override-input input { background: #f1f5f9; border-color: #e2e8f0; color: #111827; }
    html.ss-theme-day .override-input input::placeholder { color: #94a3b8; }
    html.ss-theme-day .message.success { background: #d4edda; color: #155724; }
    html.ss-theme-day .message.error { background: #f8d7da; color: #721c24; }
    html.ss-theme-day .manual-entry-panel { background: rgba(0,0,0,0.04); }
    html.ss-theme-day .manual-add-btn { background: #27ae60; color: #fff; }
    html.ss-theme-day .mobile-submit-bar { background: rgba(255,255,255,0.97); border-top-color: #e2e8f0; }
  </style>
</head>
<body>
  <!-- Top Navigation -->
  <nav class="navbar">
    <div style="width:120px;"></div>
    <h1 data-i18n="marketplace_session">Marketplace Sale</h1>
    <div class="nav-links" style="margin-right: 120px;">
      <a href="/marketplace-stats" class="nav-link">📊 History</a>
    </div>
  </nav>

  <div class="main-content">
    <!-- Hero Scan Area -->
    <div class="scan-hero">
      <h2 data-i18n="marketplace_scan_barcode">Scan Barcode to Add Item</h2>
      <div class="scan-input-wrap">
        <input id="scanInput" type="text" class="scan-input" placeholder="Scan or type barcode..." autofocus>
      </div>
      <div class="search-toggle">
        <button class="search-toggle-btn" id="toggleManual">➕ Add Manually</button>
        <button class="search-toggle-btn" id="toggleSearch">🔍 Search by Name</button>
      </div>
      <div class="search-panel" id="searchPanel">
        <div class="search-row">
          <input id="searchName" type="text" placeholder="Enter product name...">
          <button id="searchBtn">Search</button>
        </div>
        <div id="searchResults" class="search-results" style="display:none"></div>
      </div>
      <div class="manual-entry-panel" id="manualPanel">
        <div class="search-row">
          <input id="manualTitle" type="text" placeholder="Item name (required)" style="flex:2">
          <input id="manualPrice" type="number" min="0" step="0.01" placeholder="Price" style="flex:1; max-width:120px">
          <button id="manualAddBtn" class="manual-add-btn">+ Add</button>
        </div>
      </div>
    </div>

    <div id="message" class="message"></div>

    <!-- Items List -->
    <div class="items-section">
      <div class="items-header">
        <h3>Session Items</h3>
        <button class="clear-btn" id="clearSession">Clear All</button>
      </div>
      <div class="items-list" id="itemsList">
        <div class="empty-state" data-i18n="marketplace_empty">Scan items to start a session</div>
      </div>
    </div>
  </div>

  <!-- Image Popup Modal -->
  <div class="img-modal" id="imgModal">
    <button class="close-btn" onclick="closeImgModal()">×</button>
    <img id="imgModalImg" src="" alt="Preview">
  </div>

  <!-- Sticky Footer Summary -->
  <div class="summary-footer">
    <div class="summary-inner">
      <div class="summary-stats">
        <div class="stat">
          <div class="stat-label">Items</div>
          <div class="stat-value qty" id="totalQty">0</div>
        </div>
        <div class="stat">
          <div class="stat-label">Auto Total</div>
          <div class="stat-value" id="autoTotal">$0.00</div>
        </div>
        <div class="stat">
          <div class="stat-label">Final</div>
          <div class="stat-value" id="finalTotal">$0.00</div>
        </div>
      </div>
      <div class="override-input">
        <label>Override $</label>
        <input id="finalTotalInput" type="number" min="0" step="0.01" placeholder="—">
      </div>
      <button class="submit-btn" id="submitSession" disabled>Submit Sale</button>
    </div>
  </div>

  <!-- Mobile-only sticky submit bar (hidden by default, shown via CSS on small screens) -->
  <div class="mobile-submit-bar" style="display:none">
    <button class="submit-btn" id="mobileSubmitBtn" disabled>Submit Sale</button>
  </div>

  <script>
    const items = new Map();
    const scanInput = document.getElementById('scanInput');
    const itemsList = document.getElementById('itemsList');
    const message = document.getElementById('message');
    const totalQtyEl = document.getElementById('totalQty');
    const autoTotalEl = document.getElementById('autoTotal');
    const finalTotalEl = document.getElementById('finalTotal');
    const finalTotalInput = document.getElementById('finalTotalInput');
    const submitBtn = document.getElementById('submitSession');
    const mobileSubmitBtn = document.getElementById('mobileSubmitBtn');
    const clearBtn = document.getElementById('clearSession');
    const toggleSearch = document.getElementById('toggleSearch');
    const searchPanel = document.getElementById('searchPanel');
    const toggleManual = document.getElementById('toggleManual');
    const manualPanel = document.getElementById('manualPanel');

    // Toggle search panel (closes manual panel)
    toggleSearch.addEventListener('click', () => {
      searchPanel.classList.toggle('open');
      manualPanel.classList.remove('open');
      toggleSearch.textContent = searchPanel.classList.contains('open') ? '✕ Close Search' : '🔍 Search by Name';
      toggleManual.textContent = '➕ Add Manually';
      toggleManual.classList.remove('closing');
      if (searchPanel.classList.contains('open')) document.getElementById('searchName').focus();
    });

    // Toggle manual entry panel (closes search panel)
    toggleManual.addEventListener('click', () => {
      manualPanel.classList.toggle('open');
      searchPanel.classList.remove('open');
      const isOpen = manualPanel.classList.contains('open');
      toggleManual.textContent = isOpen ? '✕ Close Manual' : '➕ Add Manually';
      toggleManual.classList.toggle('closing', isOpen);
      toggleSearch.textContent = '🔍 Search by Name';
      if (isOpen) document.getElementById('manualTitle').focus();
    });

    function fmtMoney(v) {
      const n = isNaN(v) ? 0 : v;
      return '$' + n.toFixed(2);
    }

    function showMessage(text, type) {
      message.textContent = text;
      message.className = 'message ' + type;
    }

    function hideMessage() {
      message.className = 'message';
    }

    async function lookupItem(barcode) {
      try {
        const resp = await fetch(`/api/marketplace/lookup?barcode=${encodeURIComponent(barcode)}`);
        const data = await resp.json();
        if (data.success && data.found) {
          return { title: data.title || '', image: data.image_url || '' };
        }
      } catch (e) {}
      return { title: '', image: '' };
    }

    async function searchByName(q) {
      const resultsEl = document.getElementById('searchResults');
      if (!q) return;
      resultsEl.style.display = 'block';
      resultsEl.innerHTML = '<div style="padding:20px;text-align:center;color:#666">Searching...</div>';
      try {
        const resp = await fetch(`/api/marketplace/search?q=${encodeURIComponent(q)}`);
        const data = await resp.json();
        if (!data.success) {
          resultsEl.innerHTML = '<div style="padding:20px;text-align:center;color:#e74c3c">Search failed</div>';
          return;
        }
        const rows = data.results || [];
        if (rows.length === 0) {
          resultsEl.innerHTML = '<div style="padding:20px;text-align:center;color:#666">No matches found</div>';
          return;
        }
        let html = '<table><thead><tr><th></th><th>UPC</th><th>Title</th><th></th></tr></thead><tbody>';
        const noImgSvg = 'data:image/svg+xml;utf8,' + encodeURIComponent('<svg xmlns="http://www.w3.org/2000/svg" width="36" height="36"><rect width="100%" height="100%" fill="#f0f0f0"/><text x="50%" y="50%" dominant-baseline="middle" text-anchor="middle" fill="#bbb" font-size="8">No img</text></svg>');
        rows.forEach((r, idx) => {
          const img = r.image_url || '';
          const thumb = img || noImgSvg;
          // First 3 rows show thumbnail, rest show "show" placeholder
          let imgCell;
          if (idx < 3) {
            imgCell = `<img class="thumb-sm" src="${thumb}" data-full="${img}" onclick="openSearchImg(this)" onerror="this.src='${noImgSvg}'">`;
          } else {
            imgCell = `<span class="thumb-placeholder" data-img="${img}" onclick="revealThumb(this)">show</span>`;
          }
          html += `<tr>
            <td>${imgCell}</td>
            <td style="font-family:monospace;font-size:0.8rem">${r.upc || ''}</td>
            <td style="word-break:break-word">${r.item_description || ''}</td>
            <td><button class="btn-add" data-upc="${r.upc || ''}">+ Add</button></td>
          </tr>`;
        });
        html += '</tbody></table>';
        resultsEl.innerHTML = html;
        resultsEl.querySelectorAll('.btn-add').forEach(btn => {
          btn.addEventListener('click', () => {
            const upc = btn.dataset.upc || '';
            if (upc) addScan(upc);
          });
        });
      } catch (e) {
        resultsEl.innerHTML = '<div style="padding:20px;text-align:center;color:#e74c3c">Search failed</div>';
      }
    }

    let lastGeneratedBarcode = null; // track last 888 barcode to avoid duplicates within session

    function nextLocalBarcode() {
      // Increment the last generated barcode locally
      const num = parseInt(lastGeneratedBarcode, 10) + 1;
      lastGeneratedBarcode = String(num).padStart(12, '0');
      // Ensure it keeps 888000 prefix
      if (!lastGeneratedBarcode.startsWith('888000')) {
        lastGeneratedBarcode = '888000' + lastGeneratedBarcode.slice(6);
      }
      return lastGeneratedBarcode;
    }

    async function addManualItem() {
      const titleInput = document.getElementById('manualTitle');
      const priceInput = document.getElementById('manualPrice');
      const title = (titleInput.value || '').trim();

      if (!title) {
        showMessage('Please enter an item name', 'error');
        titleInput.focus();
        return;
      }

      let barcode;
      try {
        if (lastGeneratedBarcode) {
          // Already have a base barcode from API, just increment locally
          barcode = nextLocalBarcode();
          // Skip if this barcode already exists in the session
          while (items.has(barcode)) barcode = nextLocalBarcode();
        } else {
          // First manual item — fetch from API to get the correct starting point
          const resp = await fetch('/api/marketplace/generate-barcode', { method: 'POST' });
          const data = await resp.json();

          if (!data.success) {
            showMessage('Failed to generate barcode', 'error');
            return;
          }
          barcode = data.barcode;
          lastGeneratedBarcode = barcode;
        }
        const price = priceInput.value || '';

        items.set(barcode, {
          barcode: barcode,
          title: title,
          image: '',
          qty: 1,
          price: price
        });

        renderItems();
        showMessage('Added: ' + title, 'success');

        titleInput.value = '';
        priceInput.value = '';
        titleInput.focus();
      } catch (e) {
        showMessage('Error adding item', 'error');
      }
    }

    // Manual entry event listeners
    document.getElementById('manualAddBtn').addEventListener('click', addManualItem);
    document.getElementById('manualTitle').addEventListener('keydown', (e) => {
      if (e.key === 'Enter') { e.preventDefault(); document.getElementById('manualPrice').focus(); }
    });
    document.getElementById('manualPrice').addEventListener('keydown', (e) => {
      if (e.key === 'Enter') { e.preventDefault(); addManualItem(); }
    });

    async function addScan(barcode) {
      if (!barcode) return;
      if (items.has(barcode)) {
        const item = items.get(barcode);
        item.qty += 1;
        items.set(barcode, item);
        renderItems();
        return;
      }
      const info = await lookupItem(barcode);
      const isNotFound = !info.title && !info.image;
      items.set(barcode, {
        barcode,
        title: info.title || '',
        image: info.image || '',
        qty: 1,
        price: ''
      });
      renderItems();

      if (isNotFound) {
        showMessage('Item not in system \u2014 enter a name below', 'error');
        setTimeout(() => {
          const card = document.querySelector(`.item-card[data-barcode="${barcode}"]`);
          if (card) {
            const titleEl = card.querySelector('.title-input');
            if (titleEl) titleEl.focus();
            card.classList.add('highlight');
            setTimeout(() => card.classList.remove('highlight'), 2000);
          }
        }, 50);
      }
    }

    function renderItems() {
      if (items.size === 0) {
        itemsList.innerHTML = '<div class="empty-state" data-i18n="marketplace_empty">Scan items to start a session</div>';
        submitBtn.disabled = true;
        mobileSubmitBtn.disabled = true;
        updateSummary();
        return;
      }
      const html = [];
      for (const item of items.values()) {
        const thumb = item.image ? item.image : 'data:image/svg+xml;utf8,' + encodeURIComponent('<svg xmlns="http://www.w3.org/2000/svg" width="56" height="56"><rect width="100%" height="100%" fill="rgba(255,255,255,0.1)"/><text x="50%" y="50%" dominant-baseline="middle" text-anchor="middle" fill="rgba(255,255,255,0.3)" font-size="8">No img</text></svg>');
        html.push(`
          <div class="item-card" data-barcode="${item.barcode}">
            <img class="item-thumb" src="${thumb}" onerror="this.src='${thumb}'">
            <div class="item-info">
              <input type="text" class="item-title-input title-input" value="${item.title || ''}" placeholder="Item name (optional)">
              <div class="item-barcode">${item.barcode}</div>
            </div>
            <div class="item-price">
              <span class="dollar-sign">$</span>
              <input type="number" class="price-input-field" min="0" step="0.01" placeholder="0.00" value="${item.price}">
            </div>
            <div class="item-qty">
              <button class="qty-btn qty-minus">−</button>
              <div class="qty-value">${item.qty}</div>
              <button class="qty-btn qty-plus">+</button>
            </div>
            <button class="remove-btn">✕</button>
          </div>
        `);
      }
      itemsList.innerHTML = html.join('');
      attachRowHandlers();
      submitBtn.disabled = false;
      mobileSubmitBtn.disabled = false;
      updateSummary();
    }

    function attachRowHandlers() {
      document.querySelectorAll('.item-card').forEach(row => {
        const barcode = row.dataset.barcode;
        const item = items.get(barcode);
        const titleInput = row.querySelector('.title-input');
        const priceInput = row.querySelector('.price-input-field');
        const minus = row.querySelector('.qty-minus');
        const plus = row.querySelector('.qty-plus');
        const remove = row.querySelector('.remove-btn');

        titleInput.addEventListener('input', () => {
          item.title = titleInput.value.trim();
          items.set(barcode, item);
        });
        priceInput.addEventListener('input', () => {
          item.price = priceInput.value;
          items.set(barcode, item);
          updateSummary();
        });
        minus.addEventListener('click', () => {
          if (item.qty > 1) {
            item.qty -= 1;
            items.set(barcode, item);
            renderItems();
          }
        });
        plus.addEventListener('click', () => {
          item.qty += 1;
          items.set(barcode, item);
          renderItems();
        });
        remove.addEventListener('click', () => {
          items.delete(barcode);
          renderItems();
        });
      });
    }

    function getTotals() {
      let totalQty = 0;
      let autoTotal = 0;
      for (const item of items.values()) {
        totalQty += item.qty;
        const p = parseFloat(item.price || 0);
        if (!isNaN(p)) autoTotal += p;
      }
      return { totalQty, autoTotal };
    }

    function updateSummary() {
      const { totalQty, autoTotal } = getTotals();
      totalQtyEl.textContent = totalQty;
      autoTotalEl.textContent = fmtMoney(autoTotal);
      const override = parseFloat(finalTotalInput.value);
      const finalTotal = !isNaN(override) && override >= 0 ? override : autoTotal;
      finalTotalEl.textContent = fmtMoney(finalTotal);
    }

    scanInput.addEventListener('keydown', (e) => {
      if (e.key === 'Enter') {
        e.preventDefault();
        const code = scanInput.value.trim();
        scanInput.value = '';
        if (code) addScan(code);
      }
    });

    const searchBtn = document.getElementById('searchBtn');
    const searchName = document.getElementById('searchName');
    if (searchBtn) {
      searchBtn.addEventListener('click', () => {
        const q = (searchName.value || '').trim();
        if (q) searchByName(q);
      });
    }
    if (searchName) {
      searchName.addEventListener('keydown', (e) => {
        if (e.key === 'Enter') {
          e.preventDefault();
          const q = (searchName.value || '').trim();
          if (q) searchByName(q);
        }
      });
    }

    finalTotalInput.addEventListener('input', updateSummary);

    clearBtn.addEventListener('click', () => {
      const t = (window.i18n && window.i18n.t) ? window.i18n.t : (k => k);
      if (confirm(t('marketplace_clear_confirm') || 'Clear all items?')) {
        items.clear();
        renderItems();
      }
    });

    // Mobile submit triggers main submit
    mobileSubmitBtn.addEventListener('click', () => submitBtn.click());

    submitBtn.addEventListener('click', async () => {
      if (items.size === 0) return;
      submitBtn.disabled = true;
      mobileSubmitBtn.disabled = true;
      submitBtn.textContent = 'Submitting...';
      mobileSubmitBtn.textContent = 'Submitting...';
      hideMessage();
      const sessionId = 'session-' + Date.now().toString(36) + '-' + Math.random().toString(36).slice(2, 7);
      const { totalQty, autoTotal } = getTotals();
      const override = parseFloat(finalTotalInput.value);
      let finalTotal = (!isNaN(override) && override >= 0) ? override : autoTotal;

      const itemList = Array.from(items.values());
      let priceMap = new Map();
      let priceAutoMap = new Map();  // Track if price was auto-calculated
      if (totalQty > 0) {
        if (!isNaN(override) && override >= 0) {
          // Override was used - prices are auto-calculated
          if (autoTotal > 0) {
            const ratio = finalTotal / autoTotal;
            itemList.forEach(i => {
              const p = parseFloat(i.price || 0);
              const unit = isNaN(p) ? 0 : p * ratio;
              priceMap.set(i.barcode, unit);
              // Auto if ratio != 1 (override changed prices) or item had no manual price
              priceAutoMap.set(i.barcode, Math.abs(ratio - 1) > 0.001 || !i.price);
            });
          } else {
            // No individual prices, split evenly across items - definitely auto
            const perItem = finalTotal / itemList.length;
            itemList.forEach(i => {
              priceMap.set(i.barcode, perItem);
              priceAutoMap.set(i.barcode, true);
            });
          }
        } else {
          // No override - use manual prices (not auto)
          itemList.forEach(i => {
            const p = parseFloat(i.price || 0);
            priceMap.set(i.barcode, isNaN(p) ? 0 : p);
            priceAutoMap.set(i.barcode, false);
          });
        }
      }

      let success = 0;
      let fail = 0;
      for (const item of itemList) {
        const itemPrice = priceMap.get(item.barcode) || 0;
        const priceAuto = priceAutoMap.get(item.barcode) || false;
        try {
          const resp = await fetch('/api/marketplace/sale', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
              barcode: item.barcode,
              title: item.title || '',
              quantity: item.qty,
              price: itemPrice,
              session_id: sessionId,
              price_auto: priceAuto
            })
          });
          const data = await resp.json();
          if (data.success) success += 1;
          else fail += 1;
        } catch (e) {
          fail += 1;
        }
      }

      submitBtn.textContent = 'Submit Sale';
      mobileSubmitBtn.textContent = 'Submit Sale';
      if (fail === 0) {
        showMessage((window.i18n && window.i18n.t) ? window.i18n.t('marketplace_submit_success') : 'Sale submitted successfully!', 'success');
        items.clear();
        finalTotalInput.value = '';
        renderItems();
      } else {
        const t = (window.i18n && window.i18n.t) ? window.i18n.t : (k => k);
        const msg = (t('marketplace_submit_partial') || 'Submitted {success}, failed {fail}')
          .replace('{success}', success)
          .replace('{fail}', fail);
        showMessage(msg, 'error');
      }
      submitBtn.disabled = false;
      mobileSubmitBtn.disabled = false;
      scanInput.focus();
    });

    renderItems();

    // Auto-focus scan input on page load
    setTimeout(() => {
      scanInput.focus();
      scanInput.select();
    }, 100);

    // Image modal functions
    function openSearchImg(imgEl) {
      const fullSrc = imgEl.dataset.full || imgEl.src;
      if (!fullSrc || fullSrc.startsWith('data:')) return;
      document.getElementById('imgModalImg').src = fullSrc;
      document.getElementById('imgModal').classList.add('open');
    }
    function closeImgModal() {
      document.getElementById('imgModal').classList.remove('open');
      document.getElementById('imgModalImg').src = '';
    }
    function revealThumb(placeholder) {
      const img = placeholder.dataset.img || '';
      const noImgSvg = 'data:image/svg+xml;utf8,' + encodeURIComponent('<svg xmlns="http://www.w3.org/2000/svg" width="36" height="36"><rect width="100%" height="100%" fill="#f0f0f0"/><text x="50%" y="50%" dominant-baseline="middle" text-anchor="middle" fill="#bbb" font-size="8">No img</text></svg>');
      const thumb = img || noImgSvg;
      const imgEl = document.createElement('img');
      imgEl.className = 'thumb-sm';
      imgEl.src = thumb;
      imgEl.dataset.full = img;
      imgEl.onclick = function() { openSearchImg(this); };
      imgEl.onerror = function() { this.src = noImgSvg; };
      placeholder.replaceWith(imgEl);
    }
    document.getElementById('imgModal').addEventListener('click', function(e) {
      if (e.target === this) closeImgModal();
    });
  </script>
  <script src="/static/i18n.js"></script>
</body>
</html>
