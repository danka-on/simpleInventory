<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>Multi-DB Search</title>
    <style>
        body{font-family:Segoe UI,Arial,sans-serif;background:#f7f7f8;margin:0;padding:18px}
        .top {display:flex;gap:10px;align-items:center;justify-content:space-between}
        .actions {display:flex;gap:8px;align-items:center}
        .btn {padding:8px 14px;border-radius:6px;border:none;cursor:pointer}
        .btn-primary{background:#00b894;color:#fff}
        .btn-danger{background:#e74c3c;color:#fff}
        .filters {display:flex;gap:8px;align-items:center}
        .search-row{display:flex;gap:8px;margin-top:12px}
        input[type=text]{flex:1;padding:10px;border:1px solid #ddd;border-radius:6px}
        table{width:100%;border-collapse:collapse;margin-top:12px}
        th,td{padding:8px;border:1px solid #e6e6e6;text-align:left}
        th{background:#f0f0f0}
        .thumb{width:48px;height:48px;object-fit:cover;border-radius:6px;margin-right:8px}
        .title-cell{display:flex;align-items:center}
        .location-link{color:#3498db;text-decoration:underline;cursor:pointer}
        .small-muted{color:#777;font-size:0.9rem}
        .modal{display:none;position:fixed;inset:0;background:rgba(0,0,0,0.7);z-index:9999;align-items:center;justify-content:center}
        .modal .card{background:#fff;padding:18px;border-radius:8px;max-width:720px;max-height:80vh;overflow:auto}
        .form-row{display:flex;gap:8px;margin-bottom:8px}
        .form-row input, .form-row textarea{flex:1;padding:8px;border:1px solid #ddd;border-radius:6px}
    </style>
</head>
<body>
    <div class="top">
        <div>
            <a href="/" style="text-decoration:none"><button class="btn btn-danger">Back</button></a>
        </div>
        <div class="actions">
                <div class="filters" id="db-filters">
                <!-- checkboxes inserted here -->
            </div>
                <div style="margin-left:12px">
                    <button id="refresh-btn" class="btn">Refresh</button>
                    <span id="refresh-status" class="small-muted" style="margin-left:8px"></span>
                </div>
        </div>
    </div>

    <div class="search-row">
        <input type="text" id="search-input" placeholder="Search by title, barcode, item id, ...">
        <button class="btn btn-primary" id="search-btn">Search</button>
    </div>

    <div style="margin-top:10px; display:flex; gap:12px; align-items:center;">
        <label style="font-size:0.95rem; color:#444">Page size:
            <select id="page-size" style="margin-left:6px;padding:6px;border-radius:6px;border:1px solid #ddd">
                <option value="10">10</option>
                <option value="25">25</option>
                <option value="50">50</option>
            </select>
        </label>
        <label style="font-size:0.95rem; color:#444"> <input type="checkbox" id="fetch-all" style="margin-left:8px"> Fetch all results (may be slow)</label>
        <div id="pagination-controls" style="margin-left:auto"></div>
    </div>

    <div style="margin-top:10px; font-size:0.95rem; color:#444">Showing: <span id="active-dbs">Inventory</span></div>

    <div id="results"></div>

    <!-- Image / Info Modal -->
    <div id="viewModal" class="modal"><div class="card"><div style="text-align:right"><button id="closeView">Close</button></div><div id="viewContent"></div></div></div>

    <!-- Edit Modal -->
    <div id="editModal" class="modal"><div class="card"><div style="text-align:right"><button id="closeEdit">Close</button></div><h3>Edit Item</h3><div id="editContent"></div><div style="text-align:right;margin-top:8px"><button id="saveEdit" class="btn btn-primary">Save</button></div></div></div>

<script>
const DBS = ['searchRack','ebayStore','bol','sold','archived'];
const DB_LABELS = {searchRack:'Inventory', ebayStore:'Ebay live', bol:'Macy BOL', sold:'Sold', archived:'Archived'};
const defaultChecked = {'searchRack':true};
let _allResults = [];
let _currentPage = 1;
let _pageSize = 10;

function createFilters(){
    const container = document.getElementById('db-filters');
    DBS.forEach(k=>{
        const id = 'chk-'+k;
        const cb = document.createElement('input'); cb.type='checkbox'; cb.id=id; cb.value=k; cb.checked=!!defaultChecked[k];
        const lbl = document.createElement('label'); lbl.htmlFor=id; lbl.style.marginRight='8px'; lbl.appendChild(cb); lbl.appendChild(document.createTextNode(' '+DB_LABELS[k]));
        container.appendChild(lbl);
    })
}

createFilters();

function getActiveDBs(){
    return DBS.filter(k=>document.getElementById('chk-'+k).checked);
}

document.getElementById('search-btn').addEventListener('click', doSearch);
document.getElementById('search-input').addEventListener('keyup', (e)=>{ if(e.key==='Enter') doSearch(); });

async function doSearch(){
    const q = document.getElementById('search-input').value.trim();
    const dbs = getActiveDBs();
    _allResults = [];
    // If user requested fetch-all, send limit=0 to tell server to return all matches
    const wantAll = document.getElementById('fetch-all').checked;
    for(const db of dbs){
        try{
            let j = null;
            if(db === 'archived'){
                const resp = await fetch('/api/archived');
                j = await resp.json();
            } else {
                const resp = await fetch('/api/search/'+db, {method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({q:q, limit: wantAll ? 0 : 50})});
                j = await resp.json();
            }
            if(j && j.results) {
                j.results.forEach(r=> _allResults.push(r));
            }
        }catch(err){console.error('search err',err)}
    }
    _currentPage = 1;
    _pageSize = parseInt(document.getElementById('page-size').value || '10', 10);
    // Update the 'Showing' label to include total result count
    const activeLabel = dbs.map(d=>DB_LABELS[d]).join(', ');
    document.getElementById('active-dbs').textContent = `${activeLabel} — ${_allResults.length} results`;
    renderPagedResults();
}

function renderPagedResults(){
    const total = _allResults.length;
    const pages = Math.max(1, Math.ceil(total / _pageSize));
    if(_currentPage > pages) _currentPage = pages;
    const start = (_currentPage - 1) * _pageSize;
    const end = start + _pageSize;
    const slice = _allResults.slice(start, end);
    renderResults(slice);
    renderPagination(total, pages);
}

function renderPagination(total, pages){
    const container = document.getElementById('pagination-controls');
    if(pages <= 1){ container.innerHTML = `<span class="small-muted">${total} results</span>`; return; }
    let html = '';
    html += `<button class=\"btn\" id=\"pg-prev\">Prev</button>`;
    // show up to 7 page buttons centered around current
    const win = 7;
    let start = Math.max(1, _currentPage - Math.floor(win/2));
    let finish = Math.min(pages, start + win - 1);
    if(finish - start < win - 1) start = Math.max(1, finish - win + 1);
    for(let p=start;p<=finish;p++){
        html += `<button class=\"btn\" data-page=\"${p}\" style=\"${p===_currentPage? 'font-weight:bold; background:#ddd':''}\">${p}</button>`;
    }
    html += `<button class=\"btn\" id=\"pg-next\">Next</button>`;
    container.innerHTML = html;
    document.getElementById('pg-prev').addEventListener('click', ()=>{ if(_currentPage>1){ _currentPage--; renderPagedResults(); } });
    document.getElementById('pg-next').addEventListener('click', ()=>{ if(_currentPage<pages){ _currentPage++; renderPagedResults(); } });
    container.querySelectorAll('button[data-page]').forEach(b=> b.addEventListener('click', (e)=>{ _currentPage = parseInt(e.currentTarget.dataset.page,10); renderPagedResults(); }));
}

document.getElementById('page-size').addEventListener('change', ()=>{ _pageSize = parseInt(document.getElementById('page-size').value,10); _currentPage = 1; renderPagedResults(); });
document.getElementById('fetch-all').addEventListener('change', (e)=>{
    const disabled = e.currentTarget.checked;
    document.getElementById('page-size').disabled = disabled;
});

function esc(s){ return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }

function missingThumb(width=48,height=48,text='No Img'){ return 'data:image/svg+xml;utf8,'+encodeURIComponent('<svg xmlns="http://www.w3.org/2000/svg" width="'+width+'" height="'+height+'"><rect width="100%" height="100%" fill="#f8f8f8"/><text x="50%" y="50%" dominant-baseline="middle" text-anchor="middle" fill="#b0b0b0" font-size="10">'+text+'</text></svg>'); }

function renderResults(results){
    const container = document.getElementById('results');
    if(!results || results.length===0){ container.innerHTML = '<div class="small-muted">No results</div>'; return; }
    let html = '<table><thead><tr><th>Title</th><th>Barcode</th><th>Item ID</th><th>Location</th><th>Qty</th><th>DB</th><th>Actions</th></tr></thead><tbody>';
    results.forEach(r=>{
        const title = esc(r.title||r.raw && (r.raw.Title||r.raw.title) || '')
        const img = esc(r.image||'')
        const thumb = img ? img : (r.pictureposition?('/static/pictureposition/'+r.pictureposition):missingThumb())
        const barcode = esc(r.barcode||'')
        const itemid = esc(r.item_id||'')
        const qty = esc(r.quantity||'')
        const db = esc(r.source_db||'')
        let locDisplay = '';
        if(r.pictureposition) locDisplay = r.pictureposition;
        else if(r.item_position) locDisplay = r.item_position;
        let actionHtml = '';
        if(r.archived || db === 'archived'){
            // Archived row: show Restore and Delete Forever
            actionHtml = `<button class="btn btn-primary" onclick="onRestore(${r.id})">Restore</button> <button class="btn btn-danger" onclick="onDeleteArchive(${r.id})">Delete Forever</button>`;
        } else {
            actionHtml = `<button class="btn" onclick="onEdit('${db}',${r.id})">Edit</button> <button class="btn" onclick="onDelete('${db}',${r.id})">Delete</button>`;
        }
        html += `<tr data-src="${db}" data-id="${r.id}">`+
                `<td><div class="title-cell"><img class="thumb" src="${thumb}" onerror="this.src='${missingThumb(48,48,'No Img')}'"><a href="#" class="title-link" data-src="${db}" data-id="${r.id}" data-image="${img}" data-title="${esc(r.title)}">${title}</a></div></td>`+
                `<td>${barcode}</td>`+
                `<td>${itemid}</td>`+
                `<td>${ locDisplay ? `<a href="#" class=\"location-link\" data-src=\"${db}\" data-id=\"${r.id}\" data-barcode=\"${barcode}\" data-picture=\"${esc(r.pictureposition||'')}\">${esc(locDisplay)}</a>` : '' }</td>`+
                `<td>${qty}</td>`+
                `<td>${ (r.archived||db==='archived') ? ('Archive ('+esc(DB_LABELS[r.orig_source_db]||r.orig_source_db||'Unknown')+')') : esc(DB_LABELS[db] || db) }</td>`+
                `<td>${actionHtml}</td>`+
                `</tr>`;
    })
    html += '</tbody></table>';
    container.innerHTML = html;
    document.querySelectorAll('.title-link').forEach(el=> el.addEventListener('click', onViewTitle));
    document.querySelectorAll('.location-link').forEach(el=> el.addEventListener('click', onViewLocation));
    // double-click to open archive action when in archived list
    document.querySelectorAll('tbody tr').forEach(tr=>{
        tr.addEventListener('dblclick', async (e)=>{
            const src = tr.dataset.src;
            if(src === 'archived'){
                const aid = tr.dataset.id;
                // show modal with restore/delete
                const rec = _allResults.find(r=> String(r.id) === String(aid));
                let html = `<div><h3>Archived item</h3><div class=\"small-muted\">Deleted at: ${esc(rec.deleted_at||'')}</div>`+
                           `<div style=\"margin-top:8px;\">Title: ${esc(rec.title||'')}</div>`+
                           `<div style=\"margin-top:8px;\">Source: ${esc(rec.orig_source_db||'')}</div>`+
                           `<div style=\"margin-top:12px;display:flex;gap:8px;justify-content:flex-end\">`+
                           `<button class=\"btn btn-primary\" id=\"arch-restore\">Restore</button>`+
                           `<button class=\"btn btn-danger\" id=\"arch-delete\">Delete Forever</button>`+
                           `</div></div>`;
                showViewModal(html);
                document.getElementById('arch-restore').addEventListener('click', async ()=>{
                    const resp = await fetch('/api/undelete/'+aid, {method:'POST'});
                    const j = await resp.json();
                    if(j.success){ alert('Restored'); document.getElementById('viewModal').style.display='none'; doSearch(); } else alert('Restore failed: '+JSON.stringify(j));
                });
                document.getElementById('arch-delete').addEventListener('click', async ()=>{
                    if(!confirm('Permanently delete this archived row?')) return;
                    const resp = await fetch('/api/delete_archive/'+aid, {method:'POST'});
                    const j = await resp.json();
                    if(j.success){ alert('Permanently deleted'); document.getElementById('viewModal').style.display='none'; doSearch(); } else alert('Delete failed: '+JSON.stringify(j));
                });
            }
        });
    });
}

async function onViewTitle(e){
    e.preventDefault();
    const el = e.currentTarget;
    const src = el.dataset.src;
    const id = el.dataset.id;
    const tr = el.closest('tr');
    const image = el.dataset.image;
    const title = el.dataset.title;
    let html = `<div><h3>${esc(title)}</h3>`;
    if(image) html += `<img src="${image}" style="max-width:320px;border-radius:8px;display:block;margin:8px 0;" onerror="this.src='${missingThumb(320,180,'Image missing')}'">`;
    html += `<div class=\"small-muted\">DB: ${esc(src)}</div></div>`;
    showViewModal(html);
}

async function onViewLocation(e){
    e.preventDefault();
    const el = e.currentTarget;
    const db = el.dataset.src;
    const picture = el.dataset.picture;
    const barcode = el.dataset.barcode;
    if(picture){
        showViewModal(`<div><h4>Picture Position</h4><img src="/static/pictureposition/${picture}" style="max-width:640px;max-height:60vh;" onerror="this.src='${missingThumb(720,480,'Image missing')}'"></div>`);
        return;
    }
    try{
        const resp = await fetch('/api/lookup_location',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({barcode:barcode})});
        const j = await resp.json();
        if(j.found){
            if(j.pictureposition){
                showViewModal(`<div><h4>Picture Position</h4><img src="/static/pictureposition/${j.pictureposition}" style="max-width:640px;max-height:60vh;" onerror="this.src='${missingThumb(720,480,'Image missing')}'"></div>`);
            } else if(j.item_position){
                showViewModal(`<div><h4>Shelf Position</h4><img src="/static/shelves/${j.item_position.toLowerCase()}.png" style="max-width:640px;max-height:60vh;" onerror="this.src='${missingThumb(720,480,'Image missing')}'"></div>`);
            } else {
                showViewModal('<div class="small-muted">No location info available</div>');
            }
        } else {
            showViewModal('<div class="small-muted">No rack record found</div>');
        }
    }catch(err){ console.error(err); showViewModal('<div class="small-muted">Lookup failed</div>') }
}

function showViewModal(html){ document.getElementById('viewContent').innerHTML = html; const m=document.getElementById('viewModal'); m.style.display='flex'; }
document.getElementById('closeView').addEventListener('click', ()=>document.getElementById('viewModal').style.display='none');

function onEdit(db, id){
    const tr = document.querySelector(`tr[data-src="${db}"][data-id="${id}"]`);
    if(!tr) return alert('Row not in DOM');
    const title = tr.querySelector('.title-cell a')?.textContent || '';
    const barcode = tr.children[1].textContent;
    const itemid = tr.children[2].textContent;
    const qty = tr.children[4].textContent;
    const content = `<div class=\"form-row\"><label>Title</label><input id=\"edit_title\" value=\"${esc(title)}\"></div>`+
                  `<div class=\"form-row\"><label>Barcode</label><input id=\"edit_barcode\" value=\"${esc(barcode)}\"></div>`+
                  `<div class=\"form-row\"><label>Item ID</label><input id=\"edit_itemid\" value=\"${esc(itemid)}\"></div>`+
                  `<div class=\"form-row\"><label>Qty</label><input id=\"edit_qty\" value=\"${esc(qty)}\"></div>`+
                  `<div class=\"form-row\"><label>Notes</label><textarea id=\"edit_notes\"></textarea></div>`;
    document.getElementById('editContent').innerHTML = content;
    document.getElementById('editModal').style.display='flex';
    document.getElementById('saveEdit').onclick = async ()=>{
        const payload = { Title: document.getElementById('edit_title').value, BARCODE: document.getElementById('edit_barcode').value, ItemID: document.getElementById('edit_itemid').value, Quantity: document.getElementById('edit_qty').value };
        const resp = await fetch(`/api/update/${db}/${id}`, {method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify(payload)});
        const j = await resp.json();
        if(j.success || j.ok){ alert('Saved'); document.getElementById('editModal').style.display='none'; doSearch(); } else alert('Save failed: '+(j.error||JSON.stringify(j)));
    }
}

async function onDelete(db,id){
    if(!confirm('Delete this item (will be archived)?')) return;
    try{
        const resp = await fetch(`/api/delete/${db}/${id}`, {method:'POST'});
        const j = await resp.json();
        if(j.success) { alert('Deleted and archived'); doSearch(); } else alert('Delete failed: '+(j.error||JSON.stringify(j)));
    }catch(err){console.error(err); alert('Delete failed')}
}

async function onRestore(archive_id){
    if(!confirm('Restore this archived item to its original DB?')) return;
    try{
        const resp = await fetch('/api/undelete/'+archive_id, {method:'POST'});
        const j = await resp.json();
        if(j.success) { alert('Restored'); doSearch(); } else alert('Restore failed: '+(j.error||JSON.stringify(j)));
    }catch(err){console.error(err); alert('Restore failed')}
}

async function onDeleteArchive(archive_id){
    if(!confirm('Permanently delete this archived item? This cannot be undone.')) return;
    try{
        const resp = await fetch('/api/delete_archive/'+archive_id, {method:'POST'});
        const j = await resp.json();
        if(j.success) { alert('Permanently deleted'); doSearch(); } else alert('Delete failed: '+(j.error||JSON.stringify(j)));
    }catch(err){console.error(err); alert('Delete failed')}
}

// close edit modal
document.getElementById('closeEdit').addEventListener('click', ()=>document.getElementById('editModal').style.display='none');

// initial load: search default DBs
window.addEventListener('load', ()=>{ document.getElementById('search-input').focus(); doSearch(); });

// Refresh handler: call refresh API and poll status
document.getElementById('refresh-btn').addEventListener('click', async ()=>{
    if(!confirm('Run real-time refresh of searchRack? This will update searchRack.db by looking up UPCs in ebayStore.db and bol.db.')) return;
    document.getElementById('refresh-status').textContent = 'starting...';
    try{
        const resp = await fetch('/api/refresh_searchrack', {method:'POST'});
        const j = await resp.json();
        if(!j.success){
            alert('Failed to start refresh: '+(j.message||JSON.stringify(j)));
            document.getElementById('refresh-status').textContent='failed to start';
            return;
        }
        document.getElementById('refresh-status').textContent = 'running...';
        // poll status
        const poll = setInterval(async ()=>{
            try{
                const s = await (await fetch('/api/enrich_status')).json();
                if(s.running){
                    document.getElementById('refresh-status').textContent = 'running...';
                } else {
                    document.getElementById('refresh-status').textContent = s.message || 'idle';
                    clearInterval(poll);
                    alert('Refresh complete: '+(s.message||'done'));
                    doSearch();
                }
            }catch(innerErr){
                console.error('Status poll failed', innerErr);
            }
        }, 1500);
    }catch(err){
        console.error(err);
        alert('Refresh failed');
        document.getElementById('refresh-status').textContent='error';
    }
});
</script>
</body>
</html>
