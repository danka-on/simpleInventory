// Load location hierarchy from API
async function loadLocationHierarchy() {
    try {
        const resp = await fetch('/api/location_hierarchy');
        const data = await resp.json();
        
        if (data.success) {
            _locationData = data.locations;
            renderLocationBrowser();
        } else {
            console.error('Failed to load location hierarchy:', data.error);
        }
    } catch (err) {
        console.error('Error loading location hierarchy:', err);
    }
}

// Render location browser based on current selection
function renderLocationBrowser() {
    const cardsContainer = document.getElementById('location-cards');
    const selectorContainer = document.getElementById('shelf-selector-container');
    const breadcrumb = document.getElementById('location-breadcrumb');
    
    if (_selectedLocation === null) {
        // Show all locations (groups)
        cardsContainer.style.display = 'grid';
        selectorContainer.style.display = 'none';
        renderLocationGroups(cardsContainer);
        breadcrumb.innerHTML = '<span style="cursor:pointer; color:#0066cc;" id="breadcrumb-all">All Locations</span>';
    } else {
        // Show shelf selector for selected location
        cardsContainer.style.display = 'none';
        selectorContainer.style.display = 'block';
        renderShelfSelector(_selectedLocation);
        const location = _locationData.find(l => l.id === _selectedLocation);
        breadcrumb.innerHTML = `
            <span style="cursor:pointer; color:#0066cc;" id="breadcrumb-all">All Locations</span>
            <span class="breadcrumb-separator">›</span>
            <span style="color:#333; font-weight:600;">${esc(location.name)}</span>
        `;
    }
    
    // Attach breadcrumb click handler
    const breadcrumbAll = document.getElementById('breadcrumb-all');
    if (breadcrumbAll) {
        breadcrumbAll.addEventListener('click', () => {
            _selectedLocation = null;
            _selectedShelf = null;
            renderLocationBrowser();
            // Clear search input and refresh
            document.getElementById('search-input').value = '';
            doSearch(false);
        });
    }
}

// Render location groups (top-level)
function renderLocationGroups(container) {
    let html = '';
    
    // Calculate totals
    let totalShelves = 0;
    let totalItems = 0;
    let totalQuantity = 0;
    
    _locationData.forEach(location => {
        totalShelves += location.shelves.length;
        totalItems += location.total_items;
        totalQuantity += location.total_quantity;
    });
    
    // Add "Total" card first (leftmost)
    html += `
        <div class="location-card" style="background:#0066cc; border:2px solid #0052a3;">
            <div class="location-card-title" style="color:#fff;">📊 Total</div>
            <div class="location-card-count" style="color:#e0f0ff;">${totalShelves} shelf(s) • ${totalItems} item(s)</div>
            <div class="location-card-quantity" style="color:#fff;">${totalQuantity} qty</div>
        </div>
    `;
    
    _locationData.forEach(location => {
        const hasItems = location.total_items > 0;
        const cardClass = hasItems ? 'location-card' : 'location-card' ;
        
        html += `
            <div class="${cardClass}" data-location-id="${location.id}" onclick="selectLocation(${location.id})">
                <div class="location-card-title">${esc(location.name)}</div>
                <div class="location-card-count">${location.shelves.length} shelf(s) • ${location.total_items} item(s)</div>
                <div class="location-card-quantity">${location.total_quantity} qty</div>
            </div>
        `;
    });
    
    if (html === '') {
        html = '<div style="padding:20px;text-align:center;color:#999;">No locations found. <a href="/shelfmanager">Create shelves</a> to get started.</div>';
    }
    
    container.innerHTML = html;
}

// Render shelf selector dropdown for a location
function renderShelfSelector(locationId) {
    const location = _locationData.find(l => l.id === locationId);
    if (!location) {
        return;
    }
    
    const selector = document.getElementById('shelf-selector');
    const preview = document.getElementById('shelf-image-preview');
    
    // Sort shelves by quantity descending
    const sortedShelves = [...location.shelves].sort((a, b) => b.quantity - a.quantity);
    
    // Populate dropdown
    let html = '<option value="">-- Select a shelf --</option>';
    sortedShelves.forEach(shelf => {
        const selected = _selectedShelf === shelf.code ? 'selected' : '';
        html += `<option value="${esc(shelf.code)}" ${selected}>${esc(shelf.code)} (${shelf.quantity} items)</option>`;
    });
    selector.innerHTML = html;
    
    // Update preview if shelf is already selected
    if (_selectedShelf) {
        updateShelfPreview(_selectedShelf);
    } else {
        preview.innerHTML = '<span style="color:#999;">Select a shelf to view image</span>';
    }
    
    // Attach change handler
    selector.onchange = (e) => {
        const shelfCode = e.target.value;
        if (shelfCode) {
            selectShelf(shelfCode);
        } else {
            _selectedShelf = null;
            preview.innerHTML = '<span style="color:#999;">Select a shelf to view image</span>';
        }
    };
}

// Update shelf image preview
function browsePreviewMapKey(shelfCode) {
    const compact = String(shelfCode || '').trim().replace(/\s+/g, '').toLowerCase();
    const baseCode = compact.replace(/b\d+$/i, '');
    if (!baseCode) return '';
    if (/^ofloor\d+$/i.test(baseCode)) return baseCode;
    const match = baseCode.match(/^(.*)s\d+$/i);
    return match ? match[1] : baseCode;
}

function browsePreviewMapUrl(shelfCode) {
    const key = browsePreviewMapKey(shelfCode);
    if (!key) return '';
    if (/^(or|omr|ofloor)/i.test(key)) {
        return `/static/shelves/office/maps/officemap_${encodeURIComponent(key)}.png`;
    }
    if (/^(gr|gmid|gfloor|misc)/i.test(key)) {
        return `/static/shelves/garage/maps/garagemap_${encodeURIComponent(key)}.png`;
    }
    return '';
}

function browsePreviewLegacyMapUrl(shelfCode) {
    const key = browsePreviewMapKey(shelfCode);
    if (!key) return '';
    if (/^(or|omr|ofloor)/i.test(key)) {
        return `/static/shelves/maps/office/officemap_${encodeURIComponent(key)}.png`;
    }
    if (/^(gr|gmid|gfloor|misc)/i.test(key)) {
        return `/static/shelves/maps/garage/garagemap_${encodeURIComponent(key)}.png`;
    }
    return '';
}

function updateShelfPreview(shelfCode) {
    const preview = document.getElementById('shelf-image-preview');
    const normalizedCode = String(shelfCode || '').trim();
    const lowerCode = normalizedCode.toLowerCase();
    const upperCode = normalizedCode.toUpperCase();
    const mapStem = browsePreviewMapKey(normalizedCode);
    const isGarageShelf = /^(gr|gmid|gfloor|misc)/i.test(mapStem);
    const isOfficeShelf = /^(or|omr|ofloor)/i.test(mapStem);
    const shelfBaseUrl = isGarageShelf ? `/shelf-base/${encodeURIComponent(lowerCode)}.png` : '';
    const shelfBaseUpperUrl = isGarageShelf ? `/shelf-base/${encodeURIComponent(upperCode)}.png` : '';
    const shelfBaseLegacyUrl = '';
    const shelfBaseUpperLegacyUrl = '';
    const shelfOfficeBaseUrl = isOfficeShelf ? `/shelf-base/${encodeURIComponent(lowerCode)}.png` : '';
    const shelfOfficeBaseUpperUrl = isOfficeShelf ? `/shelf-base/${encodeURIComponent(upperCode)}.png` : '';
    const shelfOfficeBaseLegacyUrl = '';
    const shelfOfficeBaseUpperLegacyUrl = '';
    const shelfDisplayUrl = `/shelf-image/${encodeURIComponent(lowerCode)}.png`;
    const shelfDisplayUpperUrl = `/shelf-image/${encodeURIComponent(upperCode)}.png`;
    const shelfOriginalUrl = `/shelf-original/${encodeURIComponent(lowerCode)}.png`;
    const shelfOriginalUpperUrl = `/shelf-original/${encodeURIComponent(upperCode)}.png`;
    // Bin-stripped fallbacks (e.g. gr1s1b2 → gr1s1) for photos named without bin suffix
    const nobinCode = lowerCode.replace(/b\d+$/i, '');
    const nobinUpperCode = upperCode.replace(/b\d+$/i, '');
    const hasBin = nobinCode !== lowerCode;
    const shelfDisplayNobinUrl = hasBin ? `/shelf-image/${encodeURIComponent(nobinCode)}.png` : '';
    const shelfDisplayNobinUpperUrl = hasBin ? `/shelf-image/${encodeURIComponent(nobinUpperCode)}.png` : '';
    const shelfOriginalNobinUrl = hasBin ? `/shelf-original/${encodeURIComponent(nobinCode)}.png` : '';
    const shelfOriginalNobinUpperUrl = hasBin ? `/shelf-original/${encodeURIComponent(nobinUpperCode)}.png` : '';
    const shelfBaseNobinUrl = (isGarageShelf && hasBin) ? `/shelf-base/${encodeURIComponent(nobinCode)}.png` : '';
    const shelfBaseNobinUpperUrl = (isGarageShelf && hasBin) ? `/shelf-base/${encodeURIComponent(nobinUpperCode)}.png` : '';
    const shelfOfficeBaseNobinUrl = (isOfficeShelf && hasBin) ? `/shelf-base/${encodeURIComponent(nobinCode)}.png` : '';
    const shelfOfficeBaseNobinUpperUrl = (isOfficeShelf && hasBin) ? `/shelf-base/${encodeURIComponent(nobinUpperCode)}.png` : '';
    const mapKey = mapStem;
    const mapUrlChoices = [browsePreviewMapUrl(normalizedCode), browsePreviewLegacyMapUrl(normalizedCode)]
        .filter((value, index, list) => value && list.indexOf(value) === index);
    const mapUrl = mapUrlChoices[0] || '';
    const primaryShelfCandidates = isOfficeShelf
        ? [shelfOfficeBaseUrl, shelfOfficeBaseUpperUrl, shelfOfficeBaseLegacyUrl, shelfOfficeBaseUpperLegacyUrl, shelfOfficeBaseNobinUrl, shelfOfficeBaseNobinUpperUrl, shelfDisplayUrl, shelfDisplayUpperUrl, shelfDisplayNobinUrl, shelfDisplayNobinUpperUrl, shelfOriginalUrl, shelfOriginalUpperUrl, shelfOriginalNobinUrl, shelfOriginalNobinUpperUrl]
        : isGarageShelf
            ? [shelfBaseUrl, shelfBaseUpperUrl, shelfBaseLegacyUrl, shelfBaseUpperLegacyUrl, shelfBaseNobinUrl, shelfBaseNobinUpperUrl, shelfDisplayUrl, shelfDisplayUpperUrl, shelfDisplayNobinUrl, shelfDisplayNobinUpperUrl, shelfOriginalUrl, shelfOriginalUpperUrl, shelfOriginalNobinUrl, shelfOriginalNobinUpperUrl]
            : [shelfDisplayUrl, shelfDisplayUpperUrl, shelfDisplayNobinUrl, shelfDisplayNobinUpperUrl, shelfOriginalUrl, shelfOriginalUpperUrl, shelfOriginalNobinUrl, shelfOriginalNobinUpperUrl];
    const shelfUrlChoices = primaryShelfCandidates.filter((value, index, list) => value && list.indexOf(value) === index);
    const primaryShelfUrl = shelfUrlChoices[0] || '';

    if (!normalizedCode) {
        preview.innerHTML = '<span style="color:#999;">Select a shelf to view image</span>';
        return;
    }

    const cards = [
        `
        <button type="button" class="browse-preview-card" data-preview-index="0" style="border:1px solid #dbe3ef;border-radius:10px;background:#fff;padding:10px;cursor:zoom-in;text-align:left;display:flex;flex-direction:column;gap:8px;">
            <div style="font-size:0.78rem;font-weight:700;letter-spacing:0.04em;text-transform:uppercase;color:#64748b;">Shelf Photo</div>
            <div style="min-height:220px;display:flex;align-items:center;justify-content:center;border:1px solid #e5e7eb;border-radius:8px;background:#fff;overflow:hidden;">
                <img data-role="browse-shelf-image" src="${primaryShelfUrl}" alt="${esc(normalizedCode)}" style="display:block;max-width:100%;max-height:320px;object-fit:contain;">
            </div>
        </button>
        `
    ];

    if (mapUrl) {
        cards.push(`
        <button type="button" class="browse-preview-card" data-preview-index="1" data-preview-map="1" style="border:1px solid #dbe3ef;border-radius:10px;background:#fff;padding:10px;cursor:zoom-in;text-align:left;display:flex;flex-direction:column;gap:8px;">
            <div style="font-size:0.78rem;font-weight:700;letter-spacing:0.04em;text-transform:uppercase;color:#64748b;">Position Map</div>
            <div style="min-height:220px;display:flex;align-items:center;justify-content:center;border:1px solid #e5e7eb;border-radius:8px;background:#fff;overflow:hidden;">
                <img data-role="browse-map-image" src="${mapUrl}" alt="${esc(mapKey)} map" style="display:block;max-width:100%;max-height:320px;object-fit:contain;">
            </div>
        </button>
        `);
    }

    preview.innerHTML = `
        <div class="browse-preview-grid" style="display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:12px;width:100%;align-items:start;">
            ${cards.join('')}
        </div>
        <div style="margin-top:10px;font-size:0.82rem;color:#64748b;">Click either image to expand.</div>
    `;

    const shelfImg = preview.querySelector('[data-role="browse-shelf-image"]');
    if (shelfImg) {
        const fallbacks = shelfUrlChoices.slice(1);
        shelfImg.addEventListener('error', function handleShelfError() {
            const nextIndex = parseInt(this.dataset.fallbackIndex || '0', 10);
            if (nextIndex < fallbacks.length) {
                this.dataset.fallbackIndex = String(nextIndex + 1);
                this.src = fallbacks[nextIndex];
                return;
            }
            const card = this.closest('.browse-preview-card');
            if (card) {
                card.innerHTML = `<div style="padding:18px 10px;text-align:center;color:#999;">No image available for ${esc(normalizedCode)}</div>`;
            }
        });
    }

    const mapImg = preview.querySelector('[data-role="browse-map-image"]');
    if (mapImg) {
        const mapFallbacks = mapUrlChoices.slice(1);
        mapImg.addEventListener('error', function handleMapError() {
            const nextIndex = parseInt(this.dataset.fallbackIndex || '0', 10);
            if (nextIndex < mapFallbacks.length) {
                this.dataset.fallbackIndex = String(nextIndex + 1);
                this.src = mapFallbacks[nextIndex];
                return;
            }
            const card = this.closest('[data-preview-map]');
            if (card) card.remove();
            const grid = preview.querySelector('.browse-preview-grid');
            if (grid && grid.children.length <= 1) {
                grid.style.gridTemplateColumns = 'minmax(0, 1fr)';
            }
        });
    }

    preview.querySelectorAll('.browse-preview-card').forEach((card) => {
        card.addEventListener('click', () => {
            if (!window.SSLocationPreview) return;
            const index = parseInt(card.getAttribute('data-preview-index'), 10);
            window.SSLocationPreview.openForLocation(normalizedCode, '', `Location: ${normalizedCode}`, index);
        });
    });
}

// Select a location (group) and search all items in that group
function selectLocation(locationId) {
    _selectedLocation = locationId;
    _selectedShelf = null;
    renderLocationBrowser();
    
    // Set the location filter and trigger search
    _locationGroupFilter = locationId;
    
    // Clear the search input since we're filtering by location group
    document.getElementById('search-input').value = '';
    
    // Trigger search with location group filter
    doSearch(false);
}

// Select a shelf and filter results
function selectShelf(shelfCode) {
    _selectedShelf = shelfCode;
    updateShelfPreview(shelfCode);
    
    // Clear location group filter and search for specific shelf
    _locationGroupFilter = null;
    
    // Update search input with shelf code and trigger search
    const searchInput = document.getElementById('search-input');
    searchInput.value = shelfCode;
    doSearch(false);
}

// Show/hide location browser when Inventory database is selected
function toggleLocationBrowser(show) {
    const browser = document.getElementById('location-browser');
    const showBtn = document.getElementById('show-location-browser-btn');
    if (show) {
        browser.style.display = 'block';
        if (showBtn) showBtn.style.display = 'none';
        loadLocationHierarchy();
    } else {
        browser.style.display = 'none';
        // Show the "Browse Locations" button when browser is hidden (only for Inventory db)
        const dbSelect = document.getElementById('db-select');
        if (showBtn && dbSelect && dbSelect.value === 'searchRack') {
            showBtn.style.display = 'inline-block';
        }
        _selectedLocation = null;
        _selectedShelf = null;
    }
}

// ALL SEARCH functionality (now in global top banner)
function bindAllSearch(){
    const btn = document.getElementById('all-search-btn');
    const input = document.getElementById('all-search-input');
    if (!btn || !input) return false;
    const go = () => {
        const query = input.value.trim();
        if (query) {
            window.location.href = `/unified-search?q=${encodeURIComponent(query)}`;
        }
    };
    btn.addEventListener('click', go);
    input.addEventListener('keypress', (e) => { if(e.key === 'Enter') go(); });
    return true;
}
function initAllSearch(){
    if (bindAllSearch()) return;
    setTimeout(bindAllSearch, 200);
}
if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', initAllSearch);
} else {
    initAllSearch();
}

// Header Cache Clear Button (optional element)
const headerClearBtn = document.getElementById('header-clear-cache-btn');
if (headerClearBtn) {
    headerClearBtn.addEventListener('click', async () => {
        if(!confirm('Clear cache and reload databases?')) return;
        
        const btn = headerClearBtn;
        const originalText = btn.innerHTML;
        btn.innerHTML = '...';
        btn.disabled = true;
        
        try {
            const r = await fetch('/api/admin/cache/clear', {method: 'POST'});
            const j = await r.json();
            if(j.success) {
                alert('Cache cleared!');
                window.location.reload();
            } else {
                alert('Failed: ' + (j.error || 'Unknown'));
            }
        } catch(e) {
            alert('Error: ' + e.message);
        } finally {
            btn.innerHTML = originalText;
            btn.disabled = false;
        }
    });
}

// Reset Cache button in gear dropdown
document.getElementById('reset-cache-btn').addEventListener('click', async () => {
    // Close dropdown first
    document.getElementById('inventory-dropdown').classList.remove('active');

    if(!confirm('Clear cache and reload databases?')) return;

    try {
        const r = await fetch('/api/admin/cache/clear', {method: 'POST'});
        const j = await r.json();
        if(j.success) {
            alert('Cache cleared!');
            window.location.reload();
        } else {
            alert('Failed: ' + (j.error || 'Unknown'));
        }
    } catch(e) {
        alert('Error: ' + e.message);
    }
});

// Show COMPLETE-REMOVED history popup
async function showCompleteHistory(orderId) {
    try {
        const resp = await fetch(`/api/sold/removal-history/${orderId}`);
        const data = await resp.json();

        if (!data.success) {
            alert('Error: ' + (data.error || 'Unknown'));
            return;
        }

        const order = data.order || {};
        const history = data.history || [];

        let historyHtml = '';
        if (history.length === 0) {
            historyHtml = '<div style="color:#7f8c8d;text-align:center;padding:20px;">No removal history found</div>';
        } else {
            historyHtml = '<div style="max-height:300px;overflow-y:auto;">';
            history.forEach(h => {
                const removedAt = h.removed_at ? new Date(h.removed_at).toLocaleString() : 'Unknown';
                const typeLabel = {
                    'automatic': 'Auto Removal',
                    'automatic_allocated': 'Auto Removal (Allocated)',
                    'manual': 'Manual Delete',
                    'manual_immediate': 'Immediate Removal',
                    'manual_handled': 'Ready to Ship Confirmation',
                    'manual_sold_removal': 'Manual Sold Removal',
                    'manual_sold_selection': 'Manual Selection',
                    'finder_removal': 'Finder Removal',
                    'manual_edit': 'Manual Edit'
                }[h.removal_type] || h.removal_type || 'Unknown';

                historyHtml += `
                    <div style="background:#f8f9fa;padding:12px;border-radius:8px;margin-bottom:8px;">
                        <div style="font-weight:600;color:#27ae60;margin-bottom:4px;">${typeLabel}</div>
                        <div style="font-size:0.9rem;color:#555;">
                            <div><strong>When:</strong> ${removedAt}</div>
                            <div><strong>Location:</strong> ${h.item_position || 'N/A'}</div>
                            <div><strong>Qty Removed:</strong> ${h.quantity_removed || 0}</div>
                            <div><strong>Old Qty:</strong> ${h.old_quantity || 0} → <strong>New Qty:</strong> ${h.new_quantity || 0}</div>
                        </div>
                    </div>`;
            });
            historyHtml += '</div>';
        }

        const html = `
            <div style="padding:10px;">
                <h3 style="color:#27ae60;margin-bottom:15px;">✅ COMPLETE - Inventory Removed</h3>
                <div style="background:#d4edda;padding:12px;border-radius:8px;margin-bottom:15px;">
                    <div><strong>Order ID:</strong> ${order.order_id || 'N/A'}</div>
                    <div><strong>Title:</strong> ${esc(order.title || 'N/A')}</div>
                    <div><strong>Barcode:</strong> ${order.barcode ? formatUpcDisplay(order.barcode) : 'N/A'}</div>
                </div>
                <h4 style="margin-bottom:10px;">Removal History</h4>
                ${historyHtml}
                <button onclick="document.getElementById('viewModal').style.display='none'"
                        style="margin-top:15px;padding:10px 20px;background:#27ae60;color:white;border:none;border-radius:6px;cursor:pointer;font-weight:600;">
                    Close
                </button>
            </div>`;

        showViewModal(html);
    } catch (e) {
        alert('Error loading history: ' + e.message);
    }
}

// Show PENDING-REMOVAL popup with timer and remove now button
async function showPendingRemoval(orderId, remainingMins) {
    try {
        const resp = await fetch(`/api/sold/removal-history/${orderId}`);
        const data = await resp.json();

        if (!data.success) {
            alert('Error: ' + (data.error || 'Unknown'));
            return;
        }

        const order = data.order || {};
        const hrs = Math.floor(remainingMins / 60);
        const mins = remainingMins % 60;
        const timeStr = hrs > 0 ? `${hrs} hours ${mins} minutes` : `${mins} minutes`;

        const html = `
            <div style="padding:10px;">
                <h3 style="color:#f39c12;margin-bottom:15px;">⏳ PENDING - Confirm In Ready to Ship</h3>
                <div style="background:#fff3cd;padding:12px;border-radius:8px;margin-bottom:15px;">
                    <div><strong>Order ID:</strong> ${order.order_id || 'N/A'}</div>
                    <div><strong>Title:</strong> ${esc(order.title || 'N/A')}</div>
                    <div><strong>Barcode:</strong> ${order.barcode ? formatUpcDisplay(order.barcode) : 'N/A'}</div>
                    <div><strong>Shipped:</strong> ${order.shipped_time ? new Date(order.shipped_time).toLocaleString() : 'N/A'}</div>
                </div>
                <div style="background:#ffeaa7;padding:15px;border-radius:8px;text-align:center;margin-bottom:15px;">
                    <div style="font-size:1.2rem;font-weight:700;color:#d35400;">⏱️ ${timeStr} remaining</div>
                    <div style="font-size:0.9rem;color:#7f8c8d;margin-top:4px;">automatic removal is disabled; confirm from Ready to Ship instead</div>
                </div>
                <div style="display:flex;gap:10px;justify-content:center;">

// Show NOT REMOVED popup with finder-like UPC matching
async function showNotRemoved(orderId) {
    try {
        const resp = await fetch(`/api/sold/find-inventory/${orderId}`);
        const data = await resp.json();

        if (!data.success) {
            alert('Error: ' + (data.error || 'Unknown'));
            return;
        }

        const order = data.order || {};
        const matches = data.matches || [];
        const finderHref = `/finder?order_id=${orderId}&title=${encodeURIComponent(order.title || '')}&barcode=${encodeURIComponent(order.barcode || '')}&image=${encodeURIComponent(order.image || '')}`;

        let matchesHtml = '';
        if (matches.length === 0) {
            matchesHtml = `
                <div style="background:#fee;padding:15px;border-radius:8px;text-align:center;">
                    <div style="font-size:1.1rem;color:#e74c3c;font-weight:600;margin-bottom:8px;">No matching inventory found</div>
                    <div style="font-size:0.9rem;color:#7f8c8d;margin-bottom:12px;">Use Item Finder to match the order, then return to Ready to Ship to confirm removal.</div>
                    <a href="${finderHref}"
                       style="display:inline-block;padding:10px 20px;background:#6c5ce7;color:white;text-decoration:none;border-radius:6px;font-weight:600;">
                        Open Item Finder
                    </a>
                </div>`;
        } else {
            matchesHtml = '<div style="max-height:300px;overflow-y:auto;">';
            matches.forEach(m => {
                const loc = m.item_position || m.pictureposition || m.location_code || 'No Location';
                const locLower = String(m.item_position || m.pictureposition || m.location_code || '').toLowerCase();
                matchesHtml += `
                    <div style="background:#f8f9fa;padding:12px;border-radius:8px;margin-bottom:8px;display:flex;align-items:center;gap:12px;">
                        <img src="${m.image || ''}" onerror="this.src='data:image/svg+xml;utf8,<svg xmlns=%22http://www.w3.org/2000/svg%22 width=%2250%22 height=%2250%22><rect fill=%22%23f0f0f0%22 width=%22100%25%22 height=%22100%25%22/></svg>'"
                             style="width:50px;height:50px;object-fit:cover;border-radius:6px;">
                        <div style="flex:1;">
                            <div style="font-weight:600;font-size:0.9rem;">${esc(m.title || 'Unknown')}</div>
                            <div style="font-size:0.85rem;color:#7f8c8d;">
                                <span style="background:#6c5ce7;color:white;padding:2px 8px;border-radius:4px;cursor:pointer;"
                                      onclick="showLocPopupFromInvStatus('${loc}', '${locLower}')">${loc}</span>
                                <span style="margin-left:8px;">Qty: ${m.quantity || 0}</span>
                            </div>
                        </div>
                    </div>`;
            });
            matchesHtml += '</div>';
        }

        const html = `
            <div style="padding:10px;">
                <h3 style="color:#e74c3c;margin-bottom:15px;">❌ NOT REMOVED - Confirm In Ready to Ship</h3>
                <div style="background:#fee;padding:12px;border-radius:8px;margin-bottom:15px;">
                    <div><strong>Order ID:</strong> ${order.order_id || 'N/A'}</div>
                    <div><strong>Title:</strong> ${esc(order.title || 'N/A')}</div>
                    <div><strong>Barcode:</strong> ${order.barcode ? formatUpcDisplay(order.barcode) : 'N/A'}</div>
                    <div><strong>Qty Sold:</strong> ${order.quantity || 1}</div>
                </div>
                <div style="background:#fff7ed;padding:12px;border-radius:8px;margin-bottom:15px;color:#9a3412;">
                    Sold-order inventory removal now only happens from the Ready to Ship confirmation flow.
                </div>
                <h4 style="margin-bottom:10px;">Matching Inventory Items</h4>
                ${matchesHtml}
                <div style="display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-top:15px;">
                    <a href="/ready_to_ship" style="padding:10px 20px;background:#2563eb;color:white;text-decoration:none;border-radius:6px;font-weight:600;">
                        Open Ready to Ship
                    </a>
                    <a href="${finderHref}" style="padding:10px 20px;background:#6c5ce7;color:white;text-decoration:none;border-radius:6px;font-weight:600;">
                        Open Item Finder
                    </a>
                    <button onclick="document.getElementById('viewModal').style.display='none'"
                            style="padding:10px 20px;background:#95a5a6;color:white;border:none;border-radius:6px;cursor:pointer;font-weight:600;">
                        Close
                    </button>
                </div>
            </div>`;

        showViewModal(html);
    } catch (e) {
        alert('Error: ' + e.message);
    }
}

// Helper to show location popup from inv status modal
function showLocPopupFromInvStatus(locCode, locLower) {
    if (window.SSLocationPreview) {
        window.SSLocationPreview.openForLocation(locCode || locLower, '', `Location: ${String(locCode || locLower || '').toUpperCase()}`);
        return;
    }
    // Try to show shelf image
    const filename = locLower ? locLower.replace(/\.png$/i, '') + '.png' : '';
    if (filename) {
        const html = `
            <div style="text-align:center;padding:10px;">
                <h4 style="margin-bottom:10px;">${locCode}</h4>
                <img src="/shelf-image/${encodeURIComponent(filename.replace(/\.png$/i, ''))}.png?t=${Date.now()}"
                     style="max-width:100%;max-height:60vh;border-radius:10px;"
                     onerror="this.src='data:image/svg+xml;utf8,<svg xmlns=%22http://www.w3.org/2000/svg%22 width=%22400%22 height=%22300%22><rect fill=%22%23f0f0f0%22 width=%22100%25%22 height=%22100%25%22/><text x=%2250%25%22 y=%2250%25%22 text-anchor=%22middle%22 fill=%22%237f8c8d%22>No Image</text></svg>'">
                <br>
                <button onclick="document.getElementById('viewModal').innerHTML='';showNotRemoved(window._lastNotRemovedOrderId)"
                        style="margin-top:15px;padding:10px 20px;background:#e74c3c;color:white;border:none;border-radius:6px;cursor:pointer;font-weight:600;">
                    Back
                </button>
            </div>`;
        showViewModal(html);
    }
}
